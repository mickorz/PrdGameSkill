<!doctype html>
<html lang="zh-CN">
<!--
  Interactive Game PRD 渲染模板（P3）
  由 scripts/build-html.mjs 构建：数据以 APP_DATA 常量内嵌注入（见下方脚本首行）。
  离线单文件，无外链资源，file:// 可运行。
  定位与高亮实现改写自 prd-html-generator (Apache-2.0) 的 focusPrdTarget 思路。
-->
<head>
<meta charset="utf-8">
<title>Interactive Game PRD</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Microsoft YaHei", sans-serif; display: flex; height: 100vh; font-size: 14px; }
  nav { width: 250px; border-right: 1px solid #ddd; overflow: auto; padding: 10px 8px; flex-shrink: 0; }
  nav h4 { margin: 12px 4px 4px; color: #667; font-size: 12px; }
  nav .req { display: block; padding: 5px 8px; margin: 2px 0; border-radius: 4px; cursor: pointer; }
  nav .req:hover { background: #f0f4ff; }
  nav .req.active { background: #dbe6ff; }
  .badge { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; margin-left: 5px; vertical-align: middle; }
  .st-proposed { background: #fff3cd; color: #856404; }
  .st-approved { background: #d4edda; color: #155724; }
  .st-rejected { background: #f8d7da; color: #721c24; }
  .st-deprecated { background: #e2e3e5; color: #6c757d; }
  .au-fixed { border: 1px solid #888; color: #555; }
  .au-delegated { border: 1px dashed #1a73e8; color: #1a73e8; }
  .au-open { background: #eee; color: #777; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { padding: 10px 16px; border-bottom: 1px solid #eee; }
  header h1 { margin: 0; font-size: 18px; }
  header .meta { color: #889; font-size: 12px; margin-top: 4px; }
  .tabs { display: flex; gap: 4px; padding: 8px 16px 0; border-bottom: 2px solid #eee; }
  .tabs button { border: none; background: none; padding: 8px 16px; cursor: pointer; font-size: 14px;
                 border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .tabs button.active { border-bottom-color: #1a73e8; color: #1a73e8; font-weight: 600; }
  #view { flex: 1; overflow: auto; padding: 16px 20px; }
  .req-card { border: 1px solid #e3e6ea; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; scroll-margin: 20px; }
  .req-card:hover { border-color: #9db4e8; }
  .req-card.highlight { outline: 3px solid #e8a33d; animation: breathe 1.6s ease-in-out 2; }
  @keyframes breathe { 50% { outline-offset: 5px; } }
  .req-card h3 { margin: 0 0 6px; font-size: 14px; }
  .req-card ul { margin: 6px 0 0; padding-left: 18px; color: #445; }
  .quote { border-left: 3px solid #ccd; margin: 6px 0; padding: 2px 8px; color: #667; font-size: 13px; background: #f8f9fb; }
  .btn-ui { float: right; font-size: 12px; border: 1px solid #9db4e8; background: #f4f8ff; color: #1a73e8;
            border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  .board-area { min-height: 300px; border: 1px dashed #ccd; border-radius: 8px; padding: 16px; margin-top: 10px; }
  .board { display: grid; grid-template-columns: repeat(4, 84px); gap: 10px; }
  .card-el { width: 84px; height: 112px; border: 1px solid #bbb; border-radius: 8px; display: flex;
             align-items: center; justify-content: center; font-size: 30px; cursor: pointer; background: #3a6ea5;
             color: transparent; user-select: none; transition: background .2s, color .2s; }
  .card-el.face-up { background: #fff; color: #222; }
  .card-el.matched { background: #d4edda; color: #155724; }
  .comp-generic { border: 1px solid #9db4e8; background: #f4f8ff; border-radius: 6px; padding: 8px 14px;
                  margin: 6px 0; display: inline-block; cursor: pointer; font-size: 13px; }
  .target-highlight { outline: 3px solid #e8a33d; outline-offset: 2px; animation: breathe 1.6s ease-in-out 2; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  th, td { border: 1px solid #dde; padding: 6px 10px; text-align: left; font-size: 13px; }
  th { background: #f4f6f9; }
  aside { width: 330px; border-left: 1px solid #ddd; overflow: auto; padding: 12px 14px; flex-shrink: 0; font-size: 13px; }
  aside h3 { margin: 0 0 8px; }
  aside .field { margin-bottom: 6px; }
  aside .k { color: #889; margin-right: 6px; }
  #log { margin-top: 12px; border-top: 1px solid #eee; padding-top: 8px; max-height: 180px; overflow: auto;
         font-size: 12px; color: #556; font-family: Consolas, monospace; }
  .warn-open { background: #fff3cd; border: 1px solid #ffe08a; border-radius: 4px; padding: 4px 8px; margin: 8px 0; font-size: 12px; }
  .dec-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .btn-dec { border: 1px solid #9db4e8; background: #f4f8ff; color: #1a73e8; border-radius: 4px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  .btn-dec.primary { background: #1a73e8; color: #fff; }
  .dec-note { background: #f8f9fb; border: 1px solid #e3e6ea; border-radius: 6px; padding: 6px 10px; margin: 8px 0; color: #556; font-size: 12px; }
  .dec-layout { display: flex; gap: 12px; margin-top: 10px; align-items: flex-start; }
  .dec-list { width: 340px; max-height: 70vh; overflow: auto; border: 1px solid #e3e6ea; border-radius: 8px; padding: 6px; flex-shrink: 0; }
  .dec-item { display: block; padding: 6px 8px; margin: 2px 0; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .dec-item:hover { background: #f0f4ff; }
  .dec-item.active { background: #dbe6ff; }
  .dec-detail { flex: 1; min-width: 0; }
  .dec-form label { display: block; margin: 8px 0; font-size: 13px; }
  .dec-form select, .dec-form textarea { width: 100%; margin-top: 4px; font-size: 13px; padding: 4px 6px; box-sizing: border-box; }
  .dv-open { background: #fff3cd; color: #856404; }
  .dv-draft { background: #e2e3e5; color: #495057; }
  .dv-approved { background: #d4edda; color: #155724; }
  .dv-rejected { background: #f8d7da; color: #721c24; }
  .dv-deferred { background: #e2e3e5; color: #6c757d; }
  .sv-high { background: #f8d7da; color: #721c24; }
  .sv-medium { background: #fff3cd; color: #856404; }
  .sv-low { background: #eee; color: #777; }
</style>
</head>
<body>
<nav id="nav"></nav>
<main>
  <header>
    <h1 id="game-title"></h1>
    <div class="meta" id="game-meta"></div>
  </header>
  <div class="tabs" id="tabs">
    <button data-tab="prd" class="active">PRD</button>
    <button data-tab="ui">UI Demo</button>
    <button data-tab="flow">Flow</button>
    <button data-tab="tests">Tests</button>
    <button data-tab="decision">裁决</button>
  </div>
  <div id="view"></div>
</main>
<aside>
  <h3>需求详情</h3>
  <div id="detail"><span style="color:#99a">点击左侧或 PRD 条目查看详情</span></div>
  <div id="log" style="display:none"><b>模拟器判定日志</b><div id="log-body"></div></div>
</aside>

<script>
const APP_DATA = /*__APP_DATA_JSON__*/null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- 数据索引 ----------
const reqById = new Map();
for (const r of APP_DATA.requirements) reqById.set(r.id, r);
for (const c of APP_DATA.configs) reqById.set(c.id, c);
for (const s of APP_DATA.states) reqById.set(s.id, s);
const compById = new Map(); for (const c of APP_DATA.ui.components) compById.set(c.id, c);
const pageById = new Map(); for (const p of APP_DATA.ui.pages) pageById.set(p.id, p);
const caseById = new Map(); for (const t of APP_DATA.tests.cases) caseById.set(t.id, t);

const GROUPS = [
  ["功能需求", (r) => r.type === "game_feature"],
  ["游戏规则", (r) => r.type === "game_rule"],
  ["状态机", (r) => r.type === "state"],
  ["数值配置", (r) => r.type === "config"],
];

// ---------- 徽标 ----------
function badges(r) {
  return `<span class="badge st-${r.status}">${r.status}</span><span class="badge au-${r.authority}">${r.authority}</span>`;
}

// ---------- 左侧导航 ----------
function renderNav() {
  const nav = $("#nav");
  let html = `<h4>游戏概述</h4><a class="req" data-nav="overview">概述与核心循环</a>`;
  for (const [label, filter] of GROUPS) {
    const items = [...reqById.values()].filter(filter);
    html += `<h4>${esc(label)}</h4>`;
    for (const r of items) {
      html += `<a class="req" data-req="${r.id}">${esc(r.id)} ${esc(r.name)}${badges(r)}</a>`;
    }
  }
  html += `<h4>UI 页面</h4>`;
  for (const p of APP_DATA.ui.pages) html += `<a class="req" data-nav="ui:${p.id}">${esc(p.id)} ${esc(p.name)}</a>`;
  html += `<h4>测试用例</h4><a class="req" data-nav="tests">全部用例（${APP_DATA.tests.cases.length}）</a>`;
  const oq = APP_DATA.reviews.openQuestions || [];
  html += `<h4>未决问题</h4><a class="req" data-nav="openq">${oq.length ? `未决问题（${oq.length}）` : "无未决问题"}</a>`;
  nav.innerHTML = html;
  nav.addEventListener("click", (e) => {
    const a = e.target.closest("a");
    if (!a) return;
    nav.querySelectorAll("a").forEach((n) => n.classList.remove("active"));
    a.classList.add("active");
    if (a.dataset.req) showRequirement(a.dataset.req);
    else if (a.dataset.nav === "overview") switchTab("prd", () => scrollReq("__overview__"));
    else if (a.dataset.nav === "tests") switchTab("tests");
    else if (a.dataset.nav === "openq") switchTab("decision");
    else if (a.dataset.nav && a.dataset.nav.startsWith("ui:")) switchTab("ui");
  });
}

// ---------- 详情面板 ----------
function showDetail(r) {
  const s = r.source || {};
  const fields = [
    ["ID", r.id], ["名称", r.name], ["类型", r.type], ["状态", r.status], ["权限", r.authority],
    ["来源", `${s.kind || "-"}${s.section ? "（" + esc(s.section) + "）" : ""}${s.decided_by ? " 决策人：" + esc(s.decided_by) : ""}`],
    ["前置条件", (r.preconditions || []).join("；")],
    ["关联 UI", (r.ui_refs || []).join("、")],
    ["关联测试", (r.test_refs || []).join("、")],
    ["依赖", (r.dependencies || []).join("、")],
    ["AI 解释", (r.authority === "open" ? "该规则尚待人工确认，AI 不得将其作为确定规则执行。" : "已定义规则，AI 可按 authority 约束使用。")],
  ];
  $("#detail").innerHTML = fields.filter(([, v]) => v).map(([k, v]) =>
    `<div class="field"><span class="k">${k}</span>${esc(v)}</div>`).join("") +
    (s.quote ? `<div class="quote">${esc(s.quote)}</div>` : "");
}

function showRequirement(id) {
  const r = reqById.get(id);
  if (!r) return;
  switchTab("prd", () => {
    scrollReq(id);
    showDetail(r);
  });
}

function scrollReq(id) {
  const el = document.querySelector(`[data-anchor="${id}"]`);
  if (el) {
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.add("highlight");
    setTimeout(() => el.classList.remove("highlight"), 3200);
  }
}

// ---------- 视图切换 ----------
let currentTab = "prd";
const raf = window.requestAnimationFrame || ((fn) => setTimeout(fn, 0));
function switchTab(tab, after) {
  currentTab = tab;
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  if (tab === "prd") renderPrd();
  if (tab === "ui") renderUiDemo();
  if (tab === "flow") renderFlow();
  if (tab === "tests") renderTests();
  if (tab === "decision") renderDecision();
  if (after) raf(after);
}

// ---------- PRD 视图 ----------
function reqCard(r) {
  const rules = (r.business_rules || []).map((x) => `<li>${esc(x)}</li>`).join("");
  const flows = (r.normal_flow || []).map((x) => `<li>${esc(x)}</li>`).join("");
  const s = r.source || {};
  const quote = s.quote ? `<div class="quote">原文：${esc(s.quote)}</div>` :
    (s.basis ? `<div class="quote">推导依据：${esc(s.basis)}</div>` : "");
  const uiBtn = (r.ui_refs || []).length ? `<button class="btn-ui" data-goto-ui="${esc(r.id)}">查看 UI</button>` : "";
  return `<div class="req-card" data-anchor="${r.id}" data-requirements="${esc(r.id)}">
    <h3>${esc(r.id)} ${esc(r.name)} ${badges(r)} ${uiBtn}</h3>
    <div>${esc(r.description || "")}</div>${quote}${rules ? `<ul>${rules}</ul>` : ""}${flows ? `<ul>${flows}</ul>` : ""}
  </div>`;
}

function renderPrd() {
  const g = APP_DATA.game;
  let html = `<div class="req-card" data-anchor="__overview__"><h3>游戏概述</h3><div>${esc((g.overview && g.overview.summary) || "")}</div></div>`;
  for (const [label, filter] of GROUPS) {
    const items = [...reqById.values()].filter(filter);
    if (!items.length) continue;
    html += `<h3 style="margin-top:20px">${esc(label)}</h3>`;
    html += items.map(reqCard).join("");
  }
  const oq = APP_DATA.reviews.openQuestions || [];
  html += `<h3 style="margin-top:20px">未决问题</h3><div class="req-card" data-anchor="__openq__">` +
    (oq.length ? oq.map((q) => `<div class="warn-open">${esc(q.id || "")} ${esc(q.question || "")}（${esc(q.severity || "")}）</div>`).join("") : "无") + `</div>`;
  $("#view").innerHTML = html;
  $("#view").addEventListener("click", (e) => {
    const goto = e.target.closest("[data-goto-ui]");
    if (goto) { switchTab("ui", () => focusByRequirement(goto.dataset.gotoUi)); return; }
    const card = e.target.closest(".req-card[data-anchor]");
    if (card && card.dataset.anchor.startsWith("GAME-")) showDetail(reqById.get(card.dataset.anchor));
  });
}

// ---------- UI Demo 视图 ----------
function renderUiDemo() {
  const page = APP_DATA.ui.pages[0];
  if (!page) { $("#view").innerHTML = "无 UI 页面规格"; return; }
  let html = `<h3>${esc(page.id)} ${esc(page.name)} <span class="meta">${page.resolution.width}x${page.resolution.height} 状态：${esc(page.states.join(" / "))}</span></h3>`;
  html += `<div class="board-area" id="ui-area"></div><div id="ui-msg" style="margin-top:8px;color:#1a73e8;font-size:13px"></div>`;
  $("#view").innerHTML = html;
  const area = $("#ui-area");
  if (APP_DATA.simulator.enabled) {
    // Level 2：模拟器驱动（引擎由 build 时内嵌，此处执行并挂载）
    try {
      if (typeof MiniGameFactory === "undefined") new Function(APP_DATA.simulator.code)();
      /* global MiniGameFactory */
      const sim = MiniGameFactory.create(area, (msg) => { $("#ui-msg").textContent = msg; appendLog(msg); });
      window.__sim = sim;
      $("#log").style.display = "block";
    } catch (err) {
      area.innerHTML = `<div class="warn-open">模拟器加载失败：${esc(err.message)}</div>`;
    }
  } else {
    // Level 1：静态原型 + 状态切换假交互
    area.appendChild(renderStaticPage(page));
    $("#ui-msg").textContent = "Level 1 静态原型（模拟器未注入，仅演示布局与状态切换）";
  }
  // UI -> PRD 反向定位：右键点击组件（左键留给游戏操作，避免冲突）
  area.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    const comp = e.target.closest("[data-component-id]");
    if (!comp) return;
    const compId = comp.dataset.componentId;
    const related = new Set();
    for (const c of APP_DATA.ui.components) if (c.id === compId) (c.requirements || []).forEach((x) => related.add(x));
    const others = [...reqById.values()].filter((r) => (r.ui_refs || []).includes(compId)).map((r) => r.id);
    others.forEach((x) => related.add(x));
    switchTab("prd", () => {
      for (const rid of related) {
        const el = document.querySelector(`[data-anchor="${rid}"]`);
        if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); el.classList.add("highlight"); setTimeout(() => el.classList.remove("highlight"), 3200); break; }
      }
      const first = [...related][0];
      if (first && reqById.get(first)) showDetail(reqById.get(first));
    });
  });
}

function renderStaticPage(page) {
  const frag = document.createDocumentFragment();
  const board = document.createElement("div");
  board.className = "board";
  for (const c of APP_DATA.ui.components) {
    if (c.type === "card") {
      for (let i = 0; i < 8; i++) {
        const el = document.createElement("div");
        el.className = "card-el";
        el.dataset.componentId = c.id;
        el.textContent = "?";
        board.appendChild(el);
      }
    } else {
      const el = document.createElement("div");
      el.className = "comp-generic";
      el.dataset.componentId = c.id;
      el.textContent = `${c.name}（${c.id}）`;
      frag.appendChild(el);
    }
  }
  frag.appendChild(board);
  return frag;
}

// PRD -> UI 定位：依次尝试关联组件，全部未渲染时诚实提示（不虚假成功）
function focusByRequirement(reqId) {
  const r = reqById.get(reqId);
  const ids = ((r && r.ui_refs) || []).filter((x) => compById.has(x));
  let el = null;
  let used = null;
  for (const cid of ids) {
    el = document.querySelector(`[data-component-id="${cid}"]`);
    if (el) { used = cid; break; }
  }
  if (!el) {
    $("#ui-msg").textContent = `定位：${reqId} 关联组件（${ids.join("、") || "无"}）在当前模拟状态未渲染`;
    return;
  }
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.add("target-highlight");
  setTimeout(() => el.classList.remove("target-highlight"), 3200);
  $("#ui-msg").textContent = `定位：${reqId} -> ${used}`;
}

// ---------- Flow 视图 ----------
function renderFlow() {
  let html = `<h3>状态机</h3>`;
  for (const st of APP_DATA.states) {
    html += `<div class="req-card"><h3>${esc(st.id)} ${esc(st.name)} ${badges(st)}</h3>`;
    for (const f of st.normal_flow || []) {
      const parts = f.split("->").map((x) => x.trim()).filter(Boolean);
      if (parts.length >= 2) html += stateSvg(parts);
      else html += `<div>${esc(f)}</div>`;
    }
    html += `</div>`;
  }
  html += `<h3 style="margin-top:16px">核心循环</h3><div class="req-card">`;
  const loop = (APP_DATA.game.coreLoop && APP_DATA.game.coreLoop.loop) || [];
  html += loop.map((x) => esc(x)).join(" -> ") + `</div>`;
  $("#view").innerHTML = html;
}

function stateSvg(states) {
  const W = 130, H = 60, pad = 30;
  const width = pad + states.length * W;
  let svg = `<svg width="${width}" height="90" style="max-width:100%">`;
  states.forEach((s, i) => {
    const x = pad + i * W;
    svg += `<ellipse cx="${x + 40}" cy="35" rx="52" ry="22" fill="#eef3ff" stroke="#7a97c9"/>
            <text x="${x + 40}" y="39" text-anchor="middle" font-size="12">${esc(s)}</text>`;
    if (i < states.length - 1) {
      svg += `<line x1="${x + 92}" y1="35" x2="${x + W - 6}" y2="35" stroke="#7a97c9" marker-end="url(#arw)"/>`;
    }
  });
  svg += `<defs><marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7a97c9"/></marker></defs></svg>`;
  return svg;
}

// ---------- Tests 视图 ----------
function renderTests() {
  const byType = { normal: [], illegal: [], boundary: [], abnormal: [] };
  for (const t of APP_DATA.tests.cases) (byType[t.type] || (byType[t.type] = [])).push(t);
  const label = { normal: "正常操作", illegal: "非法操作", boundary: "边界场景", abnormal: "状态异常" };
  let html = `<h3>测试用例</h3>`;
  for (const type of Object.keys(label)) {
    html += `<h4 style="margin:14px 0 4px">${label[type]}（${(byType[type] || []).length}）</h4><table>
      <tr><th>ID</th><th>名称</th><th>步骤</th><th>预期</th><th>关联需求</th></tr>`;
    for (const t of byType[type] || []) {
      html += `<tr><td>${esc(t.id)}</td><td>${esc(t.name)}</td><td>${esc((t.steps || []).join("；"))}</td><td>${esc(t.expected)}</td><td>${esc((t.related_requirements || []).join("、"))}</td></tr>`;
    }
    html += `</table>`;
  }
  html += `<h3 style="margin-top:18px">预设场景</h3>`;
  for (const s of APP_DATA.tests.scenarios) {
    html += `<div class="req-card"><h3>${esc(s.id)} ${esc(s.name)}</h3><div>预期：${esc(s.expected || "")}</div>
      <div style="color:#889;font-size:12px;margin-top:4px">关联用例：${esc((s.case_refs || []).join("、"))}　执行：<span id="run-${esc(s.id)}">${window.__sim ? "由模拟器回放验证（见 Tests 输出）" : "需模拟器（P4）"}</span></div></div>`;
  }
  $("#view").innerHTML = html;
}

// ---------- 裁决视图（单文件 Decision Workbench，方案 A：内存裁决 + 导出 decisions.json） ----------
const OQ_LIST = APP_DATA.reviews.openQuestions || [];
const DEC_LOG = (APP_DATA.reviews.decisionLog && APP_DATA.reviews.decisionLog.decisions) || [];
const DEC_DRAFTS = (APP_DATA.reviews.approvalState && APP_DATA.reviews.approvalState.drafts) || {};
const DECISIONS = {}; // OQ id -> 内存裁决记录；decision_status=draft 不进导出
let decSeq = DEC_LOG.reduce((m, d) => Math.max(m, Number(String(d.decision_id || "DEC-0").replace("DEC-", "")) || 0), 0);
let selectedOq = null;

function decPrevInLog(oid) {
  const ds = DEC_LOG.filter((d) => d.question_id === oid);
  return ds.length ? ds[ds.length - 1] : null;
}

function decBadge(q) {
  const st = (DECISIONS[q.id] && DECISIONS[q.id].decision_status) || "open";
  const label = { open: "待裁决", draft: "草稿", approved: "已确认", rejected: "已否决", deferred: "已挂起" }[st];
  return `<span class="badge dv-${st}">${label}</span>`;
}

function sevBadge(q) { return `<span class="badge sv-${q.severity || "low"}">${esc(q.severity || "low")}</span>`; }

function renderDecision() {
  const decided = Object.values(DECISIONS).filter((d) => d.decision_status !== "draft");
  const open = OQ_LIST.length - decided.length;
  let html = `<div class="dec-head"><h3>未决问题裁决（${OQ_LIST.length} 项：已裁决 ${decided.length} / 待裁决 ${open}）</h3>
    <div><button class="btn-dec primary" id="dec-export">导出 decisions.json（${decided.length} 条正式裁决）</button>
    <span id="dec-export-msg" style="color:#1a73e8;font-size:12px;margin-left:8px"></span></div></div>
    <div class="dec-note">裁决在本页内存中完成（刷新丢失，正式裁决请及时导出）。导出后执行：node .claude/skills/interactive-game-prd/scripts/apply-decisions.mjs examples/mahjong/game-spec decisions.json --dry-run 预演，通过后去掉 --dry-run 落盘，再重跑 build-html 刷新本文件。AI 不代人工提交：点「正式裁决」与「导出」即人工确认动作。reviewer 固定为 human。</div>
    <div class="dec-layout">
      <div class="dec-list" id="dec-list">${OQ_LIST.map((q) => `<a class="dec-item" data-oq="${esc(q.id)}">${esc(q.id)} ${esc(String(q.question || "").slice(0, 36))}…${sevBadge(q)}${decBadge(q)}</a>`).join("")}</div>
      <div class="dec-detail" id="dec-detail"><span style="color:#99a">点击左侧未决问题查看详情与裁决</span></div>
    </div>`;
  $("#view").innerHTML = html;
  $("#dec-list").addEventListener("click", (e) => {
    const a = e.target.closest("[data-oq]");
    if (a) selectOq(a.dataset.oq);
  });
  $("#dec-export").addEventListener("click", exportDecisions);
  if (selectedOq) selectOq(selectedOq);
}

function selectOq(oid) {
  selectedOq = oid;
  const q = OQ_LIST.find((x) => x.id === oid);
  if (!q) return;
  document.querySelectorAll("#dec-list .dec-item").forEach((a) => a.classList.toggle("active", a.dataset.oq === oid));
  const draft = DECISIONS[oid] || DEC_DRAFTS[oid] || {};
  const prev = decPrevInLog(oid);
  const r = reqById.get(q.requirement_id);
  const impact = r ? `<div class="req-card"><h3>关联需求 ${esc(r.id)} ${esc(r.name)} ${badges(r)}</h3><div>${esc(r.description || "")}</div>
      <div style="color:#889;font-size:12px;margin-top:4px">关联 UI：${esc((r.ui_refs || []).join("、") || "无")}　关联测试：${esc((r.test_refs || []).join("、") || "无")}</div></div>` : "";
  const imgNote = (q.images && q.images.length) ? `<div class="warn-open">附图依据：${esc(q.images.join("、"))} —— AI 无法读取截图数值，需人工提供文本补充</div>` : "";
  const supNote = prev ? `<div class="dec-note">该问题在 decision-log 中已有正式裁决 ${esc(prev.decision_id)}（${esc(prev.decision_status)}），本次裁决将自动写入 supersedes 指向它。</div>` : "";
  $("#dec-detail").innerHTML = `<h3>${esc(q.id)}（severity：${esc(q.severity || "")}）</h3>
    <div class="quote">${esc(q.question || "")}</div>
    <div style="color:#889;font-size:12px">关联需求：${esc(q.requirement_id || "无")}</div>${imgNote}${impact}${supNote}
    <h4 style="margin:12px 0 4px">裁决</h4>
    <div class="dec-form">
      <label>结论 <select id="df-status">
        <option value="approved"${draft.decision_status === "approved" ? " selected" : ""}>确认通过（approved）</option>
        <option value="rejected"${draft.decision_status === "rejected" ? " selected" : ""}>否决（rejected）</option>
        <option value="deferred"${draft.decision_status === "deferred" ? " selected" : ""}>挂起（deferred）</option>
      </select></label>
      <label>口径 <select id="df-outcome">
        <option value="adopted"${draft.outcome === "adopted" ? " selected" : ""}>采纳当前口径（adopted）</option>
        <option value="modified"${draft.outcome === "modified" ? " selected" : ""}>人工修改后采纳（modified）</option>
        <option value="rejected"${draft.outcome === "rejected" ? " selected" : ""}>否决口径（rejected）</option>
        <option value="deferred"${draft.outcome === "deferred" ? " selected" : ""}>挂起待定（deferred）</option>
      </select></label>
      <label>理由（正式裁决必填） <textarea id="df-rationale" rows="3">${esc(draft.rationale || "")}</textarea></label>
      <div><button class="btn-dec" id="dec-draft">暂存草稿</button> <button class="btn-dec primary" id="dec-confirm">正式裁决</button></div>
      <div id="dec-msg" style="color:#1a73e8;font-size:12px;margin-top:4px"></div>
    </div>`;
  $("#dec-draft").addEventListener("click", () => saveDecision(oid, "draft"));
  $("#dec-confirm").addEventListener("click", () => saveDecision(oid, null));
}

function syncOutcome(status, chosen) {
  if (status === "approved") return chosen === "modified" ? "modified" : "adopted";
  return status;
}

function saveDecision(oid, forceDraft) {
  const q = OQ_LIST.find((x) => x.id === oid);
  const status = forceDraft ? "draft" : $("#df-status").value;
  const rationale = $("#df-rationale").value.trim();
  const msg = $("#dec-msg");
  if (!forceDraft && !rationale) { msg.textContent = "正式裁决必须填写理由"; return; }
  const prevMem = DECISIONS[oid];
  const prev = decPrevInLog(oid);
  const reuseId = prevMem && prevMem.decision_status !== "draft" && status !== "draft";
  const rec = {
    decision_id: reuseId ? prevMem.decision_id : "DEC-" + String(++decSeq).padStart(3, "0"),
    question_id: oid,
    decision_status: status,
    outcome: syncOutcome(status, $("#df-outcome").value),
    final_decision: null,
    rationale,
    reviewer: "human",
    decided_at: new Date().toISOString(),
    requirement_updates: [],
    affected: {
      requirements: [q.requirement_id].filter(Boolean),
      tests: ((reqById.get(q.requirement_id) || {}).test_refs) || [],
      ui: ((reqById.get(q.requirement_id) || {}).ui_refs) || [],
      simulator: /^GAME-RULE/.test(q.requirement_id || ""),
    },
  };
  const sup = (prevMem && prevMem.decision_status !== "draft") ? prevMem.decision_id : (prev ? prev.decision_id : null);
  if (sup && status !== "draft") rec.supersedes = sup;
  if (status === "draft") { delete rec.decided_at; }
  DECISIONS[oid] = rec;
  renderDecision();
}

function exportDecisions() {
  const list = Object.values(DECISIONS).filter((d) => d.decision_status !== "draft");
  const msg = $("#dec-export-msg");
  if (!list.length) { msg.textContent = "尚无正式裁决（草稿不导出），先在右侧完成正式裁决"; return; }
  const blob = new Blob([JSON.stringify(list, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "decisions.json";
  a.click();
  URL.revokeObjectURL(a.href);
  msg.textContent = `已导出 ${list.length} 条正式裁决到 decisions.json（浏览器下载目录）`;
}
window.__exportDecisionsData = () => JSON.parse(JSON.stringify(Object.values(DECISIONS).filter((d) => d.decision_status !== "draft")));

// ---------- 判定日志 ----------
function appendLog(msg) {
  const body = $("#log-body");
  const div = document.createElement("div");
  div.textContent = msg;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

// ---------- 初始化 ----------
document.getElementById("game-title").textContent = (APP_DATA.manifest && APP_DATA.manifest.game_name) || "未命名游戏";
document.getElementById("game-meta").textContent =
  `IR v${(APP_DATA.manifest && APP_DATA.manifest.ir_version) || "?"} · 需求 ${APP_DATA.requirements.length + APP_DATA.configs.length + APP_DATA.states.length} 条 · UI 页面 ${APP_DATA.ui.pages.length} · 用例 ${APP_DATA.tests.cases.length} · 生成于构建时`;
document.getElementById("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b) switchTab(b.dataset.tab);
});
renderNav();
switchTab("prd");
if (location.hash.startsWith("#req=")) showRequirement(decodeURIComponent(location.hash.slice(5)));
</script>
</body>
