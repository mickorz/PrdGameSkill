<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRD 质量分析报告</title>
<style>
  :root {
    --bg: #F6F8FB;
    --card: #FFFFFF;
    --primary: #3478DB;
    --p0: #DC5148;
    --p1: #E8A044;
    --p2: #4389D5;
    --p3: #94A3B8;
    --text: #253247;
    --muted: #8491A3;
    --border: #E7ECF2;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .page { max-width: 1440px; margin: 0 auto; padding: 24px 32px 48px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }
  .section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .section-title .sub { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 8px; }

  /* 01 头部 */
  .header { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header .project { font-size: 15px; color: var(--muted); margin-top: 4px; }
  .header .meta { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .header .meta span { margin-right: 20px; }
  .badge { display: inline-block; padding: 5px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .badge.blocked { background: #FDECEA; color: var(--p0); }
  .badge.allowed { background: #E8F5EC; color: #2F9E5B; }
  .badge.na { background: #EEF1F5; color: var(--muted); }

  /* 02 KPI */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 20px; margin-bottom: 20px; }
  .kpi {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px 24px; cursor: pointer; transition: box-shadow .15s, transform .15s;
  }
  .kpi:hover { box-shadow: 0 4px 14px rgba(52,120,219,.12); transform: translateY(-1px); }
  .kpi .num { font-size: 34px; font-weight: 700; line-height: 1.2; }
  .kpi .label { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .kpi .num.c-p0 { color: var(--p0); } .kpi .num.c-p1 { color: var(--p1); }
  .kpi .num.c-p23 { color: var(--text); }
  .kpi .num.c-cov { color: #2F9E5B; }

  /* 02b 检查覆盖 */
  .cov-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; margin-bottom: 16px; }
  .cov-rate { font-size: 26px; font-weight: 700; color: #2F9E5B; }
  .cov-meta { font-size: 12px; color: var(--muted); }
  .cov-track { flex: 1; min-width: 180px; height: 12px; background: #F0F3F7; border-radius: 6px; overflow: hidden; }
  .cov-fill { display: block; height: 100%; border-radius: 6px; background: #2F9E5B; }
  table.cov { width: 100%; border-collapse: collapse; }
  table.cov th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.cov td { padding: 8px 10px; border-bottom: 1px solid #F0F3F7; font-size: 13px; }
  table.cov tbody tr.hit { cursor: pointer; }
  table.cov tbody tr.hit:hover { background: #F7FAFE; }
  .cov-ids { color: var(--muted); font-size: 12px; }
  .cov-status { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 4px; }
  .cov-status.hit { background: #FDECEA; color: var(--p0); }
  .cov-status.clean { background: #E8F5EC; color: #2F9E5B; }

  /* 03 结论 */
  .conclusion .verdict { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
  .conclusion .verdict.blocked { color: var(--p0); }
  .conclusion .verdict.allowed { color: #2F9E5B; }
  .conclusion .reasons { margin-top: 10px; padding-left: 20px; color: var(--text); }
  .conclusion .reasons li { margin: 3px 0; }

  /* 04 风险 */
  .risk-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .risk-group h3 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .risk-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .risk-item:hover { border-color: var(--primary); background: #F7FAFE; }
  .risk-item .pri { flex: none; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 4px; color: #fff; margin-top: 2px; }
  .risk-item .body { flex: 1; min-width: 0; }
  .risk-item .name { font-weight: 600; font-size: 13px; }
  .risk-item .name .id { color: var(--muted); font-weight: 400; margin-left: 6px; white-space: nowrap; }
  .risk-item .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* 05 分布图表 */
  .charts { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 24px; }
  .chart h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 12px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; padding: 3px 4px; border-radius: 6px; }
  .bar-row:hover, .bar-row.active { background: #F0F6FD; }
  .bar-row .bl { flex: none; width: 34px; font-weight: 600; font-size: 13px; }
  .bar-row .track { flex: 1; display: block; height: 18px; background: #F0F3F7; border-radius: 4px; overflow: hidden; }
  .bar-row .fill { display: block; height: 100%; border-radius: 4px; min-width: 6px; }
  .bar-row .val { flex: none; width: 96px; font-size: 12px; color: var(--muted); text-align: right; }
  .donut-wrap { display: flex; align-items: center; gap: 18px; }
  .donut { flex: none; position: relative; width: 160px; height: 160px; }
  .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut .center b { font-size: 26px; }
  .donut .center span { font-size: 11px; color: var(--muted); }
  .legend { flex: 1; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .legend-item:hover, .legend-item.active { background: #F0F6FD; }
  .legend-item .dot { flex: none; width: 10px; height: 10px; border-radius: 3px; }
  .legend-item .t { flex: 1; }
  .legend-item .v { color: var(--muted); }

  /* 06 TOP5 */
  .top-list .rank {
    display: flex; align-items: center; gap: 12px; padding: 11px 12px;
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .top-list .rank:hover { border-color: var(--primary); background: #F7FAFE; }
  .top-list .no { flex: none; width: 22px; height: 22px; border-radius: 50%; background: #EEF1F5; color: var(--muted); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .top-list .title { flex: 1; font-weight: 600; font-size: 13px; }
  .top-list .title .id { color: var(--muted); font-weight: 400; margin-right: 8px; }
  .top-list .tag { flex: none; font-size: 11px; color: var(--muted); }
  .top-list .tag .rf { margin-left: 8px; }

  /* 07 问题清单 */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .toolbar select, .toolbar input {
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
    font-size: 13px; background: #fff; color: var(--text); outline: none;
  }
  .toolbar input { width: 220px; }
  .toolbar select:focus, .toolbar input:focus { border-color: var(--primary); }
  .toolbar .count { font-size: 12px; color: var(--muted); }
  .toolbar .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border); background: #fff; color: var(--text);
    border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: #2B66C4; }
  table.issues { width: 100%; border-collapse: collapse; }
  table.issues th {
    text-align: left; font-size: 12px; color: var(--muted); font-weight: 600;
    padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.issues td { padding: 10px; border-bottom: 1px solid #F0F3F7; vertical-align: top; }
  table.issues tbody tr { cursor: pointer; }
  table.issues tbody tr:hover { background: #F7FAFE; }
  td.id, .pri-tag { font-family: "SF Mono", Consolas, monospace; }
  td.id { color: var(--muted); font-size: 12px; white-space: nowrap; }
  td.title { font-weight: 600; max-width: 460px; }
  td.loc { color: var(--muted); font-size: 12px; max-width: 220px; }
  .pri-tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 4px; color: #fff; }
  .type-tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 4px; background: #EEF1F5; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }

  /* 08 综合分析 */
  .analysis ul { padding-left: 20px; }
  .analysis li { margin: 6px 0; }

  /* 抽屉 */
  .mask { position: fixed; inset: 0; background: rgba(20,30,45,.4); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
  .mask.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: -520px; width: 520px; max-width: 100vw; height: 100vh;
    background: #fff; z-index: 50; box-shadow: -8px 0 30px rgba(20,30,45,.15);
    transition: right .25s ease; display: flex; flex-direction: column;
  }
  .drawer.show { right: 0; }
  .drawer-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .drawer-head .id { font-family: monospace; color: var(--muted); font-size: 13px; }
  .drawer-head .title { font-weight: 700; font-size: 15px; flex: 1; }
  .drawer-head .close { border: none; background: none; font-size: 20px; color: var(--muted); cursor: pointer; padding: 4px; }
  .drawer-nav { display: flex; align-items: center; gap: 8px; padding: 8px 20px; border-bottom: 1px solid var(--border); }
  .drawer-nav .pos { font-size: 12px; color: var(--muted); flex: 1; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
  .drawer-body h4 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 18px 0 6px; }
  .drawer-body h4:first-child { margin-top: 0; }
  .drawer-body h5 { font-size: 13px; font-weight: 700; margin: 14px 0 6px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .drawer-body blockquote {
    border-left: 3px solid var(--border); background: #F8FAFC;
    padding: 10px 14px; border-radius: 0 8px 8px 0; white-space: pre-wrap; font-size: 13px; color: #47586E;
  }
  .drawer-body .mini-table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 12px; display: table; }
  .drawer-body .mini-table th, .drawer-body .mini-table td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
  .drawer-body .mini-table th { background: #F6F8FB; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .drawer-body p { font-size: 13px; }
  .drawer-body .status { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--muted); }
  .drawer-body .kv { margin-bottom: 10px; }

  /* 浮动操作 */
  .fab { position: fixed; right: 28px; bottom: 28px; display: flex; flex-direction: column; gap: 10px; z-index: 30; }
  .fab .btn { box-shadow: 0 4px 14px rgba(20,30,45,.12); }

  /* 响应式 */
  @media (max-width: 1180px) {
    .charts { grid-template-columns: 1fr; }
    .risk-cols { grid-template-columns: 1fr; }
  }
  @media (max-width: 1024px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .page { padding: 16px 20px 40px; }
  }
  @media (max-width: 768px) {
    .kpis { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card { padding: 16px; }
    .toolbar input { width: 100%; }
    .toolbar { gap: 8px; }
    /* 表格转卡片 */
    table.issues, table.issues tbody, table.issues tr, table.issues td { display: block; width: 100%; }
    table.issues thead { display: none; }
    table.issues tbody tr { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; padding: 10px; }
    table.issues tbody td { border: none; padding: 2px 0; }
    td.id { display: inline-block; }
    /* 抽屉全屏 */
    .drawer { width: 100vw; right: -100vw; }
    .fab { right: 16px; bottom: 16px; }
  }

  /* 打印 */
  @media print {
    body { background: #fff; }
    .page { max-width: none; padding: 0; }
    .card { border: none; box-shadow: none; break-inside: avoid; padding: 12px 0; margin-bottom: 12px; }
    .toolbar, .fab, .mask, .drawer, .kpi .label-tip { display: none !important; }
    .kpi { border: 1px solid #ddd; }
    .kpi:hover { transform: none; box-shadow: none; }
    .top-list .rank, .risk-item, table.issues tbody tr { break-inside: avoid; cursor: default; }
    table.issues tbody tr:hover { background: none; }
    a { text-decoration: none; color: inherit; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- 01 报告头部 -->
  <header class="card header" id="sec-header"></header>

  <!-- 02 质量指标 -->
  <section class="kpis" id="sec-kpis"></section>

  <!-- 03 检查结论 -->
  <section class="card conclusion" id="sec-conclusion"></section>

  <!-- 03b 检查覆盖 -->
  <section class="card" id="sec-coverage"></section>

  <!-- 04 风险分析 -->
  <section class="card" id="sec-risks"></section>

  <!-- 05 问题分布 -->
  <section class="card charts" id="sec-charts"></section>

  <!-- 06 重点问题 TOP5 -->
  <section class="card" id="sec-top"></section>

  <!-- 07 完整问题清单 -->
  <section class="card" id="sec-list">
    <div class="section-title">完整问题清单<span class="sub" id="list-count"></span></div>
    <div class="toolbar" id="toolbar">
      <select id="f-priority">
        <option value="">全部优先级</option>
        <option value="P0">P0</option><option value="P1">P1</option>
        <option value="P2">P2</option><option value="P3">P3</option>
      </select>
      <select id="f-type"><option value="">全部类型</option></select>
      <select id="f-dimension"><option value="">全部维度</option></select>
      <select id="f-module"><option value="">全部模块</option></select>
      <input id="f-q" type="search" placeholder="搜索 ID / 问题 / 位置">
      <button class="btn" id="btn-clear">清除筛选</button>
      <span class="spacer"></span>
      <span class="count" id="f-count"></span>
    </div>
    <div style="overflow-x:auto">
      <table class="issues">
        <thead><tr><th>ID</th><th>问题标题</th><th>优先级</th><th>类型</th><th>维度</th><th>原文位置</th></tr></thead>
        <tbody id="issue-tbody"></tbody>
      </table>
      <div class="empty" id="issue-empty" style="display:none">没有符合筛选条件的问题</div>
    </div>
  </section>

  <!-- 08 综合分析 -->
  <section class="card analysis" id="sec-analysis"></section>

</div>

<!-- 详情抽屉 -->
<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <span class="pri-tag" id="d-pri"></span>
    <span class="id" id="d-id"></span>
    <div class="title" id="d-title"></div>
    <button class="close" id="d-close" title="关闭">x</button>
  </div>
  <div class="drawer-nav">
    <button class="btn" id="d-prev">上一条</button>
    <button class="btn" id="d-next">下一条</button>
    <span class="pos" id="d-pos"></span>
  </div>
  <div class="drawer-body" id="d-body"></div>
</aside>

<!-- 浮动操作 -->
<div class="fab">
  <button class="btn" id="btn-top" title="返回顶部">返回顶部</button>
  <button class="btn primary" id="btn-print" title="打印 / 导出 PDF">打印 / PDF</button>
</div>

；2) 内容：按小局列出每局各家得分，底部显示本场累计分与房号、日期时间；3) 交互：右上【×】关闭大结算返回房间或大厅，关闭后保留【查看结算】按钮，点击再次打开同一份大结算且数据与首次一致；【返回大厅】退出房间；4) 兜底：重复点击只保留一个实例；数据拉取失败显示「结算数据加载失败」与【重试】，不得出现空白页；5) 关闭与打开状态在本端本地保留，切后台返回后仍可按原状态查看。\n\n**关联缺陷**：\n- 7153306612 【卡五星】【大局结算】关闭大局结算页，点击查看结算按钮，无法再次打开大局结算页","status":"待确认","has_detail":true,"acceptance":"大结算页关闭后页面保留【查看结算】入口，点击可重新打开同一份大结算且各局明细与本场总分与首次一致；重复点击不产生多个实例；本期 8 局模式结束时直接显示末局小结算与【返回大厅】，不出现大结算入口；加载失败有明确提示与重试。"},{"id":"PRD-002","title":"好友房回放功能需求缺失","priority":"P1","type":"需求缺失","module":["回放"],"dimension":"功能规则","source_location":"无（已检索：3 对局流程、4 局内流程、5 结算流程、6 结算界面、7.2 同步与异常处理、附录 A、附录 B 录屏素材）","rule_ref":"","original_text":"PRD 中无对应描述。整体缺口为：PRD 未定义好友房回放的入口权限、回放态桌面规则、播放控制、详情可点性、结束态联动与异常兜底。","problem":"PRD 未定义好友房回放：无回放入口与权限（参战玩家可看、从哪进入）、无回放态桌面规则（是否复用四人牌桌、哪些局内 UI 隐藏）、无播放控制（进度条、快进快退、暂停）、无回放内详情按钮可点性、无回放结束态与结算页联动规则。附录 B 仅为开发参考录屏清单，不构成功能需求。","impact":"回放各端表现无统一验收口径，准备标记残留、快进丢选牌标签、详情不可点、播放结束回退但结算页残留等错误反复出现且无法判定对错。","suggestion":"新增「好友房回放」章节：1) 入口与权限：对局结束后在小结算或战绩入口提供【回放】，仅本场参战玩家可见；2) 回放态桌面：复用四人牌桌与座位布局，隐藏准备标记、开始游戏与继续游戏按钮、操作按钮和倒计时，只读展示四家手牌、牌河、碰杠区、余牌与财神指示牌；3) 播放控制：进度条支持拖动、快进、快退、暂停，任意跳转后按目标时刻的服务端事件重建完整牌桌快照（含碰杠区、胡牌张、听牌与选牌标签）；4) 详情：回放内每个结算或胡牌条目的【详情】可点击，打开与对局一致的详情面板，关闭后回到原播放进度；5) 结束态：播放到末尾停在最后一帧并显示「回放结束」与【返回】，不得回退到起点；回放开始即关闭结算遮罩；6) 异常兜底：回放数据拉取失败显示「回放数据加载失败」并给【重试】【返回】，回放中切后台再返回按当前进度恢复。\n\n**关联缺陷**：\n- 7153077006 【卡五星】【回放】回放中一直显示已准备标记\n- 7153309413 【卡五星】【回放】回放播放完毕后回退到起点，结算页未清除\n- 7157529262 【卡五星】【回放】回放里的详情按钮需要可以点击\n- 7157562594 【卡五星】【回放】回放中快进，选字标签就消失","status":"待确认","has_detail":true,"acceptance":"回放全程不显示准备标记、开始游戏与继续游戏按钮、操作按钮；拖动或快进到任意位置后牌桌、碰杠区、听牌与选牌标签完整重建；详情按钮可点击并能回到原进度；播放结束停在末帧且无结算页残留；加载失败有明确提示与重试入口。"},{"id":"PRD-003","title":"解散后切换房间时清理上一局结算层","priority":"P1","type":"描述不完整","module":["结算／解散与切房"],"dimension":"功能规则","source_location":"7.1 菜单（退出／确认解散）；7.2 同步与异常处理（重连恢复）","rule_ref":"","original_text":"服务端确认解散后，发起者返回大厅，其他玩家也返回大厅并显示「房间已解散」","problem":"未规定解散后停留在房间、接受其他房间邀请并进入新房间时，必须关闭上一房间遗留的小结算面板、遮罩和长按查看牌桌预览，并清空其临时状态。","impact":"旧结算界面会叠加在新房间桌面上，遮挡准备状态与开始游戏按钮；玩家可能误触【继续游戏】或【返回大厅】造成误操作，甚至影响新房间开局。","suggestion":"在7.2补充：任意进入新房间（解散后留在房间被邀请、从大厅加入房间、重连到其他房间）的加载完成时，先关闭上一房间全部结算层（小结算面板、暗色遮罩、长按预览）并清空旧的牌桌快照；结算层未关闭前，禁止提交准备、开始游戏和出牌请求；若旧房间未解散且再次进入，则按7.2恢复其结算页。\n\n**关联缺陷**：\n- 7146446371 【卡五星】好友房解散并留在房间内时，收到其他进房邀请并同意，进入新房间后行上局的结算界面未消失","status":"待确认","has_detail":true,"acceptance":"解散后留在房间，收到其他房间邀请并同意，进入新房间后只显示新房间的准备界面，无旧结算面板、遮罩或旧名次分数；若回到未解散的旧房间，仍能正确恢复该局结算页。"},{"id":"PRD-004","title":"少人局发牌后余牌数扣减规则未定义","priority":"P1","type":"描述不完整","module":["行牌"],"dimension":"功能规则","source_location":"3.3.2 玩法信息·剩余张数；4.4 发牌","rule_ref":"","original_text":"本期初始显示136。首批起手牌背出现时一次更新为83，发牌翻牌和理牌期间保持83。","problem":"未定义2人/3人局每人起手张数、庄家额外张数及对应余牌数计算公式，也未写明「余牌数=牌组总数−已发手牌总数」的通用口径，仅在四人局给出83这一具体值。","impact":"少人局开局余牌数显示偏大，导致「杠前剩余可摸牌≥22」「余牌减至20判流局」等判断使用错误基数，影响杠牌与流局时机。","suggestion":"在3.3.2「剩余张数」补充通用口径：余牌数初始值=本局牌组总数，首批起手牌背出现时一次性刷新为「牌组总数−已发手牌总数」，其中已发手牌按3.4发牌模块在对应人数下的起手张数取（四人局为4×13+庄家1=53，显示83）；之后常规摸1张减1、每杠减2；切换人数配置时重新计算初始值；断线重连以服务端下发的余牌数覆盖本端显示。\n\n**关联缺陷**：\n- 7143076059 【卡五星】剩余牌没有扣除已发手牌","status":"待确认","has_detail":true,"acceptance":"任意人数开局后，余牌数等于牌组总数减已发手牌总数，且与牌墙实际剩余一致；杠牌校验与流局判定使用同一数值。"},{"id":"PRD-005","title":"再来一局与继续游戏缺少加载和失败兜底","priority":"P1","type":"描述不完整","module":["再来一局"],"dimension":"功能规则","source_location":"6.1.1 触发逻辑（小结算-本场继续）、7.2 同步与异常处理、6.1.1 触发逻辑（本场继续）、5.1 流程明细（小结算与下一局）","rule_ref":"","original_text":"玩家点击后，本端收起小结算并返回同桌准备状态……四人均已准备后，自动开始下一小局。","problem":"仅描述点击【继续游戏】后收起小结算回到同桌准备状态，未定义请求提交中的加载反馈、超时阈值、失败提示与重试、按钮防重复点击；也未定义服务端未响应或下一局启动失败时桌面停留在何处、如何恢复。杭州麻将没有'再来一局新建房'步骤，未定义新建房失败的处理。","impact":"点击后可能长时间停留在加载或结算页，整桌无法进入下一小局准备，形成卡死；玩家只能靠退出重进。","suggestion":"补齐以下规则：(1) 点击【继续游戏】后，主按钮立即置为不可重复点击，并展示加载中状态；(2) 请求超过 10 秒未返回时，在原位提示'网络异常，请重试'，并提供【重试】，失败期间保留小结算页与四行分数不变；(3) 重试成功后按 7.2 恢复服务端最新状态（准备状态/局数/庄家）；(4) 服务端已开始下一小局而本端未收到时，按 7.2 重连恢复至准备状态，不重复计局；(5) 若后续版本引入'再来一局新建房'，建成功才切换界面，失败回到当前结算页并提示。\n\n**关联缺陷**：\n- 7142658062 【卡五星】再来一局卡住无法创房\n- 7147056000 【卡五星】点击再来一局时，创房比较慢（一直在加载状态），并且新的房间里还残留上局的出牌","status":"待确认","has_detail":true,"acceptance":"连续点击【继续游戏】不产生重复请求；弱网或超时场景 10 秒内给出可重试提示；重试或重连后进入同桌准备状态，任一路径都不会停留在加载态。"},{"id":"PRD-006","title":"番型字效资源与触发映射未定义","priority":"P2","type":"描述不完整","module":["番型"],"dimension":"功能规则","source_location":"5.1 流程明细、2.3.4.2 番型介绍（七对番型）","rule_ref":"","original_text":"在胡牌者对应方位播放番型字效。番型颜色与光效随实际番型变化，例如金色「财飘」、绿色「平胡」","problem":"5.1 仅规定番型字效随实际番型变化并举例财飘、平胡，未列出七对、豪华七对、清七对、杠开、杠爆、杠飘、飘杠、七客、爆头等番型各自的字效文案、颜色、光效、时长与资源，也未规定未配置时的兜底。","impact":"开发无法确认七对等番型是否必须有独立字效，验收无对照标准，出现缺失或错播（如七对无动画、碰碰胡播成自摸）时无法判定。","suggestion":"在 5.1 增加「番型字效映射表」：逐行列出杭州麻将全部番型（平胡、爆头、财飘/双财飘/三财飘、杠上开花/二连杠/三连杠/四连杠、七对/豪华/双豪华/三豪华、清七对/豪华清七对各档、杠爆、杠飘、飘杠、七客各档）对应的字效文案、主色与光效、时长、资源 ID；胡牌确认且「对局结束」显示期间，按服务端下发的最终番型 ID 播放对应字效；每个番型均须配置，缺失时回退为「番型名称」文字并上报异常。\n\n**关联缺陷**：\n- 7147279662 【卡五星】【番型】缺少胡牌番型动画（试了碰碰胡、七对等都没有），建议相关牌型都确认并增加","status":"待确认","has_detail":true,"acceptance":"逐一番型触发胡牌，局内字效文案、颜色、资源与映射表一致；七对、豪华七对、清七对等均显示对应字效；未配置项走文字兜底并产生告警日志。"},{"id":"PRD-007","title":"多番型同时成立时字效展示优先级未定义","priority":"P2","type":"描述不完整","module":["番型"],"dimension":"功能规则","source_location":"5.1 流程明细、2.3.4.2 番型介绍（组合番型）、2.3.4.2 番型介绍（番型互斥与优先级）、5.1 流程明细","rule_ref":"","original_text":"在胡牌者对应方位播放番型字效。番型颜色与光效随实际番型变化","problem":"2.3.4.2 只定义结算时取倍数最高一档，5.1 只写播放番型字效；未规定每小局只播 1 条、组合番型播组合名还是逐条播组成项、并列最高或特殊番型叠加时的选择顺序与播放时长。","impact":"客户端可能按组成项连续播放多条动画（如杠爆＋杠飘），与「只需播一个」的预期不符；不同端展示不一致，验收无依据。","suggestion":"在 5.1 增补：每小局胡牌仅在胡牌者方位播放 1 条番型字效；以 2.3.4.2 选出的最终番型为准，组合档显示组合名称并按小结算口径带括号次数（如「杠爆（三连杠）」「杠飘（二连杠）」），不再逐条播放组成项；多条番型同时成立时只播最终番型，不追加插播；由服务端下发最终番型 ID 与组合次数，客户端只渲染一条；资源缺失时回退文字且不阻断结算。\n\n**关联缺陷**：\n- 7148089944 【卡五星】【番型】打出组合番型的情况下，牌型动画会连播好几个，只需要播一个即可（展示优先级需向产运确认）\n- 7151531568 【卡五星】【番型】同时满足多种番型时，播放番型动画需要遵循特定条件，现在与设计不符","status":"待确认","has_detail":true,"acceptance":"构造杠爆、杠飘、飘杠、七客及多番型同时成立场景，局内只出现 1 条番型字效，文案与最终番型、小结算赢家行番型文字一致。"},{"id":"PRD-008","title":"玩家离开后座位回收与房主转移未定义","priority":"P2","type":"描述不完整","module":["进房与座位"],"dimension":"功能规则","source_location":"3.1 对局前（玩家信息、准备信息）、7.1 菜单（退出）","rule_ref":"","original_text":"空座显示「＋」占位。玩家入座后，在对应座位显示该玩家的信息。","problem":"未定义非房主离开而房间保留时，该座位头像、昵称、积分、准备状态、房主标记的清除时机与顺序，座位如何恢复「＋」占位；未定义房主离开后是转让房主还是解散房间，以及人数变化后【开始游戏】可用状态的刷新。","impact":"房间界面可能残留已离开玩家的头像与准备状态，导致座位人数、准备人数显示错误，影响房主判断能否开局。","suggestion":"明确两种分支之一并写入：分支 A（沿用现状）非房主退出即发起解散，所有端显示「房间已解散」并回大厅；分支 B（允许单人离开）离开确认成功后立即清除该座位头像、昵称、积分、准备与房主标记，座位恢复「＋」占位，四端同步刷新人数与【开始游戏】可用状态；房主离开按'房主转移给下一位已入座玩家'或'房间解散'二选一写死，并说明转移时的提示文案。\n\n**关联缺陷**：\n- 7147399625 【卡五星】进房间后再离开，房间里仍然残留该玩家的头像","status":"待确认","has_detail":true,"acceptance":"玩家离开后该座位在同帧恢复「＋」占位，头像/昵称/准备/房主标记全部清除，四端显示一致，人数与开局按钮状态随之刷新。"},{"id":"PRD-009","title":"听牌面板持续展示与消失恢复规则缺失","priority":"P2","type":"描述不完整","module":["听牌"],"dimension":"功能规则","source_location":"3.3.5 手牌信息（听牌标签、听牌详情面板）、3.3.5.1 手牌交互说明（听牌标签显示规则）、4.5 行牌操作（提牌）","rule_ref":"","original_text":"取消提牌、改选非候选牌、确认出牌或离开本家可出牌阶段时收起。牌局数据变化时刷新当前内容。","problem":"PRD 仅写明面板在「取消提牌、改选非候选牌、确认出牌或离开本家可出牌阶段」收起、数据变化时刷新，未规定：一、他人回合、连续摸打、吃碰杠成立后听牌标签与面板是否保留；二、本家出牌后再次进入可出牌阶段时面板的重新唤起方式与入口；三、听牌牌面变化（如候选牌被打空、摸牌改变听牌）后列表增删的时机与展示；四、面板可见期间服务端数据缺失或请求失败时是否允许整块消失。","impact":"开发无法区分「按设计收起」与「异常消失」，易实现为出牌即清空且无恢复入口，玩家在中局无法持续查看听牌与剩余张数，听牌决策信息缺失，也导致同类缺陷无法按文档验收。","suggestion":"在 3.3.5「听牌标签」与 3.3.5.1 补充：一、听牌标签以本家手牌实时重算，只在候选牌set变化时增删，他人回合、吃碰杠成立和摸打过程中不得清空；二、听牌详情面板仅在打出的 4 个条件收起，牌局数据变化时原位刷新（不重建、不闪烁、不自动关闭）；三、本家确认出牌后若新牌型仍听牌，进入下一次可出牌阶段时按新牌型重新显示标签，提起候选牌即恢复面板且保持上次的分组与排序规则；四、面板可见时若数据异常，保留上次内容并在面板内显示一行「数据更新中」轻提示，重试成功后原位刷新，禁止整块消失；五、离桌、胡牌、流局、结算时统一清除面板并停止刷新。\n\n**关联缺陷**：\n- 7153593146 【卡五星】【听牌】听牌列表，对局打着就会消失","status":"待确认","has_detail":true,"acceptance":"连续多回合对局中，本家每进入可出牌阶段提起候选牌均能稳定打开听牌面板；面板只在 4 个既定条件收起，牌局数据变化时内容原位刷新且不消失、不重建；听牌状态变化后标签与张数在 1 次操作内更新；异常时面板保留并给出更新提示。"},{"id":"PRD-010","title":"小结算手牌中杠牌组缺少来源标识规则","priority":"P2","type":"描述不完整","module":["小结算"],"dimension":"功能规则","source_location":"6.1.2 UI交互以及说明（手牌摆布）、4.6 吃碰杠胡操作（杠）","rule_ref":"","original_text":"已吃、碰、杠的牌组放在行首，各组留间距，杠的第 4 张垒在上方","problem":"6.1.2 第 2 项「手牌摆布」只写“已吃、碰、杠的牌组放在行首……杠的第 4 张垒在上方”，未规定小结算行内杠牌组需要标注来源；而 4.6 已定义直杠来源箭头（上家←、对家↑、下家→）、加杠【补】、暗杠手掌标记。缺少在小结算场景下这四类来源的样式、位置、字号与是否随牌组缩放的口径。","impact":"研发只能按局内样式自行迁移或干脆不显示，结算页无法区分明杠/加杠/暗杠及杠的来源玩家，与设计稿不一致，玩家难以复核牌型与承包摊数来源。","suggestion":"在 6.1.2「手牌摆布」补充：小结算每行内每组杠牌在牌组正下方居中显示来源标识，直杠显示来源方向箭头（按该行玩家视角：上家←、对家↑、下家→），加杠显示【补】，暗杠显示【暗】；标识尺寸随牌组缩放、不遮挡牌面，颜色沿用局内金色系；黄庄、胡牌局及长按查看牌桌的终局牌桌视图三处均按同一规则展示；来源数据缺失时按服务端牌组来源字段兜底显示，不得省略。\n\n**关联缺陷**：\n- 7146513273 【卡五星】【小结算】手牌展示里的杠牌需要在下方标识出来源，现在没有","status":"待确认","has_detail":true,"acceptance":"构造包含他人直杠、加杠（补杠）、暗杠的牌局，进入小结算：每组杠下方均出现来源标识，箭头方向/文案与局内碰杠区一致、与该行玩家视角匹配，长按查看牌桌时同样可见，四端显示一致。"},{"id":"PRD-011","title":"小结算行内结算元素展示顺序未定义","priority":"P2","type":"描述不完整","module":["小结算"],"dimension":"功能规则","source_location":"6.1.2 UI交互以及说明（第1项 玩家信息、第2项 手牌摆布）、5.1 结算流程（小结算与下一局）","rule_ref":"","original_text":"按本家、下家、对家、上家从上到下固定排列。本家行置顶并高亮","problem":"6.1.2 仅规定四行排列顺序（本家→下家→对家→上家）和列结构（左侧玩家信息、中间手牌、右侧得分及标记），以及番型在赢家牌组上方、承包类标识在得分右侧、胡牌方式在行最右侧等分散位置；缺少同一行内多元素同时出现时的展示先后与对齐规则，例如番型与「承包」「反承包」并列时的左右次序、得分与「三摊承包」「反承包」标签的间距与换行、未参与赔付的 0 分玩家行是否省略标识。","impact":"不同研发对同一行内元素的排序理解不一致，结算页信息排布与设计稿不一致，玩家辨识赔付关系与胡牌方式的效率下降，后续多次返工。","suggestion":"在 6.1.2 增加“结算信息展示顺序”条目并按固定顺序描述：①行内从左到右固定为玩家信息列、手牌列、得分列；②赢家牌组上方先显示番型名称，再在其右侧并列显示「承包」「反承包」；③得分列先显示净得分，再在其右侧依次显示「三摊承包」「反承包」蓝底标签；④行最右侧固定显示胡牌方式（自摸／点炮胡／抢杠胡），放铳者行同位置显示「点炮」；⑤同一位置多标识同时出现时按上述顺序左对齐排布，超出列宽时整体缩字不换行；⑥黄庄行不显示番型与承包类标识。\n\n**关联缺陷**：\n- 7147495576 【卡五星】【小结算】结算信息需要遵循一定顺序来展示的，现在与设计不符","status":"待确认","has_detail":true,"acceptance":"构造同时触发番型、承包与反承包、点炮胡的牌局进入小结算，逐行核对元素从左到右顺序与设计稿一致，0 分玩家行不显示承包类标签，黄庄页不显示番型与承包标签。"},{"id":"PRD-012","title":"小结算缺少胡分详情展示规范","priority":"P2","type":"描述不完整","module":["小结算详情"],"dimension":"功能规则","source_location":"6.1.2 UI交互以及说明（编号6 赢家结算）、6.1.2 UI交互以及说明（编号2 手牌摆布、编号4 分数结算）、5.1 流程明细（胡牌场景飘分）、6.1.2 UI交互以及说明（编号3 输赢显示、编号4 分数结算）","rule_ref":"","original_text":"赢家牌组上方的番型文字仅显示番型名称及复合次数，使用黄色。","problem":"小结算只规定赢家牌组上方的番型名称和每行净得分，未定义胡分详情面板：缺少逐条目的番型名称、倍数、适用对象、来源标识，也未规定分项合计必须等于本局净得分、不展示 0 分条目、多场景拆分与长内容排布。","impact":"详情与结算总分对不上，玩家无法核对分数构成，易产生资损争议并重复提单。","suggestion":"在 6.1.2「UI交互以及说明」新增「胡分详情」条目：本家点击某一行得分区展开，按结算笔次逐条显示「番型名称 + 番型倍数 × 适用庄闲倍数 = 得分」，并标注对象（自摸三家分行、点炮/抢杠的放铳者、承包/反承包/链式各笔）；条目合计须等于该行净得分，不一致时直接暴露异常不做前端兜底；得分为 0 或未参与该笔结算的玩家不显示条目，点击提示「本局无得分明细」；同一局存在多种结算场景时按场景分组分行展示；条目超过 5 条时限高滚动并保持行距，禁止压缩行高。本期无杠分、无封顶、无亮倒、无漂分选项，详情不得出现这些条目。\n\n**关联缺陷**：\n- 7147114605 【卡五星】【小结算详情】未展示具体番型（如下图内是七对牌型）\n- 7148306467 【卡五星】【小结算详情】详情内容较长的情况下，显示过于拥挤（而且有点难看），建议优化（查参照美术效果图）\n- 7149586398 【卡五星】【小结算详情】点炮胡中未参与结算的玩家，详情里也会显示漂风情况（虽然显示为0），此时不用显示漂分\n- 7151771180 【卡五星】【小结算详情】现在只显示番型却不显示倍数数值了，需要修改","status":"待确认","has_detail":true,"acceptance":"赢家详情内可看到本局实际番型名称（含七对档）与倍数，条目得分之和与本行净得分一致；番型名称与 2.3.4.2 番型表档位一致。"},{"id":"PRD-013","title":"小结算缺少结算明细面板的倍数展示规范","priority":"P2","type":"描述不完整","module":["小结算详情"],"dimension":"功能规则","source_location":"2.3.4.2 番型介绍（编号6-9 杠开番型）、6.1.2 UI 交互以及说明 #6 赢家结算","rule_ref":"","original_text":"1杠2倍、2杠4倍、3杠8倍、4杠16倍；番型文字仅显示番型名称及复合次数","problem":"6.1.2 小结算只规定每行净得分、番型名称与复合次数、胡牌方式、承包标识，没有定义“结算详情”展开面板：未规定条目结构（番型名称、番型倍数、适用庄闲倍数、应赔分）、连续杠倍数须按 2、4、8、16 累乘逐项展示，也未规定明细中各条之和须等于该行净得分。","impact":"开发可自由用累加方式排列倍数，导致明细里 2、4、6、8、10 与番型档位和实际分数矛盾，玩家无法核对结算结果，易引发结算争议。","suggestion":"在 6.1.2 增加“结算详情”条目：1）触发：小结算每行右侧提供“详情”入口，点击展开该玩家本局算分明细，仅本端展示；2）条目结构：按赔付关系逐条列出“番型名称＋番型倍数×适用庄闲倍数＝应赔分”，自摸按每个实际赔付者各一条并标注相对座位或承包关系；3）倍数口径：连续杠按编号6-9 查档，明细中逐杠倍数固定为 2、4、8、16 累乘，禁止线性累加，最终档位须与番型文字（如「二连杠 4 倍」）一致；4）异常兜底：明细合计与服务端净得分不一致时以服务端分数为准并高亮差异项，明细缺失显示“暂无明细”且不影响【继续游戏】【返回大厅】。\n\n**关联缺陷**：\n- 7153541238 触发连续杠上杠的情况，详情里杠上杠后对应的倍数应该是累乘的现在显示的是累加的","status":"待确认","has_detail":true,"acceptance":"构造同一回合连开 2、3、4 杠后补牌自摸的局，小结算详情中逐杠倍数依次为 2、4、8、16（累乘），最终档位与番型文字一致，且各条应赔分之和等于该行净得分。"},{"id":"PRD-014","title":"小结算缺少结算明细面板的条目清单","priority":"P2","type":"描述不完整","module":["小结算详情"],"dimension":"功能规则","source_location":"6.1.2 UI 交互以及说明 #6 赢家结算、5.1 流程明细、5.1 流程明细（自摸）、6.1.2 UI 交互以及说明 #5 承包标识","rule_ref":"","original_text":"所有番型的点炮胡均在赢家行最右侧显示金色「点炮胡」，放铳者对应行显示蓝色「点炮」","problem":"6.1.2 未定义结算详情面板必须包含的条目：点炮胡时须同时展示胡牌番型（名称、倍数、庄闲倍数）与胡牌方式，不得只保留单一扣分项；也未规定明细缺项时的展示兜底和与服务端分数的一致性校验。","impact":"点炮胡的小结算可能只显示某一项扣分而看不到番型来源，玩家无法确认本局胡牌番型与赔付依据，结算页与实际结果对不上。","suggestion":"在 6.1.2 增加“结算详情”条目并规定：1）点炮胡、抢杠胡时，详情必须同时展示番型项（番型名称、番型倍数、适用庄闲倍数、应赔分）与胡牌方式项，赢家行标“点炮胡”、放铳者（或加杠者）行标“点炮”；2）杭州麻将不设杠分，杠只作为番型构成（面子）体现，详情不得出现独立“杠分”扣分项；3）明细各项之和须等于右侧净得分，否则以服务端分数为准并高亮差异；4）明细为空时不阻断【继续游戏】。\n\n**关联缺陷**：\n- 7154560883 点炮胡的情况下，现在只展示了杠分的详情，番型的详情没有了\n- 7158836755 2个玩家亮倒，1个玩家不亮的情况下，其中1个玩家自摸，在详情页会出现两条自摸[两家]的记录（应该是[上家]1条，[下家]1条）","status":"待确认","has_detail":true,"acceptance":"构造点炮胡局，小结算详情同时展示番型明细与“点炮胡”标识，放铳者行显示“点炮”，不出现只有单一扣分项而无番型的情况，明细合计与右侧净得分一致。"},{"id":"PRD-015","title":"再来一局后局内 UI 控件重置范围未定义","priority":"P2","type":"描述不完整","module":["再来一局与局内UI"],"dimension":"功能规则","source_location":"6.1.1 触发逻辑（本场继续）、7.1 菜单（退出）、5.1 流程明细（胡牌场景）","rule_ref":"","original_text":"本端收起小结算，回到同桌准备状态。清除本端桌面上上一局的手牌、碰杠区和牌河。","problem":"清理范围只写手牌、碰杠区和牌河，未包含操作按钮（吃/碰/杠/胡/过）、选组与取消面板、自摸预览、听牌详情、放大弃牌、浮标、倒计时及任何创房/配置类入口按钮；也未规定这些元素在解散、继续游戏、重新进入房间三种路径下的清除时机与顺序。","impact":"再来一局或重新进入后界面可能残留上一局的按钮与面板，遮挡牌桌或误触发起无效操作，造成界面显示异常。","suggestion":"补充：每次进入新一小局或重新进入房间时，按统一清单重置局内 UI——隐藏吃/碰/杠/胡/过等操作按钮与胡牌预览、关闭选组与取消面板、清除听牌标签与详情、清除放大弃牌与最新弃牌浮标、倒计时归位、关闭所有配置类弹层与按钮；重置以服务端最新状态为准，不得沿用上一局任何控件状态；解散路径下直接销毁房间界面，不保留任何局内控件。\n\n**关联缺陷**：\n- 7154243588 【卡五星】漂分阶段解散房间后，再来一局创建房间，房间界面显示异常（选漂分按钮残留）","status":"待确认","has_detail":true,"acceptance":"从任意阶段解散或再来一局后，新界面首帧不存在上一局残留的按钮、面板、浮标与提示；重复进入多次后界面元素数量与初始状态一致。"},{"id":"PRD-016","title":"局内快捷语与交互文字气泡展示未定义","priority":"P2","type":"需求缺失","module":["桌面"],"dimension":"功能规则","source_location":"桌面布局、局中信息、玩家头像信息、对局内通用提示、行牌操作、结算界面（全文检索：气泡、快捷、俏皮、聊天、表情）","rule_ref":"","original_text":"PRD 中无对应描述。整体缺口为：PRD 全文无快捷语、俏皮话、表情气泡需求，气泡的入口、位置、换行截断、停留时长与边界避让均无规范。","problem":"PRD 全文无快捷语、俏皮话、表情等聊天气泡需求，未定义气泡的触发入口、展示位置、最大宽度与换行截断、停留时长、与头像、牌河、桌面边界的避让，以及四家不同座位的朝向与位置。","impact":"局内文字只能在无统一规范下实现，右侧玩家内容会超出屏幕，文案被裁剪，也无法据此验收。","suggestion":"新增“局内互动文字”小节：本家与其它玩家发送快捷语后，在发送者头像上方（对家在头像下方）显示气泡；气泡最大宽度为本家可视区宽度的 40%，超出时按字符换行，最多 2 行，超过截断加“…”；气泡整体不得超出屏幕安全区，右侧玩家气泡向右溢出时以头像为锚点自动翻转到左侧；停留 3 秒后淡出，连续发送时新内容覆盖旧内容；断线、离开房间或小局结束时清除气泡。\n\n**关联缺陷**：\n- 7143211054 【卡五星】交互文字没有展示气泡文字\n- 7150388862 【卡五星】右侧玩家发送俏皮话，内容会超出整个界面","status":"待确认","has_detail":true,"acceptance":"四家任意座位发送长文本时，文案在 2 行内完整显示，气泡完全位于安全区内不越界，3 秒后淡出，切局无残留。"},{"id":"PRD-017","title":"好友房桌布文案与房间类型标识未定义","priority":"P2","type":"描述不完整","module":["桌面"],"dimension":"功能规则","source_location":"桌面布局-对局前、局中信息","rule_ref":"","original_text":"等待阶段在左上显示「房间玩法」与当前房间号。开局后，同一区域切换为「当前局数／总局数」","problem":"3.1 对局前只列出菜单、玩法/房间号、玩家信息、准备信息、合规信息、座位六项，未定义桌布区域使用哪套素材与文案，未规定好友房桌布不得出现“至尊房”等其它房间类型或玩法字样，也未定义服务端下发异常字段时的兜底。","impact":"桌布残留其它玩法文案无法判定为缺陷，好友房可能出现与当前玩法不符的房间类型字样。","suggestion":"在 3.1「对局前」补充“桌布与桌面文案”：好友房桌布固定使用好友房牌桌素材；桌面上只允许出现左上「玩法/房间号」、菜单、玩家信息、准备信息、合规信息与座位六类文案和元素；房间类型字样（如“至尊房”“金币场”）在好友房桌面任何位置都不显示，服务端若下发其它房间类型字段，客户端按好友房素材渲染并丢弃该字段。\n\n**关联缺陷**：\n- 7151211535 【卡五星】好友房桌布上出现“至尊房”的字样","status":"待确认","has_detail":true,"acceptance":"好友房任意阶段桌面无“至尊房”等房间类型字样或其它玩法文案，只存在 3.1 列出的六类元素，收包异常时也不显示。"},{"id":"PRD-018","title":"听牌详情面板的界面层级与遮挡规则未定义","priority":"P2","type":"描述不完整","module":["桌面"],"dimension":"功能规则","source_location":"手牌信息-听牌标签（3.3.5）、对局内通用提示（4.8）、桌面布局-局中信息","rule_ref":"","original_text":"面板在牌桌中下部、主体手牌上方水平居中，切换候选牌时保持居中","problem":"缺少统一的界面层级（z-order）规范：听牌标签与听牌详情面板、操作按钮与胡牌预览、toast、飘分与番型字效、对局信息等全屏面板、小结算遮罩之间的上下关系，以及同时打开时的遮挡、互斥与关闭后恢复规则都没有定义。","impact":"层级只能由开发自行决定，提示框可能压住操作按钮或对局信息面板，遮挡关键信息，且无法作为验收依据。","suggestion":"新增“界面层级”一节，从低到高固定为：牌桌、牌河、手牌 \u003c 听牌标签与听牌详情面板 \u003c 操作按钮与胡牌预览 \u003c toast、飘分与番型字效 \u003c 对局信息等全屏面板 \u003c 小结算遮罩与弹窗；听牌详情面板打开期间若拉起对局信息等全屏面板，面板置顶并完整遮挡听牌详情；关闭面板后按当前选中候选牌恢复听牌详情；取消提牌、确认出牌、离开本家出牌阶段或小局结束时两者同时收起；层级用固定配置值，不为单个元素开特例。\n\n**关联缺陷**：\n- 7155072223 【卡五星】听牌提示框的层级在对局信息界面之上了，需要修改（对局信息界面的层级应该更高）","status":"待确认","has_detail":true,"acceptance":"同时打开听牌详情与对局信息时，对局信息完整覆盖听牌详情且可正常操作；关闭后听牌详情按当前候选牌恢复；任何情况下提示框不遮挡操作按钮与对局信息面板。"},{"id":"PRD-019","title":"桌面视觉基线与右上角通用组件规格缺失","priority":"P2","type":"描述不完整","module":["桌面UI"],"dimension":"功能规则","source_location":"3.1 对局前、3.3.1 方位信息、3.3.2 玩法信息、3.3.3 玩家头像信息、3.3.5 手牌信息","rule_ref":"","original_text":"本家头像显示在桌面左下方。其他三家的头像按相对座位显示在左侧、上方和右侧。","problem":"1）桌布底图、方位盘尺寸与居中锚点、麻将子尺寸和材质只有截图及「浅色玉质底，底色避免纯白」一句描述，没有色值、尺寸、间距等可验收参数；2）PRD 没有定义好友房右上角「安全分」的展示位置、字段与数值来源；3）PRD 没有说明「玩法／局数」区由玄武通用组件承载时的字段、样式与布局；4）PRD 没有定义无财神玩法下方位盘左侧白板财神指示牌的隐藏配置，默认规则里反而固定显示白板指示牌。","impact":"卡五星桌面以「与杭麻一致」为验收标准时没有书面依据，桌布、方位盘、头像锚点只能靠截图比对，竖屏和横屏比例变化下容易位置漂移；安全分与通用组件缺规格会导致各端实现不一致，反复返工。","suggestion":"在 3.1「对局前」与 3.3.1～3.3.3 增加「桌面视觉基线」条目：逐项给出桌布底图资源、方位盘直径与画面中心锚点百分比、麻将子宽高与材质色值、四端头像信息区锚点及与方位盘的间距；新增「右上角信息区」条目，规定安全分、玩法名、当前局数／总局数的字段、显示顺序、对齐方式及引用玄武通用组件名，并注明与「房间号」的切换时机；新增「财神指示牌显隐配置」：对无财神玩法隐藏方位盘左侧白板指示牌，其余元素位置与间距不随之偏移。异常兜底写明：安全分取不到时显示「-」，桌布或方位盘资源缺失按默认底图与默认锚点渲染且不改变其他元素位置。\n\n**关联缺陷**：\n- 7141991468 【卡五星】【桌面UI】不符合需求","status":"待确认","has_detail":true,"acceptance":"按设计稿逐项比对：桌布、方位盘居中、麻将子材质与尺寸、四端头像位置与杭麻一致且偏差在设计稿允许范围内；右上角同时显示安全分、玩法名与「1/8局」，样式取自玄武通用组件；无财神玩法下方位盘左侧不显示白板指示牌，其余元素坐标不偏移。"}],"overall_recommendations":["**缺口最集中的模块**：模块分布第一名是「小结算详情」，共 3 条，对应 PRD 缺口为 PRD-012（小结算缺少胡分详情展示规范）、PRD-013（小结算缺少结算明细面板的倍数展示规范）、PRD-014（小结算缺少结算明细面板的条目清单）；其次是「桌面」3 条（PRD-016、PRD-017、PRD-018），「番型」与「小结算」各 2 条（PRD-006、PRD-007 与 PRD-010、PRD-011）。小结算详情的问题呈现为同一条链路（详情入口、条目清单、倍数展示、长内容排布）连续缺规格，属于结构性问题而非零散遗漏。","**可能影响开发的问题**：P0 为 0 条，P1 共 5 条。其中 PRD-001（大结算页展示与关闭后再打开规则缺失）、PRD-003（解散后切换房间时未清理上一局结算层）、PRD-005（再来一局与继续游戏缺少加载和失败兜底）直接作用于结算层与状态复位链路，一旦按现状开发，容易出现结算页重复叠加、旧局数据串入新局，存在结算分展示错误与资损风险；PRD-004（少人局发牌后余牌数扣减规则未定义）影响余牌数与听牌剩余张数的计算口径，会影响「剩余张数」这一对玩家可见的计分相关提示；PRD-002（好友房回放功能需求缺失）在本 PRD 中完全无对应章节，若产品确认需要，则属于功能级缺失。","**是否建议进入下一阶段规格生成**：建议进入，但需先闭合 P1。理由：无 P0 缺陷，P1 仅 5 条且集中在结算层复位、余牌计数、回放、再来一局兜底这几个局部环节，缺口边界清晰、可通过补写需求条款解决；19 条缺口中有 14 条为 P2，可在规格生成阶段并行补齐。建议在规格生成前置任务中先处理 PRD-001、PRD-003、PRD-004、PRD-005，避免结算与计数口径被固化进契约。"]}</script>

  function filtered() {

  // ---------- 抽屉 ----------

  // 行内 Markdown：esc 后处理粗体（**x** -> strong）

  // 简易富文本渲染：**小节**： 行 -> 分块标题；逐行成段；连续 | 行组转表格
  function renderRich(text) {
    if (!text || !String(text).trim()) return '<p style="color:var(--muted)">（源报告清单条目，无详情块，未提供该字段内容）</p>';
    var html = [], tbl = [];
    function flush() {
      if (!tbl.length) return;
      var rows = tbl.filter(function (l) { return !/^\|[\s:|-]+\|?$/.test(l.trim()); });
      var trs = rows.map(function (row, ri) {
        var cells = row.replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); });
        var tag = ri === 0 ? 'th' : 'td';
        return '<tr>' + cells.map(function (c) { return '<' + tag + '>' + inlineMd(c) + '</' + tag + '>'; }).join('') + '</tr>';
      }).join('');
      html.push('<table class="mini-table">' + trs + '</table>');
      tbl = [];
    }
    String(text).split('\n').forEach(function (l) {
      var t = l.trim();
      if (t.startsWith('|')) { tbl.push(l); return; }
      flush();
      // **小节标题**： 单独成块（如「范例（需求必须按此格式写）：」）
      var h = t.match(/^\*\*([^*]+)\*\*([：:])?\s*$/);
      if (h) { html.push('<h5>' + esc(h[1]) + (h[2] || '') + '</h5>'); return; }
      if (t) html.push('<p>' + inlineMd(l) + '</p>');
    });
    flush();

  }
  function openDrawer(id) {

  $('d-next').addEventListener('click', function () {
    var list = filtered(), i = list.findIndex(function (x) { return x.id === curId; });
    if (i >= 0 && i < list.length - 1) openDrawer(list[i + 1].id);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeDrawer();
    if (!curId) return;
    if (e.key === 'ArrowLeft') $('d-prev').click();
    if (e.key === 'ArrowRight') $('d-next').click();
  });

  // ---------- 浮动操作 ----------
  $('btn-top').addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  $('btn-print').addEventListener('click', function () { window.print(); });

  renderList();
})();
</script>
</body>
</html>
