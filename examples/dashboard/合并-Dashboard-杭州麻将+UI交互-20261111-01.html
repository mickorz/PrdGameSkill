"type":"内容冲突","module":["结算与结束"],"source_location":"「算分规则」表·结算算分、「笃三老庄」表、「三摊承包」表·被承包","original_text":"闲家自摸：最终得分=【1庄家的底分×牌型倍数×牢数番】+【2闲家的底分×牌型倍数】；笃三老庄：庄家倍率为8倍；被承包：A需承包所有输分×2（支付三家总和×2）示例：A赔付 = 胡牌分 × 3 × 2（如闲家自摸4分×6=24元）","problem":"承包示例把三家按同一「胡牌分4」相加再×2，等于让庄家也只付4分；按同文档算分规则，本期笃三老庄为8倍，同一牌例应为庄家付4×8=32、两名闲家各付4，三家合计40，倒承包×2=80。两处对同一场景给出24与80两个金额；示例还混用「元」与「分」。","impact":"承包/倒承包金额直接算错，错误只出现在承包局，回归测试很难发现；验收无法判定哪个金额正确。","suggestion":"先定义「胡牌分」是否含牢数番，再按算分规则重算承包、倒承包、链式承包三个示例；统一单位为「分」，并标注「示例值以产品确认为准」。\n\n**需要补的内容与必填格式**：\n新增「承包金额计算表」，必填列：牌例｜胡牌方式｜单家基础分｜庄家应付｜闲家应付｜三家合计（承包基数）｜承包或倒承包倍数｜赔付方｜金额\n\n**范例（需求必须按此格式写）**：\n正常：底分1、平胡1倍、笃三老庄（8倍），闲家A自摸：庄家付1×1×8=8，两名闲家各付1，承包基数10；若C对A有3摊（C为摊方），C倒承包 10×2=20分。异常：按原文示例写「闲家自摸4分×6=24元」，未乘庄家8倍，与40×2=80冲突。\n\n**验收口径**：\n给定牌例可被独立复算两次得到同一金额；测试可直接断言赔付方与金额，且不与算分规则公式矛盾。","status":"待确认","has_detail":true},{"id":"PRD-067","title":"满8局结束后是结束本场还是进入大结算，前后矛盾（与 PRD-052 同根因，重复登记，建议合并）","priority":"P1","type":"内容冲突","module":["结算与结束"],"source_location":"「本期开发范围」、「默认规则·计分与结算」、「玩法规则·【局数】」、「结算流程」","original_text":"每小局保留小结算，未满8局则继续下一小局，满8局结束本场；原文中的创房面板、其他玩法选项、大结算和非核心桌面功能…仅作原文上下文；局数：达到所选局数时进入大结算","problem":"本期范围写「满8局结束本场」且声明大结算不在本期，局数模块却写「达到所选局数时进入大结算」。第8局小结算之后到底是关闭房间、返回大厅、还是展示大结算（本期不做），没有任何一处给出确定结论。","impact":"全场收尾这一关键节点无法实现，可能出现第8局结算后卡住或错误弹出未实现的大结算；验收缺少第8局的判定标准。","suggestion":"与 PRD-052 合并处理：明确本期第8局小结算后的唯一去向（建议：小结算点「继续」后直接返回房间/大厅并提示本场结束），并把局数模块该句标注为旧版对照、注明大结算由后续版本实现。\n\n**需要补的内容与必填格式**：\n章节生效声明 + 「本场收尾流程表」，必填列：局序号｜结束方式（胡牌/流局）｜小结算后动作｜下一状态（下一局/结束本场）｜界面｜本期是否实现\n\n**范例（需求必须按此格式写）**：\n正常：第8局胡牌→小结算→点「继续」→提示「本场结束」并返回房间。异常：第8局小结算后弹出大结算界面（本期未实现）或停留原地无响应。\n\n**验收口径**：\n第8局胡牌与第8局流局两条路径都有确定去向；测试可覆盖并断言无未实现界面弹出。","status":"待确认","has_detail":true},{"id":"PRD-068","title":"昵称截断规则自相矛盾","priority":"P1","type":"逻辑错误","module":["牌桌区域"],"source_location":"「玩家头像信息」第5项玩家昵称","original_text":"游戏中常显，最多显示10个字符（中文占2字符，英文/符号/数字占1字符），超出第78个字符显示“..”","problem":"同一句内出现两个互斥上限：「最多显示10个字符」与「超出第78个字符显示..」，无法确定截断阈值是10还是78、是字符个数还是宽度单位（中文占2）；也未说明「..」是追加还是占用名额。规则要求昵称由外部通知刷新，展示口径不定则刷新结果无法验收。","impact":"客户端无法实现截断，长昵称会溢出或错误截断；测试无边界值可依，验收只能目测。","suggestion":"统一按显示宽度计算：宽度上限＝10（中文2、英文/数字/符号1），超出按宽度截断并在末尾追加「..」（追加后不超过上限）。\n\n**需要补的内容与必填格式**：\n必填表：输入昵称｜宽度计算｜是否截断｜显示结果｜说明\n\n**范例（需求必须按此格式写）**：\n正常：「一二三四五」（5个中文＝10宽度，不截断，完整显示）。异常：「一二三四五六」（12宽度，超出10，截断为前8宽度后补「..」→「一二三四..」）。示例值以产品确认为准。\n\n**验收口径**：\n给出9/10/11宽度的边界用例，显示结果唯一可判定；测试可直接转成三条用例。","status":"待确认","has_detail":true},{"id":"PRD-069","title":"打财神后杠链是否延续，两处口径相反（本类主条目，PRD-056 同根因）","priority":"P1","type":"逻辑错误","module":["行牌循环"],"source_location":"二、功能详情 > 玩法规则 > 杠（杠开、杠爆、杠飘）；番型介绍 > 组合番型、基础操作及规则 > 【杠】（杠开行、杠飘行）、胡牌番型介绍 > 番型介绍（序号22 杠飘）","original_text":"杠后补牌未胡而打出任何一张牌（包括财神），则此前的杠不能再用于判定杠开；之后再次轮到自己摸牌时的胡牌，不能追溯为此前杠的杠开。又：杠飘定义为杠后补牌打出1张财神后，下一次摸牌以爆头自摸胡牌。","problem":"术语“杠链”指同一玩家连续开杠的累计计数（每次杠+1，遇打出牌或吃碰等事件可能清零），用于判定二连杠、三连杠及杠爆、杠飘档位。需求文档在杠开段落规定“打出任何一张牌（包括财神）后此前的杠不能再用于判定杠开”；而规则基准3.5第4条要求“打出财神且敲响→杠链保留”，并要求杠链继续用于杠开系列番型；同时需求文档的杠飘又允许该次财神打出后仍用此前的杠判定为杠飘。同一次“打财神”行为，在杠开与杠飘上得出相反的“杠是否延续”结论，且未给出优先级或生效声明，实现者无法确定杠链保留范围。","impact":"同一牌序（杠→补牌→打财神且敲响→再杠→补牌自摸）可能被算成二连杠4倍或单次杠上开花2倍，结算金额相差一倍，测试无法编写确定性用例。","suggestion":"在杠模块与番型表之间补一条“杠链延续生效声明”：明确打出财神（敲响/未敲响）后此前的杠是否计入杠开系列番型、是否仅用于杠飘/飘杠，并列出与规则3.5一致的判定优先级；如采用“打出财神且敲响保留杠链”，须同步修改杠开段落中“包括财神”的表述，避免自相矛盾。\n\n**需要补的内容与必填格式**：\n新增“版本差异对照表”，列：场景（打非财神/打财神且敲响/打财神未敲响）｜是否保留杠链｜可判定番型（杠开/杠爆/杠飘）｜依据章节\n\n**范例（需求必须按此格式写）**：\n正常（按规则3.5）：杠→补牌未胡→打财神且敲响→再杠→补牌自摸，杠链=2，判二连杠4倍；异常（按现文档杠开段落）：同一牌序，因已打出财神，此前的杠不计，只判杠上开花2倍（示例值以产品确认为准）。\n\n**验收口径**：\n文档给出唯一的杠链延续声明与对照表后，测试可对同一杠序列直接推出唯一倍数；若两处仍并存相反表述，判定不合格。","status":"待确认","has_detail":true},{"id":"PRD-070","title":"骰子点数未参与开牌位置，发牌固定从牌序头部（本类主条目，PRD-093 同根因）","priority":"P1","type":"逻辑错误","module":["开局"],"source_location":"三.对局流程 / 桌面布局 / 局中信息 / 方位信息（骰子）；三.对局流程 / 局内流程 / 发牌（发牌逻辑）、3.3.1 方位信息（骰子）；发牌 > 发牌逻辑","original_text":"“骰子翻滚后停稳，展示本次点数，各家看到同一结果。”（方位信息·骰子）；“以庄家为起点，按逆时针依次从牌序头部给每人同时发4张，重复3轮，每人先得12张。”（发牌·发牌逻辑）","problem":"规则基准要求掷骰点数决定“开牌位置”，发牌须按该开牌位置取牌；需求文档把骰子只当展示动画，发牌固定“从牌序头部”取牌，全文没有“点数→开牌位置”的换算规则（两颗骰子取和值还是单颗、从庄家逆时针数到哪一墩/哪一张），骰子结果对牌局数据无任何影响。","impact":"服务端无法按规则实现掷骰与开牌位置；牌墙顺序、余牌数变化、回放复现均不可验证；测试无法构造“指定骰子点数→首张发牌”的用例；后续若要开启翻财神，取点口径缺失会连带影响。","suggestion":"在“发牌逻辑”前补“掷骰与开牌位置”小节：两颗骰子的取点规则（和值S）、以庄家为起点逆时针数墩/数张的换算方式、开牌位置与发牌顺序及摸牌顺序的关系；保留现有“骰子停稳后与发牌画面并行展示”的时序。\n\n**验收口径**：\n文档给出唯一可计算的“骰子点数→开牌位置”规则；给定骰子点数即可推导首张发牌位置与四家发牌顺序，测试可直接编写点数映射用例并校验余牌数136→83。","status":"待确认","has_detail":true},{"id":"PRD-071","title":"庄家第14张直接随发牌下发，缺少首摸等待阶段","priority":"P1","type":"逻辑错误","module":["开局"],"source_location":"三.对局流程 / 局内流程 / 发牌（发牌逻辑、发牌UI及动画表现）","original_text":"“最后从同一牌序给庄家再发1张。发完庄家14张，三名闲家各13张……”“庄家直接进入首个操作阶段，首轮出牌前无需再摸1张。”","problem":"规则基准把庄家第14张定义为“摸”，并单独进入“首摸等待”阶段以计算首摸听牌提示；需求文档把第14张并入发牌批次下发，且明确“首轮出牌前无需再摸1张”，等于取消首摸阶段，未定义首摸等待的存在时长、进入标志与首摸听牌提示的触发时点。","impact":"服务端状态机缺少“首摸等待”环节；庄家“14张打哪张→听什么牌”的首摸提示失去唯一触发点，只能退化为出牌阶段提牌时才出现；测试无法验证首摸阶段是否存在及时序。","suggestion":"二选一并全篇统一：A. 按规则恢复“庄家摸第14张→进入首摸等待并下发首摸听牌提示→进入出牌”；B. 若确为产品定制直接发14张，则显式写“本期不设首摸等待，庄家首摸听牌提示在首个出牌阶段首次提牌时下发”，并说明与规则基准的差异及理由。\n\n**验收口径**：\n文档明确首摸阶段是否存在及其时序；若存在，给出进入/结束条件与首摸听牌提示下发时点；测试可据此验证庄家第14张的来源与首摸提示触发时机。","status":"待确认","has_detail":true},{"id":"PRD-072","title":"抢杠胡被要求满足庄闲放铳条件，隐含限定庄闲关系，与规则不限庄闲冲突","priority":"P1","type":"逻辑错误","module":["响应动作"],"source_location":"默认规则 > 本期固定生效 > 胡牌玩法；二、功能详情 > 规则详情 > 庄闲放铳（庄3）；规则详情 > 杠 > 抢杠胡","original_text":"「固定庄闲放铳（庄三）。保留自摸，点炮和抢杠胡按庄闲放铳的适用条件判定。」；「他人加杠时，须在创房面板开启“庄闲放铳(庄三)”，并满足该选项的放铳条件，才可抢杠胡。」","problem":"规则基准对抢杠胡只要求：开启抢杠玩法、开启庄闲放铳且当前三牢，并且「除杠牌者外，其他玩家均可抢，不限庄闲关系」。需求文档写成「满足该选项的放铳条件」，而放铳条件明确包含「出牌者与胡牌者一方为庄家、另一方为闲家」，等于把抢杠胡限定为庄闲之间，闲家抢闲家的杠被排除；同时缺少独立「抢杠」玩法开关的配置描述。","impact":"闲家之间加杠时，闲家抢杠胡会被错误拒绝，胡牌权限判定与结算赔付方全部偏离；测试按文档能写出「闲家不得抢闲家杠」的错误用例，验收时无法与规则基准对齐。","suggestion":"把抢杠胡判定改写为：前置＝开启抢杠玩法＋开启庄闲放铳＋当前三牢；响应人＝除杠牌者外全部玩家，不限庄闲关系；并在默认规则表中补「抢杠：开启」这一固定配置项，与庄闲放铳分开描述。\n\n**验收口径**：\n文档中「抢杠胡」一句不再引用「放铳条件」，改为独立列出「三牢＋抢杠开关，不限庄闲」；用例：三牢局，闲家 B 加杠，另一闲家 C 用第4张牌胡牌成立，赔付出杠者 B；同局庄家加杠，闲家胡牌亦成立。","status":"待确认","has_detail":true},{"id":"PRD-073","title":"加杠被抢杠时写成不完成加杠，缺少补杠还原为碰与杠牌者记录的落地规则","priority":"P1","type":"逻辑错误","module":["响应动作"],"source_location":"规则详情 > 杠 > 明杠（加杠）；规则详情 > 杠 > 抢杠胡；结算流程 > 流程明细（胡牌场景）","original_text":"「先处理其他玩家的抢杠胡响应；有人抢杠胡时不完成加杠，也不补牌；无人胡牌后完成加杠，再按本表“逻辑”补牌。」","problem":"规则基准的顺序是：补杠先成立（下发补杠牌组、记录杠牌者作为抢杠胡赔付方、杠链+1），随后进入抢杠胡窗口；抢杠胡成立后把副露中的补杠还原为碰用于展示，已记摊数维持不变、不因抢杠新增摊数。需求文档改成「有人抢杠胡时不完成加杠」，等于回滚操作，且完全没有写记录杠牌者、补杠还原为碰、摊数不变三项落地内容，导致赔付方认定与展示口径无依据。","impact":"抢杠胡结算时无法确定由谁赔付（是否取记录的被抢杠者）、副露应显示碰还是杠无定义，小结算的手牌摆布与承包标识缺少数据来源；开发与测试对同一场景会得出两种实现。","suggestion":"按基准改为两段式：①加杠成立即下发杠牌组、记录杠牌者供抢杠胡赔付、杠链+1；②进入抢杠胡窗口，无人抢则补牌，有人抢则把该副露还原为碰展示并保持摊数不变、本次不补牌。\n\n**验收口径**：\n文档出现「记录杠牌者（抢杠赔付方）」「抢杠胡成立后补杠还原为碰展示」「摊数不变、不新增摊数」三条明确表述；用例：三牢局 B 加杠 5筒，C 用 5筒抢杠胡，结算仅 B 赔付，B 的碰杠区显示为碰 5筒，B→C 摊数不变。","status":"待确认","has_detail":true},{"id":"PRD-074","title":"飘财一圈需第4摊才触发承包，与累计3摊即承包冲突（本类主条目，PRD-125 同根因）","priority":"P1","type":"逻辑错误","module":["特殊规则"],"source_location":"二、功能详情 > 玩法规则 >【三摊承包】表（末条）、「基础名词·【承包】」、「三摊承包」表","original_text":"飘财的玩家飘财时的一圈，当其他玩家抓打的牌导致飘财者吃碰达到三摊时，不触发承包机制，需要第4摊时才触发","problem":"规则基准是庄闲之间累计3摊即形成承包，没有“飘财期间需第4摊”的例外。需求文档在同一张表里既写“累计达到3摊触发承包机制”，又追加飘财期间第4摊才触发的例外，且未定义“飘财时的一圈”“抓打的牌”的口径（是否含飘财发起者本人摸打、是否跨圈累计、第4摊是否也受闲闲2摊限制），与规则基准和表内前文均冲突。","impact":"同一局相同的吃碰次数会得出“触发/不触发承包”两种结果，结算金额不可复现；测试无法给出稳定断言。","suggestion":"二选一：删除该例外，回到“庄闲累计3摊即承包”；或保留但给出精确定义（计时边界、计数起点、与飘等级的关系），并声明其为本项目差异项。\n\n**需要补的内容与必填格式**：\n若保留例外，必须新增《飘财期间摊计数》表，必填列：飘财发起者、受限座位、计数是否累加、例外生效的起止时点、与闲闲2摊上限的关系\n\n**范例（需求必须按此格式写）**：\n正常（按规则基准）：A（庄）对B（闲）本局第3次吃B的弃牌，立即形成承包关系，B后续成为A胡牌的付款人（示例值以产品确认为准）。异常（若保留文档例外）：A飘财期间对B吃到第3摊，不形成承包；飘财结束后A再吃B 1张达第4摊才形成承包（示例值以产品确认为准）。\n\n**验收口径**：\n文档只保留一种口径且能逐条复现：给定吃碰事件序列，能唯一算出是否形成承包以及从第几摊起生效。","status":"待确认","has_detail":true},{"id":"PRD-075","title":"抢杠胡赔付按“同放铳”与规则“三家钱”相反（本类主条目，PRD-022 同根因）","priority":"P1","type":"逻辑错误","module":["结算与结束"],"source_location":"二、功能详情 > 规则详情 > 基础操作及规则 >【杠】表 > 抢杠胡行；玩法规则 >【三摊承包】表、二、功能详情＞玩法规则＞【杠】＞抢杠胡；二、功能详情＞算分规则；玩法规则＞【放铳】","original_text":"赔付方式同放铳，仅被抢杠的加杠者按放铳规则赔付，其他玩家不出分；不表示由其承担所有玩家原本应付分数的总和","problem":"规则基准：抢杠胡时杠牌者保留“三家钱”赔付，承包、倒承包在其上独立叠加、不互相抵消。需求文档写“赔付方式同放铳、仅加杠者按放铳赔付、其他玩家不出分”，并明确否认承担其他玩家应付分数的总和，与“三家钱”结论相反；同时全文未说明抢杠胡时承包、倒承包如何叠加。","impact":"抢杠胡单局输赢金额按两种口径相差约3倍，叠加承包后差异更大；结算与前端飘分展示均无法验收。","suggestion":"按规则基准改为杠牌者支付三家钱，并给出“三家钱×承包倍数”的叠加公式与金额示例；若确定采用文档口径，需作为与规则基准的差异项单独声明。\n\n**需要补的内容与必填格式**：\n新增《抢杠胡赔付》表，必填列：情形（无承包/杠牌者被承包/杠牌者倒承包）、各家付款公式、是否与其他承包关系叠加、总赔付示例\n\n**范例（需求必须按此格式写）**：\n正常：A加杠，B抢杠胡，牌型4倍、底分1，A按三家钱各付4分共12分；若B对A已满3摊形成倒承包，A再额外支付12分，合计24分（示例值以产品确认为准）。异常：抢杠胡无人形成承包关系，仅A支付三家钱12分，C、D不出分（示例值以产品确认为准）。\n\n**验收口径**：\n抢杠胡的付款家数、金额公式与承包叠加顺序在文档中唯一确定，测试可算出确定的结算结果。","status":"待确认","has_detail":true},{"id":"PRD-076","title":"承包金额按“胡牌分×3”计算，闲家自摸时少算","priority":"P1","type":"逻辑错误","module":["结算与结束"],"source_location":"玩法规则＞【三摊承包】；名词介绍＞【承包】【倒承包】","original_text":"B需承包所有输分（支付其他三家的赔付）- 示例：B赔付 = 胡牌分 × 3（如庄家自摸8分×3=24）…A赔付 = 胡牌分 × 3 × 2（如闲家自摸4分×6=24元）","problem":"规则基准的承包基数是“全部输分”，即本局按基础赔付逐家计算后各付款方应付金额之和。文档把基数固定为“胡牌分×3”，只在庄家自摸（三家倍数相同）时成立；闲家自摸时庄家付牢庄倍数、其他两个闲家只付1倍，三家金额不同，×3 会严重少算——文档举的“闲家自摸4分×6=24”在8倍庄下应为(4×8＋4＋4)×2=80。","impact":"承包／倒承包金额系统性偏小，跨端对账不一致；测试按文档写断言会放过错误实现。","suggestion":"把基数改为“全部付款方应付金额之和”，计算步骤化：先按胡型逐家算出应付，再求和作为承包基数，最后乘1或2；示例分别给庄家自摸与闲家自摸。\n\n**需要补的内容与必填格式**：\n承包章节改为三段：基数定义｜逐家付款表（座位｜应付｜倍数）｜承包／倒承包金额；示例覆盖庄家自摸、闲家自摸、点炮。\n\n**范例（需求必须按此格式写）**：\n正常：4人局、底分1、牌型2倍、三牢8倍，闲家A自摸→庄付16、两闲各付2，全部输分20；A对庄满3摊，庄承包付20，其余两家0。异常：同参数下庄家自摸→三闲各付16，全部输分48，承包方付48。示例值以产品确认为准。\n\n**验收口径**：\n文档给出逐家付款表与合计，任意参数下“承包方付款＝其他座位应付之和×1或×2”可人工复核；示例数字与公式一致。","status":"待确认","has_detail":true},{"id":"PRD-077","title":"发牌动画挂在本条消息，与由摸牌消息驱动冲突","priority":"P1","type":"逻辑错误","module":["开局"],"source_location":"发牌 > 发牌UI以及动画表现 > 动画表现","original_text":"约7.5秒｜首批入场。…自己的前4张牌先以背面出现在手牌区左侧，四个客户端按同一批次播放。","problem":"规则基准明确：发牌消息不直接刷手牌、也不播发牌动画，真实表现由紧随其后的摸牌消息完成，只收到发牌消息不会出现发牌动画；自己的手牌由第一次摸牌触发逐张立起、再自动排序并在结束时确认。需求文档把4＋4＋4＋1分批入场、翻开、倒下理牌全部写在发牌消息的表现里，未说明与摸牌消息的先后依赖。","impact":"客户端若按文档在发牌消息直接播动画，随后摸牌消息会再次触发入场与立牌，出现动画重入、牌张重复或发牌完成态错乱。","suggestion":"把发牌小节标注为数据消息，只写手牌写入、记牌器扣除与余牌数；动画表现迁移到「发牌→摸牌」链路，写明第一次摸牌触发四家立牌与本家排序。\n\n**验收口径**：\n只下发发牌消息时界面无发牌动画；发牌与摸牌连续下发时只出现一次立牌与排序，牌张数量正确。","status":"待确认","has_detail":true},{"id":"PRD-078","title":"白板财神未靠左排序且缺染色与禁打置灰（本类主条目，PRD-119 同根因）","priority":"P1","type":"逻辑错误","module":["牌桌区域"],"source_location":"发牌 > 发牌UI以及动画表现（约8.8–9.4秒）；3.3.4 手牌信息（庄家/闲家手牌排序）；3.3.2 玩法信息-财神、三-3.3.5 手牌信息；三-4.4 行牌操作（提牌、出牌）；三-6.2.2 小结算界面（手牌摆布）","original_text":"13张主体手牌从左到右依次排列为万、条、筒、东、南、西、北、中、发、白。；风牌从左到右是东南西北中发白","problem":"规则要求财神牌在手牌中重排后靠左、染成红色，并刷新禁打置灰；桌面所有明牌（自家与三家的河牌、副露、胡牌区）的财神统一染色。需求文档把手牌排序固定为「万条筒…中发白」，本期财神白板永远落在最右；全文只在结算页出现「手牌里的财神也有需要染色」，缺靠左、染红、禁打置灰与三家明牌染色。","impact":"财神位置与颜色错误，玩家难以识别财神；缺禁打置灰会与吃碰禁手提示冲突，验收无依据。","suggestion":"在发牌理牌与手牌信息中补充：财神统一排在最左（多张按牌序）、染红、禁打时置灰；新增「财神显示总则」覆盖手牌、河牌、副露、胡牌区。\n\n**需要补的内容与必填格式**：\n新增「财神显示总则」表：区域｜是否染色｜排序位置｜是否置灰｜与普通牌的差异\n\n**范例（需求必须按此格式写）**：\n正常：本家手牌含1张白板（财神），理牌后白板排在最左并染红，吃碰禁手期间该白板压暗不可提起（示例值以产品确认为准）。异常：白板作为弃牌进入牌河后，牌河中该牌同样染红，副露与胡牌区按同一总则执行。\n\n**验收口径**：\n任意含财神的手牌截图：财神位于最左且为红色；禁手牌压暗；三家明牌中的财神同为红色。","status":"待确认","has_detail":true},{"id":"PRD-079","title":"倒计时最后3秒颜色与提示音与规则基准冲突","priority":"P1","type":"逻辑错误","module":["牌桌区域"],"source_location":"三.对局流程 → 局中信息 → 方位信息（倒计时行）；三.对局流程 → 局中信息 → 方位信息（方位盘表·弃牌响应、出牌倒计时）","original_text":"中央用两位数字显示当前阶段剩余秒数，按秒递减，普通数字为蓝青色，03、02、01、00为黄色。","problem":"规则基准要求最后3秒换红色字体并播放倒计时提示音，且超过8秒未操作要提示“尽快操作”；需求文档写的是最后3秒（03、02、01、00）为黄色，且完全没提倒计时提示音和8秒催促提示。两者颜色结论相反，缺两项行为。","impact":"客户端会按黄色实现，验收时与规则基准不符；缺少提示音与催促提示会导致超时体验无引导，且无法判定“何时开始催促”。","suggestion":"二选一并明确生效：若沿用规则基准则改为红色并补提示音与8秒催促；若确实改为黄色，需在文档写明“与规则基准不一致，以本文为准”，并补齐提示音与催促时点。\n\n**需要补的内容与必填格式**：\n表格，必填列：剩余秒数区间（10~4 / 3 / 2 / 1 / 0）| 字体颜色 | 是否播放提示音 | 是否显示催促文案 | 触发时点\n\n**范例（需求必须按此格式写）**：\n正常：倒计时剩4秒显示蓝青色“04”无提示音；剩3秒起数字变红色并播放滴答提示音，依次显示03、02、01；剩余时间超过8秒仍未操作时，桌面中央显示“请尽快操作”提示。异常：弃牌进入吃碰杠胡响应阶段时，所有视角（含没有按钮的玩家）同步切到响应倒计时，同样从第3秒起变红并播放提示音，未获按钮的视角仍保留原出牌者方位高亮。示例值以产品确认为准。\n\n**验收口径**：\n颜色、提示音、催促提示三个要素在常规出牌与响应阶段两套倒计时下均有明确取值，且与规则基准一致或已声明覆盖；测试可直接出“第3秒变红/提示音播放/第8秒催促”3条用例。","status":"待确认","has_detail":true},{"id":"PRD-080","title":"禁打牌由客户端自行推导，与下发制冲突","priority":"P1","type":"逻辑错误","module":["特殊规则"],"source_location":"三.对局流程 → 行牌操作｜修改对比版（出牌行）；二.功能详情 → 规则详情 → 玩法规则 → 【吃碰禁手】","original_text":"本家处于出牌阶段且目标牌允许打出时，才可提交出牌。当前小局启用吃碰禁手。吃或碰成立并进入本家出牌阶段时，按「吃碰禁手」判定本次禁打牌，禁打牌压暗且不可提起。","problem":"规则基准是服务端计算并下发禁打数据，客户端只做记录、置灰不自行判定；需求文档要求客户端在吃/碰成立后“按「吃碰禁手」判定本次禁打牌”，把规则计算放在客户端，且没有引用任何下发数据。","impact":"客户端与服务端两套判定易出现分歧（如碰后当场加杠、多吃选不同组合、飘财限制叠加时），会出现“客户端压暗的牌服务端允许打出”或反之，且无法通过改服务端修复。","suggestion":"改为：客户端接收“出牌限制”数据（禁打手牌列表、禁打单放牌值），在当前操作者是自己且收到权限时按数据压暗；删除“客户端按吃碰禁手判定”的表述，只保留“吃碰后进入出牌阶段时按已接收的禁打数据置灰”。\n\n**验收口径**：\n文档中禁打牌值只来源于服务端下发，客户端不再包含判定逻辑；测试可用“下发禁打6条→6条不可打”“下发空列表→全部可打”直接出用例。","status":"待确认","has_detail":true},{"id":"PRD-081","title":"小结算删除倍数展示，与规则要求冲突（与 PRD-091 同根因，重复登记，建议合并）","priority":"P1","type":"逻辑错误","module":["结算与结束"],"source_location":"结算界面·小结算界面（好友房）·UI交互以及说明 第6项「赢家结算」","original_text":"「6｜赢家结算｜展示本局胡牌番型~~和倍数~~」——「和倍数」以删除线标出，即本期只显示番型名称、不显示倍率。","problem":"规则基准明确要求小结算展示胡牌类型与倍数，需求文档用删除线删掉倍数只留番型名。而本方案得分由「底分×倍数×庄闲倍数」算出，隐藏倍数后玩家与客服都无法核验分数来源，也使番型表的倍数列在小结算里完全失效。","impact":"小结算核心数值缺失，玩家质疑分数时无界面依据；测试无法据界面复核倍数是否正确；回放核对时缺少展示口径。","suggestion":"与 PRD-091 合并处理：恢复倍数展示（或直接在番型名后输出倍率，如「杠飘×32」），并写明倍率取值来源、是否已含庄闲倍数（避免与牢庄倍率重复相乘的误读）。\n\n**需要补的内容与必填格式**：\n小结算第6项改为表格：列＝展示项（番型名称｜番型倍率｜承包标记｜是否叠加牢庄倍率）｜取值来源｜显示示例；并规定复合番型的拼接格式。\n\n**范例（需求必须按此格式写）**：\n正常：「杠飘×32（二连杠，双财飘）」，倍率取番型表第26行，牢庄倍率不在此处重复展示（示例值以产品确认为准）。异常：相同番型但承包生效时显示「杠飘×32（二连杠，双财飘）·承包」，赔付说明交给承包样式（示例值以产品确认为准）。\n\n**验收口径**：\n小结算每行同时可见番型与倍率，且与番型表、最终得分三处一致；测试可用界面数字反算得分并通过。","status":"待确认","has_detail":true},{"id":"PRD-082","title":"碰算摊关闭后碰与明杠是否计摊未定义（本类主条目，PRD-084 同根因）","priority":"P1","type":"定义歧义","module":["特殊规则"],"source_location":"默认规则（本期固定生效·承包与行牌）；基础名词和概念解释（摊）；玩法规则（三摊承包）、基础名词和概念解释 > 名词介绍 >【摊】；默认规则 > 本期固定生效（承包与行牌）","original_text":"启用三摊承包和吃碰禁手，碰算摊关闭。另：吃、碰、明杠是否计摊，由创房面板的对应配置决定，例如“碰算摊”。","problem":"术语“摊”指玩家A用玩家B打出的牌完成一次吃、碰或明杠后，按配置记入A从B取得的摊数。规则基准中“碰算摊”的生效说明为“碰/明杠记摊”，即该开关关闭时碰与明杠都不计摊、只有吃计摊。需求文档只写“碰算摊关闭”，并以“例如‘碰算摊’”“由配置决定”表述，未说明本局计摊的唯一来源，也未说明关闭后明杠是否仍+1摊，实现者可理解成“关闭只影响碰，明杠照计”。","impact":"三摊承包的触发时点（第3摊）会提前或延后，承包/倒承包的赔付对象与金额随之出错，“三摊落地”提示也会误触发。","suggestion":"在摊的名词条目中直接写明本期计摊规则：碰算摊=关闭时仅“吃”计摊，碰与明杠不计摊；并声明“明杠是否计摊仅由碰算摊控制”，删除“例如”这类含糊举例。\n\n**需要补的内容与必填格式**：\n新增“本期计摊表”，必填列：操作（吃/碰/明杠）、碰算摊关时是否计摊、碰算摊开时是否计摊、控制该列的配置项\n\n**范例（需求必须按此格式写）**：\n正常：碰算摊=关，A吃B的牌2次、碰B 1次、明杠B 1次，A对B摊数=2，未触发3摊。异常：碰算摊=关，A吃B的牌3次，A对B摊数=3，A胡牌时由B承包全部输分（示例值以产品确认为准）。\n\n**验收口径**：\n给定一段吃碰杠记录，可唯一算出A对B摊数并与承包触发一致；测试可用上例直接判定。","status":"待确认","has_detail":true},{"id":"PRD-083","title":"本期固定配置未逐项列全且未标不生效项","priority":"P1","type":"描述不完整","module":["房间配置"],"source_location":"本期开发范围；默认规则（本期固定生效、本期可选规则）；二、功能详情 > 游戏规则概述（对局人数）；玩法规则（局数）","original_text":"本期可选规则：无。进入房间后直接使用以上固定配置。另第54行仍写“支持2人、3人、4人三种对局人数，由创建房间时在创房面板中选择”。","problem":"规则基准4.1列出三十余个配置项及好友房默认值，包含十风牌（好友房默认开）、吃碰次数限制（默认0）、财神替豪七（默认关）、只碰不吃、缺一色、去风、跟庄、守庄、简洁模式、单局输分封顶、片数、做牌、明牌、托管等。需求文档只给出7条固定值（四人8局、白板财神、随机庄、赢家坐庄、流局连庄、笃三、庄闲放铳、三摊承包、碰算摊关、底分1、无封顶），其余项既未给本期取值，也未声明关闭；同时其他章节仍以可选项口吻描述2/3人、片数、翻财神、平庄起、笃二、仅自摸、两摊封顶，仅用一句“仅作原文上下文”概括，实现范围无法确认。","impact":"服务端按好友房默认加载时“十风牌”默认开，会引入“连续10张字牌获胡牌资格”这类需求文档完全未描述的行为；开发也可能误实现2/3人桌与片数模式，导致核心流程范围外蔓延。","suggestion":"新增“本期固定配置表”，把规则4.1每个配置项逐一列出并标注本期取值与是否生效；对不生效项写明“代码开关关闭、收到该配置时忽略并记录日志”，并把2/3人、片数、翻财神、平庄起、笃二、仅自摸、两摊封顶列入“本期不生效清单”。\n\n**需要补的内容与必填格式**：\n新增表格，必填列：配置项、规则4.1好友房默认、本期取值、是否生效、不生效时的处理；另附“本期不生效玩法清单”章节\n\n**范例（需求必须按此格式写）**：\n正常：十风牌｜好友房默认开｜本期关闭｜不生效：不提供连续10张字牌的胡牌资格。异常：翻财神｜好友房默认0白板｜本期仅白板｜代码收到取值1时忽略并记录配置非法日志（示例值以产品确认为准）。\n\n**验收口径**：\n规则4.1每个配置项在本期配置表中都有唯一取值与生效标记，页面/服务端按表加载结果一致；测试可逐项核对开关。","status":"待确认","has_detail":true},{"id":"PRD-084","title":"摊计数口径不明：吃是否恒计、暗杠补杠是否计（与 PRD-082 同根因，重复登记，建议合并）","priority":"P1","type":"描述不完整","module":["特殊规则"],"source_location":"基础名词和概念解释 > 名词介绍 >【摊】；默认规则 > 本期固定生效（承包与行牌）","original_text":"吃、碰、明杠是否计摊，由创房面板的对应配置决定，例如“碰算摊”；具体判定见对应模块；…启用三摊承包和吃碰禁手，碰算摊关闭","problem":"规则基准：吃恒记摊（不受开关影响），碰与明杠是否计摊由碰算摊决定，暗杠、补杠一律不记摊。需求文档把吃也写成“由创房配置决定”，且全文没有暗杠、补杠是否计摊的规定。本期碰算摊关闭，实际只有吃能产生摊，文档未说明这点，导致“庄闲累计3摊”是否可达、闲闲2摊上限约束对象都不明确。","impact":"摊数统计是承包触发的基础，口径不清会直接导致承包误触发或永不触发；测试无法构造达到3摊的用例。","suggestion":"与 PRD-082 合并处理：改为与规则基准一致：吃恒计1摊；碰、明杠看碰算摊开关；暗杠、补杠计0摊。并注明本期碰算摊关闭时仅吃可产生摊。\n\n**需要补的内容与必填格式**：\n新增《摊计数规则》表，必填列：操作类型（吃/碰/直杠/加杠/暗杠）、是否计摊、受哪个开关控制、计数方向（从谁取得）、备注\n\n**范例（需求必须按此格式写）**：\n正常：C吃上家D的弃牌，C从D取得1摊，不受碰算摊开关影响（示例值以产品确认为准）。异常：C暗杠自己手中4张5条、C对已碰出的刻子加杠，两种操作均计0摊，不影响任何方向的摊数（示例值以产品确认为准）。\n\n**验收口径**：\n表中覆盖吃、碰、直杠、加杠、暗杠五种操作，且本期开关组合下能唯一算出摊数。","status":"待确认","has_detail":true},{"id":"PRD-085","title":"飘等级与敲响条件、归零规则缺失，财飘倍数无法判定","priority":"P1","type":"描述不完整","module":["特殊规则"],"source_location":"二、功能详情 > 基础名词和概念解释 >【飘】；胡牌番型介绍 > 番型介绍（序号3、4、5）","original_text":"财飘|4倍|打出1张财神下一圈爆头；双财飘|8倍|连续打出2张财神下一圈爆头；三财飘|16倍|连续打出3张财神下一圈爆头","problem":"规则基准定义“飘等级”：打出财神且打出后手牌敲响才+1，否则飘等级归0且杠链清零；打出非财神时出牌者飘等级归0；吃、碰、杠本身不清飘等级，但吃、碰会清杠链；每次打出财神飘次数+1。需求文档只有“打出1张财神”“连续打出2张财神”的描述，未定义敲响、飘等级的增减与归零、杠链的清除条件，“连续”是仅指相邻两圈还是整局累计也不明确。","impact":"财飘、双财飘、三财飘及杠飘系列（4~256倍）的落档不可唯一判定，同一手牌可能算出不同倍数，结算金额不可验收。","suggestion":"补“飘等级状态机”小节，写清事件与对应的飘等级、杠链变化，并给出“连续”的判定口径与中断条件。\n\n**需要补的内容与必填格式**：\n新增《飘等级与杠链变化》表，必填列：事件（打出财神且敲响/打出财神未敲响/打出非财神/吃/碰/明杠/暗杠）、飘等级变化、杠链变化、对应番型、备注\n\n**范例（需求必须按此格式写）**：\n正常：A打出白板后手牌满足敲响，飘等级由0升为1；下一圈A再打出白板且仍敲响，飘等级升为2，按双财飘8倍计（示例值以产品确认为准）。异常：A打出白板但未敲响，飘等级归0且杠链清零，本次不计财飘倍数；A随后吃牌，飘等级仍为0，杠链保持0（示例值以产品确认为准）。\n\n**验收口径**：\n给定一局内打出财神、吃、碰、杠的时序，能唯一算出胡牌时的飘等级与对应倍数，测试可按表逐行出用例。","status":"待确认","has_detail":true},{"id":"PRD-086","title":"七对系列未定义四张相同组数算法与带财/无财归属","priority":"P1","type":"描述不完整","module":["番型与倍数"],"source_location":"胡牌番型介绍 > 番型介绍（序号10~17 七对系列）、名词介绍（爆头）","original_text":"“｜11｜｜豪华七对｜4倍｜七对中有2对相同｜”；“｜12｜｜双豪华七对｜8倍｜七对中有2组相同的2对｜”；“｜14｜｜清七对｜4倍｜无财神的七对｜”；“｜15｜｜豪华清七对｜8倍｜清七对中有2对相同｜”。","problem":"规则基准把七对拆成带财神组（手牌财神数>0：七对2/豪华4/双豪华8/三豪华16）与无财神组（清七对4/豪华清8/双豪华清16/三豪华清32），并要求“四张相同组数”按扣除财神补成单张后的真实张数计算；财神替豪七开启时按财神预算从少到多贪心升级、纯财神组不算、命中最高档后停止；另有附加条件“有财必拷响开启且自摸时进张必须与财神成将”。文档只写“有2对相同／2组相同的2对”，既没有带财/无财的归属条件，也没有财神补牌参与四张组数的计算口径，同一手牌（无财神且含一组4张）按文档既可解读为豪华七对4倍，也可解读为豪华清七对8倍。","impact":"七对系列6个档位无法唯一实现；财神替豪七开关下的档位归属无法验证；同一手牌可能出现4倍与8倍两种实现结果，结算对不上。","suggestion":"补齐七对系列表的两组归属列与“四张相同组数计算”步骤，并说明财神补成的单张如何从真实张数中扣除、纯财神组为何不计。\n\n**需要补的内容与必填格式**：\n七对系列表必填列：番型｜倍数｜手牌财神数（>0／＝0）｜四张相同组数｜附加条件。另增「四张相同组数计算」步骤表，必填列：步骤｜规则｜财神替豪七开启时算法｜财神替豪七关闭时算法｜示例。\n\n**范例（需求必须按此格式写）**：\n正常：白板为财神，手牌财神1张，拆解为5万×2、6万×2、7条×2、8条×2、9筒×2、东×2、白板+南风成将，四张相同组数=0，命中七对2倍（示例值以产品确认为准）。异常：手牌无财神，5万×4、6万×2、7条×2、8条×2、9筒×2、东×2、南×2，四张相同组数=1，命中豪华清七对8倍，不得按豪华七对4倍计（示例值以产品确认为准）。\n\n**验收口径**：\n给定含0/1/2/3组四张的手牌，且分别在有财神与无财神两种情况下，档位与倍数唯一确定；财神替豪七开/关两组用例结果与文档一致。","status":"待确认","has_detail":true},{"id":"PRD-087","title":"二/三/四连杠的杠链计数与打断条件缺失（与 PRD-025 同根因，重复登记，建议合并）","priority":"P1","type":"描述不完整","module":["行牌循环"],"source_location":"胡牌番型介绍 > 番型介绍（序号6~9）、基础操作及规则 > 【杠】杠开行","original_text":"“｜7｜｜二连杠｜4倍｜连杠二次接着自摸｜”“｜9｜｜四连杠｜16倍｜连杠四次接着自摸｜”；“允许连续杠：若杠后补牌未胡，而在未出牌的情况下继续合法开杠，使用最后一次杠后补到的牌立即自摸胡牌，同样算杠开。”","problem":"规则基准要求杠开系列按杠链=1/2/3/≥4分档、组内互斥取最高档、点炮与抢杠不命中、杠链必须是未被非财神出牌/吃/碰打断的有效链。文档只写“连杠二次/三次/四次接着自摸”，未定义杠链计数口径（他人吃碰、抢杠胡、杠后补牌后打牌是否清零），未写组内取最高档，未写点炮与抢杠不成立，四连杠写作“四次”而规则为“≥4”（5次及以上无归属档）。","impact":"连杠档位可能被重复计（如二连杠与三连杠同时命中）；被打断后的杠仍可能被误判为连杠；四连杠在第5次杠时无明确档位，结算倍数不确定。","suggestion":"与 PRD-025 合并处理：补充杠链定义与打断条件，明确组内取最高档与点炮/抢杠不命中，并把四连杠阈值改为“杠链≥4”。\n\n**需要补的内容与必填格式**：\n杠开系列表必填列：番型｜倍数｜杠链值（=1／=2／=3／≥4）｜胡牌来源要求（仅自摸）｜打断条件｜组内取档规则｜点炮与抢杠是否成立。\n\n**范例（需求必须按此格式写）**：\n正常：连续3次杠且每次补牌均未胡、未出牌，第3次补牌自摸，杠链=3，命中三连杠8倍，不再计二连杠与杠上开花（示例值以产品确认为准）。异常：第2次杠后补牌未胡并打出1张非财神牌，再开第3次杠自摸，杠链被打断重算为1，仅命中杠上开花2倍（示例值以产品确认为准）。\n\n**验收口径**：\n杠链=1/2/3/4/5五种输入的命中档位唯一，第5次仍按四连杠16倍；被打断场景只计打断后的杠链；点炮与抢杠场景不命中杠开系列。","status":"待确认","has_detail":true},{"id":"PRD-088","title":"财神系列的飘等级计数与自摸前提未定义","priority":"P1","type":"描述不完整","module":["特殊规则"],"source_location":"胡牌番型介绍 > 番型介绍（序号2~5）、名词介绍 > 【飘】","original_text":"“｜3｜｜财飘｜4倍｜打出1张财神下一圈爆头｜”“｜4｜｜双财飘｜8倍｜连续打出2张财神下一圈爆头｜”“｜5｜｜三财飘｜16倍｜连续打出3张财神下一圈爆头｜”；“允许多名玩家先后飘财，并分别记录每次飘财的限制…当该次飘财的发起玩家下一次摸牌时，解除由该次飘财产生的限制”。","problem":"规则基准以“飘等级”分档：爆头=0、财飘=1、双财飘=2、三财飘≥3，必须自摸、必须“进张与财神成将”、飘等级严格对应档位不跨档、组内取最高档。文档只用“打出1/2/3张财神”“下一圈/连续”描述，未定义飘等级计数口径（是否累计同一玩家本局所有飘、中间摸牌未胡是否继续累计、中间打出非财神是否清零、飘限制解除后档位是否保留），未写“≥3归三财飘”（打出第4张财神如何计），也未把“必须自摸”和“进张与财神成将”写成显式前提。","impact":"财神系列4个档位归属不唯一（例如“飘→摸牌未胡→再飘”是否算双财飘），实现与验收都无依据；含4张财神出牌时倍数可能被算成32或其他值。","suggestion":"补“飘等级”定义与计数/清零规则，明确档位对应关系为0/1/2/≥3，并把必须自摸、进张与财神成将、组内取最高档写成表内必填条件。\n\n**需要补的内容与必填格式**：\n财神系列表必填列：番型｜倍数｜飘等级｜胡牌来源（仅自摸）｜飘等级累计条件｜飘等级清零条件｜附加条件（进张与财神成将）｜组内取档规则。\n\n**范例（需求必须按此格式写）**：\n正常：玩家打出财神→下巡摸牌未胡并打出非财神牌→再次打出财神→下巡摸牌自摸爆头，飘等级=2，命中双财飘8倍（示例值以产品确认为准）。异常：玩家打出财神→下巡摸牌未胡（飘限制按规则解除）→此后不再打出财神，最终自摸爆头，飘等级=1，命中财飘4倍（示例值以产品确认为准）。\n\n**验收口径**：\n飘等级=0/1/2/3/4五种输入对应番型唯一（3与4均为三财飘16倍）；未与财神成将时即使有财神也不命中财神系列；点炮胡不命中财神系列。","status":"待确认","has_detail":true},{"id":"PRD-089","title":"杠飘/飘杠高阶档位拆分与飘杠倍率范围不可实现","priority":"P1","type":"描述不完整","module":["番型与倍数"],"source_location":"胡牌番型介绍 > 番型介绍（序号22~34）、结算界面 > UI交互以及说明（序号6 赢家结算 番型结算要求）","original_text":"“｜26｜｜｜32倍｜二连杠后双财飘｜”“｜33｜｜｜256倍｜四连杠后三财飘｜”“｜34｜｜飘杠｜8\\~256倍｜财飘后杠开，倍率与杠飘对应｜”；“比如：二连杠二财飘，在结算上显示的是：杠飘\\*32（二连杠，双财飘）”。","problem":"规则基准规定杠飘/飘杠只在基础档（杠链=1且飘等级=1）拆分，更高档不拆分、按杠上开花系列与财神系列连乘，且飘杠先后由“杠执行时的飘等级”决定（>0为飘杠，否则为杠飘）。文档把二连杠后财飘、二连杠后双财飘直至四连杠后三财飘共12档全部列为独立番型，与规则口径冲突；飘杠只给“8~256倍 倍率与杠飘对应”的区间而没有逐档数值，也没有飘杠成立流程（飘→杠→补牌爆头）与先后判定时点；结算展示示例又把杠链=2、飘等级=2的组合命名为“杠飘*32”，与番型表中杠飘=8倍不一致。","impact":"服务端番型ID与客户端结算文案会不一致；飘杠因缺逐档数值无法实现；测试无法判定“二连杠+双财飘”应展示为杠飘还是两个番型连乘展示。","suggestion":"按规则口径收敛：只保留杠飘/飘杠两个组合ID并限定基础档，更高档统一按乘积输出；飘杠补齐逐档数值与成立流程；同步修正结算展示示例。\n\n**需要补的内容与必填格式**：\n组合番型表必填列：组合番型ID｜成立条件（杠链值、飘等级值）｜先后判定时点｜倍数或倍数算式｜是否替换基础番型｜更高档是否拆分（是/否）｜结算展示名称。飘杠另需逐档数值列（杠链1~4 × 飘等级1~3）。\n\n**范例（需求必须按此格式写）**：\n正常：杠链=1、飘等级=1且同次胡牌同时命中，取杠飘8倍，不再单独计杠上开花2×财飘4（示例值以产品确认为准）。异常：杠链=2（4倍）、飘等级=2（8倍），不拆分为杠飘，最终番数=4×8=32，结算展示为“二连杠+双财飘”，不得显示“杠飘*32”（示例值以产品确认为准）。\n\n**验收口径**：\n杠链1~4与飘等级1~3的全部组合都能在表中查到唯一倍数与展示名称；仅杠链=1且飘等级=1出现杠飘/飘杠名称；结算展示示例与番型表口径一致。","status":"待确认","has_detail":true},{"id":"PRD-090","title":"承包只写自摸口径，点炮、抢杠、未参与者处理缺失（与 PRD-002 同根因，重复登记，建议合并）","priority":"P1","type":"描述不完整","module":["结算与结束"],"source_location":"玩法规则＞【三摊承包】；名词介绍＞【承包】【倒承包】","original_text":"承包：A对B累计3摊后，A胡牌，B需承包所有输分（支付其他三家的赔付）…链式承包：A（庄）对B累计3摊 → C对A累计3摊 → A胡牌，B付三家分，C付三家分×2","problem":"文档所有示例都是“胡牌＝三家分”的自摸结构，未说明：①点炮时只处理“放铳者＝承包对方”的对，其他对不结算；②抢杠胡时承包金额独立叠加在原付款上而非替换；③无承包对时保持原付款结构；④多个承包对同时成立时各自按全部基数承担、不共同分摊；⑤双方都满3摊时按倒承包×2。这些直接决定付款人集合与金额。","impact":"点炮、抢杠、多对并列、双向四种场景开发只能猜，可能出现多付、少付或付错人；测试无判定依据。","suggestion":"与 PRD-002 合并处理：按胡型列出承包改写表，明确每种胡型下生效的承包对、付款人集合、倍数、其他座位是否出分，并写清双向都满3摊按倒承包×2。\n\n**需要补的内容与必填格式**：\n承包改写表列为：胡型（自摸／点炮／抢杠胡）｜生效承包对条件｜承包×1｜倒承包×2｜双方都满3摊｜无承包对时｜未参与座位。\n\n**范例（需求必须按此格式写）**：\n正常：4人局，闲家A对庄Z满3摊，A点炮胡且放铳者正是Z，Z承包A全部输分×1，另两家0分。异常：放铳者是闲家B而非Z，不满足点炮生效条件，按普通点炮由B单付，Z不承包。示例值以产品确认为准。\n\n**验收口径**：\n三种胡型各能查到付款人集合与倍数；点炮非承包对方放铳的用例可断言“仅放铳者付”；双方都满3摊的用例可断言按倒承包×2。","status":"待确认","has_detail":true},{"id":"PRD-091","title":"小结算缺胡型、番数、进张、来源玩家，并删除了倍数（本类主条目，PRD-081 同根因）","priority":"P1","type":"描述不完整","module":["结算与结束"],"source_location":"结算界面＞小结算界面（好友房）＞UI交互以及说明 编号3、编号4、编号6、结算界面·小结算界面（好友房）·UI交互以及说明 第6项「赢家结算」","original_text":"编号6 赢家结算：展示本局胡牌番型~~和倍数~~…杠爆/杠飘/七客等复合牌型情况下，统计两侧的数量…牢庄不需要展示","problem":"基准要求结算页展示胡牌玩家、胡型（自摸／点炮／抢杠）、番型名称、番数、进张、来源玩家，以及每名玩家的本局得分与倍数。文档只要求展示番型名称并把“倍数”划掉，也没有胡型、番数、进张、来源玩家，字段不足以让玩家看懂“怎么胡、赢多少、谁点的”。","impact":"结算页信息缺失，玩家与客服无法对账；开发按文档实现会漏下发字段，后续补字段要改协议。","suggestion":"在赢家结算补胡型、番型名称、番数（或明确“番数＝倍数”）、进张牌、来源玩家；恢复倍数展示；每名玩家行增加“本局得分｜倍数”。\n\n**需要补的内容与必填格式**：\n赢家结算字段表：胡型｜番型名称｜番数或倍数｜进张牌｜来源玩家｜承包（有／无）；玩家行字段：昵称｜本局得分｜倍数。\n\n**范例（需求必须按此格式写）**：\n正常：A 点炮胡，来源玩家 B，进张五万，番型“七对”2倍，得分+16。异常：A 爆头自摸，来源玩家填“自摸”，番型“爆头”2倍，其余三家各−16。示例值以产品确认为准。\n\n**验收口径**：\n结算页字段清单与基准9.11必显项一一对应，可用截图逐项核对；点炮与自摸的来源玩家展示不同。","status":"待确认","has_detail":true},{"id":"PRD-092","title":"承包标识只写“展示情况”，未定义赔付方与金额","priority":"P1","type":"描述不完整","module":["结算与结束"],"source_location":"结算界面＞小结算界面（好友房）＞UI交互以及说明 编号5、编号6","original_text":"编号5 承包的标识：用来展示本局承包和反承包的情况｜编号6：承包有单独的样式，但是文字结算也要体现出来","problem":"文档只说“有标识、文字体现”，没有规定明细字段与文案。基准要求随结算下发赔付方、胡牌方、金额、承包／倒承包类型四要素，且明细金额与最终实扣的关系需说明；链式承包（B付12、C付24）这类多对并存场景尤其需要逐条展示。","impact":"承包 UI 无法开发，玩家看不到谁承包谁、承包多少钱；多对并存时容易合并成一条或重复计分。","suggestion":"定义承包明细行字段与文案模板，注明多对并列时分行展示、金额不与最终输赢重复计分，并说明明细口径与最终实扣的关系。\n\n**需要补的内容与必填格式**：\n承包明细行字段：赔付方｜被赔付方（胡牌方）｜类型（承包／倒承包）｜金额；并注明该金额与最终输赢的关系。\n\n**范例（需求必须按此格式写）**：\n正常：闲家A对庄Z满3摊且A胡牌，明细显示“Z 承包 A，全部输分×1，金额20”。异常：链式两家同时成立时显示两行“B 承包 A 12”“C 倒承包 A 24”，不合并成一行。示例值以产品确认为准。\n\n**验收口径**：\n结算页可出现多行承包明细，四个字段齐全且与下发数据一致；测试可逐行断言赔付方、类型、金额。","status":"待确认","has_detail":true},{"id":"PRD-093","title":"骰子点数未说明如何决定牌墙发牌起点（与 PRD-070 同根因，重复登记，建议合并）","priority":"P1","type":"描述不完整","module":["开局"],"source_location":"3.3.1 方位信息（骰子）；发牌 > 发牌逻辑","original_text":"骰子翻滚后停稳，展示本次点数，各家看到同一结果。；以庄家为起点，按逆时针依次从牌序头部给每人同时发4张","problem":"牌墙起点指本局从牌墙哪一墩开始取牌。规则规定掷骰决定从牌墙哪个位置开始发牌，并要求处理起点奇偶（起点为奇数时减一）并记录起点与方向。需求文档只描述骰子「展示点数」的视觉，发牌固定「从牌序头部」开始，未写点数与起点的换算、奇偶对齐、方向来源及异常兜底。","impact":"发牌起点无法实现，或实现成纯装饰；牌张顺序与服务端不一致时，回放与断线校验会出现牌面错乱。","suggestion":"与 PRD-070 合并处理：补一张「骰子→牌墙起点」规则表：点数组合、起点墩位、奇偶处理、取牌方向、异常（点数越界或缺数据）处理，并明确起点以服务端下发为准，客户端只做展示与校验。\n\n**需要补的内容与必填格式**：\n新增表：点数组合｜牌墙起点｜奇偶对齐｜发牌方向｜校验方式｜异常兜底\n\n**范例（需求必须按此格式写）**：\n正常：两骰为3和5，从庄家起逆时针第8墩开始发牌；起点为奇数时减1墩对齐，牌墙余83张（示例值以产品确认为准）。异常：客户端算出的点数与牌墙起点字段不一致，以服务端起点为准继续发牌并记录告警，不使用本地换算。\n\n**验收口径**：\n给定骰子点数能唯一推出起点与首张牌来源；逐局与服务端下发的起点比对一致。","status":"待确认","has_detail":true},{"id":"PRD-094","title":"出牌与吃碰杠胡后操作区收起规则缺失","priority":"P1","type":"描述不完整","module":["响应动作"],"source_location":"三.对局流程 → 行牌操作（原方案表·出牌行）；三.对局流程 → 行牌操作｜修改对比版（出牌）；三.对局流程 → 吃碰杠胡操作（碰牌、吃牌、胡牌表）；三.对局流程 → 多操作状态","original_text":"玩家手牌右上方显示操作按钮：【碰】+【过】……点击【碰】按钮完成对应操作，点击【过】则放弃此次操作","problem":"文档只描述了按钮“长什么样、点了做什么”，没有定义操作区的生命周期：他人获得操作权时自己的按钮是否收起、吃/碰/杠/胡/过成立后按钮与多吃多杠选择何时消失、文字提示何时清除、已胡牌时手牌是否恢复可点、无人有权限时操作区是否回到空状态。","impact":"客户端容易出现“响应阶段结束后按钮残留”“点了过之后按钮还挂着”“已胡后手牌仍可点”等状态错乱，属于高频可见缺陷，且没有验收口径。","suggestion":"新增“操作区状态与收起”表，按事件逐条定义操作区状态、按钮、文字提示、手牌可点性。\n\n**需要补的内容与必填格式**：\n表格，必填列：触发事件（他人获得权限/自己吃成立/自己碰成立/自己杠成立/自己胡/点击过/无人可响应）| 操作区状态 | 按钮 | 多吃多杠选择 | 文字提示 | 手牌可点性\n\n**范例（需求必须按此格式写）**：\n正常：玩家点【碰】后碰成立，操作区立即收起、多吃与多杠选择隐藏、文字提示清空，副露区新增刻子，随后本家进入出牌阶段手牌可点。异常：三家都无权响应时，操作区为空状态，任何按钮都不显示；玩家已胡后手牌恢复原亮度但不可再打出，操作区不显示吃碰杠按钮。示例值以产品确认为准。\n\n**验收口径**：\n每个事件对应的操作区状态唯一，测试可逐事件断言按钮存在性与手牌可点性；可直接产出“碰后收起/过之后收起/已胡恢复手牌”3条用例。","status":"待确认","has_detail":true},{"id":"PRD-095","title":"小结算弹出时机无量化口径","priority":"P1","type":"描述不完整","module":["结算与结束"],"source_location":"结算界面·小结算界面（好友房）·触发逻辑","original_text":"「小结算｜触发条件｜播完胡牌结算流程，进入结算界面」——只有一句定性描述，没有秒数、起点事件、兜底与回放分支。","problem":"规则基准给出：终局摊牌后通知主界面延迟1秒确认、固定约3秒后弹出小结算、与飘分动画时长不联动、回放收到结算即弹。文档只写「播完胡牌结算流程」，未说明以哪个动画结束为起点、几秒、飘分未播完如何处理、回放是否同一路径，无法实现也无法验收。","impact":"客户端不知用定时器还是回调推进，易出现飘分未播完就弹窗或长时间空白；测试无法判定「未弹出」是否为缺陷，也无法写超时用例。","suggestion":"明确起点事件（胡牌结算消息/终局摊牌完成）、固定延迟秒数、与飘分动画的联动约束、兜底推进条件、回放与重连补数据分支。\n\n**需要补的内容与必填格式**：\n触发逻辑改为表格：列＝场景（正常对局/回放/重连补数据）｜起点事件｜延迟秒数｜超时兜底｜是否受飘分动画影响。\n\n**范例（需求必须按此格式写）**：\n正常：收到胡牌结算并完成终局摊牌后固定3秒弹出小结算，即使飘分动画未播完也照常弹出（示例值以产品确认为准）。异常：回放模式收到结算消息立即弹出小结算，不等待3秒（示例值以产品确认为准）。\n\n**验收口径**：\n文档给出可直接编码的起点事件与秒数；测试可写出「飘分卡住→3秒后仍弹出」与「回放→立即弹出」两条用例并通过。","status":"待确认","has_detail":true},{"id":"PRD-096","title":"承包与点炮胡、抢杠胡叠加时的付款人口径未定义（与 PRD-002 同根因，重复登记，建议合并）","priority":"P1","type":"描述不完整","module":["结算与结束"],"source_location":"「三摊承包」表、「放铳」表、「杠·抢杠胡」行、「结算界面·小结算·承包的标识」","original_text":"承包：A对B累计3摊后，A胡牌，B需承包所有输分…示例：B赔付 = 胡牌分 × 3；被承包：…支付三家总和×2；放铳：按放铳方式结算时，仅由放铳者按结算规则支付；抢杠胡：赔付方式同放铳，仅被抢杠的加杠者按放铳规则赔付","problem":"承包金额只用自摸（三家付款）举例。点炮胡时本来只有放铳者付1份，若放铳者恰好是承包方，是仍按×3付款还是只付该笔点炮分，没有写；抢杠胡「三家钱」与承包、倒承包谁叠加谁、是否替换付款人也没写。规则基准对此有明确口径（点炮仅当放铳者本人是承包对方时触发；抢杠胡的承包金额独立叠加），文档未落地。","impact":"点炮和抢杠胡两种高频胡法在承包局都会算错，且与自摸口径不一致；测试无法给出期望金额。","suggestion":"与 PRD-002 合并处理：增加「胡牌方式×承包关系」矩阵，明确每种组合的付款人集合、金额基数、倍数和未参与承包者的出分规则，并同步到小结算的承包标识文案。\n\n**需要补的内容与必填格式**：\n新增矩阵表，必填列：胡牌方式（自摸/点炮/抢杠胡）｜承包关系方向（A对B满3摊/B对A满3摊/双向）｜付款人｜金额基数｜倍数｜其他玩家是否出分｜示例金额\n\n**范例（需求必须按此格式写）**：\n正常：笃三老庄，A（闲）对B（庄）满3摊，B点炮给A，A胡8分：仅B付8分（放铳者即承包方），其他两家0分。异常：按现文「B需承包所有输分×3」直接算成24分，但本局只有一笔点炮分，无三家可承包。\n\n**验收口径**：\n自摸、点炮、抢杠胡 × 承包/倒承包 六种组合都能查到唯一金额；测试可逐格出用例并断言每家得分。","status":"待确认","has_detail":true},{"id":"PRD-097","title":"闲家与闲家最多2摊缺少拦截机制，第3摊行为未定义（与 PRD-055 同根因，重复登记，建议合并）","priority":"P1","type":"描述不完整","module":["特殊规则"],"source_location":"「三摊承包」表、「基础名词·【摊】」、「【吃】」、「【碰】」、「【杠】」","original_text":"仅限庄家与闲家之间可形成3摊；闲家与闲家之间最多2摊（无法触发承包）；摊：玩家A使用玩家B打出的牌完成1次吃、碰或明杠，按本局创房配置计入A从B取得的摊数","problem":"摊的定义对任意两位玩家都计摊，吃、碰、杠三张表也没有任何摊数前置校验，但三摊承包表只声明闲闲「最多2摊」。文档没有写第3次吃/碰/明杠是「按钮不出现」「点了提示」还是「照常执行只是不触发承包」。若照常执行，闲闲会出现3摊并与「最多2摊」矛盾；若拦截，又没有任何执行点描述。","impact":"两个闲家之间第3次吃碰时，客户端按钮、服务端校验、三摊落地动画是否播放全都不确定，容易做成「能操作但不结算」的漏洞。","suggestion":"与 PRD-055 合并处理：在吃、碰、杠三张表各加一条前置校验：三摊承包开启且双方均为闲家、该方向已达2摊时，本次操作不可选并给出统一文案；同时说明该情况是否仍播放三摊落地动画。\n\n**需要补的内容与必填格式**：\n吃/碰/杠三表各增「前置校验」列；另附「摊数-可否操作」矩阵，必填列：当前摊数(0/1/2/3)｜对手身份(庄/闲)｜可吃｜可碰｜可明杠｜提示文案\n\n**范例（需求必须按此格式写）**：\n正常：A、B均为闲家，A已从B取得2摊，B再打出A可碰的牌时，A界面不显示【碰】，只显示【过】，并提示「闲闲之间已达2摊上限」。异常：A仍可点【碰】完成操作，摊数变3，但结算不触发承包，桌面又播放三摊落地。\n\n**验收口径**：\n闲闲方向第3次吃/碰/明杠被拒且提示一致；三摊落地动画是否播放在文档中有唯一答案；测试可逐格验证按钮出现/不出现。","status":"待确认","has_detail":true},{"id":"PRD-098","title":"吃碰杠胡响应倒计时归零后如何处理未定义","priority":"P1","type":"描述不完整","module":["响应动作"],"source_location":"「【碰】」「【吃】」「胡牌」表·交互说明、「方位信息·倒计时」、「行牌操作·出牌」、「本期开发范围」","original_text":"配置开启托管，超时默认【过】（本核心流程按无托管处理，此条规则不执行。）；出牌倒计时归零后显示00，继续等待本家手动出牌。本核心流程按无托管处理，超时不触发自动出牌；吃碰杠胡的响应裁决按对应模块执行","problem":"出牌超时明确写了「无限等待」，但响应阶段（吃、碰、直杠、胡、抢杠胡）的倒计时归零后做什么，被「托管条目不执行」一笔带过，没有替代规则。无限等待会让其余三家永久卡住；自动按「过」又等于启用了一种托管行为，与「全程按无托管处理」的声明冲突。","impact":"玩家挂机或网络抖动时整桌可能卡死，且无法判定是缺陷还是预期；验收无法为超时路径写用例。","suggestion":"明确本期响应超时策略并写进倒计时章节：归零即自动按「过」并广播裁决结果（推荐，保证不卡桌），或归零后进入等待并记录日志、允许其他人发起解散；同时说明与出牌超时的差异。\n\n**需要补的内容与必填格式**：\n新增「超时处理」表，必填列：阶段（出牌/吃/碰/直杠/胡/抢杠胡）｜起始秒数｜归零后动作｜对其他玩家影响｜是否记录日志｜可否被操作覆盖\n\n**范例（需求必须按此格式写）**：\n正常：碰的响应倒计时 10 秒，归零后按「过」处理并广播，出牌者下一动作正常推进，无需等待该玩家。异常：倒计时显示00后既不过、也不推进，其余三家无法继续，且文档未说明这是预期行为。\n\n**验收口径**：\n所有阶段的超时都能查到唯一动作；测试可模拟挂机并断言对局继续推进、无卡桌。","status":"待确认","has_detail":true},{"id":"PRD-099","title":"流局时小结算的触发条件与界面内容缺失（与 PRD-035 同根因，重复登记，建议合并）","priority":"P1","type":"描述不完整","module":["结算与结束"],"source_location":"「结算界面·小结算·触发逻辑」、「小结算·UI交互以及说明」、「结算流程」表·对局结果阶段展示","original_text":"小结算 触发条件：播完胡牌结算流程，进入结算界面；赢家结算：展示本局胡牌番型…；对局结果阶段展示 前置条件：对局结束后 可以是出现流局，对局结束，也可以是播放完胡牌番型后","problem":"小结算的触发条件只写「播完胡牌结算流程」，而结算流程表把流局也列为结束方式。流局没有胡牌玩家，则赢家结算区、输赢文案（恭喜获胜/遗憾失败）、手牌摆布是否分割、承包标识、财神标识、各家分数如何展示全部没有定义，流局是否产生分数也没有写；本期8局中流局同样计1局，必然遇到。","impact":"流局局可能进不了小结算或出现空白的赢家区；分数展示无依据，测试无法验收流局局的结算。","suggestion":"与 PRD-035 合并处理：在小结算章节增加结束类型分支：流局由谁触发、结束横幅文案、四家得分（若无得失分写0）、赢家区隐藏、手牌是否摊开、承包标识与财神标识是否保留、继续下一局的按钮行为。\n\n**需要补的内容与必填格式**：\n新增「小结算结束类型分支表」，必填列：结束类型｜触发时机｜结束横幅｜赢家结算区｜输赢文案｜手牌摆布｜承包标识｜每家分数｜下一步\n\n**范例（需求必须按此格式写）**：\n正常：第3局流局，小结算标题显示「流局」，四家分数均为0，赢家结算区整体隐藏，手牌仅碰杠吃分割不摊开，承包标识隐藏，点「继续」进入第4局发牌。异常：流局局沿用胡牌分支，赢家区显示空白番型、输赢文案为「遗憾失败」。\n\n**验收口径**：\n流局与胡牌两条分支都能各出一套用例并断言界面元素与分数；不存在未定义区域。","status":"待确认","has_detail":true},{"id":"PRD-100","title":"杠操作入口与多组合选择交互缺失，多操作状态章节为空（与 PRD-137 同根因，重复登记，建议合并）","priority":"P1","type":"描述不完整","module":["响应动作"],"source_location":"「吃碰杠胡操作·杠牌-复用」、「吃碰杠胡操作·碰牌-复用」、「吃碰杠胡操作·吃牌」、「多操作状态-复用功夫川麻」","original_text":"杠牌-复用现有血战杠的特效，主要区别删除刮风下雨，无论什么杠，统一使用杠字即可；多操作状态-复用功夫川麻（该节仅有标题与原文链接，无任何正文）","problem":"吃、碰、胡都给出了按钮与交互（【吃】+【过】、【碰】+【过】、【胡】+【过】），杠只写了「复用血战特效」，没有直杠的响应按钮、加杠/暗杠的入口、手中有多组可杠时的牌面列表选择、杠与碰/胡按钮并存时的展示与排序；吃牌写了「存在多种合法组合时选择其中1组」，但界面只说全部高亮后可点【吃】，没有说明如何指定哪一组。规则基准里这些都是操作区必备组件。","impact":"玩家在客户端可能无法发起直杠/加杠/暗杠，或同时有碰和杠时只能二选一；吃多组合时系统无法确定取哪两张，直接影响胡牌结构。","suggestion":"与 PRD-137 合并处理：补「杠操作」与「多组合选择」两张表：说明各杠型的入口阶段、按钮文案、可选组合列表形态、与碰/胡并存时的排序与互斥关系、取消方式；并把空白的「多操作状态」章节补成同时显示多按钮时的规则或在本期明确声明不实现。\n\n**需要补的内容与必填格式**：\n「杠操作」表必填列：杠型｜触发阶段｜入口/按钮｜可选组合展示｜与碰/胡共存排序｜取消方式｜补牌触发；「多组合选择」表必填列：场景｜候选数量｜展示形态｜默认选中｜提交方式\n\n**范例（需求必须按此格式写）**：\n正常：A手中有3张2筒并碰过5万，B打出2筒时，A操作区同时显示【胡】【碰】【杠】【过】，点【杠】按操作优先级裁决后播放杠动画并补牌。异常：A同时可加杠5万、暗杠9条，界面只给一个【杠】按钮且未说明点一次杠哪一组。\n\n**验收口径**：\n每种杠型都能在表中查到入口与选择方式；多组合场景下客户端能明确取到玩家选中的那一组；测试可覆盖直杠/加杠/暗杠/同时可碰可杠四条用例。","status":"待确认","has_detail":true},{"id":"PRD-101","title":"缺行为清单索引与三类变化标注","priority":"P2","type":"需求缺失","module":["总览与文档"],"source_location":"全文目录（一.本期开发范围至辅助功能／菜单）、各功能表（仅有「显示说明/交互说明」列）","original_text":"缺失说明：全文按「桌面布局—局内流程—结算—辅助功能」组织，没有一张表把「游戏行为→界面区域→直接变化/连带变化/重连补充数据→对应章节」列在一起；唯一带「涉及模块」列的只有「对局内通用提示」表。","problem":"规则基准的组织方式是「一个行为＝一篇说明」，每篇先写行为何时出现、记了什么数据、按界面区域怎么变、连带影响、重连差异、注意事项。需求文档按界面区域组织，行为与界面变化的对应关系散落在各表里，没有索引，也没有区分「直接变化」与「连带变化」。","impact":"开发按章节实现时会漏掉连带影响（如出牌引发下家摸牌、方位与头像提示切换、放大牌退场）；测试无法按行为逐条核查，验收缺少追溯链条。","suggestion":"新增「行为清单索引」章节，按总览索引逐行标注本期是否生效、界面区域、直接变化、连带变化、重连补充数据与对应章节。\n\n**需要补的内容与必填格式**：\n索引表列：序号｜行为｜触发消息/时机｜界面区域｜直接变化｜连带变化｜重连或回放补充数据｜对应章节｜本期是否生效\n\n**范例（需求必须按此格式写）**：\n正常：「9｜出牌｜出牌消息｜手牌、牌河、操作区、头像｜手牌移除该牌并靠拢、弃牌飞入牌河空位、最新弃牌浮标｜下家摸牌、操作者流光与方位高亮切换、放大牌退场｜重连按河牌数据直接落位不播飞牌动画｜4.4 行牌操作｜生效」。异常：「出牌｜无对应章节｜仅有效果图，未写界面区域与连带影响」。示例值以产品确认为准。\n\n**验收口径**：\n索引覆盖总览列出的行为，本期生效项均有章节可点；抽查任一行为能在索引定位界面区域与章节，测试据索引即可出用例。","status":"待确认","has_detail":true},{"id":"PRD-102","title":"准备状态生命周期与局间过渡未定义","priority":"P2","type":"需求缺失","module":["牌桌区域"],"source_location":"「对局前／准备信息」第4项、「对局开始」（T=0 隐藏常驻信息）、「小结算界面（好友房）／触发逻辑」","original_text":"「未准备时显示“未准备”；准备后显示“已准备”；房主默认准备；首次进入房间的其他玩家默认准备」「房主点击「开始游戏」后进入4.1「对局开始」，等待阶段的准备标记和操作入口随开局过渡收起」","problem":"规则基准给出三态（已准备/已坐下/隐藏）与两个关键时点（开局清空全桌准备状态、结果返回后延迟1.2秒把已坐下座位恢复为准备状态）。需求文档只有未准备/已准备两态，没有「已坐下」，也没写开局是否清空准备数据、小结算关闭后如何回到下一小局（是否自动开始、头像恢复时点、是否判断满8局）。","impact":"小结算到下一局的过渡无法实现，可能出现局中仍显示「已准备」、或结算后未恢复准备状态导致无法进入下一局。","suggestion":"补准备状态机与局间过渡时序表，明确开局清空、小结算关闭后恢复时点与下一局开始条件。\n\n**需要补的内容与必填格式**：\n必填两张表：①状态表：状态｜显示样式｜进入条件｜退出条件｜清除时点；②局间过渡时序表：时点｜触发事件｜头像与准备标记｜倒计时｜下一局开始条件\n\n**范例（需求必须按此格式写）**：\n正常：「小结算关闭后0秒隐藏准备标记；1.2秒后对已坐下座位重新显示「已准备」；未满8局时由房主点击开始进入下一小局；满8局进入大结算（本期不做）」。异常：「小结算关闭后立即显示「已准备」并自动发牌，未等1.2秒也未判断是否满8局」。示例值以产品确认为准。\n\n**验收口径**：\n准备状态机闭环无孤立态；时序可按帧验收；测试可产出「胡牌结束回准备」「流局回准备」两条用例。","status":"待确认","has_detail":true},{"id":"PRD-103","title":"等待阶段玩家进入离开与人数变化未定义","priority":"P2","type":"需求缺失","module":["牌桌区域"],"source_location":"「对局前／座位」第6项、「对局前／玩家信息」第3项、「玩法规则／【人数】」","original_text":"房主创建房间后，其他玩家按加入顺序依次沿逆时针入座。自己永远显示在下方。等待阶段以各自客户端视角显示座位。","problem":"需求文档只写了初始入座顺序与空座显示「＋」，没有定义等待阶段玩家加入、离开时头像节点如何重新绑定、准备标记是否清空、庄标与房主标记如何处理、房主离开是否转移或解散。规则基准对这三类通知都有明确头像动作。","impact":"开局前有人退出会残留头像与准备态，新玩家补位时沿用旧准备值；人数变化时头像节点错绑，测试无法覆盖房间人员变动。","suggestion":"补一张「等待阶段外部通知处理表」，逐条写明头像、昵称、累计分、准备标记、庄标、房主标记、空座占位的处理。\n\n**需要补的内容与必填格式**：\n必填表：外部通知｜触发时机｜头像节点｜昵称与累计分｜准备标记｜庄标｜房主标记｜空座占位\n\n**范例（需求必须按此格式写）**：\n正常：「玩家离开（未开局）｜玩家退出房间｜清空头像/昵称/累计分｜清空准备标记｜隐藏该座位庄标｜房主离开按解散房间处理｜座位回退为「＋」占位」。异常：「玩家离开后座位仍显示上一名玩家昵称与「已准备」，新玩家进入后沿用旧准备值」。示例值以产品确认为准。\n\n**验收口径**：\n每条通知有唯一期望结果且可逐元素断言；测试可产出「开局前玩家退出」「新玩家补位」用例。","status":"待确认","has_detail":true},{"id":"PRD-104","title":"缺阅读约定与功能点索引，正文引用编号全部失效","priority":"P2","type":"未分类","module":["总览与文档"],"source_location":"全文缺索引表；定庄、对局开始、菜单、云检测处失效引用","original_text":"","problem":"","impact":"","suggestion":"补功能点索引表并编号，正文引用统一改为章节号或功能点 ID，删除或补写云检测引用","status":"待确认","has_detail":false},{"id":"PRD-105","title":"缺进张定义与财神计数口径","priority":"P2","type":"未分类","module":["行牌循环"],"source_location":"基础名词（向听数、财神）；番型介绍财神番型；三财四财翻倍配置","original_text":"","problem":"","impact":"","suggestion":"新增「进张与财神计数」小节，给进张三分定义与两个计数公式，声明打出财神仍计入总数","status":"待确认","has_detail":false},{"id":"PRD-106","title":"缺配置覆盖顺序与非法值处理","priority":"P2","type":"未分类","module":["房间配置"],"source_location":"本期开发范围；本期可选规则","original_t 恢复\"无任何场景恢复描述。","problem":"需求只定义了断线图标与计时，未定义断线玩家重连后如何恢复牌局：恢复哪些内容、按什么顺序、恢复期间动画是否静默、他人手牌是否翻开、倒计时以什么为基准、权限按钮如何还原、最后出牌放大是否补显。","impact":"好友房 8 局对局时长内断线必然发生；无恢复规格则该场景无法开发与验收，服务端 end_wait 应答缺失还会导致整桌卡死。","suggestion":"新增\"断线重连与场景恢复\"章节：恢复入口与状态分发、恢复顺序、静默模式（不播开局/摸牌/胡牌动画）、他人手牌背面、权限/倒计时/方位灯/出牌放大补刷、end_wait 自动应答；可直接以基准 04#1~#16 为对照逐条声明采纳或改版。","status":"待确认","has_detail":true,"acceptance":"行牌中断线重连后，本家手牌/河牌/牌墙/剩余数/权限按钮/倒计时/方位灯与断线前一致，他人手牌保持背面，最后出牌放大补显；开局/发牌/洗牌阶段断线重连各有定义的恢复表现。"},{"id":"Q02","title":"杠操作按钮组与加杠/暗杠触发交互完全未定义","priority":"P0","type":"需求缺失","module":["吃碰杠胡-杠"],"dimension":"UI 交互","source_location":"吃碰杠胡操作-杠牌","rule_ref":"01#3 操作区控制器页面状态（碰杠胡态/选择多杠态）；01#9 杠单组合直接发送、多组合进入选择多杠态显示牌面列表、多杠态点取消=同时执行过。","original_text":"位置\"三、对局流程 → 局内流程 → 吃碰杠胡操作 → 杠牌\"。引文（全文）：\"杠牌-复用现有血战杠的特效，主要区别删除刮风下雨，无论什么杠，统一使用杠字即可\"。","problem":"未定义：他人弃牌可直杠时是否显示【杠】+【过】按钮组及位置；本人出牌阶段加杠、暗杠的触发方式（点击手牌第 4 张弹选项？按钮？）；多种杠组合并存时的选择交互；杠按钮与过按钮的互斥/收起规则。\"复用血战杠的特效\"仅指动画特效，不构成按钮交互规格。","impact":"杠是本期启用的高频核心操作（含吃碰当前回合可杠），无入口定义无法开发与验收；暗杠 3 背 1 正的展示虽有玩法描述，但玩家如何发起暗杠无解。","suggestion":"补充杠操作小节：直杠按钮组（样式/位置/与碰胡并存时的排布）、加杠与暗杠的出牌阶段触发交互、多杠组合选择列表、选择态取消=过的行为。","status":"待确认","has_detail":true,"acceptance":"可直杠时出现杠按钮且点击后弃牌入副露并补牌；出牌阶段可按定义的交互完成加杠/暗杠；多种杠并存时出现选择列表，取消等同过。"},{"id":"Q03","title":"单击出牌前后矛盾","priority":"P1","type":"内容冲突","module":["行牌操作-出牌"],"dimension":"UI 交互","source_location":"行牌操作-出牌 / 修改对比版-出牌","rule_ref":"01#12 三种出牌方式均为设置项控制（单击直接出需设置开启）；01#13 打听牌禁止单击直接打出。","original_text":"位置一\"局内流程 → 行牌操作 → 出牌（前表）\"。引文：\"单击出牌：出牌阶段点击打出不可听牌的牌，则直接将其打出，无需提起。单机出牌开启时，若轮到自己出牌前有牌提起，则自动下落。\"位置二\"行牌操作｜修改对比版 → 出牌\"。引文：\"本方案默认双击出牌。滑动出牌默认开。单击出牌归设置模块，本方案不包含该模式。\"","problem":"前文将单击出牌作为本期可选出牌方式给出完整交互定义（含自动下落细节），后文明确\"本方案不包含该模式\"，范围互相矛盾；另\"单击仅限不可听牌\"的限制依附于被排除的模式，本期双击/滑动模式下可听牌能否滑动直接打出也未说明（基准 01#13 要求打听牌强制先提牌查看听牌信息）。","impact":"开发无法确定单击出牌是否在交付范围；可听牌的滑动出牌限制缺失可能导致绕过听牌提示交互。","suggestion":"删除或标注前文单击出牌段落为\"原方案对照\"；补充说明本期双击/滑动模式下可听牌是否允许滑动直接打出（基准要求禁止单击直接打出、须先提牌）。","status":"待确认","has_detail":true,"acceptance":"全文仅存在一种口径；滑动出牌对可听牌的限制有明确结论。"},{"id":"Q04","title":"\"多操作状态\"章节空引用","priority":"P1","type":"描述不完整","module":["吃碰杠胡"],"dimension":"UI 交互","source_location":"吃碰杠胡操作-多操作状态","rule_ref":"01#3 操作区按权限组合切换页面状态；01#4 他人收到权限时自己操作区直接收起（关按钮区、锁手牌、清提示）；01#25 操作区收起的统一时机。","original_text":"位置\"三、对局流程 → 局内流程 → 吃碰杠胡操作 → 多操作状态-复用功夫川麻\"。引文：仅有标题\"多操作状态-复用功夫川麻\"，其后直接进入\"对局内通用提示\"，无正文。","problem":"同一弃牌多人可响应（庄闲放铳下多人可胡、胡与碰并存）是本期规则明确支持的裁决场景，但各端按钮如何同时展示、裁决后未获权玩家的按钮如何收起、操作区互斥规则全部缺失，仅以外部项目名\"功夫川麻\"代替。","impact":"多人响应是常见分支，按钮残留/误操作风险高，无法验收。","suggestion":"补写多操作状态：各端按钮同时展示规则、他人权限到达时本家操作区立即收起、裁决完成后按钮区与方位高亮的联动切换。","status":"待确认","has_detail":true,"acceptance":"两人同时收到按钮时各自界面按钮正常；一方胡/碰成立后另一方按钮立即消失且手牌恢复可操作态。"},{"id":"Q05","title":"满 8 局\"结束本场\"的表现未定义","priority":"P1","type":"描述不完整","module":["结算流程"],"dimension":"UI 交互","source_location":"本期开发范围","rule_ref":"03#17 大结算数据组装（总局数/起止时间/总分/明细）；03#18 大结算弹出时机（动画链第 4 步延迟 2 秒/解散局直出）；03#19 收到大结算事件后小结算强制切\"最后一局\"页；03#14 最后一局继续按钮转弹大结算。","original_text":"位置\"本期开发范围\"。引文：\"每小局保留小结算，未满8局则继续下一小局，满8局结束本场。\"\"本期只做游戏内核心流程。原文中的创房面板、其他玩法选项、大结算和非核心桌面功能，如在核心段落中被引用，仅作原文上下文。\"","problem":"固定 8 局是本期规则，第 8 局小结算后玩家看到什么（大结算不做）未定义：直接解散回大厅？停留小结算？还是简化总分页？第 8 局小结算的\"继续游戏\"按钮行为也随之下落空。","impact":"8 局打完是必现场景，终点表现缺失导致整场流程无法走通验收。","suggestion":"明示第 8 局结束本场的表现（即使简化，也应定义：显示汇总分或直接回房间/解散），并定义最后一局小结算按钮文案与行为。","status":"待确认","has_detail":true,"acceptance":"第 8 局小结算操作后有明确定义的结束表现，玩家可离开对局且房间状态可预期。"},{"id":"Q06","title":"倒计时末 3 秒颜色与基准冲突（需求黄/基准红）","priority":"P2","type":"内容冲突","module":["方位信息-倒计时"],"dimension":"UI 交互","source_location":"方位信息-倒计时","rule_ref":"07#2 配色：>3 秒默认蓝色，最后 3 秒切红色字体，自己回合且未自动胡时播倒计时音效；01#20 倒计时：中央数字逐秒倒数，最后 3 秒切红色字体，自己回合且未自动胡时播倒计时音效，>999 不显示，复盘模式不显示。","original_text":"位置\"三、对局流程 → 局中信息 → 方位信息 → 倒计时\"。引文：\"中央用两位数字显示当前阶段剩余秒数，按秒递减，普通数字为蓝青色，03、02、01、00为黄色。阶段开始时按该阶段配置的时间起始秒数刷新\"","problem":"需求定义 03、02、01、00 共 4 个值切黄色，基准为最后 3 秒切红色，颜色与切换边界双重冲突。","impact":"开发与验收无统一配色口径，按需求实现会与现网录屏对照不一致，被误判为实现缺陷。","suggestion":"明确末段颜色（黄或红）与切色边界（从 03 还是 02 起），若有意改版需声明\"与现网实现差异\"。","status":"待确认","has_detail":true,"acceptance":"倒计时末段配色与切换时点全文只有一种口径。"},{"id":"Q07","title":"同牌点多张的标签标记位置与基准冲突（最右 vs 第一张）","priority":"P2","type":"内容冲突","module":["手牌信息-听牌标签"],"dimension":"UI 交互","source_location":"听牌标签显示规则-多/大","rule_ref":"02#6 打听箭头显示在手牌上（同牌值只标第一张），带听型样式（普通/大/多/优）；出牌后仍保留有效箭头。","original_text":"位置\"三、对局流程 → 局中信息 → 手牌信息 → 听牌标签显示规则\"。\"多\"条目引文：\"同一个牌点有多张，则最右侧的牌显示'多'。\"。\"大\"条目引文：\"同一个牌点有多张，则最右侧的牌显示'大'。\"","problem":"需求规定同牌点多张时仅最右侧一张显示'多'/'大'标签，基准实现为同牌值只标第一张，标记位置相反。","impact":"按任一口径实现都会与另一口径冲突，与现网对照验收必有一处不符。","suggestion":"确认目标口径（最右侧或第一张）并全文统一，若维持'最右侧'需声明与现网实现的差异。","status":"待确认","has_detail":true,"acceptance":"同牌点多张时标签标记位置全文只有一种结论。"},{"id":"Q08","title":"平庄庄标样式两处矛盾（【庄】vs【庄×1】）","priority":"P2","type":"内容冲突","module":["玩家头像-庄标"],"dimension":"UI 交互","source_location":"玩家头像信息 / 定庄","rule_ref":"07#9 庄标：庄家头像显示庄标（控制器切页），重置全隐藏；换庄切到新庄家头像。","original_text":"位置一\"局中信息 → 玩家头像信息 → 庄家标签\"。引文：\"根据规则庄有3种样式：平庄：显示【庄】；庄二：显示【庄×2】；庄三：显示【庄×3】\"。位置二\"局内流程 → 定庄 → UI及动画\"。引文：\"三档样式。平庄（一牢）显示「庄×1」，庄二（二牢）显示「庄×2」，庄三（三牢）显示「庄×3」。\"","problem":"玩家头像信息章节平庄显示【庄】，定庄章节平庄显示「庄×1」，同一三档体系两处口径不同，平庄庄标文案无法确定。","impact":"庄标文案实现只能二选一，验收时必有一处不通过。","suggestion":"统一平庄庄标样式（【庄】或【庄×1】），并声明与基准'庄家展示样式归玩法规则、UI 侧按倍数文案展示'口径的关系。","status":"待确认","has_detail":true,"acceptance":"全文平庄庄标样式只有一种写法。"},{"id":"Q09","title":"番型是否展示倍数自相矛盾（删除线 vs 示例含倍数）","priority":"P2","type":"内容冲突","module":["小结算界面"],"dimension":"UI 交互","source_location":"小结算界面-赢家结算","rule_ref":"03#12 小结算界面每家显示：头像昵称、方位、分数（正负字体区分，大数字格式）、庄标、胡牌单放牌、组合牌（杠 4 张页/暗杠背面）、手牌列表、胡型、叫嘴标识、流水汇总与总番。","original_text":"位置\"结算界面 → 小结算界面（好友房）→ UI交互以及说明 → 赢家结算\"。引文：\"展示本局胡牌番型~~和倍数~~\"（\"和倍数\"带删除线标记）；引文：\"比如：二连杠二财飘，在结算上显示的是：杠飘\\*32（二连杠，双财飘）\"","problem":"正文将'和倍数'加删除线表示番型不展示倍数，复合番型示例'杠飘\\*32'却含倍数，番型区是否渲染倍数两种口径并存。","impact":"开发无法确定番型区是否带倍数文案，验收口径不成立。","suggestion":"明确番型是否带倍数（全部不带，或复合番型带'名称×倍数'），修订规则或示例使口径唯一。","status":"待确认","has_detail":true,"acceptance":"番型倍数展示规则全文只有一种口径，示例与规则一致。"},{"id":"Q10","title":"准备状态切换交互缺失，\"默认准备\"与未准备态矛盾","priority":"P2","type":"定义歧义","module":["桌面布局-准备"],"dimension":"UI 交互","source_location":"对局前-准备信息","rule_ref":"06#一 界面清单：玩家头像层（常驻 Base·Player，好友房创建）职责含头像/庄标/准备标识/权限光圈。","original_text":"位置\"三、对局流程 → 桌面布局 → 对局前 → 准备信息\"。引文：\"未准备时显示'未准备'；准备后显示'已准备'；房主默认准备；首次进入房间的其他玩家默认准备。\"\"已入座的玩家显示准备状态，空座显示「＋」占位。\"\"本期须坐满4人且4人均为「已准备」，此时仅房主显示并可点击「开始游戏」，其他玩家等待房主开局。\"","problem":"房主与首次进入的玩家均'默认准备'，则'未准备'状态在何种场景出现、玩家能否取消准备、取消后如何再次准备（点击切换还是按钮）均未定义；若人人默认准备，未准备态与切换交互形同虚设。","impact":"准备/取消准备的交互无法开发，'开始游戏'按钮的可用条件难以验收。","suggestion":"明确默认准备的范围与例外（换人、重进房间后是否保持已准备）、取消与恢复准备的操作方式及入口。","status":"待确认\n\n---","has_detail":true,"acceptance":"任一玩家从'未准备'到'已准备'再到开局的全链路有唯一可执行的交互定义。"},{"id":"Q11","title":"手牌标注体系不完整（典型 P2 之一）","priority":"P2","type":"描述不完整","module":["手牌信息"],"dimension":"UI 交互","source_location":"手牌信息 / 吃碰杠胡","rule_ref":"01#15 有碰或杠权限且无胡权限时除目标牌外整手置灰，有胡权限清灰；01#16 置灰颜色优先级 黄 > 灰 > 财神红 > 正常；01#17 置灰清除时机（点碰/杠/过、收操作区、他人权限到达）；07#12 手牌癞子角标按配置牌表设置黄色角标。","original_text":"位置\"吃碰杠胡操作 → 碰牌-复用\"。引文：\"手牌中可碰牌高亮其他暗置，如果有胡则不需要暗置\"；\"吃碰杠胡操作 → 杠牌\"仅有特效一句话；手牌信息章节无财神角标描述（仅小结算提到\"手牌里的财神也有需要染色\"）。","problem":"a) 权限为杠（含直杠/加杠/暗杠候选）时手牌哪些牌置灰/高亮未描述；b) 置灰何时清除（出牌后、点过、他人权限到达）未描述；c) 局内手牌财神无角标/染色定义，玩家无法识别手中哪张是白板财神；d) 胡权限与碰/杠权限并存时的置灰豁免仅一句\"如果有胡则不需要暗置\"，与基准的清灰口径需确认一致。","impact":"手牌状态表达不一致会导致误出牌与验收争议；财神不可见直接影响白板财神玩法的可玩性。","suggestion":"补齐杠权限置灰规则、置灰清除三时机、局内手牌财神角标（样式/位置），并声明与基准四色优先级（黄>灰>财神红>正常）是否一致。","status":"待确认","has_detail":true,"acceptance":"碰/杠/吃权限下置灰范围符合定义；出牌或点过后置灰清除；手牌财神有可见标识。"},{"id":"Q12","title":"听牌提示体系不完整（典型 P2 之二）","priority":"P2","type":"描述不完整","module":["手牌信息-听牌"],"dimension":"UI 交互","source_location":"手牌信息-听牌标签 / 提牌","rule_ref":"02#8 常驻听牌组件含查听按钮，显示条件为有已听牌数据且自己未胡，及成套显隐时机；02#9 弹窗每项=牌面+倍数+剩余张数、番数降序+牌值升序、剩余 0 张置灰、总张数+封顶文案；02#10 弹窗两入口（查听按钮重复点击切换/提牌自动弹）；02#11 弹窗关闭时机（摸牌、可胡、自己胡、流局摊牌、点桌面等）；02#5 自己胡后听牌数据清空、清箭头；02#6 出牌后仍保留有效箭头。","original_text":"位置\"手牌信息 → 听牌标签显示规则\"与\"行牌操作｜修改对比版 → 提牌\"。引文：\"提起候选牌时，面板显示该牌打出后可胡的牌面及各自剩余张数。改提另一张候选牌时更新面板。取消提牌、改选非候选牌或实际出牌后收起面板。\"","problem":"a) 无查听按钮，已听牌玩家无法主动查看全局听牌；b) 弹窗缺倍数列、排序规则、剩余 0 张置灰、总张数与封顶文案（本期无封顶时的文案）；c) 弹窗/箭头的关闭与保留时机只写了三条（取消提牌/改选/出牌），摸牌、获得胡权限、自己胡、流局、点桌面空白均未定义；d) 听牌箭头出牌后是否保留未定义。","impact":"听牌提示是牌手核心决策辅助，入口与生命周期残缺会直接造成交互回退或状态残留。","suggestion":"按基准 02#8~#11 补齐：查听按钮显隐时机、弹窗信息结构（含无封顶文案）、关闭时机清单、箭头出牌后保留与胡后清除。","status":"待确认","has_detail":true,"acceptance":"已听牌可见查听入口；弹窗含牌面/倍数/剩余数且 0 张置灰；摸牌、胡牌、流局等各时点弹窗与箭头状态符合清单。"},{"id":"Q13","title":"有胡权限期间点击手牌的拦截与\"点过才能出牌\"轻提示缺失","priority":"P2","type":"需求缺失","module":["吃碰杠胡-胡"],"dimension":"UI 交互","source_location":"胡牌-交互说明","rule_ref":"01#7 硬互斥：有胡权限且操作区在展示态时，任何出牌尝试（单击/双击/滑动）都被拦截，必须先点过；提示\"点'过'才能出牌\"3 秒；06#二 弹层清单：轻提示（有胡权限点手牌\"点过才能出牌\"/玩家回归，3 秒自动关闭）。","original_text":"位置\"局内流程 → 吃碰杠胡操作 → 胡牌\"。动画效果列引文：\"此环节不可直接出牌\"（全文仅此一处涉及出牌限制）；交互说明引文：\"自摸：点击【自摸】按钮完成对应操作，点击【过】则放弃此次操作。\"\"点炮、抢杠胡：点击【胡】按钮完成对应操作，点击【过】则放弃此次操作。\"","problem":"需求只写了胡牌动画环节'不可直接出牌'，未定义有胡权限期间点击手牌的拦截行为、提示文案、展示时长与消失条件。","impact":"有胡权限时误触手牌的表现未定义，玩家可能误出牌或点击无任何反馈。","suggestion":"补写：有胡权限时单击/双击/滑动手牌均被拦截，弹'点过才能出牌'轻提示，3 秒自动消失。","status":"待确认","has_detail":true,"acceptance":"有胡权限期间任意出牌手势均被拦截且出现定义的轻提示，点过后恢复出牌。"},{"id":"Q14","title":"操作按钮组的显示/收起时机未定义","priority":"P2","type":"描述不完整","module":["吃碰杠胡"],"dimension":"UI 交互","source_location":"吃碰杠胡操作（全文）","rule_ref":"01#4 他人收到权限时自己操作区直接收起（关按钮区、锁手牌、清提示）；01#25 自己出牌后、碰/杠确认回包、胡牌回包、流局、托管——五类事件统一收操作区。","original_text":"位置\"局内流程 → 吃碰杠胡操作（全文）\"。碰牌引文：\"玩家手牌右上方显示操作按钮：【碰】+【过】\"；胡牌引文：\"玩家手牌右上方显示操作按钮：【自摸】+【过】。\"\"玩家手牌右上方显示操作按钮：【胡】+【过】\"；吃牌引文：\"玩家手牌右上方显示操作按钮：【吃】+【过】\"。全文无按钮收起时机的描述。","problem":"按钮何时收起（自己出牌后、操作回包后、流局、他人权限到达）全部缺失，多权限并存时按钮组的互斥与排布规则也未定义。","impact":"按钮残留是多人响应场景最常见缺陷，无收起时机定义则无法开发与验收。","suggestion":"补写按钮组收起时机清单（对齐基准五类事件与'他人权限到达立即收起'），并定义多权限并存时的按钮排布。","status":"待确认","has_detail":true,"acceptance":"每种按钮组从出现到消失的全部触发点均有定义。"},{"id":"Q15","title":"吃多组合选择交互未定义","priority":"P2","type":"描述不完整","module":["吃碰杠胡-吃"],"dimension":"UI 交互","source_location":"玩法规则-吃","rule_ref":"01#9 杠单组合 vs 多组合：仅一种杠直接发送；多于一种先进入选择多杠态显示牌面列表，点列表项确认后发送；多杠态下点取消 = 同时执行过。","original_text":"位置\"二、功能详情 → 玩法规则 → 吃\"。引文：\"上家刚打出的1张非财神牌，与玩家手中的2张非财神牌可组成同花色、点数连续的顺子时，玩家可以选择吃；存在多种合法组合时，选择其中1组。\"位置\"局内流程 → 吃碰杠胡操作 → 吃牌\"仅有按钮定义：\"玩家手牌右上方显示操作按钮：【吃】+【过】\"\"点击【吃】按钮完成对应操作，点击【过】则放弃此次操作\"。","problem":"玩法规则写明吃'存在多种合法组合时，选择其中1组'，但吃牌章节只有【吃】+【过】两个按钮，多种组合如何列出、如何选定、能否反悔均未定义（基准中多组合有专门的选择列表态）。","impact":"手持多种吃组合是常见场景（如 3、4、6、7 条吃 5 条），无选择交互则功能不可用。","suggestion":"补写吃多组合选择交互：进入选择态显示组合牌面列表、点选确认发送、取消等同过。","status":"待确认","has_detail":true,"acceptance":"手持多种吃组合时出现定义的选择列表，选定后副露正确，取消等同过。"},{"id":"Q16","title":"多种杠组合的选择列表交互未定义","priority":"P2","type":"需求缺失","module":["吃碰杠胡-杠"],"dimension":"UI 交互","source_location":"杠牌（仅特效一句话）","rule_ref":"01#9 杠单组合 vs 多组合：仅一种杠直接发送；多于一种先进入选择多杠态显示牌面列表，点列表项确认后发送；多杠态下点取消 = 同时执行过（发 sendCancel）。","original_text":"位置\"局内流程 → 吃碰杠胡操作 → 杠牌\"。引文（全文）：\"杠牌-复用现有血战杠的特效，主要区别删除刮风下雨，无论什么杠，统一使用杠字即可\"","problem":"需求未定义：点【杠】后存在多种杠组合时是否进入选择态、列表如何展示牌面、如何确认、取消行为；'统一使用杠字'只覆盖动效，不覆盖选择交互。","impact":"多种杠组合并存时玩家无法完成选择，杠功能不可用。","suggestion":"按基准补写选择多杠态：多组合显示牌面列表、点选确认后发送、点取消=同时执行过。","status":"待确认","has_detail":true,"acceptance":"多种杠组合时出现选择列表，确认后发送正确组合，取消等同过。"},{"id":"Q17","title":"局终演出链顺序与桌面摊牌表现未定义（仅\"参考功夫川麻\"）","priority":"P2","type":"描述不完整","module":["结算流程"],"dimension":"UI 交互","source_location":"结算流程-流程明细","rule_ref":"03#1 局终主入口按固定顺序执行：收操作区 → 隐藏出牌放大 → 摊牌前置处理 → 各家胡牌态 → 四步动画链（①点炮/一炮多响动画+赢家番型动画 → ②摊牌+台面标识，每步停留 1.5 秒 → ③小结算 → ④大结算）；03#4 摊牌：所有有手牌的玩家手牌推倒，胡家手牌末张落地图，自己手牌右移缩小；完成后延迟 1 秒发应答推进流程。","original_text":"位置\"三、对局流程 → 结算流程 → 流程明细\"。胡牌场景引文：\"触发操作：对局中有玩家胡牌，根据玩家的番型播放对应番型特效\"\"参考功夫川麻的胡牌流程即可\"（备注列：\"与功夫川麻保持一致\"）；对局结果阶段引文：\"前置条件：对局结束后，可以是出现流局，对局结束，也可以是播放完胡牌番型后，展示本局所有玩家的分数\"（备注列：\"同步老包\"）。","problem":"从胡牌确认到小结算之间的演出顺序（收操作区、隐藏放大、摊牌方式、台面标识、飘分）与每步时长全部未定义，'参考功夫川麻/同步老包'无对照物。","impact":"局终演出是每局必播链路，无顺序定义则各端表现不一致且无法验收。","suggestion":"以基准 03#1/#4 为对照逐条声明采纳或改版：固定演出顺序、摊牌表现、每步停留时长、飘分完成后进小结算。","status":"待确认","has_detail":true,"acceptance":"胡牌后到小结算出现之间的每一步演出有顺序、内容与时长定义。"},{"id":"Q18","title":"流局结算表现未定义（荒牌页、摊牌、输赢文案）","priority":"P2","type":"描述不完整","module":["结算流程"],"dimension":"UI 交互","source_location":"结算流程-流程明细","rule_ref":"03#2 流局路径：摊牌 → 隐藏听牌按钮/听牌弹窗/出牌放大 → 收操作区 → 倒计时与方位光熄灭 → 结束类型切\"荒牌\"页。","original_text":"位置\"三、对局流程 → 结算流程 → 流程明细\"。引文：\"前置条件：对局结束后，可以是出现流局，对局结束，也可以是播放完胡牌番型后，展示本局所有玩家的分数\"（备注列：\"同步老包\"）。全文无流局专属表现描述；位置\"结算界面 → 小结算界面 → 输赢显示\"引文：\"赢了显示'恭喜获胜'\"\"输了显示'遗憾失败'\"。","problem":"流局时是否摊牌、听牌/放大等元素如何清理、倒计时与方位光是否熄灭、'荒牌'结束类型页如何展示、小结算输赢文案在无输赢的流局下显示什么，均未定义。","impact":"流局每场必现（规则固定余 20 张流局），表现缺失导致该分支无法开发与验收。","suggestion":"补写流局演出链（对齐基准 03#2）：摊牌、隐藏项清单、倒计时熄灭、荒牌页样式、流局时小结算输赢文案口径。","status":"待确认","has_detail":true,"acceptance":"流局后桌面向荒牌页过渡的每一步有定义，小结算输赢文案在流局下有唯一表现。"},{"id":"Q19","title":"小结算流水明细（文字结算）内容与格式未定义","priority":"P2","type":"描述不完整","module":["小结算界面"],"dimension":"UI 交互","source_location":"小结算界面","rule_ref":"03#10 小结算数据含额外流水，流水文案格式\"动作(番名)[方位] ±N分\"，按人数生成方位文案（本家/上家/下家/对家）；03#12 小结算界面每家显示：头像昵称、方位、分数（正负字体区分，大数字格式）、庄标、胡牌单放牌、组合牌（杠 4 张页/暗杠背面）、手牌列表、胡型、叫嘴标识、流水汇总与总番。","original_text":"位置\"结算界面 → 小结算界面（好友房）→ UI交互以及说明\"。赢家结算引文：\"承包有单独的样式，但是文字结算也要体现出来\"\"牢庄不需要展示\"。八个编号项（玩家信息/手牌摆布/输赢显示/分数结算/承包的标识/赢家结算/麻将牌标识/财神牌）之外无流水明细描述。","problem":"文字结算（流水）显示哪些动作、番名、方位、分值，按什么格式拼装，是否显示流水汇总与总番，均未定义；承包在文字结算中如何体现也只说'要体现出来'。","impact":"流水是玩家核对分数的唯一依据，无格式定义则开发随意拼装，验收无据。","suggestion":"补写流水条目结构（动作/番名/方位/±分）与汇总总番展示，明确承包、复合番型在流水中的文案格式。","status":"待确认","has_detail":true,"acceptance":"任意一局小结算的每行流水可按定义格式逐项核对且总分一致。"},{"id":"Q20","title":"小结算继续/关闭交互与下一局衔接未定义（典型 P2 之三）","priority":"P2","type":"需求缺失","module":["小结算界面"],"dimension":"UI 交互","source_location":"小结算界面（全文）","rule_ref":"03#14 继续游戏按钮：最后一局转大结算，否则关小结算+自动准备下一局；03#15 关闭按钮：好友房直接关；03#18 小结算为动画链第 3 步、大结算第 4 步的先后关系。","original_text":"位置\"结算界面 → 小结算界面（好友房）\"。引文：触发逻辑仅\"播完胡牌结算流程，进入结算界面\"；UI 交互说明仅列玩家信息、手牌摆布、输赢显示、分数结算、承包标识、赢家结算、麻将牌标识、财神牌八项，无任何按钮。","problem":"未定义：小结算上的按钮集合（继续/关闭）；单人点击即关还是全员确认才开下一局；点击后到下一局摇骰的过渡；与 Q05 的第 8 局终点衔接。","impact":"局与局之间无法推进，好友房多人场景下\"谁点了才算数\"无标准会产生流程挂起或抢开。","suggestion":"定义按钮组与多端确认规则（建议沿用基准：继续=关小结算并进入下一局准备，全员确认或房主开局的口径需明确），并与 Q05 一并给出第 8 局分支。","status":"待确认","has_detail":true,"acceptance":"任意一局小结算后按定义操作可稳定进入下一局；第 8 局走 Q05 定义分支。"},{"id":"Q21","title":"牌墙视觉布局与更新规则未定义","priority":"P2","type":"描述不完整","module":["玩法信息"],"dimension":"UI 交互","source_location":"局中信息（仅\"刷新牌墙\"字样）","rule_ref":"07#7 剩余牌数组件挂在返回按钮栏，更新时机：发牌后、每次抓牌后，重置时隐藏；07#8 牌墙显示开关按玩家设置，牌墙按骰子和的奇偶推算哪边多一墩；08#8 牌墙：按骰子结果推算哪边多一墩，显示开关按玩家设置；08#9 发牌动画同时牌墙逐张消失（每张 0.25 秒）+ 发牌音效。","original_text":"位置\"局内流程 → 行牌操作｜修改对比版 → 摸牌\"。引文：\"按行牌顺序轮到的玩家从牌墙顺时针取1张。取牌后刷新各视角的牌墙与余牌数。\"位置\"局内流程 → 发牌\"。引文：\"发完庄家14张，三名闲家各13张，共发53张，牌墙余83张。\"全文无牌墙的布局样式与消牌动画描述。","problem":"需求未定义：牌墙的摆放位置与墩数排布、按骰子推算哪边多一墩、显示开关、发牌/摸牌/杠补牌时牌墙如何逐张消减，仅文字要求'刷新各视角的牌墙'。","impact":"牌墙是行牌可视锚点，无布局与消牌规则则各端表现不一致，牌墙与余牌数对不上。","suggestion":"补写牌墙布局（位置、排布）、骰子推算规则、显示开关，以及发牌逐张消失（含节奏）与摸牌/杠后消张规则。","status":"待确认","has_detail":true,"acceptance":"任意时点牌墙剩余墩张与余牌数一致，发牌与摸牌后牌墙表现符合定义。"},{"id":"Q22","title":"财神指示牌 UI 为新增功能，建议补\"与现网实现差异说明\"","priority":"P3","type":"需求缺失","module":["玩法信息-财神"],"dimension":"UI 交互","source_location":"玩法信息-财神 / 定财神","rule_ref":"07#12 现网客户端无财神指示牌视图与翻财神动画（财神命令无处理类，仅数据字段留存），手牌癞子角标按配置牌表设置黄色角标；07#13 需求文档若定义中央财神指示牌/翻财神动画（如杭麻需求的\"白板财神指示牌\"），属新需求：记 P3 差异说明，提示标注\"与现网实现差异\"。","original_text":"位置\"局中信息 → 玩法信息 → 财神\"。引文：\"每小局掷骰动画开始时，在中央骰盘左侧直接显示白板指示牌，样式沿用4.3「定财神」。\"\"发牌、理牌和行牌期间，白板指示牌保持在左侧原位，直到本小局结束。该指示牌仅作界面展示，四张白板均按财神规则使用。\"位置\"局内流程 → 定财神\"。引文：\"指示牌为竖向小牌，粉色牌面，正面显示白板边框。直接以最终尺寸和位置显示。\"","problem":"中央白板财神指示牌现网不存在，属有意新增，但需求未按基准口径声明'与现网实现的差异'。","impact":"验收缺少差异声明依据，新增 UI 易被误判为'与现网不符'的缺陷。","suggestion":"补充差异说明条目：现网无财神指示牌，本期新增，样式与时机以本文档为准。","status":"待确认","has_detail":true,"acceptance":"需求文档含该新增项的差异声明，验收按需求而非现网对照。"},{"id":"Q23","title":"听牌标签\"爆/飘\"与\"胡牌牌+tips\"为现网不存在的新增","priority":"P3","type":"需求缺失","module":["手牌信息-听牌"],"dimension":"UI 交互","source_location":"手牌信息-听牌标签","rule_ref":"02#14 爆头/财飘在客户端无专门 UI 标签或控件，仅匹配场等待文案提及；需求文档若定义爆头/财飘标签需标注为新增需求（P3 差异说明）。","original_text":"位置\"局中信息 → 手牌信息 → 听牌标签\"。引文：\"杭州麻将特有：打出去后能够爆头的牌：爆\"\"打出去后能够财飘的牌：飘\"\"注：当听牌提示满足'爆'/'飘'中任意条件是，隐藏'多'/'优'/'大'\"。位置\"手牌信息 → 杭麻特殊听牌标签\"。引文：\"当玩家处于胡任何牌张的情况下（爆头，财飘），此时听牌提示不会显示具体的牌，而是直接显示一张'胡'的麻将牌，tips写：'摸任意一张牌可胡'\"","problem":"'爆/飘'标签与'胡牌牌+tips'提示在现网客户端均无对应控件，属新增 UI，需求未声明与现网实现的差异。","impact":"新增项无差异声明，验收对照口径混乱，易被误判为与现网不符。","suggestion":"补充差异说明：爆/飘标签、胡牌牌+tips 为本期新增，样式与触发条件以本文档为准。","status":"待确认","has_detail":true,"acceptance":"需求文档含新增听牌标签的差异声明。"},{"id":"Q24","title":"吃操作按钮 UI 为现网新增（42319 无吃入口），建议补差异说明","priority":"P3","type":"需求缺失","module":["吃碰杠胡-吃"],"dimension":"UI 交互","source_location":"吃碰杠胡操作-吃牌","rule_ref":"01#5 杭麻无吃操作界面入口（按钮未注册）、报听已移除（按钮空实现且强制隐藏）。","original_text":"位置\"局内流程 → 吃碰杠胡操作 → 吃牌\"。引文：\"玩家手牌右上方显示操作按钮：【吃】+【过】\"\"手牌中所有可吃牌高亮其他暗置，如果有胡则不需要暗置\"\"举例：上家出五条，手上有三条，四条，六条，七条。则这四张牌全部都要高亮\"","problem":"现网 42319 无吃操作入口（按钮未注册），需求的【吃】+【过】按钮组为新增 UI，未声明与现网差异；按钮样式、位置与多按钮并存排布也无现网参照，需在本文档内定义完整。","impact":"新增按钮无差异声明，对照现网验收会误判，按钮规格也可能不完整。","suggestion":"补充差异说明：吃操作按钮为新增功能（含按钮组样式/位置/并存排布的定义归属）。","status":"待确认","has_detail":true,"acceptance":"需求文档含吃按钮为新增功能的差异声明，按钮规格自洽完整。"},{"id":"Q25","title":"两种\"过\"按钮的语义（是否上报服务端）未区分","priority":"P3","type":"需求缺失","module":["吃碰杠胡"],"dimension":"UI 交互","source_location":"吃碰杠胡操作-各按钮","rule_ref":"01#6 两个过按钮分工：过（需发服务端）点击后 sendCancel 上行；过2（无需上报）点击仅本地收尾不发任何包。","original_text":"位置\"局内流程 → 吃碰杠胡操作（各按钮交互说明）\"。引文：\"点击【碰】按钮完成对应操作，点击【过】则放弃此次操作\"\"点击【吃】按钮完成对应操作，点击【过】则放弃此次操作\"\"自摸：点击【自摸】按钮完成对应操作，点击【过】则放弃此次操作。\"\"点炮、抢杠胡：点击【胡】按钮完成对应操作，点击【过】则放弃此次操作。\"","problem":"需求所有按钮组的【过】统一表述为'放弃此次操作'，未区分'需上报服务端'与'仅本地收尾'两种过，响应裁决的上行口径缺失。","impact":"上行协议不明确会导致服务端一直等待或提前放行，响应超时表现不一致。","suggestion":"按基准区分两种过：响应权限的过需上行 sendCancel，本地收尾的过不发任何包，并标注各按钮组适用哪种。","status":"待确认","has_detail":true,"acceptance":"每个【过】按钮的上报行为（发/不发）有唯一定义。"},{"id":"Q26","title":"权限按钮防连点与弹窗防抖规则未定义","priority":"P3","type":"需求缺失","module":["吃碰杠胡/听牌"],"dimension":"UI 交互","source_location":"吃碰杠胡操作","rule_ref":"01#11 每个权限按钮点击后有 0.5 秒防连点（touchable=false 后延迟恢复）；06#三 防抖规则：听牌弹窗重复点击切换关闭，大结算已显示则跳过（防重弹）。","original_text":"（需求文档无对应描述，位置：局内流程 → 吃碰杠胡操作 章节，各按钮交互说明均无防连点/防抖规则）","problem":"权限按钮连发上行、弹窗重复打开/重弹的防抖规则未定义；本期虽无查听弹窗，但操作按钮防连点属基础交互护栏。","impact":"连点导致重复上行/重复弹窗，服务端需处理无效请求，表现不可预期。","suggestion":"补写：每个权限按钮点击后 0.5 秒内不可再次触发；小结算/大结算等弹窗定义防重弹规则。","status":"待确认","has_detail":true,"acceptance":"快速连点任一权限按钮只产生一次有效上行，弹窗不重复弹出。"},{"id":"Q27","title":"道具类功能范围未明示（记牌器/预约洗牌/道具引导/小结算外围按钮）","priority":"P3","type":"需求缺失","module":["全局"],"dimension":"UI 交互","source_location":"全文","rule_ref":"02#12 长按桌面 0.3 秒且持有记牌器道具时弹出记牌器，松手关闭，点击牌数区域也可打开；03#13 小结算外围按钮：剩余牌按钮（有剩余牌墙才显示）、安全按钮（非匹配场）、洗牌按钮（盒内道具）、幸运按钮（自己赢且非最后一局）、按住半透明查看牌桌；05#17 倒计时进行中他人超 8 秒未操作时弹道具引导提醒层（仅他人）；08#12 预约条件：自己已胡 + 非最后一局 + 未预约 + 非复盘，当日首次显示带提示。","original_text":"（需求文档无对应描述，位置：全文无记牌器、预约洗牌、道具引导、小结算外围按钮内容；\"本期开发范围\"仅有范围声明引文：\"本期只做游戏内核心流程。原文中的创房面板、其他玩法选项、大结算和非核心桌面功能，如在核心段落中被引用，仅作原文上下文。\"）","problem":"记牌器、预约洗牌、道具引导提醒、小结算外围按钮（洗牌/幸运/剩余牌）等道具相关功能，需求未声明是否属于本期，也未声明排除。","impact":"范围外功能在开发中被随手实现或遗漏，验收范围无法界定。","suggestion":"在开发范围中逐项声明道具类功能做/不做（含小结算外围按钮与 8 秒道具引导），不做项移入差异说明附录。","status":"待确认","has_detail":true,"acceptance":"基准中每个道具相关交互在本期范围中均有'做/不做'结论。"},{"id":"Q28","title":"首出庄/闲提示条的表现形式模糊","priority":"P3","type":"定义歧义","module":["发牌"],"dimension":"UI 交互","source_location":"发牌-切入行牌","rule_ref":"01#22 首出提示：本局第一次出牌权限时显示庄/闲提示条（按自己是否庄家切文案）、隐藏骰子，仅显示一次；07#10 首出庄/闲提示：本局第一次出牌权限时显示提示条（按自己是否庄家切文案）+ 隐藏骰子，仅一次。","original_text":"位置\"局内流程 → 发牌 → 切入行牌\"。引文：\"理牌完成后，骰盘区域切换为庄家出牌倒计时。庄家收到优先出牌提示，闲家收到等待提示，首个操作阶段按4.5、4.6处理。\"另\"首打提示\"引文：\"理牌完成后，骰盘区域显示庄家出牌倒计时。庄家可开始操作，闲家等待。\"","problem":"'优先出牌提示/等待提示'未定义表现形式：提示条样式与位置、庄/闲文案内容、是否隐藏骰子、持续时长与'仅显示一次'的口径。","impact":"首局首次出牌前各家看到什么无标准，实现各自发挥，录屏对照无据。","suggestion":"定义提示条样式/位置/文案（庄、闲各一套）、显示时机（首次出牌权限时）、隐藏骰子与仅显示一次规则。","status":"待确认","has_detail":true,"acceptance":"首局首次出牌权限时提示条按身份显示正确文案且仅出现一次。"},{"id":"Q29","title":"倒计时音效未定义","priority":"P3","type":"需求缺失","module":["方位信息-倒计时"],"dimension":"UI 交互","source_location":"方位信息-倒计时","rule_ref":"01#20 倒计时：中央数字逐秒倒数，最后 3 秒切红色字体，自己回合且未自动胡时播倒计时音效，>999 不显示，复盘模式不显示；07#2 配色：>3 秒默认蓝色，最后 3 秒切红色字体，自己回合且未自动胡时播倒计时音效。","original_text":"位置\"局中信息 → 方位信息 → 倒计时\"。引文：\"中央用两位数字显示当前阶段剩余秒数，按秒递减，普通数字为蓝青色，03、02、01、00为黄色。阶段开始时按该阶段配置的时间起始秒数刷新\"（该条目无音效描述；\"发牌\"章节音效列仅有引文：\"待确认。发牌与理牌的音效资源及触发时点本方案不添加。\"）","problem":"基准在自己回合且未自动胡时播倒计时音效，需求倒计时条目无音效定义，也未像发牌音效那样显式声明'不添加'，做与不做悬空。","impact":"音效缺失或多余都会在验收时产生争议，且与 Q06 的末段变色结论联动（变色常伴音效）。","suggestion":"明确本期是否播倒计时音效（含触发条件：自己回合且未自动胡），不做则如发牌音效一样显式声明。","status":"待确认","has_detail":true,"acceptance":"倒计时音效在本期有'播/不播'的唯一结论。"},{"id":"Q30","title":"摸牌凑牌动画（凑成顺/刻/杠）未定义","priority":"P3","type":"需求缺失","module":["行牌操作-摸牌"],"dimension":"UI 交互","source_location":"行牌操作-摸牌","rule_ref":"08#10 常规摸牌：自己摸牌滑入动画 + 凑牌动画检查（凑成顺/刻/杠按花色播动画）；他人直接摆牌；牌墙消一张 + 剩余牌数更新。","original_text":"位置\"局内流程 → 行牌操作 → 摸牌\"。引文：\"牌墙中顺时针发牌，每次发1张，与一般手牌间隔4分之1牌距离。\"\"从手牌最右侧从上往下缓冲落下，1帧效果。\"位置\"行牌操作｜修改对比版 → 摸牌\"。引文：\"新牌正面从手牌右端上方快速落下，停在最右分隔位，落稳后与主体手牌同高，并留出间距。\"全文无凑牌动画描述。","problem":"摸到的牌与手牌凑成顺/刻/杠时按花色播凑牌动画的现网交互，需求完全未提及，保留与移除未声明。","impact":"玩家对已成型牌组的视觉反馈缺失，与现网对照会被误判为功能缺失。","suggestion":"声明凑牌动画做/不做；做则定义触发条件（凑成顺/刻/杠）与按花色区分的表现。","status":"待确认","has_detail":true,"acceptance":"摸牌凑成顺/刻/杠时桌面表现有唯一结论。"},{"id":"Q31","title":"离线解散预警（好友房离线超时处理）未定义","priority":"P3","type":"需求缺失","module":["玩家状态"],"dimension":"UI 交互","source_location":"玩家头像信息-玩家状态","rule_ref":"05#14 离线解散预警：玩家离线触发预警提示（好友房缺省 600 秒，房间配置可覆盖）。","original_text":"位置\"局中信息 → 玩家头像信息 → 玩家状态\"。引文：\"离线状态：头像处覆盖断线图标，且显示断线计时，格式为分秒'00:00'，每次断线重新计时\"\"备注：在当前动画播放过程中有玩家离线切后台等，不会因此中断原本的动画流程\"。全文无离线超时解散相关描述。","problem":"玩家离线达到阈值时是否触发解散预警、预警提示的样式与文案、阈值时长均未定义；需求只写了断线图标与计时表现。","impact":"好友房玩家长期离线时房间悬挂无出口，其余玩家无预期。","suggestion":"补写离线预警：触发阈值（如 600 秒）、提示层样式与文案、预警后的解散行为。","status":"待确认","has_detail":true,"acceptance":"玩家离线达到定义阈值时出现定义的预警提示。"},{"id":"Q32","title":"断线计时 1 小时封顶停表规则缺失","priority":"P3","type":"描述不完整","module":["玩家状态"],"dimension":"UI 交互","source_location":"玩家头像信息-玩家状态","rule_ref":"04#17 断线：头像覆盖断线图标 + 分秒计时（mm:ss，不足 10 补 0），满 1 小时封顶显示\"60:00\"停表；断线时长初值按断线时间戳计算。","original_text":"位置\"局中信息 → 玩家头像信息 → 玩家状态\"。引文：\"离线状态：头像处覆盖断线图标，且显示断线计时，格式为分秒'00:00'，每次断线重新计时\"","problem":"需求定义了格式（分秒）与重置（每次断线重新计时），但未定义满 1 小时封顶显示'60:00'停表，以及计时初值按断线时间戳计算（断线期间退出重进仍延续计时）的口径。","impact":"长时间离线计时无限增长，断线期间重进后计时表现未定义，与预期不符。","suggestion":"补写封顶停表（满 1 小时显示'60:00'不再增长）与计时初值按断线时间戳计算的规则。","status":"待确认","has_detail":true,"acceptance":"断线满 1 小时计时停在'60:00'，断线期间重进后计时延续而非归零。"},{"id":"Q33","title":"昵称截断\"超出第78个字符\"笔误（应为第 10 个）","priority":"P3","type":"逻辑错误","module":["玩家头像信息"],"dimension":"UI 交互","source_location":"玩家头像信息-玩家昵称","rule_ref":"08#3 开局面板：每家显示头像/昵称（截 10 字）/分数；spine 播放中面板挂骨骼挂点（按人数 2/3/4 挂不同挂点），面板淡出后发应答。","original_text":"位置\"局中信息 → 玩家头像信息 → 玩家昵称\"。引文：\"游戏中常显，最多显示10个字符（中文占2字符，英文/符号/数字占1字符），超出第78个字符显示'..'\"","problem":"前文'最多显示10个字符'与后文'超出第78个字符'矛盾，应为'超出第 10 个字符'的笔误，截断位置无法确定。","impact":"开发可能照'78'实现导致超长昵称不截断，或各端理解不一。","suggestion":"修正为'超出第 10 个字符显示..'，并确认省略号样式。","status":"待确认","has_detail":true,"acceptance":"超过 10 个字符宽度的昵称按规则截断并显示省略号。"},{"id":"Q34","title":"设置开关相关范围未定义（出牌方式/放大/牌墙/快出/特效）","priority":"P3","type":"描述不完整","module":["全局"],"dimension":"UI 交互","source_location":"行牌操作-出牌等","rule_ref":"01#12 出牌三种方式均为设置项控制（单击直接出需设置开启）；01#19 快出牌开关：房规或匹配场时出牌飞行动画时长由 0.15s 缩到 0.1s；07#8 牌墙显示开关按玩家设置；07#14 他人出牌放大展示（按座位），受设置开关控制，碰/杠/胡/流局/重置时统一隐藏。","original_text":"位置\"局内流程 → 行牌操作 → 出牌\"。引文：\"出牌共有双击出牌、单击出牌、滑动出牌三种，其中双击出牌和单机出牌互斥，滑动出牌不互斥。可根据设置开关：\"\"其他家：开启放大出牌（默认开）：出牌时放大展示，并打出放置于该玩家面前牌堆中，下一个玩家有操作行为后消失\"。位置\"行牌操作｜修改对比版 → 出牌\"。引文：\"本方案默认双击出牌。滑动出牌默认开。单击出牌归设置模块，本方案不包含该模式。\"\"关闭出牌放大时，实牌飞行、牌河落位和浮标照常显示。\"","problem":"出牌方式、出牌放大、牌墙显示、快出牌、显示特效在基准中均为设置项，需求多处写'可根据设置开关''默认开'，但设置入口、开关清单、默认值与本期范围均未定义（仅单击出牌声明'归设置模块，本方案不包含'）。","impact":"开关实现范围不明，开发遗漏或越界实现设置模块。","suggestion":"补一张本期设置开关清单：开关名、默认值、生效范围，明确哪些本期固定、哪些随设置模块后续版本。","status":"待确认","has_detail":true,"acceptance":"正文引用的每个'设置开关'在清单中有唯一条目与默认值。"},{"id":"Q35","title":"结算表现细节缺失（番型动画选取规则、超基础番型震动）","priority":"P3","type":"需求缺失","module":["结算流程"],"dimension":"UI 交互","source_location":"结算流程-流程明细","rule_ref":"03#9 番型动画番型选取：胡牌过程命令按升序取最小番型、局终命令按降序取最大番型（两处口径不同，需求需注意）；03#16 自己胡出超基础组合番型时手机震动一次（复盘不震）。","original_text":"位置\"三、对局流程 → 结算流程 → 流程明细\"。引文：\"触发操作：对局中有玩家胡牌，根据玩家的番型播放对应番型特效\"\"参考功夫川麻的胡牌流程即可\"。全文无震动与番型选取规则描述。","problem":"一手牌同时命中多个番型时动画播哪个未定义（基准中过程与局终两处口径都不一致）；自己胡出超基础组合番型时的手机震动反馈未定义。","impact":"番型动画选取不定则表现随机，震动反馈缺失影响高价值牌型的可感知性。","suggestion":"定义番型动画选取口径（最小/最大/按优先级）与震动触发条件（超基础组合番型、复盘不震）。","status":"待确认","has_detail":true,"acceptance":"复合番型局播出的动画番型可按定义口径复现，震动触发条件明确。"},{"id":"Q36","title":"局与局之间的界面重置清理未描述","priority":"P3","type":"需求缺失","module":["全局"],"dimension":"UI 交互","source_location":"对局开始-触发逻辑","rule_ref":"06#四.4 再来一局：统一重置事件驱动所有视图各自清理（清数据/按钮态归零/隐藏大牌出牌/停动画/关小结算弹窗）；06#四.7 游戏结束：隐藏听牌相关、清倒计时、清飘分。","original_text":"位置\"局内流程 → 对局开始 → 触发逻辑\"。引文：\"仅在开房后的首次开局播放「对局开始」动画。\"\"首次开局时，先等待云检测流程结束后再播放。\"\"常驻玩家信息区开始隐藏记为 T=0。以下时点均相对 T=0 计算。同一场内，后续小局直接进入摇骰发牌。\"","problem":"需求只写'后续小局直接进入摇骰发牌'，上一局遗留的浮标、出牌放大、听牌弹窗与箭头、倒计时与方位灯、飘分、按钮态、小结算弹窗如何清理未描述。","impact":"跨局状态残留是典型回归缺陷（如上一局浮标留到下一局），无清理定义则无法验收。","suggestion":"补写'下一局开始前的界面重置清单'：统一重置事件驱动各视图清理数据、按钮态、浮标、放大牌、听牌、倒计时、飘分与弹窗。","status":"待确认\n\n---","has_detail":true,"acceptance":"第 2 局起每局开始时桌面无上一局残留状态。"}],"overall_recommendations":[]}</script>

<script>
(function () {
  'use strict';
  var REPORTS = [
    { label: '杭州麻将分析', jsonId: 'report-data-0' },
    { label: 'UI交互 PRD 分析', jsonId: 'report-data-1' }
  ];
  var DATA = null;
  var byId = {};
  var typeKeys = [];
  var filter = { priority: '', type: '', dimension: '', module: '', q: '' };
  var curTab = -1;

  var PRI_COLOR = { P0: '#DC5148', P1: '#E8A044', P2: '#4389D5', P3: '#94A3B8' };
  var PRI_ORDER = { P0: 0, P1: 1, P2: 2, P3: 3 };
  var TYPE_COLOR = ['#3478DB', '#9A6FE0', '#DC5148', '#E8A044', '#94A3B8', '#4EC3B0'];
  var TYPE_DESC = {
    '需求缺失': '基准规则已定义，但需求文档缺失或未描述（MISSING）',
    '内容冲突': '需求文档内部两处描述互相矛盾（CONFLICT）',
    '逻辑错误': '与规则基准冲突或自身逻辑错误（LOGIC）',
    '定义歧义': '描述模糊，可多种理解（AMBIGUOUS）',
    '描述不完整': '描述不完整，无法实现或验收（INCOMPLETE）',
    '未分类': '源报告该条目仅登记在清单中，无详情块，未提供问题性质'
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function stripMd(s) { return String(s || '').replace(/\*\*/g, ''); }
  function priTag(p) { return '<span class="pri-tag" style="background:' + PRI_COLOR[p] + '">' + p + '</span>'; }
  function $(id) { return document.getElementById(id); }

  // 渲染当前报告（每次切换 Tab 全量重建）
  function mount(tabIdx) {
    curTab = tabIdx;
    DATA = JSON.parse(document.getElementById(REPORTS[tabIdx].jsonId).textContent);
    byId = {};
    DATA.issues.forEach(function (it) { byId[it.id] = it; });
    typeKeys = Object.keys(DATA.statistics.types);
    filter = { priority: '', type: '', dimension: '', module: '', q: '' };
    closeDrawer();

    // 重置筛选控件（下拉只保留第一个"全部"选项）
    ['f-type', 'f-dimension', 'f-module'].forEach(function (id) {
      var sel = $(id);
      while (sel.options.length > 1) sel.remove(1);
      sel.value = '';
    });
    $('f-priority').value = '';
    $('f-q').value = '';

    // ---------- 01 头部 ----------
    (function () {
      var c = DATA.report.overall_conclusion || {};
      var badge = c.status === 'BLOCKED'
        ? '<span class="badge blocked">存在阻塞问题</span>'
        : c.status === 'ALLOWED'
          ? '<span class="badge allowed">可进入下一阶段</span>'
          : '<span class="badge na">检查完成</span>';
      var baselines = (DATA.report.rule_baselines || []).map(stripMd).join('；');
      $('sec-header').innerHTML =
        '<div><h1>' + esc(DATA.report.title || 'PRD 质量分析报告') + '</h1>' +
        '<div class="project">' + esc(DATA.report.project_name ? DATA.report.project_name + ' · ' + DATA.report.document_name : DATA.report.document_name) + '</div>' +
        '<div class="meta">' +
          '<span>检查对象：' + esc(DATA.report.source_file) + '</span>' +
          '<span>检查日期：' + esc(DATA.report.inspection_date) + '</span>' +
          (baselines ? '<span>检查基准：' + esc(baselines) + '</span>' : '') +
        '</div></div><div>' + badge + '</div>';
    })();

    // ---------- 02 KPI ----------
    (function () {
      var p = DATA.statistics.priority;
      var total = DATA.statistics.total;
      var p23 = (p.P2 || 0) + (p.P3 || 0);
      var cards = [
        { num: total, label: '问题总数', cls: '', filter: {} },
        { num: p.P0 || 0, label: 'P0 严重问题', cls: 'c-p0', filter: { priority: 'P0' } },
        { num: p.P1 || 0, label: 'P1 高优先级', cls: 'c-p1', filter: { priority: 'P1' } },
        { num: p23, label: 'P2 一般 + P3 建议', cls: 'c-p23', filter: { p23: true } }
      ];
      $('sec-kpis').innerHTML = cards.map(function (c) {
        return '<div class="kpi" data-filter=\'' + esc(JSON.stringify(c.filter)) + '\' role="button" tabindex="0">' +
          '<div class="num ' + c.cls + '">' + c.num + '</div><div class="label">' + esc(c.label) + '</div></div>';
      }).join('');
      Array.prototype.forEach.call(document.querySelectorAll('.kpi'), function (el) {
        var go = function () {
          var f = JSON.parse(el.getAttribute('data-filter'));
          if (f.p23) { setFilter({ priority: ['P2', 'P3'] }); } else { setFilter(f); }
          scrollTo(0, $('sec-list').offsetTop - 12);
        };
        el.addEventListener('click', go);
        el.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
      });
    })();

    // ---------- 03 结论 ----------
    (function () {
      var c = DATA.report.overall_conclusion || {};
      if (!c.summary) { $('sec-conclusion').style.display = 'none'; return; }
      var reasons = (c.reasons || []).map(function (r) { return '<li>' + esc(stripMd(r)) + '</li>'; }).join('');
      $('sec-conclusion').innerHTML =
        '<div class="section-title">检查结论</div>' +
        '<div class="verdict ' + (c.status === 'BLOCKED' ? 'blocked' : c.status === 'ALLOWED' ? 'allowed' : '') + '">' +
          esc(stripMd(c.summary)) + '</div>' +
        (reasons ? '<ul class="reasons">' + reasons + '</ul>' : '');
    })();

    // ---------- 04 风险 ----------
    (function () {
      var groups = DATA.risk_groups || [];
      if (!groups.length) { $('sec-risks').style.display = 'none'; return; }
      $('sec-risks').innerHTML = '<div class="section-title">重点风险分析</div><div class="risk-cols">' +
        groups.map(function (g) {
          var items = g.issue_ids.map(function (id) {
            var it = byId[id]; if (!it) return '';
            return '<div class="risk-item" data-open="' + id + '">' + priTag(it.priority) +
              '<div class="body"><div class="name">' + esc(it.title) + '<span class="id">' + id + '</span></div>' +
              '<div class="desc">' + esc(stripMd(it.impact)) + '</div></div></div>';
          }).join('');
          return '<div class="risk-group"><h3>' + esc(g.name) + '<span class="id" style="color:var(--muted);font-weight:400;margin-left:8px">' +
            g.issue_ids.length + ' 项</span></h3>' + items + '</div>';
        }).join('') + '</div>';
    })();

    // ---------- 05 图表 ----------
    (function () {
      var st = DATA.statistics, total = st.total;
      var priRows = ['P0', 'P1', 'P2', 'P3'].filter(function (p) { return st.priority[p]; }).map(function (p) {
        var n = st.priority[p];
        return '<div class="bar-row" data-pri="' + p + '" title="点击按 ' + p + ' 筛选">' +
          '<span class="bl" style="color:' + PRI_COLOR[p] + '">' + p + '</span>' +
          '<span class="track"><span class="fill" style="width:' + (total ? (n / total * 100) : 0) + '%;background:' + PRI_COLOR[p] + '"></span></span>' +
          '<span class="val">' + n + ' · ' + (total ? (n / total * 100).toFixed(2) : 0) + '%</span></div>';
      }).join('');

      var R = 62, C = 2 * Math.PI * R, used = 0;
      var segs = typeKeys.map(function (t, i) {
        var n = st.types[t], len = total ? (n / total * C) : 0;
        var s = '<circle r="' + R + '" cx="80" cy="80" fill="none" stroke="' + TYPE_COLOR[i % TYPE_COLOR.length] +
          '" stroke-width="22" stroke-dasharray="' + Math.max(len - 2, 0) + ' ' + (C - Math.max(len - 2, 0)) +
          '" stroke-dashoffset="' + (-used) + '"></circle>';
        used += len;
        return s;
      }).join('');
      var legend = typeKeys.map(function (t, i) {
        var n = st.types[t];
        return '<div class="legend-item" data-type="' + esc(t) + '" title="' + esc(TYPE_DESC[t] || t) + '" style="cursor:help">' +
          '<span class="dot" style="background:' + TYPE_COLOR[i % TYPE_COLOR.length] + '"></span>' +
          '<span class="t">' + esc(t) + '</span><span class="v">' + n + ' · ' + (total ? (n / total * 100).toFixed(1) : 0) + '%</span></div>';
      }).join('');

      var mods = (DATA.modules || []).slice().sort(function (a, b) { return b.issue_ids.length - a.issue_ids.length; });
      var maxMod = mods.length ? mods[0].issue_ids.length : 1;
      var modRows = mods.map(function (m) {
        return '<div class="bar-row" data-mod="' + esc(m.name) + '" title="重点模块集合（非全量互斥分类），点击筛选">' +
          '<span class="bl" style="width:auto;min-width:34px">' + esc(m.name) + '</span>' +
          '<span class="track"><span class="fill" style="width:' + (m.issue_ids.length / maxMod * 100) + '%;background:var(--primary)"></span></span>' +
          '<span class="val">' + m.issue_ids.length + ' 条</span></div>';
      }).join('') || '<div class="empty">无模块数据</div>';

      $('sec-charts').innerHTML =
        '<div class="chart"><h3>优先级分布</h3>' + priRows + '</div>' +
        '<div class="chart"><h3>问题类型分布</h3><div class="donut-wrap">' +
          '<div class="donut"><svg viewBox="0 0 160 160">' + segs + '</svg>' +
          '<div class="center"><b>' + total + '</b><span>问题总数</span></div></div>' +
          '<div class="legend">' + legend + '</div></div></div>' +
        '<div class="chart"><h3>重点业务模块分布</h3>' + modRows +
          '<div style="font-size:11px;color:var(--muted);margin-top:8px">注：来自报告总结的重点模块集合，非全部问题的互斥分类</div></div>';
    })();

    // ---------- 06 TOP5 ----------
    (function () {
      var feat = DATA.featured_issues || [];
      if (!feat.length) { $('sec-top').style.display = 'none'; return; }
      var finIds = ((DATA.risk_groups || []).find(function (g) { return g.key === 'financial'; }) || {}).issue_ids || [];
      $('sec-top').innerHTML = '<div class="section-title">重点问题 TOP ' + feat.length +
        '<span class="sub">排序依据：开发阻塞、资损风险、优先级</span></div><div class="top-list">' +
        feat.map(function (id, i) {
          var it = byId[id]; if (!it) return '';
          return '<div class="rank" data-open="' + id + '">' +
            '<span class="no">' + (i + 1) + '</span>' +
            priTag(it.priority) +
            '<span class="title"><span class="id">' + id + '</span>' + esc(it.title) + '</span>' +
            '<span class="tag">' + esc(it.type) +
            (finIds.indexOf(id) >= 0 ? '<span class="rf">资损风险</span>' : '') + '</span></div>';
        }).join('') + '</div>';
    })();

    // ---------- 08 综合分析 ----------
    (function () {
      var recs = DATA.overall_recommendations || [];
      if (!recs.length) { $('sec-analysis').style.display = 'none'; return; }
      $('sec-analysis').innerHTML = '<div class="section-title">综合分析与建议<span class="sub">保留报告原始结论</span></div><ul>' +
        recs.map(function (r) { return '<li>' + esc(stripMd(r)) + '</li>'; }).join('') + '</ul>';
    })();

    // ---------- 07 清单下拉选项 ----------
    typeKeys.forEach(function (t) {
      var o = document.createElement('option'); o.value = t; o.textContent = t; $('f-type').appendChild(o);
    });
    Object.keys(DATA.statistics.dimensions || {}).forEach(function (d) {
      var o = document.createElement('option'); o.value = d; o.textContent = d + '（' + DATA.statistics.dimensions[d] + '）'; $('f-dimension').appendChild(o);
    });
    (DATA.modules || []).forEach(function (m) {
      var o = document.createElement('option'); o.value = m.name; o.textContent = m.name + '（' + m.issue_ids.length + '）'; $('f-module').appendChild(o);
    });

    renderList();
  }

  // ---------- 清单筛选 ----------
  function filtered() {
    var q = filter.q.trim().toLowerCase();
    var priList = Array.isArray(filter.priority) ? filter.priority : (filter.priority ? [filter.priority] : null);
    return DATA.issues.filter(function (it) {
      if (priList && priList.indexOf(it.priority) < 0) return false;
      if (filter.type && it.type !== filter.type) return false;
      if (filter.dimension && (it.dimension || '') !== filter.dimension) return false;
      if (filter.module && (it.module || []).indexOf(filter.module) < 0) return false;
      if (q && (it.id + ' ' + it.title + ' ' + it.source_location).toLowerCase().indexOf(q) < 0) return false;
      return true;
    }).sort(function (a, b) { return PRI_ORDER[a.priority] - PRI_ORDER[b.priority] || a.id.localeCompare(b.id); });
  }

  function renderList() {
    var list = filtered();
    $('issue-tbody').innerHTML = list.map(function (it) {
      return '<tr data-open="' + it.id + '"><td class="id">' + it.id + '</td><td class="title">' + esc(it.title) + '</td>' +
        '<td>' + priTag(it.priority) + '</td><td><span class="type-tag">' + esc(it.type) + '</span></td>' +
        '<td><span class="type-tag">' + esc(it.dimension || '功能规则') + '</span></td>' +
        '<td class="loc">' + esc(it.source_location) + '</td></tr>';
    }).join('');
    $('issue-empty').style.display = list.length ? 'none' : 'block';
    $('f-count').textContent = '当前显示 ' + list.length + ' / ' + DATA.statistics.total + ' 条';
    document.querySelectorAll('.bar-row[data-pri], .legend-item[data-type], .bar-row[data-mod]').forEach(function (el) {
      var active = false;
      if (el.dataset.pri) active = (Array.isArray(filter.priority) ? filter.priority.join() : filter.priority) === el.dataset.pri
        || (Array.isArray(filter.priority) && filter.priority.length === 1 && filter.priority[0] === el.dataset.pri);
      if (el.dataset.type) active = filter.type === el.dataset.type;
      if (el.dataset.mod) active = filter.module === el.dataset.mod;
      el.classList.toggle('active', active);
    });
  }

  function setFilter(f) {
    filter.priority = f.priority !== undefined ? f.priority : '';
    filter.type = f.type !== undefined ? f.type : '';
    filter.module = f.module !== undefined ? f.module : '';
    $('f-priority').value = Array.isArray(filter.priority) ? '' : filter.priority;
    $('f-type').value = filter.type;
    $('f-module').value = filter.module;
    renderList();
  }

  // 筛选控件（静态元素，绑一次）
  $('f-priority').addEventListener('change', function () { filter.priority = this.value; renderList(); });
  $('f-type').addEventListener('change', function () { filter.type = this.value; renderList(); });
  $('f-dimension').addEventListener('change', function () { filter.dimension = this.value; renderList(); });
  $('f-module').addEventListener('change', function () { filter.module = this.value; renderList(); });
  $('f-q').addEventListener('input', function () { filter.q = this.value; renderList(); });
  $('btn-clear').addEventListener('click', function () {
    filter = { priority: '', type: '', dimension: '', module: '', q: '' };
    $('f-priority').value = ''; $('f-type').value = ''; $('f-dimension').value = ''; $('f-module').value = ''; $('f-q').value = '';
    renderList();
  });

  // Tab 切换 + 图表点击筛选 + 打开抽屉（document 级委托，绑一次）
  document.addEventListener('click', function (e) {
    var tabEl = e.target.closest ? e.target.closest('.tab') : null;
    if (tabEl) {
      var idx = parseInt(tabEl.getAttribute('data-tab'), 10);
      if (idx !== curTab) {
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) { t.classList.toggle('active', t === tabEl); });
        scrollTo(0, 0);
        mount(idx);
      }
      return;
    }
    var priEl = e.target.closest ? e.target.closest('.bar-row[data-pri]') : null;
    if (priEl) {
      filter.priority = (filter.priority === priEl.dataset.pri) ? '' : priEl.dataset.pri;
      $('f-priority').value = Array.isArray(filter.priority) ? '' : filter.priority;
      renderList(); return;
    }
    var typeEl = e.target.closest ? e.target.closest('.legend-item[data-type]') : null;
    if (typeEl) {
      filter.type = (filter.type === typeEl.dataset.type) ? '' : typeEl.dataset.type;
      $('f-type').value = filter.type; renderList(); return;
    }
    var modEl = e.target.closest ? e.target.closest('.bar-row[data-mod]') : null;
    if (modEl) {
      filter.module = (filter.module === modEl.dataset.mod) ? '' : modEl.dataset.mod;
      $('f-module').value = filter.module; renderList(); return;
    }
    var openEl = e.target.closest ? e.target.closest('[data-open]') : null;
    if (openEl) openDrawer(openEl.getAttribute('data-open'));
  });

  // ---------- 抽屉 ----------
  var curId = null;
  function inlineMd(s) {
    return esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }
  function renderRich(text) {
    if (!text || !String(text).trim()) return '<p style="color:var(--muted)">（源报告清单条目，无详情块，未提供该字段内容）</p>';
    var html = [], tbl = [];
    function flush() {
      if (!tbl.length) return;
      var rows = tbl.filter(function (l) { return !/^\|[\s:|-]+\|?$/.test(l.trim()); });
      var trs = rows.map(function (row, ri) {
        var cells = row.replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); });
        var tag = ri === 0 ? 'th' : 'td';
        return '<tr>' + cells.map(function (c) { return '<' + tag + '>' + inlineMd(c) + '</' + tag + '>'; }).join('') + '</tr>';
      }).join('');
      html.push('<table class="mini-table">' + trs + '</table>');
      tbl = [];
    }
    String(text).split('\n').forEach(function (l) {
      var t = l.trim();
      if (t.startsWith('|')) { tbl.push(l); return; }
      flush();
      var h = t.match(/^\*\*([^*]+)\*\*([：:])?\s*$/);
      if (h) { html.push('<h5>' + esc(h[1]) + (h[2] || '') + '</h5>'); return; }
      if (t) html.push('<p>' + inlineMd(l) + '</p>');
    });
    flush();
    return html.length ? html.join('') : '<p style="color:var(--muted)">（源报告清单条目，无详情块，未提供该字段内容）</p>';
  }
  function openDrawer(id) {
    var it = byId[id]; if (!it) return;
    curId = id;
    $('d-pri').textContent = it.priority; $('d-pri').style.background = PRI_COLOR[it.priority] || '#94A3B8';
    $('d-id').textContent = id + ' · ' + it.type + (it.dimension ? ' · ' + it.dimension : '');
    $('d-title').textContent = it.title;
    var bodyHtml = '<h4>原文位置</h4>' + renderRich(it.source_location);
    if (it.original_text && String(it.original_text).trim()) bodyHtml += '<h4>原文引用</h4><blockquote>' + esc(it.original_text) + '</blockquote>';
    bodyHtml += '<h4>问题分析</h4>' + renderRich(it.problem || it.title);
    if (it.impact && String(it.impact).trim()) bodyHtml += '<h4>影响说明</h4>' + renderRich(it.impact);
    if (it.suggestion && String(it.suggestion).trim()) bodyHtml += '<h4>修改建议</h4>' + renderRich(it.suggestion);
    if (it.rule_ref) bodyHtml += '<h4>基准依据</h4>' + renderRich(it.rule_ref);
    if (it.acceptance) bodyHtml += '<h4>验收口径</h4>' + renderRich(it.acceptance);
    if (!it.has_detail) bodyHtml += '<div class="status">清单级条目：源报告未展开详情块，问题描述摘自清单问题列，原文引用与建议待补</div>';
    $('d-body').innerHTML = bodyHtml +
      '<div class="status">处理状态：' + esc(it.status) + '（只读，Dashboard 不提供裁决操作）' +
      (it.module && it.module.length ? ' · 模块：' + esc(it.module.join('、')) : '') + '</div>';
    var list = filtered();
    var idx = list.findIndex(function (x) { return x.id === id; });
    $('d-pos').textContent = idx >= 0 ? (idx + 1) + ' / ' + list.length : '';
    $('d-prev').disabled = idx <= 0;
    $('d-next').disabled = idx >= 0 && idx >= list.length - 1;
    $('drawer').classList.add('show'); $('drawer').setAttribute('aria-hidden', 'false');
    $('mask').classList.add('show');
    $('d-body').scrollTop = 0;
  }
  function closeDrawer() {
    $('drawer').classList.remove('show'); $('drawer').setAttribute('aria-hidden', 'true');
    $('mask').classList.remove('show'); curId = null;
  }
  $('d-close').addEventListener('click', closeDrawer);
  $('mask').addEventListener('click', closeDrawer);
  $('d-prev').addEventListener('click', function () {
    var list = filtered(), i = list.findIndex(function (x) { return x.id === curId; });
    if (i > 0) openDrawer(list[i - 1].id);
  });
  $('d-next').addEventListener('click', function () {
    var list = filtered(), i = list.findIndex(function (x) { return x.id === curId; });
    if (i >= 0 && i < list.length - 1) openDrawer(list[i + 1].id);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeDrawer();
    if (!curId) return;
    if (e.key === 'ArrowLeft') $('d-prev').click();
    if (e.key === 'ArrowRight') $('d-next').click();
  });

  // ---------- 浮动操作 ----------
  $('btn-top').addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  $('btn-print').addEventListener('click', function () { window.print(); });

  mount(0);
})();
</script>
</body>
</html>
