<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRD 质量分析报告 · 合并（杭州麻将 + UI交互）</title>
<style>
  :root {
    --bg: #F6F8FB;
    --card: #FFFFFF;
    --primary: #3478DB;
    --p0: #DC5148;
    --p1: #E8A044;
    --p2: #4389D5;
    --p3: #94A3B8;
    --text: #253247;
    --muted: #8491A3;
    --border: #E7ECF2;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .page { max-width: 1440px; margin: 0 auto; padding: 24px 32px 48px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }
  .section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .section-title .sub { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 8px; }

  /* 01 头部 */
  .header { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header .project { font-size: 15px; color: var(--muted); margin-top: 4px; }
  .header .meta { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .header .meta span { margin-right: 20px; }
  .badge { display: inline-block; padding: 5px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .badge.blocked { background: #FDECEA; color: var(--p0); }
  .badge.allowed { background: #E8F5EC; color: #2F9E5B; }
  .badge.na { background: #EEF1F5; color: var(--muted); }

  /* 02 KPI */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
  .kpi {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px 24px; cursor: pointer; transition: box-shadow .15s, transform .15s;
  }
  .kpi:hover { box-shadow: 0 4px 14px rgba(52,120,219,.12); transform: translateY(-1px); }
  .kpi .num { font-size: 34px; font-weight: 700; line-height: 1.2; }
  .kpi .label { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .kpi .num.c-p0 { color: var(--p0); } .kpi .num.c-p1 { color: var(--p1); }
  .kpi .num.c-p23 { color: var(--text); }

  /* 03 结论 */
  .conclusion .verdict { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
  .conclusion .verdict.blocked { color: var(--p0); }
  .conclusion .verdict.allowed { color: #2F9E5B; }
  .conclusion .reasons { margin-top: 10px; padding-left: 20px; color: var(--text); }
  .conclusion .reasons li { margin: 3px 0; }

  /* 04 风险 */
  .risk-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .risk-group h3 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .risk-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .risk-item:hover { border-color: var(--primary); background: #F7FAFE; }
  .risk-item .pri { flex: none; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 4px; color: #fff; margin-top: 2px; }
  .risk-item .body { flex: 1; min-width: 0; }
  .risk-item .name { font-weight: 600; font-size: 13px; }
  .risk-item .name .id { color: var(--muted); font-weight: 400; margin-left: 6px; white-space: nowrap; }
  .risk-item .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* 05 分布图表 */
  .charts { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 24px; }
  .chart h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 12px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; padding: 3px 4px; border-radius: 6px; }
  .bar-row:hover, .bar-row.active { background: #F0F6FD; }
  .bar-row .bl { flex: none; width: 34px; font-weight: 600; font-size: 13px; }
  .bar-row .track { flex: 1; display: block; height: 18px; background: #F0F3F7; border-radius: 4px; overflow: hidden; }
  .bar-row .fill { display: block; height: 100%; border-radius: 4px; min-width: 6px; }
  .bar-row .val { flex: none; width: 96px; font-size: 12px; color: var(--muted); text-align: right; }
  .donut-wrap { display: flex; align-items: center; gap: 18px; }
  .donut { flex: none; position: relative; width: 160px; height: 160px; }
  .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut .center b { font-size: 26px; }
  .donut .center span { font-size: 11px; color: var(--muted); }
  .legend { flex: 1; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .legend-item:hover, .legend-item.active { background: #F0F6FD; }
  .legend-item .dot { flex: none; width: 10px; height: 10px; border-radius: 3px; }
  .legend-item .t { flex: 1; }
  .legend-item .v { color: var(--muted); }

  /* 06 TOP5 */
  .top-list .rank {
    display: flex; align-items: center; gap: 12px; padding: 11px 12px;
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .top-list .rank:hover { border-color: var(--primary); background: #F7FAFE; }
  .top-list .no { flex: none; width: 22px; height: 22px; border-radius: 50%; background: #EEF1F5; color: var(--muted); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .top-list .title { flex: 1; font-weight: 600; font-size: 13px; }
  .top-list .title .id { color: var(--muted); font-weight: 400; margin-right: 8px; }
  .top-list .tag { flex: none; font-size: 11px; color: var(--muted); }
  .top-list .tag .rf { margin-left: 8px; }

  /* 07 问题清单 */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .toolbar select, .toolbar input {
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
    font-size: 13px; background: #fff; color: var(--text); outline: none;
  }
  .toolbar input { width: 220px; }
  .toolbar select:focus, .toolbar input:focus { border-color: var(--primary); }
  .toolbar .count { font-size: 12px; color: var(--muted); }
  .toolbar .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border); background: #fff; color: var(--text);
    border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: #2B66C4; }
  table.issues { width: 100%; border-collapse: collapse; }
  table.issues th {
    text-align: left; font-size: 12px; color: var(--muted); font-weight: 600;
    padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.issues td { padding: 10px; border-bottom: 1px solid #F0F3F7; vertical-align: top; }
  table.issues tbody tr { cursor: pointer; }
  table.issues tbody tr:hover { background: #F7FAFE; }
  td.id, .pri-tag { font-family: "SF Mono", Consolas, monospace; }
  td.id { color: var(--muted); font-size: 12px; white-space: nowrap; }
  td.title { font-weight: 600; max-width: 460px; }
  td.loc { color: var(--muted); font-size: 12px; max-width: 220px; }
  .pri-tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 4px; color: #fff; }
  .type-tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 4px; background: #EEF1F5; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }

  /* 08 综合分析 */
  .analysis ul { padding-left: 20px; }
  .analysis li { margin: 6px 0; }

  /* 抽屉 */
  .mask { position: fixed; inset: 0; background: rgba(20,30,45,.4); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
  .mask.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: -520px; width: 520px; max-width: 100vw; height: 100vh;
    background: #fff; z-index: 50; box-shadow: -8px 0 30px rgba(20,30,45,.15);
    transition: right .25s ease; display: flex; flex-direction: column;
  }
  .drawer.show { right: 0; }
  .drawer-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .drawer-head .id { font-family: monospace; color: var(--muted); font-size: 13px; }
  .drawer-head .title { font-weight: 700; font-size: 15px; flex: 1; }
  .drawer-head .close { border: none; background: none; font-size: 20px; color: var(--muted); cursor: pointer; padding: 4px; }
  .drawer-nav { display: flex; align-items: center; gap: 8px; padding: 8px 20px; border-bottom: 1px solid var(--border); }
  .drawer-nav .pos { font-size: 12px; color: var(--muted); flex: 1; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
  .drawer-body h4 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 18px 0 6px; }
  .drawer-body h4:first-child { margin-top: 0; }
  .drawer-body h5 { font-size: 13px; font-weight: 700; margin: 14px 0 6px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .drawer-body blockquote {
    border-left: 3px solid var(--border); background: #F8FAFC;
    padding: 10px 14px; border-radius: 0 8px 8px 0; white-space: pre-wrap; font-size: 13px; color: #47586E;
  }
  .drawer-body .mini-table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 12px; display: table; }
  .drawer-body .mini-table th, .drawer-body .mini-table td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
  .drawer-body .mini-table th { background: #F6F8FB; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .drawer-body p { font-size: 13px; }
  .drawer-body .status { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--muted); }
  .drawer-body .kv { margin-bottom: 10px; }

  /* 浮动操作 */
  .fab { position: fixed; right: 28px; bottom: 28px; display: flex; flex-direction: column; gap: 10px; z-index: 30; }
  .fab .btn { box-shadow: 0 4px 14px rgba(20,30,45,.12); }

  /* 报告切换 Tab */
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab {
    padding: 10px 22px; border: 1px solid var(--border); background: var(--card);
    border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer;
    font-family: inherit; transition: background .15s, color .15s;
  }
  .tab:hover { border-color: var(--primary); color: var(--primary); }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  /* 响应式 */
  @media (max-width: 1180px) {
    .charts { grid-template-columns: 1fr; }
    .risk-cols { grid-template-columns: 1fr; }
  }
  @media (max-width: 1024px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .page { padding: 16px 20px 40px; }
  }
  @media (max-width: 768px) {
    .kpis { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card { padding: 16px; }
    .toolbar input { width: 100%; }
    .toolbar { gap: 8px; }
    /* 表格转卡片 */
    table.issues, table.issues tbody, table.issues tr, table.issues td { display: block; width: 100%; }
    table.issues thead { display: none; }
    table.issues tbody tr { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; padding: 10px; }
    table.issues tbody td { border: none; padding: 2px 0; }
    td.id { display: inline-block; }
    /* 抽屉全屏 */
    .drawer { width: 100vw; right: -100vw; }
    .fab { right: 16px; bottom: 16px; }
  }

  /* 打印 */
  @media print {
    body { background: #fff; }
    .page { max-width: none; padding: 0; }
    .card { border: none; box-shadow: none; break-inside: avoid; padding: 12px 0; margin-bottom: 12px; }
    .toolbar, .fab, .mask, .drawer, .kpi .label-tip { display: none !important; }
    .kpi { border: 1px solid #ddd; }
    .kpi:hover { transform: none; box-shadow: none; }
    .top-list .rank, .risk-item, table.issues tbody tr { break-inside: avoid; cursor: default; }
    table.issues tbody tr:hover { background: none; }
    a { text-decoration: none; color: inherit; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- 报告切换 -->
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="0">杭州麻将分析（154 项）</button>
    <button class="tab" data-tab="1">UI交互 PRD 分析（36 项）</button>
  </nav>

  <!-- 01 报告头部 -->
  <header class="card header" id="sec-header"></header>

  <!-- 02 质量指标 -->
  <section class="kpis" id="sec-kpis"></section>

  <!-- 03 检查结论 -->
  <section class="card conclusion" id="sec-conclusion"></section>

  <!-- 04 风险分析 -->
  <section class="card" id="sec-risks"></section>

  <!-- 05 问题分布 -->
  <section class="card charts" id="sec-charts"></section>

  <!-- 06 重点问题 TOP5 -->
  <section class="card" id="sec-top"></section>

  <!-- 07 完整问题清单 -->
  <section class="card" id="sec-list">
    <div class="section-title">完整问题清单<span class="sub" id="list-count"></span></div>
    <div class="toolbar" id="toolbar">
      <select id="f-priority">
        <option value="">全部优先级</option>
        <option value="P0">P0</option><option value="P1">P1</option>
        <option value="P2">P2</option><option value="P3">P3</option>
      </select>
      <select id="f-type"><option value="">全部类型</option></select>
      <select id="f-dimension"><option value="">全部维度</option></select>
      <select id="f-module"><option value="">全部模块</option></select>
      <input id="f-q" type="search" placeholder="搜索 ID / 问题 / 位置">
      <button class="btn" id="btn-clear">清除筛选</button>
      <span class="spacer"></span>
      <span class="count" id="f-count"></span>
    </div>
    <div style="overflow-x:auto">
      <table class="issues">
        <thead><tr><th>ID</th><th>问题标题</th><th>优先级</th><th>类型</th><th>维度</th><th>原文位置</th></tr></thead>
        <tbody id="issue-tbody"></tbody>
      </table>
      <div class="empty" id="issue-empty" style="display:none">没有符合筛选条件的问题</div>
    </div>
  </section>

  <!-- 08 综合分析 -->
  <section class="card analysis" id="sec-analysis"></section>

</div>

<!-- 详情抽屉 -->
<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <span class="pri-tag" id="d-pri"></span>
    <span class="id" id="d-id"></span>
    <div class="title" id="d-title"></div>
    <button class="close" id="d-close" title="关闭">x</button>
  </div>
  <div class="drawer-nav">
    <button class="btn" id="d-prev">上一条</button>
    <button class="btn" id="d-next">下一条</button>
    <span class="pos" id="d-pos"></span>
  </div>
  <div class="drawer-body" id="d-body"></div>
</aside>

<!-- 浮动操作 -->
<div class="fab">
  <button class="btn" id="btn-top" title="返回顶部">返回顶部</button>
  <button class="btn primary" id="btn-print" title="打印 / 导出 PDF">打印 / PDF</button>

画、头像与准备状态如何恢复。\n\n**需要补的内容与必填格式**：\n章节结构：每阶段一节，表列：重连阶段｜触发场景/协议｜必须恢复的数据｜可播放表现｜直接落位不播的表现｜头像与准备状态｜注意事项\n\n**范例（需求必须按此格式写）**：\n正常：「场景动作重连｜对局中断线后重新进入｜恢复牌墙剩余张数、白板指示牌、各家副露与暗杠、河牌、当前操作者流光与倒计时剩余秒数、各家累计分｜手牌与副露直接落位，不播发牌/摸牌/吃碰杠动画｜离线头像保留断线图标与计时，重连成功清除」。异常：「场景动作重连重播发牌与摸牌动画，客户端牌数与断线期间牌局不一致」。示例值以产品确认为准。\n\n**验收口径**：\n七个重连阶段齐全且各能映射到一条消息与一组断言；测试可直接产出「重连到行牌阶段」「重连到结算阶段」用例。","status":"待确认","has_detail":true},{"id":"PRD-002","title":"三摊承包未定义点炮场景付款人与触发条件（本类主条目，PRD-090、PRD-096 同根因）","priority":"P0","type":"需求缺失","module":["结算与结束"],"source_location":"二、功能详情 > 玩法规则 >【三摊承包】表；基础名词和概念解释 > 名词介绍 >【承包】、【倒承包】、玩法规则＞【三摊承包】；名词介绍＞【承包】【倒承包】、「三摊承包」表、「放铳」表、「杠·抢杠胡」行、「结算界面·小结算·承包的标识」","original_text":"承包：A对B累计3摊后，A胡牌，B需承包所有输分（支付其他三家的赔付）；被承包：A对B累计3摊后，B胡牌，A需承包所有输分×2（支付三家总和×2）；仅限庄家与闲家之间可形成3摊","problem":"规则基准要求：点炮时只有放铳者本人是承包对方才触发承包，第三方放铳不触发；自摸与点炮都由承包关系整体接管付款人，未参与承包的玩家不付。需求文档的承包、倒承包只按自摸方式写成“支付其他三家的赔付”“支付三家总和×2”，全文没有点炮分支，也没有“第三方放铳不触发承包”的排除条款。本期固定开启“庄闲放铳（庄三）”，点炮与三摊必然同时出现。","impact":"开发无法实现点炮叠加三摊时的付款人计算，容易把自摸的三家赔付错误套到点炮场景；测试无法设计点炮承包用例，结算金额不可验收。","suggestion":"在【三摊承包】下补“付款人判定”小节，明确点炮只在放铳者本人即承包对方时接管付款，并补自摸、点炮、抢杠胡三种方式与承包、倒承包的组合金额公式。\n\n**需要补的内容与必填格式**：\n新增《承包结算付款人》表格，必填列：胡牌方式（自摸/点炮/抢杠胡）、承包关系（A对B满3摊/双向满3摊/无）、付款人、每方金额公式、未参与承包玩家是否出分、放铳者非承包对方时的处理\n\n**范例（需求必须按此格式写）**：\n正常：A（闲）对B（庄）已累计3摊，A自摸4倍，三家各应付8分，B独自支付24分，C、D支付0分（示例值以产品确认为准）。异常：C放铳给A，A胡牌且A对B已累计3摊，C是放铳者但不是承包对方，按放铳仅C支付8分，B不承包、D不出分（示例值以产品确认为准）。\n\n**验收口径**：\n能在表中查到点炮且放铳者为承包对方、点炮且放铳者非承包对方、自摸三种情形的付款人与金额，测试可直接按每行出一条结算用例并核对金额。","status":"待确认","has_detail":true},{"id":"PRD-003","title":"十风番型整条缺失，无判定条件与点数公式","priority":"P0","type":"需求缺失","module":["番型与倍数"],"source_location":"二、功能详情 > 算分规则 > 胡牌番型介绍 > 番型分类、番型介绍（序号1~50）","original_text":"缺失说明：番型分类仅列【基础番型】【财神番型】【杠开番型】【七对番型】【组合番型】五类；番型介绍表序号1~50中无十风条目；全文未出现“十风”与“连续字牌数”。","problem":"规则基准要求十风是独立番型：仅自摸成立；连续字牌数≥10；不要求手牌成3N+2或2N；只记十风一条且不与任何其他番型叠加；点数=2×2^(连续字牌数−10)；三财/四财翻倍与封顶仍生效。需求文档既没有该番型，也没有声明本期不生效，属于整条规则缺失。","impact":"服务端无法实现十风判定与点数，客户端无法在结算展示十风；验收时无法验证“连续字牌≥10自摸”与“超出张数倍增”两个关键场景。","suggestion":"新增「十风番型」小节，写清成立条件、连续字牌数计算口径、独占与叠加关系、点数公式、与三财四财及封顶的叠加顺序，并给出正常和异常示例。\n\n**需要补的内容与必填格式**：\n新增章节「十风番型」，必填字段：番型ID与名称｜成立条件（仅自摸／连续字牌数阈值）｜连续字牌数计算口径（是否含副露、进张、财神替代牌面、是否必须连续排列）｜是否要求3N+2或2N｜独占声明（不与任何番型叠加）｜点数或倍数公式｜与三财四财及封顶的叠加顺序｜结算展示文案｜正常示例｜异常示例。\n\n**范例（需求必须按此格式写）**：\n正常：白板为财神，无副露，自摸后拆牌为东风×4、南风×3、西风×3、北风×2连续排列，连续字牌数=12，命中十风，点数=2×2^(12−10)=8，不再计平胡（示例值以产品确认为准）。异常：连续字牌数=9，自摸且拆牌为3N+2，不命中十风，按平胡1倍计（示例值以产品确认为准）。\n\n**验收口径**：\n服务端能对连续字牌数=10、9、12三种输入给出明确的十风成立/不成立结论；点数与公式完全一致；结算只展示“十风”一条且不再叠加其他番型；测试可直接按阈值与公式编写用例。","status":"待确认","has_detail":true},{"id":"PRD-004","title":"缺少番型选择顺序与最终番数乘积规则","priority":"P0","type":"需求缺失","module":["番型与倍数"],"source_location":"二、功能详情 > 算分规则（结算算分）、胡牌番型介绍 > 番型介绍（序号1~50）","original_text":"“最终得分=底分×倍数×庄闲倍数”“最终得分=底分×牌型倍数×牢数番”——全文未定义“牌型倍数”如何由多个同时命中的番型合成，番型介绍表只逐条列倍数，无选择顺序、无互斥、无乘积规则。","problem":"规则基准规定的合成过程是：连续字牌≥10且自摸只取十风并结束；否则按“基础/七对组→杠开组→财神组”各取首个命中档；杠上开花与财飘同时命中时替换为杠飘或飘杠；最终番数=各命中番型倍数乘积；再乘三财/四财与十风超出部分；最后按倍数封顶截断；一条番型都未命中则不成立胡牌；多拆解时取最高番方案。文档缺失全部环节，导致“平胡1倍+爆头2倍”这类组合的最终倍数无法确定。","impact":"服务端无法产出唯一“牌型倍数”，客户端胡牌按钮和结算展示的倍数无口径；同一手牌不同实现可能算出1、2或3倍，验收无判定依据。","suggestion":"新增「番型选择顺序与最终番数」小节（可用表格），写明各组的取档顺序、互斥规则、乘积公式、额外倍率与封顶的先后、未命中处理以及多拆解取最高番的裁决规则。\n\n**需要补的内容与必填格式**：\n新增「番型选择顺序与最终番数」表，必填列：步骤序号｜处理对象（十风／基础与七对组／杠开组／财神组／组合替换／额外倍率／封顶）｜档位判定顺序（从高到低）｜命中规则（取第一个／取最高档／互斥）｜输出番型ID与倍数｜未命中处理｜备注。\n\n**范例（需求必须按此格式写）**：\n正常：自摸、杠链=1、飘等级=1、拆牌为3N+2含财神将，杠开组取杠上开花2、财神组取财飘4，两者同时命中替换为杠飘8，最终番数=8（示例值以产品确认为准）。异常：自摸、3N+2且无财神无杠，基础组取平胡1，杠开组与财神组均未命中，最终番数=1；若三组全部未命中则不成立胡牌、不弹出胡牌按钮（示例值以产品确认为准）。\n\n**验收口径**：\n给定一手牌，服务端输出的命中番型清单、最终番数与文档表格逐步可复算；测试可用“平胡+爆头”“杠上开花+财飘”“无番型”三组用例直接验证。","status":"待确认","has_detail":true},{"id":"PRD-005","title":"断线重连各阶段恢复内容整体缺失（与 PRD-001 同根因，重复登记，建议合并）","priority":"P0","type":"需求缺失","module":["断线重连"],"source_location":"3.3.3 玩家头像信息-玩家状态（离线状态）；全文无“断线重连”章节","original_text":"原文仅有：“离线状态：头像处覆盖断线图标，且显示断线计时，格式为分秒“00:00”，每次断线重新计时。备注：在当前动画播放过程中有玩家离线切后台等，不会因此中断原本的动画流程”。缺失说明：没有任何重连章节与各阶段恢复清单。","problem":"断线重连指玩家掉线后再次进入对局时，按当前所处阶段补发对局状态以恢复现场。需求文档只有离线图标与断线计时这一条显示规则，没有按阶段恢复的清单：开局（等待信息、开局信息、门风、游戏配置、虚拟玩家信息）、定庄（局数、庄家、连庄、牢庄）、掷骰发牌（骰子、牌墙、自己手牌）、定财神（财神与替代牌）、首摸等待（等待信息、牌墙、手牌、听牌提示）、摸打循环（等待信息、局数据、牌墙、手牌、操作权限、财神、牢庄、摊/承包、飘次数、禁手、出牌区、跟庄骰子、加倍状态）、结算（各座位输赢、历史累计分、虚拟玩家信息、加倍状态）；也没有“普通重连只下发自己手牌，不展示他人手牌”的口径声明。","impact":"服务端不知道每个阶段要补发哪些字段，客户端不知道重连后落到哪个界面状态；玩家中途掉线必然出现牌墙、手牌、操作权限不一致；测试无法编写分阶段重连用例，验收无依据。","suggestion":"与 PRD-001 合并处理：新增“断线重连”章节与阶段恢复表，逐阶段写明服务端补发数据项与客户端落地表现；同时加一条裁剪声明：本方案不含做牌、洗牌、加倍阶段，对应恢复项在本期不适用；并明确本方案未启用明牌，故任何重连都不下发他人手牌。\n\n**需要补的内容与必填格式**：\n新增章节「断线重连」，必含表：阶段｜触发条件（重连时房间所处阶段）｜客户端可见恢复内容｜服务端补发数据项｜边界与例外；另加两条声明（本期不存在的阶段不适用、未启用明牌时手牌下发范围）。\n\n**范例（需求必须按此格式写）**：\n正常：玩家在第2局摸打循环掉线后重连→补发局数据（第2局/庄家B/三牢）、牌墙剩余58张、自己13张手牌与刚摸的1张、操作权限＝出牌、财神＝白板、牢庄＝三牢、A对B摊数＝2、出牌区12张、无未解除禁手、非明牌故只下发自己手牌（示例值以产品确认为准）。异常：玩家在定财神阶段掉线1秒后重连→仅补发白板财神指示牌与等待信息，不重播掷骰动画（示例值以产品确认为准）。\n\n**验收口径**：\n每个阶段都能列出补发字段清单，且同一阶段重连后的界面状态与未掉线玩家一致；“只下发自己手牌”可被测试反向验证（抓包确认无他人手牌字段）。测试可逐阶段直接出用例。","status":"待确认","has_detail":true},{"id":"PRD-006","title":"缺非功能需求章节：性能、稳定性、一致性、安全、埋点均无指标","priority":"P0","type":"需求缺失","module":["总览与文档"],"source_location":"全文（无「非功能需求」章节）；相关零散位置：三.对局流程-发牌（发牌UI以及动画表现-音效）、结算流程-流程明细","original_text":"全文没有非功能需求章节，也没有性能、稳定性、一致性、安全风控、可观测、可维护等指标。仅 4.4 发牌写「待确认。发牌与理牌的音效资源及触发时点本方案不添加。」","problem":"规则基准以表格逐项给出性能（单次操作 ≤200ms、结算下发 ≤500ms）、稳定性（单玩家掉线或超时不影响整桌、重连可恢复当前阶段）、一致性（写分幂等、同一局不重复结算、重连快照与实时一致）、安全风控（随机发牌公平、配置仅房主或后台可改、关键操作有日志）、可观测（关键阶段结构化日志、结算异常重连埋点）、可维护（规则配置化、新增玩法不改引擎分支）等验收口径。需求文档完全没有对应内容，只有一段发牌音效待确认的说明，没有任何可量化、可验收的指标。","impact":"开发无法确定日志、埋点、幂等和性能目标；测试无法编写性能、稳定性、一致性用例；验收时没有判定依据，上线后出现重复结算或掉线卡桌也无标准可依。","suggestion":"新增独立「非功能需求」章节，按规则基准的 8 个类别逐条给出指标值、测量口径、采样方式与验收方式；对本期不适用的类别（如金币场）显式写豁免声明，不要留空。\n\n**需要补的内容与必填格式**：\n新增「非功能需求」章节，表格必含列：类别｜指标项｜指标值或要求｜测量口径（起点与终点）｜验收方式｜是否本期适用\n\n**范例（需求必须按此格式写）**：\n正常：性能｜出牌操作端到端响应｜P95≤200ms（示例值以产品确认为准）｜从客户端点击出牌到收到服务端 action.result｜联调压测报告。一致性｜同一弃牌重复提交｜只落 1 次牌、只扣 1 次分，返回相同结果｜构造重复请求｜接口用例。\n异常：同一局结算请求重复下发 3 次，服务端只产生 1 条结算记录，客户端只播 1 次小结算，第 2、3 次返回 duplicate=true 且不再扣分（示例值以产品确认为准）。\n\n**验收口径**：\n章节齐备且每项指标都有数值、口径和验收方式；测试可据「指标项＋测量口径」直接生成性能与一致性用例；不适用项有明确豁免声明视为达标。","status":"待确认","has_detail":true},{"id":"PRD-007","title":"缺重连恢复规则：只有断线图标，无恢复阶段与手牌可见性（与 PRD-001 同根因，重复登记，建议合并）","priority":"P0","type":"需求缺失","module":["断线重连"],"source_location":"三.对局流程-桌面布局-玩家头像信息（玩家状态-离线状态）、三.对局流程-行牌操作、四.结算界面-小结算界面；全文无「重连」章节","original_text":"离线状态：头像处覆盖断线图标，且显示断线计时，格式为分秒“00:00”，每次断线重新计时","problem":"需求文档只定义断线时的图标与计时展示，没有定义重连后恢复到哪个阶段界面、恢复哪些数据（手牌、牌河、余牌数、倒计时、摊数、庄标）、手牌可见性口径（规则要求仅展示自己的手牌，明牌开启才展示他人手牌），也没有定义掉线期间对局是否继续、超时是否按无托管继续等待。","impact":"客户端无法实现重连恢复逻辑，服务端无法定义重连快照字段；测试无法验证重连后界面与断线前一致；掉线玩家回到牌桌可能出现手牌缺失、倒计时错乱或已被人代打的错误状态。","suggestion":"与 PRD-001 合并处理：新增「重连」章节，明确断线判定阈值、恢复内容清单、阶段到界面的映射表、手牌可见性口径、与无托管和超时的关系、重连失败兜底；并在小结算界面补充重连时的展示口径。\n\n**需要补的内容与必填格式**：\n新增章节「重连」，含表：断线判定｜恢复阶段｜恢复内容清单｜手牌可见性｜倒计时处理｜与其他玩家关系｜失败兜底；另附「对局阶段－重连界面」映射表\n\n**范例（需求必须按此格式写）**：\n正常：玩家B在行牌阶段第12巡断线18秒后重连，服务端下发快照，客户端恢复到行牌阶段：自己13张手牌正面、其他三家牌背、牌河12张、余牌数83、中央倒计时按剩余秒数继续、摊数与原状态一致（示例值以产品确认为准）。\n异常：玩家B断线超过60秒仍未重连，座位保留且头像持续显示断线计时，其出牌倒计时走完后仍等待其手动出牌，不自动出牌；其他玩家界面显示「等待玩家B重连」（示例值以产品确认为准）。\n\n**验收口径**：\n每个对局阶段（掷骰、发牌、行牌、响应、结算）都有明确的重连恢复映射与验收点，且明牌口径写明；测试可按阶段表逐条生成重连用例。","status":"待确认","has_detail":true},{"id":"PRD-008","title":"缺依赖与接口章节：无协议、配置中心、房间服务与埋点字段定义","priority":"P0","type":"需求缺失","module":["总览与文档"],"source_location":"全文（无「依赖与接口」章节）；仅 三.对局流程-发牌（发牌UI以及动画表现）提到「服务端单独下发的第14张」","original_text":"若本家是庄家，最右侧独立位在立起时刷新为服务端单独下发的第14张。","problem":"规则基准要求逐项声明依赖方、交互内容与风险；需求文档只在发牌一句里旁证存在服务端下发，没有动作协议、结算协议、重连协议的名称与字段，没有配置中心配置项清单（好友房 JSON、等级规则、入场配置），没有房间服务交互（创建房间、座位、开局、结束），也没有埋点字段口径。","impact":"客户端与服务端无法对齐协议字段与版本兼容策略，联调反复；配置项散落在正文里无法被配置中心实现；埋点无法落地，数据侧拿不到口径统一的对局结果与重连数据。","suggestion":"新增「依赖与接口」章节：先列依赖方与风险表，再列协议接口表（接口名、方向、关键字段与类型、触发时机、返回码、失败处理、版本兼容），最后列配置中心配置项表和埋点字段表。\n\n**需要补的内容与必填格式**：\n三张表：(1) 依赖方｜交互内容｜负责方｜风险｜本期是否依赖；(2) 协议名｜方向｜关键字段与类型｜触发时机｜返回码/失败处理｜版本兼容；(3) 配置项｜类型｜默认值｜取值范围｜生效方式（开局读取/热更）\n\n**范例（需求必须按此格式写）**：\n正常：出牌协议 sync.play.action 字段 {tableId:string, seat:int 0-3, tile:string 如 \"5T\", seq:int}；返回 action.result {code:0, nextSeat:int, remain:int}，seq 单调递增（示例值以产品确认为准）。\n异常：同一 seq 重复请求返回 action.result {code:0, duplicate:true}，不重复落牌；seq 回退返回 code:1002 并拒绝，客户端提示「操作已过期」并请求重连快照（示例值以产品确认为准）。\n\n**验收口径**：\n协议字段、配置项、埋点字段三类清单齐备且与正文规则一致；客户端与服务端可据此直接建接口文档；测试可据返回码列出异常分支用例。","status":"待确认","has_detail":true},{"id":"PRD-009","title":"全文缺少验收场景清单与判定口径","priority":"P0","type":"需求缺失","module":["总览与文档"],"source_location":"全文（无对应章节）；「二、功能详情／结算界面／小结算界面（好友房）」","original_text":"缺失说明：需求文档没有任何 Given／When／Then 形式的验收场景表，也没有编号化验收条目；仅有「小结算｜触发条件｜播完胡牌结算流程，进入结算界面」这类功能描述，无法转成用例。","problem":"规则基准要求以编号＋Given／When／Then 三列组织验收场景，并单列客户端待核实项；需求文档通篇只有交互与动画描述（含「录屏约00:14.00」这类时间点对照），没有任何可判定通过与否的验收条目，无法覆盖开局、发牌、吃碰杠胡、结算、断线等关键路径的合格判定。","impact":"测试无法据此编写用例，验收无判定基准；开发完成度只能靠主观对照录屏，争议时无仲裁依据。","suggestion":"新增「验收场景」章节，按编号列出本期固定配置下的正常与异常场景，并补充「客户端待核实／待联调」子表，把现有录屏时间点对照改为可断言的字段与显示结果。\n\n**需要补的内容与必填格式**：\n必须新增章节「验收场景」，表格必填列为：编号 | Given（前置条件／配置） | When（操作或触发） | Then（可观测结果）；另附子表「客户端待核实／待联调」，必填列为：编号 | 事项 | 验证方式。\n\n**范例（需求必须按此格式写）**：\n正常示例：AC-01｜Given 本期固定配置（4人8局、底分1、白板财神、笃三老庄、庄闲放铳、三摊承包、无封顶、启用吃碰禁手）｜When 首局开局发牌完成｜Then 庄家14张、三名闲家各13张、余牌数显示83、庄标显示「庄×3」。（示例值以产品确认为准）\n异常示例：AC-02｜Given 牌墙剩余可摸牌数20、无人可胡｜When 下一次应摸牌时｜Then 判定流局、本局计入已完成局数、原庄连庄且牢数保持三牢、进入小结算。（示例值以产品确认为准）\n\n**验收口径**：\n验收场景表存在且每条编号唯一、三要素齐全；每条 Then 均为可观测断言（张数、字段值、界面元素、文案），测试可逐条直接转成用例，无“参考录屏”式含糊条目。","status":"待确认","has_detail":true},{"id":"PRD-010","title":"开局与发牌动画结束缺少服务端放行确认","priority":"P0","type":"需求缺失","module":["开局"],"source_location":"对局开始 > 动画展示及流程；发牌 > 发牌UI以及动画表现","original_text":"约865 ms 时，字样和光带完全消失，开局动画结束。桌面、常驻信息区及正在播放的摇骰继续显示。；理牌完成后，骰盘区域切换为庄家出牌倒计时。","problem":"放行确认指客户端在动画播完后向服务端回执一次，让服务端推进下一步流程；自动确认指非首局无需玩家操作直接回执。规则要求开局动画结束确认一次、发牌理牌结束确认一次，并在非第一局记录「发牌阶段自动确认」标记。需求文档只写了表现时序，未写任何客户端回执、动画被跳过的分支，也未写非首局的自动确认。","impact":"服务端等不到确认时会卡在开局或发牌阶段；玩家切后台跳过动画时没有兜底，进不到出牌阶段。","suggestion":"新增「流程放行」小节，逐条写明触发点（动画结束/被跳过）、回执次数（每次仅一次、幂等）、非首局自动确认标记的读写时机与失败重试方式。\n\n**需要补的内容与必填格式**：\n新增小节「流程放行」，每个动画节点按列填写：节点｜触发时点｜跳过时是否仍发｜回执次数｜失败处理\n\n**范例（需求必须按此格式写）**：\n正常：首局开局动画播至865ms结束→客户端发送1次开局放行确认→服务端下发骰子结果→进入发牌（示例值以产品确认为准）。异常：动画播放中被切后台跳过→仍发送1次放行确认，四家头像直接显示，不重复发送。\n\n**验收口径**：\n通过抓包或日志核对：首局/非首局、动画完整/被跳过四种情形各只回执1次，且均能进入庄家出牌阶段；可直接转成用例。","status":"待确认","has_detail":true},{"id":"PRD-011","title":"杠操作入口、多杠列表与过2按钮未定义","priority":"P0","type":"需求缺失","module":["响应动作"],"source_location":"三.对局流程 → 行牌操作（原方案表·出牌行）；吃碰杠胡操作 → 杠牌条目；二.功能详情 → 规则详情 → 基础操作及规则 → 【杠】","original_text":"- 杠牌复用现有血战杠的特效，主要区别删除刮风下雨，无论什么杠，统一使用杠字即可","problem":"需求文档只用一句“复用血战杠特效”描述杠，全文没有【杠】按钮的出现条件、按钮组合、点击后如何选择要杠哪一组、多杠列表如何展示，也没有【过2】按钮和“过”在杠权下的含义。玩家在轮到自己出牌时无法发起直杠、加杠或暗杠，杠模块只有规则和特效，没有可执行的交互。","impact":"开发无法实现杠按钮与多杠选择，杠规则（含杠开、杠爆、抢杠胡）全部没有入口；测试无法编写杠操作用例，杠模块无法验收。","suggestion":"在“吃碰杠胡操作”下新增“杠操作区”小节，按权限来源（响应他人弃牌的直杠权、本人出牌阶段的加杠/暗杠权）分别定义按钮组合、单一杠与多组杠的呈现差异、点选后的提交与取消、无权限时的表现。\n\n**需要补的内容与必填格式**：\n新增表格，必填列：触发场景 | 权限来源 | 按钮组合（含【过2】语义） | 多杠列表显示条件（单一杠不显示列表/多杠显示牌面列表） | 选择交互与默认项 | 无权限或飘财限制时表现 | 按钮光效 | 验收要点\n\n**范例（需求必须按此格式写）**：\n正常：玩家A手上有碰出的2筒刻子且有第4张2筒，另持4张5条，轮到自己出牌时操作区显示【杠】和【过】；点击【杠】后右侧出现2筒、5条两格牌面列表，点2筒提交加杠，先进入抢杠胡等待，无人胡则补牌并播“杠”动画。异常：飘财限制生效期间，玩家只持4张5条时操作区显示【杠】；若同时持可加杠的2筒，则只显示5条一格并可执行暗杠，2筒不可选。示例值以产品确认为准。\n\n**验收口径**：\n杠按钮的出现条件、多杠列表的显示与互斥、点击与取消、飘财下的可用性均可被逐条判定；测试可据此直接产出“单杠执行/多杠选择/飘财下暗杠/飘财下禁加杠”4条用例。","status":"待确认","has_detail":true},{"id":"PRD-012","title":"多操作状态章节为空，多吃组合无法选择（与 PRD-137 同根因，重复登记，建议合并）","priority":"P0","type":"需求缺失","module":["响应动作"],"source_location":"三.对局流程 → 吃碰杠胡操作 → 多操作状态；二.功能详情 → 规则详情 → 基础操作及规则 → 【吃】","original_text":"### 多操作状态复用功夫川麻；（【吃】）“存在多种合法组合时，选择其中1组。”","problem":"“多操作状态”章节只有标题和“复用功夫川麻”一句外链说明，没有任何规则内容。而【吃】规则只说“选择其中1组”，没有定义玩家在哪里选。例如手牌3、4、6、7条，上家打5条，可以吃成3-4-5或5-6-7两组，按现文档点【吃】无法判断用掉哪两张手牌，也无法与多杠列表并存。","impact":"多吃是高频操作，缺规范会导致客户端实现成“默认取第一组”，吃错牌直接改变牌型与听牌结果，无法验收；多杠与多吃同时可用时更无解。","suggestion":"与 PRD-137 合并处理：补齐“多操作状态”正文：多吃选择池的生成条件与排序、选项内容（整组顺子三张牌面）、与多杠列表互斥的优先顺序、点选后副露与手牌的变化、取消与超时表现。\n\n**需要补的内容与必填格式**：\n章节结构：1 触发条件；2 选项生成规则（按牌序从左至右、每组显示三张牌面、最多组数）；3 与多杠列表互斥规则；4 点选/取消/超时表现；5 与禁手置灰的关系。必填表格列：场景 | 选项数量 | 选项内容 | 默认高亮 | 提交后结果\n\n**范例（需求必须按此格式写）**：\n正常：上家打5条，玩家手牌3、4、6、7条，点击【吃】后操作区右侧出现两组选项“3条4条5条”“5条6条7条”，点第一组后3、4条离开手牌，副露区新增3-4-5条并显示来源箭头，玩家直接进入出牌阶段。异常：同一玩家持4张5条可暗杠且可吃，操作区先显示多杠列表；点击【吃】后多杠列表隐藏、多吃选择池出现，同一时刻只显示其中一种。示例值以产品确认为准。\n\n**验收口径**：\n“吃”在不同组合数（0/1/2/3组）下的操作路径唯一确定，选项内容与扣除手牌可核对；测试可直接产出“单一组合直接吃/两组合选择/多吃与多杠互斥”3条用例。","status":"待确认","has_detail":true},{"id":"PRD-013","title":"听牌按钮与听牌列表缺失，“详见听牌提示”为悬空引用（与 PRD-108 同根因，重复登记，建议合并）","priority":"P0","type":"需求缺失","module":["牌桌区域"],"source_location":"三.对局流程 → 行牌操作（交互说明·提牌）；三.对局流程 → 行牌操作｜修改对比版（提牌）；三.对局流程 → 局中信息 → 手牌信息 → 听牌标签","original_text":"提起【打出可听牌】时，弹出听牌提示页面。｜详见听牌提示；（提牌）“改提另一张候选牌时更新面板。取消提牌、改选非候选牌或实际出牌后收起面板。其他关闭条件和详情见「听牌提示」。”","problem":"全文没有任何名为“听牌提示”的章节，两次“详见听牌提示/见「听牌提示」”指向不存在的内容。同时全文没有听牌按钮这个控件：未定义何时显示/隐藏（摸牌后隐藏、出牌后按有无听牌切换、自己有出牌权时隐藏）、未定义“可胡”标记、未定义点击后听牌列表里应显示什么。现有描述只有“提牌时弹出面板”和手牌上的箭头标签，无法覆盖已听牌（查听）状态。","impact":"听牌是杭麻核心决策信息，缺失会导致“已听牌但无法打开听牌列表”“摸牌后仍显示按钮”等验收争议；提牌面板的字段、倍数、剩余张数均无依据，测试无法出用例。","suggestion":"与 PRD-108 合并处理：新增“听牌提示”章节，包含：听牌按钮状态机、听牌列表字段与页面结构（张数页/倍数/剩余张数/爆头区/封顶文案）、查听与打听的区分展示、面板打开与关闭条件，并把两处悬空引用改指向该章节。\n\n**需要补的内容与必填格式**：\n新增章节，含4个子节：①听牌按钮状态机（表格：时机 | 有听牌且未胡 | 无听牌 | 已胡 | 自己有出牌权）；②听牌列表字段（必填列：牌面 | 剩余张数 | 单张倍数 | 是否爆头区 | 封顶文案）；③爆头/任意牌展示（不显示具体牌面、不显示剩余张数）；④面板打开/关闭条件\n\n**范例（需求必须按此格式写）**：\n正常：玩家出牌后手牌听3筒与6筒，听牌按钮显示并带“可胡”标记；点击后列表显示“3筒 剩2张 1倍”“6筒 剩1张 1倍”，单张倍数合计列在标题；关闭弹窗后按钮常驻。异常：玩家摸牌后听牌按钮立即隐藏且弹窗关闭，直到服务端下发新的听牌数据才恢复；玩家已胡牌时按钮不显示，即使之前打开过弹窗也被关闭。示例值以产品确认为准。\n\n**验收口径**：\n听牌按钮在摸牌、出牌、获得权限、胡牌四个时点的显示状态可逐条核对；听牌列表字段与页面结构可照表实现；测试可产出“出牌后按钮显示/摸牌后隐藏/已胡隐藏/爆头区展示”4条用例。","status":"待确认","has_detail":true},{"id":"PRD-014","title":"满8局结束后无总战绩界面与数据定义（与 PRD-052 同根因，重复登记，建议合并）","priority":"P0","type":"需求缺失","module":["结算与结束"],"source_location":"默认规则·计分与结算、结算流程·流程明细、结算界面·小结算界面（好友房）","original_text":"《默认规则·计分与结算》仅写「每小局进入小结算，满8局结束本场」；全文无总战绩/总结算章节（检索「战绩」「总结算」均为0处），第8局结算后展示什么、数据从哪来、何时弹出均无描述。","problem":"规则基准要求整局结束时由服务端下发总结算并弹出总战绩界面，汇总每家总得失分与本场统计条目，并通知小结算切换到「查看总结算」按钮；需求文档只规定「满8局结束本场」，既没有总战绩章节，也没有字段、统计口径、弹窗时机与跳过规则。","impact":"第8局小结算之后无任何界面可交付、可验收；前端无法判断是否需要总战绩页；「已打局数/最大局数/解散者」等字段无落地位置；测试无法编写「打满8局」的验收用例。","suggestion":"与 PRD-052 合并处理：新增「总战绩」章节：触发条件（满8局、片数≤0、房间解散、回放）、字段与来源、统计条目口径、弹窗延迟与可跳过规则、与小结算「查看总结算」按钮的联动。\n\n**需要补的内容与必填格式**：\n需新增三张表：①总战绩·数据字段表（列：字段｜含义｜来源｜示例）；②总战绩·统计条目表（列：条目｜统计口径｜解析失败处理）；③总战绩·弹窗时机表（列：场景｜触发条件｜延迟秒数｜是否可跳过｜与「查看总结算」按钮的关系）。\n\n**范例（需求必须按此格式写）**：\n正常：第8局小结算出现后2秒自动弹出总战绩；A家总得失分+42、已打局数8、最大局数8、玩法「杭州麻将·好友房·8局」、房主A、开始2026-11-10 20:01、结束20:37；条目A：胡5次、爆头2次、财飘1次、财神3次（示例值以产品确认为准）。异常：第6局房主解散且解散者非机器人，跳过2秒延迟直接弹出总战绩，已打局数显示6（示例值以产品确认为准）。\n\n**验收口径**：\n开发可据字段表直接落数据接口与展示；测试可写出「满8局→小结算→2秒后总战绩」与「中途解散→立即总战绩」两条用例，并逐条核对字段值与统计数值。","status":"待确认","has_detail":true},{"id":"PRD-015","title":"缺断线重连阶段入口与总纲章节（与 PRD-001 同根因，重复登记，建议合并）","priority":"P0","type":"需求缺失","module":["断线重连"],"source_location":"三.对局流程（「桌面布局」「局内流程」「结算流程」「结算界面」「辅助功能」整章）；3.3.3「玩家头像信息」离线状态行","original_text":"离线状态：头像处覆盖断线图标，且显示断线计时，格式为分秒“00:00”，每次断线重新计时（全文仅此一处提到断线，无任何重连流程）","problem":"术语：重连入口＝服务端按玩家断线时所处阶段下发的不同重连消息，以及该消息对应的恢复流程。需求文档只在头像状态里写了断线图标和计时，没有为「准备/开局」「发牌」「行牌中」「结算」分别定义重连入口与恢复流程，也没有说明旧协议（场景开始、场景发牌）兼容入口如何处理，导致「按阶段恢复」这一整套规则在需求侧完全没有落地载体。","impact":"开发无法确定收到哪条重连消息该走哪条恢复路径，只能自行发明；测试无法按阶段构造重连用例，验收无判定依据，属于整块功能缺失。","suggestion":"与 PRD-001 合并处理：在「三.对局流程」后新增独立章节「断线重连」，先给阶段—入口路由总表，再按阶段给恢复顺序子表，并单列旧协议兼容说明。\n\n**需要补的内容与必填格式**：\n新增章节「断线重连」，必含表格列：断线阶段 | 重连消息/入口 | 执行顺序（按先后列出补数据项与界面项） | 本阶段不恢复的区域 | 是否兼容旧协议 | 服务端必需字段 | 等待确认处理\n\n**范例（需求必须按此格式写）**：\n正常示例：行牌中（自己已摸牌未出牌）断线 → 入口「场景动作」→ 顺序执行 开局数据→游戏配置→局数据→牌墙→财神→手牌→河牌→杭州麻将专属字段→权限→倒计时→等待确认；恢复后余牌数显示61、中央倒计时显示07（示例值以产品确认为准）。异常示例：对局快照为旧版本、服务端下发「场景发牌（旧协议）」→ 按旧协议入口执行，恢复四家手牌与副露但明确不恢复河牌、操作按钮与倒计时，界面表现为河牌空白、无操作区（示例值以产品确认为准）。\n\n**验收口径**：\n每个断线阶段都能在表中查到唯一入口与固定顺序；测试可按表逐阶段制造断线并逐项核对界面区域，用例可直接由表生成。","status":"待确认","has_detail":true},{"id":"PRD-016","title":"行牌阶段重连的恢复内容与顺序缺失","priority":"P0","type":"需求缺失","module":["断线重连"],"source_location":"4.5「行牌操作」、4.5 行牌操作｜修改对比版、3.3.1「方位信息」、3.3.2「玩法信息」","original_text":"缺失说明：4.5 与其修改对比版只描述摸牌、补牌、提牌、出牌在正常对局中的表现，未描述断线重连后如何重建牌墙、财神、四家手牌与副露、四家河牌、权限与倒计时。","problem":"术语：只补数据＝重连时只把服务端快照写入本地数据，不播放表现动画。行牌中重连（规则中称为「场景动作」）缺少全部恢复清单：牌墙与剩余张数、财神（必须先于手牌恢复，否则财神不靠左）、四家手牌与副露、四家河牌与出牌箭头及出牌放大、庄家标记与方位盘、杭州麻将专属字段（牢庄等级、摊信息、加倍状态、飘计数、出牌限制）、权限（操作按钮、倒计时、头像发光框、并按出牌限制刷手牌置灰）；文档也未写「出牌限制必须先于权限」的顺序约束。","impact":"重连回桌面可能出现：手牌空白或财神不染色不靠左、河牌空白、操作按钮缺失、禁打牌不置灰导致玩家能打出禁手牌，直接影响对局正确性，属关键流程阻塞。","suggestion":"按顺序表补齐上述恢复项，并明确两条硬顺序：财神先于手牌、出牌限制先于权限；同时说明行牌中重连骰子保持隐藏、不恢复胡牌标记与摊牌。\n\n**需要补的内容与必填格式**：\n新增小节「重连-行牌中」，必含有序表：序号 | 恢复项 | 数据来源字段 | 对应界面区域 | 是否只补数据 | 顺序依赖说明\n\n**范例（需求必须按此格式写）**：\n正常示例：玩家A在自己摸牌后、出牌前断线重连，按序恢复后自己手牌14张（含摸到的牌）按万条筒风排序且白板财神靠左染色，四家河牌与最新弃牌放大牌恢复，操作区显示「出牌」按钮，中央倒计时显示07、头像发光框在自己头像上（示例值以产品确认为准）。异常示例：服务端未下发财神字段时，手牌财神不靠左、不染色且禁打牌未置灰，需在文档异常表中注明「以4.3白板财神兜底并按出牌限制重刷置灰」（示例值以产品确认为准）。\n\n**验收口径**：\n断线重连后任一界面区域元素都能在表中找到恢复来源与顺序；测试可在行牌各时点（庄家摸牌、自己摸牌、可吃碰响应中）断线，逐项核对，无需口头补充。","status":"待确认","has_detail":true},{"id":"PRD-017","title":"对局人数口径冲突：固定四人 vs 支持2至4人（本类主条目，PRD-051、PRD-059、PRD-123、PRD-021 同根因）","priority":"P0","type":"内容冲突","module":["房间配置"],"source_location":"「默认规则／人数与局数」、「游戏规则概述／对局人数」表、「玩法规则／【人数】」、「三.对局流程／对局开始」、本期开发范围、游戏规则概述（对局人数）、玩法规则/【人数】、桌面布局/对局前、「本期开发范围」、「默认规则」本期固定生效·人数与局数、「二、功能详情／游戏规则概述」对局人数、「【人数】」、「牌河信息」牌河摆放、「对局开始」显示、本期开发范围；默认规则；对局开始（显示）；3.3.1 方位信息（有方位）、「本期开发范围」、「默认规则·人数与局数」、「游戏规则概述·对局人数」、「玩法规则·【人数】」、「桌面布局·对局前·准备信息」、「对局开始」、「牌河信息」","original_text":"默认规则：「人数与局数。固定四人、8局。坐满4人且全部已准备后由房主开始游戏」；【人数】：「创房人数可选2人、3人或4人。允许未满开局，开局时的参战人数按实际到桌人数确定」；对局开始：「按开局时的实际参战人数显示2、3或4个玩家信息区」","problem":"需求文档对「人数」给出两套互相矛盾的口径：一处写本期固定四人且必须坐满4人才开局，另一处表格与流程写支持2/3/4人、允许未满开局并按实际人数摆放。规则基准明确「人数变化」要切换整套头像页并重新绑定每个座位的头像节点与准备标记，人数口径不定就无法确定头像容器是固定4人版还是可切换页版。","impact":"客户端无法确定头像容器、座位节点绑定方式与开局条件；测试无法准备2/3/4人用例，也无法判定未满开局是否应发生。","suggestion":"在「本期开发范围」增加唯一的生效声明（本期仅4人、必须坐满4人且全部准备），并把非本期的人数分支逐处标注为「原文上下文，不实现」，附差异对照表。\n\n**需要补的内容与必填格式**：\n必填两段：①生效声明段落（本期人数＝4人，开局条件＝坐满4人且全部已准备）；②「本期与非本期差异对照表」，列：章节｜原文描述｜本期是否生效｜处理方式（实现/标注原文上下文）｜影响模块\n\n**范例（需求必须按此格式写）**：\n正常：在「三.对局流程／对局开始」加注——「本期生效口径：仅4人局。2人/3人分支为原文上下文，本期不实现」。异常：「玩法规则／【人数】」保留「允许未满开局」而不标注，开发按原文实现3人未满开局，与「坐满4人」冲突。示例值以产品确认为准。\n\n**验收口径**：\n全文只存在一处人数口径；检索「2人」「3人」「未满开局」处均带生效/不生效标注；测试据此只出4人开局用例并确认无2/3人入口。","status":"待确认","has_detail":true},{"id":"PRD-018","title":"行牌操作原版与修改对比版并存，无生效声明（本类主条目，PRD-019、PRD-065 同根因）","priority":"P0","type":"内容冲突","module":["行牌循环"],"source_location":"三.对局流程/行牌操作、三.对局流程/行牌操作｜修改对比版、修订历史记录、三.对局流程 > 局内流程 > 行牌操作（摸牌、出牌）〔原表〕、三.对局流程 > 局内流程 > 行牌操作｜修改对比版（摸牌、出牌）、「行牌操作」原表（摸牌、出牌行）、「行牌操作｜修改对比版」表（摸牌、提牌、出牌行）","original_text":"原版：「出牌共有双击出牌、单击出牌、滑动出牌三种，其中双击出牌和单机出牌互斥」；对比版：「本方案默认双击出牌。滑动出牌默认开。单击出牌归设置模块，本方案不包含该模式。」","problem":"生效声明指书面指明哪一版规格作为开发与验收的唯一依据；修改对比版指同一模块在原方案上重写的第二份规格。文档对「行牌操作」给出两份规格且都未标注废弃：①摸牌——原版只写「牌墙中顺时针发牌」，对比版区分本家与其他家视角并新增吃碰后分隔位；②出牌模式——原版三选可配置，对比版仅双击＋滑动、单击归设置模块；③超时——原版给出托管出牌分支，对比版明确「继续等待本家手动出牌」。修订历史仅 V1.0（C-创建），未登记对比版的来源、日期与生效状态，违反「同一规则只保留一个权威口径」。","impact":"客户端无法确定按哪版实现，提牌压暗、听牌提示、浮标、放大弃牌等只在对比版出现的内容可能被漏做；测试会出现两套矛盾用例；评审无法判断验收基线。","suggestion":"在两节标题下各加生效声明，明确以对比版为唯一依据、原版标注【仅存档】；附差异对照表逐项列出差异与生效版本；修订历史补一条该版本的日期、作者、批准状态。\n\n**需要补的内容与必填格式**：\n章节标题下必加一行「生效声明：以 XX 版为准，其余版本标注【仅存档】」；并附差异对照表，必填列：对比项｜原版写法｜修改对比版写法｜本期生效版本｜对应章节\n\n**范例（需求必须按此格式写）**：\n正常示例：「生效声明：3.4 行牌操作以「行牌操作｜修改对比版」为唯一实现与验收依据；上方「行牌操作」原版标注【仅存档】，不再生效。示例值以产品确认为准。」；异常示例：「出牌：双击、单击、滑动三种（原版）；单击出牌本方案不包含（对比版）——两版并列且未注明生效版本，禁止以此状态进入开发。」\n\n**验收口径**：\n差异对照表能逐项指出生效版本；测试仅按生效版本出一套用例，原版条目全部带【仅存档】且不出用例；修订历史存在该版本记录。","status":"待确认","has_detail":true},{"id":"PRD-019","title":"行牌操作原表与修改对比版并存无生效声明，摸牌时序与出牌内容互相矛盾（与 PRD-018 同根因，重复登记，建议合并）","priority":"P0","type":"内容冲突","module":["行牌循环"],"source_location":"三.对局流程 > 局内流程 > 行牌操作（摸牌、出牌）〔原表〕、三.对局流程 > 局内流程 > 行牌操作｜修改对比版（摸牌、出牌）","original_text":"原表：「摸牌需在上一家打出牌的同时摸牌（抖小是上一家的牌打到桌面后才开始摸牌）」；「其他家：打出的牌始终是摸到的那张牌」。对照版：「若没有玩家可响应上一张弃牌，下一家可以在该弃牌飞向牌河时开始展示新摸牌…只有裁决结果要求常规摸牌时才取牌」；「摸到四万，随后打出原来就有的西」。","problem":"原版／修改对比版＝同一份 PRD 中并列的两张行牌操作表，文档未声明哪版生效。两版在两点上直接对立：①摸牌时序：原表要求下家在上家出牌同帧摸牌，对照版要求先完成吃碰杠胡响应裁决、只有需要常规摸牌时才取牌；②出牌内容：原表说其他家永远打出刚摸到的那张，对照版示例是摸到四万却打出原手牌的西。按规则基准，响应必须先于下一摸，且出牌可选手牌或刚摸进的牌，因此原表两处均与基准冲突。","impact":"开发无法确定下家摸牌时机与可否改打手牌，直接影响碰/吃能否成立（先摸了牌就无法再碰吃）、托管与倒计时口径、以及录像验收标准；测试无法判断原表还是对照版为正确基线。","suggestion":"与 PRD-018 合并处理：在「行牌操作」标题下加生效声明，废弃原表或降级为历史参考；保留对照版作为唯一实现口径，并删除原表中「同时摸牌」「始终打出摸到的那张」两条；在响应阶段补一句「响应期间禁止下家取牌，裁决结果不需常规摸牌时直接进入吃/碰方出牌或杠后补牌」。\n\n**需要补的内容与必填格式**：\n生效声明＋版本差异对照表，必填列：对比项／原表描述／修改对比版描述／生效版本／依据规则条款\n\n**范例（需求必须按此格式写）**：\n对照表示例（示例值以产品确认为准）：对比项=摸牌时机；原表=上家出牌同帧摸牌；对照版=响应裁决结束且需常规摸牌时才取牌；生效版本=修改对比版；依据=规则 6.1 主循环。对比项=其他家出牌显示；原表=始终显示摸到的那张；对照版=显示实际打出的那张（示例：摸四万打西）；生效版本=修改对比版；依据=规则 6.2 出牌第1条。异常：若判定原表生效，则需同步修改规则基准与响应优先级，不允许两版并存。\n\n**验收口径**：\n文档中只剩一份生效的行牌时序描述，检索「同时摸牌」「始终是摸到的那张牌」无残留；验收用例可直接断言：A 打出牌后若 B 可碰，则 A 的下家在其响应结束前不得出现新摸牌动画；C 摸到四万后打出原手牌西，三家均显示西。","status":"待确认","has_detail":true},{"id":"PRD-020","title":"大结算被排除，却又是满8局结束与再次开场的必经节点（与 PRD-052 同根因，重复登记，建议合并）","priority":"P0","type":"内容冲突","module":["结算与结束"],"source_location":"本期开发范围；默认规则-计分与结算；玩法规则＞【局数】；玩法规则＞【定庄】","original_text":"原文中的创房面板、其他玩法选项、大结算和非核心桌面功能，如在核心段落中被引用，仅作原文上下文。｜【局数】达到所选局数时进入大结算。｜【定庄】同桌大结算后再开一场时，沿用原房间的定庄配置。","problem":"大结算＝一场多小局结束后汇总总分的总结算页。文档一处声明本期不做大结算，另一处（局数、定庄）又把大结算当作满8局后的必然节点和再次开场的判定依据；本期开发范围又要求“满8局结束本场”。基准要求大结算汇总各小局得分、按总分正负判胜负、给出胡牌／爆头／财飘／财神数量统计，并覆盖解散房间的情况。当前文档对“第8局小结算之后发生什么”没有任何可执行描述。","impact":"每场结束是核心流程，现在既无终点页面也无去处，开发无法收尾，测试无法验收“满8局结束本场”；房间解散场景（基准要求汇总）同样无定义。","suggestion":"与 PRD-052 合并处理：二选一并在全文统一：①本期补一个最小大结算（总分排序＋胜负＋统计＋再来一局／退出）；②明确本期不做大结算，删除【局数】【定庄】中的大结算引用，改写为“满8局直接回到房间准备状态／解散房间”，并说明累计分在哪里展示。\n\n**需要补的内容与必填格式**：\n新增“大结算”章节，必填：触发条件｜各座位总分｜胡牌次数｜爆头次数｜财飘次数｜财神数量｜胜负判定｜按钮与去向｜与准备态的衔接。\n\n**范例（需求必须按此格式写）**：\n正常：8局结束，A +120、B −40、C −30、D −50，显示“第1名 A 胜”，统计 A 胡牌3次、爆头1次、财飘2次、财神9张。异常：第7局有人点解散，直接返回大厅并提示“房间已解散”，不进入大结算。示例值以产品确认为准。\n\n**验收口径**：\n满8局与中途解散两种路径都有明确终点与去向，测试可按触发条件出用例；【局数】【定庄】不再引用未定义的模块。","status":"待确认","has_detail":true},{"id":"PRD-021","title":"对局人数：固定四人坐满开局 与 支持2/3/4人未满开局 互相矛盾（与 PRD-017 同根因，重复登记，建议合并）","priority":"P0","type":"内容冲突","module":["房间配置"],"source_location":"「本期开发范围」、「默认规则·人数与局数」、「游戏规则概述·对局人数」、「玩法规则·【人数】」、「桌面布局·对局前·准备信息」、「对局开始」、「牌河信息」","original_text":"默认规则：固定四人、8局。坐满4人且全部已准备后由房主开始游戏；对局人数：支持2人、3人、4人三种对局人数，由创建房间时在创房面板中选择；人数：创房人数可选2人、3人或4人。允许未满开局；准备信息：本期须坐满4人且4人均为「已准备」","problem":"「人数」是指本小局实际参战的玩家数量。文档同时给出两套互斥口径：默认规则和准备信息要求固定4人坐满才开局；对局人数表、人数模块、对局开始、牌河布局又逐条给2人/3人的座位、风位、牌河规格。三摊承包在本期固定开启，而规则基准规定好友房人数≤2时必须强制关闭该规则，若真允许2/3人则本期固定配置自相矛盾。","impact":"座位互换、发牌顺序、上家/下家/对家关系、牌河排布、摊与承包关系全部二义；开发无法确定要实现的桌面套数，测试无法确定用例集合和验收基线。","suggestion":"与 PRD-017 合并处理：二选一并全文档统一：方案A（推荐）本期只做固定四人，删除2/3人相关段落或在每处标注「旧版对照，本期不实现」，并在人数、对局开始、牌河三处加生效声明；方案B 允许未满开局，则补2/3人下三摊承包关闭、上家规则、牌河布局与风位分配。\n\n**需要补的内容与必填格式**：\n每处涉及人数的章节加「生效声明」一行 + 新增「人数口径版本差异对照表」，必填列：章节｜现描述（2/3/4人）｜本期是否生效｜统一后描述｜依据条款\n\n**范例（需求必须按此格式写）**：\n正常写法（章节头）：生效声明：本期仅实现四人局；本章2人、3人段落为旧版对照，不实现、不验收。对照表行：对局开始｜含2人/3人信息区与座位｜否｜仅4人信息区｜本期开发范围。异常写法：同一章既写「固定四人、坐满4人」又写「允许未满开局，按实际到桌人数确定」而不加任何生效标注。\n\n**验收口径**：\n全文检索「2人」「3人」「未满开局」「坐满4人」，每处都能落到对照表的一行且结论唯一；测试可直接按「仅4人」出用例，或按2/3/4三套各出一套用例，不存在两套并存。","status":"待确认","has_detail":true},{"id":"PRD-022","title":"抢杠胡赔付写成“同放铳”，与三家钱基准相反（与 PRD-075 同根因，重复登记，建议合并）","priority":"P0","type":"逻辑错误","module":["结算与结束"],"source_location":"二、功能详情＞玩法规则＞【杠】＞抢杠胡；二、功能详情＞算分规则；玩法规则＞【放铳】","original_text":"赔付方式同放铳，仅被抢杠的加杠者按放铳规则赔付，其他玩家不出分；不表示由其承担所有玩家原本应付分数的总和。具体分数见放铳及结算模块。","problem":"抢杠胡＝他人加杠时用所加第4张牌胡牌。规则基准规定抢杠胡不是普通单家放铳：庄家赢由杠牌者付 B×F×M×(人数−1)×D胜（4人局即“三家钱”），闲家赢由杠牌者付 B×F×(M+人数−2)×D胜（4人局＝庄家8倍＋两家闲各1倍）。需求文档明确写“赔付方式同放铳”“不表示由其承担所有玩家原本应付分数的总和”，与基准正好相反；且算分规则表只有自摸、放铳两行，没有抢杠胡条目。","impact":"抢杠胡金额会少算（庄家赢时少2份、闲家赢时少了两个闲家的份额），开发按文档实现会与原版对账不一致；测试无法写出正确的抢杠胡金额断言。","suggestion":"与 PRD-075 合并处理：删除“同放铳／不出其他家分”的表述，在算分规则中补抢杠胡两行：庄家赢＝底分×牌型倍数×牢庄倍数×(人数−1)；闲家赢＝底分×牌型倍数×(牢庄倍数＋人数−2)；并注明仅加杠可被抢、其余座位不出分。\n\n**需要补的内容与必填格式**：\n算分规则表列为：胡型｜付款方｜应付金额｜适用条件；抢杠胡拆成“庄家赢／闲家赢”两行，金额以 底分×牌型倍数×牢庄倍数×人数折算 表达。\n\n**范例（需求必须按此格式写）**：\n正常：4人局，底分1、牌型2倍、三牢8倍，闲家抢庄家的杠，杠牌庄家付 1×2×(8+4−2)=20分，胡牌闲家+20，其余两家0分。异常：庄家抢闲家的杠，杠牌闲家付 1×2×8×(4−1)=48分，胡牌庄家+48，其余两家0分。示例值以产品确认为准。\n\n**验收口径**：\n算分规则表出现两行抢杠胡公式，4人局代入可复算出庄赢48、闲赢20（按上例）；全文不再出现“赔付方式同放铳”；测试可直接断言三座位分值。","status":"待确认","has_detail":true},{"id":"PRD-023","title":"开局动画仅首局播放，与规则每局播放冲突","priority":"P0","type":"逻辑错误","module":["开局"],"source_location":"三.对局流程 > 局内流程 > 对局开始 > 触发逻辑","original_text":"仅在开房后的首次开局播放「对局开始」动画。…同一场内，后续小局直接进入摇骰发牌。","problem":"开局动画指开房后每一小局开始时播放的过场演出。规则基准写明「本局是第一局或非包厢时播放」，好友房属于非包厢，因此每个小局都应播放，且播放与否同时受「是否包厢」和「第几局」两个条件控制。需求文档改成「仅首次开局播放、后续小局直接摇骰」，与基准冲突，也漏掉了包厢这一控制条件。","impact":"第二小局起不播开局动画，客户端不会在动画结束时放行，服务端可能等待超时；表现与原版不一致，验收无法判定。","suggestion":"改为「每一小局开始时播放；条件为本局为第1局或房间为非包厢」，明确好友房（非包厢）每局都播，并保留「第几局/是否包厢」双条件说明。\n\n**验收口径**：\n连续两个小局均能看到开局动画；用「包厢/非包厢 × 第1局/后续局」四组用例验证播放条件与放行时机一致。","status":"待确认","has_detail":true},{"id":"PRD-024","title":"头像元素缺少外部通知与刷新范围映射","priority":"P1","type":"需求缺失","module":["牌桌区域"],"source_location":"「玩家头像信息」全表（第1至6项）、「对局前／玩家信息」第3项","original_text":"缺失说明：「玩家头像信息」表只写「玩家头像｜第三方或随机生成头像展示」「当前积分｜显示规则：5位数以个为显示单位，6位数以万为显示单位」等展示效果，未写任何元素由哪条外部通知刷新，也未出现头像框、真人语音状态。","problem":"规则基准明确头像属于「桌子」而非游戏，由跨层通知驱动，并逐条给出「哪条通知刷新哪些元素」（如玩家进入刷新昵称/累计分/头像/头像框/真人语音/离线倒计时/托管角标；玩家数据刷新只刷昵称/头像/头像框）。需求文档把头像是当成游戏内静态展示来写的，既没有通知清单，也没有头像框、语音状态等元素，开发无法判断订阅哪些消息、哪些元素该由游戏消息改。","impact":"客户端可能用错误来源（如出牌消息、结算消息）刷新头像；头像框与语音状态漏做；测试无法按通知逐条验证「刷新/不刷新」。","suggestion":"补一张「外部通知→刷新元素」映射表，并声明本期生效范围；头像框、真人语音、VIP气泡、微信红点、预约洗牌角标逐项标注本期是否实现。\n\n**需要补的内容与必填格式**：\n必填表：外部通知｜触发时机｜刷新元素｜是否本期生效｜备注；元素清单须覆盖昵称、头像、头像框、累计分、庄标、准备状态、离线计时、托管角标、语音状态、VIP气泡、微信红点、预约洗牌角标\n\n**范例（需求必须按此格式写）**：\n正常：「玩家进入｜玩家连上房间成功｜刷新昵称、头像、头像框、累计分、离线倒计时；未开局时刷新准备状态并显示头像｜本期生效」。异常：「头像变更｜出牌消息下发｜只刷新头像｜与规则不符，出牌消息不应改头像」。示例值以产品确认为准。\n\n**验收口径**：\n每个头像元素都能追溯到唯一通知来源，且「只刷新指定元素」可被断言；测试可按通知逐条触发出刷新与不刷新用例。","status":"待确认","has_detail":true},{"id":"PRD-025","title":"缺杠链计数与清零口径，连杠档位无法判定（本类主条目，PRD-087 同根因）","priority":"P1","type":"需求缺失","module":["行牌循环"],"source_location":"二、功能详情 > 玩法规则 > 杠（杠开）；番型介绍 > 杠开番型（二连杠、三连杠、四连杠）及杠爆、杠飘组合番型、胡牌番型介绍 > 番型介绍（序号6~9）、基础操作及规则 > 【杠】杠开行","original_text":"需求文档无“杠链”字样；“二连杠 4倍 连杠二次接着自摸”仅以“连杠二次”描述，未定义计数方式、清零事件与“含暗杠”标记。","problem":"规则基准规定：每次杠（明杠、暗杠、补杠）杠链+1，暗杠额外记录“含暗杠”标记；打出非财神、打出财神且不敲响、吃、碰均清零杠链与暗杠标记；杠链用于杠开系列番型。需求文档只有“连杠二次接着自摸”“连杠三次接着自摸”的结果描述，没有杠链概念、计数规则和清零规则，也未说明“含暗杠”标记用于哪一档倍数。","impact":"二连杠/三连杠/四连杠、杠爆8至32倍、杠飘系列倍数的档位无法确定；不同实现可把“吃碰后再次开杠”也计为连杠，直接导致番型倍数错误。","suggestion":"新增“杠链判定”小节，按事件列出杠链与含暗杠标记的增减，并声明杠链仅用于杠开系列番型；明确满3或满4后继续开杠是否继续累计。\n\n**需要补的内容与必填格式**：\n新增表格，必填列：事件、杠链变化、含暗杠标记变化、可判定番型、依据；事件至少覆盖直杠、加杠、暗杠、打出非财神、打出财神且敲响、打出财神未敲响、吃、碰、本小局结束。\n\n**范例（需求必须按此格式写）**：\n正常：东家直杠→杠链=1；补牌未胡再暗杠→杠链=2、含暗杠=是；补牌自摸→二连杠4倍。异常：东家暗杠→打出普通牌→杠链=0、含暗杠=否；之后直杠并补牌自摸只按杠上开花2倍计（示例值以产品确认为准）。\n\n**验收口径**：\n给定任意杠序列与出牌记录，可按表唯一推出杠链值与番型档位；测试可直接转成“杠链值→倍数”用例。","status":"待确认","has_detail":true},{"id":"PRD-026","title":"缺胡牌来源四分法与是否按自摸计算的口径","priority":"P1","type":"需求缺失","module":["行牌循环"],"source_location":"二、功能详情 > 游戏规则概述（规则概述·胡牌方式）；算分规则（结算算分）；玩法规则 > 杠（抢杠胡）；基础名词（自摸）","original_text":"胡牌方式：包括自摸胡和点炮胡；他人打出牌使玩家胡牌的行为称为放铳（点炮）。结算仅有“自摸”“放铳”两个算分分支。","problem":"规则基准要求按四种来源统一口径：自摸、杠上开花（按自摸计算=是）、点炮、抢杠胡（按自摸计算=否）。需求文档顶层只分自摸胡与点炮胡，杠上开花与抢杠胡分别在番型表、杠模块中出现，未集中声明杠上开花（含杠爆、杠飘、连杠）是否按自摸走三家付，也未声明抢杠胡是否按放铳仅由被抢者赔付。","impact":"结算分支选择（三家付或一家付）无唯一依据；抢杠胡能否叠加需自摸来源的番型（爆头、杠开）无法验收；三摊承包等依赖“是否自摸”的逻辑也无输入。","suggestion":"新增“胡牌来源判定表”，逐项给出定义、进张、是否按自摸计算、对应结算分支、可叠加番型，并声明本期启用庄闲放铳时抢杠胡的适用前提。\n\n**需要补的内容与必填格式**：\n新增表格，必填列：来源、定义、进张、是否按自摸计算、结算分支、可叠加番型、限制条件\n\n**范例（需求必须按此格式写）**：\n正常：来源=杠上开花，进张=杠后补到的牌，是否按自摸=是，结算走自摸分支由三家支付并叠加杠开番型。异常：来源=抢杠胡，进张=被抢的补杠牌，是否按自摸=否，仅加杠者按放铳赔付，不得叠加爆头（示例值以产品确认为准）。\n\n**验收口径**：\n测试对四种来源各给一个牌例，可据表唯一确定付款家数与可叠加番型；缺表或需跨三章推断则判定不合格。","status":"待确认","has_detail":true},{"id":"PRD-027","title":"缺敲响（万能听）判定口径","priority":"P1","type":"需求缺失","module":["行牌循环"],"source_location":"三、对局流程 > 手牌信息（杭麻特殊听牌标签、听牌标签显示规则）；基础名词（向听数）；玩法规则（三摊承包）","original_text":"当玩家处于胡任何牌张的情况下（爆头，财飘），此时听牌提示不会显示具体的牌，而是直接显示一张“胡”的麻将牌，tips写：“摸任意一张牌可胡”。","problem":"术语“敲响（万能听）”指进张前的手牌加副露加财神，枚举所有拆牌方案，只要有一种方案的等待牌包含“任意牌”即成立。规则基准规定了判定对象、判定方法、无财神必然不敲响，以及“万能听提示使用敲响判定”“打出财神后是否敲响用于更新飘等级”。需求文档用“处于胡任何牌张的情况下（爆头，财飘）”来描述万能听显示，未给出敲响判定方法，也未说明该提示的判定是否等同于敲响。","impact":"杠链保留条件（打出财神且敲响才保留）与飘等级更新缺少判据；万能听提示可能漏显示（非爆头的万能听牌型不显示）或多显示；杠链相关用例无法编写。","suggestion":"新增“敲响判定”小节，写明判定对象、枚举拆牌方案的方法、无财神必不敲响、使用场景（万能听提示、打出财神后飘等级更新、杠链保留），并明确本期“实际胡牌是否也必须敲响”的取值（规则标注待确认，需产品定值）。\n\n**需要补的内容与必填格式**：\n新增小节，必填条目：判定对象、判定方法、无财神时的结论、适用场景、本期是否要求实际胡牌也敲响、与爆头/财飘的区别\n\n**范例（需求必须按此格式写）**：\n正常：手牌为4组面子+1张白板，进张前枚举拆牌存在“等待任意牌”方案，敲响=是，打出财神后杠链保留并更新飘等级。异常：手牌含1张白板但只能按财神补顺子拆成4面子+1对子，听牌为固定单张，敲响=否，打出财神后杠链清零（示例值以产品确认为准）。\n\n**验收口径**：\n给出两份手牌（一份敲响、一份不敲响）时，可据文唯一判定，并据此决定杠链是否保留；测试可直接转为用例。","status":"待确认","has_detail":true},{"id":"PRD-028","title":"缺少好友房洗牌道具检测与5秒广播停留流程","priority":"P1","type":"需求缺失","module":["开局"],"source_location":"三.对局流程 / 局内流程 / 发牌（发牌逻辑前）","original_text":"缺失说明：全文无“洗牌”“洗牌道具”相关描述，发牌段仅写“掷骰展示后开始发牌”，未定义发牌前对各座位待生效洗牌道具的检测、广播与停留。","problem":"规则基准要求好友房在发牌前检测各座位是否存在待生效的洗牌道具，存在命中座位时广播并停留5秒且不真正重排牌墙；需求文档完全没有该环节，也没有“本期不下发洗牌道具、该流程不执行”的排除声明，无法判断是要实现还是不实现。","impact":"好友房带洗牌道具的牌局缺少5秒提示时序，客户端与服务端的发牌时机不一致；测试无法判断该分支是否在本期验收范围，也无法出用例。","suggestion":"在发牌前新增“洗牌道具检测”小节：检测时点（定庄完成、掷骰后、发牌前）、检测对象、命中广播内容与停留5秒、不做牌墙重排的声明、多人同时命中的处理顺序；若本期不启用，写明“本期好友房不下发洗牌道具，本流程不执行”。\n\n**需要补的内容与必填格式**：\n补“洗牌道具检测”章节，必填项：检测时点、检测对象、命中判定、广播内容与停留时长（5秒）、是否重排牌墙、多人命中的处理顺序、本期启用开关\n\n**范例（需求必须按此格式写）**：\n正常：定庄完成、掷骰动画结束后，服务端逐座位检测待生效洗牌道具；座位2命中→向全桌广播“使用洗牌道具”并停留5秒，牌墙不重排，随后进入定财神（示例值以产品确认为准）。异常：座位1与座位3同时命中→需明确定义为“按座位号从小到大依次广播、每次停留5秒”或“合并广播一次停留5秒”中的一种，示例按前者写作：座位1命中停留5秒后座位3命中再停留5秒（示例值以产品确认为准）。\n\n**验收口径**：\n文档中存在洗牌道具检测章节并明确本期是否启用；若启用，测试可按“单座位命中/多座位命中/无命中”三种情况验证广播次数、停留时长与牌墙不重排。","status":"待确认","has_detail":true},{"id":"PRD-029","title":"缺少「过」的完整规则：广播提示、非法请求处理、放弃后顺延均未定义","priority":"P1","type":"需求缺失","module":["响应动作"],"source_location":"局内流程 > 吃碰杠胡操作（碰牌表、胡牌表、吃牌表）；行牌操作｜修改对比版（出牌）；无独立「过」章节","original_text":"「点击【碰】按钮完成对应操作，点击【过】则放弃此次操作」（吃、碰、自摸、点炮四张操作表同款表述）；全文无「广播过牌提示」「非法过牌」相关描述。","problem":"规则基准把「过」当作独立动作处理：玩家放弃响应时向全桌广播过牌提示；合法过牌只放弃本次响应，响应收齐后继续仲裁或推进流程；服务端先广播提示再做合法性校验，非法请求也会先广播；并且不因过胡登记禁胡牌。需求文档只在四张按钮表里写了「点击【过】则放弃此次操作」，上述行为全部缺失，也没有说明过期后是否可再响应同一张牌、多人响应是否要等齐。","impact":"无法实现过牌协议与断线重连后的状态一致性，无法判断过期后是否顺延给下一名可胡玩家；测试无法覆盖非法过牌、连续多人过牌等关键分支，主循环可能卡在响应阶段。","suggestion":"新增「过」小节并给出功能点表，明确：广播对象与文案、校验时机与校验内容（是否本人有响应权、是否处于响应阶段）、非法过牌的提示与状态回滚、放弃后多人可胡的顺延规则、过期对放大牌与浮标的影响、明确不设过胡禁张。\n\n**需要补的内容与必填格式**：\n章节结构：触发与前置、广播提示、合法性校验、非法请求处理、对流转的影响、功能点明细表（必填列：ID／功能点／前置或触发／处理／结果与边界）\n\n**范例（需求必须按此格式写）**：\n正常：四家均可响应 5筒，A 点「过」，全桌出现 A 的过牌提示，A 不再获得 5筒的任何响应按钮，若 B 可胡则继续按逆时针就近顺延给 B。异常：C 在非响应阶段（已过并进入摸打）误发「过」请求，服务端先广播 C 的过牌提示，再校验失败，回执非法并保持 C 的当前状态不变（示例值以产品确认为准）。\n\n**验收口径**：\n按小节可直接写出 4 条以上测试用例（正常过、连续过、非法过、过期后顺延），每条都有可断言的广播内容与状态变化；文档中不存在「超时规则」「按对应模块执行」这类无对应章节的引用。","status":"待确认","has_detail":true},{"id":"PRD-030","title":"吃缺少「闲闲方向摊数达2即禁止吃」的判定门槛，吃碰次数限制本期是否开启也未写","priority":"P1","type":"需求缺失","module":["响应动作"],"source_location":"规则详情 > 【吃】；玩法规则 > 三摊承包；默认规则 > 本期固定生效 > 承包与行牌","original_text":"【吃】：「上家刚打出的1张非财神牌，与玩家手中的2张非财神牌可组成同花色、点数连续的顺子时，玩家可以选择吃」（无摊数或次数条件）；三摊承包：「闲家与闲家之间最多2摊（无法触发承包）」","problem":"规则基准把吃权限限定为：吃碰次数限制开启时该方向吃＋碰次数＜2；三摊承包开启且吃方与被吃方均为闲家时，该方向摊数＜2，达2摊不再给吃。需求文档的吃牌条件里完全没有这两条门槛，三摊承包只写了「闲闲最多2摊」这一结果性描述，未写明达2摊后禁止继续吃；本期配置里也找不到「吃碰次数限制」开关状态，无法判断是否要校验＜2。","impact":"闲家之间已满2摊时仍可继续吃，摊数会突破上限并错误影响承包/倒承包判定；吃碰次数限制开关状态未知，开发只能自行猜测，验收无对照基准。","suggestion":"在吃牌条件补两条判定，并在默认规则表补「吃碰次数限制：开启/关闭」的固定值；同时明确三摊承包开启时，闲闲方向摊数达2后禁止该方向继续吃（碰、明杠是否同样禁止按本期碰算摊配置单独说明）。\n\n**需要补的内容与必填格式**：\n判定条件列表＋配置表，必填列：规则名／本期取值／校验对象／上限值／达上限后的表现（按钮与提示）\n\n**范例（需求必须按此格式写）**：\n正常：三摊承包开启，闲家 A 从闲家 B 处已有1摊，A 吃 B 的牌成立后摊数变2，广播摊数变化。异常：A 从 B 处已满2摊，B 再打 A 可吃的牌，A 的界面不弹【吃】按钮，若客户端误提交服务端返回不可吃（示例值以产品确认为准）。\n\n**验收口径**：\n文档能直接映射为两条判定断言；用例：闲闲2摊后吃请求被拒且不弹按钮，庄闲方向3摊后仍可继续吃（规则允许）；配置表中吃碰次数限制有明确取值。","status":"待确认","has_detail":true},{"id":"PRD-031","title":"未规定打出的财神弃牌不能点炮胡，只写了不能吃碰杠","priority":"P1","type":"需求缺失","module":["响应动作"],"source_location":"基础名词和概念解释 > 名词介绍 > 【财神】；规则详情 > 放铳；规则详情 > 【杠】抢杠胡","original_text":"「白板财神模式下：财神牌打出后失去万能牌功能，按普通白板牌处理；其他玩家不能吃、碰或杠该弃牌。」","problem":"规则基准明确：打出的牌是财神时不能胡。需求文档只禁止其他玩家吃、碰、杠该弃牌，并把财神弃牌定义为「按普通白板牌处理」，字面上可被理解为可被点炮胡，导致点炮权限判定出现两种相反实现。","impact":"闲家打出白板时，庄家可能被错误授予点炮胡权限，直接造成错误胡牌与错误赔付；测试无法据文档判断该场景的期望结果。","suggestion":"在财神词条与点炮条件中同时补一句：财神牌打出后不可作为他人点炮胡的进张；自摸时若进张为财神，仍可按财神替代规则参与胡牌组合判定。\n\n**验收口径**：\n文档中「不能吃、碰、杠该弃牌」后追加「也不能被点炮胡」；用例：三牢局闲家打白板，庄家手牌可成胡，不出现【胡】按钮，仅可【过】。","status":"待确认","has_detail":true},{"id":"PRD-032","title":"缺少胡牌落地数据记录清单，结算界面所需字段无前置定义","priority":"P1","type":"需求缺失","module":["结算与结束"],"source_location":"结算流程 > 流程明细（胡牌场景）；结算界面 > 小结算界面 > UI交互以及说明（赢家结算、手牌摆布）","original_text":"「触发操作：对局中有玩家胡牌，根据玩家的番型播放对应番型特效」「参考功夫川麻的胡牌流程即可」；结算界面「胡牌的玩家按照玩家胡牌的摆法分割手牌」「展示本局胡牌番型」","problem":"规则基准要求胡牌落地时记录：胡牌类型、进张、来源座位、胡牌拆解、番型与番数，以及三财/四财翻倍触发标记，并规定唯一胡牌座位、抢杠还原、进入结算。需求文档在胡牌阶段只有「播放番型特效、参考功夫川麻」，没有这些字段的名称、来源与写入时机，而结算界面又依赖它们（手牌按胡牌摆法分割、展示番型与承包标识、胡的牌要打标记）。","impact":"客户端小结算无法确定如何分割手牌、标注哪张是胡牌、展示哪个番型名称；服务端无落地字段定义，联调时口径不一，无法验收胡牌与结算的一致性。","suggestion":"新增「胡牌落地」小节，列出字段清单（胡牌类型：自摸/点炮/抢杠；进张牌；来源座位；胡牌拆解分组；命中番型与番数；庄闲与牢数；结束类型）并说明每个字段的消费方（小结算手牌摆布、番型展示、承包标识）。\n\n**需要补的内容与必填格式**：\n字段表，必填列：字段名／含义／来源（服务端计算或客户端推导）／写入时机／消费界面\n\n**范例（需求必须按此格式写）**：\n正常：闲家 C 用庄家打出的5筒点炮胡，落地记录：胡牌类型=点炮；进张=5筒；来源座位=庄家；拆解=123筒/77万/碰5条/杠东/对9筒；番型=平胡，倍数=1；牢数=三牢；结束类型=点炮胡。小结算按拆解分组分割手牌并在5筒上打“胡”标。异常：抢杠胡落地时胡牌类型=抢杠，来源座位=被抢杠者，补杠还原为碰展示且摊数不变（示例值以产品确认为准）。\n\n**验收口径**：\n字段表覆盖规则要求的全部记录项，每个字段都能对应到一处界面消费；测试可直接据此断言结算数据与界面显示一致（番型名、倍数、胡牌牌面标记、拆解分组数）。","status":"待确认","has_detail":true},{"id":"PRD-033","title":"结算层三财/四财翻倍与财神总数口径缺失","priority":"P1","type":"需求缺失","module":["番型与倍数"],"source_location":"二、功能详情 > 算分规则（结算算分）、胡牌番型介绍 > 番型介绍（序号1~50）、默认规则","original_text":"缺失说明：全文仅出现“三财飘”（财神系列档位），无三财翻倍、四财翻倍、财神总数的定义；番型介绍表与结算算分表均未列结算层翻倍倍率。","problem":"规则基准规定：开关开启且财神总数≥3时最终番数×2，≥4时再×2，两项独立判断、同时满足连乘最高×4；财神总数=手牌财神数+出牌区已打出财神数，不含副露；倍数封顶在其后截断。文档完全没有该结算层倍率，也未说明本期开关取值，等于把“最终番数”少算一档。","impact":"含3张或4张财神的胡牌，最终得分可能少算2~4倍，直接影响结算与对账；测试无法判定财神总数的统计范围（副露区财神是否计入）。","suggestion":"新增「结算层倍率」小节，明确开关、财神总数统计口径、阈值与倍率、连乘关系、与番型乘积及封顶的先后顺序，并给出示例。\n\n**需要补的内容与必填格式**：\n新增「结算层倍率」表，必填列：倍率名称｜触发开关与本期取值｜计数口径（手牌／出牌区／副露是否计入）｜触发阈值｜倍率｜是否与其它倍率连乘｜与番型乘积、封顶的执行顺序。\n\n**范例（需求必须按此格式写）**：\n正常：手牌2张财神、出牌区已打出2张财神、副露区0张，财神总数=4，三财与四财开关均开启，番型乘积=8，最终番数=8×2×2=32（示例值以产品确认为准）。异常：手牌1张财神、出牌区0张、副露区含2张财神，财神总数=1，两项均不触发，最终番数=番型乘积（示例值以产品确认为准）。\n\n**验收口径**：\n三财、四财、同时满足、仅副露含财神四类用例的最终番数均可按文档公式复算，且与结算展示一致。","status":"待确认","has_detail":true},{"id":"PRD-034","title":"番型判定输入清单与相关规则开关取值未定义","priority":"P1","type":"需求缺失","module":["番型与倍数"],"source_location":"默认规则（本期固定生效、原方案中的后续可选项）、对局内通用提示（有财必拷响）、胡牌番型介绍","original_text":"“本期固定生效”仅列人数与局数、牌组与财神、定庄与轮庄、连庄数、胡牌玩法、承包与行牌、计分与结算七项；“原方案中的后续可选项：翻财神、平庄起、笃二老庄、仅自摸、两摊封顶…”；“有财必拷响｜前置条件：勾选有财必拷响规则、该玩家有财神”。","problem":"规则基准要求番型判定显式基于：胡牌来源、拆牌结构、手牌/副露/进张、实际财神与财神计数、敲响状态、飘等级、杠链、飘杠先后、连续字牌数、相关规则开关。文档只用口头释义描述番型，没有判定输入清单；同时“有财必拷响”“财神替豪七”“三财/四财翻倍”“翻财神”这些开关既不在本期固定生效清单，也不在后续可选项清单，取值未知，而平胡、七对带财/无财分组、财神系列、结算层倍率全部依赖这些开关。","impact":"服务端无法确定判定入参；同一手牌在“开关开”和“开关关”下应得到不同番型，验收时无法判定哪一种正确，容易把含财神平胡与七对档位实现错。","suggestion":"新增「番型判定输入」表与「番型相关开关取值」表，把判定所需字段和本期开关取值一次写清，并标注每个开关影响的番型。\n\n**需要补的内容与必填格式**：\n新增两张表。表一「番型判定输入」，必填列：输入项｜取值来源｜字段/数据结构｜缺省值。表二「番型相关开关」，必填列：开关名｜本期取值（开/关）｜影响的番型｜关闭时的行为。\n\n**范例（需求必须按此格式写）**：\n正常：开关表填“有财必拷响=开”“财神替豪七=关”“三财翻倍=开”“四财翻倍=开”，并注明有财必拷响开启时含财神手牌不得命中平胡（示例值以产品确认为准）。异常：若“有财必拷响=关”，则手牌含财神、结构为3N+2且自摸时命中平胡1倍，不得因含财神而被拦截（示例值以产品确认为准）。\n\n**验收口径**：\n开发可仅凭输入表构造判定入参；每个开关的开/关两组用例都能给出与文档一致的番型结论；测试可直接按开关取值组合出用例。","status":"待确认","has_detail":true},{"id":"PRD-035","title":"流局如何结算、是否进小结算页未定义（本类主条目，PRD-042、PRD-099 同根因）","priority":"P1","type":"需求缺失","module":["结算与结束"],"source_location":"结算流程＞流程明细；结算界面＞小结算界面（好友房）＞触发逻辑；名词介绍＞【流局】；玩法规则＞【局数】、结算流程·流程明细（胡牌场景行、对局结果阶段展示行）、「结算界面·小结算·触发逻辑」、「小结算·UI交互以及说明」、「结算流程」表·对局结果阶段展示","original_text":"对局结果阶段展示：前置条件：对局结束后 可以是出现流局，对局结束…展示本局所有玩家的分数｜小结算触发条件：播完胡牌结算流程，进入结算界面","problem":"基准要求流局不产生胡牌输赢分、仍按座位写分记录并下发、未完成的跟庄不赔付。文档只在小结算触发条件写“播完胡牌结算流程”，流局没有胡牌流程，因此不会触发；也没有写明流局时各座位显示多少分、是否仍弹小结算页、页面是否标注“流局”、写分与连庄／局数推进的先后（仅局数章节一句“流局也计1局”）。","impact":"流局是高频分支，界面与数据都不确定，可能出现流局不弹结算页、漏写分或分数展示错乱；测试无法验收。","suggestion":"补“流局结算”一节：触发（流局判定成立）｜各座位得分（全部0，不产生胡牌输赢分）｜是否下发小结算及页面标识｜写分记录｜连庄与局数推进顺序。\n\n**需要补的内容与必填格式**：\n新增表格：触发条件｜各座位得分｜是否下发小结算｜结算页文案／标识｜写分｜连庄变化｜局数变化。\n\n**范例（需求必须按此格式写）**：\n正常：第5局流局，四家各0分，结算页顶部显示“流局”，庄家连庄进入第6局。异常：第8局流局，四家各0分，随后进入场结束流程（按大结算口径）。示例值以产品确认为准。\n\n**验收口径**：\n流局用例可断言“四家0分、出现流局标识、局数+1、庄家不变、写分齐全”；小结算触发条件不再只覆盖胡牌。","status":"待确认","has_detail":true},{"id":"PRD-036","title":"空闲与已结束状态的重连下发缺失","priority":"P1","type":"需求缺失","module":["断线重连"],"source_location":"3.4 桌面布局·对局前（准备信息）；5.1 结算流程；6.1 菜单（退出）","original_text":"原文仅有对局内与退出口径：“准备信息：未准备时显示“未准备”；准备后显示“已准备”；房主默认准备”“本期须坐满4人且4人均为「已准备」，此时仅房主显示并可点击「开始游戏」”。缺失说明：未定义未开局、结算展示中、房间已解散时重连下发什么。","problem":"空闲场景指房间未进行对局时玩家看到的准备界面或房间列表状态。需求文档没有定义玩家在等待阶段（未开局）、小结算展示期间、房间已解散或本场已结束后重新进入时应下发什么内容，也没有说明重连后是否回到准备界面、断线图标与断线计时是否清零。这直接导致“重连却恢复了已结束对局”或“重连卡在空白牌桌”的实现分歧。","impact":"玩家在非对局状态掉线后重连的落地界面不可预期，可能出现牌桌残留、准备状态丢失、无法再次开局；测试缺少非对局状态重连用例；验收无法判定重连表现是否正确。","suggestion":"补一张“非对局状态重连”表，覆盖未开局等待、小结算展示中、本场结束、房间已解散四种情形；明确下发内容、客户端落地界面与断线计时处理，并声明这些情形一律不恢复牌桌数据。\n\n**需要补的内容与必填格式**：\n必含表：房间/对局状态｜重连触发｜服务端下发内容｜客户端落地界面｜断线计时与图标处理；并加一句“非对局状态不恢复牌桌数据”的声明。\n\n**范例（需求必须按此格式写）**：\n正常：玩家在等待阶段掉线后重连→下发空闲场景，显示当前4人准备状态与房主「开始游戏」按钮，断线图标与计时清零（示例值以产品确认为准）。异常：房间已解散后重连→仅下发空闲场景，不恢复牌桌，提示房间已解散并返回大厅（示例值以产品确认为准）。\n\n**验收口径**：\n四种非对局情形的重连结果均有唯一落地界面，且都不携带牌墙、手牌、局数据；测试可直接按四情形出用例。","status":"待确认","has_detail":true},{"id":"PRD-037","title":"缺飘财的局内提示：无出财神玩家、无飘次数、无限制状态展示（本类主条目，PRD-045 同根因）","priority":"P1","type":"需求缺失","module":["特殊规则"],"source_location":"三.对局流程-桌面布局（玩家头像信息、玩法信息、牌河信息）、对局内通用提示、手牌信息（听牌标签）、胡牌番型介绍（财飘系列）、二-2.2 名词介绍【飘】；二-2.5 番型介绍（财飘、双财飘、三财飘）；三-3.3.2 玩法信息；三-4.4 行牌操作；三-4.5 吃碰杠胡操作","original_text":"全文没有任何飘财发生的提示规则；仅在听牌标签写「打出去后能够财飘的牌：飘」，及番型表写「财飘 4倍｜打出1张财神下一圈爆头」。","problem":"规则要求提示出财神玩家与实际飘次数；需求文档只有番型计分表和出牌前的听牌预测标签，没有飘财发生时的展示（谁飘的、当前飘几次），也没有被限制玩家「禁吃、禁碰、禁明杠、只能摸打」的受限状态展示与解除提示。","impact":"被限制的玩家不知道自己受限，会照常点击吃碰按钮并收到非法操作回执，体验与合规性差；验收规则 13 的「飘提示可见」时无任何可对照的展示条目。","suggestion":"新增飘的展示条目：飘发生时在牌河财神处或出财神玩家方位显示飘标记与次数；对所有受限制玩家显示限制状态并在操作栏置灰吃、碰、明杠；在飘发起玩家下一次摸牌时清除限制并给出解除提示。多名玩家先后飘时按来源分别记录并叠加展示。\n\n**需要补的内容与必填格式**：\n新增「飘」展示表，必含列：事件｜触发时机｜展示对象｜展示内容（飘者、飘次数、受限项、解除）｜展示位置｜持续时长｜动效\n\n**范例（需求必须按此格式写）**：\n正常：玩家A打出财神触发第 1 次飘财，牌河该财神上方显示「飘×1」，其余三家头像旁出现「飘限制」标记且吃、碰、明杠按钮置灰，A下一次摸牌时移除（示例值以产品确认为准）。\n异常：玩家A飘财后玩家B又飘财，A也进入受限状态，A界面同时显示「A飘×1」与「B飘×1」两个来源；B下一次摸牌只解除B产生的限制，A产生的限制待A下一次摸牌解除（示例值以产品确认为准）。\n\n**验收口径**：\n飘的发生、次数叠加、来源区分、限制展示与解除四个时点均有明确展示规则；测试可据此编写「飘后按钮置灰」「双飘叠加」「各自解除」三条用例。","status":"待确认","has_detail":true},{"id":"PRD-038","title":"缺少现状差异与待确认清单","priority":"P1","type":"需求缺失","module":["总览与文档"],"source_location":"全文（无对应章节）；「发牌」发牌UI以及动画表现","original_text":"缺失说明：全文无「事项｜现状口径｜待确认」形式的现状差异表，也无编号待确认清单；仅零散出现「待确认。发牌与理牌的音效资源及触发时点本方案不添加。」一处待确认标记。","problem":"规则基准要求把“现状口径与待确认项”逐条登记，并附编号化待确认清单与待联调验证表。需求文档大量依赖既有实现（复用老包）却又没有登记哪些行为以现状为准、哪些需产品拍板，团队无法区分“已定”与“待定”。","impact":"开发按各自理解实现，验收时对同一行为出现两种解释；待确认项散落在正文，容易遗漏并造成返工。","suggestion":"新增「现状差异与待确认」章节并配套「待确认清单」，把复用类、动画类、未定义行为类事项逐条登记，标明影响与建议处理方式。\n\n**需要补的内容与必填格式**：\n新增章节「现状差异与待确认」，表格必填列为：编号 | 事项 | 现状口径 | 待确认／备注；新增「待确认清单」表格必填列为：编号 | 问题 | 影响 | 建议处理；新增「待联调验证」表格必填列为：编号 | 事项 | 验证方式。\n\n**范例（需求必须按此格式写）**：\n正常示例：D-01｜杠牌特效｜现状口径 复用现有血战杠特效，删除刮风下雨，统一使用「杠」字｜待确认 杠字动效时长与音效来源需客户端确认。\n异常示例：P-01｜吃碰后的分隔位显示｜问题 吃／碰成立后尾端分隔位显示剩余手牌最后一张，其他家显示牌背，与常规摸牌位是否同一位置未定义｜影响 客户端绘制与测试判定｜建议处理 产品确认后写入「行牌操作」章节。（示例值以产品确认为准）\n\n**验收口径**：\n两张表均存在且编号唯一；每条待确认项可指回需求文档对应章节；产品可逐行给出结论，结论落地后能反向修订正文，测试可按状态区分必测与待定。","status":"待确认","has_detail":true},{"id":"PRD-039","title":"全文缺失重连与回放处理规则（与 PRD-001 同根因，重复登记，建议合并）","priority":"P1","type":"需求缺失","module":["断线重连"],"source_location":"全文（仅3.3.3 玩家头像信息「离线状态」提到断线图标与计时）","original_text":"离线状态：头像处覆盖断线图标，且显示断线计时，格式为分秒“00:00”。全文无重连、回放任何章节。","problem":"重连与回放指断线后重新进入小局或回放历史对局时，按只补数据方式恢复。规则逐条要求：重连只记录数据、不播开局动画、不刷新操作区与头像标记；只记录庄家与门风、不刷庄标与方位盘；骰子静态显示点数不滚动且不自动隐藏；只记录牌墙不刷新余牌数；只记录手牌不播动画；桌面财神补发一次显示但不播翻牌动画。需求文档全文没有重连与回放章节，断线只涉及头像图标和计时。","impact":"重连后会重播开局、发牌、洗牌等动画，界面与数据错位；断线恢复是必现线上问题，当前无法开发也无法验收。","suggestion":"与 PRD-001 合并处理：新增「重连与回放」章节，逐消息列：重连时是否显示、是否播动画、是否刷新界面、是否补发；并定义「只补数据」标记由调用方传入。\n\n**需要补的内容与必填格式**：\n新增章节表：消息｜重连表现｜回放表现｜只补数据时的差异｜需要补发的界面元素\n\n**范例（需求必须按此格式写）**：\n正常：小局中断线重连→不播开局与发牌动画，直接显示庄标、方位盘和桌面财神牌，余牌数按当前值显示，骰子以静态点数显示不滚动（示例值以产品确认为准）。异常：重连期间收到洗牌消息且带只补数据标记→不播洗牌动画，也不改预约状态，由调用方补齐。\n\n**验收口径**：\n断线重连用例：动画不重播，庄标、方位、财神、余牌数与断线前一致；回放按同一录像逐帧比对，无动画重入。","status":"待确认","has_detail":true},{"id":"PRD-040","title":"记牌器规则缺失，听牌剩余张数无法计算","priority":"P1","type":"需求缺失","module":["牌桌区域"],"source_location":"三.对局流程 → 局中信息 → 玩法信息（剩余张数）；三.对局流程 → 行牌操作｜修改对比版（提牌）；二.功能详情 → 基础名词和概念解释","original_text":"（提牌）“提起候选牌时，面板显示该牌打出后可胡的牌面及各自剩余张数。”","problem":"文档要求听牌提示面板展示“各自剩余张数”，但全文没有记牌器（各类牌剩余张数记录）的定义：没有说明自己摸牌、他人出牌、他人吃、他人碰（只扣2张）、他人杠（扣整组，暗杠也要扣）、自己副露时如何扣减，也没有开局初始值与“任意牌不显示剩余张数”的约定。剩余张数只能靠界面上的总余牌数体现，无法推出单张牌的剩余量。","impact":"听牌提示中的张数是玩家决策依据，缺数据模型会导致客户端各自估算、与服务端听牌数据不一致，验收时无法判定“剩余张数是否正确”。","suggestion":"新增“记牌器”数据小节，定义初始值（136张按牌面统计）与各类事件下的扣减口径，并写明“任意牌（爆头/财飘）不显示剩余张数”。\n\n**需要补的内容与必填格式**：\n新增表格，必填列：事件 | 触发方（本人/他人）| 对本人记牌器的扣减 | 对他人记牌器的扣减 | 备注（暗杠是否公开牌面）\n\n**范例（需求必须按此格式写）**：\n正常：开局136张，本人起手14张后记牌器按手牌逐张扣减；下家打出1张5筒，本人5筒剩余张数从4减到3，提牌面板“5筒”显示剩余3张。异常：对手暗杠4张7条时，本人看不到具体牌面，但记牌器中7条的剩余张数仍按4张扣减，面板不再显示7条可胡；爆头状态下提牌面板只显示“任意牌可胡”，不显示剩余张数。示例值以产品确认为准。\n\n**验收口径**：\n每个扣减事件对应的计数器变化可被断言，听牌剩余张数与计数器结果一致；测试可产出“他人出牌扣1/他人碰扣2/他人暗杠扣4/爆头不显示张数”4条用例。","status":"待确认","has_detail":true},{"id":"PRD-041","title":"单放禁打机制与吃碰后待出牌判定缺失","priority":"P1","type":"需求缺失","module":["特殊规则"],"source_location":"二.功能详情 → 规则详情 → 玩法规则 → 【吃碰禁手】；二.功能详情 → 规则详情 → 基础操作及规则 → 【吃】【碰】；三.对局流程 → 行牌操作｜修改对比版（出牌）","original_text":"吃以后下一次摸牌前禁止打出特定牌：吃中间禁打中间，吃两边禁打两边；碰哪张就禁打哪张","problem":"文档只有“禁打某几张牌值”的描述，没有“单放”（刚摸上来那张牌单独禁打）这一限制类型，也没有说明吃/碰之后手中那张待出的牌不按单放处理。按现文档无法区分“整张牌值禁打”和“仅禁打刚摸上来那张”，也无法避免把吃/碰后的待出牌误判为单放而错误压暗。","impact":"吃、碰之后手牌张数呈现“三缺一”状态，若按余数判断单放会把待出的牌全部压暗，玩家无牌可打；若本期确实不做单放，也会让开发自行猜测，验收口径不一。","suggestion":"明确本期是否启用单放禁打：启用则在“吃碰禁手”下补充单放的定义、作用对象（仅最后摸上来的那张）、与整张牌值禁打的叠加优先级；不启用则显式写“本期不下发单放禁打数据，吃碰后待出牌一律不按单放处理”。\n\n**需要补的内容与必填格式**：\n新增“出牌限制（禁打）”小节，必填表格列：限制类型（牌值禁打/单放禁打）| 数据来源字段 | 作用牌张 | 置灰范围 | 清空时机 | 本期是否生效\n\n**范例（需求必须按此格式写）**：\n正常：玩家碰2筒后禁打2筒，手中另一张2筒同样压暗不可打；此时手牌为11张且尾端还有一张待出的牌，该待出牌不压暗，可正常打出。异常：玩家刚摸到1张9筒，服务端仅下发“单放=9筒”而未下发牌值禁打，则只有尾端分隔位那张9筒压暗，手中原有的9筒仍可打出。示例值以产品确认为准。\n\n**验收口径**：\n单放是否生效有唯一结论；生效时“牌值禁打”与“单放”的作用范围可分别验证，吃碰后待出牌不压暗可被断言；测试可产出“单放只锁刚摸的牌/吃后待出牌可打”2条用例。","status":"待确认","has_detail":true},{"id":"PRD-042","title":"流局结算表现与流局分数未定义（与 PRD-035 同根因，重复登记，建议合并）","priority":"P1","type":"需求缺失","module":["结算与结束"],"source_location":"结算流程·流程明细（胡牌场景行、对局结果阶段展示行）","original_text":"胡牌场景行只写「触发操作：对局中有玩家胡牌，根据玩家的番型播放对应番型特效」；对局结果阶段展示行写「前置条件：对局结束后，可以是出现流局，对局结束」，但未写流局如何播横幅、四家分数是多少、小结算文案如何显示。","problem":"规则基准把流局与胡牌并列为结算消息的两种来源，要求按结束类型显示「流局」横幅并下发四家得失分；文档的结算流程只覆盖胡牌场景，流局局的横幅文案、四家分数口径（0分还是仍计分）、小结算的输赢文案、牢数变化均无描述。","impact":"文档明确「流局也计1局」，流局出现频率高；缺定义会导致流局局复用胡牌表现，分数与文案错误，测试无法验收流局局。","suggestion":"与 PRD-035 合并处理：在结算流程表新增「流局场景」行，并新增结束类型表，写明横幅文案与时长、四家分数、小结算文案、牢数变化。\n\n**需要补的内容与必填格式**：\n需新增「结束类型」表：列＝结束类型（自摸/点炮/流局）｜触发条件｜横幅文案与时长｜四家本局得分口径｜小结算输赢文案｜牢数变化；并在结算流程表补「流局场景」行。\n\n**范例（需求必须按此格式写）**：\n正常：流局时桌面显示「流局」横幅1秒，四家本局得分均为0，小结算四家均不显示「恭喜获胜/遗憾失败」，庄家连庄且牢数按规则+1（示例值以产品确认为准）。异常：牌墙剩20张后最后一次出牌被他家点炮胡，则按点炮胡结算并显示「点炮」横幅，不判流局（示例值以产品确认为准）。\n\n**验收口径**：\n结算流程覆盖胡牌、点炮、流局三类；测试可分别构造流局局与胡牌局，核对横幅文案、四家分数、小结算文案与牢数。","status":"待确认","has_detail":true},{"id":"PRD-043","title":"结算摊牌与胡牌牌面展示缺失","priority":"P1","type":"需求缺失","module":["结算与结束"],"source_location":"结算流程·流程明细；吃碰杠胡操作·胡牌（摆放效果）","original_text":"结算流程仅写「参考功夫川麻的胡牌流程即可」；全文无「摊牌」字样（检索0处），只在胡牌按钮阶段写了「摊开摆放在自己手牌右侧的间隔4分之1牌距离，显示手掌标记」。","problem":"规则基准把「全桌摊牌」与「终局摊牌」作为结算演出的核心环节；文档用「参考功夫川麻」一句代替，未定义胡家手牌如何拼胡牌、箭头指向哪一方、点炮牌是否从牌河移除、终局时四家手牌是否全亮、自己手牌是否缩小右移。","impact":"结算画面无法按规则还原牌局，玩家看不到「胡了谁的牌」；点炮牌移除与否会造成牌河张数错误，影响结算画面可信度与回放一致性，也无法截图验收。","suggestion":"在结算流程内新增「摊牌」小节，按顺序写清逐家摊牌、胡牌拼接、箭头方位、点炮移牌、财神重刷色、终局全亮与手牌缩放。\n\n**需要补的内容与必填格式**：\n需新增「结算摊牌」表：列＝步骤顺序｜对象（胡家/未胡家/放炮家）｜手牌状态｜胡牌拼接方式｜方位箭头｜河牌处理｜备注。\n\n**范例（需求必须按此格式写）**：\n正常：胡家手牌翻开并按胡牌结构分组，胡的那张拼在最右，上家放炮时显示←箭头并把该牌从放炮方牌河移除（示例值以产品确认为准）。异常：结算数据缺少胡牌来源座位时不显示箭头并记录错误日志，不得自行推测方向（示例值以产品确认为准）。\n\n**验收口径**：\n摊牌步骤可逐条转成用例；截图核对可确认胡牌拼接位置、箭头方向、点炮牌已从牌河消失、终局四家手牌全亮。","status":"待确认","has_detail":true},{"id":"PRD-044","title":"全篇缺少重连与回放处理，各消息只补数据分支未定义（与 PRD-001 同根因，重复登记，建议合并）","priority":"P1","type":"需求缺失","module":["断线重连"],"source_location":"三、对局流程（桌面布局、局中信息、局内流程、对局内通用提示、结算流程）；三-4.1 对局开始、三-4.2 定庄、三-4.3 定财神、三-4.4 行牌操作、三-4.5 吃碰杠胡操作","original_text":"缺失说明：全文未出现「重连」「回放」「断线重连」等任何表述，各表现章节只描述服务端正常下发时的演出，没有区分正常执行与只补数据两条路径。","problem":"规则基准要求每条消息都区分「正常执行」与「只补数据」，并明确规定哪些动画在重连或回放时补播、哪些必须抑制（三摊更新重连可能重复播放落地动画、飘只恢复数据不播动画、跟庄骰子回放静态重放且不回包、升庄只更新等级不显示标记、匹配场底分只保存不刷新文字）。需求文档没有任何重连与回放章节，开发无法判断重连时是否补播动画、是否向服务端回包、是否刷新界面。","impact":"重连后可能出现动画重复播放（三摊落地、飘）、流程卡住（跟庄骰子未回包）或数据未恢复（财神颜色）；测试无法编写重连用例，验收无判定口径。","suggestion":"与 PRD-001 合并处理：新增独立章节「重连与回放」，逐条消息（通知提示、游戏配置、三摊更新、飘、跟庄重扔骰子、升庄广播、匹配场底分）列出正常路径、只补数据路径、回放路径、是否补播动画、是否回包；对三摊落地与飘明确标注重连是否抑制。\n\n**需要补的内容与必填格式**：\n新增「重连与回放」章节，按消息建表，必填列：消息名称／正常下发表现／只补数据路径表现／回放路径表现／是否补播动画／是否向服务端回包／备注\n\n**范例（需求必须按此格式写）**：\n正常：飘消息正常下发 → 在该座位的吃碰杠飘动画位播放一次「飘」动画，播完自动隐藏，桌面不显示飘计数数字（示例值以产品确认为准）。异常：重连补数据时服务端重发三摊更新，且当时该玩家对另一家摊数已为3 → 仅保存摊计数，不播放「三摊落地」动画；若播放即判定为重复演出缺陷。\n\n**验收口径**：\n每条消息在章节表中都有三行结论（正常、只补数据、回放），且与规则基准一致；测试可据此直接产出「重连到某消息时是否播动画、是否回包」的用例并判定通过或失败。","status":"待确认","has_detail":true},{"id":"PRD-045","title":"缺少「飘」的局内表现：动画位、自动隐藏、不显示计数（与 PRD-037 同根因，重复登记，建议合并）","priority":"P1","type":"需求缺失","module":["特殊规则"],"source_location":"二-2.2 名词介绍【飘】；二-2.5 番型介绍（财飘、双财飘、三财飘）；三-3.3.2 玩法信息；三-4.4 行牌操作；三-4.5 吃碰杠胡操作","original_text":"缺失说明：全文只有【飘】的规则文字（打出财神后限制其他玩家摸打）与财飘、双财飘、三财飘的倍数，没有任何关于打出财神后播放「飘」动画的界面区域、动画时长、结束方式或飘计数展示的说明。","problem":"规则基准定义了飘的完整表现：飘消息下发后在该座位的吃碰杠飘动画位播放一次「飘」动画、播完自动隐藏，桌面不常驻显示飘计数数字，飘计数只用于结算，重连只恢复数据。需求文档中碰杠展示区只写「手牌左侧平移放置碰牌」，不存在飘动画位，也没有任何「不显示飘计数」的声明，开发不知道财神打出后是否需要局内反馈。","impact":"核心行牌事件（飘财）没有表现规格，客户端可能做成数字常驻或完全无反馈，两种都偏离规则；验收缺项，双财飘、三财飘的连续演出更无依据。","suggestion":"与 PRD-037 合并处理：在局中信息新增「飘」表现条目：动画位置为该座位吃碰杠飘动画位（与碰杠同区）、由打出财神者座位播放、播完自动隐藏、桌面不显示飘计数数字、重连与回放不播放；并说明连续飘（双财飘、三财飘）每次各播一次还是合并播放。\n\n**需要补的内容与必填格式**：\n新增「飘」表现表，必填列：触发条件／界面区域／动画表现／结束与隐藏／桌面常驻显示／重连／回放\n\n**范例（需求必须按此格式写）**：\n正常：玩家A在出牌阶段打出1张白板财神 → 在A座位的吃碰杠飘动画位播放一次「飘」动画，播完自动隐藏，桌面不显示飘计数数字（示例值以产品确认为准）。异常：同一玩家在下一轮再打出1张财神（累计2次飘）→ 再次播放一次「飘」动画，桌面仍不显示「2」这类计数数字，结算按双财飘倍数处理（示例值以产品确认为准）。\n\n**验收口径**：\n文档能回答「飘在哪里播、播几次、何时消失、桌面是否显示数字、重连是否播」五个问题；测试可据此验证单次飘、连续飘与重连三种场景。","status":"待确认","has_detail":true},{"id":"PRD-046","title":"开局准备阶段重连的残留清场缺失","priority":"P1","type":"需求缺失","module":["断线重连"],"source_location":"3.3.1「方位信息」、3.3.2「玩法信息」、3.3.3「玩家头像信息」、4.1「对局开始」","original_text":"仅在开房后的首次开局播放「对局开始」动画。（文档未说明重连进入开局/准备阶段时是否重播该动画，也未说明上一局残留如何清理）","problem":"术语：清场＝重连时先把上一局残留的桌面元素、头像标记、提示与定时任务清干净，再由后续恢复流程写入本局数据。需求文档没有准备/开局阶段的重连清场清单：清空四家手牌、河牌、副露、胡牌区，隐藏听牌按钮与剩余张数、隐藏胡牌方式标记、清空出牌与胡牌落地特效、清掉加倍/庄家/头像发光框与未执行定时任务、清空提示动画层、关闭小结算、自己手牌位置与大小还原；也没有写「清空手牌后必须由后续恢复补回」的顺序约束，以及「保留其他玩家头像」这一例外。","impact":"重连回开局会出现上一局牌面残留、听牌按钮亮着、头像发光框错位等脏状态；若照抄清空后未约定补回顺序，会出现桌面全空。","suggestion":"补一张清场表并写明例外项（保留其他玩家头像）与顺序约束（清场在恢复之前执行，手牌由后续恢复补回）；同时写明开局动画仅在每场首局播放、重连不重播。\n\n**需要补的内容与必填格式**：\n新增小节「重连-开局/准备」，必含表：界面区域 | 重连时应处于的状态 | 例外保留项 | 后续由哪一恢复步骤补回\n\n**范例（需求必须按此格式写）**：\n正常示例：第5小局开局倒计时中断线重连，自摸牌区清空、四家河牌与副露清空、听牌按钮隐藏、剩余张数隐藏、自己头像庄标与加倍标记清除但其他三家头像保留在座，随后由恢复流程写入牌墙总数136，桌面不再显示上一局河牌（示例值以产品确认为准）。异常示例：第1小局重连时，需按4.1播放「对局开始」动画（仅首局播放）；第5小局重连不播放该动画（示例值以产品确认为准）。\n\n**验收口径**：\n重连开局后桌面上不存在上一局任何残留元素，且特征项（听牌按钮、剩余张数、庄标、发光框）状态可逐项核对；测试用例可由清场表逐行生成。","status":"待确认","has_detail":true},{"id":"PRD-047","title":"发牌阶段重连的手牌与副露恢复缺失","priority":"P1","type":"需求缺失","module":["断线重连"],"source_location":"4.4「发牌」发牌逻辑、发牌UI以及动画表现；3.3.2「玩法信息」剩余张数","original_text":"开局与发牌。本期初始显示136。首批起手牌背出现时一次更新为83，发牌翻牌和理牌期间保持83。","problem":"术语：静态显示＝直接展示最终结果（如骰子点数）而不播放过程动画。文档只定义了正常发牌从136刷新到83的表现，没有定义发牌阶段断线重连的恢复：局数据（庄家与方位盘）、骰子静态点数、牌墙与剩余张数、四家手牌与副露恢复并按财神靠左排序、副露来源箭头、重刷财神颜色；也没有定义该入口相比行牌入口缺少河牌、权限与倒计时属于已知限制。","impact":"发牌瞬间断线的玩家重连后可能看不到任何手牌或只看到部分手牌，余牌数与手牌数不一致，测试会按错误验收；开发也无从判断是否要恢复副露箭头。","suggestion":"新增「重连-发牌（旧协议）」小节，含恢复顺序与已知限制，并写明余牌数取服务端下发值而非按本机推导。\n\n**需要补的内容与必填格式**：\n新增小节含有序表：序号 | 恢复项 | 服务端字段 | 界面区域 | 已知限制；并附余牌数取值规则\n\n**范例（需求必须按此格式写）**：\n正常示例：发牌第三批批内断线重连，恢复后自己手牌13张（庄家14张）按万条筒风排序、白板财神染色，四家副露区箭头正确，骰子显示4点5点静态点数，余牌数显示83（示例值以产品确认为准）。异常示例：旧快照重连只恢复手牌，界面表现为河牌空白、无操作按钮、无倒计时，属已知限制，需在文档中显式声明而不作为缺陷（示例值以产品确认为准）。\n\n**验收口径**：\n发牌阶段断线重连后手牌张数、排序、财神染色、副露箭头、骰子点数、余牌数均可逐项核对；已知限制有独立声明，验收不误判。","status":"待确认","has_detail":true},{"id":"PRD-048","title":"结算阶段重连的分数与结算界面恢复缺失","priority":"P1","type":"需求缺失","module":["断线重连"],"source_location":"结算流程「流程明细」、结算界面「小结算界面（好友房）」→「触发逻辑」","original_text":"播完胡牌结算流程，进入结算界面","problem":"术语：公共结算流程＝正常对局中胡牌/流局后统一推动小结算的流程；重连到结算阶段不重放该流程，需靠另一套补数据逻辑。文档缺少结算阶段重连的恢复内容：用结算后的累计分覆盖头像累计分、遍历本家得失分只用于刷新头像（不写入桌面飘分）、恢复加倍状态并标记「加倍阶段已结束」（收起操作区、隐藏倒计时、桌面加倍标签延迟1秒清除）；更关键的是小结算触发条件被写成「播完胡牌结算流程」，重连玩家没有该播放过程，按现文档字面执行将永远不弹出小结算。","impact":"重连回结算时头像分数停留在旧值、无小结算界面，玩家无法在8局制中进入下一小局或离场，属阻塞验收的逻辑缺口。","suggestion":"新增「重连-结算」小节写明补数据项与该消息不负责打开结算界面；并把小结算触发条件改为「服务端结算结果已下发且本机处于结算阶段」，不依赖动画播放完成。\n\n**需要补的内容与必填格式**：\n新增小节「重连-结算」，必含表：恢复项 | 数据来源 | 界面区域 | 是否打开界面；并修订「触发逻辑」表增加「重连到结算阶段」一行\n\n**范例（需求必须按此格式写）**：\n正常示例：第3小局玩家B断线，期间他人自摸胡牌，B重连后头像累计分由10更新为-5、头像保留加倍标记、操作区无加倍按钮、中央倒计时隐藏，1秒后桌面加倍标签清除，小结算按结算结果正常弹出（示例值以产品确认为准）。异常示例：B断线跨过胡牌动画，重连后若按「播完胡牌结算流程」判定则小结算不弹出、界面停在结算前桌面，需按修订后的触发条件修复（示例值以产品确认为准）。\n\n**验收口径**：\n重连结算后头像累计分与本局结算一致、桌面无飘分数字、操作区收起、小结算必弹；测试可构造「断线跨过胡牌动画」用例直接验证。","status":"待确认","has_detail":true},{"id":"PRD-049","title":"重连「等待确认」自动回应未定义","priority":"P1","type":"需求缺失","module":["断线重连"],"source_location":"全文档（三.对局流程各节）；4.1「对局开始」触发逻辑","original_text":"缺失说明：需求文档全文没有「等待确认」或「服务端回执」概念，也未说明重连后遇到服务端同步点时应自动回应。","problem":"术语：等待确认＝服务端下发消息后要求客户端回执才会继续推进流程的同步点。规则基准要求所有重连入口在消息带等待确认时立即回应服务端，以避免卡在开局等待或流程不推进；需求文档完全没有这一机制及其重连处理，属于跨阶段统一规则缺失。","impact":"重连后对局可能长时间停留在等待状态（开局等待、发牌后等待），客户端与服务端互相等待，玩家看到界面无响应，且难以定位为协议问题。","suggestion":"在「断线重连」章节写一条统一规则：重连消息若携带等待确认，客户端保存其编号并在恢复完成后立即回执，且该回执不产生任何界面变化。\n\n**需要补的内容与必填格式**：\n新增统一条目，含要素：触发条件（消息携带等待确认）| 处理动作（记录编号并立即回执）| 界面影响（无）| 失败表现（停在该阶段等待）\n\n**范例（需求必须按此格式写）**：\n正常示例：玩家在准备倒计时中断线重连，重连消息携带等待确认编号1024，客户端恢复完成后立即回执，界面无变化，开局倒计时继续走（示例值以产品确认为准）。异常示例：客户端未回执时服务端停在等待，界面长期显示开局倒计时不动，需以「重连后10秒内流程未推进」为缺陷判定（示例值以产品确认为准）。\n\n**验收口径**：\n重连后流程在约定时间内自动推进，无人工干预；测试可通过「断线→重连→观察是否停在等待」直接验证。","status":"待确认","has_detail":true},{"id":"PRD-050","title":"庄标样式与位置两处描述不一致（本类主条目，PRD-122、PRD-061、PRD-064 同根因）","priority":"P1","type":"内容冲突","module":["牌桌区域"],"source_location":"「玩家头像信息」第2项庄家标签、「定庄／UI及动画」、三.对局流程-桌面布局-玩家头像信息（庄家标签） vs 三.对局流程-局内流程-定庄（UI及动画-三档样式）；另见 基础名词和概念解释-【牢庄】、3.3.3 玩家头像信息（庄家标签）；局内流程 > 定庄 > UI及动画 > 三档样式、三-3.3.3 玩家头像信息（庄家标签）；三-4.2 定庄（UI及动画－三档样式）","original_text":"头像信息：「庄家图标显示在头像右上方」「平庄：显示【庄】」「庄二：显示【庄×2】」「庄三：显示【庄×3】」；定庄UI：「三档样式。平庄（一牢）显示「庄×1」…庄标贴在头像左上侧。庄家在画面左侧时，庄标贴在头像右上侧」","problem":"同一庄标在两节给出不同内容：文案一处为【庄】、另一处为「庄×1」；位置一处写固定「头像右上方」，另一处写随庄家在画面左右而切换左上/右上。另外本期固定笃三老庄、每局都是三牢，是否仍需呈现平庄与庄二两档也没有说明。","impact":"客户端会按不同章节实现两套文案与两套贴附逻辑，换庄与左右视角下庄标位置/文案不统一，验收无唯一标准。","suggestion":"给出唯一「生效声明」：本期庄标文案统一为「庄×N」，位置规则统一为随出现在头像上沿外侧（画面右侧贴左上、画面左侧贴右上），并声明笃三老庄下是否仍保留三档样式。\n\n**需要补的内容与必填格式**：\n必填：生效声明 + 「庄标版本差异对照表」，列：字段｜头像信息表写法｜定庄UI写法｜本期生效写法\n\n**范例（需求必须按此格式写）**：\n正常：「本期固定笃三老庄，任何小局庄标均显示「庄×3」，贴头像上沿外侧；庄家在画面右侧时贴左上，在画面左侧时贴右上；由局数据/升庄广播驱动」。异常：「平庄显示【庄】与平庄显示「庄×1」并存，客户端按两套文案实现」。示例值以产品确认为准。\n\n**验收口径**：\n全文庄标文案唯一、位置规则唯一；测试可覆盖左右两种视角与换庄/连庄刷新，结果可逐帧比对。","status":"待确认","has_detail":true},{"id":"PRD-051","title":"对局人数口径冲突：固定四人 vs 支持2/3/4人未满开局（与 PRD-017 同根因，重复登记，建议合并）","priority":"P1","type":"内容冲突","module":["房间配置"],"source_location":"本期开发范围、游戏规则概述（对局人数）、玩法规则/【人数】、桌面布局/对局前","original_text":"「四人、8局、底分1…」；「支持2人、3人、4人三种对局人数，由创建房间时在创房面板中选择」；「创房人数可选2人、3人或4人。允许未满开局」；「本期须坐满4人且4人均为「已准备」」","problem":"适用玩法口径不唯一。本期开发范围固定四人，桌面布局要求坐满4人才能开局；【人数】却称支持2/3/4人且允许未满开局，座位、上下家、对家、牌河布局、结算人数分支都按多人数写了规则。文档同时声明创房面板不在本期范围，却把「创房面板选择」作为人数来源。","impact":"服务端座位与风位分配、上家/下家/对家判定、牌河布局、番型结算人数分支无法定型；测试无法判断三人局是否需验，也无法判断未满开局是否允许。","suggestion":"与 PRD-017 合并处理：在文档信息表「适用玩法」与本文章节内统一写死本期仅四人；2/3 人相关内容全部加【本期不适用·仅存档】；删除或标注「允许未满开局」不生效。\n\n**需要补的内容与必填格式**：\n文档信息表必填行「适用玩法」；另加「本期生效范围」表，必填列：玩法维度｜本期取值｜来源章节｜不适用内容处理方式\n\n**范例（需求必须按此格式写）**：\n正常示例：「适用玩法｜本期仅 4 人好友房；2 人、3 人内容标注【本期不适用·仅存档】，不参与开发与验收。示例值以产品确认为准。」；异常示例：「人数：本章同时声明固定 4 人（须坐满4人）与支持 2/3/4 人（允许未满开局），未标注哪条生效。」\n\n**验收口径**：\n全文检索「2人」「3人」「未满开局」，每处若在生效描述内须与四人一致，否则带【本期不适用·仅存档】；测试据「本期生效范围」表只出四人用例。","status":"待确认","has_detail":true},{"id":"PRD-052","title":"满8局后是结束本场还是进入大结算，两处冲突（本类主条目，PRD-020、PRD-060、PRD-014、PRD-062、PRD-067 同根因）","priority":"P1","type":"内容冲突","module":["结算与结束"],"source_location":"本期开发范围、默认规则/计分与结算、玩法规则/【局数】、结算界面/小结算界面、本期开发范围；默认规则-计分与结算；玩法规则＞【局数】；玩法规则＞【定庄】、「本期开发范围」、「默认规则」本期固定生效·计分与结算、「【局数】」、「局数」原文引用、默认规则·计分与结算、结算流程·流程明细、结算界面·小结算界面（好友房）、本期开发范围、2.3.2.1【局数】、【片】、2.3.2.3【定庄】、「本期开发范围」、「默认规则·计分与结算」、「玩法规则·【局数】」、「结算流程」","original_text":"「每小局进入小结算，满8局结束本场」；「达到所选局数时进入大结算」；「原文中的创房面板、其他玩法选项、大结算和非核心桌面功能…仅作原文上下文」","problem":"第 8 局结束后的走向自相矛盾：本期开发范围说「结束本场」，【局数】说「达到所选局数时进入大结算」，范围声明又说大结算不在本期。同时「结束本场」之后是否展示本场累计分、是否有统计或返回入口，全文未写。","impact":"第 8 局小结算后的跳转与按钮无法开发；「满8局」用例的期望结果无法确定，验收无法判定，易出现做到大结算而本期不要求、或直接断开无收尾界面的问题。","suggestion":"明确本期结束链：第 8 局小结算→展示本场累计分→返回房间/大厅，并将大结算整段标注【本期不适用·仅存档】；补一张结束判定表。\n\n**需要补的内容与必填格式**：\n结束判定表，必填列：触发条件｜展示内容｜玩家可操作｜是否本期实现｜对应章节\n\n**范例（需求必须按此格式写）**：\n正常示例：「第8局胡牌或流局｜播放小结算｜仅「返回房间」｜是｜结算界面」；「大结算｜总分排行与打片结算｜—｜否（【本期不适用·仅存档】）｜原方案结算流程」。异常示例：「第8局结束后进入大结算，但本期不做大结算——去向未定。」\n\n**验收口径**：\n用「满8局」「未满8局」两条用例即可判定：前者按表进入本期定义去向且不出现大结算界面，后者继续下一小局。","status":"待确认","has_detail":true},{"id":"PRD-053","title":"可选规则声明为无，正文仍以勾选规则为生效前提","priority":"P1","type":"内容冲突","module":["房间配置"],"source_location":"默认规则/本期可选规则、对局内通用提示/守庄、对局内通用提示/跟庄、对局内通用提示/有财必拷响、名词介绍/【财神】","original_text":"「本期可选规则：无。进入房间后直接使用以上固定配置。」；「前置条件：勾选守庄规则」「跟庄规则勾选」；「本方案支持以下2种财神确定方式」","problem":"本期固定配置只列了白板财神、笃三老庄、三摊承包、吃碰禁手等，未包含守庄、跟庄、只碰不吃、有财必拷响、翻财神；但正文仍按「勾选某规则」描述其生效表现，且未标【本期关闭】。读者无法判断守庄是否会屏蔽庄家上家的吃碰杠按钮、跟庄是否会额外播艺术字、翻财神是否生效。","impact":"实现方可能按通用提示表实现守庄/跟庄，造成与本期配置不符的对局与错误提示；测试无法判定这些提示应出现还是应隐藏。","suggestion":"增加规则开关生效表逐条标本期启用/关闭；关闭规则内容统一加【本期关闭】标记；通用提示表只保留本期生效行，其余移入附录。\n\n**需要补的内容与必填格式**：\n规则开关生效表，必填列：规则名｜本期状态（启用/关闭）｜生效条件｜关闭时的界面表现｜对应章节\n\n**范例（需求必须按此格式写）**：\n正常示例：「守庄｜关闭｜—｜不弹「守庄规则生效中」，吃碰杠按钮正常弹出｜原方案守庄章节」；「吃碰禁手｜启用｜全局固定｜吃碰后禁打牌压暗且不可提起｜行牌操作」。异常示例：「守庄｜启用｜勾选守庄规则｜不弹吃碰杠按钮｜未标注本期是否勾选。」\n\n**验收口径**：\n开关表覆盖全文出现的全部规则名；测试按「关闭」行只验该表现不出现，按「启用」行验出现，无第三态。","status":"待确认","has_detail":true},{"id":"PRD-054","title":"闲家起手牌张数两处矛盾（14张与13张）（本类主条目，PRD-131 同根因）","priority":"P1","type":"内容冲突","module":["开局"],"source_location":"三.对局流程 / 桌面布局 / 局中信息 / 手牌信息（庄家手牌、其他玩家手牌、闲家手牌三行）；三.对局流程 / 局内流程 / 发牌（发牌逻辑）、3.3.4 手牌信息（表）；发牌 > 发牌逻辑","original_text":"“闲家手牌|14张牌，从左至右，花色依次为万-条-筒~风……”（手牌信息）；同表另写“其他玩家手牌按13张摆放”；“发完庄家14张，三名闲家各13张，共发53张，牌墙余83张。”（发牌逻辑）","problem":"两版口径不一致，逐点差异：①手牌信息“闲家手牌”行写14张；②同一表格“其他玩家手牌按13张摆放”写13张；③发牌逻辑写“三名闲家各13张、庄家14张、共53张、余83张”。显然“闲家手牌”行沿用了庄家行内容，导致闲家起手张数出现互斥的两个值。","impact":"客户端按行实现手牌排布时，闲家会多画1张或与发牌数量校验冲突；首摸听牌（闲家13张）检测按13张还是14张不明确；测试无法确定闲家起手张数的验收值。","suggestion":"明确生效版本为“闲家13张”，修订手牌信息“闲家手牌”行为13张；并在两处表格加生效声明：“本方案各座位起手牌张数以『发牌逻辑』为准（庄家14张、闲家13张），手牌信息表仅描述排布样式。”附版本差异对照表。\n\n**需要补的内容与必填格式**：\n生效声明 + 版本差异对照表；对照表必填列：字段、位置A（手牌信息·闲家手牌行）、位置B（手牌信息·其他玩家手牌行）、位置C（发牌逻辑）、生效值\n\n**范例（需求必须按此格式写）**：\n正常：生效声明“闲家起手牌以13张为准，『闲家手牌』行仅描述排布样式”；对照表一行：起手牌数｜14张｜13张｜13张｜生效值13张（示例值以产品确认为准）。异常：若按14张实现，则闲家多出1张牌，与“共发53张、牌墙余83张”及闲家13张听牌检测同时冲突，判定为不通过（示例值以产品确认为准）。\n\n**验收口径**：\n全文闲家起手张数只剩13张一个值；发牌总数53张、余牌83张与手牌信息排布描述一致；测试可按“庄14/闲13”直接出用例并在UI核对总张数。","status":"待确认","has_detail":true},{"id":"PRD-055","title":"闲闲最多2摊是否拦截与“3摊不是上限”两处矛盾（本类主条目，PRD-097 同根因）","priority":"P1","type":"内容冲突","module":["特殊规则"],"source_location":"二、功能详情 > 玩法规则 >【三摊承包】表；基础名词和概念解释 > 名词介绍 >【承包】、「三摊承包」表、「基础名词·【摊】」、「【吃】」、「【碰】」、「【杠】」","original_text":"闲家与闲家之间最多2摊（无法触发承包）；…3摊是触发承包的门槛，不是吃碰次数上限。达到3摊后，满足对应操作条件时仍可继续吃碰","problem":"规则基准要求：闲闲之间吃/碰/明杠最多2摊，第3次直接拦截（操作不成立），且碰/明杠的限制仅在碰算摊开启时生效。需求文档一处写“最多2摊”，另一处写“3摊不是吃碰次数上限，达到3摊后仍可继续吃碰”，两处对闲闲第3次吃能否执行给出相反结论；也没有说明“最多2摊”是服务端拒绝操作，还是仅不触发承包。","impact":"客户端是否弹出第3次吃按钮、服务端是否拒绝该次吃，两个实现方向完全相反；还会影响“三摊落地”动画在闲闲之间是否可能触发。","suggestion":"补齐第3次拦截的三方约定：服务端拒绝、客户端置灰、是否提示；并明确该条与“3摊不是吃碰次数上限”的适用对象（前者仅限闲闲，后者仅指庄闲）。\n\n**需要补的内容与必填格式**：\n新增《摊数上限》表，必填列：关系（庄闲/闲闲）、操作类型（吃/碰/明杠）、上限摊数、第3次处理（拦截/允许但不承包）、受碰算摊开关影响\n\n**范例（需求必须按此格式写）**：\n正常：闲家C对闲家D吃到第2摊，允许执行且不形成承包；C再吃D的第3张时服务端拒绝并提示“闲闲最多2摊”（示例值以产品确认为准）。异常：庄家A对闲家B达到3摊后，A继续吃B的弃牌，允许执行，摊数继续累加（示例值以产品确认为准）。\n\n**验收口径**：\n给定关系类型与操作次数，能唯一得出“允许/拦截”和“是否形成承包”，测试可直接转化为服务端校验用例与按钮出现用例。","status":"待确认","has_detail":true},{"id":"PRD-056","title":"打出财神是否打断杠链，杠模块与杠飘释义相互矛盾（与 PRD-069 同根因，重复登记，建议合并）","priority":"P1","type":"内容冲突","module":["行牌循环"],"source_location":"基础操作及规则 > 【杠】（杠开行、杠飘行）、胡牌番型介绍 > 番型介绍（序号22 杠飘）","original_text":"“杠后补牌未胡而打出任何一张牌（包括财神），则此前的杠不能再用于判定杠开”；“完成杠后补牌…若未胡牌而紧接着打出1张财神，该打财行为按‘飘财’处理”；“｜22｜｜杠飘｜8倍｜杠开后财飘｜”。","problem":"规则基准规定杠链只被“非财神出牌/吃/碰”打断，打出财神（飘财）不打断杠链；因此“杠→补牌未胡→打出财神→下巡摸牌自摸爆头”同时命中杠上开花与财飘，按§8.9.3替换为杠飘。文档却在杠模块规定打出任何牌（含财神）都使先前杠不能再判杠开，同文档番型表又把杠飘释义写成“杠开后财飘”，两处对同一行为给出相反结论。","impact":"实现方无法确定该场景最终番数是4（仅财飘）还是8（杠飘）；同一行为在杠模块与番型表分别判“不成立”与“成立”，会导致服务端与客户端展示不一致，验收无唯一口径。","suggestion":"与 PRD-069 合并处理：补“生效声明”，统一杠链打断条件为“非财神出牌/吃/碰”，并明确杠飘=杠上开花×财飘的组合关系与判定时点；若坚持“打财神即断链”，须同步改写杠飘释义与番型表倍数。\n\n**需要补的内容与必填格式**：\n杠开与杠飘章节必填：杠链定义与计数口径｜打断条件枚举（含财神出牌是否打断）｜判定时点｜组合替换规则｜版本差异对照表（杠模块版本、番型表版本、生效版本）。\n\n**范例（需求必须按此格式写）**：\n正常：暗杠→补牌未胡→打出财神→下巡摸牌自摸爆头，杠链=1且飘等级=1，命中杠飘8倍（示例值以产品确认为准）。异常：暗杠→补牌未胡→打出非财神牌→下巡自摸爆头，杠链被打断，杠上开花不成立，仅按财神系列档位计倍（示例值以产品确认为准）。\n\n**验收口径**：\n“打财神后自摸爆头”与“打非财神后自摸爆头”两个用例的番型结论不同且与文档一致；杠模块与番型表不再出现相反的判定表述。","status":"待确认","has_detail":true},{"id":"PRD-057","title":"小结算页同一条目既要求又禁止展示牢庄","priority":"P1","type":"内容冲突","module":["结算与结束"],"source_location":"结算界面＞小结算界面（好友房）＞UI交互以及说明 编号1、编号6","original_text":"编号1：玩家头像／庄家标识以及牢庄标识／房主标识…；编号6：展示本局胡牌番型~~和倍数~~…牢庄不需要展示。","problem":"编号1把“牢庄标识”列为玩家信息必显，编号6又写“牢庄不需要展示”，同页两条互斥。基准要求结算页展示本局结算时的牢庄档位与倍数，并明确下一局牢庄在结算后更新；文档既冲突又缺少“显示的是哪一局的档位”的口径。","impact":"客户端无法确定是否渲染牢庄标识与倍数，玩家看不到2倍还是8倍，无法自行核对赔付；验收时截图口径不一致。","suggestion":"统一为“必须展示本局结算时的牢庄档位与倍数（如庄×3、8倍）”，删除“牢庄不需要展示”，并补“下一局档位在结算后刷新，结算页不提前变为新庄”。\n\n**需要补的内容与必填格式**：\n小结算界面条目表统一列“庄家／牢庄标识（含档位与倍数）”，并在展示规则中加一条“牢庄取本局结算时档位”。\n\n**范例（需求必须按此格式写）**：\n正常：三牢庄胡牌，结算页该玩家头像旁显示“庄×3 8倍”。异常：下一局换庄后，新庄在开局掷骰时才显示庄标，上一局结算页仍显示旧庄的“庄×3”。示例值以产品确认为准。\n\n**验收口径**：\n页面条目表内不再出现互斥表述；截图可逐项核对“庄×N＋倍数”等于当局档位；换庄局结算页仍显示旧庄档位。","status":"待确认","has_detail":true},{"id":"PRD-058","title":"三摊落地提示按「吃碰次数三次」触发，与本期碰不算摊的摊口径冲突（本类主条目，PRD-063 同根因）","priority":"P1","type":"内容冲突","module":["特殊规则"],"source_location":"默认规则（承包与行牌）、二.功能详情-基础名词和概念解释-名词介绍【摊】、玩法规则-【三摊承包】、三.对局流程-对局内通用提示（三摊落地）、三-4.6 对局内通用提示（三摊落地行）；一 默认规则（承包与行牌）；二-2.2 名词介绍【摊】；二-2.3.2.8 三摊承包","original_text":"默认规则：「启用三摊承包和吃碰禁手，碰算摊关闭」。三摊落地：「触发场景：玩家A对玩家B的吃碰次数达到三次」「客户端展示“三摊落地”的艺术字动画」。","problem":"提示触发条件写作「吃碰次数达到三次」，把碰计入且未包含明杠；而本期实际配置为「碰算摊关闭」，摊的定义写明吃、碰、明杠是否计摊由配置决定。结果是碰三次可能播放三摊落地但承包并未成立，明杠凑满 3 摊又不播放，提示与服务端承包判定口径不一致；同时把「次数」与「3摊」当同义词使用。","impact":"客户端提示与真实承包关系脱节，玩家会误判承包已生效并要求按承包结算；测试无法判定提示应在何时出现；结算争议无法用文档裁决。","suggestion":"改为由服务端摊数事件驱动触发，写清：计摊动作范围（本期吃与明杠计摊、碰不计）、触发阈值（A对B摊数由 2 变 3 时播一次）、飘财一圈内顺延到第 4 摊的例外、重复触发抑制。\n\n**需要补的内容与必填格式**：\n通用提示表增加列：提示项｜服务端事件名｜判定字段与取值｜触发阈值｜重复触发抑制｜客户端表现\n\n**范例（需求必须按此格式写）**：\n正常：玩家A对B通过吃牌与明杠累计摊数由 1 变为 3（碰不计摊），服务端下发 sanTan.land {fromSeat:0, toSeat:1, total:3}，客户端仅在 0→3 这一次播放「三摊落地」艺术字（示例值以产品确认为准）。\n异常：A对B在飘财一圈内由 2 摊变为 3 摊，不播放「三摊落地」，待变为第 4 摊时才播放一次（示例值以产品确认为准）。\n\n**验收口径**：\n提示触发条件与摊定义、本期配置完全一致，且注明飘财例外；测试可用「碰三次不触发」「吃两次加明杠一次触发」「飘财一圈顺延第4摊」三条用例验证。","status":"待确认","has_detail":true},{"id":"PRD-059","title":"本期固定4人与2/3人实现描述冲突（与 PRD-017 同根因，重复登记，建议合并）","priority":"P1","type":"内容冲突","module":["房间配置"],"source_location":"「本期开发范围」、「默认规则」本期固定生效·人数与局数、「二、功能详情／游戏规则概述」对局人数、「【人数】」、「牌河信息」牌河摆放、「对局开始」显示","original_text":"「默认规则」：固定四人、8局。坐满4人且全部已准备后由房主开始游戏。／「游戏规则概述」对局人数：支持2人、3人、4人三种对局人数，由创建房间时在创房面板中选择。／「对局开始」：按开局时的实际参战人数显示2、3或4个玩家信息区。","problem":"版本范围声明本期固定四人，但功能详情与局内流程把 2 人、3 人当作现行规则来实现（对局人数可选、牌河给出 2／3 人排布、对局开始按实际参战人数显示、上家下家对家定义分人数），两处口径互相矛盾。","impact":"开发无法判断是否需要实现 2／3 人分支；若实现则工作量与测试矩阵翻倍，若不实现则正文大量描述失效；测试也无法确定人数维度用例范围。","suggestion":"与 PRD-017 合并处理：给出生效声明：本期仅实现 4 人，2／3 人相关描述标注为“原文上下文，本期不实现”；或修改本期范围为支持 2／3／4 人并同步调整默认规则与人数校验。\n\n**需要补的内容与必填格式**：\n在文档开头新增「生效声明」段落，并增加版本差异对照表，必填列为：事项 | 本文口径（本期） | 原文／后续版本口径 | 处理方式。\n\n**范例（需求必须按此格式写）**：\n正常示例：生效声明｜本期仅支持 4 人局；2 人、3 人相关的对局人数选项、牌河排布、座位关系描述属原文上下文，本期不实现、不验收。\n异常示例：版本差异对照表｜人数｜本文口径 固定4人｜原文口径 可选2／3／4人｜处理方式 本期不实现2／3人分支，保留描述供后续版本参考。（示例值以产品确认为准）\n\n**验收口径**：\n文档中存在唯一生效声明；版本差异对照表覆盖人数等冲突项；测试可据此只出 4 人用例，开发不再实现 2／3 人分支，且正文不再出现与声明相反的实施要求。","status":"待确认","has_detail":true},{"id":"PRD-060","title":"满8局结束本场去向未定义且与大结算矛盾（与 PRD-052 同根因，重复登记，建议合并）","priority":"P1","type":"内容冲突","module":["结算与结束"],"source_location":"「本期开发范围」、「默认规则」本期固定生效·计分与结算、「【局数】」、「局数」原文引用","original_text":"「本期开发范围」：每小局保留小结算，未满8局则继续下一小局，满8局结束本场。／「本期开发范围」：原文中的创房面板、其他玩法选项、大结算和非核心桌面功能……仅作原文上下文。／「【局数】」：达到所选局数时进入大结算。","problem":"本期范围明确排除大结算，但局数规则又要求达到局数进入大结算，而本期固定 8 局必然触发该条件。“满8局结束本场”没有说明结束后的界面与数据处理（是否回到房间等待、是否展示总分、是否可再开一场），两处描述互相排斥。","impact":"第 8 局结算后客户端无明确落点，开发无法实现流程终点；测试无法判定“本场结束”是否合格，容易在最后一局出现卡死或状态残留。","suggestion":"与 PRD-052 合并处理：明确本期 8 局结束后的唯一处理：例如直接返回房间准备态并展示本场累计分，不实现大结算面板；或把大结算纳入本期范围并补充其验收场景。\n\n**需要补的内容与必填格式**：\n在「本期开发范围」增加“本场结束处理”小节，必填字段为：触发条件 | 界面落点 | 数据展示 | 可否再开局 | 是否实现大结算；并在版本差异对照表登记与原文的差异。\n\n**范例（需求必须按此格式写）**：\n正常示例：触发条件 第8小局小结算播完｜界面落点 返回房间等待态并保留座位｜数据展示 玩家信息区显示本场累计分｜可否再开局 房主可再次点击开始游戏｜是否实现大结算 本期不实现。（示例值以产品确认为准）\n异常示例：触发条件 第8小局因解散房间中断｜界面落点 直接返回大厅｜数据展示 不展示结算｜可否再开局 否｜是否实现大结算 否。（示例值以产品确认为准）\n\n**验收口径**：\n第 8 局结束后的界面、数据与再开局行为唯一且可观测；测试可据此编写“打满8局”与“第8局解散”两条用例并判定通过。","status":"待确认","has_detail":true},{"id":"PRD-061","title":"平庄庄标两种写法互相矛盾（与 PRD-050 同根因，重复登记，建议合并）","priority":"P1","type":"内容冲突","module":["牌桌区域"],"source_location":"3.3.3 玩家头像信息（庄家标签）；局内流程 > 定庄 > UI及动画 > 三档样式","original_text":"平庄：显示【庄】…庄二：显示【庄×2】…庄三：显示【庄×3】；平庄（一牢）显示「庄×1」，庄二（二牢）显示「庄×2」，庄三（三牢）显示「庄×3」","problem":"同一份文档的两处对平庄样式给出不同结果（【庄】与「庄×1」）。同时本期固定笃三老庄、每局恒为三牢，文档仍要求三档样式，开发无法确定平庄是否显示数字、本期是否只应出现庄×3。","impact":"庄标资源与显示逻辑无法定稿，测试对平庄与庄三的期望不一致，验收标准冲突。","suggestion":"与 PRD-050 合并处理：出具生效声明：本期固定笃三老庄，庄标恒显示「庄×3」；若保留三档样式，统一平庄为「庄×1」并删除【庄】写法；同时注明档位取值来自服务端连庄数。\n\n**需要补的内容与必填格式**：\n统一为一张庄标对照表：牢数｜档位名｜显示文案｜资源｜本期是否出现\n\n**范例（需求必须按此格式写）**：\n版本差异对照：玩家头像信息表写「平庄显示【庄】」；定庄小节写「平庄（一牢）显示『庄×1』」。生效声明：「以定庄小节为准，平庄统一显示『庄×1』，【庄】写法作废；本期笃三老庄恒显示『庄×3』」（示例值以产品确认为准）。\n\n**验收口径**：\n全文档只保留一处庄标文案定义；按牢数1/2/3各出一张截图，与对照表完全一致。","status":"待确认","has_detail":true},{"id":"PRD-062","title":"「大结算」既声明不做又被规则要求进入（与 PRD-052 同根因，重复登记，建议合并）","priority":"P1","type":"内容冲突","module":["结算与结束"],"source_location":"本期开发范围、2.3.2.1【局数】、【片】、2.3.2.3【定庄】","original_text":"本期范围：「原文中的创房面板、其他玩法选项、大结算和非核心桌面功能，如在核心段落中被引用，仅作原文上下文」；【局数】：「达到所选局数时进入大结算」；【片】：「剩余片数小于或等于0片时，进入大结算」。","problem":"文档一处把「大结算」排除在本期交付之外，另两处（局数、片数）仍把它写成必须进入的流程终点，且全文未定义「大结算」与规则基准中的「总战绩」是否同一界面。开发按范围声明做会停在满8局，按规则表做又与交付边界冲突。","impact":"满8局后的流程去向无法确定，前端路由与资源投放决策无法落地，验收时双方可各按一处条文主张，属于直接阻塞项。","suggestion":"与 PRD-052 合并处理：在「本期开发范围」加一条生效声明，明确本期是否包含大结算（即总战绩），并统一术语；若不包含，把【局数】【片】中的「进入大结算」改为本期实际去向。\n\n**需要补的内容与必填格式**：\n在本期开发范围新增一行「生效声明：本期包含/不包含大结算（总战绩）」，并补「版本差异对照表」（列：出处章节｜原文表述｜本期生效表述｜差异说明）。\n\n**范例（需求必须按此格式写）**：\n正常：「生效声明：本期包含总战绩（即原方案所称大结算），满8局或片数≤0时进入；战绩分享、战绩详情页等附属功能不在本期。」异常：「生效声明：本期不包含大结算/总战绩，满8局后直接返回房间等待界面；【局数】中『进入大结算』一句本期不生效。」（示例表述以产品确认为准）\n\n**验收口径**：\n全文对满8局后去向的表述唯一且术语一致，检索「大结算」不再出现未定义去向；测试可据声明判定满8局后的界面。","status":"待确认","has_detail":true},{"id":"PRD-063","title":"三摊落地以「吃碰次数」触发，与本期「碰算摊关闭」矛盾（与 PRD-058 同根因，重复登记，建议合并）","priority":"P1","type":"内容冲突","module":["特殊规则"],"source_location":"三-4.6 对局内通用提示（三摊落地行）；一 默认规则（承包与行牌）；二-2.2 名词介绍【摊】；二-2.3.2.8 三摊承包","original_text":"三摊落地：触发场景：玩家A对玩家B的吃碰次数达到三次；另一处写：启用三摊承包和吃碰禁手，碰算摊关闭；名词【摊】写：完成1次吃、碰或明杠，按本局创房配置计入A从B取得的摊数。","problem":"同一触发条件在文档里出现两种口径。三摊落地行用「吃碰次数」，名词【摊】用「按创房配置计入的摊数」，而本期默认规则写明「碰算摊关闭」，即碰不产生摊；明杠是否计摊在默认规则中完全没有交代。按落地行实现，则A碰B三次就会播三摊落地，但按承包口径摊数为0，不满足3摊。摊是吃碰次数之外还要按配置折算的计数，两者不能混用。","impact":"开发若按「吃碰次数」实现，碰算摊关闭直接失效，落地动画与承包、倒承包判定不一致；测试无法给出唯一预期，验收会分歧。","suggestion":"与 PRD-058 合并处理：统一改为「玩家A对玩家B累计摊数达到3摊」，并在默认规则补写本期摊口径（吃计摊、碰不计摊、明杠计摊），落地动画与承包共用同一份摊数据；补一条碰三次不触发、吃三次触发的对照示例。\n\n**需要补的内容与必填格式**：\n版本差异对照表，列：条款／原文位置／当前口径／判定示例／统一后的生效口径\n\n**范例（需求必须按此格式写）**：\n正常：A连续三次吃B打出的牌（吃计摊、碰算摊关闭）→ A对B累计3摊 → 播放「三摊落地」（示例值以产品确认为准）。异常：A连续三次碰B打出的牌（碰不计摊）→ A对B摊数为0 → 不播放「三摊落地」，也不满足承包条件（示例值以产品确认为准）。\n\n**验收口径**：\n文档中所有涉及三摊的判定只保留一个口径（摊数）；测试可用「碰三次不播、吃三次播、吃两次加明杠一次播」等用例直接验证，结果唯一。","status":"待确认","has_detail":true},{"id":"PRD-064","title":"平庄庄标两处文案不一致：一处【庄】，一处「庄×1」（与 PRD-050 同根因，重复登记，建议合并）","priority":"P1","type":"内容冲突","module":["牌桌区域"],"source_location":"三-3.3.3 玩家头像信息（庄家标签）；三-4.2 定庄（UI及动画－三档样式）","original_text":"玩家头像信息写：平庄：显示【庄】／庄二：显示【庄×2】／庄三：显示【庄×3】；定庄UI写：平庄（一牢）显示「庄×1」，庄二（二牢）显示「庄×2」，庄三（三牢）显示「庄×3」。角标数字表示当前牢数。","problem":"同一档位在两张表里写法不同：玩家头像信息要求平庄只显示【庄】（无角标），定庄页要求平庄显示「庄×1」。另外本期默认规则固定笃三老庄、文档写明每局均按三牢结算，庄标恒为「庄×3」，但两处仍要求实现三档样式，开发无法确定本期是否要做平庄、庄二两个档位，以及平庄是否带×1角标。","impact":"图标资源与文案实现冲突，客户端与UI验收口径不一致；若本期只出现「庄×3」，多做的两档会浪费，若按错误文案实现则后续开放平庄时需返工。","suggestion":"与 PRD-050 合并处理：统一平庄写法（建议「庄×1」，与「角标数字表示当前牢数」一致），并在范围章节声明本期笃三老庄下只显示「庄×3」，平庄、庄二为后续版本；补一张档位与文案对照表。\n\n**需要补的内容与必填格式**：\n版本差异对照表，列：条款／玩家头像信息写法／定庄UI写法／本期是否实现／统一后的生效文案\n\n**范例（需求必须按此格式写）**：\n正常：本期固定笃三老庄，每局牢数为3 → 庄家头像显示「庄×3」（示例值以产品确认为准）。异常：若后续开放平庄起，某局牢数为1 → 全端统一显示「庄×1」，不得再出现仅有【庄】而无角标的写法（示例值以产品确认为准）。\n\n**验收口径**：\n两处章节对同一档位的文案完全一致，并明确本期实现范围；测试对每局庄标做断言（本期恒为「庄×3」），不再存在两种可选项。","status":"待确认","has_detail":true},{"id":"PRD-065","title":"行牌操作原版表与修改对比版表同时存在且行为相反（与 PRD-018 同根因，重复登记，建议合并）","priority":"P1","type":"内容冲突","module":["行牌循环"],"source_location":"「行牌操作」原表（摸牌、出牌行）、「行牌操作｜修改对比版」表（摸牌、提牌、出牌行）","original_text":"原版：出牌共有双击出牌、单击出牌、滑动出牌三种…单击出牌：出牌阶段点击打出不可听牌的牌，则直接将其打出；修改版：单击出牌归设置模块，本方案不包含该模式。原版：摸牌需在上一家打出牌的同时摸牌；修改版：上一张弃牌完成响应裁决且对局可以继续摸牌时…取1张。原版：其他家打出的牌始终是摸到的那张牌；修改版：从出牌者手牌尾端的独立牌背位飞出实际弃牌的牌面","problem":"同一章并列两张完整表格，未声明哪张生效，且三处关键行为相反：①单击出牌是否存在；②下家摸牌是在上家出牌瞬间还是响应裁决之后；③其他玩家看到的是「摸到的那张牌」还是「实际打出的牌」。这三点分别决定输入方式、客户端表现时序和出牌信息是否对其他玩家可见，属于实现级冲突。","impact":"客户端会出现两套互斥实现；联调时出牌/摸牌时序对不上，回放与观战表现不一致；测试无法判定「上家出牌后下家是否已摸牌」这一基础时序。","suggestion":"与 PRD-018 合并处理：指定一张为生效版本（建议修改对比版），在章首加生效声明；把原版改为「旧版对照」并逐条标注差异；对第③点单独说明是显示层伪装还是服务端广播差异。\n\n**需要补的内容与必填格式**：\n章首生效声明 + 「版本差异对照表」，必填列：差异点｜原版描述｜修改对比版描述｜本期生效｜实现位置\n\n**范例（需求必须按此格式写）**：\n正常写法：生效声明：行牌操作以「修改对比版」为准，原表仅作视觉对照。对照表行：单击出牌｜支持，可在设置中开启｜不包含该模式｜不实现｜—。异常写法：两张表并列、无任何生效标注，读者按最近一张表实现。\n\n**验收口径**：\n三处差异都能在对照表中查到唯一结论；测试可按生效版本出「摸牌时序」「他人可见牌面」「可用的出牌手势」三条用例且结果唯一。","status":"待确认","has_detail":true},{"id":"PRD-066","title":"倒承包示例漏乘庄家牢数番，与算分规则口径冲突","priority":"P1",
