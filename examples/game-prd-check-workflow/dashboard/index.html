<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRD 质量分析报告</title>
<style>
  :root {
    --bg: #F6F8FB;
    --card: #FFFFFF;
    --primary: #3478DB;
    --p0: #DC5148;
    --p1: #E8A044;
    --p2: #4389D5;
    --p3: #94A3B8;
    --text: #253247;
    --muted: #8491A3;
    --border: #E7ECF2;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .page { max-width: 1440px; margin: 0 auto; padding: 24px 32px 48px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }
  .section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .section-title .sub { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 8px; }

  /* 01 头部 */
  .header { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header .project { font-size: 15px; color: var(--muted); margin-top: 4px; }
  .header .meta { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .header .meta span { margin-right: 20px; }
  .badge { display: inline-block; padding: 5px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .badge.blocked { background: #FDECEA; color: var(--p0); }
  .badge.allowed { background: #E8F5EC; color: #2F9E5B; }
  .badge.na { background: #EEF1F5; color: var(--muted); }

  /* 02 KPI */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
  .kpi {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px 24px; cursor: pointer; transition: box-shadow .15s, transform .15s;
  }
  .kpi:hover { box-shadow: 0 4px 14px rgba(52,120,219,.12); transform: translateY(-1px); }
  .kpi .num { font-size: 34px; font-weight: 700; line-height: 1.2; }
  .kpi .label { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .kpi .num.c-p0 { color: var(--p0); } .kpi .num.c-p1 { color: var(--p1); }
  .kpi .num.c-p23 { color: var(--text); }

  /* 03 结论 */
  .conclusion .verdict { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
  .conclusion .verdict.blocked { color: var(--p0); }
  .conclusion .verdict.allowed { color: #2F9E5B; }
  .conclusion .reasons { margin-top: 10px; padding-left: 20px; color: var(--text); }
  .conclusion .reasons li { margin: 3px 0; }

  /* 04 风险 */
  .risk-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .risk-group h3 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .risk-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .risk-item:hover { border-color: var(--primary); background: #F7FAFE; }
  .risk-item .pri { flex: none; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 4px; color: #fff; margin-top: 2px; }
  .risk-item .body { flex: 1; min-width: 0; }
  .risk-item .name { font-weight: 600; font-size: 13px; }
  .risk-item .name .id { color: var(--muted); font-weight: 400; margin-left: 6px; white-space: nowrap; }
  .risk-item .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* 05 分布图表 */
  .charts { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 24px; }
  .chart h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 12px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; padding: 3px 4px; border-radius: 6px; }
  .bar-row:hover, .bar-row.active { background: #F0F6FD; }
  .bar-row .bl { flex: none; width: 34px; font-weight: 600; font-size: 13px; }
  .bar-row .track { flex: 1; display: block; height: 18px; background: #F0F3F7; border-radius: 4px; overflow: hidden; }
  .bar-row .fill { display: block; height: 100%; border-radius: 4px; min-width: 6px; }
  .bar-row .val { flex: none; width: 96px; font-size: 12px; color: var(--muted); text-align: right; }
  .donut-wrap { display: flex; align-items: center; gap: 18px; }
  .donut { flex: none; position: relative; width: 160px; height: 160px; }
  .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut .center b { font-size: 26px; }
  .donut .center span { font-size: 11px; color: var(--muted); }
  .legend { flex: 1; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .legend-item:hover, .legend-item.active { background: #F0F6FD; }
  .legend-item .dot { flex: none; width: 10px; height: 10px; border-radius: 3px; }
  .legend-item .t { flex: 1; }
  .legend-item .v { color: var(--muted); }

  /* 06 TOP5 */
  .top-list .rank {
    display: flex; align-items: center; gap: 12px; padding: 11px 12px;
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .top-list .rank:hover { border-color: var(--primary); background: #F7FAFE; }
  .top-list .no { flex: none; width: 22px; height: 22px; border-radius: 50%; background: #EEF1F5; color: var(--muted); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .top-list .title { flex: 1; font-weight: 600; font-size: 13px; }
  .top-list .title .id { color: var(--muted); font-weight: 400; margin-right: 8px; }
  .top-list .tag { flex: none; font-size: 11px; color: var(--muted); }
  .top-list .tag .rf { margin-left: 8px; }

  /* 07 问题清单 */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .toolbar select, .toolbar input {
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
    font-size: 13px; background: #fff; color: var(--text); outline: none;
  }
  .toolbar input { width: 220px; }
  .toolbar select:focus, .toolbar input:focus { border-color: var(--primary); }
  .toolbar .count { font-size: 12px; color: var(--muted); }
  .toolbar .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border); background: #fff; color: var(--text);
    border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: #2B66C4; }
  table.issues { width: 100%; border-collapse: collapse; }
  table.issues th {
    text-align: left; font-size: 12px; color: var(--muted); font-weight: 600;
    padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.issues td { padding: 10px; border-bottom: 1px solid #F0F3F7; vertical-align: top; }
  table.issues tbody tr { cursor: pointer; }
  table.issues tbody tr:hover { background: #F7FAFE; }
  td.id, .pri-tag { font-family: "SF Mono", Consolas, monospace; }
  td.id { color: var(--muted); font-size: 12px; white-space: nowrap; }
  td.title { font-weight: 600; max-width: 460px; }
  td.loc { color: var(--muted); font-size: 12px; max-width: 220px; }
  .pri-tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 4px; color: #fff; }
  .type-tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 4px; background: #EEF1F5; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }

  /* 08 综合分析 */
  .analysis ul { padding-left: 20px; }
  .analysis li { margin: 6px 0; }

  /* 抽屉 */
  .mask { position: fixed; inset: 0; background: rgba(20,30,45,.4); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
  .mask.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: -520px; width: 520px; max-width: 100vw; height: 100vh;
    background: #fff; z-index: 50; box-shadow: -8px 0 30px rgba(20,30,45,.15);
    transition: right .25s ease; display: flex; flex-direction: column;
  }
  .drawer.show { right: 0; }
  .drawer-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .drawer-head .id { font-family: monospace; color: var(--muted); font-size: 13px; }
  .drawer-head .title { font-weight: 700; font-size: 15px; flex: 1; }
  .drawer-head .close { border: none; background: none; font-size: 20px; color: var(--muted); cursor: pointer; padding: 4px; }
  .drawer-nav { display: flex; align-items: center; gap: 8px; padding: 8px 20px; border-bottom: 1px solid var(--border); }
  .drawer-nav .pos { font-size: 12px; color: var(--muted); flex: 1; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
  .drawer-body h4 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 18px 0 6px; }
  .drawer-body h4:first-child { margin-top: 0; }
  .drawer-body blockquote {
    border-left: 3px solid var(--border); background: #F8FAFC;
    padding: 10px 14px; border-radius: 0 8px 8px 0; white-space: pre-wrap; font-size: 13px; color: #47586E;
  }
  .drawer-body p { font-size: 13px; }
  .drawer-body .status { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--muted); }
  .drawer-body .kv { margin-bottom: 10px; }

  /* 浮动操作 */
  .fab { position: fixed; right: 28px; bottom: 28px; display: flex; flex-direction: column; gap: 10px; z-index: 30; }
  .fab .btn { box-shadow: 0 4px 14px rgba(20,30,45,.12); }

  /* 响应式 */
  @media (max-width: 1180px) {
    .charts { grid-template-columns: 1fr; }
    .risk-cols { grid-template-columns: 1fr; }
  }
  @media (max-width: 1024px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .page { padding: 16px 20px 40px; }
  }
  @media (max-width: 768px) {
    .kpis { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card { padding: 16px; }
    .toolbar input { width: 100%; }
    .toolbar { gap: 8px; }
    /* 表格转卡片 */
    table.issues, table.issues tbody, table.issues tr, table.issues td { display: block; width: 100%; }
    table.issues thead { display: none; }
    table.issues tbody tr { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; padding: 10px; }
    table.issues tbody td { border: none; padding: 2px 0; }
    td.id { display: inline-block; }
    /* 抽屉全屏 */
    .drawer { width: 100vw; right: -100vw; }
    .fab { right: 16px; bottom: 16px; }
  }

  /* 打印 */
  @media print {
    body { background: #fff; }
    .page { max-width: none; padding: 0; }
    .card { border: none; box-shadow: none; break-inside: avoid; padding: 12px 0; margin-bottom: 12px; }
    .toolbar, .fab, .mask, .drawer, .kpi .label-tip { display: none !important; }
    .kpi { border: 1px solid #ddd; }
    .kpi:hover { transform: none; box-shadow: none; }
    .top-list .rank, .risk-item, table.issues tbody tr { break-inside: avoid; cursor: default; }
    table.issues tbody tr:hover { background: none; }
    a { text-decoration: none; color: inherit; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- 01 报告头部 -->
  <header class="card header" id="sec-header"></header>

  <!-- 02 质量指标 -->
  <section class="kpis" id="sec-kpis"></section>

  <!-- 03 检查结论 -->
  <section class="card conclusion" id="sec-conclusion"></section>

  <!-- 04 风险分析 -->
  <section class="card" id="sec-risks"></section>

  <!-- 05 问题分布 -->
  <section class="card charts" id="sec-charts"></section>

  <!-- 06 重点问题 TOP5 -->
  <section class="card" id="sec-top"></section>

  <!-- 07 完整问题清单 -->
  <section class="card" id="sec-list">
    <div class="section-title">完整问题清单<span class="sub" id="list-count"></span></div>
    <div class="toolbar" id="toolbar">
      <select id="f-priority">
        <option value="">全部优先级</option>
        <option value="P0">P0</option><option value="P1">P1</option>
        <option value="P2">P2</option><option value="P3">P3</option>
      </select>
      <select id="f-type"><option value="">全部类型</option></select>
      <select id="f-module"><option value="">全部模块</option></select>
      <input id="f-q" type="search" placeholder="搜索 ID / 问题 / 位置">
      <button class="btn" id="btn-clear">清除筛选</button>
      <span class="spacer"></span>
      <span class="count" id="f-count"></span>
    </div>
    <div style="overflow-x:auto">
      <table class="issues">
        <thead><tr><th>ID</th><th>问题标题</th><th>优先级</th><th>类型</th><th>原文位置</th></tr></thead>
        <tbody id="issue-tbody"></tbody>
      </table>
      <div class="empty" id="issue-empty" style="display:none">没有符合筛选条件的问题</div>
    </div>
  </section>

  <!-- 08 综合分析 -->
  <section class="card analysis" id="sec-analysis"></section>

</div>

<!-- 详情抽屉 -->
<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <span class="pri-tag" id="d-pri"></span>
    <span class="id" id="d-id"></span>
    <div class="title" id="d-title"></div>
    <button class="close" id="d-close" title="关闭">x</button>
  </div>
  <div class="drawer-nav">
    <button class="btn" id="d-prev">上一条</button>
    <button class="btn" id="d-next">下一条</button>
    <span class="pos" id="d-pos"></span>
  </div>
  <div class="drawer-body" id="d-body"></div>
</aside>

<!-- 浮动操作 -->
<div class="fab">
  <button class="btn" id="btn-top" title="返回顶部">返回顶部</button>
  <button class="btn primary" id="btn-print" title="打印 / 导出 PDF">打印 / PDF</button>

局内多次杠后经过吃、碰或出牌是否降档；测试无判定依据，倍率极易算错。","suggestion":"新增“杠链”判定口径小节：定义杠链计数归属（每次杠+1，暗杠记录含暗杠标记）、清零触发（打出非财神、打出财神且不敲响、吃、碰）、保留条件（打出财神且敲响）、以及杠链值到二连杠/三连杠/四连杠与杠开系列番型的判定映射表。","status":"待确认","has_detail":true},{"id":"PRD-002","title":"十风胡牌资格与番型完全缺失","priority":"P0","type":"需求缺失","module":["胡牌判定口径缺陷"],"source_location":"2.3.1 胡牌番型介绍·番型介绍（序号1~50）、2.2 名词介绍【向听数】【自摸】、三.对局流程·行牌操作","original_text":"「番型分类：【基础番型】满足胡牌规则的最基础的胡牌番型；【财神番型】带财神的番型；【杠开番型】开杠后的番型；【七对番型】七对子相关番型；【组合番型】可进行叠加的特殊番型」；「1｜基础番型｜平胡｜1倍｜4副顺子+1副对子」。全文未出现「十风」及其计数、授权与番型条目。","problem":"规则基准定义十风资格（连续≥10张字牌且自摸）直接授予胡权限、不要求手牌成牌，且十风授权先于有财必拷响；吃、碰、杠均中断十风资格。需求文档既无十风计数与失效规则，也无十风胡权判定与番型条目。","impact":"十风自摸（不成牌）无法实现与验收，十风场景的胡牌、番型倍数与结算展示均缺依据，测试无法覆盖。","suggestion":"在【胡】模块补充十风资格计数起点（首张出牌）与失效条件（非字牌/吃碰杠永久失效）、十风自摸授权（不要求成牌、点炮与抢杠无效）、与有财必拷响的先后关系，并在番型表补十风独占番型与倍数。","status":"待确认","has_detail":true},{"id":"PRD-003","title":"全篇无断线重连章节，11.1 的 10 条重连功能点全部缺失","priority":"P0","type":"需求缺失","module":["断线重连整体缺失"],"source_location":"全文（「结算界面」与「辅助功能」之间无断线重连章节）；3.3.3 玩家头像信息（第6项 玩家状态）","original_text":"离线状态：头像处覆盖断线图标，且显示断线计时，格式为分秒“00:00”，每次断线重新计时；备注：在当前动画播放过程中有玩家离线切后台等，不会因此中断原本的动画流程","problem":"规则要求重连按当前阶段恢复对局，并逐阶段列出恢复内容（开局/定庄/掷骰发牌/做牌/洗牌/加倍/定财神/首摸等待/摸打循环/结算），且以 RELINK-01~10 明细表约束触发、处理、结果与边界。需求文档仅在头像状态里描述“断线图标+断线计时”，没有任何重连章节、重连触发条件、按阶段补发数据清单和边界（普通重连/明牌/空闲或已结束）。","impact":"服务端无法确定重连补发协议（各阶段下发哪些字段），客户端无重连流程可开发，验收无对照基准，属于阻塞级缺口。","suggestion":"新增「断线重连」章节，按 RELINK-01~10 逐条落表：前置阶段、触发条件、补发字段清单、恢复结果、边界（含明牌与空闲/已结束场景）；并补充重连入口与自动重连触发时机（切后台、网络恢复、重开客户端）。","status":"待确认","has_detail":true},{"id":"PRD-004","title":"缺重连流程：仅断线图标与计时，无恢复当前阶段规则","priority":"P0","type":"需求缺失","module":["断线重连整体缺失"],"source_location":"「玩家头像信息」玩家状态行、全文（无重连章节）、本期开发范围","original_text":"离线状态：头像处覆盖断线图标，且显示断线计时，格式为分秒“00:00”，每次断线重新计时。全文再无断线重连、重连后阶段恢复、手牌可见性、倒计时与待响应状态的任何描述。","problem":"规则基准要求重连可恢复当前阶段，本文只描述了断线表现的UI，未描述重连进入时恢复到哪个阶段（等待出牌、吃碰杠胡响应中、结算中）、倒计时是否继续、自己在响应窗口期重连是否仍可操作、明牌/财神等信息的可见范围。","impact":"客户端与服务端无法确定重连协议与状态同步口径，容易出现重连后重复响应、错过响应窗口、手牌显示越权等严重问题；该条属于必测项却无验收依据。","suggestion":"新增「断线重连」小节：定义断线判定时长、重连携带的状态快照字段（当前阶段、剩余倒计时、待响应操作、各家副露与明牌、余牌数、分数）、重连时是否重置倒计时、错过响应窗口的处理，以及重连期间该玩家是否被他人可见为离线。","status":"待确认","has_detail":true},{"id":"PRD-005","title":"缺验收场景章节，无 AC 编号与 Given/When/Then，测试无法出用例","priority":"P0","type":"需求缺失","module":["文档规范章节缺失"],"source_location":"全文，章节止于「## 辅助功能 / ### 菜单」","original_text":"「菜单｜退出｜入口与范围。开局前与开局后使用同一套菜单。」「退出确认。点击「退出」后，桌面压暗，居中显示「提示」弹窗，文案为「确定要解散房间吗？」」（文档此后无任何章节；全文未出现「验收」「AC 编号」「Given/When/Then」）","problem":"1. 现状：全文没有验收章节，规则条目无法对应到可执行的验收用例。\n2. 缺什么：AC 编号体系、场景前置条件、操作步骤、预期结果，以及用例与规则的对应关系。\n3. 后果：测试只能照经验写用例，验收标准随人而变，回归覆盖不可控。","impact":"开发完成后没有可执行的验收依据；发牌、胡牌、流局、重连、超时等关键分支无法稳定回归，上线前只能人工对读文档。","suggestion":"1. 位置：文末新增「## 验收场景」章节，排在「辅助功能」之后。\n2. 必填列：AC 编号 ／ 场景名称 ／ 前置条件 ／ 操作步骤 ／ 预期结果 ／ 关联规则 ／ 优先级。\n3. 格式模板：\n\n| AC 编号 | 场景名称 | 前置条件 | 操作步骤 | 预期结果 | 关联规则 | 优先级 |\n| --- | --- | --- | --- | --- | --- | --- |\n| AC-001 | 四人坐满自动开局 | 4 人准备完成并开始 | 触发开局 | 播放开局动画并进入定庄发牌 | 开局流程 | P0 |\n\n4. 覆盖范围（每类 3~5 条）：开局与定庄、发牌与财神、摸打、吃碰杠、胡牌与番型、流局、小结算、本场结束、断线重连、超时兜底。\n5. 无法定论的条目单列「客户端待核实」子表：事项 ／ 待核实点 ／ 责任方 ／ 验证方式。\n6. 验收口径：任一条 AC 都能让测试不看代码、不问人直接写出手工用例。","status":"待确认","has_detail":true},{"id":"PRD-006","title":"听牌模块整体缺失，正文引用的“听牌提示”章节不存在","priority":"P0","type":"需求缺失","module":["听牌提示缺失"],"source_location":"三.对局流程 > 局内信息 > 手牌信息；三.对局流程 > 局内流程 > 行牌操作（提牌）；三.对局流程 > 局内流程 > 行牌操作｜修改对比版（提牌）","original_text":"「提起【打出可听牌】时，弹出听牌提示页面。详见听牌提示」「取消提牌、改选非候选牌或实际出牌后收起面板。其他关闭条件和详情见「听牌提示」。」","problem":"规则要求区分查听（当前已听）与打听（打哪张听什么）、维护听牌按钮显隐与“可胡”状态、点击按钮后渲染听牌列表（张数页、倍数、爆头区）；需求只在“听牌标签”描述了手牌上的箭头，且两处引用的“听牌提示”章节在全文中不存在。","impact":"听牌按钮、听牌列表、弹窗开合条件均无实现依据；玩家无法查看听牌详情，验收时无法判断箭头数据来源。","suggestion":"新增“听牌提示”章节：定义听牌按钮出现/隐藏条件、查听与打听数据来源、听牌列表内容与排序、弹窗打开与关闭时机（取消提牌/改选非候选/出牌/摸牌/胡牌），并修正失效交叉引用。","status":"待确认","has_detail":true},{"id":"PRD-007","title":"结算流程仅有2行，未覆盖结算界面变化序列","priority":"P0","type":"需求缺失","module":["结算流程不完整"],"source_location":"三、对局流程 / 结算流程 / 流程明细","original_text":"|结算流程|胡牌场景|- 触发操作：对局中有玩家胡牌，根据玩家的番型播放对应番型特效\u003cbr>- 参考功夫川麻的胡牌流程即可|…|与功夫川麻保持一致|；|对局结果阶段展示|- 前置条件：对局结束后…- 展示本局所有玩家的分数|…|同步老包|","problem":"规则16定义了结算消息下发的完整界面变化序列（结束类型横幅→收起吃碰杠胡与提示→隐藏出牌放大→全桌摊牌含胡谁的牌箭头→胡牌光柱与落地图→关闭听牌→点炮/一炮多响动画→番型动画与语音→四家飘分动画及3秒兜底→全桌终局摊牌→延迟1秒回应服务端→3秒后小结算→再延迟2秒总战绩→震动），需求文档整节只写“参考功夫川麻的胡牌流程即可”和“展示本局所有玩家的分数/同步老包”，既无步骤顺序也无时序。","impact":"开发无法确定结算演出的先后、时长与断点，验收无依据；“参考功夫川麻”“同步老包”属外部引用，不能作为可实现的规格，极易出现结算动画与后续弹窗时序错乱。","suggestion":"按规则16逐条补齐结算界面变化表：步骤、触发时机、时长、是否兜底、各客户端差异；补充“结束类型横幅（自摸/点炮/流局）”“全桌摊牌与胡谁的牌箭头”“四家飘分动画+3秒兜底”“终局摊牌后延迟回应服务端”等节点，并去掉“参考功夫川麻/同步老包”作为唯一说明。","status":"待确认","has_detail":true},{"id":"PRD-008","title":"总战绩（整场结算）展示与弹窗时机完全缺失","priority":"P0","type":"需求缺失","module":["本场结束与总战绩缺失"],"source_location":"本期开发范围、默认规则（计分与结算）、玩法规则-局数","original_text":"每小局保留小结算，未满8局则继续下一小局，满8局结束本场。／原文中的创房面板、其他玩法选项、大结算和非核心桌面功能…仅作原文上下文。／达到所选局数时进入大结算。","problem":"规则39要求整局结束时汇总并展示总战绩（每家总得失分、已打局数/最大局数、开始结束时间、房主名、玩法名、胡/爆头/财飘/财神统计），并规定弹窗时机（回放或房间解散直接弹、正常对局延迟2秒弹、被标记不弹则跳过）以及通知小结算切换到“查看总结算”按钮。需求文档只有“满8局结束本场”，全文无“总战绩”“查看总结算”相关描述，本场结束后的界面与去向未定义。","impact":"8局打完后客户端无明确收尾表现，测试无法验收本场结束；本期虽声明“不做大结算”，但总战绩与本场结束表现是独立诉求，缺失会直接阻塞收官流程开发。","suggestion":"补充本场结束（满8局）后的展示要求：是否弹总战绩、弹窗时机（延迟2秒/直接弹）、总战绩展示字段与统计条目、玩家如何返回房间或解散；若确要复用公共总战绩且本期不做，需写明“不属于本期范围、以何种界面替代收尾”。","status":"待确认","has_detail":true},{"id":"PRD-009","title":"全文缺失断线重连流程，无任何阶段入口","priority":"P0","type":"需求缺失","module":["断线重连整体缺失"],"source_location":"全文；一、本期开发范围；三.对局流程（对局开始、定庄、发牌、行牌操作、结算流程、小结算界面）","original_text":"本期只做游戏内核心流程。原文中的创房面板、其他玩法选项、大结算和非核心桌面功能，如在核心段落中被引用，仅作原文上下文。本核心流程全程按无托管处理。（全文仅头像状态出现一次“断线”，无“重连”“掉线恢复”“重新进入房间”等章节）","problem":"规则基准要求按断线所处阶段（准备/开局、场景开始、发牌、对局中、结算、洗牌）分别走不同的重连入口，并规定每个入口的补数据清单与界面还原顺序；需求文档完全没有重连章节，也没有定义触发条件、阶段识别方式、服务端下发消息类型、补数据字段清单。虽“本期开发范围”只排除了创房面板与大结算等非核心内容，未排除重连，重连仍属未描述状态。","impact":"开发无法实现断线恢复，掉线玩家回到牌桌会看到空白桌面或错乱状态；测试无验收依据，重连用例无法设计。","suggestion":"新增“断线重连”独立章节，按阶段给出入口：准备/开局阶段、场景开始（旧）、发牌（旧）、对局中（默认）、结算、洗牌；每个入口写明触发条件、下发字段、内部补齐顺序、界面还原清单与已知限制，并说明阶段识别依据。","status":"待确认","has_detail":true},{"id":"PRD-010","title":"头像刷新规则缺失：只列头像字段，未写外部通知触发的变化","priority":"P0","type":"需求缺失","module":["局内展示细节缺失"],"source_location":"三.对局流程 → 局中信息 → 玩家头像信息；桌面布局 → 对局前 → 玩家信息（编号3）","original_text":"|1|玩家头像|第三方或随机生成头像展示|；玩家状态：操作状态：头像处流光动效／离线状态：头像处覆盖断线图标，且显示断线计时…／托管状态：头像处覆盖托管图标；玩家信息：头像、分数：局数模式下，默认0、昵称、状态、标签：房主标签","problem":"1. 术语解释：这里的“跨层通知”指桌子服务（房间／大厅层）向游戏层广播的事件，例如玩家进入、离开、准备、换座、预约洗牌、VIP 气泡、微信授权红点等。它们不由对局协议触发，但会改头像。\r\n2. 现状：需求文档只静态列出头像上显示哪些字段（头像、昵称、分数、状态、标签），没有写“收到哪条通知后，头像哪个元素变成什么”。\r\n3. 缺什么：16 类外部通知与头像变化的对照关系；哪些元素归桌子服务、哪些归游戏服务（庄家标记、加倍标记、操作者发光框、累计分）。\r\n4. 后果：头像的刷新时机、清理时机与重连后的数据来源都没有依据。","impact":"1. 重连或换座后可能出现旧昵称、旧分数、残留“已准备”、空头像。\r\n2. 头像加倍常驻标记与桌面加倍标签生命周期不同，容易被一起清或一起留，表现错乱。\r\n3. 普通房与匹配场是两套头像节点，通知名相同但节点不同，缺对照表无法保证两者表现一致。","suggestion":"补两张表。\r\n\r\n1. 「外部通知 → 头像变化」表，必填列：通知名称 ／ 触发时机 ／ 头像变化 ／ 生效条件 ／ 数据来源。至少覆盖 16 类通知：玩家进入、玩家数据刷新、玩家离开、玩家准备、预约洗牌、换座、VIP 气泡、聊天语音、微信授权红点、人数变化、入座与准备标记、头像整体显隐、自己头像位置、开局安全校验、游戏结果返回、托管弹窗打开成功。\r\n\r\n| 通知名称 | 触发时机 | 头像变化 | 生效条件 | 数据来源 |\r\n| --- | --- | --- | --- | --- |\r\n| 玩家进入 | 玩家进入房间 | 刷新昵称、累计分、头像、头像框、语音状态、离线倒计时、托管角标 | 未开局才刷新准备状态 | 桌子服务 |\r\n\r\n2. 「游戏服务负责的头像变化」表，必填列：变化 ／ 来源消息 ／ 刷新时机 ／ 清理时机。覆盖庄家标记与连庄档位、加倍标记、当前操作者发光框、累计分刷新。\r\n\r\n3. 写明两条生命周期规则：已开局不显示准备状态；头像加倍常驻标记保留到下一局重置，桌面加倍标签在阶段结束即清。\r\n\r\n4. 标注普通房与匹配场是两套头像节点，修改任一头像表现需两处同时核对。\r\n\r\n5. 验收口径：开发按两张表即可实现头像的全部刷新与清理，不需要再确认“这个字段谁改、什么时候改”。","status":"待确认","has_detail":true},{"id":"PRD-011","title":"行牌操作存在原版与修改对比版两套矛盾描述","priority":"P0","type":"内容冲突","module":["行牌操作规则冲突"],"source_location":"三.对局流程 > 局内流程 > 行牌操作；三.对局流程 > 局内流程 > 行牌操作｜修改对比版","original_text":"原版：「出牌共有双击出牌、单击出牌、滑动出牌三种，其中双击出牌和单机出牌互斥，滑动出牌不互斥。可根据设置开关」；修改对比版：「本方案默认双击出牌。滑动出牌默认开。单击出牌归设置模块，本方案不包含该模式。」原版摸牌：「摸牌需在上一家打出牌的同时摸牌」；修改版：「若有玩家可响应，先按胡、碰／直杠、吃的优先级裁决。只有裁决结果要求常规摸牌时才取牌。」","problem":"同一模块并列两张表且未标注哪一版生效，对“单击出牌是否属于本期范围”“摸牌是否与上家出牌同时发生”“其他家是否放大出牌”等关键交互给出不同描述，需求文档内部自相矛盾。","impact":"客户端无法确定出牌手势与摸牌时机的实现基线，服务端下发顺序与客户端表现无法对齐，测试用例无法编写，无法验收。","suggestion":"明确以“修改对比版”为唯一实现基线并删除或标注作废旧表；统一摸牌时机（裁决结束后才取牌）、出牌手势集合与放大出牌开关口径，并在同一处集中描述。","status":"待确认","has_detail":true},{"id":"PRD-012","title":"三摊承包赔付按胡牌分×3计算，与算分和放铳规则矛盾","priority":"P0","type":"内容冲突","module":["三摊承包口径冲突"],"source_location":"二、功能详情 > 玩法规则 > 【三摊承包】；二、功能详情 > 算分规则 > 结算算分；二、功能详情 > 基础操作及规则 > 【放铳】；二、功能详情 > 基础名词和概念解释 > 【承包】","original_text":"承包：A对B累计3摊后，A胡牌，B需承包所有输分（支付其他三家的赔付）…示例：B赔付 = 胡牌分 × 3（如庄家自摸8分×3=24）；被承包…示例：A赔付 = 胡牌分 × 3 × 2（如闲家自摸4分×6=24元）","problem":"文档把承包额写成“胡牌分×3”，前提是三家等额；但同文算分规则规定闲家自摸时庄家付“底分×牌型倍数×牢数番”、两名闲家只付1倍，三家金额不等，不能统一×3。另【承包】称“其他玩家不出分”，【放铳】称“仅由放铳者按结算规则支付”，而【三摊承包】称B“支付其他三家的赔付”，点炮场景下付款人自相矛盾；规则基准要求承包额为各付款方应付金额之和（全部输分），且点炮仅在放铳者=承包对方时由承包者接管。","impact":"承包/倒承包金额会算错；点炮时可能把应由放铳者承担的分改由承包者承担，或反之；文档自带示例与算分公式对不上，无法作为验收用例。","suggestion":"删除“×3”等额示例，改为“承包基数=按算分规则计算出的各付款方应付金额之和”；明确点炮时仅当放铳者=承包对方才触发承包，否则按原放铳付款；补充庄家自摸、闲家自摸、点炮三种承包算例并给出数值。","status":"待确认","has_detail":true},{"id":"PRD-013","title":"超时不代打不判负，单人离线会阻塞整桌","priority":"P0","type":"逻辑错误","module":["默认时间与超时兜底缺失"],"source_location":"「方位信息」倒计时行、行牌操作（修改对比版）出牌行、「玩家头像信息」玩家状态行、默认规则（暂无托管）","original_text":"出牌倒计时归零时显示00，继续等待本家手动出牌。本核心流程按无托管处理，超时不触发自动出牌。；「出牌倒计时归零后显示00，按4.5无托管规则继续等待本家手动出牌」；玩家状态：「离线状态：头像处覆盖断线图标，且显示断线计时」","problem":"规则基准要求单人超时/掉线不影响整桌，本文的做法是倒计时归零后仅显示00并无限等待本家手动出牌，且明确取消托管代打。文档只描述了离线图标与断线计时，没有任何超时兜底（代打、自动过、托管、踢出、流局/解散）机制，逻辑上等于一人不操作即整桌停摆。","impact":"线上出现挂机或断线玩家时对局无法推进，8局场次无法结束，直接影响好友房可用性与线上事故处理；测试也无法构造可结束的超时场景。","suggestion":"补充超时兜底规则：明确出牌/响应超时的秒数与处理结果（如自动过、自动打出摸牌、连续超时判托管或允许房主解散），并明确掉线玩家是否由机器人接管、恢复后如何交还控制权。","status":"待确认","has_detail":true},{"id":"PRD-014","title":"杠补牌使余牌降到20张时的流局判定未定义","priority":"P0","type":"描述不完整","module":["流局判定与展示缺失"],"source_location":"二、功能详情 > 基础名词和概念解释 > 【流局】；二、功能详情 > 基础操作及规则 > 【杠】；三、对局流程 > 局中信息 > 玩法信息 > 剩余张数","original_text":"当牌墙剩余可摸牌数为21张时，允许当前玩家再摸1张，使剩余可摸牌数变为20张…在下一次应摸牌时停止摸牌，并判定流局；剩22张时开杠补牌后显示20，末20张完整保留，流局时机按流局规则执行","problem":"【流局】只定义了“21张时摸1张→20张”这一条路径；【杠】允许在余牌22张时开杠，补牌后余牌直接减到20，不经过“21张时摸牌”的判定。文档未说明此时是否立即流局、当前玩家是否还能出牌和响应、由谁触发“下一次应摸牌”，以及杠后补牌本身胡牌时是否优先于流局。","impact":"杠后余牌20张时可能继续行牌或卡住；流局状态机与余牌显示不一致，测试无法覆盖“杠到20张”的分支。","suggestion":"统一判定为“任意原因使余牌≤20张即进入流局收尾”，并明确杠补牌到20张后的顺序：先结算补牌胡/出牌/响应，再在下一应摸牌时流局；补充杠后立即流局的界面、结算和连庄分支。","status":"待确认","has_detail":true},{"id":"PRD-015","title":"无托管下倒计时归零与断线均无兜底处理","priority":"P0","type":"描述不完整","module":["默认时间与超时兜底缺失"],"source_location":"三、对局流程 > 局中信息 > 方位信息 > 倒计时；三、对局流程 > 局内流程 > 行牌操作 > 出牌；三、对局流程 > 局内流程 > 吃碰杠胡操作 > 碰/吃/胡；三、对局流程 > 局中信息 > 玩家头像信息 > 玩家状态","original_text":"出牌倒计时归零后显示00，按4.5无托管规则继续等待本家手动出牌；配置开启托管，超时默认【过】（本核心流程按无托管处理，此条规则不执行。）","problem":"文档声明全程无托管，并把出牌、吃、碰、胡的超时默认分支全部标记为“不执行”，但没有给出替代规则；倒计时归零后既不出牌也不自动“过”，响应阶段同样没有兜底。玩家挂机或断线时，对局会无限等待，文档也未定义断线后的操作权、重连恢复点和超时处置。","impact":"任一玩家挂机/切后台即卡死整局；超时事件在服务端没有结果可写，无法做超时验收和异常测试。","suggestion":"明确无托管下的超时策略（如出牌超时=打出刚摸的牌、响应超时=自动“过”、自摸超时=过），并给出各阶段倒计时秒数；同时补充断线后的操作权保留、重连恢复阶段和超时/踢出兜底。","status":"待确认","has_detail":true},{"id":"PRD-016","title":"敲响（万能听）判定缺失，只有界面表现无判定规则","priority":"P1","type":"需求缺失","module":["财神与番型判定口径缺陷"],"source_location":"三.对局流程/局中信息/手牌信息（听牌标签、杭麻特殊听牌标签）、对局内通用提示（有财必拷响）、胡牌番型介绍/番型介绍 序号3~5","original_text":"「当玩家处于胡任何牌张的情况下（爆头，财飘），此时听牌提示不会显示具体的牌，而是直接显示一张『胡』的麻将牌，tips写：『摸任意一张牌可胡』」；「勾选有财必拷响规则…不会弹出胡牌的按钮」","problem":"规则基准要求定义敲响的判定对象（进张前的手牌+副露+财神）、判定方法（枚举所有拆牌方案，只要存在一种方案的等待牌包含任意牌即敲响）、无财神时必然不敲响、以及敲响结果用于更新飘等级与杠链；需求文档全文仅在界面标签和可选规则 toast 中出现“（拷）响”字样，从未给出敲响的判定逻辑，也未说明本期是否强制要求。","impact":"万能听提示和“胡”牌标签无法实现；飘等级更新、杠链保留条件失去判定依据；测试无法编写敲响用例，也无法验收听牌提示。","suggestion":"新增“敲响（万能听）”判定口径小节：明确判定对象为进张前手牌+副露+财神、枚举拆牌方案等待牌含任意牌即成立、无财神必然不敲响，并写明敲响结果在飘等级更新与杠链保留中的使用位置，同时标注本期“有财必拷响”是否生效。","status":"待确认","has_detail":true},{"id":"PRD-017","title":"进张未定义，导致财神计数与敲响无共同口径","priority":"P1","type":"需求缺失","module":["财神与番型判定口径缺陷"],"source_location":"基础名词和概念解释/【向听数】、【财神】、【杠】/抢杠胡、【放铳】","original_text":"「仅按成牌结构，计算当前牌型达到听牌所需的最少有效进张次数」——全文仅此一处出现“进张”，且未给出定义","problem":"规则基准按胡牌来源定义进张（自摸=本次摸到的牌、点炮=他人打出的牌、抢杠胡=被抢的补杠牌）；需求文档完全没有“进张”定义，而财神计数（进张为财神时+1）、敲响（进张前的手牌）、爆头（进张与财神成将）都依赖该术语。","impact":"自摸白板是否计入财神数、抢杠胡被抢的第4张牌是否作为进张、杠后补牌是否属自摸进张等边界无法判定，财神番型与七对番型可能算错，开发需自行猜测。","suggestion":"新增“进张”定义小节，按自摸（含杠后补牌）、点炮、抢杠胡三种来源分别列出进张牌，并与胡牌来源表对齐，供财神计数、敲响、爆头判定引用。","status":"待确认","has_detail":true},{"id":"PRD-018","title":"断线重连场景缺失，仅有离线图标无恢复规则","priority":"P1","type":"需求缺失","module":["断线重连整体缺失"],"source_location":"三.对局流程/局中信息/玩家头像信息（玩家状态）、三.对局流程（全节）、结算界面（全节）","original_text":"「离线状态：头像处覆盖断线图标，且显示断线计时，格式为分秒『00:00』，每次断线重新计时」","problem":"规则基准的场景地图要求存在“断线重连”场景并规定按阶段恢复牌局、恢复后的手牌可见范围；需求文档只有断线头像图标与计时展示，没有任何重连触发、恢复阶段、恢复内容、他人手牌与暗杠可见范围的规则。","impact":"开发无法实现重连恢复逻辑，重连后可能丢失阶段状态（定庄/发牌/行牌/响应/结算）或泄露他人手牌、暗杠正面；验收无标准，也无法判断断线期间是否仍受倒计时约束。","suggestion":"补充“断线重连”小节：重连判定与超时处理、按当前阶段恢复的界面元素（庄标、财神指示、余牌数、手牌、听牌标签、倒计时）、各阶段手牌及他人牌张可见范围（含暗杠展示给谁看）。","status":"待确认","has_detail":true},{"id":"PRD-019","title":"默认时间参数无表，倒计时取值不可实现","priority":"P1","type":"需求缺失","module":["默认时间与超时兜底缺失"],"source_location":"三.3.1 方位信息·倒计时；四.1 对局开始（录屏对照）；四.3 发牌；四.4 定财神","original_text":"「中央用两位数字显示当前阶段剩余秒数…阶段开始时按该阶段配置的时间起始秒数刷新」；录屏对照「约00:09.67–00:09.70各家开始显示10」，全文无时间参数表。","problem":"规则4.4给出开局等待5s、发牌首摸等待5s、打牌操作10s、定财神动画3s、洗牌停留5s、自动摸打间隔1s等；文档只能从录屏推出出牌约10s，其余阶段时长、洗牌停留、定财神动画时长均无定义，“该阶段配置”指向不存在的配置表。","impact":"各阶段倒计时与动画时长无法实现，开场/发牌/定财神节奏无法验收，客户端与服务端超时判定易不一致。","suggestion":"补好友房时间参数表（开局等待、发牌首摸等待、打牌操作、定财神动画、洗牌停留、自动摸打间隔），并注明无托管时出牌倒计时归零后仅显示00并继续等待。","status":"待确认","has_detail":true},{"id":"PRD-020","title":"做牌（指定手牌/指定摸牌）流程整体缺失","priority":"P1","type":"需求缺失","module":["发牌与开局流程缺陷"],"source_location":"对局流程 / 发牌 / 发牌逻辑；对局流程 / 定财神","original_text":"「四人牌组。本期使用136张牌。以庄家为起点，按逆时针依次从牌序头部给每人同时发4张，重复3轮，每人先得12张」；「定财神｜显示｜白板财神｜出现时机。掷骰动画开始时，在桌面中央骰盘左侧直接显示白板指示牌」。全文未出现「做牌」「指定手牌」「指定摸牌」及对应的落地说明。","problem":"规则定义了做牌开启时的完整流程与落地时点，需求文档未描述做牌开关、指定牌记录阶段、指定牌取牌与从牌墙补齐规则，也未说明本期不支持该能力。","impact":"做牌道具或测试指令无法实现，发牌结果与指定牌不一致；开启做牌的对局无法验收，也无法复现特定手牌问题。","suggestion":"补充做牌章节：开关来源、指定牌操作时段（掷骰后定财神前）、记录内容（指定手牌/指定摸牌）、发牌取牌与不足补齐、定财神后落地与广播；若本期不做，明确写“本期不支持做牌”。","status":"待确认","has_detail":true},{"id":"PRD-021","title":"未规定打出的财神弃牌不可被胡","priority":"P1","type":"需求缺失","module":["胡牌判定口径缺陷"],"source_location":"2.2 名词介绍【财神】、【放铳】、【自摸】","original_text":"财神牌打出后失去万能牌功能，按普通白板牌处理；其他玩家不能吃、碰或杠该弃牌。","problem":"规则基准明确“打出的牌是财神时不能胡”。需求文档只禁止对财神弃牌吃、碰、杠，未禁止胡，按现文可对财神弃牌点炮胡。","impact":"胡牌判定缺少一条硬性禁止，可能出现规则不允许的点炮胡，影响胜负与结算正确性。","suggestion":"在【财神】说明和【放铳】条件中补写“财神弃牌不能被任何玩家点炮胡”，并同步到胡按钮授权校验。","status":"待确认","has_detail":true},{"id":"PRD-022","title":"吃禁手未定义“吃后无牌可打”的过滤与提示","priority":"P1","type":"需求缺失","module":["禁手与特殊规则缺陷"],"source_location":"【吃碰禁手】、【吃】、三.对局流程·行牌操作（提牌/出牌）","original_text":"吃以后下一次摸牌前禁止打出特定牌：吃中间禁打中间，吃两边禁打两边；／禁打牌压暗且不可提起。任何出牌手势都不能打出禁打牌","problem":"规则要求吃禁手开启时逐个吃牌组合过滤“吃后无牌可打”的吃法，全部被过滤时不给吃并给出提示。文档只描述吃成立后的禁打黑名单，没有任何组合过滤与全部被过滤的处理。","impact":"可能出现玩家吃后全部手牌被禁、无法出牌导致流程卡死；吃候选按钮也会给出实际不可执行的吃法，无法验收。","suggestion":"在【吃】判定中补充：枚举吃牌组合时按拟生成的禁打黑名单判断是否仍存在可打牌，过滤不可执行组合；全部被过滤则不弹出吃按钮并提示。","status":"待确认","has_detail":true},{"id":"PRD-023","title":"跟庄只有一条提示，缺少完整规则定义","priority":"P1","type":"需求缺失","module":["禁手与特殊规则缺陷"],"source_location":"三、对局流程 > 对局内通用提示 > 跟庄","original_text":"前置条件：跟庄规则勾选；触发场景：最后一个玩家出牌完成跟庄；结果表现：客户端展示“跟庄”的艺术字动画","problem":"文档只在通用提示表中出现跟庄一行，未定义目标牌记录、除庄家外每人首张跟同张、软跟与硬跟、剩余待跟人数、中断条件、成功赔付（固定一片或摇骰）、骰子独立阶段停留3秒、跟庄分并入当局输赢与流局保留；且“最后一个玩家出牌完成跟庄”暗示只需末家跟牌，与规则要求逐家跟同张的流程不符。","impact":"开发无依据实现跟庄，若照提示文案实现会漏掉中间玩家的跟牌校验与赔付，跟庄分也无法并入小结算，流局时处理无定义。","suggestion":"补齐跟庄开关、触发与状态机、软跟与硬跟判定、各人数待跟人数、中断条件、两种赔付方式及骰子阶段、跟庄分与小结算及流局的合并规则，并修正通用提示中的跟庄触发描述。","status":"待确认","has_detail":true},{"id":"PRD-024","title":"承包缺少点炮、抢杠与双向互满付款规则","priority":"P1","type":"需求缺失","module":["三摊承包规则缺失"],"source_location":"二、功能详情 > 玩法规则 > 三摊承包；基础操作及规则 >【杠】 > 抢杠胡","original_text":"承包：A对B累计3摊后，A胡牌，B需承包所有输分（支付其他三家的赔付） / 赔付方式同放铳，仅被抢杠的加杠者按放铳规则赔付，其他玩家不出分","problem":"规则要求：点炮时仅当放铳者本人是承包对方才触发承包，第三方点炮不触发；自摸与点炮都由承包关系整体接管付款人，未参与承包的玩家不付；抢杠胡中杠牌者保留三家钱赔付，承包或倒承包在其上独立叠加；双向互满3摊按倒承包×2。文档只写了A胡牌、B胡牌这一种关系，未区分胡牌方式，也未覆盖抢杠与双向互满。","impact":"点炮与抢杠场景下的付款人与赔付层数无法确定，可能漏收承包分或重复收分，结算无法验收。","suggestion":"补充承包结算分支表：按胡牌方式（自摸、点炮、抢杠胡）与关系（单方3摊、双向互满）列出付款人、倍数与叠加方式，并写明第三方点炮不触发承包。","status":"待确认","has_detail":true},{"id":"PRD-025","title":"重连后的倒计时/响应窗口剩余时间未定义","priority":"P1","type":"需求缺失","module":["重连恢复细节缺失"],"source_location":"3.3.1 方位信息（倒计时、弃牌响应）","original_text":"中央用两位数字显示当前阶段剩余秒数，按秒递减……阶段开始时按该阶段配置的时间起始秒数刷新；本家出现吃、碰、杠、胡等可响应按钮时，本家界面临时亮底边红色，并显示自己的响应倒计时","problem":"规则已明确把“重连时时钟如何恢复”列为必须说明的点，并要求重连补发操作权限。需求文档只写了阶段开始时的时间刷新方式，没有定义重连时是按配置时长重新起算、还是按服务端剩余秒数续算，也没定义重连时若正处于吃碰杠胡响应裁决窗口，是否恢复按钮、剩余秒数如何处理。","impact":"客户端与服务端对倒计时起点理解不一致会出现重连后时间跳变、响应窗口错乱或直接判超时，影响公平性与验收。","suggestion":"在重连章节明确：各阶段下发字段统一为 remain_sec（服务端实际剩余秒数）；重连时按剩余秒数续算，剩余\u003c=0 按对应阶段超时规则处理；响应阶段重连按剩余裁决时间恢复按钮。","status":"待确认","has_detail":true},{"id":"PRD-026","title":"未定义重连后需重建的界面元素清单","priority":"P1","type":"需求缺失","module":["重连恢复细节缺失"],"source_location":"3.3.2 玩法信息、3.3.4 牌河信息、3.3.5 手牌信息（听牌标签）、4.5 行牌操作（提牌/出牌）、4.8 多操作状态","original_text":"听牌提示仅在本家界面显示。打出后可听的候选牌上方显示黄色小箭头等提示。；吃碰禁手牌压暗并保持原位。（牌河、余牌数、财神指示牌、庄标、多操作状态下均只有首次进入时的展示描述）","problem":"规则要求重连“恢复当前阶段界面”。需求文档对牌河摆放与浮标、碰杠区、余牌数、白板财神指示牌、庄标、当前玩家流光/方位闪烁、听牌提示面板、吃碰禁手压暗、操作按钮组、跟庄/摊等信息只描述了正常流程下的首次出现与刷新，没有一份“重连需按快照重建的界面元素与状态”清单。","impact":"客户端实现人员需自行猜测重连后显示什么，容易出现牌河错位、余牌数与实际不符、禁手压暗丢失、听牌提示不显示等缺陷，且无法写成验收用例。","suggestion":"新增“重连界面重建清单”：逐项列出元素（方位盘、余牌数、财神指示牌、庄标、四家牌河及最新弃牌浮标、副露区、手牌与分隔位、听牌提示、禁手压暗、操作按钮、倒计时、摊/承包关系）及其数据来源字段与缺失时的兜底表现。","status":"待确认","has_detail":true},{"id":"PRD-027","title":"局内无摊数及承包/倒承包关系展示，不满足“变化即展示”","priority":"P1","type":"需求缺失","module":["局内展示细节缺失"],"source_location":"4.7 对局内通用提示（三摊落地）、5.2.1 小结算界面（UI交互 编号5 承包的标识）、2.2 名词介绍【摊】【承包】","original_text":"三摊落地｜触发场景：玩家A对玩家B的吃碰次数达到三次｜结果表现：客户端展示“三摊落地”的艺术字动画；承包的标识｜用来展示本局承包和反承包的情况","problem":"规则要求局内随变化更新并展示摊数与承包/倒承包关系。需求文档对摊、承包只有概念定义和两条展示：达到3摊时的“三摊落地”艺术字、以及小结算界面的承包标识；局内没有任何摊数（A从B取得几摊）与承包/倒承包关系建立的常驻或即时展示，也没有说明按方向分别记录的两组摊数如何呈现。","impact":"玩家无法判断自己和对手已累计几摊、承包关系是否已成立，影响策略与体验；测试缺少摊数/关系展示的验收点。","suggestion":"补充局内展示方案：摊数展示位置与形式（如头像或副露旁的角标，按“A→B”方向区分）、达到2摊/3摊的提示梯度、承包与倒承包关系生效后的标识位置与样式，以及关系解除/跨小局清零规则。","status":"待确认","has_detail":true},{"id":"PRD-028","title":"“飘”事件无客户端展示需求（出财神玩家、飘次数、飘限制状态）","priority":"P1","type":"需求缺失","module":["飘规则与展示不完整"],"source_location":"2.2 名词介绍【飘】、3.3.5 手牌信息（听牌标签中的“飘”）、4.7 对局内通用提示、5.2.1 小结算界面","original_text":"玩家在自己的出牌阶段打出1张财神后，无论此前是否处于爆头状态，均触发该玩家的一次“飘财”。该次飘财限制其他所有参战玩家：……禁止吃、碰、明杠","problem":"规则要求飘事件提示“出财神玩家与飘次数”。需求文档对“飘”只有规则定义、番型倍数表、以及本家听牌标签里的“飘”图标，没有定义飘财发生时的播报（谁打出财神、是第几次飘）、飘次数累计展示、飘限制生效期间对被限制玩家的提示（禁止吃碰杠的可操作按钮抑制与状态标识）、以及限制解除时的提示。","impact":"玩家无法感知飘限制正在生效，会反复尝试吃碰而被判无效；同时“双财飘/三财飘”等番型所需次数在局内不可见，体验与验收均缺依据。","suggestion":"补充“飘”的交互展示需求：飘财播放（方位/头像+艺术字“飘”）、飘次数角标（按发起玩家分别计数并显示）、受限制玩家的状态标识与按钮抑制说明、限制解除（发起玩家下次摸牌）时的提示与清除逻辑。","status":"待确认","has_detail":true},{"id":"PRD-029","title":"缺结算一致性与幂等约束，未定义重复结算防护","priority":"P1","type":"需求缺失","module":["结算流程不完整"],"source_location":"「流程明细」结算流程、算分规则、「小结算界面」触发逻辑、全文","original_text":"算分规则仅写「最终得分=底分×倍数×庄闲倍数」；结算流程仅写「对局中有玩家胡牌，根据玩家的番型播放对应番型特效」。全文无写分幂等、同一局只结算一次、分数校验与重试策略的任何描述。","problem":"规则基准把「写分幂等、同一局不重复结算」列为一致性验收项，本文只描述结算的展示流程与算分公式，未规定结算指令的幂等键（局ID/座位）、重复下发时的处理、异常中断后的补结算与分数对账口径。","impact":"联调与测试无法验证重复请求、重连重发结算、跨局分数累计等场景；一旦重复写分会造成分数错乱且无判定标准，属于资损类风险。","suggestion":"补充一致性约束：以局ID作为结算幂等键，同一局重复请求只返回首次结果；明确异常中断后的补结算发起方与对账方式；明确跨局累计分与「本场结束」判定所依据的唯一数据源。","status":"待确认","has_detail":true},{"id":"PRD-030","title":"缺依赖与接口章节，无协议字段、时序与错误码，前后端无法拆任务","priority":"P1","type":"需求缺失","module":["文档规范章节缺失"],"source_location":"全文无依赖与接口章节；「发牌」说明行、「对局开始」触发逻辑","original_text":"「若本家是庄家，最右侧独立位在立起时刷新为服务端单独下发的第14张」；「首次开局时，先等待云检测流程结束后再播放」。","problem":"1. 现状：全文只有上述两处提到服务端，没有依赖方、协议、字段、时序与错误码。\n2. 缺什么：开局与发牌、摸打出牌、吃碰杠胡响应、结算、重连快照五类核心协议；配置来源与版本；是否接入机器人或托管。\n3. 后果：客户端不知道每个阶段依赖谁推送什么，字段缺失或超时时如何处理。","impact":"前后端无法据此拆任务和联调计划，字段口径只能口头确认；联调返工，重连与结算最容易出错。","suggestion":"1. 位置：新增「## 依赖与接口」章节，放在非功能需求之前。\n2. 依赖方表，必填列：依赖方 ／ 用途 ／ 提供内容 ／ 失败表现 ／ 本期是否依赖。\n\n| 依赖方 | 用途 | 提供内容 | 失败表现 | 本期是否依赖 |\n| --- | --- | --- | --- | --- |\n| 房间服务 | 开局与座位 | 座位、准备状态、房间配置 | 无法开局 | 是 |\n\n3. 协议清单表，必填列：协议名 ／ 方向（C→S 或 S→C）／ 触发时机 ／ 关键字段 ／ 错误码 ／ 幂等要求。关键字段必须写类型与取值范围，例如 seat（0~3）、tileId（1~34）、fanValue（整数）。\n4. 时序：用编号步骤或时序图描述「开局→发牌→摸打→响应→结算→重连」，标出谁发起、谁广播、超时时长。\n5. 降级：每个协议补一列「缺字段或超时时的客户端表现」。\n6. 验收口径：前后端按表即可拆任务，不需要再确认字段含义。","status":"待确认","has_detail":true},{"id":"PRD-031","title":"缺数据埋点与日志规范，结算争议与掉线问题无法复盘","priority":"P1","type":"需求缺失","module":["文档规范章节缺失"],"source_location":"全文无数据与埋点章节；结算流程「流程明细」、算分规则","original_text":"「结算流程｜胡牌场景｜触发操作：对局中有玩家胡牌，根据玩家的番型播放对应番型特效；参考功夫川麻的胡牌流程即可」；「对局结果阶段展示｜触发方式：对局结束后…展示本局所有玩家的分数｜同步老包」。全文未出现「埋点」「日志」「上报」「字段口径」等描述。","problem":"1. 现状：没有数据采集与日志要求，结算与异常行为无记录。\n2. 缺什么：对局结束事件、异常事件、客户端关键点击的字段定义与上报时机。\n3. 后果：结算争议、分数异常、重连失败无从查证。","impact":"上线后无法复盘对局与结算问题；测试也无法验证埋点是否正确上报。","suggestion":"1. 位置：新增「## 数据与埋点」章节。\n2. 事件表必填列：事件名 ／ 触发时机 ／ 字段名 ／ 类型 ／ 取值范围或口径 ／ 上报方 ／ 用途。\n3. 对局结束事件至少包含字段：matchId、roundNo、seat、isBanker、handType、fanType、fanValue、deltaScore、remainScore、durationMs。\n4. 异常事件至少包含：timeout、disconnect、reconnect、illegalAction，并写明触发条件与上报时机。\n5. 客户端埋点至少包含：结算面板曝光、听牌提示曝光、菜单退出点击。\n6. 验收口径：仅凭上报字段即可还原一局的输赢与关键节点。","status":"待确认","has_detail":true},{"id":"PRD-032","title":"缺现状差异表，原文口径与本期口径混杂，范围无法判断","priority":"P1","type":"需求缺失","module":["文档规范章节缺失"],"source_location":"「本期开发范围」与全文各模块","original_text":"「本期只做游戏内核心流程。原文中的创房面板、其他玩法选项、大结算和非核心桌面功能，如在核心段落中被引用，仅作原文上下文。本核心流程全程按无托管处理。」；正文仍保留「片数模式」「翻财神」「只碰不吃」「守庄」「跟庄」等原文条目。","problem":"1. 现状：只有开头一句范围声明，正文中原文功能与本期功能混排。\n2. 缺什么：逐项对照表，说明每项原文口径与本期口径的差异及处理方式。\n3. 后果：读者无法判断某条描述是本期的实现要求还是仅供对照的原文上下文。","impact":"开发可能误实现片数、翻财神、托管、只碰不吃等本期不做的功能；测试无法确定范围，验收边界失控。","suggestion":"1. 位置：紧跟「本期开发范围」新增「## 现状差异」小节。\n2. 必填列：事项 ／ 原文口径 ／ 本期口径（做／不做／待确认）／ 差异说明 ／ 处理方式（保留／删除／标注）。\n3. 至少覆盖 11 项：人数、局数、财神方式、牢庄、封顶、片数、托管、只碰不吃、守庄、跟庄、大结算。\n4. 格式模板：\n\n| 事项 | 原文口径 | 本期口径 | 差异说明 | 处理方式 |\n| --- | --- | --- | --- | --- |\n| 片数模式 | 支持打片起始片数 | 不做 | 本期无片数结算 | 标注仅供参照 |\n\n5. 验收口径：读者只看这张表就能判断某项是否属于本期范围。","status":"待确认","has_detail":true},{"id":"PRD-033","title":"缺待确认清单，未决点散落正文且无责任人与结论","priority":"P1","type":"需求缺失","module":["文档规范章节缺失"],"source_location":"「发牌（发牌UI以及动画表现）」；全文","original_text":"「**待确认。**发牌与理牌的音效资源及触发时点本方案不添加。」（全文仅此一处出现「待确认」，无编号、无影响说明、无处理建议）","problem":"1. 现状：唯一一处待确认埋在发牌小节里，其余未决点散落正文。\n2. 缺什么：编号、影响模块、建议方案、责任方、状态与结论。\n3. 后果：未决项不会进入评审流程，开发各自拍板。","impact":"音效、第 8 局收尾、杠分口径、抢杠胡计摊、云检测时序等问题在验收时才暴露，返工成本高。","suggestion":"1. 位置：文末新增「## 待确认清单」章节（与修订记录分开）。\n2. 必填列：编号 ／ 问题 ／ 影响模块 ／ 建议方案 ／ 责任方 ／ 状态 ／ 结论。\n3. 格式模板：\n\n| 编号 | 问题 | 影响模块 | 建议方案 | 责任方 | 状态 | 结论 |\n| --- | --- | --- | --- | --- | --- | --- |\n| P-01 | 发牌与理牌音效是否本期制作 | 发牌 | 沿用旧包音效 | 策划 | 待确认 | 未定 |\n\n4. 归集范围：音效资源、满 8 局收尾方式、杠是否单独计分、抢杠胡是否计摊、云检测时序。\n5. 验收口径：每条都有责任方与结论，未关闭项不得进入开发排期。","status":"待确认","has_detail":true},{"id":"PRD-034","title":"局内财神染色与禁打置灰刷新未定义","priority":"P1","type":"需求缺失","module":["局内展示细节缺失"],"source_location":"3.3.2 玩法信息（财神）、3.3.4 手牌信息、结算界面 / 小结算界面（UI交互以及说明）","original_text":"该指示牌仅作界面展示，四张白板均按财神规则使用。|手牌里的财神也有需要染色","problem":"规则要求财神牌在自己手牌、三家河牌、副露、胡牌区统一染成红色，并在染色后重新刷新禁打置灰状态；文档对局中只描述了左侧白板指示牌，财神染色仅在小结算界面出现一句“手牌里的财神也有需要染色”，局内所有明牌的财神染色与置灰刷新完全缺失。","impact":"财神最核心的可视化表现没有依据，手牌/牌河/副露中财神是否变色、何时变色无法开发与验收。","suggestion":"在财神模块补充：手牌内财神染色样式与刷新时机、三家河牌/副露/胡牌区财神的统一染色规则、财神进出这些区域时染色的增删，以及染色后禁打置灰状态的重新计算。","status":"待确认","has_detail":true},{"id":"PRD-035","title":"开局各消息的断线重连/回放处理全部缺失","priority":"P1","type":"需求缺失","module":["重连恢复细节缺失"],"source_location":"3.3.3 玩家头像信息（玩家状态）、全文各开局章节","original_text":"「离线状态：头像处覆盖断线图标，且显示断线计时，格式为分秒“00:00”，每次断线重新计时」；「对局开始｜触发逻辑｜仅在开房后的首次开局播放「对局开始」动画。首次开局时，先等待云检测流程结束后再播放。」全文未出现「重连」「回放」的恢复流程与表现差异。","problem":"规则对开局阶段每条消息都规定了重连/回放差异（开局消息只补数据不播动画；骰子静态显示点数不滚动；牌墙只记录数据由恢复流程负责界面；财神不播翻牌动画由场景动作补显示），文档完全没有重连章节。","impact":"断线重连后开局阶段应显示什么、是否重播动画、由哪条消息补齐界面均无法开发，验收缺少判定标准。","suggestion":"新增“断线重连/回放”章节，按开局、局数据、掷骰、洗牌、牌墙、发牌、财神逐条给出：只补数据不播表现、静态还原骰子、不重复触发开局动画与确认、界面由哪条恢复流程补齐。","status":"待确认","has_detail":true},{"id":"PRD-036","title":"缺多吃选择池与多杠列表，多种吃/杠无法选择","priority":"P1","type":"需求缺失","module":["吃碰杠胡操作不完整"],"source_location":"二、功能详情 > 规则详情 > 基础操作及规则 > 【吃】；三.对局流程 > 局内流程 > 吃碰杠胡操作（杠牌）","original_text":"吃：「存在多种合法组合时，选择其中1组」；杠：「杠牌-复用现有血战杠的特效，主要区别删除刮风下雨，无论什么杠，统一使用杠字即可」","problem":"规则明确要求多种吃法与多种杠时提供可点选的列表，需求只写“选择其中1组”，且杠模块仅有一句特效复用说明，未定义直杠/加杠/暗杠按钮、多杠列表、与多吃选择池互斥显示的规则。","impact":"玩家在手牌存在多种吃法或多处可杠时无法选择目标组合，操作权限实现缺失，无法验收。","suggestion":"补充多吃选择池与多杠列表的触发条件、位置、选项内容（整组顺子牌面/杠类型+牌面）、互斥关系与超时/过处理。","status":"待确认","has_detail":true},{"id":"PRD-037","title":"小结算无按钮定义，如何进入下一小局未说明","priority":"P1","type":"需求缺失","module":["结算流程不完整"],"source_location":"三、结算界面 / 小结算界面 / UI交互以及说明、本期开发范围","original_text":"|小结算|触发条件|**播完胡牌结算流程**，进入结算界面|；|8|财神牌|- 展示本小局的财神牌|（表内仅玩家信息、手牌摆布、输赢显示、分数结算、承包的标识、赢家结算、麻将牌标识、财神牌 8 项）；每小局保留小结算，未满8局则继续下一小局","problem":"规则38明确小结算有“公共结算外壳”按钮（关闭/继续、查看总结算、安全中心、洗牌道具），并会监听公共消息刷新这些按钮。需求文档小结算表只有 8 项展示内容，没有任何按钮、关闭方式、倒计时，也没有“未满8局如何进入下一小局”（房主点击/全员准备/自动倒计时）的规则。","impact":"小结算界面无法关闭、无法继续下一局，局间流转断链，属阻塞级缺口；也无法实现“查看总结算”入口。","suggestion":"补充小结算界面的交互要求：按钮清单与位置（继续/关闭、查看总结算等）、按钮可用条件与点击结果、关闭后进入下一小局的触发方式（自动倒计时或房主开始）、超时行为，以及满8局时按钮文案的切换规则。","status":"待确认","has_detail":true},{"id":"PRD-038","title":"未定义重连状态恢复顺序（财神先于手牌等）","priority":"P1","type":"需求缺失","module":["重连恢复细节缺失"],"source_location":"三.对局流程 → 行牌操作、手牌信息、方位信息（无任何恢复顺序说明）","original_text":"需求文档全文无重连状态恢复步骤，也无“先恢复财神再恢复手牌”“先恢复出牌限制再恢复权限”等顺序约束；手牌信息仅描述正常发牌立起时的排列“万-条-筒-东-南-西-北-中-发、白”。","problem":"规则基准把重连补齐顺序视为关键约束：财神必须先于手牌恢复（否则手牌排序不知财神、财神不靠左）；出牌限制必须先于权限（否则禁手置灰丢失）；做牌数据必须先于做牌权限（界面打开时读取候选牌与座位）。需求文档完全没有顺序约定，也没说明重连时哪些步骤属于“只补数据”、哪些需要触发界面。","impact":"开发按错误顺序实现会出现重连后财神不靠左、禁打牌未置灰、做牌界面空列表；测试无法判定该表现是缺陷还是设计。","suggestion":"在重连章节以有序列表写出补齐顺序，并显式标注顺序依赖及其后果（例如“财神必须早于手牌，否则财神不靠左”），同时标注每步为“只补数据”或“触发界面”。","status":"待确认","has_detail":true},{"id":"PRD-039","title":"重连后操作权限、倒计时、头像发光框恢复未定义","priority":"P1","type":"需求缺失","module":["重连恢复细节缺失"],"source_location":"三.对局流程 → 方位信息（操作指示、倒计时）；行牌操作（禁打牌压暗）","original_text":"常规摸打轮次以当前实际可操作玩家为准。该玩家开始操作时，在方位盘对应边循环闪烁高亮；出牌倒计时归零后显示00，按4.5无托管规则继续等待本家手动出牌；吃或碰成立并进入本家出牌阶段时，按「吃碰禁手」判定本次禁打牌，禁打牌压暗且不可提起。","problem":"规则要求重连后按服务端权限数据恢复操作按钮、倒计时、操作者头像发光框，并根据出牌限制刷新手牌置灰，且权限步骤须晚于出牌限制；需求文档只描述正常对局中的表现，未说明重连时是否重建权限、倒计时用剩余秒数还是重新起算、发光框归属于谁、禁手压暗如何恢复。","impact":"重连回来的玩家可能没有吃碰杠胡按钮、没有倒计时或倒计时错误、禁打牌可被提起，属于可被直接验收发现的功能缺陷。","suggestion":"补充“重连权限恢复”小节：按当前操作者恢复按钮、倒计时（剩余值）、头像发光框与方位闪烁；明确禁手压暗在权限步骤中重刷，并说明无权限时应为空操作区。","status":"待确认","has_detail":true},{"id":"PRD-040","title":"“等待确认”自动回应服务端机制缺失","priority":"P1","type":"需求缺失","module":["重连恢复细节缺失"],"source_location":"全文（无等待确认/自动回应相关描述）","original_text":"「对局开始｜触发逻辑｜仅在开房后的首次开局播放「对局开始」动画。首次开局时，先等待云检测流程结束后再播放。云检测流程可查看后续对应模块。」；「发牌批次。四家先按4＋4＋4＋1的节奏分批展示，庄家最后单独展示额外1张。」全文未出现「等待确认」「自动回应服务端」「确认编号」。","problem":"规则基准在开局、场景开始、发牌、加倍、洗牌多条重连路径中都要求：消息带“等待确认”时记录编号并立即自动回应服务端，否则会卡在开局等待。需求文档完全没有这一机制，也未定义回应超时与重试。","impact":"重连后可能长期停留在等待确认状态，整局无法推进，且客户端无兜底手段。","suggestion":"在重连章节写明等待确认字段、记录方式、立即回应的时机与失败重试策略，并说明该步骤不产生可见界面变化。","status":"待确认","has_detail":true},{"id":"PRD-041","title":"重连前上一局残留清理清单未定义","priority":"P1","type":"需求缺失","module":["重连恢复细节缺失"],"source_location":"三.对局流程 全部小节；结算界面 → 小结算界面（无清理与关闭规则）","original_text":"需求文档未描述重连时的界面复位；正常流程仅在桌面布局-对局前写“等待阶段的准备标记和操作入口随开局过渡收起”，无重连场景下的清理规则。","problem":"规则要求重连回到开局阶段时先清空上一局残留：操作区回空、手牌清空、隐藏听牌与剩余张数、隐藏胡牌标记、清空四家手牌/河牌/副露/胡牌区、隐藏河牌箭头与倒计时骰子、清除加倍/庄标/头像发光框、清空开局动画与飘分/匹配结果、关闭小结算；并特别说明保留其他玩家头像（由桌子服务恢复）。需求文档没有该清单，也没说明“先清空再由后续恢复补回”的依赖关系。","impact":"重连到准备/开局阶段会出现上一局手牌、河牌、飘分、结算界面残留，且无人知道哪些该保留（如他人头像），易误清头像导致整桌空头像。","suggestion":"新增“重连复位清单”表格（按界面区域列出清空项与保留项），并注明“手牌清空后必须由后续恢复步骤补回，否则桌面为空”的顺序依赖。","status":"待确认","has_detail":true},{"id":"PRD-042","title":"结算阶段重连的数据与界面还原未定义","priority":"P1","type":"需求缺失","module":["重连恢复细节缺失"],"source_location":"结算流程 → 流程明细；结算界面 → 小结算界面 → 触发逻辑","original_text":"小结算|触发条件|**播完胡牌结算流程**，进入结算界面；对局结果阶段展示：前置条件：对局结束后…展示本局所有玩家的分数","problem":"规则规定结算重连要用结算后累计分覆盖玩家累计分、遍历本局得失分仅刷新头像、恢复加倍状态并标记“加倍阶段已结束”；结算界面不由该重连消息打开而依赖公共结算流程；本局得失分不写入桌面飘分，故重连后不再出现飘分数字；还强调累计分与本局得失分是两个来源不可混用。需求文档只写“播完胡牌结算流程进入结算界面”，未描述重连到结算时的数据来源、结算界面由谁打开、飘分是否重播、桌面加倍标签延迟清除。","impact":"重连到结算阶段可能头像分数不更新或错用本局得失分，结算界面不弹出或重复弹出，飘分数字异常重现。","suggestion":"补充结算重连小节：累计分覆盖来源、本局得失分仅刷头像、结算界面依赖公共结算流程打开、飘分不重播的已知差异、加倍标记“已结束”后的操作区收起与 1 秒延迟清除。","status":"待确认","has_detail":true},{"id":"PRD-043","title":"本期固定四人坐满开局，人数/局数模块却写可选且允许未满开局","priority":"P1","type":"内容冲突","module":["人数配置口径冲突"],"source_location":"本期开发范围、默认规则（本期固定生效）、二、功能详情 玩法规则【人数】、【局数】","original_text":"默认规则：固定四人、8局。坐满4人且全部已准备后由房主开始游戏；【人数】：创房人数可选2人、3人或4人。允许未满开局，开局时的参战人数按实际到桌人数确定；【局数】：创房时在固定局数和片数中选择一种。","problem":"总纲把本期定为固定四人、固定8局且无任何可选配置，但玩法规则章节仍按创房可选人数、可选局数/片数并允许未满开局描述，两处口径直接互斥，未说明后者是否本期不实现。","impact":"开发与测试无法判定是否要实现2/3人房间、未满开局与片数模式，可能导致实现与本期验收范围不一致。","suggestion":"在【人数】【局数】等创房相关模块开头统一标注本期取值（固定4人、固定8局、片数模式不启用），并删除或明确标注“非本期实现”的分支。","status":"待确认","has_detail":true},{"id":"PRD-044","title":"杠开后出牌即断链与杠飘成立条件互相矛盾","priority":"P1","type":"内容冲突","module":["财神与番型判定口径缺陷"],"source_location":"三.对局流程/行牌操作【杠】/杠开（杠上开花）、同表/杠飘、胡牌番型介绍/番型介绍 序号22、【自摸】","original_text":"「杠后补牌未胡而打出任何一张牌（包括财神），则此前的杠不能再用于判定杠开；之后再次轮到自己摸牌时的胡牌，不能追溯为此前杠的杠开」与「完成杠后补牌…若未胡牌而紧接着打出1张财神…轮到自己下一次摸牌时，使用该次摸到的牌完成爆头自摸胡牌，则该次胡牌判定为『杠飘』」","problem":"同一文档一处断言杠后打出任何牌（明确包含财神）即切断此前杠、之后胡牌不得再按此前杠判定；另一处却要求杠后打财神、下一次摸牌爆头自摸仍成立“杠开后财飘”（序号22 杠飘8倍）。两处对同一流程给出相反结论，也与规则基准“打出财神且敲响杠链保留”冲突。","impact":"杠飘、双财飘、三财飘及与连杠/七对组合的8~256倍档位无法确定，开发可能实现出永远不成立的杠飘，或反之让杠开过度追溯。","suggestion":"明确区分“出牌断链”的触发条件：仅打出非财神时清除杠链，打出财神时按是否敲响分别处理（敲响保留、不敲响清零），并补一段杠开/杠飘在同一杠上的判定顺序与互斥说明。","status":"待确认","has_detail":true},{"id":"PRD-045","title":"本期固定四人与2/3人可选、允许未满开局相矛盾","priority":"P1","type":"内容冲突","module":["人数配置口径冲突"],"source_location":"本期开发范围、默认规则、二.功能详情/游戏规则概述（对局人数）、玩法规则/【人数】、三.对局流程/对局开始","original_text":"「固定四人、8局」「须坐满4人且4人均为『已准备』」与「支持2人、3人、4人三种对局人数，由创建房间时在创房面板中选择」「创房人数可选2人、3人或4人。允许未满开局」","problem":"同一文档既声明本期固定四人且必须坐满四人开局，又保留 2/3/4 人可选、允许未满开局，并在「对局开始」中要求“按开局时的实际参战人数显示2、3或4个玩家信息区”以及 2人/3人桌面布局、上家下家关系说明，且未标注这些内容属于本期不实现。","impact":"开发无法确定是否实现 2/3 人桌面与座位/上下家联动，可能做出本期不需要的分支；测试范围与验收标准不确定，人数相关的配置生效逻辑无法核对。","suggestion":"在人数、对局人数、对局开始等小节明确标注“本期仅四人，2/3 人相关描述仅作原方案上下文、不实现”，或把可选人数纳入本期并补齐 2/3 人下的座位、上下家与吃牌限制规则。","status":"待确认","has_detail":true},{"id":"PRD-046","title":"本期可选规则为“无”与勾选式规则提示矛盾","priority":"P1","type":"内容冲突","module":["房间配置项缺失"],"source_location":"默认规则·本期可选规则；三.对局流程 对局内通用提示（只碰不吃、有财必拷响、守庄、跟庄）","original_text":"「本期可选规则 无。进入房间后直接使用以上固定配置。」；「只碰不吃｜前置条件：勾选只碰不吃规则」「有财必拷响｜前置条件：勾选有财必拷响规则…该玩家有财神」「守庄｜勾选守庄规则…庄家的上家没有财神」「跟庄｜跟庄规则勾选」","problem":"规则4.1已给出这4项好友房默认值（均关），需求文档既未列入“本期固定生效”，又在对局内提示中以“勾选某规则”为前提描述生效表现。若本期确为固定配置，这些提示永不触发；若仍可勾选，又与“本期可选规则：无”冲突，同一文档两个结论。","impact":"手牌含财神时是否允许普通自摸、庄家上家无财神时是否禁吃碰杠、跟庄流程是否执行均无法判定，胡牌与吃碰杠的按钮/提示开发与验收无基准。","suggestion":"明确这4项本期取值（按规则默认关闭，或声明固定开启），并把条件性提示标注“本期不触发/已固定开启”，避免“勾选”表述。","status":"待确认","has_detail":true},{"id":"PRD-047","title":"碰算摊关闭与三摊按“吃碰次数”计数矛盾","priority":"P1","type":"内容冲突","module":["三摊承包口径冲突"],"source_location":"默认规则·承包与行牌；二.2.2【摊】；二.2.3.2.5【三摊承包】；三.对局内通用提示·三摊落地","original_text":"「承包与行牌。启用三摊承包和吃碰禁手，碰算摊关闭。」；「【摊】玩家A使用玩家B打出的牌完成1次吃、碰或明杠，按本局创房配置计入…摊数」；「三摊落地｜触发场景：玩家A对玩家B的吃碰次数达到三次」","problem":"配置为碰算摊关闭后，碰不计摊，但“三摊落地”以“吃碰次数达到三次”触发，未按摊数判定；同一文档一处按摊数、一处按吃碰次数，且未说明碰是否计入累计。","impact":"出现3次碰（不计摊）时是否播放“三摊落地”、是否推进承包进度无法确定，可能误触发承包/倒承包结算。","suggestion":"统一改用“摊数”表述触发条件，明确碰算摊关闭时仅吃、明杠计摊，并说明三摊落地与承包/倒承包使用同一判定口径（含飘财一圈需第4摊的特例）。","status":"待确认","has_detail":true},{"id":"PRD-048","title":"闲家起手牌 13 张与 14 张自相矛盾","priority":"P1","type":"内容冲突","module":["发牌与开局流程缺陷"],"source_location":"对局流程 / 发牌 / 发牌逻辑；局中信息 / 手牌信息（其他玩家手牌、闲家手牌）","original_text":"发牌逻辑：“发完庄家14张，三名闲家各13张，共发53张，牌墙余83张。” 手牌信息：“其他玩家手牌按13张摆放”，同表又写“闲家手牌 | 14张牌，从左至右，花色依次为万-条-筒~风”。","problem":"同一份文档对闲家起手牌张数给出 13 与 14 两种结论。发牌逻辑与“共发53张、余83张”的推导只在闲家 13 张时成立，手牌信息又要求闲家按 14 张摆放，违反 5.6 起手牌数口径。","impact":"服务端发牌校验、闲家手牌 UI 张数、余牌数 83 的展示与自动化验收无法确定唯一预期，客户端可能按 14 张绘制导致理牌与出牌异常。","suggestion":"统一闲家起手为 13 张，把“闲家手牌|14张牌”改为 13 张（或明确该行仅描述庄家额外 1 张的摆法），并补充 4 人共 53 张、牌墙余 83 张的校验用例。","status":"待确认","has_detail":true},{"id":"PRD-049","title":"摊的计入口径自相矛盾，碰算摊关闭形同虚设","priority":"P1","type":"内容冲突","module":["三摊承包口径冲突"],"source_location":"二、功能详情 > 默认规则 > 承包与行牌；基础名词和概念解释 >【摊】；对局内通用提示 > 三摊落地","original_text":"启用三摊承包和吃碰禁手，碰算摊关闭 / 吃、碰、明杠是否计摊，由创房面板的对应配置决定，例如“碰算摊” / 触发场景：玩家A对玩家B的吃碰次数达到三次","problem":"规则基准为吃恒记摊，碰、明杠是否记摊由碰算摊决定，暗杠、补杠不记摊；文档一处说吃是否计摊也由配置决定，另一处用“吃碰次数达到三次”触发三摊落地与承包，而本期已声明碰算摊关闭，碰本不应计摊。","impact":"摊数计算与承包触发条件无法确定，开发可能把碰计入摊导致误触发承包与大额赔付；三摊落地动画的触发时机也会提前。","suggestion":"明确写死：吃每次加1摊；碰、明杠仅在碰算摊开启时加1摊；暗杠、补杠不计摊；本期碰算摊关闭，碰不计摊。三摊落地与承包判定统一用摊数达到3，不再使用“吃碰次数”表述。","status":"待确认","has_detail":true},{"id":"PRD-050","title":"承包赔付示例与算分表庄闲倍数互相矛盾","priority":"P1","type":"内容冲突","module":["三摊承包口径冲突"],"source_location":"二、功能详情 > 玩法规则 > 三摊承包；算分规则 > 结算算分","original_text":"被承包：A对B累计3摊后，B胡牌，A需承包所有输分×2（支付三家总和×2）…（如闲家自摸4分×6=24元） / 闲家自摸：最终得分=【1庄家的底分×牌型倍数×牢数番】+【2闲家的底分×牌型倍数】","problem":"算分表规定闲家自摸时庄家付款需乘牢数番（本期笃三老庄为8倍），三家付款额不相等；三摊承包示例却按三家各付4分再乘2计算，未计入庄家8倍牢数番，与本文件的算分表冲突。","impact":"承包总额无法唯一确定，按示例实现会少算庄家倍数部分，承包与倒承包金额无法通过验收。","suggestion":"将示例改为先按算分表算出本局应赢全部分数合计，再对该合计应用×1或×2；补充笃三老庄下庄家自摸与闲家自摸两个完整算例，列出每个座位应付金额。","status":"待确认","has_detail":true},{"id":"PRD-051","title":"8局结束后是否大结算、片数模式是否存在，口径冲突","priority":"P1","type":"内容冲突","module":["本场结束与总战绩缺失"],"source_location":"本期开发范围、默认规则「计分与结算」、「局数」、「对局开始」显示行","original_text":"本期开发范围：「每小局保留小结算，未满8局则继续下一小局，满8局结束本场」，并声明「大结算…仅作原文上下文」；局数：「选择固定局数后，每完成一小局，已完成局数加1，流局也计1局。达到所选局数时进入大结算」；对局开始：「片数模式显示创房所选初始片数，例如选40片时，各玩家均显示40」","problem":"本期范围声明满8局结束本场且大结算不在本期，但局数模块仍写「达到所选局数时进入大结算」，对局开始还保留片数模式的分数显示口径，默认规则又写死底分1、无封顶且「本期可选规则：无」。同一文档同时存在「固定8局+小结算结束」「创房选局数/片数+大结算」两套流程。","impact":"开发无法判断满8局后是回到房间等待再开一场还是直接进入大结算界面，也无法判断是否要处理片数结算；验收时「小结算后结束」与「大结算」判定必然对不齐。","suggestion":"按本期固定配置收敛：把局数模块改写为「固定8局，满8局后结束本场（本期无大结算）」，删除片数模式与「在大结算处选择」的表述并标注为后续版本；同时明确满8局后玩家停留界面与再开一场入口。","status":"待确认","has_detail":true},{"id":"PRD-052","title":"本期固定四人，但人数模块仍写 2/3/4 人可选、允许未满开局","priority":"P1","type":"内容冲突","module":["人数配置口径冲突"],"source_location":"「默认规则」本期固定生效；「二、功能详情 / 游戏规则概述」对局人数；「玩法规则 / 【人数】」","original_text":"「**人数与局数。**固定四人、8局。坐满4人且全部已准备后由房主开始游戏」／「支持2人、3人、4人三种对局人数，由创建房间时在创房面板中选择」／「创房人数可选2人、3人或4人。允许未满开局，开局时的参战人数按实际到桌人数确定。」","problem":"同一文档内三处对人数给出互相排斥的要求：本期固定4人且必须坐满4人准备才能开局，而概述与【人数】仍写可选2/3/4人并允许未满开局。未按规则18标注哪条为现状原文、哪条为本期口径。","impact":"验收前提（Given）无法确定，无法判断「3人未满开局」「2人局」是否属于本期缺陷；按 2/3/4 人实现或按固定 4 人实现都可能被判错。","suggestion":"在【人数】与概述行加「本期不生效，仅原文对照」标注，或直接改写为「本期固定4人，坐满4人且全部准备后房主可开局」，并在现状差异表中登记人数条目。","status":"待确认","has_detail":true},{"id":"PRD-053","title":"换庄后风位重排描述自相矛盾","priority":"P1","type":"内容冲突","module":["庄家与方位展示冲突"],"source_location":"3.3.1 方位信息（有方位（东南西北））","original_text":"换庄进入下一小局时风位重排，仍然以庄家为东，其余玩家从首庄起逆时针依次为南、西、北。","problem":"同一句里先说“以庄家为东”，又说“从首庄起逆时针依次为南、西、北”。换庄后新庄家已不是首庄，两种起算方式会得到不同的风位分配，句内自相矛盾。","impact":"换庄小局的方位盘、四侧风位字、操作高亮方向都会算错，且与庄家标记/坐次对应关系错乱。","suggestion":"改为“以本小局庄家为东，其余玩家从庄家起按逆时针依次为南、西、北”，并明确换庄时是否沿用相对座次、方位盘底图是否随之切换。","status":"待确认","has_detail":true},{"id":"PRD-054","title":"小结算牢庄标识一处要求展示一处要求不展示","priority":"P1","type":"内容冲突","module":["结算流程不完整"],"source_location":"三、结算界面 / 小结算界面（好友房） / UI交互以及说明 第1项与第6项","original_text":"|1|玩家信息|- 玩家头像\u003cbr>- 庄家标识以及牢庄标识\u003cbr>- 房主标识…；|6|赢家结算|…- 承包有单独的样式，但是文字结算也要体现出来\u003cbr>- 牢庄不需要展示|","problem":"同一张表内第1项要求玩家信息显示“牢庄标识”，第6项又写“牢庄不需要展示”，两处直接矛盾；读者无法判断牢庄（连庄数）到底是否出现在小结算，也无法判断“不需要展示”是否仅指赢家结算的番型文字。","impact":"UI无法定稿，开发可能做出两种相反实现；测试无法判定牢庄标识显示是否正确。","suggestion":"明确牢庄标识的展示位置与形式：在玩家信息区显示（如庄×3角标）、仅在部分场景显示，还是完全不显示；若“牢庄不需要展示”仅指番型结算文字，请改为“番型结算文字中不体现牢庄”，并说明庄家标识/牢庄数值的数据来源（与桌面庄标同源）。","status":"待确认","has_detail":true},{"id":"PRD-055","title":"三摊落地以吃碰次数触发与碰算摊关闭矛盾","priority":"P1","type":"内容冲突","module":["三摊承包口径冲突"],"source_location":"默认规则/本期固定生效（承包与行牌）；对局内通用提示/三摊落地","original_text":"启用三摊承包和吃碰禁手，碰算摊关闭。……触发场景：玩家A对玩家B的吃碰次数达到三次","problem":"本期配置明确碰算摊关闭，即碰不计入摊数；但三摊落地按“吃碰次数”计数，等于把碰也计入，同时漏掉摊数定义中可能计摊的明杠。规则基准以累计摊数达到3摊为触发条件，不以吃碰次数为条件。","impact":"三次碰会误播三摊落地，吃两次加明杠凑满3摊反而不播；承包与落地提示触发时点不一致，开发与测试无法按同一口径验收。","suggestion":"统一改为“玩家A对玩家B累计摊数达到3摊”，并在本期配置中明确吃、碰、明杠各自是否计摊（碰算摊关闭时碰计0摊），据此重算三摊落地与承包触发时点。","status":"待确认","has_detail":true},{"id":"PRD-056","title":"庄家标签平庄样式两处描述不一致","priority":"P1","type":"内容冲突","module":["庄家与方位展示冲突"],"source_location":"三.对局流程 → 局中信息 → 玩家头像信息（编号2 庄家标签）；三.对局流程 → 局内流程 → 定庄（UI及动画-三档样式）","original_text":"玩家头像信息：平庄：显示【庄】／庄二：显示【庄×2】／庄三：显示【庄×3】；定庄-三档样式：平庄（一牢）显示「庄×1」，庄二（二牢）显示「庄×2」，庄三（三牢）显示「庄×3」","problem":"同一头像上的庄家标签，一处规定一牢显示“【庄】”，另一处规定一牢显示“「庄×1」”，需求文档内部自相矛盾；而重连与跨层通知都需按局数据恢复庄标样式，样式不确定则恢复结果无法判定。","impact":"开发只能二选一，重连/开局/升庄三条路径可能出现不同样式；测试无法判定哪种为正确表现。","suggestion":"统一平庄样式（例如统一为「庄×1」并同步修改玩家头像信息条目），并在重连章节明确庄标样式由局数据的牢数单一来源决定。","status":"待确认","has_detail":true},{"id":"PRD-057","title":"飘财“只能摸打”与吃碰禁手“禁打牌不可打出”冲突","priority":"P1","type":"内容冲突","module":["禁手与特殊规则缺陷"],"source_location":"二、功能详情 > 基础名词和概念解释 > 【飘】；三、对局流程 > 局内流程 > 行牌操作｜修改对比版 > 出牌、提牌；二、功能详情 > 玩法规则 > 【吃碰禁手】","original_text":"该次飘财限制其他所有参战玩家：除可按规则胡牌、暗杠外，只能摸打，即摸到什么牌就打出什么牌，不得改打原手牌；禁打牌压暗且不可提起。任何出牌手势都不能打出禁打牌","problem":"若飘财受限玩家摸到的牌正好是本座位尚未解除的禁打牌，两条规则互斥：飘要求必须打出该摸牌，禁手要求任何方式都不能打出该牌；文档没有给优先级或例外。","impact":"该局面没有合法出牌，客户端按钮与服务端校验二选一都会违反一条规则，可能导致卡死或非法出牌。","suggestion":"明确优先级：飘财窗口内“只能摸打”优先于吃碰禁手（禁手不拦截刚摸进的牌），或飘财期间禁手顺延到下一次出牌；在【吃碰禁手】补充与飘财的交互例外及用例。","status":"待确认","has_detail":true},{"id":"PRD-058","title":"行牌操作与修改对比版并存，单击出牌和他家弃牌牌面互相矛盾","priority":"P1","type":"内容冲突","module":["行牌操作规则冲突"],"source_location":"三、对局流程 > 局内流程 > 行牌操作；三、对局流程 > 局内流程 > 行牌操作｜修改对比版","original_text":"出牌共有双击出牌、单击出牌、滑动出牌三种…单击出牌：出牌阶段点击打出不可听牌的牌，则直接将其打出；本方案默认双击出牌。滑动出牌默认开。单击出牌归设置模块，本方案不包含该模式","problem":"同一文档并列两张行牌表，未声明哪张生效。除单击出牌外，原表“其他家打出的牌始终是摸到的那张牌”与修改版“从手牌尾端独立牌背位飞出实际弃牌的牌面”相反；原表“摸牌需在上一家打出牌的同时摸牌”与修改版“有玩家可响应时先裁决、再取牌”也不同。","impact":"客户端交互与服务端校验无法确定以哪版为准，开发和测试会各按一版实现，联调时出现出牌方式、他家弃牌显示、摸牌时机三类冲突。","suggestion":"明确“修改对比版”为唯一有效版本并删除旧表，或标注旧表仅历史参考；对单击出牌、他家弃牌牌面、摸牌时机三处给出最终结论和验收用例。","status":"待确认","has_detail":true},{"id":"PRD-059","title":"流局是否进入小结算、展示什么内容前后矛盾","priority":"P1","type":"内容冲突","module":["流局判定与展示缺失"],"source_location":"三、对局流程 > 结算流程 > 流程明细；三、对局流程 > 结算界面 > 小结算界面（好友房） > 触发逻辑；小结算界面 > UI交互以及说明 > 赢家结算","original_text":"对局结果阶段展示…可以是出现流局，对局结束…展示本局所有玩家的分数；触发条件：播完胡牌结算流程，进入结算界面；赢家结算：展示本局胡牌番型","problem":"结算流程承认流局也要展示本局分数，但小结算的触发条件只写“播完胡牌结算流程”，赢家结算又只定义胡牌番型；流局没有赢家，是否弹小结算、番型区/胡牌标记/承包区如何展示均未定义。","impact":"流局局面的小结算无法开发与验收；客户端可能不弹结算，或弹出没有赢家番型的空界面。","suggestion":"把小结算触发条件改为“胡牌或流局结算流程播完”；补充流局小结算版式：无赢家番型区、显示“流局”、四家分数与牢庄/承包标识的处理。","status":"待确认","has_detail":true},{"id":"PRD-060","title":"满8局结束本场与“达到局数进入大结算”冲突，收尾流程缺失","priority":"P1","type":"内容冲突","module":["本场结束与总战绩缺失"],"source_location":"本期开发范围；默认规则 > 计分与结算；二、功能详情 > 玩法规则 > 【局数】","original_text":"每小局保留小结算，未满8局则继续下一小局，满8局结束本场；达到所选局数时进入大结算；原文中的…大结算…仅作原文上下文","problem":"本期范围说满8局“结束本场”且大结算不在本期，【局数】又说达到局数“进入大结算”；第8局小结算之后是回房间、留桌、返回大厅还是直接解散，文档没有定义。","impact":"第8局结束后客户端没有下一步可走，整场结束无法验收；服务端房间状态也无法收敛。","suggestion":"明确本期满8局后的唯一收尾：是否弹大结算（若不做则说明替代界面/返回大厅）、房间是否保留、房主能否再开一场；同步修改【局数】的“进入大结算”表述。","status":"待确认","has_detail":true},{"id":"PRD-061","title":"骰子点数未决定开牌位，发牌固定从庄家起","priority":"P1","type":"逻辑错误","module":["发牌与开局流程缺陷"],"source_location":"局中信息 / 方位信息（骰子）；对局流程 / 发牌 / 发牌逻辑","original_text":"方位信息：“开局摇骰阶段，盘面中央显示两颗白色骰子。骰子翻滚后停稳，展示本次点数，各家看到同一结果。” 发牌逻辑：“以庄家为起点，按逆时针依次从牌序头部给每人同时发4张……最后从同一牌序给庄家再发1张。”","problem":"规则基准要求掷骰点数决定开牌位置并据此发牌；需求文档中骰子只作视觉表现，发牌恒定从庄家、牌序头部开始，骰子点数对牌局结果没有任何影响，与 5.4.1 和 5.6.1 冲突。","impact":"服务端发牌与规则不一致，掷骰结果无法复现和验证；开牌位缺失还会阻塞后续做牌、翻财神等依赖开牌位的版本能力。","suggestion":"明确两颗骰子点数到开牌位（哪一家、哪一墩）的换算规则、发牌起始牌位及取牌顺序，并在发牌逻辑中引用该结果；如本期确实固定从庄家起发，需要显式写明与规则的差异及原因。","status":"待确认","has_detail":true},{"id":"PRD-062","title":"缺首摸等待阶段，开局听牌提示无计算时点","priority":"P1","type":"逻辑错误","module":["发牌与开局流程缺陷"],"source_location":"对局流程 / 发牌 / 发牌逻辑（首个操作）、发牌UI以及动画表现（切入行牌）；局中信息 / 手牌信息（听牌标签）","original_text":"“首个操作。庄家直接进入首个操作阶段，首轮出牌前无需再摸1张。” “理牌完成后，骰盘区域切换为庄家出牌倒计时。庄家可开始操作，闲家等待。”","problem":"规则要求庄家取得第14张后进入首摸等待，并在该阶段对闲家 13 张起手、庄家 14 张“打哪张→听什么牌”计算听牌提示。文档没有首摸等待阶段，庄家理牌完即进入出牌倒计时，闲家起手 13 张听牌检测完全没有对应流程。","impact":"闲家起手即听牌无任何提示，庄家开局听牌提示缺少触发时机；开局信息缺失，听牌算法与客户端展示都无法按规则验收。","suggestion":"补首摸等待阶段：庄家取得第14张后暂停，服务端下发闲家13张听牌结果与庄家14张打牌听牌提示，再由庄家出牌；若本期不做该提示，需明确写出并说明客户端表现。","status":"待确认","has_detail":true},{"id":"PRD-063","title":"抢杠胡被限定庄闲关系，与不限庄闲冲突","priority":"P1","type":"逻辑错误","module":["胡牌判定口径缺陷"],"source_location":"【杠】抢杠胡行、【放铳】、本期开发范围","original_text":"他人加杠时，须在创房面板开启“庄闲放铳(庄三)”，并满足该选项的放铳条件，才可抢杠胡；／点炮和抢杠胡按庄闲放铳的适用条件判定","problem":"规则基准为：抢杠胡只要求玩法开启抢杠、庄闲放铳开关开启且当前三牢，且除杠牌者外其他玩家均可抢、不限庄闲关系。文档要求“满足放铳条件”，而放铳条件被定义为仅庄闲之间，导致闲家抢闲家杠被排除。","impact":"抢杠胡判定与原规则相反，闲闲之间抢杠被误拒，胡牌与赔付结果错误，用例无法通过。","suggestion":"改写抢杠条件：需三牢且开启庄闲放铳（庄三），除加杠者外其他玩家均可抢，不受庄闲关系限制；庄闲限制只用于点炮胡。","status":"待确认","has_detail":true},{"id":"PRD-064","title":"吃是否恒记1摊与闲闲摊数上限未按规则定义","priority":"P1","type":"逻辑错误","module":["三摊承包口径冲突"],"source_location":"2.2 名词介绍【摊】【承包】、【三摊承包】、【吃】、【碰】、本期开发范围","original_text":"吃、碰、明杠是否计摊，由创房面板的对应配置决定，例如“碰算摊”；／本期“启用三摊承包和吃碰禁手，碰算摊关闭”","problem":"规则基准规定吃恒记1摊（不受碰算摊影响），且三摊承包开启、双方均为闲家时该方向摊数须\u003c2才可吃/碰。文档把吃是否计摊交给配置决定，且吃/碰判定条件里没有“闲闲方向摊数≥2时禁止”的拦截点。","impact":"本期碰算摊关闭后，吃是否计摊、闲闲2摊是否封顶均无法确定，三摊承包可能永不触发或突破“闲闲最多2摊”，吃碰限制逻辑无法实现。","suggestion":"明确吃恒记1摊、碰仅在碰算摊开启时记1摊，并在吃、碰判定中补充“三摊承包开启且双方为闲家、该方向摊数≥2时禁止吃/碰”。","status":"待确认","has_detail":true},{"id":"PRD-065","title":"守庄禁止吃与明杠，与规则仅禁碰冲突","priority":"P1","type":"逻辑错误","module":["禁手与特殊规则缺陷"],"source_location":"三、对局流程 > 对局内通用提示 > 守庄","original_text":"触发场景：能碰：庄家，庄家下家打出的牌；能吃：庄家打出的牌；能明杠：庄家，庄家下家打出的牌；结果表现：不会弹出吃/碰/杠的按钮，客户端展示toast“守庄规则生效中”","problem":"规则基准规定守庄的受限范围是：3人局中，庄家上家不能碰庄家打出的牌；4人局中，庄家上家不能碰庄家和庄家下家打出的牌。规则同时明确只禁碰，吃、杠不受限。文档把吃牌与明杠也列为拦截对象，扩大了限制范围。","impact":"开发会实现错误的按钮屏蔽逻辑，守庄生效时玩家无法正常吃牌或杠牌，与规则基准不符，测试与验收无正确基准。","suggestion":"将触发场景改为仅“能碰：庄家、庄家下家打出的牌”，删除能吃与能明杠两行，结果表现改为不弹出碰按钮，并补充不同人数下被禁碰的弃牌来源。","status":"待确认","has_detail":true},{"id":"PRD-066","title":"飘财一圈内三摊需第4摊才承包，与规则冲突","priority":"P1","type":"逻辑错误","module":["三摊承包口径冲突"],"source_location":"二、功能详情 > 玩法规则 > 三摊承包；对局内通用提示 > 三摊落地","original_text":"飘财的玩家飘财时的一圈，当其他玩家抓打的牌导致飘财者吃碰达到三摊时，不触发承包机制，需要第4摊时才触发 / 触发场景：玩家A对玩家B的吃碰次数达到三次","problem":"规则基准为庄闲累计3摊即形成承包，没有飘财一圈内需第4摊的例外；文档自行增加该例外，同时又规定三摊落地动画在达到三次时播放，形成两处触发点不一致。","impact":"承包触发时机与三摊落地提示不同步，会出现动画已播但未形成承包或第4摊才提示的状态错乱，赔付延迟一摊。","suggestion":"删除该飘财例外；若确需保留，须在同一条中说明飘财一圈的起止界定、计数快照方式，以及与三摊落地动画、飘财限制的联动关系。","status":"待确认","has_detail":true},{"id":"PRD-067","title":"断线无超时推进规则，与“无托管+倒计时到0继续等待”组合会使整桌卡死","priority":"P1","type":"逻辑错误","module":["默认时间与超时兜底缺失"],"source_location":"3.3.3 玩家头像信息（玩家状态-离线状态）、3.3.1 方位信息（倒计时）、4.5 行牌操作（出牌）","original_text":"出牌倒计时归零时显示00，继续等待本家手动出牌。本核心流程按无托管处理，超时不触发自动出牌。；离线状态：……显示断线计时……每次断线重新计时","problem":"本方案明确不做托管，出牌倒计时归零后仍无限等待本家手动出牌；而断线只显示“断线计时、每次断线重新计时”，没有任何断线超时后的对局处理（继续等待/暂停/跳过/流局）。当断线玩家正处于本人出牌阶段或吃碰杠胡响应阶段时，对局无法推进到下一阶段，其他玩家也无法重连到“当前阶段”之外的任何状态。","impact":"一旦断线玩家轮到操作，整桌永久停滞，无法验证“重连可恢复当前阶段”，测试必然出现无法收敛的挂起用例。","suggestion":"补充断线超时规则：断线玩家处于可操作阶段时的等待上限（如沿用该阶段倒计时并按“过/不出”处理）、是否暂停整桌、超时后是否置为放弃本局，以及与“无托管”的优先级关系。","status":"待确认","has_detail":true},{"id":"PRD-068","title":"发牌动画被归给发牌消息，与规则的消息职责分工冲突","priority":"P1","type":"逻辑错误","module":["发牌与开局流程缺陷"],"source_location":"三.对局流程 / 局内流程 / 发牌（发牌UI以及动画表现）","original_text":"- **约7.5秒｜首批入场。**…自己的前4张牌先以背面出现在手牌区左侧，四个客户端按同一批次播放。|- **约7.7–8.1秒｜分批翻开。**自己的牌按乱序发牌的先后，从左到右分批进入手牌区","problem":"规则明确“发牌”消息本身不刷手牌、不播发牌动画，四家的发牌立起表现由紧随其后的第一次“摸牌”消息触发；文档却把整套发牌入场、翻开、理牌都挂在“发牌”上，且完全未定义“发牌→摸牌”两条消息的先后依赖关系。","impact":"客户端按文档实现会漏掉“首次摸牌驱动发牌动画”的链路，导致发牌动画不出或重复出现；测试也无法判断只收到发牌消息时该不该有动画。","suggestion":"补充协议联动说明：发牌消息只写入初始手牌/记牌器/财神数量并刷新余牌数；发牌入场、翻开、立起、理牌由紧随其后的摸牌消息触发，并写明两条消息乱序或缺失时的表现（只收到发牌消息不出现发牌动画）。","status":"待确认","has_detail":true},{"id":"PRD-069","title":"骰子点数与牌墙起点、发牌起点完全脱节","priority":"P1","type":"逻辑错误","module":["发牌与开局流程缺陷"],"source_location":"3.3.1 方位信息（骰子）、局内流程 / 发牌（发牌逻辑）","original_text":"- **四人牌组。**本期使用136张牌。以庄家为起点，按逆时针依次从牌序头部给每人同时发4张，重复3轮，每人先得12张。\u003cbr>|- 骰子翻滚后停稳，展示本次点数，各家看到同一结果。","problem":"规则中掷骰的作用是决定牌墙起点，牌墙消息还要处理起点奇偶（奇数减一）、记录牌墙起点与方向；文档只把骰子写成一次“展示点数”的动画，发牌固定从“牌序头部”开始，全文未出现牌墙起点、方向、起点奇偶处理。骰子点数在数据层没有任何用途。","impact":"无法确认牌墙起始位置与余牌数换算依据；若客户端需要按起点渲染牌墙/计算张数，将缺少必要数据定义，发牌与摸牌取牌位置也无法验收。","suggestion":"明确骰子点数如何换算牌墙起点与方向（谁计算、下发哪些字段），并补充牌墙消息接收的起点/方向/总张数、起点奇数减一的处理，以及余牌数与牌墙起点的换算关系。","status":"待确认","has_detail":true},{"id":"PRD-070","title":"手牌排序把白板排在最后，与财神靠左冲突","priority":"P1","type":"逻辑错误","module":["发牌与开局流程缺陷"],"source_location":"局内流程 / 发牌（发牌UI以及动画表现）、3.3.4 手牌信息","original_text":"本家立起时，13张主体手牌从左到右依次排列为万、条、筒、东、南、西、北、中、发、白。|风牌从左到右是东南西北中发白","problem":"本期固定白板财神，白板即财神。文档规定的立起顺序把“白”放在最右侧，即财神永远排在手牌最右；规则要求财神牌重新排序后靠左。两者对手牌排序结果给出相反结论。","impact":"发牌理牌、后续摸牌插入、听牌/禁打判定所依据的手牌顺序会与预期不一致，UI核对与验收标准冲突。","suggestion":"明确本期白板财神下的手牌排序规则：财神（白板）是否强制靠左、靠左后其余牌的花色顺序如何排列，并同步修正发牌立起顺序与手牌信息表。","status":"待确认","has_detail":true},{"id":"PRD-071","title":"暗杠牌面暴露给其他玩家，与规则基准冲突","priority":"P1","type":"逻辑错误","module":["吃碰杠胡操作不完整"],"source_location":"二、功能详情 > 规则详情 > 基础操作及规则 > 【杠】 > 暗杠","original_text":"「暗杠以3张背面、顶部1张正面的方式展示，其他玩家可通过正面牌识别该暗杠的牌面。」","problem":"规则基准规定暗杠对其他玩家不可见，需求改为可通过正面牌识别，属于与基准冲突的行为变更，且未同步说明其他家记牌器与听牌剩余张数的扣减口径。","impact":"暗杠可见性实现与规则引擎不一致，其他玩家可据此推算手牌，导致听牌张数计算与算张逻辑出错，测试无法判断正确态。","suggestion":"按规则保持暗杠牌面对其他玩家不可见（仅本家可见）；若确需展示1张正面，须显式声明为规则变更，并补充记牌器扣减、听牌剩余张数与牌河高亮的影响。","status":"待确认","has_detail":true},{"id":"PRD-072","title":"倒计时最后3秒颜色与规则冲突，缺提示音与催促提示","priority":"P1","type":"逻辑错误","module":["提示与收尾规则缺失"],"source_location":"三.对局流程 > 局内信息 > 方位信息 > 倒计时","original_text":"「中央用两位数字显示当前阶段剩余秒数，按秒递减，普通数字为蓝青色，03、02、01、00为黄色。阶段开始时按该阶段配置的时间起始秒数刷新」","problem":"规则定义最后3秒为红色字体并播放倒计时提示音，需求写为黄色；规则要求的“超过8秒未操作提示玩家尽快操作”在需求中完全没有描述。","impact":"UI与音效按需求实现会与规则引擎表现不一致；无托管场景下超时不会自动出牌，缺少催促提示会造成玩家卡在出牌阶段而无感知，影响验收。","suggestion":"以规则为准统一为红色字体+倒计时提示音，并补充超8秒催促提示的文案、位置、触发频率与消失条件。","status":"待确认","has_detail":true},{"id":"PRD-073","title":"开局动画播放条件与流程放行未与规则对齐","priority":"P1","type":"定义歧义","module":["发牌与开局流程缺陷"],"source_location":"局内流程 / 对局开始（触发逻辑、动画展示及流程）","original_text":"- 仅在开房后的首次开局播放「对局开始」动画。\u003cbr>- 首次开局时，先等待云检测流程结束后再播放。|同一场内，后续小局直接进入摇骰发牌。","problem":"规则中开局动画的播放条件是“第一局或非包厢”，并以动画结束作为向服务端确认、推进流程的时机；文档只写“开房后的首次开局”，既未定义好友房是否属于包厢，也未定义动画播放/跳过时如何确认放行。","impact":"后续小局是否应播开局动画、播放时流程何时放行均无法确定，可能导致每局节奏被拉长或流程卡住；测试无法判定跳过动画时的正确状态。","suggestion":"明确好友房是否属于包厢，据此给出开局动画的完整播放条件；补充动画结束或被跳过时向服务端确认一次的时机与状态表现（如跳过则四个头像直接显示）。","status":"待确认","has_detail":true},{"id":"PRD-074","title":"流局在小结算的输赢文案与分数展示未定义","priority":"P1","type":"定义歧义","module":["流局判定与展示缺失"],"source_location":"三、对局流程 / 结算流程 / 流程明细（对局结果阶段展示）、三、结算界面 / 小结算界面 / UI交互以及说明 第3、4项；基础名词-流局","original_text":"|对局结果阶段展示|- 前置条件：对局结束后\u003cbr>- 可以是出现流局，对局结束\u003cbr>- 也可以是播放完胡牌番型后\u003cbr>- 展示本局所有玩家的分数|；|3|输赢显示|- 赢了显示“恭喜获胜”\u003cbr>- 输了显示“遗憾失败”","problem":"规则要求结算按“自摸/点炮/流局”区分结束类型并有对应横幅，小结算也需按结束类型组装数据。需求文档虽把流局列为结算触发条件，但小结算只有“恭喜获胜/遗憾失败”二元文案，流局既无胡家也无输赢方，且流局各家得失分（是否全为0、是否按庄闲赔付）没有任何说明；流局横幅/结束类型展示也未定义。","impact":"流局场景的小结算无法渲染（所有玩家显示“遗憾失败”还是都不显示），流局计分结果无法验收，可能引发玩家对分数争议。","suggestion":"补充流局结算要求：结束类型标识（流局横幅文案与展示位置）、流局时各家得失分取值规则（0分或按规则）、小结算中流局玩家的输赢文案与分数颜色、以及流局是否计入小结算的“赢家结算”区。","status":"待确认","has_detail":true},{"id":"PRD-075","title":"飘财缺飘等级与敲响判定，无法计算财飘倍数","priority":"P1","type":"描述不完整","module":["飘规则与展示不完整"],"source_location":"二、功能详情 > 基础名词和概念解释 >【飘】；胡牌番型介绍 > 番型介绍（财飘/双财飘/三财飘）；基础操作及规则 >【杠】 > 杠飘","original_text":"玩家在自己的出牌阶段打出1张财神后，无论此前是否处于爆头状态，均触发该玩家的一次“飘财” / 财飘 4倍 打出1张财神下一圈爆头 / 双财飘 8倍 连续打出2张财神下一圈爆头","problem":"规则要求打出财神后手牌敲响才使飘等级加1，否则飘等级归0并清空杠链；打出非财神时飘等级归0；吃、碰不清飘等级但会清杠链。文档只写打出财神即触发飘与连续打出N张财神，缺少敲响判定、归0条件与吃碰清杠链，也未出现飘财广播或提示。","impact":"财飘、双财飘、三财飘与杠飘、二连杠等复合倍数的判定条件不完整，倍数可能算错；无广播则玩家无法感知飘财限制的生效与解除范围。","suggestion":"补充飘等级判定表：打出财神且手牌敲响则等级加1并广播；未敲响或打出非财神则等级归0并清杠链；吃、碰清杠链不清飘等级；给出飘等级到财飘、双财飘、三财飘倍数的映射，以及广播/提示的触发时机与文案。","status":"待确认","has_detail":true},{"id":"PRD-076","title":"交叉引用指向不存在章节，待确认项未登记，范围边界不清","priority":"P1","type":"描述不完整","module":["文档规范章节缺失"],"source_location":"「方位信息」倒计时行、行牌操作（修改对比版）出牌行、「发牌」详述、「对局开始」触发逻辑、「定庄」后续轮庄行、牢庄名词条","original_text":"「按4.5无托管规则继续等待本家手动出牌」「首个操作阶段按4.5、4.6处理」「云检测流程可查看后续对应模块」「按创房选项及 至 判定」「具体选项见后续创房模块」","problem":"1. 现状：正文多处引用 4.5、4.6、2.3.2.7~2.3.2.8、云检测流程、创房面板、设置模块，但本文没有这些章节。\n2. 缺什么：引用是否存在的核查记录，以及每条引用的处理结论。\n3. 后果：开发按引用找不到规则来源，也无法判断是否本期实现。","impact":"无托管等待、云检测时序、牢数取值等关键行为只能靠猜；验收时无法界定哪些引用属于本期。","suggestion":"1. 新增「引用核查表」，必填列：引用位置 ／ 引用原文 ／ 目标章节是否存在 ／ 本期是否适用 ／ 处理方式（补写／改文字／标注不实现）。\n2. 格式模板：\n\n| 引用位置 | 引用原文 | 目标是否存在 | 本期适用 | 处理方式 |\n| --- | --- | --- | --- | --- |\n| 方位信息倒计时 | 按4.5无托管规则 | 否 | 是 | 补写无托管等待小节 |\n\n3. 统一编号规则：一、二、三级标题分别带 X、X.Y、X.Y.Z 编号，正文引用必须与标题编号一致。\n4. 本期不实现的引用，改为「本期不实现」并在待确认清单登记，不留悬空指向。\n5. 验收口径：全文检索「见」「按」「后续模块」不再出现无法定位的引用。","status":"待确认","has_detail":true},{"id":"PRD-077","title":"满8局后本场如何收尾未定义，大结算是否播放不明","priority":"P1","type":"描述不完整","module":["本场结束与总战绩缺失"],"source_location":"「默认规则」本期固定生效；「本期开发范围」；「玩法规则 / 【局数】」","original_text":"「**计分与结算。**底分1，分数无封顶。每小局进入小结算，满8局结束本场。」／「本期只做游戏内核心流程。原文中的…大结算和非核心桌面功能…仅作原文上下文。」／「【局数】- …达到所选局数时进入大结算。」","problem":"文档一处说满8局「结束本场」，一处说达到所选局数「进入大结算」，开头又说大结算仅作原文上下文；第8局小结算之后到底播大结算、还是直接结束解散房间，没有任何描述。","impact":"测试无法编写第8局结算用例，开发无法确定第8局收尾流程，属于核心流程断点。","suggestion":"明确写出第8局小结算后的收尾流程（是否播大结算、展示何种内容、结束后回房间还是解散），若本期不做则写明「不播大结算，小结算后结束」，并登记到现状差异表与待确认清单。","status":"待确认","has_detail":true},{"id":"PRD-078","title":"未声明杠不单独计分，杠后分数口径缺失","priority":"P1","type":"描述不完整","module":["结算流程不完整"],"source_location":"「算分规则 / 结算算分」；「结算界面 / 小结算界面 / UI交互以及说明」","original_text":"「最终得分=底分×倍数×庄闲倍数」…「杠牌要垒起来」（全文未出现「杠分」「刮风下雨」等杠计分说明，仅在杠牌复用说明中写「主要区别删除刮风下雨」）","problem":"规则基准的现状口径是「杭麻无独立杠分，杠后胡按杠开番型计算」，但需求文档只在杠牌复用段落提了「删除刮风下雨」，结算公式中完全未说明杠是否产生独立分数，属于口径缺失。","impact":"开发可能实现杠分结算，导致每局分数与预期不符；测试无法验证「未胡牌开杠不产生分数」这一边界。","suggestion":"在结算算分中明确补充「本玩法无独立杠分，杠后胡牌按杠开/杠爆/杠飘番型计算；未胡牌的开杠不产生任何分数」，并加入验收场景。","status":"待确认","has_detail":true},{"id":"PRD-079","title":"抢杠胡是否计摊、是否新增摊数未说明","priority":"P1","type":"描述不完整","module":["三摊承包规则缺失"],"source_location":"「基础操作及规则 / 【杠】抢杠胡」；「玩法规则 / 【三摊承包】」","original_text":"「他人加杠时，须在创房面板开启“庄闲放铳(庄三)”，并满足该选项的放铳条件，才可抢杠胡。」／「当玩家A对玩家B累计达到3摊时，触发“承包机制”」","problem":"规则基准明确抢杠胡时副露还原为碰、不新增摊数；需求文档在三摊承包与摊的定义中均未说明抢杠胡是否计摊，而抢杠胡与三摊承包均为本期启用规则，二者交叉行为无口径。","impact":"抢杠胡后是否触发/推进三摊承包无法判定，承包与倒承包结算可能出现分歧，测试无法编写交叉用例。","suggestion":"在【三摊承包】或抢杠胡条目中补一句「抢杠胡不计摊、不新增摊数，被抢杠的加杠副露按碰计算」，并在验收场景中给出对应牌例。","status":"待确认","has_detail":true},{"id":"PRD-080","title":"小结算触发仅写播完流程，未定固定3秒延迟","priority":"P1","type":"描述不完整","module":["结算流程不完整"],"source_location":"三、结算界面 / 小结算界面 / 触发逻辑","original_text":"|小结算|触发条件|**播完胡牌结算流程**，进入结算界面|","problem":"规则要求小结算在胡牌动画播完后“固定延迟约3秒”弹出，且该3秒与飘分动画时长无联动、不依赖动画回调（需设兜底）。需求文档写的是“播完胡牌结算流程，进入结算界面”，属于事件回调式描述，既没有具体秒数，也没说明以哪个节点起算、动画异常时如何兜底。","impact":"实现方可能做成飘分动画结束回调触发，一旦动画丢帧或时长调整就会出现分数没播完就弹结算、或长时间卡住不弹，测试也没有可验收的时点。","suggestion":"明确触发基准：以哪个事件为起点计时（如收到结算/番型动画结束）、固定延迟多少毫秒、是否与飘分动画互不依赖、动画异常时的兜底时长；并补充回放/重连时的差异（收到结算直接弹出）。","status":"待确认","has_detail":true},{"id":"PRD-081","title":"摊数与承包关系的统计周期和清零时机未定义","priority":"P1","type":"描述不完整","module":["三摊承包规则缺失"],"source_location":"二、功能详情 > 基础名词和概念解释 > 【摊】【承包】；二、功能详情 > 玩法规则 > 【三摊承包】；三、对局流程 > 结算界面 > 小结算界面 > UI交互 > 承包的标识","original_text":"玩家A使用玩家B打出的牌完成1次吃、碰或明杠，按本局创房配置计入A从B取得的摊数；当玩家A对玩家B累计达到3摊时，触发承包机制","problem":"文档只写“累计3摊”，没有说明摊数是在本小局内累计还是跨8局累计，也没有说明承包触发后、流局后、换庄后是否清零或继承。“按本局创房配置”说的是房间配置，不是统计周期，无法据此判定。","impact":"第2局起是否继承3摊无法实现；同一牌局可能反复触发承包或永不触发，结算差异巨大，小结算的承包标识也无法确定显示哪一局的关系。","suggestion":"明确“摊数仅在本小局内累计，每小局开始清零，承包关系随小局结束失效”（或明确跨局继承），并补充承包触发后是否继续累计、流局/换庄是否重置的规则和示例。","status":"待确认","has_detail":true},{"id":"PRD-082","title":"缺功能点编号与索引表，需求、用例、缺陷无法互相回指","priority":"P2","type":"需求缺失","module":["文档规范章节缺失"],"source_location":"二、功能详情、三.对局流程、结算流程、辅助功能","original_text":"各规则表只有「功能模块｜模块类型｜说明」「功能模块｜编号｜内容｜说明」等表头，其中「编号」表示界面元素序号（如小结算 1~8 项），全文没有功能点编号与索引表。","problem":"1. 现状：内容按章节组织，同一条规则分散在多处，例如三摊承包同时出现在名词【摊】【承包】、玩法规则【三摊承包】与通用提示「三摊落地」。\n2. 缺什么：稳定的功能点 ID、分类与编号范围、索引表。\n3. 后果：需求评审无法按功能点核对覆盖度。","impact":"测试用例与缺陷单无法回指需求条目；规则变更时难以评估影响范围。","suggestion":"1. 位置：正文开头新增「## 功能点索引」章节。\n2. 必填列：功能点 ID ／ 名称 ／ 分类 ／ 所在章节 ／ 一句话规则 ／ 验收方式。\n3. ID 规则：分类前缀加三位序号，例如 OPEN-001（开局）、PLAY-001（摸打）、SPEC-001（特殊规则）、SETTLE-001（结算）、RELINK-001（重连）。\n4. 格式模板：\n\n| 功能点 ID | 名称 | 分类 | 所在章节 | 一句话规则 | 验收方式 |\n| --- | --- | --- | --- | --- | --- |\n| PLAY-001 | 摸牌 | 行牌 | 三.对局流程/摸牌 | 轮到本家自动摸一张并播放光效 | AC 用例回指 |\n\n5. 各规则小节末尾补该节功能点编号清单，或直接在表头加「功能点 ID」列。\n6. 验收口径：每个规则章节至少 1 个功能点 ID，用例与缺陷单可回指。","status":"待确认","has_detail":true},{"id":"PRD-083","title":"缺状态标记约定与修订记录格式，未决项无法闭环","priority":"P2","type":"需求缺失","module":["文档规范章节缺失"],"source_location":"全文；发牌UI以及动画表现；修订历史记录","original_text":"「待确认。发牌与理牌的音效资源及触发时点本方案不添加。」（全文唯一一处「待确认」标注）","problem":"1. 现状：没有标记约定说明，只有一处「待确认」文字。\n2. 缺什么：统一的标记词表、标注位置规则、修订记录列定义，以及与待确认清单的编号联动。\n3. 后果：未决项无法统计与关闭。","impact":"评审后未决项容易丢失，开发按各自理解实现；无法统计关闭率。","suggestion":"1. 新增「标记约定」表，必填列：标记 ／ 含义 ／ 使用场景 ／ 是否阻塞验收。\n2. 建议标记词：【本期】【不实现】【待确认】【待核实】【复用旧版】，正文中位于句首或段末，同一段只允许一个主标记。\n3. 修订记录改为固定列：版本 ／ 日期 ／ 修改人 ／ 修改内容 ／ 影响范围。\n4. 每条【待确认】必须带清单编号（如 P-01），与「待确认清单」一条一对应。\n5. 格式模板：\n\n| 标记 | 含义 | 使用场景 | 是否阻塞验收 |\n| --- | --- | --- | --- |\n| 【待确认】 | 口径未定 | 规则或资源未决 | 是 |\n\n6. 验收口径：全文检索「待确认」，每条都能回指清单编号并有结论。","status":"待确认","has_detail":true},{"id":"PRD-084","title":"缺少起胡门槛说明（是否要求至少1番）","priority":"P2","type":"需求缺失","module":["胡牌判定口径缺陷"],"source_location":"二、功能详情 游戏规则概述、胡牌番型介绍/番型分类、番型介绍","original_text":"「番型分类：【基础番型】满足胡牌规则的最基础的胡牌番型」；「1｜基础番型｜平胡｜1倍｜4副顺子+1副对子」；「最终得分=底分×倍数×庄闲倍数」。全文未出现起胡门槛（如「≥1番」）及 0 番牌型的处理说明。","problem":"规则基准要求明确起胡门槛，本文只给出番型与倍数，未说明是否要求至少 1 番、平胡是否即最小起胡番型，也未说明无番或 0 倍牌型是否可胡。","impact":"胡牌授权与结算倍数缺少下限约束，开发与测试可能对「0 番是否可胡」理解不一致，边界用例无法判定。","suggestion":"在规则概述或番型章节补「起胡要求：≥1番（平胡即满足）」等明确口径，并说明 0 番牌型的处理。","status":"待确认","has_detail":true},{"id":"PRD-085","title":"缺文档信息表：版本、状态、适用玩法、读者、编写依据均未声明","priority":"P2","type":"未分类","module":["文档规范章节缺失"],"source_location":"文档开头（标题）、修订历史记录","original_text":"","problem":"","impact":"","suggestion":"标题下补「文档信息」表：版本 ／ 状态 ／ 适用玩法（好友房核心流程 4 人 8 局）／ 目标读者 ／ 编写依据 ／ 维护责任人 ／ 更新规则。","status":"待确认","has_detail":false},{"id":"PRD-086","title":"财神计数口径缺失，七对/清七对边界无法判定","priority":"P2","type":"未分类","module":["财神与番型判定口径缺陷"],"source_location":"【财神】、番型序号10（七对）、14（清七对）、35~50（七客系列）","original_text":"","problem":"","impact":"","suggestion":"
