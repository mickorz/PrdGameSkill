business_rules:
  - 可选值：不漂 / 漂 1 / 漂 2 / 漂 5 / 漂 10；属玩家局内选择，非创房默认值，故 value 为 null。
  - 自由漂模式下每小局开局后玩家在该范围内选择；首局定漂仅大局第一小局选择；固定漂与不漂无逐局选择。
  - 漂分收分公式 =（胡牌玩家漂数 + 该玩家漂数）× 底分；漂分是加分项，不受封顶。
