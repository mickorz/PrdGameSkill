  - "影响通道：牌型分通道与加倍项通道受封顶截断，加分项通道（漂 / 马 / 坎 / 杠）不受封顶，加分项全部叠加在封顶截断之后。"
  - "封顶只截断「番型 × 加倍项」；上楼为加倍项、受封顶约束。"
