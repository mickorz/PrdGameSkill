loop:
  - 开局准备：房主创房、玩家逆时针入座（座位固定，2 人一上一下 / 3 人左·下·右）
  - 打漂：按漂模式选漂（不漂跳过、固定漂直接展示、首局定漂仅大局第一小局、自由漂每小局）
  - 定庄摇骰：随机庄或房主庄（续局按轮庄规则），骰子停转定方位（庄为东逆时针），判定并展示上楼
  - 发牌理牌：从庄家位逆时针发牌，庄 14 闲 13，发牌后余量 3 人 44 / 2 人 57，自动理牌立起
  - 行牌：逆时针摸打循环，响应优先级吃胡 / 自摸 / 抢杠胡 > 碰 / 杠，含亮倒扣牌、危牌限制、杠后补牌与杠上杠
  - 结束判定：有玩家胡牌（自摸 / 点炮 / 抢杠胡等）或可摸牌数 = 0 荒庄
  - 和牌后：触发买马则翻剩余牌计马分（荒庄不买马；荒庄走查叫与亮倒荒庄赔付）
  - 小结算：汇总胡分、杠分（实时已结）、漂分、马分、坎分等分项
  - 续局：按轮庄规则（胡者坐庄 / 一炮多响点炮者坐庄 / 荒庄连庄）进入下一小局，最后一小局进入大结算
