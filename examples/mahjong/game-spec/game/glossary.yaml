terms:
  - term: 卡五星
    definition: 本玩法正式名（基准变体）；也是基础番型，指 4-6 卡 5 的坎张听 5 听牌形态。
  - term: 亮倒
    definition: 听牌后明牌、不可换牌、只能摸打；输赢均计番型分 ×2，不影响加分项；胡的牌成为其他未亮倒玩家的危牌。
  - term: 扣牌
    definition: 亮倒的同时判断，把去掉后仍满足「打出一张非危牌后可听牌」的刻子扣下（四张相同扣 3 张），他人不可见；亮倒后不可再扣。
  - term: 危牌
    definition: 同一小局中未亮倒玩家手中为任一亮倒玩家胡牌的牌；未亮倒玩家不可打出、不可明杠（补杠），手中全是危牌时可打出。
  - term: 漂
    definition: 开局前选定的额外底分倍数；收分 =（胡牌玩家漂数 + 该玩家漂数）× 底分，逐人计算。
  - term: 打漂
    definition: 漂的选择环节，含不漂 / 固定漂 / 首局定漂 / 自由漂四种模式（固定漂下拉默认 2）。
  - term: 买马
    definition: 胡牌后翻剩余牌、按牌面或命中集计分的附加计分步骤；自摸收所有玩家；荒庄不买马。
  - term: 马数
    definition: 买马的翻牌张数与计分方式（买一 / 买一送一 / 买 5 马 / 买 6 马）。
  - term: 数坎
    definition: 胡牌后按刻子与杠子数量加分：暗刻 +1、明杠直杠 +1、暗杠 +2、手中四张 +2（倍底分），查叫时也算坎分。
  - term: 明杠
    definition: 本玩法即通用「补杠 / 加杠」：碰牌后摸到第 4 张开杠，其他玩家各付 1 倍底分，可被抢杠胡。
  - term: 直杠
    definition: 手中已有 3 张、他人打出第 4 张时开杠；打出牌的玩家支付 2 倍底分，不可被抢。
  - term: 暗杠
    definition: 非碰牌后的出牌阶段手中 4 张相同自行开杠，其余玩家各付 2 倍底分；暗杠的牌其余玩家可见（三张反面 + 顶部牌面）。
  - term: 补
    definition: 杠后从牌堆倒序摸一张，视为摸牌，牌堆剩余张数额外减 1；补牌置于手牌最右侧。
  - term: 杠上杠
    definition: 连杠，杠分按 2^(连杠次数−1) 翻倍，可跨玩家；补牌后打出无人杠则重置。
  - term: 回手杠
    definition: 碰后本小局不可再明杠该牌；已碰的牌摸到第 4 张必须立刻杠，否则本小局不能再明杠。
  - term: 抢杠胡
    definition: 他人明杠（补杠）的牌恰为自己胡牌时抢胡，×2（可勾选 ×4）；明杠玩家视为未杠成功、杠上杠中断；属点炮类。
  - term: 漏胡
    definition: 可胡而不胡（过胡）；漏胡玩家摸牌前不可胡牌，摸牌（含杠后补牌）后解除。
  - term: 过碰
    definition: 过碰后、轮到自己回合前，其他玩家再打出同张牌时不可再碰（按过手至摸牌解除口径推导）。
  - term: 荒庄
    definition: 牌堆摸完（可摸牌数 = 0）仍无人胡牌的流局；杠分不退还、不买马。
  - term: 查叫
    definition: 荒庄后未听牌玩家向听牌玩家赔付（需勾选开启）；查叫时算坎分但不计胡的那张牌。
  - term: 首亮赔付
    definition: 亮倒荒庄赔付：荒庄后首个亮倒玩家赔其他所有玩家 1 倍底分（卡五星专属）。
  - term: 封顶
    definition: 本玩法仅封「番型 × 加倍项」，漂 / 马 / 坎等加分项无上限。
  - term: 上楼
    definition: 加倍项：上一小局荒庄或一炮多响、或开局骰子两点一致，本小局倍数 ×2，可叠加至 ×4；不可突破封顶。
  - term: 对亮
    definition: 胡牌双方均亮倒；默认仅计一次亮倒 ×2，勾选「对亮 ×2」后计两个亮倒（共 4 倍）。
  - term: 双亮
    definition: 仅 3 人可勾选；已有 2 个玩家亮倒时第三人无需亮倒也能胡牌；与「胡牌必须亮倒」互斥。
  - term: 一炮多响
    definition: 一张牌致多家胡牌，各家分别计分；计入一次点炮，点炮玩家坐庄并触发上楼。
  - term: 手抓一
    definition: 其余牌全在碰杠区、手牌只剩单吊的牌型（单钓 / 金钩钓）。
  - term: 底分
    definition: 结算的最小乘算单位，所有倍数表述为「N 倍底分」。
