id: GAME-FR-004
type: game_feature
name: 碰杠操作按钮与牌面展示
status: proposed
authority: fixed
description: 碰杠按钮组、可碰杠牌高亮暗置、方位箭头与补标记、暗杠牌背摆放、动画同时补牌、抢杠等待不播动画、多杠选择框
source:
  kind: original
  document: source/03-打牌操作.md
  section: 5.5 杠的界面与展示
  page: null
  quote: 手牌右上方显示【碰】+【杠】+【过】
preconditions:
  - 玩家存在碰/杠操作机会
inputs:
  - 碰/杠/过操作，多杠时的选牌点击
outputs:
  - 按钮组展示、刻子摆放、方位箭头、杠牌动画
business_rules:
  - 碰：手牌右上方显示【碰】+【过】；手牌中可碰牌高亮、其他暗置（如果有胡则不需要暗置）；碰牌上方显示方位箭头，指向对应碰牌方位（碰对家向上、碰上家向左、碰下家向右）
  - 直杠：手牌右上方显示【碰】+【杠】+【过】；点杠方位箭头（对家向上、上家向左、下家向右）
  - 明杠（补杠）：手牌右上方显示【杠】+【过】；杠牌上方显示【补】
  - 暗杠：手牌右上方显示【杠】+【过】；摆放为下三张牌背、上一张牌面
  - 碰杠刻子从左往右根据本局操作顺序放置，放于手牌左侧，展示牌面
  - 杠牌动画播放同时摸牌（补牌）
  - 边界：补杠且有人选择是否抢杠胡时，不播放动画、不播放飘分，直到抢杠胡玩家完成选择再根据杠和胡走对应流程
  - 多杠状态：手牌右上方显示「可杠牌选择框 +【杠】+【过】」；点击选择需要杠的牌；点击【过】放弃此次操作并隐藏杠选择；可直接点击出牌，不用选择；配置开启托管时超时默认不杠
normal_flow:
  - 操作机会出现 -> 按钮组展示 -> 玩家选择 -> 刻子按操作顺序置于手牌左侧 -> 播放动画同时补牌
exception_flow:
  - 补杠遇抢杠胡询问 -> 暂停动画与飘分，等待抢杠胡玩家选择
state_transitions: []
