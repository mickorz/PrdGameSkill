id: GAME-FR-007
type: game_feature
name: 亮倒打牌界面
status: proposed
authority: fixed
description: 亮倒后专用打牌界面：扣牌带扣标签遮罩不可打出，可听牌亮起带听牌标签其余遮罩，提示请选择胡口，取消等同过
source:
  kind: original
  document: source/03-打牌操作.md
  section: 10.4 亮倒的界面流程
  page: null
  quote: 手牌中打出后可听的牌会亮起，并带听牌提示标签；其余牌全部带遮罩。
preconditions:
  - 玩家已确认亮倒并完成扣牌判断
inputs:
  - 对界面内各牌的点击操作
outputs:
  - 正常执行提牌出牌、放炮提示阻断或无效果
business_rules:
  - 进入流程：点击【亮】后所有碰杠胡交互按钮消失（听牌提示箭头不消失），无可扣刻子时直接进入本界面
  - 扣住的牌带【扣】标签且带遮罩，不可打出
  - 手牌中打出后可听的牌亮起并带听牌提示标签，其余牌全部带遮罩
  - 危牌不会被排除在「亮起」之外、不加遮罩（显示层口径：危牌正常带【危】标签、正常计算）；点击时仍按危牌规则阻断出牌（交互层）
  - 扣下的牌不带听牌提示标签；危牌被扣下时标签切换为【扣】
  - 出现提示「请选择胡口」；右上角出现取消按钮
  - 交互：点击取消等同于【过】，回到正常出牌界面（【扣】标签消失、遮罩消失、正常展示所有听牌提示、可正常提牌出牌）；点击亮起的非危牌按玩家设置正常执行提牌出牌；点击亮起的危牌出现提示并阻断出牌；点击有遮罩的牌无效果
normal_flow:
  - 进入界面 -> 亮起可听牌并提示选择胡口 -> 点击亮起非危牌 -> 正常提牌出牌
  - 亮倒确认 -> 亮倒打牌界面
  - 亮倒打牌界面 -> 取消 -> 正常出牌界面
exception_flow:
  - 点击亮起危牌 -> 提示「打出该牌将会放炮！」并阻断
  - 点击取消 -> 等同【过】，回正常出牌界面
state_transitions: []
