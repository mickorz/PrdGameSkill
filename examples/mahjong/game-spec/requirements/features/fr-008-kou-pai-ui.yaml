id: GAME-FR-008
type: game_feature
name: 扣牌界面
status: proposed
authority: fixed
description: 半透明遮罩加请选择扣牌标题，候选单张带选中圆圈，取消与选择完成按钮及对应交互反馈
source:
  kind: original
  document: source/03-打牌操作.md
  section: 11.2 扣牌界面
  page: null
  quote: 手中所有可以扣的牌，以单张形式展示在标题下方；顺序与手牌中左到右顺序一致；每张牌右下角有选中圆圈
preconditions:
  - 亮倒触发的扣牌判断存在可扣的刻子
inputs:
  - 候选牌点击、【取消】、【选择完成】
outputs:
  - 扣牌选择结果，切换到扣后展示或回退
business_rules:
  - 遮罩：自己手牌上方展示半透明遮罩；标题为【请选择扣牌】
  - 候选区：手中所有可以扣的牌以单张形式展示在标题下方，顺序与手牌中左到右顺序一致，每张牌右下角有选中圆圈
  - 手牌区：可扣的牌不变，其余牌全部带遮罩
  - 按钮：遮罩下方展示【取消】【选择完成】两个按钮
  - 点击候选牌：在选中/取消选中之间切换；选中时右下角圆圈出现绿色对号，同时手牌中对应三张牌出现【扣】标签；取消选中时两者同步消失
  - 点击【取消】：扣牌界面消失，且桌面交互按钮不会再出现（等同于【过】）
  - 点击【选择完成】：判断扣下所有选中刻子后剩余牌是否可打出一张牌后听牌；不可以则取消所有选中并弹出提示「当前扣牌没有胡口！」；可以听牌则界面消失，切换到「亮倒-打牌」界面
  - 扣牌后展示：自己视角非「部分亮」时扣牌标签从【暗】改为【扣】（部分亮时按【暗】展示）；他人视角扣住的牌背面朝上；此时各玩家摸得的牌位置不变且仍为立着
normal_flow:
  - 扣牌判断有候选 -> 打开扣牌界面 -> 选择候选 -> 选择完成 -> 切换到「亮倒-打牌」界面
  - 亮倒 -> 扣牌界面 -> 亮倒打牌界面
  - 扣牌界面 -> 取消 -> 正常出牌界面
exception_flow:
  - 选择完成后不满足听牌 -> 取消所有选中，提示「当前扣牌没有胡口！」
  - 点击【取消】 -> 界面消失且桌面交互按钮不再出现（等同【过】）
