id: GAME-FR-009
type: game_feature
name: 对局桌面布局与开局定庄展示
status: proposed
authority: fixed
description: 桌面座位规则、无牌墙、开局动画、定庄标志、方位信息区（骰子、方位、倒计时、上楼）、玩家头像信息与发牌理牌展示
source:
  kind: original
  document: source/08-UI交互.md
  section: 二、对局前 · 桌面布局 / 三、开局 · 定庄 · 方位信息 / 四、玩家头像信息 / 五、发牌与手牌区域
  page: null
  quote: 房主创建房间后，后续加入房间的玩家按逆时针顺序入座，开局后与房主的逆时针顺序关系相同；座位固定
preconditions:
  - 玩家进入对局桌面（创房后加入或加入房间）
inputs:
  - 开局流程触发（摇骰、发牌、定庄）
  - 玩家点击自己或他人头像
outputs:
  - 桌面座位、方位信息区、玩家头像信息、手牌区的显示与动画
business_rules:
  - 所有卡五星无牌墙，设置中也没有牌墙开关；整体布局复用杭麻好友房
  - 2人固定一上一下（下方自己、上方对家），方位东/南；3人固定左、下、右（下方自己、左侧上家、右侧下家），方位东/南/西
  - 开局动画仅每次开房首局播放：玩家信息由小到大出现、上移离屏、屏外进入、中间显示对局开始、快速减淡消失后进入摇骰发牌；之后开局直接进入摇骰发牌
  - 定庄：发牌开始后、骰子滚动停下时，庄家头像上直接出现【庄】标志，无过程动画
  - 方位：确认庄家并开始摸牌时显示（庄为东，其他玩家按逆时针依次显示南西），之后不再变化；轮到出牌对应方位闪烁高亮，他人碰杠胡不改变高亮；对局结束无方位高亮
  - 倒计时最多两位数，默认蓝色，03/02/01/00 为黄色；自己视角有碰杠胡操作时倒计时重置，他人视角无变化
  - 骰子发牌时显示，两骰环绕转动，用户拿到所有手牌后停止并展现数字，停留1秒后消失；上楼符合时骰子停止同时在其上方展示上楼X2或上楼X4
  - 头像信息：庄标右上方、房主标记、积分（5位数以个为单位、6位数以万为单位，可为负）、昵称常显最多10字符（超出第7~8字符显示..）、操作流光、离线断线图标与00:00计时（每次断线重新计时）、托管图标（自动摸打的托管不显示）、漂标记【漂0】至【漂10】
  - 发牌从庄家位逆时针，每人4张/次共3轮，再每人1张，最后庄家1张；发牌总时长1秒；己方牌扣桌面0.1秒后向上翻开0.1秒，他人牌仅出现后立起无翻开动画
  - 手牌从左至右筒、条、中、发、白，1~9；庄家14张末牌最右侧保持距离置摸牌位，闲家13张；发牌完毕自动理牌0.5秒；出牌后插入式0.5秒或平移式0.3秒理牌
  - 点击自己或他人头像弹出局内个人信息（他人可用互动道具）
normal_flow:
  - 进入桌面 -> 首局播放开局动画 -> 摇骰发牌 -> 定庄标志 -> 自动理牌 -> 显示方位开始行牌
  - loading -> opening -> dealing -> piao_picking -> playing（对局桌面状态迁移）
exception_flow: []
state_transitions: []
