id: GAME-FR-010
type: game_feature
name: 行牌操作交互
status: proposed
authority: fixed
description: 摸补提出牌、出牌方式（双击默认开启，单击与滑动默认关闭且双击与单击互斥）、碰杠胡过按钮组与优先级、动画摆放、番型播放优先级与飘分
source:
  kind: original
  document: source/08-UI交互.md
  section: "九、行牌操作"
  page: null
  quote: "玩家手牌右上方增加按钮，根据不同情况展示多个按钮，从左至右优先级显示顺序为：【碰】→【杠】→【亮】→【胡】/【自摸】→【过】"
preconditions:
  - "玩家处于行牌阶段（摸牌、出牌或存在碰杠胡机会）"
inputs:
  - "单击牌面提牌、点击非牌面空白处放牌"
  - "双击/单击/滑动出牌操作"
  - "点击碰、杠、亮、胡、自摸、过按钮"
outputs:
  - "牌提起与打出、牌河落牌、碰杠胡动画与摆放、飘分"
business_rules:
  - "摸牌与补牌从手牌最右侧从上往下缓冲落下（1帧效果），与一般手牌间隔1/4牌距离；摸牌在上家打出牌的同时进行"
  - "提牌：单击牌面对应牌提起约四分之一牌高，每次只能提起1张；点击非牌面空白处放下，点击该牌牌面不能放下；滑动选择最终手指离开的对应牌提起"
  - "出牌方式：双击出牌默认开启（点击已提起的牌打出）；单击出牌默认关闭（点击不可听牌的牌直接打出，开启时轮到自己出牌前有牌提起自动下落）；滑动出牌默认关闭（向上滑动超过提起高度显示透明牌随手指移动，松手打出，移回水平线撤回）；双击与单击互斥，滑动不互斥；互斥时以设置表为准（单击出牌、滑动出牌默认关闭，双击为默认出牌方式）"
  - "打出的牌可见移动过程（2帧）；出牌时头像处流光1秒、方位闪烁提醒1秒；其他家出牌放大展示（默认开，下一个玩家有操作后消失），关闭时直接放置且移动约0.5秒；其他家打出的牌始终是摸到的那张牌"
  - "碰：显示【碰】+【过】，可碰牌高亮其他暗置（有胡不暗置），动画1秒，刻子放于手牌左侧并显示方位箭头（对家上、上家左、下家右）；超时托管默认【过】"
  - "杠：直杠【碰】+【杠】+【过】，补杠/暗杠【杠】+【过】；中央动画1秒后飘分；补杠上方显示【补】，暗杠下三张牌背上一张牌面；杠牌动画播放同时摸牌（补牌）；补杠遇抢杠胡询问时不播动画与飘分，直到抢杠胡玩家完成选择"
  - "胡：自摸显示【自摸】+【过】（左侧显示胡的牌与倍数，封顶显示【封顶】且仅显示封顶倍数，超时默认胡）；点炮显示【胡】+【过】；动画流程光柱、番型动画1.5秒、飘分（正分黄色负分灰色），自摸环节不可直接出牌；一炮多响动画1秒，放炮玩家看所有玩家所胡番型，胡牌玩家只看自己所胡番型"
  - "多操作状态从左至右优先级为【碰】→【杠】→【亮】→【胡】/【自摸】→【过】；可多杠时显示可杠牌选择框且可直接点击出牌；有自摸按钮时不可直接出牌；托管超时有胡默认胡、可杠默认不杠"
  - "番型播放：在手牌前播放，多种番型优先播放特殊番型（海底捞月、杠上开花、杠上炮、抢杠胡）单次最多一个；多个特殊番型优先杠相关；无特殊番型时播倍数最大的普通番型，倍数相同按番型ID顺序"
  - "飘分：5位数以个为单位、6位数以万为单位，正分黄色负分灰色；杠类分数立刻结算，胡牌时总得分一起结算"
normal_flow:
  - "摸牌 -> 提牌 -> 出牌 -> 下家摸牌；存在碰杠胡机会时按钮组出现 -> 玩家点击或超时托管 -> 动画与摆放 -> 飘分"
exception_flow:
  - "补杠遇抢杠胡询问 -> 不播动画与飘分 -> 等待抢杠胡玩家选择后按杠和胡流程"
  - "漏胡不胡 -> 浮动提示当前未过手无法胡牌1.5秒"
state_transitions: []
ui_refs: [GAME-UI-001]
test_refs: []
