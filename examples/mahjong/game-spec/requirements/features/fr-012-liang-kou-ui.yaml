id: GAME-FR-012
type: game_feature
name: 亮倒扣牌界面
status: proposed
authority: fixed
description: 亮倒入口、扣牌界面（请选择扣牌）、亮倒-打牌界面（请选择胡口）、亮倒扣牌布局、标签体系（危/扣/暗）与胡牌后手牌复位
source:
  kind: original
  document: source/08-UI交互.md
  section: "十、亮倒 · 扣牌"
  page: null
  quote: "本家点击【亮】之后：所有碰杠胡交互按钮消失；听牌提示箭头不会消失；首先进行扣牌判断——无则进入「亮倒-打牌」界面，有则打开扣牌界面"
preconditions:
  - "摸牌或补牌后满足亮倒条件（少于12张不亮配置生效时牌堆牌小于12张不再出现【亮】按钮）"
inputs:
  - "点击【亮】或【过】"
  - "扣牌界面点击候选牌、取消、选择完成"
  - "亮倒界面点击亮起的牌（含危牌）、遮罩牌、取消按钮"
outputs:
  - "扣牌弹窗、亮倒-打牌界面、标签（扣/危/暗）与遮罩展示、亮倒文字动画"
business_rules:
  - "入口：摸牌或补牌后满足亮倒条件出现【亮】+【过】，亮倒同时听牌标签正常展示"
  - "点击【亮】后所有碰杠胡交互按钮消失、听牌提示箭头不消失、首先进行扣牌判断：无可扣刻子直接进入亮倒-打牌界面，有则打开扣牌界面"
  - "扣牌界面：自己手牌上方半透明遮罩，标题【请选择扣牌】，手中所有可扣的牌以单张展示（顺序与手牌左到右一致，右下角选中圆圈）；点击候选牌右下角出现绿色对号且手牌对应三张牌出现【扣】标签，再次点击取消；点击【取消】扣牌 UI 消失且桌面交互按钮不再出现（等同【过】）；点击【选择完成】判断剩余牌能否打出一张后听牌，不可以则取消所有选中并提示「当前扣牌没有胡口！」，可以则 UI 消失切换到亮倒-打牌界面"
  - "亮倒-打牌界面：打出后可听的牌亮起并带听牌提示标签，其余牌全部带遮罩（危牌不排除在外不加遮罩，扣下的牌不带该标签，危牌被扣下标签切换为【扣】）；提示「请选择胡口」；右上角取消按钮等同【过】，回到正常出牌界面；点击非危牌按玩家设置正常提出牌，点击危牌出现 toast「打出该牌将会放炮！」并阻断出牌，点击遮罩牌无效果"
  - "亮倒布局：自己手牌全部推到左侧碰杠牌区靠右正上方摆所有听牌（不占牌张仅展示，可胡牌为0也展示）；部分亮时未亮牌带黑色蒙版与【暗】标签，暗牌在左非暗牌在右；他人牌推倒视角与胡牌推倒一致，部分亮时未亮牌背面朝上且在左侧"
  - "扣牌布局：非部分亮按暗牌规则展示标签为【扣】，部分亮按【暗】展示；他人扣住的牌按部分亮暗牌展示；摸牌位置不变且立着"
  - "亮倒动画：出牌的同时手牌取消遮罩，出牌动画0.5秒后播放【亮倒】文字（时长1秒），下家摸牌；左侧可胡牌外圈光圈静图"
  - "标签体系：【危】未亮倒玩家手中任一亮倒玩家胡的牌、【扣】亮倒扣下的刻子（带遮罩）、【暗】部分亮未亮的牌（带蒙版），均在牌左上角"
  - "胡牌后全部手牌按手牌顺序重新摆放，随后全部推到，去掉所有标签和蒙版"
normal_flow:
  - "满足亮倒条件出现【亮】 -> 点击【亮】 -> 扣牌判断 -> 扣牌或直接进入亮倒-打牌界面 -> 选择胡口出牌 -> 亮倒文字动画"
exception_flow:
  - "扣牌选择完成但无胡口 -> 取消所有选中并提示当前扣牌没有胡口"
  - "亮倒界面点击危牌 -> toast打出该牌将会放炮并阻断出牌"
  - "点击取消（扣牌或亮倒界面）-> 等同【过】回到正常出牌界面"
state_transitions: []
ui_refs: [GAME-UI-001]
test_refs: []
dependencies:
  - "GAME-RULE-012"
  - "GAME-RULE-014"
open_questions: []
