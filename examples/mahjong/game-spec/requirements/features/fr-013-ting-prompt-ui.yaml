id: GAME-FR-013
type: game_feature
name: 听牌提示
status: proposed
authority: fixed
description: 可听牌与已听牌状态提示、听牌标签体系（优/大/多/箭头）、胡牌信息框内容排序与封顶展示、自动摸打勾选
source:
  kind: original
  document: source/08-UI交互.md
  section: "十一、听牌提示"
  page: null
  quote: "向听数为 1 时，打出可听牌的牌上方展示听牌提示标签；提起提示牌时，该牌上方出现听牌提示弹窗"
preconditions:
  - "玩家手牌向听数为1（可听牌状态）或已听牌"
inputs:
  - "提起提示牌、点击其他提示牌、点击空白处或非提示牌或【听】按钮"
  - "点击【自动摸打】勾选按钮"
outputs:
  - "听牌提示标签、听牌提示弹窗（胡牌信息框）、听牌与自动摸打按钮"
business_rules:
  - "可听牌状态：打出可听牌的牌上方展示听牌提示标签；提起提示牌时上方出现听牌提示弹窗；点击其他提示牌切换提示内容；点击空白处或非提示牌或【听】按钮关闭弹窗；新摸牌或出牌时关闭弹窗"
  - "已听牌状态：手牌上方显示【听牌】及【自动摸打】或2倍起胡番数不足按钮，层级不挡牌"
  - "标签优先级：优 > 大 > 多 > 箭头，同一牌点同时满足仅显示最高优先级；标签根据可胡牌张数和倍数实时变化（张数最少0张、倍数最少1倍）"
  - "箭头：打出成听只有1张仅显示箭头，多个牌点张数倍数都相同都显示箭头；多：胡牌张数最多且至少比最少多2张及以上（同牌点多张最右侧显示）；大：胡牌倍数最大的牌点（同牌点多张最右侧显示）；优：既符合大又符合多的牌点显示"
  - "胡牌信息框：距手牌高度固定，张数越多宽高越大，超3排支持上下滑动；内容含可胡张数与可胡牌信息（牌面、倍数、张数）；一排最多4个，按倍数大小排序，同倍数按筒(1-9)→条(1-9)→中→发→白顺序；可胡牌数量为0时牌面变暗；倍数计算不计对亮不计番型加分项，计算自己的亮倒不计算他人亮倒，不算自摸倍数，不超过房间配置封顶倍数（超过显示封顶倍数）；有封顶时左下角固定展示房间封顶倍数"
  - "自动摸打：听牌按钮展示时右侧显示【自动摸打】勾选按钮（未选中/选中两态）；勾选进入托管（同托管逻辑，头像不展示托管图标），可再次点击取消勾选或点击取消托管按钮取消"
normal_flow:
  - "向听数为1 -> 提示标签展示 -> 提起提示牌弹出胡牌信息框 -> 点击空白处或出牌关闭"
exception_flow: []
state_transitions: []
ui_refs: [GAME-UI-001]
test_refs: []
dependencies:
  - "GAME-RULE-012"
open_questions: []
