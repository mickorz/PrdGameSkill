id: GAME-FR-014
type: game_feature
name: 反馈区域与 toast 提示
status: proposed
authority: fixed
description: 反馈区庄家提醒、番型播放、飘分、规则提醒、发言过快、漏胡不胡、番数不足、危牌、扣牌失败等提示的文案、时长与可见性
source:
  kind: original
  document: source/08-UI交互.md
  section: "十二、反馈区域 · toast 清单"
  page: null
  quote: "「您是庄家，请优先出牌」。庄家进行出牌、杠牌、胡牌操作时，提醒消失"
preconditions:
  - "对局进行中，触发对应提示条件"
inputs:
  - "庄家或闲家等待状态、玩家出牌尝试、快捷聊天点击"
outputs:
  - "反馈区提醒、浮动提示 toast、屏幕中央 tips"
business_rules:
  - "庄家出牌提醒「您是庄家，请优先出牌」直到庄家出牌、杠牌、胡牌操作后消失（仅庄家可见）；闲家等待提醒「等待庄家优先出牌」直到庄家有操作行为（仅闲家可见）"
  - "番型播放：在玩家手牌前播放对应番型动画，优先级见行牌操作番型播放规则"
  - "飘分播放：5位数以个为单位、6位数以万为单位，正分黄色负分灰色；杠类分数立刻结算，胡牌时总得分一起结算"
  - "规则提醒：进行游戏规则的快捷提醒"
  - "发言过快：气泡文本和语音播放完毕前再次点击，屏幕中央 tips「您发言太快了，请休息一下吧！」停留1秒消失"
  - "漏胡不胡：浮动提示「当前未过手，无法胡牌」1.5秒后消失（仅自己可见）"
  - "番数不足：无法捉炮时浮动提示「番数不足，无法捉炮！」（仅自己可见）"
  - "危牌：打出危牌时提示「打出该牌将会放炮！」，toast 类停留1.5秒（仅自己可见）"
  - "扣牌失败：点击【选择完成】后剩余牌无法听牌时弹窗提示「当前扣牌没有胡口！」，停留至用户操作（仅自己可见）"
  - "时长口径：浮动提示/toast 类统一1.5秒，弹窗类停留至用户操作，结果文字类常驻至下一动作"
normal_flow:
  - "触发条件 -> 反馈区或浮动提示展示 -> 达到时长或条件解除后消失"
exception_flow: []
state_transitions: []
