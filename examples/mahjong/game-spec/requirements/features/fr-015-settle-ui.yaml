id: GAME-FR-015
type: game_feature
name: 对局结束过渡与结算界面
status: proposed
authority: fixed
description: 正常结束与荒庄流局的过渡表现、买马 UI、小结算界面结构交互、大结算统计与对局后桌面
source:
  kind: original
  document: source/08-UI交互.md
  section: 十三、对局结束 / 十四、结算界面
  page: null
  quote: 本玩家分数 ≥ 0 → 胜利，显示【恭喜获胜】的文字和胜利的底色；本玩家分数 < 0 → 失败，显示【遗憾失利】和失败的底色
preconditions:
  - 本局有人胡牌或荒庄流局
inputs:
  - 点击返回/关闭按钮、长按非交互区域、点击主按钮（查看结算/继续游戏）、点击详情按钮、点击安全中心
outputs:
  - 摊牌展示、对局结束或荒庄文字动画、买马 UI、小结算界面、大结算界面
business_rules:
  - 正常结束：所有玩家摊牌展示（对家按真实视角倒着），按胡牌顺序在对应玩家面前展示胡/自摸文字；桌面中间播放对局结束文字动画约1.3秒、文字停留0.5秒；触发买马直接弹出买马 UI（UI与牌同时出现、中的马金色边亮起、显示中X马、停留1.5秒后关闭直接打开小结算），未触发则胡牌动画结束后直接弹出小结算
  - 荒庄流局：摊牌展示 -> 【荒庄】文字持续1.3秒 -> 无未听牌玩家直接出小结算；有未听牌玩家则所有未听牌玩家同时飘字未听牌（查叫时同时展示查叫分数；亮倒赔付在查叫后展示【亮倒荒庄】文字并显示加分扣分），持续1.3秒后出小结算
  - 小结算：背景与正上方文字按本玩家胜负展示，分数≥0胜利显示【恭喜获胜】与胜利底色，分数<0失败显示【遗憾失利】与失败底色
  - 小结算功能布局：返回按钮与关闭按钮回到牌桌；安全中心入口；房号、小局结束时间（月日时分秒24小时制）；非交互区域长按隐藏小结算界面；洗牌ICON无交互
  - 小结算主按钮：最后一小局显示【查看结算】点击进入大结算；非最后一小局显示【继续游戏】点击关闭小结算并准备
  - 小结算手牌详情区：按三个玩家确定高度（2人复用3人高度）；庄家头像左上角【庄】标签；开启漂时头像右上角漂X（1~2位数）；仅自己展示结算信息文字；总得分输时触发番型封顶额外显示【封顶】标识（赢不展示）；自己结算信息右侧固定详情按钮，点击打开详情页签（杠分→胡分→荒庄查叫顺序）；手牌交互功能不变
  - 大结算：复用杭麻，数据统计改为卡五星类（自摸X次/点炮X次（一炮多响只算一次）/亮倒/未听），战绩周报特殊游戏次数使用亮倒次数
  - 对局后桌面：复用杭麻，对局结束后桌面保持展示，玩家可查看牌桌信息
normal_flow:
  - 有人胡牌或荒庄 -> 摊牌与文字动画 ->（买马 UI）-> 小结算 -> 继续游戏回桌面或查看结算进大结算
  - GAME-UI-001 round_over -> GAME-UI-005 -> GAME-UI-002（页面流）
exception_flow:
  - 荒庄且有未听牌玩家 -> 未听牌飘字（查叫分数、亮倒荒庄赔付）持续1.3秒 -> 小结算
state_transitions: []
ui_refs:
  - GAME-UI-001
  - GAME-UI-002
  - GAME-UI-005
test_refs: []
dependencies:
  - GAME-RULE-016
open_questions: []
