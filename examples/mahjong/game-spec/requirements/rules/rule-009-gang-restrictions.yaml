id: GAME-RULE-009
type: game_rule
name: 杠牌限制
status: proposed
authority: open
description: 回手杠、余牌下限、亮倒、危牌、扣牌五类场景下限制开杠。
source:
  kind: original
  document: source/01-基础规则.md
  section: "4.3 杠牌限制"
  page: null
  quote: "| **回手杠**（**常驻规则，无创房开关**）| ① 手上有 3 张一样的牌，别人打出时如果选择**碰**，则这张牌**本小局不能再明杠**。<br>② **已经碰过的牌，摸到第四张时必须立刻杠**，否则本小局这张牌不能再明杠。 |"
preconditions:
  - 玩家尝试开杠（M4）
inputs:
  - 意图杠的牌与杠型
outputs:
  - 是否允许开杠
business_rules:
  - 回手杠（常驻规则，无创房开关）：手上有 3 张一样的牌，别人打出时如果选择碰，则这张牌本小局不能再明杠。
  - 回手杠 ②：已经碰过的牌，摸到第四张时必须立刻杠，否则本小局这张牌不能再明杠。
  - 剩余牌限制：牌堆剩余牌为 0 时，不可杠。
  - 亮倒限制：玩家亮倒后，手牌中未扣下的牌不可杠；手中有 4 张牌、扣下 3 张也不可杠（哪怕摸到维持听牌的牌）；已经碰的牌明杠不受此限制（但仍受剩余牌、回手杠、危牌限制）。
  - 危牌限制：未亮倒时，危牌不可明杠（补杠）；直杠和暗杠可以。
  - 扣牌相关：亮倒后仅扣下的刻子可杠；未扣下的刻子无论别人打出还是自己摸到都不可杠；扣下的刻子若第 4 张在自己手中且已亮出，仍不可杠（会改牌）。
