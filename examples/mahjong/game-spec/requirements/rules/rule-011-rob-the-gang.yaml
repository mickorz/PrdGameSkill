id: GAME-RULE-011
type: game_rule
name: 抢杠胡
status: proposed
authority: open
description: 他人明杠（补杠）的牌恰为自己胡牌时可抢杠胡，倍数 ×2（可勾选 ×4），视为未杠成功。
source:
  kind: original
  document: source/01-基础规则.md
  section: 4.5 抢杠胡
  page: null
  quote: '- **触发**：其他玩家进行**明杠（补杠）**，且明杠的牌恰为自己的胡牌时，玩家可抢杠胡。'
preconditions:
  - 某玩家进行明杠（补杠）
inputs:
  - 被补杠的牌
outputs:
  - 抢杠胡成立或明杠继续
business_rules:
  - 触发：其他玩家进行明杠（补杠），且明杠的牌恰为自己的胡牌时，玩家可抢杠胡；可多人抢杠胡一家。
  - 倍数：抢杠胡 ×2；勾选「杠上花/炮*4」后 ×4（需求 §2.3.1.2 明写杠上花、杠上炮、抢杠胡三项并列走初始值，初始 2 可勾选为 4，受同一勾选控制）。
  - 后果：抢杠胡后，明杠玩家视为未杠成功，不收取杠分，杠上杠也会中断。
  - 杠分冲销：因杠分实时结算（§4.1），「视为未杠成功、不收取杠分」在实现上即已实时收取的该杠杠分需回退（由「实时结算」+「视为未杠成功」两句合成推导）。
  - 归类：属点炮类（需求 §2.2.2【点炮】明列「打出或补杠的牌」），计入点炮次数。
  - 与上楼的关系：不触发上楼（§3.4 上楼触发条件为上一小局荒庄或一炮多响；一炮多响定义为打出一张牌，补杠被抢不构成）。
  - 坐庄归属：属点炮类，多人抢杠胡时由补杠的那一家坐庄（§3.2）。
