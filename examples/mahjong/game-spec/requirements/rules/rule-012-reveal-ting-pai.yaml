id: GAME-RULE-012
type: game_rule
name: 亮倒
status: proposed
authority: open
description: 听牌后可选择亮倒明牌不可换牌，番型分 ×2，并产生危牌与扣牌联动。
source:
  kind: original
  document: source/01-基础规则.md
  section: 5.1 亮倒
  page: null
  quote: '- 用户**明牌**、**不可改牌**，只能摸打。'
preconditions:
  - 玩家处于可听牌状态（打出一张非危牌后可听，或手牌全是危牌，或自摸时）
inputs:
  - 玩家选择（亮倒 / 不亮倒 / 扣牌组合）
outputs:
  - 亮倒状态（明牌）
  - 番型分 ×2 加成
  - 危牌标记（对其他未亮倒玩家）
business_rules:
  - 权限触发：打出一张非危牌后可听牌 → 触发亮倒权限，玩家可选择是否亮倒；手牌中全是危牌时去掉「非危牌」限制同样可触发；自摸时每次都会展示亮的权限。
  - 亮倒后果：用户明牌、不可改牌，只能摸打；亮倒的牌必须维持听牌；胡的牌成为其他未亮倒用户的危牌。
  - 亮倒后杠限制：仅可对已扣下的刻子进行直杠 / 补杠；暗杠仅可摸到第 4 张暗杠，第 4 张在手牌中不可暗杠（§4.3 / §5.1）。
  - 计分：亮倒状态下输 / 赢时均计算亮倒，番型分 ×2，不影响加分项。
  - 对亮：输赢双方均亮倒（对亮）仅计算一次亮倒 ×2；若创房勾选「对亮 ×2」则计算两个亮倒（共 4 倍）。
  - 创房「亮倒」组选项：部分亮（亮倒后仅非扣下、与胡的牌相关的牌亮出）；少于12张不亮（玩家摸 / 补牌之后牌堆牌 < 12 张则不再触发亮牌，不下放权限，本变体默认不选）；对亮 ×2；胡牌必须亮倒（仅亮倒状态才能胡，与双亮互斥）；双亮（仅 3 人时可勾选、2 人置灰，已有 2 个玩家亮倒则第三人无需亮倒也能胡牌，与「胡牌必须亮倒」互斥）。
normal_flow: []
exception_flow: []
state_transitions: []
ui_refs: []
test_refs:
