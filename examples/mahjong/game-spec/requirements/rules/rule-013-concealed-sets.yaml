id: GAME-RULE-013
type: game_rule
name: 扣牌
status: proposed
authority: fixed
description: 亮倒同时把去掉后仍保持听牌的刻子扣下（他人不可见），亮倒后不可再扣。
source:
  kind: original
  document: source/01-基础规则.md
  section: "5.2 扣牌"
  page: null
  quote: "**触发时机**：**亮倒的同时**进行扣牌判断。**亮倒之后不可再扣牌**。"
preconditions:
  - 玩家执行亮倒（GAME-RULE-012）
inputs:
  - 亮倒时的手牌
outputs:
  - 扣下的刻子（牌背朝上，他人不可见）
  - 按剩余亮出牌决定的听牌
business_rules:
  - 触发时机：亮倒的同时进行扣牌判断，亮倒之后不可再扣牌。
  - 可扣判断（遍历手中所有刻子与四张相同牌逐个判断）：将该刻子去掉（四张相同牌则去掉三张）→ 剩余手牌是否仍满足「打出一张非危牌后可听牌」→ 满足则可扣下，不满足则不可扣。
  - 扣下张数：3 张相同牌（刻子）全部扣下（3 张）；4 张相同牌扣下 3 张。
  - 多组同时扣下：玩家可同时扣下多组刻子，但需再次检测扣多组后的剩余手牌是否仍满足「打出一张非危牌后可听牌」。
  - 需求原文示例：手牌 筒 12333 · 78999 · 中中中，摸进 5 条、无危牌，打出 5 条可听 369 筒；红中、3 筒、9 筒均可单独扣下，但 3 筒与 9 筒同时扣下后不满足条件、不可同时扣下。
  - 扣牌与听牌：扣牌后按剩余亮出的牌决定听牌（原文示例：手牌 11 56667 听 1 和 6，扣住 6 后变为 11 57，仅听 6）。
  - 展示：扣住的刻子在亮倒后他人不可见（牌背朝上）。
  - 其他口径：没有可扣的刻子时跳过扣牌环节；危牌可以扣下（只要满足扣牌条件）；扣牌环节点「取消」等同于过，回到正常出牌界面。
