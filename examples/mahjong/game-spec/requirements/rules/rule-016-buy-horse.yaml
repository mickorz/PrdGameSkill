id: GAME-RULE-016
type: game_rule
name: 买马
status: proposed
authority: fixed
description: 胡牌（自摸 / 亮牌自摸）后翻剩余牌计马分，买一 / 买一送一 / 买 5 马 / 买 6 马四档。
source:
  kind: original
  document: source/01-基础规则.md
  section: "6.2 买马"
  page: null
  quote: "| **买一** | 剩余牌中翻 **1 张** | 中发白记 **10 倍底分**；1~9 的条 / 筒牌记**同数字倍**的底分 | 数量不足时**不买马** |"
preconditions:
  - 创房勾选买马（不买马 / 自摸买马 / 亮牌自摸买马）
  - 玩家胡牌且满足触发条件（自摸，或亮牌自摸）
inputs:
  - 牌堆剩余牌
outputs:
  - 马分（该小局马分总分）
business_rules:
  - 触发模式：不买马（关闭）；自摸买马（玩家自摸胡牌后触发）；亮牌自摸买马（玩家亮牌自摸胡牌后触发）。
  - 买一：剩余牌中翻 1 张，中发白记 10 倍底分，1~9 的条 / 筒牌记同数字倍的底分；数量不足时不买马。
  - 买一送一：剩余牌中翻 2 张，计分同上，两张分数之和为该小局马分；数量不足时不买马。
  - 买6马：剩余牌中翻 6 张，出现 1 / 4 / 7 / 白每张计 1 倍底分，总分为该小局马分；命中集即此四种、不含中 / 发；数量不足时有多少买多少，剩余牌为 0 则不买，中 0 张按 6 马计分。
  - 买5马：剩余牌中翻 5 张，出现 1 / 4 / 7 / 白每张计 1 分，总分为该小局马分；一张不中或者中 5 张，按 6 马计分；边界同买6马。
  - 命中集说明（需求 §2.3.2.2）：买 5 / 6 马命中集是 1 / 4 / 7 / 白、不含中、发，为有意设计（84 张中命中 28 张恰为 1/3）；与买一 / 买一送一的「中发白记 10 倍底分」机制不同（前者按是否命中计数，后者按牌面值给分）。
  - 收分关系：自摸收取所有玩家。
  - 荒庄不买马。
