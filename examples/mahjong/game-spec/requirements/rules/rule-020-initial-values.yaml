id: GAME-RULE-020
type: game_rule
name: 开局数值速查
status: proposed
authority: fixed
description: 资源总量 84 张，起手 3 人 40 / 2 人 27，分发后余量 44 / 57，及节奏类硬约束。
source:
  kind: original
  document: source/01-基础规则.md
  section: "10.1 资源与起手"
  page: null
  quote: "| **资源总量（基准）** | **84 张** | 本变体**无牌张变体**；§1.1 |"
preconditions:
  - 对局开局
inputs:
  - 玩家人数（2 或 3）
outputs:
  - 牌堆初始余量（44 / 57 张）
business_rules:
  - 资源总量（基准）84 张，本变体无牌张变体（§10.1）。
  - 起手分发序列：庄 4+4+4+1+1（4 组）、闲 4+4+4+1（4 组）（§10.1）。
  - 起手合计：3 人 40 张（14 + 13 × 2）、2 人 27 张（14 + 13 × 1）（§10.1 推导式）。
  - 分发后余量 = 总量 − 起手合计：3 人 44 张、2 人 57 张（§10.2 结果值）。
  - 余量即牌堆剩余牌数，本玩法不展示牌墙仅展示剩余张数；杠后补牌时牌堆额外减 1 张（§10.2）。
  - 节奏类硬约束（§10.4）：荒庄阈值为可摸牌数 = 0 且无人胡牌；牌堆剩余牌为 0 时不可杠；牌堆牌 < 12 张时不再下放亮倒权限（需勾选「少于12张不亮」）；买 1 / 买一送一数量不足则不买马，买 5 / 买 6 马有多少买多少；连庄无次数上限；漏胡状态在摸牌后解除（含杠后补牌）；座位与方位不随局变动。
