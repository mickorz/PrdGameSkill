id: GAME-RULE-021
type: game_rule
name: 全流程阶段与开局准备
status: proposed
authority: fixed
description: 一局按开局准备、打漂、定庄摇骰、发牌、行牌、结束、和牌后、结算续局的时序推进。
source:
  kind: original
  document: source/02-游戏流程.md
  section: "卡五星（好友房）· 游戏流程（引言）"
  page: null
  quote: "> 一局从开始到结束按时间发生什么：开局准备 → 打漂 → 定庄 → 摇骰方位 → 发牌 → 行牌 → 结束 → 结算续局；操作的条件与后果见 [打牌操作](03-打牌操作.md)。"
preconditions: []
inputs: []
outputs:
  - 对局阶段序列
business_rules:
  - 阶段序列（§全流程）：开局准备 → 打漂 → 定庄、定方位 → 发牌 → 行牌 → 结束判定（胡牌 / 荒庄两条分支）→ 和牌后步骤（买马）→ 小结算 → 大结算 → 续局。
  - 开局准备（§一）：房主创建好友房，选定卡五星玩法与创房参数；后续加入玩家按逆时针顺序入座，座位固定（2 人一上一下、3 人左·下·右）。
  - 开局动画：每次开房首局播放开局动画；之后开局直接进入摇骰发牌。
  - 玩家信息：展示头像、昵称、积分（初始 0）。
