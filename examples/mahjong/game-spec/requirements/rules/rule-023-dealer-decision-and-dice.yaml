id: GAME-RULE-023
type: game_rule
name: 定庄时机与摇骰方位
status: proposed
authority: fixed
description: 定庄逻辑上先于发牌（定庄 → 定方位 → 发牌），骰子停转展数 1 秒后消失并确定方位。
source:
  kind: original
  document: source/02-游戏流程.md
  section: "四、定庄"
  page: null
  quote: "- 定庄时机：**逻辑上先于发牌** —— **定庄 → 定方位 → 发牌**。"
preconditions:
  - 打漂环节完成（或漂模式无需选漂）
inputs:
  - 定庄选项（随机坐庄 / 房主坐庄）或轮庄结果
outputs:
  - 庄家、方位、骰子点数、上楼展示
business_rules:
  - 定庄选项：随机坐庄（开局后首局随机坐庄）、房主坐庄（开局后首局房主坐庄，默认值，创房面板实拍为选中态）。
  - 定庄时机：逻辑上先于发牌，顺序为定庄 → 定方位 → 发牌（依据 §2.0 对局节奏表「打漂 → 定庄、定方位（骰子点数展示 1S）→ 发牌」及 §3.2.5「确认庄家并开始摸牌时显示方位」）。
  - 庄家标签为呈现层：发牌开始后当骰子滚动停下时，庄家头像上直接出现【庄】标志，无过程动画；不改变逻辑顺序。
  - 骰子（§五）：发牌时显示骰子，两个骰子环绕转动；在用户拿到所有手牌后，骰子停止转动并展现数字，停留 1 秒后消失。
  - 方位：未开局默认无方位展示；确认庄家并开始摸牌时显示对应方位，庄为东、其他玩家按人数逆时针依次南西北（3 人仅南西、2 人仅南）；之后方位不再变化，直到重新匹配重置。
  - 上楼展示：开启上楼规则且该局符合上楼时，在骰子停止的同时在骰子上方展示「上楼X2 / 上楼X4」（2 还是 4 按具体倍数定）。
