id: GAME-RULE-025
type: game_rule
name: 发牌逻辑与节奏
status: proposed
authority: fixed
description: 从庄家位逆时针按 4+4+4+1（+庄 1）发牌，全员节奏同步，发毕自动理牌立起。
source:
  kind: original
  document: source/02-游戏流程.md
  section: "6.1 发牌逻辑"
  page: null
  quote: "| **方向** | 从**庄家位**开始，**逆时针**顺序 |"
preconditions:
  - 定庄与方位已确定（GAME-RULE-023）
inputs: []
outputs:
  - 庄家手牌 14 张、闲家手牌 13 张、牌堆余量（3 人 44 / 2 人 57）
business_rules:
  - 发牌方向：从庄家位开始，逆时针顺序（§6.1）。
  - 第 1~3 轮每人发 4 张/次共 3 轮；第 4 轮再从庄家位开始逆时针每人发 1 张；第 5 步最后给庄家位发 1 张（§6.1）。
  - 起手合计：庄 14 张（4+4+4+1+1）、闲 13 张（4+4+4+1）；全体起手合计 3 人 40 张、2 人 27 张；发牌后余量 3 人 44 张、2 人 57 张（§6.2 / §6.3）。
  - 发牌节奏：所有玩家获取手牌的节奏一致；每组牌出现的时间桌上所有玩家同步（§6.4）。
  - 己方手牌展示：按从左到右排列，出现时扣在桌面上随后向上翻开；第一组开始向上翻开时第二组朝下的牌出现，按同样节奏扣住后向上翻，直到 4 组牌全部翻开（§6.4）。
  - 庄家最后两张中右侧一张与前 13 张有距离，放置在摸牌位置；他人手牌只有出现动画、出现后立起，无翻开动画，庄家最后一张同样放置在庄家摸牌位置（§6.4）。
  - 理牌：所有玩家发牌完毕后将手牌扣下整理好顺序后立起（自动理牌）；手牌排列顺序从左至右花色依次为筒 → 条 → 中 → 发 → 白，同花色内从左至右大小 1~9（§6.5）。
  - 庄家摸进的最后一张牌受理牌影响，固定置于最右侧且与一般手牌保持距离（§6.5）。
