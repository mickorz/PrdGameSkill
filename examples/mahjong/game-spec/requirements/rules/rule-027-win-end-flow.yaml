id: GAME-RULE-027
type: game_rule
name: 和牌结束流程
status: proposed
authority: fixed
description: 有人胡牌即终局，全员摊牌展示并播放「对局结束」提示后进入和牌后步骤。
source:
  kind: original
  document: source/02-游戏流程.md
  section: "8.1 正常结束（有人胡牌）"
  page: null
  quote: "1. 所有玩家**摊牌展示**（对家按真实视角倒着）；根据胡牌顺序在对应玩家面前展示胡牌。"
preconditions:
  - 行牌阶段中出现胡牌（GAME-RULE-018 五层限制均通过）
inputs:
  - 胡牌事件（自摸 / 点炮 / 抢杠胡 / 杠上花 / 杠上炮 / 海底捞 / 海底炮 / 一炮多响）
outputs:
  - 摊牌展示与「对局结束」提示
  - 进入和牌后步骤
business_rules:
  - 触发：有玩家胡牌（自摸 / 点炮 / 抢杠胡 / 杠上花 / 杠上炮 / 海底捞 / 海底炮 / 一炮多响）。
  - 流程 1：所有玩家摊牌展示（对家按真实视角倒着）；根据胡牌顺序在对应玩家面前展示胡牌。
  - 流程 2：胡牌人以「胡 / 自摸」文字展示。
  - 流程 3：桌面中间播放「对局结束」文字提示，约 1.3 秒，「对局结束」文字停留 0.5 秒。
  - 流程 4：进入 §九 和牌后步骤（买马，见 GAME-RULE-029）。
normal_flow: []
exception_flow: []
state_transitions: []
ui_refs: []
test_refs: []
dependencies:
  - GAME-RULE-018
  - GAME-RULE-029
open_questions: []
