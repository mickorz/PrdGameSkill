id: GAME-RULE-030
type: game_rule
name: 结算与续局
status: proposed
authority: fixed
description: 小结算、大结算两级结算与续局轮庄规则，最后一小局进入大结算。
source:
  kind: original
  document: source/02-游戏流程.md
  section: "10.3 续局与轮庄"
  page: null
  quote: "- 非最后一小局时，小结算底部按钮显示为【继续游戏】，点击后关闭小结算界面并准备下一局。"
preconditions:
  - 小局已结束（胡牌或荒庄流程走完）
inputs:
  - 本局是是否最后一小局
  - 上一局结果
outputs:
  - 小结算 / 大结算界面
  - 下一局庄家
business_rules:
  - 小结算（§10.1）：对局结束后进入小结算界面；界面内容与文案规则见结算文档 §十五与 UI 交互文档 §十四。
  - 大结算（§10.2）：最后一小局时，小结算底部按钮显示为【查看结算】，点击进入大结算界面（复用杭麻大结算）。
  - 大结算统计口径：自摸 X 次（记录自摸次数）；点炮 X 次（记录点炮次数，一炮多响只算一次、一小局最多一次）；亮倒（记录亮倒次数）；未听（记录荒庄流局时未听牌的次数）。
  - 战绩周报中，卡五星玩法统计的特殊游戏次数使用「亮倒次数」（§10.2）。
  - 续局与轮庄（§10.3）：上一局单个玩家胡牌 → 胡牌玩家坐庄；一炮多响 → 点炮玩家坐庄；荒庄 → 上一局庄家继续坐庄（连庄）；轮庄规则三变体一致；按逆时针轮庄（庄家以外的方位依次递补）。
  - 非最后一小局时，小结算底部按钮显示为【继续游戏】，点击后关闭小结算界面并准备下一局。
  - 对局后桌面（§10.4）：复用杭麻，对局结束后桌面保持展示，玩家可查看牌桌信息。
  - 退出（§10.5）：好友房退出、解散、特殊解散复用玄武 2.0 通用流程。
