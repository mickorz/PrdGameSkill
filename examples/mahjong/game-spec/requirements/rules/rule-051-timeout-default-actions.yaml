  - "有胡牌的多状态超时默认胡牌"
  - "胡牌触发（自摸/点炮）超时默认胡（源 §7.3 超时行）"
  - "多杠状态超时默认不杠（源 §5.5 多杠状态行）"
normal_flow:
  - "操作机会出现 -> 超时未响应 -> 执行对应默认动作"
