id: GAME-RULE-051
type: game_rule
name: 超时托管默认动作
status: proposed
authority: fixed
description: 配置开启托管时碰杠超时默认过、有胡牌的多状态超时默认胡、多杠超时默认不杠
source:
  kind: original
  document: source/03-打牌操作.md
