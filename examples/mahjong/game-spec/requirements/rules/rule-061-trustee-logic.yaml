id: GAME-RULE-061
type: game_rule
name: 托管逻辑
status: proposed
authority: fixed
description: 托管状态无法提牌，打牌等待1秒打出摸到的牌（危牌选非危牌第一张），碰杠等待1秒取消，胡等待1秒胡牌，操作后取消托管
source:
  kind: original
  document: source/03-打牌操作.md
  section: 十四、托管
  page: null
  quote: 托管状态下无法进行提牌操作，仍可选择碰 / 杠 / 胡 / 过的操作，但操作后则取消托管状态。
preconditions:
  - 玩家进入托管状态
inputs:
  - 摸牌/出牌时机、碰杠胡操作机会
outputs:
  - 托管自动动作执行或玩家手动操作后解除托管
business_rules:
  - 托管状态下无法进行提牌操作；仍可选择碰/杠/胡/过操作，操作后则取消托管状态
  - 打牌：按摸打逻辑出牌，等待1秒打出摸到的牌；摸到的牌是危牌时，在非危牌中从左到右选择第一张打出；手牌全是危牌时，等待1秒打出摸到的牌
  - 碰/杠：等待1秒后取消；胡：等待1秒后胡牌
  - 出牌阶段超时托管：有提起的牌与无提起的牌均走托管逻辑打新摸进来的牌（源 §2.5）
  - 亮倒后（无托管）：打牌等待1秒打出摸到的牌；杠、胡触发后等待玩家操作（源 §10.5）
  - 亮倒后同时触发托管：按托管逻辑执行，亮倒后危牌标签已去除，不用考虑危牌情况
normal_flow:
  - 进入托管 -> 轮到打牌 -> 等待1秒打出摸到的牌（危牌按规则避让） -> 轮到操作 -> 等待1秒执行默认动作
  - 正常状态 -> 托管状态 -> 玩家操作 -> 正常状态
exception_flow:
  - 玩家在托管中手动选择碰/杠/胡/过 -> 取消托管状态，按玩家选择执行
state_transitions: []
ui_refs: []
test_refs: []
dependencies:
  - GAME-RULE-033
  - GAME-RULE-051
  - GAME-RULE-054
open_questions: []
