id: GAME-RULE-075
type: game_rule
name: "清一色（F08）"
status: proposed
authority: fixed
description: "全部牌为同一门序数牌（全筒或全条）的花色番型，4倍。"
source:
  kind: original
  document: "source/04-番型.md"
  section: "2.5 清一色（F08 · 4 倍）"
  page: null
  quote: "| **全同花色** | 胡牌时**所有牌全是筒子或全是条子**（手牌 + 碰杠牌区）| 不追加清一色；结构档位仍按 **平胡（1 倍）/ 碰碰胡（2 倍）** 计 |"
preconditions:
  - "玩家已形成14张和牌牌型"
inputs:
  - "手牌与碰杠牌区共14张牌面"
outputs:
  - "番型判定结果"
  - "牌型分倍数"
business_rules:
  - "F08 清一色=4倍，花色维度；判定条件为胡牌时所有牌（手牌+碰杠牌区）全是筒子或全是条子"
  - "与结构维度叠加：清一色4+平胡1=5倍；清一色4+碰碰胡2=6倍；与七对类叠加：全筒七对=4+4=8倍，全筒龙七对=8+4=12倍"
  - "与小三元/大三元互斥（三元必含字牌，清一色禁字牌，结构上不可能同时成立，推导）"
  - "与明四归互斥：同时触发时仅计算清一色（需求明示，仅限明四归）"
  - "与暗四归可叠加（推导：需求互斥只限定明四归，未规定即不互斥）"
  - "碰杠区含其他花色或含字牌即破坏清一色"
normal_flow: []
exception_flow: []
state_transitions: []
ui_refs: []
test_refs: []
dependencies: []
open_questions:
  - "清一色与暗四归可叠加为「未规定即不互斥」的推导结论（非需求明示），建议向产品复核确认"
