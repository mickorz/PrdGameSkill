id: GAME-RULE-077
type: game_rule
name: "七对类（F06/F11/F12/F13/F14）"
status: proposed
authority: fixed
description: "14张拆为7组对子的七对类结构番型，按龙数取档，三元七对为所取档位上的乘2叠加项。"
source:
  kind: original
  document: "source/04-番型.md"
  section: "三、七对类（2N）"
  page: null
  quote: "| **7 对结构** | 14 张恰可拆为 7 组对子 | 改看**结构维度**（平胡 1 倍 / 碰碰胡 2 倍）|"
preconditions:
  - "玩家已形成14张和牌牌型且全部在手（门清形态）"
inputs:
  - "手牌14张牌面"
outputs:
  - "番型判定结果"
  - "牌型分倍数"
business_rules:
  - "结构判定：14张恰可拆为7组对子；龙数=含四张相同的牌种数，七对维度内按龙数取最高档：F06七对=4倍（龙数0）、F11龙七对=8倍（龙数1）、F13双龙七对=32倍（龙数2）、F14三龙七对=128倍（龙数3）"
  - "F12三元七对=8倍，属七对叠加项而非取高档：中/发/白对子各一时在所取七对档位上乘2（4x2=8、8x2=16、32x2=64、128x2=256），可与龙/双龙/三龙叠加，不按取高处理（需求明示「在七对的基础上*2，可与龙、双龙、三龙叠加」）"
  - "高分玩法勾选后七对系列换档：七对8/龙七对20/双龙七对40/三龙七对80（三龙七对128变80为唯一降档项，非笔误，系20、40、80完整乘2链的必然取值，按需求明示值80落地）；高分玩法与「三元七对*8」互斥，勾选高分玩法时三元七对被强制取消不参与判定"
  - "三元七对为创房开关型：勾选「三元七对*8」后才启用，不勾选则不参与判定（不是降为4倍）"
  - "互斥：七对类与明四归/暗四归互斥（七对类结构上无碰牌区，明四归不可能成立；暗四归需求逐条明示互斥）；三元七对与小三元/大三元互斥（不会同时触发）"
  - "与清一色可叠加（全筒七对=4+4=8倍）；与4副面子结构可同时成立时跨结构取分值较高者"
  - "行牌依赖：有碰/明杠破坏七对（14张须全在手）；声明暗杠同样破坏（4张入杠牌区），不声明则留手作两对构成龙七对；门清未被需求列为前置条件；双龙七对/三龙七对为卡五星专属档位"
normal_flow: []
exception_flow: []
state_transitions: []
