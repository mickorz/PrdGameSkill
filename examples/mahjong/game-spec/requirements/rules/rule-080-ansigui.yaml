id: GAME-RULE-080
type: game_rule
name: "暗四归（F05）"
status: proposed
authority: fixed
description: "非碰杠牌区4张相同牌且可拆为刻子加顺子的四归番型，4倍，受全/半频道控制。"
source:
  kind: original
  document: "source/04-番型.md"
  section: "4.3 暗四归（F05 · 4 倍）"
  page: null
  quote: "| **非碰杠牌区 4 张相同** | 非碰杠牌区有 4 张相同牌（含胡的那张）| 不计暗四归 |"
preconditions:
  - "玩家已形成14张和牌牌型"
inputs:
  - "手牌与碰杠牌区共14张牌面"
  - "和入的那张牌"
  - "频道配置（全频道/半频道）"
outputs:
  - "番型判定结果"
  - "牌型分倍数"
business_rules:
  - "F05 暗四归=4倍，四归子维度；判定条件为非碰杠牌区有4张相同牌（含胡的那张）且可拆为刻子+顺子；双顺子+雀头不算（采细则条款口径，细则优于摘要）"
  - "需求括注「刻子可以是碰的牌」不采为现行规则：与「非碰杠牌区」两处表述不相容，若刻子可取自碰杠区则明四归与暗四归无法区分（Step 5已裁）"
  - "「暗四归结构限制」（刻子+顺子限制）自带「做成配置」标注属可配置项，但三张创房表均无对应开关；该定位标识名系文档自拟非需求原名"
  - "频道控制：全频道下存在符合四归结构即计算；半频道下胡的那张牌必须是四归第四张才计算；无倍数调节项"
  - "杠的4张在杠牌区不构成暗四归；碰区3张+手牌1张属明四归形态不是暗四归；四归各只计一次"
  - "互斥：与七对类（含龙七对/三元七对/双龙七对/三龙七对）互斥（需求逐条明示）；与清一色可叠加（推导：需求互斥仅限定明四归）；与明四归可同时成立并叠加（2+4=6）；与平胡/碰碰胡/卡五星/手抓一可叠加"
normal_flow: []
exception_flow: []
state_transitions: []
ui_refs: []
test_refs: []
dependencies: []
open_questions: []
