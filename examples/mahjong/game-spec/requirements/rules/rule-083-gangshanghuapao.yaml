id: GAME-RULE-083
type: game_rule
name: "杠上花与杠上炮（J03/J04）"
status: proposed
authority: fixed
description: "杠牌后补牌胡牌为杠上花、杠牌后打牌点炮为杠上炮，各2倍，勾选后4倍。"
source:
  kind: original
  document: "source/04-番型.md"
  section: "5.3 杠上花 / 杠上炮（J03 / J04 · 各 2 倍）"
  page: null
  quote: "| **触发** | 杠牌后通过**补的牌**胡牌 | 杠牌后**打出的牌**让其他玩家胡牌 |"
preconditions:
  - "行牌中出现杠牌后立即胡牌或点炮"
inputs:
  - "杠牌后的行牌事件（补牌胡牌/打牌点炮）"
  - "创房「杠上花/炮*4」勾选状态"
outputs:
  - "加倍倍数（乘算到番型分，参与封顶）"
business_rules:
  - "J03 杠上花=2倍：杠牌后通过补的牌胡牌；J04 杠上炮=2倍：杠牌后打出的牌让其他玩家胡牌"
  - "创房勾选「杠上花/炮*4」后变为4倍"
  - "生效条件采「默认生效2倍、勾选后4倍」：需求既明写「杠上开花倍数*2」（无勾选前置）且创房表用「变为」句式；「勾选后生效」表述与此矛盾不采"
  - "触发时倍数不跟随杠上杠翻倍，走初始值（初始2，勾选后4）"
  - "基础玩法下杠开与其他番型叠加乘算（文档裁决：加倍项定义即乘算，需求仅留批注「杠开不与其他番型叠加？」未给答案）；高分玩法下「杠上开花+卡五星」按独立合并档杠开卡五星20倍计，不叠乘"
  - "加倍项参与封顶截断"
normal_flow: []
exception_flow: []
state_transitions: []
ui_refs: []
test_refs: []
dependencies: []
open_questions:
  - "「杠开是否与其他番型叠加」为文档裁决（需求该处仅留批注未给答案），结论为叠加（乘算），建议向产品复核确认"
