inputs:
  - "上一小局结果（荒庄/一炮多响）"
  - "本小局开局骰子点数"
outputs:
  - "加倍倍数（乘算到番型分，参与封顶）"
business_rules:
  - "J08 上楼：同一大局内上一小局荒庄或一炮多响，本小局倍数乘2；本小局开局打骰子时两个骰子点数一致，本小局倍数乘2；两条件同时触发乘4，翻倍可叠加最高4倍"
  - "需创房勾选「上楼」才生效"
  - "上楼为加倍项，不可突破封顶倍数"
  - "「倍数」射程为番型乘加倍项，不含马/漂/坎等加分项（Step 5裁决：采加倍项表口径，【上楼】名词解释的「所有分数*2」与「不可突破封顶倍数」不相容，不采）"
