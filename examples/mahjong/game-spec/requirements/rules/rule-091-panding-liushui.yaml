id: GAME-RULE-091
type: game_rule
name: "番型判定流水线"
status: proposed
authority: fixed
description: "番型判定的四步流水线：拆结构取档、叠加各维度、剔除互斥求和、加倍乘算与加分加算。"
source:
  kind: original
  document: "source/04-番型.md"
  section: "1.2 判定流水线"
  page: null
  quote: "【第 1 步】拆结构，取结构档位"
preconditions: []
inputs:
  - "14张和牌牌面（手牌+碰杠牌区）"
  - "和入的那张牌"
  - "行牌过程记录"
outputs:
  - "结构档位判定"
  - "牌型分倍数（求和后经加倍项乘算）"
business_rules:
  - "第1步拆结构取结构档位：能拆成7对（2N）按龙数取档（3种128倍/2种32倍/1种8倍/0种4倍）；能拆成4副面子+1对将按全刻/含顺定碰碰胡（2倍）或平胡（1倍）；两者同时成立时取分值较高者（跨结构）；都拆不出则不可胡"
  - "第2步叠加各维度（与第1步结果相加）：三元维度（大三元8/小三元4）、花色维度（清一色4，与三元互斥）、听口维度（卡五星2）、手牌形态维度（手抓一2）、四归子维度（明四归2/暗四归4）；七对结构侧另判三元七对"
  - "第3步剔除互斥项，其余求和得牌型分"
  - "第4步加倍项乘算并参与封顶截断；加分项加算且不受封顶（细则见结算文档）"
  - "判定层次（番型ID与判胡顺序章）：结构内取高（七对按龙数取档；4副面子下小三大三元取高），再叠加各维度并处理互斥清单，各维度求和得牌型分，加倍项乘算（例外：高分玩法下杠开卡五星按20倍合并档，不叠乘），加分项加算"
  - "需求未提供番型ID枚举，技术侧番型ID定义属08-技术文档范畴，测试与开发对齐番型ID时以技术侧文档为准"
normal_flow: []
exception_flow: []
state_transitions: []
