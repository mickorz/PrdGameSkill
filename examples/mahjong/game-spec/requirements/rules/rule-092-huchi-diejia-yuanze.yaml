name: "全局叠加与互斥原则"
status: proposed
authority: fixed
description: "计番总口径：按维度分层，同一维度内取高，跨维度叠加，并列需求明示互斥清单。"
source:
  kind: original
  document: "source/04-番型.md"
  section: "1.3 全局叠加与互斥原则"
  page: null
  quote: "**总口径：按「维度」分层——同一维度内取高，跨维度叠加。**"
preconditions: []
inputs:
  - "各维度番型命中集合"
outputs:
  - "牌型分倍数（剔除互斥后求和）"
business_rules:
  - "总口径：按「维度」分层，同一维度内取高，跨维度叠加"
  - "维度划分：结构维度（平胡1/碰碰胡2）、花色维度（清一色4）、三元维度（小三元4/大三元8）、听口维度（卡五星2）、手牌形态维度（手抓一2，明示与碰碰胡叠加）、四归子维度（明四归2/暗四归4各自独立，可同时成立叠加2+4=6，各只计一次）、七对维度（4/8/32/128）、七对叠加项（三元七对在所取档位上乘2，不按取高处理）"
  - "需求明示互斥（写死，不适用取高规则）：清一色与明四归互斥（同时触发仅计清一色，仅限明四归）；七对类与明/暗四归互斥；龙七对/三元七对/双龙七对/三龙七对与暗四归互斥；三元七对与小三元/大三元互斥（不会同时触发）"
  - "清一色与三元类互斥为推导：三元必含中/发/白，清一色禁字牌，结构上不可能同时成立"
  - "清一色与暗四归可叠加为推导：需求互斥只限定明四归，按「未规定即不互斥」推导"
  - "取高+叠加口径为推导结论：是唯一能同时满足「碰碰胡=2倍」与「清一色+平胡可同计」两条需求事实的解释"
  - "其他原则：四归各只计一次；三元维度内大三元覆盖小三元；七对维度内按龙数递增取最高档（三元七对不在其内，是七对维度之上的叠加项）；跨结构（七对与4副面子）可同时成立时取分值较高者"
