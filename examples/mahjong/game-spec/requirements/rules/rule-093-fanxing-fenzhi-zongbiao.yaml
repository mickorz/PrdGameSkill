id: GAME-RULE-093
type: game_rule
name: "番型分值总表"
status: proposed
authority: fixed
description: "全部27条番型条目的分值总表：基础番型14条、加倍项8条、加分项4条、高分玩法合并档1条。"
source:
  kind: original
  document: "source/04-番型.md"
  section: "1.4 番型分值总表"
  page: null
  quote: "> 本表列出本玩法**全部**番型条目。**倍数一律照抄需求声明值**，不做递推。"
preconditions: []
inputs:
  - "番型命中集合"
  - "创房配置（高分玩法/倍数调节开关）"
outputs:
  - "牌型分倍数（照抄需求声明值）"
business_rules:
  - "基础番型14条（倍数照抄声明值）：F01平胡1倍、F02碰碰胡2倍（创房可调4倍、高分玩法下8倍）、F03卡五星2倍（创房可调4倍、高分玩法下8倍）、F04明四归2倍、F05暗四归4倍、F06七对4倍（高分玩法下8倍）、F07小三元4倍、F08清一色4倍、F09手抓一2倍、F10大三元8倍、F11龙七对8倍、F12三元七对8倍、F13双龙七对32倍、F14三龙七对128倍"
  - "加倍项8条（参与封顶）：J01亮倒2倍、J02对亮2倍、J03杠上花2倍（勾选后4倍）、J04杠上炮2倍（勾选后4倍）、J05抢杠胡2倍（勾选「杠上花/炮*4」后4倍）、J06海底捞2倍、J07海底炮2倍、J08上楼2倍或4倍"
  - "其他加分项4条（不参与封顶）：A01漂分（双方漂数合计x底分）、A02买马（按马数规则）、A03数坎（暗刻+1/明杠直杠+1/暗杠+2/手中四张+2，倍底分）、A07杠分"
  - "高分玩法合并档：J09杠开卡五星=20倍底分，仅「高分玩法」勾选后存在，同时触发杠上开花与卡五星时按本档计；为独立合并值20，不按分量相乘推导（8x8=64不等于20）；基础玩法下无此合并档，仍按加倍项与番型分别乘算"
  - "高分玩法换档8个番型（需求换档清单）：七对8/龙七对20/双龙七对40/三龙七对80/卡五星8/碰碰胡8/杠上开花8/杠开卡五星20（倍底分）；其中6项升档，三龙七对128变80为唯一降档项，非笔误，系高分档七对系列20、40、80完整乘2链的必然取值，按需求明示值80落地；高分玩法为另一套档位表，非基准表等比放大"
  - "条目数核对：基础番型14+加倍项8+加分项4+高分玩法合并档1=27条，与需求对应条目一致；本玩法无「X+Y=Z」形态的常规组合番型，三元七对与龙系列的关系是叠加不是独立组合番型"
  - "明四归/暗四归无倍数调节项（受频道控制触发）"
normal_flow: []
exception_flow: []
state_transitions: []
