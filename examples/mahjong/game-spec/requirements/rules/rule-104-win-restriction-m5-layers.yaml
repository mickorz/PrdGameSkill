id: GAME-RULE-104
type: game_rule
name: 胡牌限制层（M5）
status: proposed
authority: fixed
description: 牌型成立后还需通过番数门槛、危牌、亮倒、漏胡、操作优先级五层限制，任一拦截即不可胡。
source:
  kind: original
  document: source/05-胡牌类型.md
  section: "二、胡牌限制层（M5）"
  page: null
  quote: "牌型成立之后，还需通过以下 5 层限制，**任一拦截即不可胡**（与 [基础规则 §七](01-基础规则.md)、[打牌操作 §7.2](03-打牌操作.md) 同源）："
preconditions:
  - "牌型判定通过（第一层）"
inputs:
  - "番型与加倍项"
  - "打出的牌"
  - "亮倒状态与创房选项"
  - "漏胡状态"
  - "同牌多人操作情况"
outputs:
  - "可胡或拦截的判定结果"
business_rules:
  - "牌型成立之后还需通过 5 层限制，任一拦截即不可胡。"
  - "层 1 番数门槛：番型 × 加倍项不大于 1 时不可捉炮；自摸不受限。"
  - "层 2 危牌限制：打出的牌是危牌则该牌不可打出（出牌阶段即被阻断，提示「打出该牌将会放炮！」）；手中全是危牌时可打出。"
  - "层 3 亮倒限制（可选）：勾选「胡牌必须亮倒」且自己未亮倒则不可胡；勾选【卡五星专属】双亮后，3 人局已有 2 个玩家亮倒时第三个玩家无需亮倒也能胡牌。"
  - "层 4 漏胡限制：玩家处于漏胡状态时摸牌前不可胡牌；摸牌后（含杠后补牌）解除。"
  - "层 5 操作优先级：吃胡 / 自摸 / 抢杠胡优先于碰 / 杠。"
normal_flow:
  - "牌型成立 -> 依次过五层限制 -> 全部通过 -> 可胡进入结算"
exception_flow:
  - "任一层拦截 -> 不可胡"
state_transitions: []
