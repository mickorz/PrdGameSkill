id: GAME-RULE-110
type: game_rule
name: 抢杠胡
status: proposed
authority: fixed
description: 他家明杠补杠的牌恰为自己要胡的牌可抢杠胡，属点炮类，抢杠后明杠玩家视为未杠成功不收杠分。
source:
  kind: original
  document: source/05-胡牌类型.md
  section: 六、抢杠胡
  page: null
  quote: '| **触发** | 其他玩家进行**明杠（补杠）**，且明杠的牌恰为自己的胡牌 |'
preconditions:
  - 其他玩家执行明杠（补杠）
  - 自己听牌且胡张恰为补杠之牌
inputs:
  - 补杠的牌
  - 创房勾选「杠上花/炮*4」
  - 抢杠人数
outputs:
  - 抢杠胡成立、明杠玩家杠分回退、杠上杠中断
business_rules:
  - 触发：其他玩家进行明杠（补杠），且明杠的牌恰为自己的胡牌。
  - 范围：仅针对明杠（补杠）；直杠、暗杠不可抢（需求只正面声明明杠可抢，推导排除）。
  - 可多人抢杠胡一家。
  - 倍数：×2（勾选「杠上花/炮*4」后 ×4）；倍数不跟随杠上杠翻倍，走初始值。
  - 后果：抢杠胡后明杠玩家视为未杠成功，不收取杠分，杠上杠也会中断、连杠次数清零。
  - 杠分冲销：因杠分实时结算，「视为未杠成功」实现上为已实时收取的该杠杠分回退（由两句合成推导）。
  - 归类点炮类：番数门槛大于 1 才可，受危牌、亮倒、漏胡限制；收分对象为补杠的那一家。
  - 坐庄：多人抢杠胡时由补杠的那一家坐庄（按一炮多响点炮玩家坐庄口径）。
  - 优先级：抢杠胡属高优先级（吃胡/自摸/抢杠胡 > 碰/杠）。
  - 界面：手牌右上方显示【胡】+【过】。
normal_flow:
  - 他家补杠 -> 抢杠询问 -> 有人抢杠胡 -> 明杠作废杠分回退 -> 按点炮类结算
  - 补杠进行中 -> 抢杠胡成立 -> 补杠作废（杠分回退、杠上杠中断）
exception_flow:
  - 补杠时有人选择是否抢杠胡 -> 不播放杠动画与飘分 -> 待选择完成后按杠和胡走对应流程
state_transitions: []
ui_refs: []
test_refs: []
dependencies:
  - GAME-RULE-011
  - GAME-RULE-084
