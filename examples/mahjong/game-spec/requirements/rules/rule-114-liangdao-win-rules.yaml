id: GAME-RULE-114
type: game_rule
name: 亮倒类胡法
status: proposed
authority: fixed
description: 亮倒作为限制层勾选胡牌必须亮倒时仅亮倒可胡且与双亮互斥，作为加倍项亮倒状态输赢均番型分乘2倍。
source:
  kind: original
  document: source/05-胡牌类型.md
  section: "十、亮倒类"
  page: null
  quote: "| **胡牌必须亮倒** | 勾选后，**仅亮倒状态下才能胡牌**；**与双亮互斥** |"
preconditions:
  - "创房勾选「胡牌必须亮倒」或「【卡五星专属】双亮」（二者互斥）"
inputs:
  - "玩家亮倒状态"
  - "局内亮倒人数"
  - "创房勾选「对亮*2」"
outputs:
  - "能否胡牌的判定与亮倒加倍项"
business_rules:
  - "限制层「胡牌必须亮倒」：勾选后仅亮倒状态下才能胡牌；与双亮互斥。"
  - "限制层「【卡五星专属】双亮」：仅卡五星有此选项；仅 3 人时可勾选，2 人时置灰；勾选后 3 人局若已有 2 个玩家亮倒，第三个玩家无需亮倒也能胡牌；与「胡牌必须亮倒」互斥；勾选后若改为 2 人开局，该规则自动失效。"
  - "加倍项：亮倒状态输 / 赢均计算，番型分 ×2，不影响加分项。"
  - "双方均亮倒（对亮）未勾选「对亮*2」时，仅计一次亮倒 ×2（需求原文说明：对亮比未勾选时多一个）。"
  - "亮倒不改变能否胡牌的判定，只在限制层（若勾选「胡牌必须亮倒」）与加倍项上起作用。"
  - "玩家亮倒后自己的危牌标签去掉，不再受危牌限制。"
  - "亮倒后扣牌：扣下的刻子不可打出、不可杠（除非满足杠的条件）。"
normal_flow: []
exception_flow: []
state_transitions: []
