id: GAME-RULE-117
type: game_rule
name: 牌型分汇总（S1）
status: proposed
authority: fixed
description: 牌型分按维度化口径汇总，同一维度内取高、跨维度相加，并按需求明示互斥规则剔除后求和。
source:
  kind: original
  document: source/06-结算.md
  section: "二、牌型分（S1）"
  page: null
  quote: "**牌型分** = 按 [番型 §1.3](04-番型.md) 的**维度化口径**汇总：**同一维度内取高、跨维度相加**。"
preconditions:
  - "牌型判定通过"
  - "（如勾选）高分玩法已按 M9 换档"
inputs:
  - "各维度成立的番型"
outputs:
  - "牌型分（倍数）"
business_rules:
  - "汇总口径：同一维度内取高、跨维度相加。"
  - "维度与倍数：结构维度平胡 1 / 碰碰胡 2（创房可调 4，高分玩法下 8）；花色维度清一色 4；三元维度小三元 4 / 大三元 8；听口维度卡五星 2；手牌形态维度手抓一 2；四归子维度明四归 2 / 暗四归 4 各自独立（受频道控制触发，二者可同时成立即叠加，各自只计一次）；七对维度七对 4 / 龙七对 8 / 双龙七对 32 / 三龙七对 128（高分玩法下 8 / 20 / 40 / 80）；七对叠加项三元七对 8（在七对维度所取档位基础上 ×2，可与龙类叠加，不按取高处理）。"
  - "跨结构处理：七对维度与结构维度可同时成立时取分值较高者，不互斥。"
  - "需求明示互斥：清一色与明四归仅计清一色（仅限明四归）；清一色与暗四归可叠加；七对类不计四归；三元七对与小三元 / 大三元不会同时触发；清一色与三元类结构上不可能同时成立。"
  - "示例：碰碰胡 2 + 清一色 4 + 手抓一 2 = 8 倍；大三元 8 + 平胡 1 = 9 倍，大三元 + 碰碰胡 = 10 倍；清一色与明四归同时满足仅计清一色 4 倍；全筒七对 = 七对 4 + 清一色 4 = 8 倍。"
normal_flow:
  - "收集各维度成立番型 -> 同维度取高 -> 跨维度相加 -> 剔除明示互斥项 -> 输出牌型分"
exception_flow: []
state_transitions: []
