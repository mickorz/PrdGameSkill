id: GAME-RULE-119
type: game_rule
name: 加倍项（S3）
status: proposed
authority: open
description: 番型乘加倍项等于牌型分乘各加倍项倍数连乘，含亮倒、对亮、杠开、抢杠、海底、上楼八项。
source:
  kind: original
  document: source/06-结算.md
  section: "四、加倍项（S3）"
  page: null
  quote: "番型 × 加倍项 = 牌型分 × Π(各加倍项倍数)"
preconditions:
  - "S1 牌型分已确定（含 M9 换档）"
inputs:
  - "各加倍项触发状态与创房勾选"
outputs:
  - "番型 × 加倍项结果"
business_rules:
  - "公式：番型 × 加倍项 = 牌型分 × Π(各加倍项倍数)。"
  - "加倍项表：亮倒 2（输 / 赢均计算，不影响加分项）；对亮 2（勾选后胡牌双方均亮倒与亮倒相乘得 4 倍，未勾选只计一个亮倒 ×2）；杠上花 2（勾选「杠上花/炮*4」后 4）；杠上炮 2（勾选后 4）；抢杠胡 2（勾选「杠上花/炮*4」后 4，与杠上花 / 炮并列受同一勾选控制）；海底捞 2 / 海底炮 2（勾选「海底捞/炮*2」后生效）；上楼 2 / 4。"
  - "杠开叠加裁决：杠上花 / 杠上炮列于加倍项表，与其他番型乘算叠加不互斥；高分玩法下「杠开卡五星」按 20 倍合并档计（不叠乘），基础玩法仍按加倍项乘算。"
  - "加倍项与杠上杠：杠上杠时触发杠上花、杠上炮、抢杠胡，倍数不跟随杠上杠翻倍走初始值（初始 2，可勾选为 4）；杠上杠仅计算杠分。"
  - "易错：亮倒只乘番型分不影响加分项；双方都亮倒未勾选「对亮*2」只计一个亮倒 ×2；上楼是加倍项受封顶约束。"
normal_flow:
  - "识别触发加倍项 -> 连乘到牌型分 -> 输出番型 × 加倍项"
exception_flow: []
state_transitions: []
ui_refs: []
test_refs: []
dependencies:
  - "GAME-RULE-081"
  - "GAME-RULE-082"
  - "GAME-RULE-083"
  - "GAME-RULE-084"
  - "GAME-RULE-085"
  - "GAME-RULE-086"
  - "GAME-RULE-120"
open_questions:
  - "需求 §3.1.1.2 留批注「杠开不与其他番型叠加？」未给答复，本文档裁决为乘算叠加（依据：杠上花与杠上炮列于需求「加倍项」表，加倍项定义为在牌型分上乘算），待需求方确认。"
