id: GAME-RULE-126
type: game_rule
name: 荒庄查叫（S9）
status: proposed
authority: fixed
description: 可摸牌数为0且无人胡牌即荒庄，勾选查叫后未听牌玩家向听牌玩家赔付底分乘番型乘加倍项加漂坎分。
source:
  kind: original
  document: source/06-结算.md
  section: 12.2 查叫（需勾选）
  page: null
  quote: 未听牌玩家 → 听牌玩家 赔付： 底分 × 番型 × 加倍项 + 漂分 + 坎分
preconditions:
  - 荒庄成立（可摸牌数 = 0 且无人胡牌）
  - 创房勾选「查叫」
inputs:
  - 各玩家听牌状态
  - 未听牌玩家的番型与加倍项、漂数、坎数
outputs:
  - 查叫赔付金额
business_rules:
  - 荒庄触发：玩家可摸牌数 = 0（牌堆摸完）仍无人胡牌。
  - 查叫开启：需勾选「查叫」才开启。
  - 赔付公式：未听牌玩家向听牌玩家赔付：底分 × 番型 × 加倍项 + 漂分 + 坎分。
  - 最大倍数计亮倒（需求原文：「最大倍数计亮倒」）。
  - 封顶：「底分 × 番型 × 加倍项」受封顶控制；漂分、坎分不受封顶影响；查叫金额被截断时按与胡分同一标识规则展示（输分者总得分处加【封顶】标识、详情分数下方写「（封顶）」）。
  - 坎分：查叫时计算坎分，但不计算胡的那张牌（没有胡）；听双碰时会生效。
  - 漂：查叫时漂也赔；买马：荒庄不买马；杠分：荒庄后杠分不退还。
  - 流程：牌堆摸完无人胡 -> 所有玩家摊牌展示并展示【荒庄】 -> 有未听牌玩家则飘字【未听牌】 -> 展示查叫分数与亮倒赔付 -> 出小结算界面。
normal_flow:
  - 荒庄 -> 摊牌 -> 未听牌玩家赔付听牌玩家 -> 出小结算
exception_flow:
  - 无未听牌玩家 -> 直接出小结算
state_transitions: []
ui_refs: []
test_refs:
  - GAME-TC-007
dependencies:
  - GAME-RULE-028
  - GAME-RULE-121
  - GAME-RULE-124
  - GAME-RULE-125
  - GAME-RULE-127
open_questions:
  - 需求 §2.3.6 为标题带「待补充」的规则页草稿节，其「查叫赔 2 倍分」与 §2.4 查叫主口径（1 倍）冲突且含本变体不存在的选项，该节未定稿不作为口径依据。
