id: GAME-RULE-127
type: game_rule
name: 亮倒荒庄赔付（S9）
status: proposed
authority: open
description: 荒庄后存在亮倒玩家时，本小局第一个亮倒的玩家向其他所有玩家赔付1倍底分，可与查叫同时赔付。
source:
  kind: original
  document: source/06-结算.md
  section: "12.3 亮倒荒庄赔付（首亮赔付）"
  page: null
  quote: "**规则**：荒庄后，如果存在玩家亮倒，本小局**第一个亮倒的玩家**向**其他所有玩家**赔付 **1 倍底分**。"
preconditions:
  - "荒庄成立"
  - "本小局存在亮倒玩家"
inputs:
  - "首个亮倒玩家标识"
  - "变体类型（卡五星或十堰卡五星）"
outputs:
  - "首亮赔付金额与收付方向"
business_rules:
  - "规则：荒庄后如果存在玩家亮倒，本小局第一个亮倒的玩家向其他所有玩家赔付 1 倍底分。"
  - "变体：卡五星 1 倍底分；十堰卡五星 2 倍底分（需求 §2.2.2 明示）。"
  - "赔付对象裁决：采名词定义与规则详情两处「其他玩家」口径，即除自己外的全部玩家（含未亮倒者）；§2.4「其他亮倒玩家」带「存在多个亮倒玩家时」前置条件，属多人亮倒子场景说明，不构成赔付对象限定。"
  - "金额表述裁决：「1 倍底分」与「1 分」数值相同（底分 = 1），统一采用「1 倍底分」表述。"
  - "查叫与亮倒荒庄可同时赔付（卡五星、十堰卡五星）。"
  - "展示：结算页签输分者展示【首亮赔付-X】、赢分者【首亮赔付+X】；先展示查叫、后展示首亮赔付。"
normal_flow:
  - "荒庄 -> 确定首个亮倒玩家 -> 向其他所有玩家赔付 -> 结算页签展示"
exception_flow: []
state_transitions: []
ui_refs: []
test_refs: []
dependencies:
  - "GAME-RULE-126"
  - "GAME-RULE-012"
  - "GAME-RULE-130"
open_questions:
  - "首亮赔付对象需求三处表述不同（其他玩家与其他亮倒玩家），本文档裁决采「其他所有玩家（含未亮倒者）」，待需求方确认。"
