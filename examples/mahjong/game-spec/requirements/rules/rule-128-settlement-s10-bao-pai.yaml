id: GAME-RULE-128
type: game_rule
name: 包牌（S10）
status: proposed
authority: open
description: 仅3人局点炮亮倒玩家时，点炮者支付相当于该亮倒玩家自摸的分数含番型加倍项马漂坎，马分由点炮者一人承担。
source:
  kind: original
  document: source/06-结算.md
  section: "十三、包牌（S10）"
  page: null
  quote: "| **赔付范围** | 点炮者需支付**相当于亮倒玩家自摸的分数**，含：**番型 × 加倍项、马、漂、坎** |"
preconditions:
  - "3 人局且创房勾选「包牌」（2 人时选项灰色且不勾选）"
  - "点炮对象处于亮倒状态"
inputs:
  - "点炮玩家"
  - "亮倒的捉炮玩家"
  - "是否还有其他亮倒玩家"
outputs:
  - "点炮者的包赔金额"
business_rules:
  - "适用范围：仅 3 人时开启；少人开局变为无效；创房面板选 2 人时选项灰色且不勾选。"
  - "触发：点炮亮倒玩家。"
  - "赔付范围：点炮者需支付相当于亮倒玩家自摸的分数，含番型 × 加倍项、马、漂、坎。"
  - "与买马：包牌下买马照常触发，马分由点炮者一人承担（视同自摸，两种买马触发条件均满足）；买马算法与买一 / 买一送一 / 买 5 马 / 买 6 马各档同常规。"
  - "第二家亮倒：如果另一个玩家也亮倒，则还需支付给另一个玩家分数（按其点炮计算，马、漂、坎也要计算）。"
  - "结算标签（A 点炮给 B，C 也亮倒）：点炮者 A 展示【点炮】；捉炮者 B 展示【包牌】；获得包牌赔付的玩家 C 展示【包牌】。"
normal_flow:
  - "点炮亮倒玩家 -> 点炮者按自摸口径包赔（含番型加倍项马漂坎）"
exception_flow: []
state_transitions: []
ui_refs: []
test_refs: []
dependencies:
  - "GAME-RULE-012"
  - "GAME-RULE-123"
  - "GAME-RULE-124"
  - "GAME-RULE-125"
  - "GAME-RULE-129"
open_questions:
  - "「第二家亮倒」需求说明列与说明内容列口径不同（分项构成与支付最大牌型分），本文档裁决采说明列细则口径（按其点炮计算，马漂坎也要计算），待需求方确认。"
