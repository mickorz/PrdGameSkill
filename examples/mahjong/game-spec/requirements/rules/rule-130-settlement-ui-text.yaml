id: GAME-RULE-130
type: game_rule
name: 结算界面文案规则
status: proposed
authority: fixed
description: 结算信息按胡分杠分荒庄查叫漂分马分其他分排序展示，未开启规则显示加0，多条用英文逗号分隔，含标签与详情页规则。
source:
  kind: original
  document: source/06-结算.md
  section: "十五、结算界面文案规则"
  page: null
  quote: "胡分 → 杠分 → 荒庄查叫 → 漂分 → 马分 → 其他分（坎分）"
preconditions:
  - "小局或大局结算"
inputs:
  - "各玩家分项流水"
outputs:
  - "结算页签与详情页文案"
business_rules:
  - "整体顺序：每个玩家结算信息按胡分 -> 杠分 -> 荒庄查叫 -> 漂分 -> 马分 -> 其他分（坎分）从前到后展示。"
  - "计算口径：胡分仅计算「番型 × 加倍项」；未开启的规则也会显示，分数固定显示 +0；多条信息每条之间用英文逗号隔开。"
  - "展示规则：胡分仅展示玩家自己参与分数流转的胡分，自摸 / 一炮多响 / 包牌 / 查叫赔付多人等多条胡分合并为一条展示总得分；杠分仅展示自己参与流转的杠分，未参与或总和为 0 不展示；漂分、马分合并计算只显示一条【漂+X / 漂-X】【马+X / 马-X】；荒庄赔付先查叫后首亮赔付，未开启规则或为 0 不显示。"
  - "胡牌页签：自摸【自摸 / 被自摸】、点炮【捉炮胡 / 点炮】、一炮多响【捉炮胡 / 一炮多响】、包牌捉炮者与获赔者【包牌】点炮者【点炮】、查叫【查叫 / 被查叫】、亮倒赔付双方【首亮赔付】。"
  - "封顶标识：输时若触发番型封顶，额外增加【封顶】标识；赢的玩家不展示。"
  - "详情页：整体顺序杠分 -> 胡分 -> 荒庄查叫；杠分按发生顺序显示，杠上杠第二行显示「杠上杠 *Y」；胡分多家信息完全一致合并为一条展示总得分与「两家」，否则按逆时针顺序分条，第二行番型加倍项有亮倒信息优先展示「亮倒 X2」、有其他番型时不展示【平胡】；查叫每个玩家一条逆时针拆分展示，首亮赔付仅展示一条；其他分 / 漂分 / 马分各仅一行。"
  - "大结算：统计自摸 X 次、点炮 X 次（一炮多响只算一次，一小局最多一次）、亮倒、未听（荒庄流局时未听牌次数）；战绩周报特殊游戏次数使用「亮倒次数」。"
