id: GAME-STATE-001
type: state
name: 全局对局状态机
status: proposed
authority: fixed
description: 从未开局到续局的九个全局状态（未开局、房间内、打漂、定庄、发牌、行牌、和牌结算、荒庄、续局）及流转。
source:
  kind: original
  document: source/02-游戏流程.md
  section: "卡五星（好友房）· 游戏流程（引言）"
  page: null
  quote: "> 一局从开始到结束按时间发生什么：开局准备 → 打漂 → 定庄 → 摇骰方位 → 发牌 → 行牌 → 结束 → 结算续局；操作的条件与后果见 [打牌操作](03-打牌操作.md)。"
preconditions: []
inputs: []
outputs: []
business_rules:
  - 未开局：无对局；方位为无方位展示（02-游戏流程 §五）。
  - 房间内：房主创房（选变体与参数）、玩家逆时针入座且座位固定（2 人一上一下 / 3 人左·下·右）；每次开房首局播放开局动画，之后开局直接进入摇骰发牌（§一）。
  - 打漂：按漂模式执行（不漂跳过、固定漂直接展示结果、首局定漂仅大局第一小局、自由漂每小局），全员完成后开始打骰子（§三）。
  - 定庄：随机庄 / 房主庄（默认房主庄），骰子转动停止后定庄并定方位（庄为东、其余逆时针），符合上楼则展示「上楼X2/X4」；逻辑上先于发牌（§四 / §五）。
  - 发牌：从庄家位逆时针按 4+4+4+1（+庄 1）发牌，庄 14 闲 13，发毕自动理牌立起；余量 3 人 44 / 2 人 57（§六）。
  - 行牌：逆时针摸打循环，响应优先级吃胡 / 自摸 / 抢杠胡 > 碰 / 杠，含亮倒扣牌与杠后补牌，直至有人胡牌或可摸牌数 = 0（§七）。
  - 和牌结算：有人胡牌 → 摊牌展示 →（触发则买马）→ 小结算（§8.1 / §九 / §10.1）。
  - 荒庄：可摸牌数 = 0 且无人胡牌 → 摊牌展示 → 未听牌时查叫与亮倒荒庄赔付 → 小结算（§8.2）。
  - 续局：小结算后按轮庄规则（胡者坐庄 / 一炮多响点炮者坐庄 / 荒庄连庄）进入下一小局；最后一小局进入大结算（§10.3 / §10.2）。
normal_flow:
  - "未开局 -> 房间内（房主创房完成）"
  - "房间内 -> 打漂（开局且漂模式需选漂）"
  - "房间内 -> 定庄（漂模式为不漂或固定漂，跳过选漂环节）"
  - "打漂 -> 定庄（全员选漂完成，开始打骰子）"
  - "定庄 -> 发牌（骰子停止、方位确定）"
  - "发牌 -> 行牌（理牌完成，庄家先出牌）"
  - "行牌 -> 和牌结算（有玩家胡牌）"
  - "行牌 -> 荒庄（可摸牌数 = 0 且无人胡牌）"
  - "和牌结算 -> 续局（摊牌、买马、小结算完成）"
  - "荒庄 -> 续局（摊牌、查叫与亮倒赔付、小结算完成）"
  - "续局 -> 打漂（自由漂模式新小局，或新大局首局定漂）"
  - "续局 -> 定庄（固定漂 / 不漂模式新小局）"
exception_flow:
  - "续局 -> 大结算（最后一小局，点击【查看结算】）"
  - "重新匹配 -> 未开局（方位重置为无方位展示）"
