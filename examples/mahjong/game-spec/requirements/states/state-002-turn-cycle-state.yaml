id: GAME-STATE-002
type: state
name: 行牌回合状态机
status: proposed
authority: fixed
description: 行牌阶段单个回合的子状态（等待出牌、等待响应、摸牌中、补牌中、亮倒扣牌）及流转。
source:
  kind: original
  document: source/02-游戏流程.md
  section: "七、行牌阶段"
  page: null
  quote: "**摸牌与出牌的衔接**：**摸牌需在上一家打出牌的同时进行**——肉眼可见上家打出牌的瞬间下家摸牌。"
preconditions:
  - 全局状态处于行牌（GAME-STATE-001）
inputs:
  - 出牌 / 碰 / 杠 / 胡 / 过 / 亮倒 / 扣牌操作
outputs:
  - 出牌权流转或终局转移
business_rules:
  - 等待出牌：当前玩家持出牌权待打牌；庄家发牌后起手 14 张直接进入该状态先出牌（02-游戏流程 §七）。
  - 等待响应：一张牌打出后其余玩家可响应，按优先级吃胡 / 自摸 / 抢杠胡 > 碰 / 杠；无人操作则下家摸牌，摸牌与上家出牌同时进行（§七）。
  - 摸牌中：下家从牌堆摸 1 张，视为进入其回合（§七）。
  - 补牌中：杠牌成功后从牌堆倒序摸 1 张，视为摸牌，牌堆额外减 1（01-基础规则 §4.4）。
  - 亮倒扣牌：打出非危牌后可听牌或自摸时触发亮倒权限；亮倒同时进行扣牌判断，扣牌取消等同过，明牌后只能摸打（01-基础规则 §5.1 / §5.2）。
  - 杠上杠连杠可在补牌中继续杠进入下一轮补牌，杠分按 2^(连续杠次数−1) 翻倍（01-基础规则 §4.2）。
  - 漏胡：等待响应中可胡而不胡则进入漏胡状态，摸牌前不可胡牌，摸牌（含补牌）后解除（01-基础规则 §八）。
normal_flow:
  - "发牌完成 -> 等待出牌（庄家 14 张先出牌）"
  - "等待出牌 -> 等待响应（当前玩家打出一张牌）"
  - "等待响应 -> 摸牌中（无人碰杠胡，下家摸牌）"
  - "摸牌中 -> 等待出牌（摸牌完成）"
  - "等待响应 -> 等待出牌（有人碰 / 杠，该玩家取得出牌权）"
  - "等待出牌 -> 补牌中（杠牌成功后补牌）"
  - "补牌中 -> 等待出牌（补牌完成，视为摸牌）"
  - "等待出牌 -> 亮倒扣牌（打出非危牌后可听牌，玩家选择亮倒）"
  - "摸牌中 -> 亮倒扣牌（自摸时展示亮的权限，玩家选择亮倒）"
  - "亮倒扣牌 -> 等待出牌（扣牌判断完成或取消等同过，此后明牌只可摸打）"
exception_flow:
  - "等待响应 -> 和牌结算（吃胡 / 自摸 / 抢杠胡，优先级高于碰杠）"
  - "补牌中 -> 和牌结算（杠上花：杠后补到的牌胡牌）"
  - "等待响应 -> 等待响应（玩家选择漏胡 / 过，过手状态保持至摸牌解除）"
state_transitions: []
