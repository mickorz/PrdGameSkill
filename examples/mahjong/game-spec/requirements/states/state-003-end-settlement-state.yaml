id: GAME-STATE-003
type: state
name: 结束与结算续局状态机
status: proposed
authority: fixed
description: 终局后的子状态（摊牌展示、荒庄赔付、买马、小结算、大结算、续局准备）及流转。
source:
  kind: original
  document: source/02-游戏流程.md
  section: "10.3 续局与轮庄"
  page: null
  quote: "| **荒庄（流局）** | **上一局庄家继续坐庄**（连庄）|"
preconditions:
  - 全局状态到达和牌结算或荒庄（GAME-STATE-001）
inputs:
  - 终局类型（胡牌 / 荒庄）
  - 买马触发条件、未听牌玩家集合、是否最后一小局
outputs:
  - 小结算 / 大结算
  - 下一局庄家
business_rules:
  - 摊牌展示：胡牌终局全员摊牌并播放「对局结束」约 1.3 秒、停留 0.5 秒（§8.1）；荒庄终局全员摊牌并展示【荒庄】文字 1.3 秒（§8.2）。
  - 荒庄赔付：有未听牌玩家时同时飘字【未听牌】；勾选查叫则同时展示查叫分数；亮倒赔付触发时查叫后展示【亮倒荒庄】并赔付，持续 1.3 秒后出小结算（§8.2）。
  - 买马（M6）：胡牌且勾选自摸买马 / 亮牌自摸买马并满足条件时弹出买马界面，「中X马」展示 1.5 秒后关闭并打开小结算；荒庄不买马（§九）。
  - 小结算：对局结束后进入；非最后一小局底部按钮【继续游戏】（§10.1 / §10.3）。
  - 大结算：最后一小局时小结算底部按钮【查看结算】，点击进入大结算（复用杭麻大结算）（§10.2）。
  - 续局轮庄：单个玩家胡牌 → 胡牌玩家坐庄；一炮多响 → 点炮玩家坐庄；荒庄 → 上一局庄家连庄；按逆时针轮庄（§10.3）。
normal_flow:
  - "行牌终局 -> 摊牌展示（有人胡牌，按胡牌顺序展示胡牌）"
  - "行牌终局 -> 摊牌展示（荒庄，展示荒庄文字）"
  - "摊牌展示 -> 小结算（胡牌且未触发买马）"
  - "摊牌展示 -> 买马（胡牌且勾选自摸买马 / 亮牌自摸买马并满足触发条件）"
  - "买马 -> 小结算（中X马展示 1.5 秒后关闭）"
  - "摊牌展示 -> 小结算（荒庄且无未听牌玩家）"
  - "摊牌展示 -> 荒庄赔付（荒庄且有未听牌玩家，查叫与亮倒荒庄赔付）"
  - "荒庄赔付 -> 小结算（赔付展示 1.3 秒后出小结算）"
  - "小结算 -> 续局准备（非最后一小局，点击【继续游戏】）"
  - "续局准备 -> 下一小局（按轮庄规则定庄，逆时针递补）"
exception_flow:
  - "小结算 -> 大结算（最后一小局，点击【查看结算】）"
  - "摊牌展示 -> 小结算（荒庄不买马）"
state_transitions: []
ui_refs: []
test_refs: []
dependencies:
