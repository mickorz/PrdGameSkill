胡","status":"proposed","authority":"fixed","description":"他家明杠补杠的牌恰为自己要胡的牌可抢杠胡，属点炮类，抢杠后明杠玩家视为未杠成功不收杠分。","source":{"kind":"original","document":"source/05-胡牌类型.md","section":"六、抢杠胡","page":null,"quote":"| **触发** | 其他玩家进行**明杠（补杠）**，且明杠的牌恰为自己的胡牌 |"},"preconditions":["其他玩家执行明杠（补杠）","自己听牌且胡张恰为补杠之牌"],"inputs":["补杠的牌","创房勾选「杠上花/炮*4」","抢杠人数"],"outputs":["抢杠胡成立、明杠玩家杠分回退、杠上杠中断"],"business_rules":["触发：其他玩家进行明杠（补杠），且明杠的牌恰为自己的胡牌。","范围：仅针对明杠（补杠）；直杠、暗杠不可抢（需求只正面声明明杠可抢，推导排除）。","可多人抢杠胡一家。","倍数：×2（勾选「杠上花/炮*4」后 ×4）；倍数不跟随杠上杠翻倍，走初始值。","后果：抢杠胡后明杠玩家视为未杠成功，不收取杠分，杠上杠也会中断、连杠次数清零。","杠分冲销：因杠分实时结算，「视为未杠成功」实现上为已实时收取的该杠杠分回退（由两句合成推导）。","归类点炮类：番数门槛大于 1 才可，受危牌、亮倒、漏胡限制；收分对象为补杠的那一家。","坐庄：多人抢杠胡时由补杠的那一家坐庄（按一炮多响点炮玩家坐庄口径）。","优先级：抢杠胡属高优先级（吃胡/自摸/抢杠胡 > 碰/杠）。","界面：手牌右上方显示【胡】+【过】。"],"normal_flow":["他家补杠 -> 抢杠询问 -> 有人抢杠胡 -> 明杠作废杠分回退 -> 按点炮类结算","补杠进行中 -> 抢杠胡成立 -> 补杠作废（杠分回退、杠上杠中断）"],"exception_flow":["补杠时有人选择是否抢杠胡 -> 不播放杠动画与飘分 -> 待选择完成后按杠和胡走对应流程"],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-011","GAME-RULE-084","GAME-RULE-122","GAME-RULE-008","GAME-RULE-061"],"open_questions":["杠分冲销为实现层推导（「杠分实时结算」+「视为未杠成功」合成推导为已收杠分回退），原文未明写回退动作。"]},{"id":"GAME-RULE-111","type":"game_rule","name":"点炮（捉炮胡）","status":"proposed","authority":"fixed","description":"玩家打出的牌恰为他家要胡的牌即点炮，番型乘加倍项大于1才可捉炮，收分仅点炮玩家。","source":{"kind":"original","document":"source/05-胡牌类型.md","section":"七、点炮（捉炮胡）","page":null,"quote":"| **触发** | 玩家打出的牌，刚好为其他玩家要胡的牌 |"},"preconditions":["有玩家打出一张牌","他家手牌听这张牌且通过限制层"],"inputs":["打出的牌","番型与加倍项"],"outputs":["捉炮胡成立与收分"],"business_rules":["触发：玩家打出的牌，刚好为其他玩家要胡的牌。","番数门槛：番型 × 加倍项 > 1 才可捉炮。","收分对象：仅点炮玩家（自摸才收所有玩家）。","界面：手牌右上方显示【胡】+【过】；【胡】选项上显示本次胡的牌和倍数（非自摸不含自摸）。","封顶显示：如有倍数封顶，则显示【封顶】，倍数仅显示封顶倍数。","展示：摊开摆放在自己手牌右侧，间隔 1/4 牌距离；自己角度显示对应点牌玩家的方位箭头（胡对家向上 / 胡上家向左 / 胡下家向右）。","超时：配置开启托管时，超时默认胡。"],"normal_flow":["他家出牌 -> 通过番数门槛与限制层 -> 点胡 -> 仅向点炮玩家收分"],"exception_flow":["番型乘加倍项等于 1 -> 不可捉炮，提示番数不足"],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-102","GAME-RULE-061","GAME-RULE-119","GAME-RULE-121"],"open_questions":[]},{"id":"GAME-RULE-112","type":"game_rule","name":"海底捞与海底炮","status":"proposed","authority":"fixed","description":"摸到最后一张牌后胡牌为海底捞自摸类，其后打出点炮为海底炮点炮类，勾选海底捞炮2后生效且为2倍。","source":{"kind":"original","document":"source/05-胡牌类型.md","section":"八、海底捞 / 海底炮","page":null,"quote":"| **触发** | 玩家摸到**最后一张牌**后胡牌 | 玩家摸到最后一张牌后，**打出的牌**点炮胡 |"},"preconditions":["创房勾选「海底捞/炮*2」","牌堆只剩最后一张牌"],"inputs":["最后一张牌的去向（摸入或打出）"],"outputs":["海底捞或海底炮加倍项（2 倍）"],"business_rules":["海底捞：玩家摸到最后一张牌后胡牌，归类自摸类，倍数 ×2。","海底炮：玩家摸到最后一张牌后，打出的牌点炮胡，归类点炮类，倍数 ×2。","生效条件：创房勾选「海底捞/炮*2」后才会计算海底，且为 2 倍。","限制层差异：海底捞不受番数门槛与危牌限制；海底炮番数门槛大于 1 才可、受危牌与漏胡限制。"],"normal_flow":["摸到最后一张牌 -> 胡为海底捞 / 打出后他家胡为海底炮"],"exception_flow":["未勾选「海底捞/炮*2」-> 不计算海底"],"state_transitions":[],"ui_refs":[],"test_refs":["GAME-TC-009"],"dependencies":["GAME-RULE-085","GAME-RULE-107","GAME-RULE-111"],"open_questions":[]},{"id":"GAME-RULE-113","type":"game_rule","name":"一炮多响","status":"proposed","authority":"fixed","description":"打出一张牌导致多个玩家同时胡牌为一炮多响，各家分别和牌分别计分，点炮玩家坐庄并触发下局上楼2倍。","source":{"kind":"original","document":"source/05-胡牌类型.md","section":"九、一炮多响","page":null,"quote":"| **触发** | 打出一张牌后，导致**多个玩家**胡牌 |"},"preconditions":["一名玩家打出一张牌","多个玩家同时满足胡牌条件"],"inputs":["打出的牌","各胡牌方的番型与限制层状态"],"outputs":["各家分别计分与坐庄归属"],"business_rules":["触发：打出一张牌后，导致多个玩家胡牌。","结算：各家分别和牌、分别计分；番数门槛各胡牌方各自判大于 1，亮倒与漏胡各自判。","轮庄：一炮多响时，点炮玩家坐庄。","上楼联动：触发下一小局的上楼 ×2（同一大局内）。","大结算统计：点炮 X 次中，一炮多响只算一次（一小局最多一次）。","飘分配色：正分为黄色，负分为灰色。","界面（胡牌玩家视角）：一炮多响动画 -> 光柱画面 -> 自己所胡番型 + 飘分。","界面（放炮玩家与围观视角）：一炮多响动画 -> 光柱画面 -> 所有玩家所胡番型 + 飘分。"],"normal_flow":["出牌 -> 多家同时胡 -> 一炮多响动画 -> 各家分别计分 -> 点炮玩家坐庄"],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":["GAME-TC-008"],"dependencies":["GAME-RULE-006","GAME-RULE-129","GAME-RULE-111"],"open_questions":[]},{"id":"GAME-RULE-114","type":"game_rule","name":"亮倒类胡法","status":"proposed","authority":"fixed","description":"亮倒作为限制层勾选胡牌必须亮倒时仅亮倒可胡且与双亮互斥，作为加倍项亮倒状态输赢均番型分乘2倍。","source":{"kind":"original","document":"source/05-胡牌类型.md","section":"十、亮倒类","page":null,"quote":"| **胡牌必须亮倒** | 勾选后，**仅亮倒状态下才能胡牌**；**与双亮互斥** |"},"preconditions":["创房勾选「胡牌必须亮倒」或「【卡五星专属】双亮」（二者互斥）"],"inputs":["玩家亮倒状态","局内亮倒人数","创房勾选「对亮*2」"],"outputs":["能否胡牌的判定与亮倒加倍项"],"business_rules":["限制层「胡牌必须亮倒」：勾选后仅亮倒状态下才能胡牌；与双亮互斥。","限制层「【卡五星专属】双亮」：仅卡五星有此选项；仅 3 人时可勾选，2 人时置灰；勾选后 3 人局若已有 2 个玩家亮倒，第三个玩家无需亮倒也能胡牌；与「胡牌必须亮倒」互斥；勾选后若改为 2 人开局，该规则自动失效。","加倍项：亮倒状态输 / 赢均计算，番型分 ×2，不影响加分项。","双方均亮倒（对亮）未勾选「对亮*2」时，仅计一次亮倒 ×2（需求原文说明：对亮比未勾选时多一个）。","亮倒不改变能否胡牌的判定，只在限制层（若勾选「胡牌必须亮倒」）与加倍项上起作用。","玩家亮倒后自己的危牌标签去掉，不再受危牌限制。","亮倒后扣牌：扣下的刻子不可打出、不可杠（除非满足杠的条件）。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-012","GAME-RULE-081","GAME-RULE-082","GAME-RULE-105","GAME-RULE-055"],"open_questions":[]},{"id":"GAME-RULE-115","type":"game_rule","name":"胡法×限制层对照矩阵","status":"proposed","authority":"fixed","description":"八种胡法对番数门槛、危牌、亮倒、漏胡四层限制的适用差异与倍数速查矩阵。","source":{"kind":"original","document":"source/05-胡牌类型.md","section":"十二、各胡法 × 限制层对照矩阵","page":null,"quote":"| **点炮（捉炮胡）** | **> 1 才可** | **受**（出牌方被阻断）| 受 | **受** | 基础 |"},"preconditions":[],"inputs":["胡法类型"],"outputs":["该胡法适用的限制层组合与倍数"],"business_rules":["自摸 / 杠上花 / 海底捞：番数门槛不受限、不受危牌限制、受亮倒限制、漏胡摸牌后即解除。","点炮 / 杠上炮 / 抢杠胡 / 海底炮：番数门槛大于 1 才可、受危牌限制、受亮倒限制、受漏胡限制。","杠上花 / 杠上炮 / 抢杠胡倍数 ×2（勾选「杠上花/炮*4」后 ×4）；海底捞 / 海底炮 ×2（勾选「海底捞/炮*2」后生效）。","一炮多响：各胡牌方各自判番数门槛大于 1，亮倒与漏胡各自判，各家分别计分。","判定顺序：番型先算、限制层后过（先算出牌型分才能判定能否捉炮）。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-104","GAME-RULE-102","GAME-RULE-106"],"open_questions":["矩阵中抢杠胡「勾选「杠上花/炮*4」后 ×4」为推导标注（由 §2.3.1.2 与杠上花/炮并列受同一勾选控制得出）。"]},{"id":"GAME-RULE-116","type":"game_rule","name":"结算总公式（S0）","status":"proposed","authority":"open","description":"小局最终得分等于底分乘番型乘加倍项加马分漂分坎分，有人胡牌走S1至S8及包牌特殊场景，荒庄走S9。","source":{"kind":"original","document":"source/06-结算.md","section":"一、对局结果与总公式（S0）","page":null,"quote":"小局结束的最终得分 = 底分 × 番型 × 加倍项 + 马分 + 漂分 + 坎分"},"preconditions":["一小局结束（有人胡牌或荒庄）"],"inputs":["对局结果类型","各分项计算结果"],"outputs":["每个玩家的最终得分"],"business_rules":["主公式：小局结束的最终得分 = 底分 × 番型 × 加倍项 + 马分 + 漂分 + 坎分。","结果类型：正常胡牌（有玩家胡牌）走 S1~S8（+ S10 包牌 / S11 特殊场景）；荒庄（可摸牌数 = 0 且无人胡牌）走 S9（查叫 / 亮倒荒庄赔付）。","流水线顺序：S1 牌型分 -> S2 分值 remap（M9）-> S3 加倍项 -> S4 封顶 -> S5 杠分 -> S6 马分 -> S7 漂分 -> S8 坎分 -> S9 荒庄分支 / S10 包牌 / S11 特殊场景。","底分：需求未单列底分配置项，底分为所有倍数的乘算单位；推导取值底分 = 1（即 N 倍底分实际计分等值于 N 分）。"],"normal_flow":["确认有人胡牌 -> S1 至 S8 依次计算 -> 触发时走 S10 / S11 -> 输出最终得分"],"exception_flow":["可摸牌数为 0 且无人胡牌 -> 走 S9 荒庄分支"],"state_transitions":[],"ui_refs":[],"test_refs":["GAME-TC-002","GAME-TC-005"],"dependencies":["GAME-RULE-117","GAME-RULE-118","GAME-RULE-119","GAME-RULE-121","GAME-RULE-126","GAME-RULE-128","GAME-RULE-129"],"open_questions":["需求原文（§2.4）主公式含「+ 字分」项，本文档正文公式未纳入字分且本篇未定义字分口径，字分是否参与结算待确认。"]},{"id":"GAME-RULE-117","type":"game_rule","name":"牌型分汇总（S1）","status":"proposed","authority":"fixed","description":"牌型分按维度化口径汇总，同一维度内取高、跨维度相加，并按需求明示互斥规则剔除后求和。","source":{"kind":"original","document":"source/06-结算.md","section":"二、牌型分（S1）","page":null,"quote":"**牌型分** = 按 [番型 §1.3](04-番型.md) 的**维度化口径**汇总：**同一维度内取高、跨维度相加**。"},"preconditions":["牌型判定通过","（如勾选）高分玩法已按 M9 换档"],"inputs":["各维度成立的番型"],"outputs":["牌型分（倍数）"],"business_rules":["汇总口径：同一维度内取高、跨维度相加。","维度与倍数：结构维度平胡 1 / 碰碰胡 2（创房可调 4，高分玩法下 8）；花色维度清一色 4；三元维度小三元 4 / 大三元 8；听口维度卡五星 2；手牌形态维度手抓一 2；四归子维度明四归 2 / 暗四归 4 各自独立（受频道控制触发，二者可同时成立即叠加，各自只计一次）；七对维度七对 4 / 龙七对 8 / 双龙七对 32 / 三龙七对 128（高分玩法下 8 / 20 / 40 / 80）；七对叠加项三元七对 8（在七对维度所取档位基础上 ×2，可与龙类叠加，不按取高处理）。","跨结构处理：七对维度与结构维度可同时成立时取分值较高者，不互斥。","需求明示互斥：清一色与明四归仅计清一色（仅限明四归）；清一色与暗四归可叠加；七对类不计四归；三元七对与小三元 / 大三元不会同时触发；清一色与三元类结构上不可能同时成立。","示例：碰碰胡 2 + 清一色 4 + 手抓一 2 = 8 倍；大三元 8 + 平胡 1 = 9 倍，大三元 + 碰碰胡 = 10 倍；清一色与明四归同时满足仅计清一色 4 倍；全筒七对 = 七对 4 + 清一色 4 = 8 倍。"],"normal_flow":["收集各维度成立番型 -> 同维度取高 -> 跨维度相加 -> 剔除明示互斥项 -> 输出牌型分"],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-092","GAME-RULE-093","GAME-RULE-077","GAME-RULE-079","GAME-RULE-080","GAME-RULE-118"],"open_questions":[]},{"id":"GAME-RULE-118","type":"game_rule","name":"高分玩法分值remap（M9）","status":"proposed","authority":"fixed","description":"勾选高分玩法后8个番型倍数换档计分，6项升档、三龙七对降为80倍、杠开卡五星新增20倍合并档。","source":{"kind":"original","document":"source/06-结算.md","section":"三、分值 remap（M9）","page":null,"quote":"创房勾选「**高分玩法**」后，以下 8 个番型的倍数**换档计分**（其中 **6 项升档**、三龙七对为**唯一降档项**、「杠开卡五星」为**新增档**）："},"preconditions":["创房勾选「高分玩法」"],"inputs":["成立的番型"],"outputs":["换档后的番型倍数"],"business_rules":["换档表：七对 4 改 8、龙七对 8 改 20、双龙七对 32 改 40、三龙七对 128 改 80（唯一降档）、卡五星 2 改 8、碰碰胡 2 改 8、杠上开花 2 改 8、杠开卡五星为新增档 20。","互斥：「高分玩法」与番型选项卡五星、碰碰胡、杠开、三元七对互斥，勾选后这些选项变灰且切换为不勾选。","三龙七对 80 低于基础 128 非笔误：高分档七对系列 20 到 40 到 80 构成完整 ×2 递进链，80 为三龙档必然取值；按需求明示值 80 计。","影响范围：「高分玩法」作用面为牌型分（番型倍数），remap 落在公式「番型」位；换档后参与封顶的仍是「番型 × 加倍项」中的番型部分，封顶口径不变。"],"normal_flow":["勾选高分玩法 -> 按换档表重算番型倍数 -> 进入 S3"],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-083","GAME-RULE-121","GAME-RULE-117"],"open_questions":[]},{"id":"GAME-RULE-119","type":"game_rule","name":"加倍项（S3）","status":"proposed","authority":"open","description":"番型乘加倍项等于牌型分乘各加倍项倍数连乘，含亮倒、对亮、杠开、抢杠、海底、上楼八项。","source":{"kind":"original","document":"source/06-结算.md","section":"四、加倍项（S3）","page":null,"quote":"番型 × 加倍项 = 牌型分 × Π(各加倍项倍数)"},"preconditions":["S1 牌型分已确定（含 M9 换档）"],"inputs":["各加倍项触发状态与创房勾选"],"outputs":["番型 × 加倍项结果"],"business_rules":["公式：番型 × 加倍项 = 牌型分 × Π(各加倍项倍数)。","加倍项表：亮倒 2（输 / 赢均计算，不影响加分项）；对亮 2（勾选后胡牌双方均亮倒与亮倒相乘得 4 倍，未勾选只计一个亮倒 ×2）；杠上花 2（勾选「杠上花/炮*4」后 4）；杠上炮 2（勾选后 4）；抢杠胡 2（勾选「杠上花/炮*4」后 4，与杠上花 / 炮并列受同一勾选控制）；海底捞 2 / 海底炮 2（勾选「海底捞/炮*2」后生效）；上楼 2 / 4。","杠开叠加裁决：杠上花 / 杠上炮列于加倍项表，与其他番型乘算叠加不互斥；高分玩法下「杠开卡五星」按 20 倍合并档计（不叠乘），基础玩法仍按加倍项乘算。","加倍项与杠上杠：杠上杠时触发杠上花、杠上炮、抢杠胡，倍数不跟随杠上杠翻倍走初始值（初始 2，可勾选为 4）；杠上杠仅计算杠分。","易错：亮倒只乘番型分不影响加分项；双方都亮倒未勾选「对亮*2」只计一个亮倒 ×2；上楼是加倍项受封顶约束。"],"normal_flow":["识别触发加倍项 -> 连乘到牌型分 -> 输出番型 × 加倍项"],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-081","GAME-RULE-082","GAME-RULE-083","GAME-RULE-084","GAME-RULE-085","GAME-RULE-086","GAME-RULE-120"],"open_questions":["需求 §3.1.1.2 留批注「杠开不与其他番型叠加？」未给答复，本文档裁决为乘算叠加（依据：杠上花与杠上炮列于需求「加倍项」表，加倍项定义为在牌型分上乘算），待需求方确认。"]},{"id":"GAME-RULE-120","type":"game_rule","name":"上楼细则（S3）","status":"proposed","authority":"fixed","description":"上一小局荒庄或一炮多响、开局骰子同点各触发本局倍数2倍，可叠加最高4倍，属加倍项受封顶约束。","source":{"kind":"original","document":"source/06-结算.md","section":"4.1 上楼细则","page":null,"quote":"| ① 同一大局内，**上一小局荒庄或者一炮多响** | 本小局**倍数** **×2** |"},"preconditions":["创房勾选「上楼」"],"inputs":["上一小局结果（荒庄或一炮多响）","本小局开局骰子点数"],"outputs":["本小局上楼加倍项（2 或 4 倍）"],"business_rules":["条件 1：同一大局内，上一小局荒庄或者一炮多响，本小局倍数 ×2。","条件 2：本小局开局打骰子时两个骰子点数一致，本小局倍数 ×2。","条件 1 与条件 2 同时触发则 ×4；两处翻倍可叠加，最高 4 倍。","上楼为加倍项，不可突破封顶倍数。","「倍数」的射程指番型 × 加倍项，不含马、漂、坎等加分项（Step 5 裁决：采加倍项表口径，「所有分数*2」与「不可突破封顶」不相容故不采）。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-006","GAME-RULE-086","GAME-RULE-121"],"open_questions":[]},{"id":"GAME-RULE-121","type":"game_rule","name":"封顶（S4）","status":"proposed","authority":"fixed","description":"封顶仅截断番型乘加倍项，可选8、16、32、64倍或不封顶，漂马坎杠等加分项不受封顶无上限。","source":{"kind":"original","document":"source/06-结算.md","section":"五、封顶（S4）","page":null,"quote":"| **封顶口径** | **仅计算「番型 × 加倍项」**，不可超过封顶倍数 |"},"preconditions":["S3 已算出番型 × 加倍项","创房配置封顶倍数"],"inputs":["番型 × 加倍项值","封顶倍数配置"],"outputs":["截断后的番型 × 加倍项"],"business_rules":["封顶口径：仅计算「番型 × 加倍项」，不可超过封顶倍数；超过时按封顶倍数计算。","可选值：8 / 16 / 32 / 64 / 不封顶。","所有加分项不参与封顶计算，无上限：漂、马、坎、杠。","上楼为加倍项，不可突破封顶倍数。","示例：封顶 32 倍，清一色 4 + 手抓一 2 + 碰碰胡 2 = 8 倍牌型分，亮倒 ×2 = 16 倍，上楼 ×4 = 64 倍大于 32，截断为 32 倍；本局漂分 3 倍底分、马分 5 分另行相加不受封顶。"],"normal_flow":["番型 × 加倍项与封顶倍数比较 -> 超出取封顶 -> 加分项不截断直接合计"],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":["GAME-TC-002","GAME-TC-005"],"dependencies":["GAME-RULE-116","GAME-RULE-120","GAME-RULE-118"],"open_questions":[]},{"id":"GAME-RULE-122","type":"game_rule","name":"杠分（S5）","status":"proposed","authority":"fixed","description":"杠分实时结算小局结束不额外再算，直杠2倍、明杠1倍、暗杠2倍底分，杠上杠按2的n减1次方翻倍，荒庄不退还。","source":{"kind":"original","document":"source/06-结算.md","section":"六、杠分（S5）","page":null,"quote":"**杠分实时结算**，小局结束时不额外再算。"},"preconditions":["玩家完成杠操作（或荒庄）"],"inputs":["杠的类型（直杠/明杠/暗杠）","连续杠次数"],"outputs":["实时结算的杠分"],"business_rules":["杠分实时结算，小局结束时不额外再算。","直杠 2 倍底分：打出牌的玩家赔付直杠玩家；明杠（补杠）1 倍底分：其他玩家各付补杠玩家；暗杠 2 倍底分：其余玩家各付暗杠玩家。","杠上杠：本次杠分 = 基础杠分 × 2^(连续杠次数 - 1)；连杠可跨玩家连续；中断后重新计算。","荒庄：杠分不退还；流局未听牌不需要返还杠分。","抢杠胡：抢杠胡后明杠玩家视为未杠成功，不收取杠分，杠上杠也会中断。"],"normal_flow":["杠操作 -> 实时收付杠分 -> 小局结算不再重复计算"],"exception_flow":["荒庄 -> 已结算杠分不退还"],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-007","GAME-RULE-008","GAME-RULE-090","GAME-RULE-110","GAME-RULE-126"],"open_questions":[]},{"id":"GAME-RULE-123","type":"game_rule","name":"马分（S6）","status":"proposed","authority":"fixed","description":"买马总得分不受封顶影响，买一中发白记10倍底分、1到9记同数字倍，买5马6马按1、4、7、白各计。","source":{"kind":"original","document":"source/06-结算.md","section":"七、马分（S6）","page":null,"quote":"买马的总得分，**不受封顶影响**。"},"preconditions":["创房勾选购马","非荒庄","买一或买一送一时剩余牌数量足够"],"inputs":["买的马牌","马数配置（买一/买一送一/买5马/买6马）"],"outputs":["马分"],"business_rules":["买马的总得分不受封顶影响。","买一：中发白记 10 倍底分；1 到 9 记同数字倍的底分。","买一送一：同上，两张分数之和。","买6马：出现 1 / 4 / 7 / 白 每张 1 倍底分（命中集即此四种，不含中、发）；中 0 张按 6 马计分。","买5马：出现 1 / 4 / 7 / 白 每张 1 分（命中集即此四种，不含中、发）；一张不中或者中 5 张，按 6 马计分。","收分对象：自摸收取所有玩家。","不买马的情形：不买马配置；荒庄；买一 / 买一送一时剩余牌数量不足。"],"normal_flow":[],"exception_flow":["荒庄或牌数不足 -> 不买马"],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-016","GAME-RULE-088","GAME-RULE-126","GAME-RULE-128"],"open_questions":[]},{"id":"GAME-RULE-124","type":"game_rule","name":"漂分（S7）","status":"proposed","authority":"fixed","description":"胡牌玩家向某玩家收取漂分等于双方漂数之和乘底分，逐人计算，不受封顶影响，荒庄查叫时漂也赔。","source":{"kind":"original","document":"source/06-结算.md","section":"八、漂分（S7）","page":null,"quote":"胡牌玩家向某玩家收取的漂分 = （胡牌玩家漂数 + 该玩家漂数）× 底分"},"preconditions":["有玩家胡牌（或荒庄查叫触发赔付）"],"inputs":["胡牌玩家漂数","各对手漂数","胡牌方式（自摸或捉炮）"],"outputs":["漂分（逐玩家）"],"business_rules":["公式：胡牌玩家向某玩家收取的漂分 =（胡牌玩家漂数 + 该玩家漂数）× 底分。","捉炮胡仅收点炮玩家；自摸胡收所有玩家。","每个玩家单独计算。","不受封顶影响。","荒庄查叫时漂也赔。","示例：A 漂 0、B 漂 2、C 漂 1 时，B 自摸收 A 2 倍底分、收 C 3 倍底分；A 点炮 B 胡牌，B 仅收 A 2 倍底分。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-015","GAME-RULE-087","GAME-RULE-126"],"open_questions":[]},{"id":"GAME-RULE-125","type":"game_rule","name":"坎分（S8）","status":"proposed","authority":"fixed","description":"数坎范围为手中加胡的那张加碰杠牌区，暗刻加1、明杠直杠加1、暗杠加2、手中四张加2倍底分，不受封顶。","source":{"kind":"original","document":"source/06-结算.md","section":"九、坎分（S8）","page":null,"quote":"**计算范围** = 自己的**手中** + **胡的那张** + **碰杠牌区**。"},"preconditions":["有玩家胡牌"],"inputs":["自己手牌、胡的那张、碰杠牌区的牌型组成"],"outputs":["坎分"],"business_rules":["计算范围 = 自己的手中 + 胡的那张 + 碰杠牌区。","分值：每个暗刻 +1 倍底分；每个明杠 / 直杠 +1 倍底分；每个暗杠 +2 倍底分；手中 4 张一样的牌 +2 倍底分（必须是顺 + 刻，不与暗刻重复计算）。","收分对象 = 需付胡牌分的玩家：点炮胡收放炮玩家；自摸胡收其他所有玩家。","不受封顶影响。","口径：仅是 3 张相同牌但不成刻的不算；胡的那张仅自摸才参与计算，捉炮不参与；查叫时计算坎分但不计算胡的那张牌（荒庄没有胡）。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-017","GAME-RULE-089","GAME-RULE-126"],"open_questions":[]},{"id":"GAME-RULE-126","type":"game_rule","name":"荒庄查叫（S9）","status":"proposed","authority":"fixed","description":"可摸牌数为0且无人胡牌即荒庄，勾选查叫后未听牌玩家向听牌玩家赔付底分乘番型乘加倍项加漂坎分。","source":{"kind":"original","document":"source/06-结算.md","section":"12.2 查叫（需勾选）","page":null,"quote":"未听牌玩家 → 听牌玩家 赔付： 底分 × 番型 × 加倍项 + 漂分 + 坎分"},"preconditions":["荒庄成立（可摸牌数 = 0 且无人胡牌）","创房勾选「查叫」"],"inputs":["各玩家听牌状态","未听牌玩家的番型与加倍项、漂数、坎数"],"outputs":["查叫赔付金额"],"business_rules":["荒庄触发：玩家可摸牌数 = 0（牌堆摸完）仍无人胡牌。","查叫开启：需勾选「查叫」才开启。","赔付公式：未听牌玩家向听牌玩家赔付：底分 × 番型 × 加倍项 + 漂分 + 坎分。","最大倍数计亮倒（需求原文：「最大倍数计亮倒」）。","封顶：「底分 × 番型 × 加倍项」受封顶控制；漂分、坎分不受封顶影响；查叫金额被截断时按与胡分同一标识规则展示（输分者总得分处加【封顶】标识、详情分数下方写「（封顶）」）。","坎分：查叫时计算坎分，但不计算胡的那张牌（没有胡）；听双碰时会生效。","漂：查叫时漂也赔；买马：荒庄不买马；杠分：荒庄后杠分不退还。","流程：牌堆摸完无人胡 -> 所有玩家摊牌展示并展示【荒庄】 -> 有未听牌玩家则飘字【未听牌】 -> 展示查叫分数与亮倒赔付 -> 出小结算界面。"],"normal_flow":["荒庄 -> 摊牌 -> 未听牌玩家赔付听牌玩家 -> 出小结算"],"exception_flow":["无未听牌玩家 -> 直接出小结算"],"state_transitions":[],"ui_refs":[],"test_refs":["GAME-TC-007"],"dependencies":["GAME-RULE-028","GAME-RULE-121","GAME-RULE-124","GAME-RULE-125","GAME-RULE-127"],"open_questions":["需求 §2.3.6 为标题带「待补充」的规则页草稿节，其「查叫赔 2 倍分」与 §2.4 查叫主口径（1 倍）冲突且含本变体不存在的选项，该节未定稿不作为口径依据。"]},{"id":"GAME-RULE-127","type":"game_rule","name":"亮倒荒庄赔付（S9）","status":"proposed","authority":"open","description":"荒庄后存在亮倒玩家时，本小局第一个亮倒的玩家向其他所有玩家赔付1倍底分，可与查叫同时赔付。","source":{"kind":"original","document":"source/06-结算.md","section":"12.3 亮倒荒庄赔付（首亮赔付）","page":null,"quote":"**规则**：荒庄后，如果存在玩家亮倒，本小局**第一个亮倒的玩家**向**其他所有玩家**赔付 **1 倍底分**。"},"preconditions":["荒庄成立","本小局存在亮倒玩家"],"inputs":["首个亮倒玩家标识","变体类型（卡五星或十堰卡五星）"],"outputs":["首亮赔付金额与收付方向"],"business_rules":["规则：荒庄后如果存在玩家亮倒，本小局第一个亮倒的玩家向其他所有玩家赔付 1 倍底分。","变体：卡五星 1 倍底分；十堰卡五星 2 倍底分（需求 §2.2.2 明示）。","赔付对象裁决：采名词定义与规则详情两处「其他玩家」口径，即除自己外的全部玩家（含未亮倒者）；§2.4「其他亮倒玩家」带「存在多个亮倒玩家时」前置条件，属多人亮倒子场景说明，不构成赔付对象限定。","金额表述裁决：「1 倍底分」与「1 分」数值相同（底分 = 1），统一采用「1 倍底分」表述。","查叫与亮倒荒庄可同时赔付（卡五星、十堰卡五星）。","展示：结算页签输分者展示【首亮赔付-X】、赢分者【首亮赔付+X】；先展示查叫、后展示首亮赔付。"],"normal_flow":["荒庄 -> 确定首个亮倒玩家 -> 向其他所有玩家赔付 -> 结算页签展示"],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-126","GAME-RULE-012","GAME-RULE-130"],"open_questions":["首亮赔付对象需求三处表述不同（其他玩家与其他亮倒玩家），本文档裁决采「其他所有玩家（含未亮倒者）」，待需求方确认。"]},{"id":"GAME-RULE-128","type":"game_rule","name":"包牌（S10）","status":"proposed","authority":"open","description":"仅3人局点炮亮倒玩家时，点炮者支付相当于该亮倒玩家自摸的分数含番型加倍项马漂坎，马分由点炮者一人承担。","source":{"kind":"original","document":"source/06-结算.md","section":"十三、包牌（S10）","page":null,"quote":"| **赔付范围** | 点炮者需支付**相当于亮倒玩家自摸的分数**，含：**番型 × 加倍项、马、漂、坎** |"},"preconditions":["3 人局且创房勾选「包牌」（2 人时选项灰色且不勾选）","点炮对象处于亮倒状态"],"inputs":["点炮玩家","亮倒的捉炮玩家","是否还有其他亮倒玩家"],"outputs":["点炮者的包赔金额"],"business_rules":["适用范围：仅 3 人时开启；少人开局变为无效；创房面板选 2 人时选项灰色且不勾选。","触发：点炮亮倒玩家。","赔付范围：点炮者需支付相当于亮倒玩家自摸的分数，含番型 × 加倍项、马、漂、坎。","与买马：包牌下买马照常触发，马分由点炮者一人承担（视同自摸，两种买马触发条件均满足）；买马算法与买一 / 买一送一 / 买 5 马 / 买 6 马各档同常规。","第二家亮倒：如果另一个玩家也亮倒，则还需支付给另一个玩家分数（按其点炮计算，马、漂、坎也要计算）。","结算标签（A 点炮给 B，C 也亮倒）：点炮者 A 展示【点炮】；捉炮者 B 展示【包牌】；获得包牌赔付的玩家 C 展示【包牌】。"],"normal_flow":["点炮亮倒玩家 -> 点炮者按自摸口径包赔（含番型加倍项马漂坎）"],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-012","GAME-RULE-123","GAME-RULE-124","GAME-RULE-125","GAME-RULE-129"],"open_questions":["「第二家亮倒」需求说明列与说明内容列口径不同（分项构成与支付最大牌型分），本文档裁决采说明列细则口径（按其点炮计算，马漂坎也要计算），待需求方确认。"]},{"id":"GAME-RULE-129","type":"game_rule","name":"特殊场景（S11）","status":"proposed","authority":"fixed","description":"一炮多响各家分别计分点炮者逐家赔付且亮倒者按包牌口径，对亮未勾选只计一个亮倒，杠上杠仅计本次杠分。","source":{"kind":"original","document":"source/06-结算.md","section":"14.1 一炮多响","page":null,"quote":"| **计分** | 各家**分别**和牌、分别计分 |"},"preconditions":["触发一炮多响 / 双方亮倒 / 杠上杠等特殊场景"],"inputs":["各胡牌玩家亮倒状态","对亮勾选状态","杠上杠连杠状态"],"outputs":["特殊场景下的结算结果与结算标签"],"business_rules":["一炮多响计分：各家分别和牌、分别计分；轮庄为点炮玩家坐庄；触发下一小局上楼 ×2。","一炮多响结算标签：捉炮玩家展示【捉炮胡】；点炮玩家展示【一炮多响】。","一炮多响 × 包牌组合：点炮者向每个胡牌玩家分别赔付；其中亮倒的胡牌玩家那一笔按包牌口径计，即相当于自摸的分数（含番型 × 加倍项、马、漂、坎）。","一炮多响 × 多家亮倒组合：各亮倒胡牌者各得一份，均按包牌口径；未亮倒的胡牌者按其正常捉炮胡计算。","对亮：未勾选「对亮*2」时双方均亮倒只计一个亮倒。","杠上杠：仅计算杠分，之前的杠分不转移。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-113","GAME-RULE-082","GAME-RULE-008","GAME-RULE-122","GAME-RULE-128"],"open_questions":[]},{"id":"GAME-RULE-130","type":"game_rule","name":"结算界面文案规则","status":"proposed","authority":"fixed","description":"结算信息按胡分杠分荒庄查叫漂分马分其他分排序展示，未开启规则显示加0，多条用英文逗号分隔，含标签与详情页规则。","source":{"kind":"original","document":"source/06-结算.md","section":"十五、结算界面文案规则","page":null,"quote":"胡分 → 杠分 → 荒庄查叫 → 漂分 → 马分 → 其他分（坎分）"},"preconditions":["小局或大局结算"],"inputs":["各玩家分项流水"],"outputs":["结算页签与详情页文案"],"business_rules":["整体顺序：每个玩家结算信息按胡分 -> 杠分 -> 荒庄查叫 -> 漂分 -> 马分 -> 其他分（坎分）从前到后展示。","计算口径：胡分仅计算「番型 × 加倍项」；未开启的规则也会显示，分数固定显示 +0；多条信息每条之间用英文逗号隔开。","展示规则：胡分仅展示玩家自己参与分数流转的胡分，自摸 / 一炮多响 / 包牌 / 查叫赔付多人等多条胡分合并为一条展示总得分；杠分仅展示自己参与流转的杠分，未参与或总和为 0 不展示；漂分、马分合并计算只显示一条【漂+X / 漂-X】【马+X / 马-X】；荒庄赔付先查叫后首亮赔付，未开启规则或为 0 不显示。","胡牌页签：自摸【自摸 / 被自摸】、点炮【捉炮胡 / 点炮】、一炮多响【捉炮胡 / 一炮多响】、包牌捉炮者与获赔者【包牌】点炮者【点炮】、查叫【查叫 / 被查叫】、亮倒赔付双方【首亮赔付】。","封顶标识：输时若触发番型封顶，额外增加【封顶】标识；赢的玩家不展示。","详情页：整体顺序杠分 -> 胡分 -> 荒庄查叫；杠分按发生顺序显示，杠上杠第二行显示「杠上杠 *Y」；胡分多家信息完全一致合并为一条展示总得分与「两家」，否则按逆时针顺序分条，第二行番型加倍项有亮倒信息优先展示「亮倒 X2」、有其他番型时不展示【平胡】；查叫每个玩家一条逆时针拆分展示，首亮赔付仅展示一条；其他分 / 漂分 / 马分各仅一行。","大结算：统计自摸 X 次、点炮 X 次（一炮多响只算一次，一小局最多一次）、亮倒、未听（荒庄流局时未听牌次数）；战绩周报特殊游戏次数使用「亮倒次数」。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-116","GAME-RULE-122","GAME-RULE-126","GAME-RULE-127"],"open_questions":[]},{"id":"GAME-STATE-001","type":"state","name":"全局对局状态机","status":"proposed","authority":"fixed","description":"从未开局到续局的九个全局状态（未开局、房间内、打漂、定庄、发牌、行牌、和牌结算、荒庄、续局）及流转。","source":{"kind":"original","document":"source/02-游戏流程.md","section":"卡五星（好友房）· 游戏流程（引言）","page":null,"quote":"> 一局从开始到结束按时间发生什么：开局准备 → 打漂 → 定庄 → 摇骰方位 → 发牌 → 行牌 → 结束 → 结算续局；操作的条件与后果见 [打牌操作](03-打牌操作.md)。"},"preconditions":[],"inputs":[],"outputs":[],"business_rules":["未开局：无对局；方位为无方位展示（02-游戏流程 §五）。","房间内：房主创房（选变体与参数）、玩家逆时针入座且座位固定（2 人一上一下 / 3 人左·下·右）；每次开房首局播放开局动画，之后开局直接进入摇骰发牌（§一）。","打漂：按漂模式执行（不漂跳过、固定漂直接展示结果、首局定漂仅大局第一小局、自由漂每小局），全员完成后开始打骰子（§三）。","定庄：随机庄 / 房主庄（默认房主庄），骰子转动停止后定庄并定方位（庄为东、其余逆时针），符合上楼则展示「上楼X2/X4」；逻辑上先于发牌（§四 / §五）。","发牌：从庄家位逆时针按 4+4+4+1（+庄 1）发牌，庄 14 闲 13，发毕自动理牌立起；余量 3 人 44 / 2 人 57（§六）。","行牌：逆时针摸打循环，响应优先级吃胡 / 自摸 / 抢杠胡 > 碰 / 杠，含亮倒扣牌与杠后补牌，直至有人胡牌或可摸牌数 = 0（§七）。","和牌结算：有人胡牌 → 摊牌展示 →（触发则买马）→ 小结算（§8.1 / §九 / §10.1）。","荒庄：可摸牌数 = 0 且无人胡牌 → 摊牌展示 → 未听牌时查叫与亮倒荒庄赔付 → 小结算（§8.2）。","续局：小结算后按轮庄规则（胡者坐庄 / 一炮多响点炮者坐庄 / 荒庄连庄）进入下一小局；最后一小局进入大结算（§10.3 / §10.2）。"],"normal_flow":["未开局 -> 房间内（房主创房完成）","房间内 -> 打漂（开局且漂模式需选漂）","房间内 -> 定庄（漂模式为不漂或固定漂，跳过选漂环节）","打漂 -> 定庄（全员选漂完成，开始打骰子）","定庄 -> 发牌（骰子停止、方位确定）","发牌 -> 行牌（理牌完成，庄家先出牌）","行牌 -> 和牌结算（有玩家胡牌）","行牌 -> 荒庄（可摸牌数 = 0 且无人胡牌）","和牌结算 -> 续局（摊牌、买马、小结算完成）","荒庄 -> 续局（摊牌、查叫与亮倒赔付、小结算完成）","续局 -> 打漂（自由漂模式新小局，或新大局首局定漂）","续局 -> 定庄（固定漂 / 不漂模式新小局）"],"exception_flow":["续局 -> 大结算（最后一小局，点击【查看结算】）","重新匹配 -> 未开局（方位重置为无方位展示）"],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-021","GAME-RULE-023","GAME-RULE-026","GAME-RULE-030"],"open_questions":[]},{"id":"GAME-STATE-002","type":"state","name":"行牌回合状态机","status":"proposed","authority":"fixed","description":"行牌阶段单个回合的子状态（等待出牌、等待响应、摸牌中、补牌中、亮倒扣牌）及流转。","source":{"kind":"original","document":"source/02-游戏流程.md","section":"七、行牌阶段","page":null,"quote":"**摸牌与出牌的衔接**：**摸牌需在上一家打出牌的同时进行**——肉眼可见上家打出牌的瞬间下家摸牌。"},"preconditions":["全局状态处于行牌（GAME-STATE-001）"],"inputs":["出牌 / 碰 / 杠 / 胡 / 过 / 亮倒 / 扣牌操作"],"outputs":["出牌权流转或终局转移"],"business_rules":["等待出牌：当前玩家持出牌权待打牌；庄家发牌后起手 14 张直接进入该状态先出牌（02-游戏流程 §七）。","等待响应：一张牌打出后其余玩家可响应，按优先级吃胡 / 自摸 / 抢杠胡 > 碰 / 杠；无人操作则下家摸牌，摸牌与上家出牌同时进行（§七）。","摸牌中：下家从牌堆摸 1 张，视为进入其回合（§七）。","补牌中：杠牌成功后从牌堆倒序摸 1 张，视为摸牌，牌堆额外减 1（01-基础规则 §4.4）。","亮倒扣牌：打出非危牌后可听牌或自摸时触发亮倒权限；亮倒同时进行扣牌判断，扣牌取消等同过，明牌后只能摸打（01-基础规则 §5.1 / §5.2）。","杠上杠连杠可在补牌中继续杠进入下一轮补牌，杠分按 2^(连续杠次数−1) 翻倍（01-基础规则 §4.2）。","漏胡：等待响应中可胡而不胡则进入漏胡状态，摸牌前不可胡牌，摸牌（含补牌）后解除（01-基础规则 §八）。"],"normal_flow":["发牌完成 -> 等待出牌（庄家 14 张先出牌）","等待出牌 -> 等待响应（当前玩家打出一张牌）","等待响应 -> 摸牌中（无人碰杠胡，下家摸牌）","摸牌中 -> 等待出牌（摸牌完成）","等待响应 -> 等待出牌（有人碰 / 杠，该玩家取得出牌权）","等待出牌 -> 补牌中（杠牌成功后补牌）","补牌中 -> 等待出牌（补牌完成，视为摸牌）","等待出牌 -> 亮倒扣牌（打出非危牌后可听牌，玩家选择亮倒）","摸牌中 -> 亮倒扣牌（自摸时展示亮的权限，玩家选择亮倒）","亮倒扣牌 -> 等待出牌（扣牌判断完成或取消等同过，此后明牌只可摸打）"],"exception_flow":["等待响应 -> 和牌结算（吃胡 / 自摸 / 抢杠胡，优先级高于碰杠）","补牌中 -> 和牌结算（杠上花：杠后补到的牌胡牌）","等待响应 -> 等待响应（玩家选择漏胡 / 过，过手状态保持至摸牌解除）"],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-007","GAME-RULE-008","GAME-RULE-009","GAME-RULE-010","GAME-RULE-011","GAME-RULE-012","GAME-RULE-013","GAME-RULE-014","GAME-RULE-018","GAME-RULE-019","GAME-RULE-026"],"open_questions":[]},{"id":"GAME-STATE-003","type":"state","name":"结束与结算续局状态机","status":"proposed","authority":"fixed","description":"终局后的子状态（摊牌展示、荒庄赔付、买马、小结算、大结算、续局准备）及流转。","source":{"kind":"original","document":"source/02-游戏流程.md","section":"10.3 续局与轮庄","page":null,"quote":"| **荒庄（流局）** | **上一局庄家继续坐庄**（连庄）|"},"preconditions":["全局状态到达和牌结算或荒庄（GAME-STATE-001）"],"inputs":["终局类型（胡牌 / 荒庄）","买马触发条件、未听牌玩家集合、是否最后一小局"],"outputs":["小结算 / 大结算","下一局庄家"],"business_rules":["摊牌展示：胡牌终局全员摊牌并播放「对局结束」约 1.3 秒、停留 0.5 秒（§8.1）；荒庄终局全员摊牌并展示【荒庄】文字 1.3 秒（§8.2）。","荒庄赔付：有未听牌玩家时同时飘字【未听牌】；勾选查叫则同时展示查叫分数；亮倒赔付触发时查叫后展示【亮倒荒庄】并赔付，持续 1.3 秒后出小结算（§8.2）。","买马（M6）：胡牌且勾选自摸买马 / 亮牌自摸买马并满足条件时弹出买马界面，「中X马」展示 1.5 秒后关闭并打开小结算；荒庄不买马（§九）。","小结算：对局结束后进入；非最后一小局底部按钮【继续游戏】（§10.1 / §10.3）。","大结算：最后一小局时小结算底部按钮【查看结算】，点击进入大结算（复用杭麻大结算）（§10.2）。","续局轮庄：单个玩家胡牌 → 胡牌玩家坐庄；一炮多响 → 点炮玩家坐庄；荒庄 → 上一局庄家连庄；按逆时针轮庄（§10.3）。"],"normal_flow":["行牌终局 -> 摊牌展示（有人胡牌，按胡牌顺序展示胡牌）","行牌终局 -> 摊牌展示（荒庄，展示荒庄文字）","摊牌展示 -> 小结算（胡牌且未触发买马）","摊牌展示 -> 买马（胡牌且勾选自摸买马 / 亮牌自摸买马并满足触发条件）","买马 -> 小结算（中X马展示 1.5 秒后关闭）","摊牌展示 -> 小结算（荒庄且无未听牌玩家）","摊牌展示 -> 荒庄赔付（荒庄且有未听牌玩家，查叫与亮倒荒庄赔付）","荒庄赔付 -> 小结算（赔付展示 1.3 秒后出小结算）","小结算 -> 续局准备（非最后一小局，点击【继续游戏】）","续局准备 -> 下一小局（按轮庄规则定庄，逆时针递补）"],"exception_flow":["小结算 -> 大结算（最后一小局，点击【查看结算】）","摊牌展示 -> 小结算（荒庄不买马）"],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-016","GAME-RULE-027","GAME-RULE-028","GAME-RULE-029","GAME-RULE-030"],"open_questions":[]}],"ui":{"pages":[{"id":"GAME-UI-001","name":"对局桌面","resolution":{"width":1280,"height":720},"components":["GAME-COMP-001","GAME-COMP-002","GAME-COMP-003","GAME-COMP-004","GAME-COMP-005","GAME-COMP-006","GAME-COMP-007","GAME-COMP-010","GAME-COMP-011","GAME-COMP-012","GAME-COMP-014","GAME-COMP-015","GAME-COMP-016","GAME-COMP-017","GAME-COMP-018","GAME-COMP-019","GAME-COMP-020"],"states":["loading","opening","dealing","piao_picking","playing","liang_showing","round_over","error"],"interactions":[{"trigger":"GAME-EVENT-007","from_state":"piao_picking","to_state":"dealing","target_component":"GAME-COMP-014"},{"trigger":"GAME-EVENT-009","from_state":"piao_picking","to_state":"piao_picking","target_component":"GAME-COMP-010"},{"trigger":"GAME-EVENT-001","from_state":"playing","to_state":"playing","target_component":"GAME-COMP-003"},{"trigger":"GAME-EVENT-002","from_state":"playing","to_state":"playing","targ 017","name":"对局结束进入过渡","trigger_type":"system","payload":{},"requirements":["GAME-FR-015"]},{"id":"GAME-EVENT-018","name":"弹出小结算","trigger_type":"timer","payload":{},"requirements":["GAME-FR-015"]},{"id":"GAME-EVENT-019","name":"退出房间回大厅","trigger_type":"click","payload":{},"requirements":["GAME-FR-015"]}],"navigation":{"entries":[{"from":"GAME-UI-004","to":"GAME-UI-003","trigger":"GAME-EVENT-008"},{"from":"GAME-UI-003","to":"GAME-UI-001","trigger":"GAME-EVENT-007"},{"from":"GAME-UI-004","to":"GAME-UI-001","trigger":"GAME-EVENT-016"},{"from":"GAME-UI-001","to":"GAME-UI-005","trigger":"GAME-EVENT-017"},{"from":"GAME-UI-005","to":"GAME-UI-002","trigger":"GAME-EVENT-018"},{"from":"GAME-UI-002","to":"GAME-UI-001","trigger":"GAME-EVENT-014"},{"from":"GAME-UI-002","to":"GAME-UI-002","trigger":"GAME-EVENT-015"},{"from":"GAME-UI-002","to":"GAME-UI-004","trigger":"GAME-EVENT-019"}]}},"states":[{"id":"GAME-STATE-001","type":"state","name":"全局对局状态机","status":"proposed","authority":"fixed","description":"从未开局到续局的九个全局状态（未开局、房间内、打漂、定庄、发牌、行牌、和牌结算、荒庄、续局）及流转。","source":{"kind":"original","document":"source/02-游戏流程.md","section":"卡五星（好友房）· 游戏流程（引言）","page":null,"quote":"> 一局从开始到结束按时间发生什么：开局准备 → 打漂 → 定庄 → 摇骰方位 → 发牌 → 行牌 → 结束 → 结算续局；操作的条件与后果见 [打牌操作](03-打牌操作.md)。"},"preconditions":[],"inputs":[],"outputs":[],"business_rules":["未开局：无对局；方位为无方位展示（02-游戏流程 §五）。","房间内：房主创房（选变体与参数）、玩家逆时针入座且座位固定（2 人一上一下 / 3 人左·下·右）；每次开房首局播放开局动画，之后开局直接进入摇骰发牌（§一）。","打漂：按漂模式执行（不漂跳过、固定漂直接展示结果、首局定漂仅大局第一小局、自由漂每小局），全员完成后开始打骰子（§三）。","定庄：随机庄 / 房主庄（默认房主庄），骰子转动停止后定庄并定方位（庄为东、其余逆时针），符合上楼则展示「上楼X2/X4」；逻辑上先于发牌（§四 / §五）。","发牌：从庄家位逆时针按 4+4+4+1（+庄 1）发牌，庄 14 闲 13，发毕自动理牌立起；余量 3 人 44 / 2 人 57（§六）。","行牌：逆时针摸打循环，响应优先级吃胡 / 自摸 / 抢杠胡 > 碰 / 杠，含亮倒扣牌与杠后补牌，直至有人胡牌或可摸牌数 = 0（§七）。","和牌结算：有人胡牌 → 摊牌展示 →（触发则买马）→ 小结算（§8.1 / §九 / §10.1）。","荒庄：可摸牌数 = 0 且无人胡牌 → 摊牌展示 → 未听牌时查叫与亮倒荒庄赔付 → 小结算（§8.2）。","续局：小结算后按轮庄规则（胡者坐庄 / 一炮多响点炮者坐庄 / 荒庄连庄）进入下一小局；最后一小局进入大结算（§10.3 / §10.2）。"],"normal_flow":["未开局 -> 房间内（房主创房完成）","房间内 -> 打漂（开局且漂模式需选漂）","房间内 -> 定庄（漂模式为不漂或固定漂，跳过选漂环节）","打漂 -> 定庄（全员选漂完成，开始打骰子）","定庄 -> 发牌（骰子停止、方位确定）","发牌 -> 行牌（理牌完成，庄家先出牌）","行牌 -> 和牌结算（有玩家胡牌）","行牌 -> 荒庄（可摸牌数 = 0 且无人胡牌）","和牌结算 -> 续局（摊牌、买马、小结算完成）","荒庄 -> 续局（摊牌、查叫与亮倒赔付、小结算完成）","续局 -> 打漂（自由漂模式新小局，或新大局首局定漂）","续局 -> 定庄（固定漂 / 不漂模式新小局）"],"exception_flow":["续局 -> 大结算（最后一小局，点击【查看结算】）","重新匹配 -> 未开局（方位重置为无方位展示）"],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-021","GAME-RULE-023","GAME-RULE-026","GAME-RULE-030"],"open_questions":[]},{"id":"GAME-STATE-002","type":"state","name":"行牌回合状态机","status":"proposed","authority":"fixed","description":"行牌阶段单个回合的子状态（等待出牌、等待响应、摸牌中、补牌中、亮倒扣牌）及流转。","source":{"kind":"original","document":"source/02-游戏流程.md","section":"七、行牌阶段","page":null,"quote":"**摸牌与出牌的衔接**：**摸牌需在上一家打出牌的同时进行**——肉眼可见上家打出牌的瞬间下家摸牌。"},"preconditions":["全局状态处于行牌（GAME-STATE-001）"],"inputs":["出牌 / 碰 / 杠 / 胡 / 过 / 亮倒 / 扣牌操作"],"outputs":["出牌权流转或终局转移"],"business_rules":["等待出牌：当前玩家持出牌权待打牌；庄家发牌后起手 14 张直接进入该状态先出牌（02-游戏流程 §七）。","等待响应：一张牌打出后其余玩家可响应，按优先级吃胡 / 自摸 / 抢杠胡 > 碰 / 杠；无人操作则下家摸牌，摸牌与上家出牌同时进行（§七）。","摸牌中：下家从牌堆摸 1 张，视为进入其回合（§七）。","补牌中：杠牌成功后从牌堆倒序摸 1 张，视为摸牌，牌堆额外减 1（01-基础规则 §4.4）。","亮倒扣牌：打出非危牌后可听牌或自摸时触发亮倒权限；亮倒同时进行扣牌判断，扣牌取消等同过，明牌后只能摸打（01-基础规则 §5.1 / §5.2）。","杠上杠连杠可在补牌中继续杠进入下一轮补牌，杠分按 2^(连续杠次数−1) 翻倍（01-基础规则 §4.2）。","漏胡：等待响应中可胡而不胡则进入漏胡状态，摸牌前不可胡牌，摸牌（含补牌）后解除（01-基础规则 §八）。"],"normal_flow":["发牌完成 -> 等待出牌（庄家 14 张先出牌）","等待出牌 -> 等待响应（当前玩家打出一张牌）","等待响应 -> 摸牌中（无人碰杠胡，下家摸牌）","摸牌中 -> 等待出牌（摸牌完成）","等待响应 -> 等待出牌（有人碰 / 杠，该玩家取得出牌权）","等待出牌 -> 补牌中（杠牌成功后补牌）","补牌中 -> 等待出牌（补牌完成，视为摸牌）","等待出牌 -> 亮倒扣牌（打出非危牌后可听牌，玩家选择亮倒）","摸牌中 -> 亮倒扣牌（自摸时展示亮的权限，玩家选择亮倒）","亮倒扣牌 -> 等待出牌（扣牌判断完成或取消等同过，此后明牌只可摸打）"],"exception_flow":["等待响应 -> 和牌结算（吃胡 / 自摸 / 抢杠胡，优先级高于碰杠）","补牌中 -> 和牌结算（杠上花：杠后补到的牌胡牌）","等待响应 -> 等待响应（玩家选择漏胡 / 过，过手状态保持至摸牌解除）"],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-007","GAME-RULE-008","GAME-RULE-009","GAME-RULE-010","GAME-RULE-011","GAME-RULE-012","GAME-RULE-013","GAME-RULE-014","GAME-RULE-018","GAME-RULE-019","GAME-RULE-026"],"open_questions":[]},{"id":"GAME-STATE- BLE 中，守卫同样拒绝（不编造判定）。\n(function (root, factory) {\n  if (typeof module !== \"undefined\" && module.exports) module.exports = factory();\n  else root.MiniGameFactory = factory();\n})(typeof self !== \"undefined\" ? self : this, function () {\n  // 规则声明表：与 examples/mahjong/game-spec 冻结 IR 对应（子集）\n  const RULE_TABLE = {\n    \"GAME-RULE-033\": { name: \"危牌禁打\", authority: \"fixed\", status: \"proposed\" },\n    \"GAME-RULE-038\": { name: \"碰牌规则\", authority: \"fixed\", status: \"proposed\" },\n    \"GAME-RULE-039\": { name: \"操作优先级\", authority: \"fixed\", status: \"proposed\" },\n    \"GAME-RULE-040\": { name: \"杠类型\", authority: \"fixed\", status: \"proposed\" },\n    \"GAME-RULE-041\": { name: \"杠分结算\", authority: \"fixed\", status: \"proposed\" },\n    \"GAME-RULE-042\": { name: \"杠上杠连杠\", authority: \"fixed\", status: \"proposed\" },\n    \"GAME-RULE-049\": { name: \"漏胡规则\", authority: \"fixed\", status: \"proposed\" },\n    \"GAME-RULE-050\": { name: \"按钮优先级顺序\", authority: \"fixed\", status: \"proposed\" },\n    \"GAME-RULE-071\": { name: \"平胡 F01\", authority: \"fixed\", status: \"proposed\" },\n    \"GAME-RULE-072\": { name: \"碰碰胡 F02\", authority: \"fixed\", status: \"proposed\" },\n    \"GAME-RULE-081\": { name: \"亮倒加倍 J01\", authority: \"fixed\", status: \"proposed\" },\n    \"GAME-RULE-086\": { name: \"上楼加倍 J08\", authority: \"fixed\", status: \"proposed\" },\n    \"GAME-RULE-116\": { name: \"结算总公式 S0\", authority: \"open\", status: \"proposed\" },\n    \"GAME-RULE-121\": { name: \"封顶截断 S4\", authority: \"fixed\", status: \"proposed\" },\n  };\n\n  function guard(ruleId) {\n    const rule = RULE_TABLE[ruleId];\n    if (!rule) throw { code: \"RULE_NOT_CONFIRMED\", ruleId: ruleId, message: \"规则未定义，模拟器拒绝判定\" };\n    if (rule.authority === \"open\") throw { code: \"RULE_NOT_CONFIRMED\", ruleId: ruleId, message: \"规则未确认（authority=open），禁止作为确定规则执行\" };\n    return rule;\n  }\n\n  // ---------- 工具 ----------\n  const SUITS = [\"万\", \"条\", \"筒\"];\n  const tileIndex = (t) => SUITS.indexOf(t.slice(1)) * 9 + (parseInt(t, 10) - 1);\n  const tileName = (i) => (i % 9 + 1) + SUITS[Math.floor(i / 9)];\n  const countsOf = (tiles) => {\n    const c = new Array(27).fill(0);\n    for (const t of tiles) c[tileIndex(t)]++;\n    return c;\n  };\n  // 确定性发牌器（LCG）：无外部配置时自动生成 108 张牌序列\n  function buildDeck(seed) {\n    const pool = [];\n    for (let i = 0; i < 27; i++) for (let k = 0; k < 4; k++) pool.push(tileName(i));\n    let s = seed >>> 0;\n    for (let i = pool.length - 1; i > 0; i--) {\n      s = (s * 1664525 + 1013904223) >>> 0;\n      const j = s % (i + 1);\n      [pool[i], pool[j]] = [pool[j], pool[i]];\n    }\n    return pool;\n  }\n  const snapshotOf = (s) => JSON.parse(JSON.stringify(s));\n\n  // 胡牌判定：counts 可拆为 needSets 副面子 + 1 对将\n  // 取高原则（F01/F02）：优先全刻分解（碰碰胡 2 倍），仅当全刻不成立才允许顺子（平胡 1 倍）\n  function decompose(counts, needSets) {\n    const trySolve = (c, sets, chowsAllowed) => {\n      let first = -1;\n      for (let i = 0; i < 27; i++) if (c[i] > 0) { first = i; break; }\n      if (first === -1) return sets === 0;\n      if (sets === 0) return false;\n      // 刻子优先\n      if (c[first] >= 3) {\n        c[first] -= 3;\n        const ok = trySolve(c, sets - 1, chowsAllowed);\n        c[first] += 3;\n        if (ok) return true;\n      }\n      // 顺子（同花色内 rank 相邻；仅平胡模式允许）\n      if (chowsAllowed) {\n        const sameSuit = Math.floor(first / 9) === Math.floor((first + 2) / 9);\n        if (sameSuit && first % 9 <= 6 && c[first + 1] > 0 && c[first + 2] > 0) {\n          c[first]--; c[first + 1]--; c[first + 2]--;\n          const ok = trySolve(c, sets - 1, chowsAllowed);\n          c[first]++; c[first + 1]++; c[first + 2]++;\n          if (ok) return true;\n        }\n      }\n      return false;\n    };\n    const solve = (chowsAllowed) => {\n      const c = counts.slice();\n      for (let p = 0; p < 27; p++) {\n        if (c[p] >= 2) {\n          c[p] -= 2;\n          const ok = trySolve(c, needSets, chowsAllowed);\n          c[p] += 2;\n          if (ok) return true;\n        }\n      }\n      return false;\n    };\n    // 取高：全刻分解成立 => 碰碰胡；否则顺子分解成立 => 平胡\n    if (solve(false)) return { win: true, hasChow: false };\n    if (solve(true)) return { win: true, hasChow: true };\n    return { win: false, hasChow: false };\n  }\n\n  // ---------- 逻辑核心（无 DOM） ----------\n  function createGame(config, logger) {\n    const cfg = Object.assign({ playerCount: 3, baseScore: 1, cap: 8, seed: 20261109, dangerTiles: {} }, config || {});\n    const log = (ruleId, verdict, detail) => logger && logger.log(ruleId, verdict, detail);\n    let state = null;\n\n    function initial() {\n      const deck = Array.isArray(cfg.deck) ? cfg.deck.slice() : buildDeck(cfg.seed);\n      const players = [];\n      for (let i = 0; i < cfg.playerCount; i++) {\n        players.push({ name: \"P\" + (i + 1), hand: [], melds: [], liang: false, upstairs: false, missed: false, score: 0, isDealer: i === 0 });\n      }\n      // 发 13 张起手（庄家 14：含首摸）；测试可用 hands 直接给定受控手牌\n      if (Array.isArray(cfg.hands)) {\n        for (let i = 0; i < cfg.playerCount; i++) {\n          players[i].hand = (cfg.hands[i] || []).slice().sort((a, b) => tileIndex(a) - tileIndex(b));\n        }\n      } else {\n        for (let r = 0; r < 13; r++) for (const p of players) p.hand.push(deck.pop());\n        players[0].hand.push(deck.pop());\n      }\n      return {\n        phase: \"playing\",\n        turn: 0,\n        players,\n        deck,\n        discardRiver: [],\n        lastDiscard: null,\n        gangChain: 0, // 连杠次数（RULE-042）\n        chainEligibleDiscard: false, // 最近出牌是否为杠后补牌的出牌（可延续连杠）\n        pendingGangReplenish: null, // 刚杠完待补牌打出的玩家\n        logSeq: 0,\n      };\n    }\n\n    function cur() { return state.players[state.turn]; }\n\n    function dangerCheck(player, tile) {\n      guard(\"GAME-RULE-033\");\n      const danger = (cfg.dangerTiles && cfg.dangerTiles[player.name]) || [];\n      if (!danger.includes(tile)) return null;\n      // 全危牌例外：手中全是危牌时允许打出\n      const allDanger = player.hand.every((t) => danger.includes(t));\n      if (allDanger) {\n        log(\"GAME-RULE-033\", \"applied\", \"全危牌例外，允许打出 \" + tile);\n        return null;\n      }\n      log(\"GAME-RULE-033\", \"rejected\", \"危牌 \" + tile + \" 禁止打出（打出该牌将会放炮）\");\n      return { ok: false, reason: \"danger_tile\" };\n    }\n\n    // 摸牌（同时按 RULE-049 解除漏胡）\n    function draw() {\n      if (state.phase !== \"playing\") return { ok: false, reason: \"round_over\" };\n      if (!state.deck.length) {\n        state.phase = \"round_over\";\n        return { ok: false, reason: \"wall_empty\" };\n      }\n      const tile = state.deck.pop();\n      cur().hand.push(tile);\n      cur().hand.sort((a, b) => tileIndex(a) - tileIndex(b));\n      if (cur().missed) {\n        guard(\"GAME-RULE-049\");\n        cur().missed = false;\n        log(\"GAME-RULE-049\", \"applied\", cur().name + \" 摸牌，漏胡解除\");\n      }\n      return { ok: true, tile };\n    }\n\n    // 出牌\n    function discard(tile) {\n      if (state.phase !== \"playing\") return { ok: false, reason: \"round_over\" };\n      const p = cur();\n      if (!p.hand.includes(tile)) return { ok: false, reason: \"no_tile\" };\n      const blocked = dangerCheck(p, tile);\n      if (blocked) return blocked;\n      p.hand.splice(p.hand.indexOf(tile), 1);\n      state.lastDiscard = { player: state.turn, tile };\n      state.discardRiver.push({ player: state.turn, tile });\n      // RULE-042 连杠链：杠后补牌打出的牌被杠才连续；其余出牌中断连杠\n      if (state.pendingGangReplenish === state.turn) {\n        state.chainEligibleDiscard = true; // 本张为杠后补牌的出牌，可延续连杠\n      } else {\n        state.chainEligibleDiscard = false;\n        state.gangChain = 0; // 非杠后补牌的出牌且无人杠，连杠结束\n      }\n      state.pendingGangReplenish = null;\n      state.turn = (state.turn + 1) % state.players.length;\n      log(null, \"applied\", p.name + \" 打出 \" + tile);\n      return { ok: true, tile };\n    }\n\n    // 碰（RULE-038）：对 lastDiscard 声明碰的玩家\n    function peng(playerIdx) {\n      if (state.phase !== \"playing\") return { ok: false, reason: \"round_over\" };\n      guard(\"GAME-RULE-038\");\n      if (!state.lastDiscard) return { ok: false, reason: \"no_discard\" };\n      const tile = state.lastDiscard.tile;\n      const p = state.players[playerIdx];\n      const held = p.hand.filter((t) => t === tile).length;\n      if (held < 2) {\n        log(\"GAME-RULE-038\", \"rejected\", p.name + \" 手中 \" + tile + \" 不足 2 张，碰不成立\");\n        return { ok: false, reason: \"peng_fail\" };\n      }\n      // 移除两张\n      let removed = 0;\n      p.hand = p.hand.filter((t) => { if (t === tile && removed < 2) { removed++; return false; } return true; });\n      p.melds.push({ type: \"peng\", tile });\n      state.turn = playerIdx;\n      state.lastDiscard = null;\n      log(\"GAME-RULE-038\", \"applied\", p.name + \" 碰 \" + tile + \"，取得出牌权\");\n      return { ok: true };\n    }\n\n    // 连杠次数判定（RULE-042）：直杠看牌河是否为杠后补牌的出牌；暗杠/补杠看自己是否刚杠完补牌\n    function chainCount(playerIdx, type) {\n      if (type === \"direct\") return state.chainEligibleDiscard ? state.gangChain + 1 : 1;\n      return state.pendingGangReplenish === playerIdx ? state.gangChain + 1 : 1;\n    }\n\n    // 杠分结算（RULE-041 基数 x RULE-042 连杠倍数 2^(n-1)）\n    function settleGang(gangPlayer, type, fromPlayer, n) {\n      guard(\"GAME-RULE-041\");\n      guard(\"GAME-RULE-042\");\n      const basePerSource = type === \"bu\" ? 1 * cfg.baseScore : 2 * cfg.baseScore; // 直杠 2 倍 / 补杠 1 倍 / 暗杠 2 倍\n      const amount = basePerSource * Math.pow(2, n - 1);\n      let total = 0;\n      if (type === \"direct\") {\n        state.players[fromPlayer].score -= amount;\n        total = amount;\n      } else {\n        for (let i = 0; i < state.players.length; i++) {\n          if (i === gangPlayer) continue;\n          state.players[i].score -= amount;\n        }\n        total = amount * (state.players.length - 1);\n      }\n      state.players[gangPlayer].score += total;\n      log(\"GAME-RULE-041\", \"applied\", (type === \"direct\" ? \"直杠\" : type === \"bu\" ? \"补杠\" : \"暗杠\") + \" 实时结算，\" + state.players[gangPlayer].name + \" 收 \" + total + \" 分\");\n      if (n > 1) log(\"GAME-RULE-042\", \"applied\", \"第 \" + n + \" 次连杠，杠分 = \" + basePerSource + \" x 2^\" + (n - 1) + \" = \" + amount + \"/家\");\n      return total;\n    }\n\n    // 杠（RULE-040）：type = direct(直杠) | an(暗杠) | bu(补杠)\n    function gang(playerIdx, tile, type) {\n      if (state.phase !== \"playing\") return { ok: false, reason: \"round_over\" };\n      guard(\"GAME-RULE-040\");\n      const p = state.players[playerIdx];\n      const n = chainCount(playerIdx, type);\n      if (type === \"direct\") {\n        if (!state.lastDiscard || state.lastDiscard.tile !== tile) return { ok: false, reason: \"no_discard\" };\n        if (p.hand.filter((t) => t === tile).length < 3) {\n          log(\"GAME-RULE-040\", \"rejected\", \"手中 \" + tile + \" 不足 3 张，直杠不成立\");\n          return { ok: false, reason: \"gang_fail\" };\n        }\n        let removed = 0;\n        p.hand = p.hand.filter((t) => { if (t === tile && removed < 3) { removed++; return false; } return true; });\n        const from = state.lastDiscard.player;\n        p.melds.push({ type: \"gang\", tile, gangType: \"direct\" });\n        state.lastDiscard = null;\n        state.turn = playerIdx;\n        settleGang(playerIdx, \"direct\", from, n);\n      } else if (type === \"an\") {\n        if (p.hand.filter((t) => t === tile).length < 4) {\n          log(\"GAME-RULE-040\", \"rejected\", \"手中 \" + tile + \" 不足 4 张，暗杠不成立\");\n          return { ok: false, reason: \"gang_fail\" };\n        }\n        p.hand = p.hand.filter((t) => t !== tile);\n        p.melds.push({ type: \"gang\", tile, gangType: \"an\" });\n        settleGang(playerIdx, \"an\", null, n);\n      } else {\n        const meld = p.melds.find((m) => m.type === \"peng\" && m.tile === tile);\n        if (!meld) {\n          log(\"GAME-RULE-040\", \"rejected\", \"无 \" + tile + \" 的碰副露，补杠不成立\");\n          return { ok: false, reason: \"gang_fail\" };\n        }\n        if (!p.hand.includes(tile)) return { ok: false, reason: \"no_tile\" };\n        p.hand.splice(p.hand.indexOf(tile), 1);\n        meld.type = \"gang\";\n        meld.gangType = \"bu\";\n        settleGang(playerIdx, \"bu\", null, n);\n      }\n      state.gangChain = n;\n      state.chainEligibleDiscard = false;\n      state.pendingGangReplenish = playerIdx; // 杠后补牌，补牌打出的牌可延续连杠\n      // 杠后补牌（补牌同样解除漏胡）\n      const dr = draw();\n      return { ok: true, chain: n, replenish: dr };\n    }\n\n    // 胡（RULE-071 平胡 / RULE-072 碰碰胡 / RULE-049 漏胡 / RULE-081 亮倒 / RULE-086 上楼 / RULE-121 封顶）\n    function hu(playerIdx, kind) {\n      if (state.phase !== \"playing\") return { ok: false, reason: \"round_over\" };\n      const p = state.players[playerIdx];\n      // RULE-049：漏胡期间不可胡\n      if (p.missed) {\n        guard(\"GAME-RULE-049\");\n        log(\"GAME-RULE-049\", \"rejected\", p.name + \" 漏胡期间不可胡（摸牌后解除）\");\n        return { ok: false, reason: \"missed_hu\" };\n      }\n      const tiles = kind === \"zimo\" ? p.hand.slice() : p.hand.concat(state.lastDiscard ? [state.lastDiscard.tile] : []);\n      const needSets = 4 - p.melds.length;\n      const expectedLen = needSets * 3 + 2;\n      if (tiles.length !== expectedLen) return { ok: false, reason: \"tile_count\" };\n      const res = decompose(countsOf(tiles), needSets);\n      if (!res.win) {\n        log(kind === \"zimo\" ? \"GAME-RULE-071\" : \"GAME-RULE-072\", \"rejected\", p.name + \" 牌型不成立，不可胡\");\n        return { ok: false, reason: \"no_win\" };\n      }\n      // 番型判定：F01 平胡（含顺子）1 倍 / F02 碰碰胡（全刻）2 倍\n      let patternId, patternName, patternScore;\n      if (res.hasChow) { guard(\"GAME-RULE-071\"); patternId = \"GAME-RULE-071\"; patternName = \"平胡（F01）\"; patternScore = 1; }\n      else { guard(\"GAME-RULE-072\"); patternId = \"GAME-RULE-072\"; patternName = \"碰碰胡（F02）\"; patternScore = 2; }\n      log(patternId, \"applied\", p.name + \" \" + patternName + \" 成立，牌型分 \" + patternScore + \" 倍\");\n      // 加倍项：亮倒 J01 x2 / 上楼 J08 x2 或 x4\n      let mult = 1;\n      if (p.liang) { guard(\"GAME-RULE-081\"); mult *= 2; log(\"GAME-RULE-081\", \"applied\", \"亮倒 J01 加倍 x2\"); }\n      if (p.upstairs) { guard(\"GAME-RULE-086\"); mult *= 2; log(\"GAME-RULE-086\", \"applied\", \"上楼 J08 加倍 x2\"); }\n      let value = patternScore * mult;\n      // 封顶截断（RULE-121）：仅截断番型 x 加倍项\n      guard(\"GAME-RULE-121\");\n      const capped = cfg.cap && cfg.cap > 0 ? Math.min(value, cfg.cap) : value;\n      if (capped !== value) log(\"GAME-RULE-121\", \"applied\", \"番型x加倍项 \" + value + \" 超封顶 \" + cfg.cap + \"，截断为 \" + capped);\n      else log(\"GAME-RULE-121\", \"applied\", \"番型x加倍项 \" + value + \" 未超封顶 \" + cfg.cap + \"，不截断\");\n      state.phase = \"round_over\";\n      return { ok: true, pattern: patternId, patternName, patternScore, multiplier: mult, cappedValue: capped };\n    }\n\n    // 过（RULE-049：过胡进入漏胡）\n    function pass(playerIdx, chance) {\n      const p = state.players[playerIdx];\n      if (chance === \"hu\") {\n        guard(\"GAME-RULE-049\");\n        p.missed = true;\n        log(\"GAME-RULE-049\", \"applied\", p.name + \" 可胡不胡，进入漏胡状态（摸牌后解除）\");\n        return { ok: true };\n      }\n      log(null, \"applied\", p.name + \" 过 \" + (chance || \"操作\"));\n      return { ok: true };\n    }\n\n    // 亮倒（J01 前置开关）\n    function liang(playerIdx) {\n      const p = state.players[playerIdx];\n      p.liang = !p.liang;\n      log(p.liang ? \"GAME-RULE-081\" : null, \"applied\", p.name + (p.liang ? \" 亮倒（J01 x2）\" : \" 取消亮倒\"));\n      return { ok: true, liang: p.liang };\n    }\n\n    // 上楼（J08 前置开关）\n    function upstairs(playerIdx) {\n      const p = state.players[playerIdx];\n      p.upstairs = !p.upstairs;\n      log(\"GAME-RULE-086\", \"applied\", p.name + (p.upstairs ? \" 上楼（J08 x2）\" : \" 取消上楼\"));\n      return { ok: true, upstairs: p.upstairs };\n    }\n\n    // 总结算（S0）：authority=open，守卫拒绝 —— 完整结算需人工确认 S0 口径后实现\n    function settle() {\n      guard(\"GAME-RULE-116\"); // 此处必然抛出 RULE_NOT_CONFIRMED\n    }\n\n    function dispatch(action, args) {\n      args = args || {};\n      switch (action) {\n        case \"draw\": return draw();\n        case \"discard\": return discard(args.tile);\n        case \"peng\": return peng(args.player);\n        case \"gang\": return gang(args.player, args.tile, args.type);\n        case \"hu\": return hu(args.player, args.kind || \"zimo\");\n        case \"pass\": return pass(args.player, args.chance);\n        case \"liang\": return liang(args.player);\n        case \"upstairs\": return upstairs(args.player);\n        case \"settle\": return settle();\n        default: log(null, \"rejected\", \"未知动作 \" + action); return { ok: false, reason: \"unknown_action\" };\n      }\n    }\n\n    function getState() { return snapshotOf(state); }\n    function reset(config2) {\n      if (config2) Object.assign(cfg, config2);\n      state = initial();\n    }\n    reset();\n    return { dispatch, getState, reset, snapshot: () => snapshotOf(state), restore: (s) => { state = snapshotOf(s); } };\n  }\n\n  // ---------- DOM 适配（浏览器） ----------\n  function create(area, onLog) {\n    const logger = { entries: [], log: function (r, v, d) { this.entries.push(\"[\" + (r || \"SYS\") + \"] \" + v + \" \" + (d || \"\")); if (onLog) onLog(\"[\" + (r || \"SYS\") + \"] \" + (d || \"\")); } };\n    let game = null;\n\n    function el(tag, cls, text) {\n      const e = document.createElement(tag);\n      if (cls) e.className = cls;\n      if (text != null) e.textContent = text;\n      return e;\n    }\n\n    function render() {\n      const st = game.getState();\n      area.innerHTML = \"\";\n      // 玩家面板（手牌区 GAME-COMP-003）\n      st.players.forEach((p, i) => {\n        const panel = el(\"div\", \"mj-player\" + (i === st.turn && st.phase === \"playing\" ? \" active\" : \"\"));\n        panel.dataset.componentId = \"GAME-COMP-003\";\n        const head = el(\"div\", \"mj-head\", p.name + (p.isDealer ? \"（庄）\" : \"\") + \" 分：\" + p.score + (p.liang ? \" [亮倒]\" : \"\") + (p.upstairs ? \" [上楼]\" : \"\") + (p.missed ? \" [漏胡]\" : \"\"));\n        panel.appendChild(head);\n        const hand = el(\"div\", \"mj-hand\");\n        p.hand.forEach((t) => {\n          const tile = el(\"span\", \"mj-tile\" + (i === st.turn ? \" clickable\" : \"\"), t);\n          tile.dataset.componentId = \"GAME-COMP-003\";\n          if (i === st.turn) {\n            tile.addEventListener(\"click\", function () {\n              game.dispatch(\"discard\", { tile: t });\n              render();\n            });\n          }\n          hand.appendChild(tile);\n        });\n        panel.appendChild(hand);\n        const melds = el(\"div\", \"mj-melds\", p.melds.map((m) => (m.type === \"peng\" ? \"碰\" + m.tile : \"杠\" + m.tile)).join(\"  \") || \"\");\n        panel.appendChild(melds);\n        area.appendChild(panel);\n      });\n      // 牌河（GAME-COMP-004）\n      const river = el(\"div\", \"mj-river\", \"牌河：\" + st.discardRiver.map((d) => st.players[d.player].name + \">\" + d.tile).join(\" \"));\n      river.dataset.componentId = \"GAME-COMP-004\";\n      area.appendChild(river);\n      // 操作按钮组（GAME-COMP-005，顺序按 RULE-050：碰 -> 杠 -> 亮 -> 胡 -> 过）\n      const btns = el(\"div\", \"mj-actions\");\n      btns.dataset.componentId = \"GAME-COMP-005\";\n      const mk = (label, fn) => {\n        const b = el(\"button\", \"mj-btn\", label);\n        b.addEventListener(\"click\", function () {\n          try { game.dispatch.apply(game, fn()); }\n          catch (e) { if (onLog) onLog(\"[\" + (e.code || \"ERROR\") + \"] \" + e.message); }\n          render();\n        });\n        btns.appendChild(b);\n      };\n      mk(\"摸牌\", () => [\"draw\", {}]);\n      mk(\"碰\", () => [\"peng\", { player: st.turn }]);\n      mk(\"杠(直杠)\", () => [\"gang\", { player: st.turn, tile: st.lastDiscard && st.lastDiscard.tile, type: \"direct\" }]);\n      mk(\"亮倒\", () => [\"liang\", { player: st.turn }]);\n      mk(\"胡(自摸)\", () => [\"hu\", { player: st.turn, kind: \"zimo\" }]);\n      mk(\"过(胡)\", () => [\"pass\", { player: st.turn, chance: \"hu\" }]);\n      mk(\"总结算\", () => [\"settle\", {}]);\n      area.appendChild(btns);\n      if (st.phase === \"round_over\") {\n        const over = el(\"div\", \"mj-over\", \"本局结束（胡牌或流局）\");\n        area.appendChild(over);\n      }\n    }\n\n    (function newGame() {\n      game = createGame(null, logger);\n      render();\n    })();\n    return { getLog: function () { return logger.entries; } };\n  }\n\n  return { RULE_TABLE: RULE_TABLE, createGame: createGame, create: create };\n});\n"}};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- 数据索引 ----------
const reqById = new Map();
for (const r of APP_DATA.requirements) reqById.set(r.id, r);
for (const c of APP_DATA.configs) reqById.set(c.id, c);
for (const s of APP_DATA.states) reqById.set(s.id, s);
const compById = new Map(); for (const c of APP_DATA.ui.components) compById.set(c.id, c);
const pageById = new Map(); for (const p of APP_DATA.ui.pages) pageById.set(p.id, p);
const caseById = new Map(); for (const t of APP_DATA.tests.cases) caseById.set(t.id, t);

// ---------- 规格分类（P0：导航配置 + 按 APP_DATA 实际 type 字段映射，数量动态统计） ----------
const SPEC_CATEGORIES = [
  { id: "GAME-FR", label: "功能需求", filter: (r) => r.type === "game_feature" },
  { id: "GAME-RULE", label: "游戏规则", filter: (r) => r.type === "game_rule" },
  { id: "GAME-STATE", label: "状态机", filter: (r) => r.type === "state" },
  { id: "GAME-CFG", label: "数值配置", filter: (r) => r.type === "config" },
  { id: "GAME-UI", label: "UI 页面与组件", isUi: true },
];
const specState = { category: null, selectedId: null, filters: { keyword: "", status: "all", authority: "all" } }; // 规格工作台状态（null = 概述；filters 供 FR/RULE 分类）
const decisionState = { selectedOqId: null, statusFilter: "all", severityFilter: "all", keyword: "", stash: {} }; // 裁决工作台状态（stash: 切换问题时的表单暂存）
function categoryOf(r) { for (const c of SPEC_CATEGORIES) if (c.filter && c.filter(r)) return c.id; return null; }

// ---------- 徽标 ----------
function badges(r) {
  return `<span class="badge st-${r.status}">${r.status}</span><span class="badge au-${r.authority}">${r.authority}</span>`;
}

// ---------- 左侧分类导航（P0：不展开全部需求，只列分类与数量） ----------
function renderNav() {
  const nav = $("#nav");
  let html = `<h4>规格分类</h4><a class="cat-nav" data-cat="__overview__">游戏概述</a>`;
  for (const c of SPEC_CATEGORIES) {
    const cnt = c.isUi ? APP_DATA.ui.pages.length : [...reqById.values()].filter(c.filter).length;
    html += `<a class="cat-nav" data-cat="${c.id}">${esc(c.label)}<span class="cnt">${cnt}</span></a>`;
  }
  html += `<h4>其他</h4><a class="cat-nav" data-nav="ui-demo">UI Demo 演示</a>` +
    `<a class="cat-nav" data-nav="tests">测试用例（${APP_DATA.tests.cases.length}）</a>` +
    `<a class="cat-nav" data-nav="openq">未决问题裁决（${(APP_DATA.reviews.openQuestions || []).length}）</a>`;
  nav.innerHTML = html;
  nav.addEventListener("click", (e) => {
    const a = e.target.closest("a");
    if (!a) return;
    if (a.dataset.cat) { switchTab("spec", () => setSpecCategory(a.dataset.cat === "__overview__" ? null : a.dataset.cat)); return; }
    if (a.dataset.nav === "ui-demo") switchTab("ui");
    else if (a.dataset.nav === "tests") switchTab("tests");
    else if (a.dataset.nav === "openq") switchTab("decision");
  });
  updateNavActive();
}
function updateNavActive() {
  const nav = $("#nav");
  nav.querySelectorAll("a").forEach((a) => a.classList.remove("active"));
  const cat = specState.category === null ? "__overview__" : specState.category;
  const el = nav.querySelector(`[data-cat="${cat}"]`);
  if (el) el.classList.add("active");
}
function setSpecCategory(cat) {
  specState.category = cat;
  specState.selectedId = null;
  updateNavActive();
  renderSpecCategory();
}

// ---------- 详情面板 ----------
function showDetail(r) {
  const s = r.source || {};
  const fields = [
    ["ID", r.id], ["名称", r.name], ["类型", r.type], ["状态", r.status], ["权限", r.authority],
    ["来源", `${s.kind || "-"}${s.section ? "（" + esc(s.section) + "）" : ""}${s.decided_by ? " 决策人：" + esc(s.decided_by) : ""}`],
    ["前置条件", (r.preconditions || []).join("；")],
    ["关联 UI", (r.ui_refs || []).join("、")],
    ["关联测试", (r.test_refs || []).join("、")],
    ["依赖", (r.dependencies || []).join("、")],
    ["AI 解释", (r.authority === "open" ? "该规则尚待人工确认，AI 不得将其作为确定规则执行。" : "已定义规则，AI 可按 authority 约束使用。")],
  ];
  $("#detail").innerHTML = fields.filter(([, v]) => v).map(([k, v]) =>
    `<div class="field"><span class="k">${k}</span>${esc(v)}</div>`).join("") +
    (s.quote ? `<div class="quote">${esc(s.quote)}</div>` : "");
}

function showRequirement(id) {
  const r = reqById.get(id);
  if (!r) return;
  switchTab("spec", () => {
    const cat = categoryOf(r);
    if (cat && specState.category !== cat) setSpecCategory(cat);
    raf(() => { scrollReq(id); showDetail(r); });
  });
}

function scrollReq(id) {
  const el = document.querySelector(`[data-anchor="${id}"]`);
  if (el) {
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.add("highlight");
    setTimeout(() => el.classList.remove("highlight"), 3200);
  }
}

// ---------- 视图切换 ----------
let currentTab = "spec";
const raf = window.requestAnimationFrame || ((fn) => setTimeout(fn, 0));
function switchTab(tab, after) {
  currentTab = tab;
  document.body.classList.toggle("ws-decision", tab === "decision");
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  if (tab === "spec") renderSpecCategory();
  if (tab === "ui") renderUiDemo();
  if (tab === "flow") renderFlow();
  if (tab === "tests") renderTests();
  if (tab === "decision") renderDecisionWorkbench();
  if (after) raf(after);
}

// ---------- PRD 视图 ----------
function reqCard(r) {
  const rules = (r.business_rules || []).map((x) => `<li>${esc(x)}</li>`).join("");
  const flows = (r.normal_flow || []).map((x) => `<li>${esc(x)}</li>`).join("");
  const s = r.source || {};
  const quote = s.quote ? `<div class="quote">原文：${esc(s.quote)}</div>` :
    (s.basis ? `<div class="quote">推导依据：${esc(s.basis)}</div>` : "");
  const uiBtn = (r.ui_refs || []).length ? `<button class="btn-ui" data-goto-ui="${esc(r.id)}">查看 UI</button>` : "";
  return `<div class="req-card" data-anchor="${r.id}" data-requirements="${esc(r.id)}">
    <h3>${esc(r.id)} ${esc(r.name)} ${badges(r)} ${uiBtn}</h3>
    <div>${esc(r.description || "")}</div>${quote}${rules ? `<ul>${rules}</ul>` : ""}${flows ? `<ul>${flows}</ul>` : ""}
  </div>`;
}

// 搜索/筛选工具条（FR 与 RULE 分类共用；筛选只重渲染列表区，不动右侧详情）
function specFilterStatus() {
  return [...new Set([...reqById.values()].map((r) => r.status).filter(Boolean))];
}
function specFilterAuthority() {
  return [...new Set([...reqById.values()].map((r) => r.authority).filter(Boolean))];
}
function applySpecFilters(items) {
  const kw = specState.filters.keyword.trim().toLowerCase();
  return items.filter((r) => {
    if (specState.filters.status !== "all" && r.status !== specState.filters.status) return false;
    if (specState.filters.authority !== "all" && r.authority !== specState.filters.authority) return false;
    if (kw && !`${r.id} ${r.name} ${r.description || ""}`.toLowerCase().includes(kw)) return false;
    return true;
  });
}
function specToolbarHtml(total, shown) {
  return `<div class="spec-toolbar">
    <input id="spec-kw" placeholder="搜索 ID、名称、描述" value="${esc(specState.filters.keyword)}" style="flex:1;min-width:140px">
    <select id="spec-status"><option value="all">状态：全部</option>
      ${specFilterStatus().map((v) => `<option value="${esc(v)}"${specState.filters.status === v ? " selected" : ""}>${esc(v)}</option>`).join("")}</select>
    <select id="spec-authority"><option value="all">权限：全部</option>
      ${specFilterAuthority().map((v) => `<option value="${esc(v)}"${specState.filters.authority === v ? " selected" : ""}>${esc(v)}</option>`).join("")}</select>
    <span class="meta" id="spec-count">${shown} / ${total}</span>
  </div><div id="spec-body"></div>`;
}
function bindSpecToolbar(renderBody) {
  $("#spec-kw").addEventListener("input", (e) => { specState.filters.keyword = e.target.value; renderBody(); });
  $("#spec-status").addEventListener("change", (e) => { specState.filters.status = e.target.value; renderBody(); });
  $("#spec-authority").addEventListener("change", (e) => { specState.filters.authority = e.target.value; renderBody(); });
  renderBody();
}

// GAME-FR：搜索 + 状态/权限筛选 + 需求卡片
function renderCatFr() {
  const items = [...reqById.values()].filter((r) => r.type === "game_feature");
  $("#view").innerHTML = `<h3>功能需求（${items.length}）</h3>` + specToolbarHtml(items.length, 0);
  bindSpecToolbar(() => {
    const shown = applySpecFilters(items);
    $("#spec-count").textContent = `${shown.length} / ${items.length}`;
    $("#spec-body").innerHTML = shown.map(reqCard).join("") || "<div class='meta'>无匹配项</div>";
  });
}

// GAME-RULE：按规则来源章节（source.document）分组 + 搜索/筛选
function renderCatRule() {
  const items = [...reqById.values()].filter((r) => r.type === "game_rule");
  $("#view").innerHTML = `<h3>游戏规则（${items.length}）</h3>` + specToolbarHtml(items.length, 0);
  bindSpecToolbar(() => {
    const shown = applySpecFilters(items);
    $("#spec-count").textContent = `${shown.length} / ${items.length}`;
    // 按来源文档分组（无 source 的归「未分组」）
    const groups = new Map();
    for (const r of shown) {
      const doc = (r.source && r.source.document) || "未分组";
      if (!groups.has(doc)) groups.set(doc, []);
      groups.get(doc).push(r);
    }
    $("#spec-body").innerHTML = shown.length
      ? [...groups.entries()].map(([doc, rs]) => `<h4 class="group-head">${esc(doc)}（${rs.length}）</h4>` + rs.map(reqCard).join("")).join("")
      : "<div class='meta'>无匹配项</div>";
  });
}

function showPageDetail(pid) {
  const p = pageById.get(pid);
  if (!p) return;
  const comps = pageComps(p);
  const fields = [
    ["ID", p.id], ["名称", p.name],
    ["分辨率", p.resolution ? p.resolution.width + " x " + p.resolution.height : ""],
    ["状态", (p.states || []).join(" / ")],
    ["组件", comps.map((c) => c.id + " " + c.name).join("；")],
    ["描述", p.description || ""],
  ];
  $("#detail").innerHTML = fields.filter(([, v]) => v).map(([k, v]) =>
    `<div class="field"><span class="k">${k}</span>${esc(v)}</div>`).join("");
}

// UI 组件详情（GAME-UI 分类点击组件行触发；关联需求可跳规格工作台）
function showCompDetail(cid) {
  const c = APP_DATA.ui.components.find((x) => x.id === cid);
  if (!c) return;
  const related = (c.requirements || []).filter((rid) => reqById.get(rid));
  const ownerPages = APP_DATA.ui.pages.filter((p) => (p.components || p.component_refs || []).includes(c.id) || (c.page_id || "") === p.id);
  const fields = [
    ["ID", c.id], ["名称", c.name], ["类型", c.type],
    ["事件", (c.events || []).join("、")],
    ["视觉提示", c.visual_hint || ""],
    ["所属页面", ownerPages.map((p) => `${p.id} ${p.name}`).join("、")],
  ];
  let html = fields.filter(([, v]) => v).map(([k, v]) =>
    `<div class="field"><span class="k">${k}</span>${esc(v)}</div>`).join("");
  // props（结构化属性，空对象不显示）
  const props = Object.entries(c.props || {}).filter(([, v]) => v !== null && v !== undefined && v !== "");
  if (props.length) {
    html += `<div class="field"><span class="k">属性 props</span></div>` +
      props.map(([k, v]) => `<div class="field" style="padding-left:12px"><span class="k">${esc(k)}</span>${esc(typeof v === "object" ? JSON.stringify(v) : String(v))}</div>`).join("");
  }
  if (related.length) html += `<div class="field"><span class="k">关联需求</span>${related.map((rid) => `<a class="req-link" data-req-link="${esc(rid)}">${esc(rid)}</a>`).join("、")}</div>`;
  $("#detail").innerHTML = html;
}

// ---------- UI Demo 视图 ----------
let uiDemoPageId = null; // 当前演示页面（默认第一页）
function renderUiDemo() {
  const pages = APP_DATA.ui.pages;
  if (!pages.length) { $("#view").innerHTML = "无 UI 页面规格"; return; }
  if (!uiDemoPageId || !pages.some((p) => p.id === uiDemoPageId)) uiDemoPageId = pages[0].id;
  const page = pages.find((p) => p.id === uiDemoPageId);
  const comps = pageComps(page);
  let html = `<div class="ui-demo-bar"><div class="page-switch">` +
    pages.map((p) => `<button class="btn-mini${p.id === page.id ? " primary" : ""}" data-ui-page="${esc(p.id)}">${esc(p.id)} ${esc(p.name)}</button>`).join("") +
    `</div><div class="comp-quick">` +
    (comps.map((c) => `<a class="comp-chip" data-comp-focus="${esc(c.id)}" title="${esc(c.name)}（${esc(c.type)}）">${esc(c.id)}</a>`).join("") || "<span class='meta'>本页无组件</span>") +
    `</div></div>`;
  html += `<h3>${esc(page.id)} ${esc(page.name)} <span class="meta">${page.resolution.width}x${page.resolution.height} 状态：${esc(page.states.join(" / "))}</span></h3>`;
  html += `<div class="board-area" id="ui-area"></div><div id="ui-msg" style="margin-top:8px;color:#1a73e8;font-size:13px"></div>`;
  $("#view").innerHTML = html;
  const area = $("#ui-area");
  // 第一页（对局主页面）用模拟器，其余页面静态原型
  if (APP_DATA.simulator.enabled && page === pages[0]) {
    // Level 2：模拟器驱动（引擎由 build 时内嵌，此处执行并挂载）
    try {
      if (typeof MiniGameFactory === "undefined") new Function(APP_DATA.simulator.code)();
      /* global MiniGameFactory */
      const sim = MiniGameFactory.create(area, (msg) => { $("#ui-msg").textContent = msg; appendLog(msg); });
      window.__sim = sim;
      $("#log").style.display = "block";
    } catch (err) {
      area.innerHTML = `<div class="warn-open">模拟器加载失败：${esc(err.message)}</div>`;
    }
  } else {
    // Level 1：静态原型 + 状态切换假交互
    area.appendChild(renderStaticPage(page));
    $("#ui-msg").textContent = APP_DATA.simulator.enabled ? "静态原型（模拟器仅覆盖对局主页面）" : "Level 1 静态原型（模拟器未注入，仅演示布局与状态切换）";
  }
  // UI -> 规格工作台反向定位：右键点击组件（左键留给游戏操作，避免冲突）
  area.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    const comp = e.target.closest("[data-component-id]");
    if (!comp) return;
    const compId = comp.dataset.componentId;
    const related = new Set();
    for (const c of APP_DATA.ui.components) if (c.id === compId) (c.requirements || []).forEach((x) => related.add(x));
    const others = [...reqById.values()].filter((r) => (r.ui_refs || []).includes(compId)).map((r) => r.id);
    others.forEach((x) => related.add(x));
    // 复用规格工作台统一入口：自动切到关联需求所在分类并高亮展示详情
    const first = [...related][0];
    if (first && reqById.get(first)) showRequirement(first);
  });
  // 页面切换与组件定位
  document.querySelectorAll("[data-ui-page]").forEach((b) => b.addEventListener("click", () => { uiDemoPageId = b.dataset.uiPage; renderUiDemo(); }));
  document.querySelectorAll("[data-comp-focus]").forEach((a) => a.addEventListener("click", () => focusComp(a.dataset.compFocus)));
}

// 组件定位：在当前页面原型中高亮对应组件元素
function focusComp(cid) {
  const el = document.querySelector(`#ui-area [data-component-id="${cid}"]`);
  if (!el) { $("#ui-msg").textContent = `组件 ${cid} 在当前页面原型中无对应元素`; return; }
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.add("comp-focus-highlight");
  setTimeout(() => el.classList.remove("comp-focus-highlight"), 3200);
  $("#ui-msg").textContent = `已定位组件 ${cid}`;
}

function renderStaticPage(page) {
  const frag = document.createDocumentFragment();
  const board = document.createElement("div");
  board.className = "board";
  for (const c of APP_DATA.ui.components) {
    if (c.type === "card") {
      for (let i = 0; i < 8; i++) {
        const el = document.createElement("div");
        el.className = "card-el";
        el.dataset.componentId = c.id;
        el.textContent = "?";
        board.appendChild(el);
      }
    } else {
      const el = document.createElement("div");
      el.className = "comp-generic";
      el.dataset.componentId = c.id;
      el.textContent = `${c.name}（${c.id}）`;
      frag.appendChild(el);
    }
  }
  frag.appendChild(board);
  return frag;
}

// PRD -> UI 定位：依次尝试关联组件，全部未渲染时诚实提示（不虚假成功）
function focusByRequirement(reqId) {
  const r = reqById.get(reqId);
  const ids = ((r && r.ui_refs) || []).filter((x) => compById.has(x));
  let el = null;
  let used = null;
  for (const cid of ids) {
    el = document.querySelector(`[data-component-id="${cid}"]`);
    if (el) { used = cid; break; }
  }
  if (!el) {
    $("#ui-msg").textContent = `定位：${reqId} 关联组件（${ids.join("、") || "无"}）在当前模拟状态未渲染`;
    return;
  }
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.add("target-highlight");
  setTimeout(() => el.classList.remove("target-highlight"), 3200);
  $("#ui-msg").textContent = `定位：${reqId} -> ${used}`;
}

// ---------- Flow 视图 ----------
function renderFlow() {
  let html = `<h3>状态机</h3>`;
  for (const st of APP_DATA.states) {
    html += `<div class="req-card"><h3>${esc(st.id)} ${esc(st.name)} ${badges(st)}</h3>`;
    for (const f of st.normal_flow || []) {
      const parts = f.split("->").map((x) => x.trim()).filter(Boolean);
      if (parts.length >= 2) html += stateSvg(parts);
      else html += `<div>${esc(f)}</div>`;
    }
    html += `</div>`;
  }
  html += `<h3 style="margin-top:16px">核心循环</h3><div class="req-card">`;
  const loop = (APP_DATA.game.coreLoop && APP_DATA.game.coreLoop.loop) || [];
  html += loop.map((x) => esc(x)).join(" -> ") + `</div>`;
  $("#view").innerHTML = html;
}

function stateSvg(states) {
  const W = 130, H = 60, pad = 30;
  const width = pad + states.length * W;
  let svg = `<svg width="${width}" height="90" style="max-width:100%">`;
  states.forEach((s, i) => {
    const x = pad + i * W;
    svg += `<ellipse cx="${x + 40}" cy="35" rx="52" ry="22" fill="#eef3ff" stroke="#7a97c9"/>
            <text x="${x + 40}" y="39" text-anchor="middle" font-size="12">${esc(s)}</text>`;
    if (i < states.length - 1) {
      svg += `<line x1="${x + 92}" y1="35" x2="${x + W - 6}" y2="35" stroke="#7a97c9" marker-end="url(#arw)"/>`;
    }
  });
  svg += `<defs><marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7a97c9"/></marker></defs></svg>`;
  return svg;
}
