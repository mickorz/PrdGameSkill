// ---------- 裁决工作台（P2：候选方案卡片 + 单选/多选 + decision_options 数据驱动 + 草稿自动暂存；内存裁决 + 导出 decisions.json） ----------
const OQ_LIST = APP_DATA.reviews.openQuestions || [];
const DEC_LOG = (APP_DATA.reviews.decisionLog && APP_DATA.reviews.decisionLog.decisions) || [];
const DEC_DRAFTS = (APP_DATA.reviews.approvalState && APP_DATA.reviews.approvalState.drafts) || {};
const DECISIONS = {}; // OQ id -> { status: "draft"|"approved"|"rejected"|"deferred", records: [decision record, ...] }
let decSeq = DEC_LOG.reduce((m, d) => Math.max(m, Number(String(d.decision_id || "DEC-0").replace("DEC-", "")) || 0), 0);

const OQ_STATUS_LABEL = { open: "待裁决", draft: "草稿", approved: "已确认", rejected: "已否决", deferred: "已挂起" };
const SEV_RANK = { high: 3, medium: 2, low: 1 };

// 通用裁决选项（无 decision_options 配置的 OQ 兜底；模板文本不含业务规则，不得视为已确认方案）
const GENERIC_OPTIONS = [
  { id: "adopt_original", label: "采纳原始需求", description: "按原始需求文档口径执行（AI 提取内容维持现状）", action: "adopted" },
  { id: "modify", label: "修改后采纳", description: "人工提供修改后的口径", action: "modified", requires_input: true, input_label: "最终口径" },
  { id: "reject", label: "否决", description: "不采纳当前需求口径", action: "rejected", requires_input: true, input_label: "否决理由" },
  { id: "defer", label: "挂起", description: "等待补充信息后再决定", action: "deferred", requires_input: true, input_label: "挂起原因" },
];
const ACTION_STATUS = { adopted: "approved", modified: "approved", rejected: "rejected", deferred: "deferred" };
const GENERIC_BY_OUTCOME = { adopted: "adopt_original", modified: "modify", rejected: "reject", deferred: "defer" };

// 每 OQ 的候选方案：优先读 OQ 自身 decision_options（单选/多选由该配置决定），否则通用单选兜底
function decisionOptionsOf(q) {
  const o = q.decision_options;
  if (o && Array.isArray(o.options) && o.options.length) {
    const mode = o.selection_mode === "multi" ? "multi" : "single";
    return {
      mode,
      min: o.min_selections || 1,
      max: o.max_selections || (mode === "single" ? 1 : o.options.length),
      options: o.options,
      isCustom: true,
    };
  }
  return { mode: "single", min: 1, max: 1, options: GENERIC_OPTIONS, isCustom: false };
}

function decPrevInLog(oid) {
  const ds = DEC_LOG.filter((d) => d.question_id === oid);
  return ds.length ? ds[ds.length - 1] : null;
}

// 合并三来源计算状态（避免重复计数）：内存 DECISIONS > 历史 DEC_LOG > APP_DATA 草稿 > open
function oqStatus(q) {
  const mem = DECISIONS[q.id];
  if (mem) return mem.status;
  const hist = decPrevInLog(q.id);
  if (hist) return hist.decision_status;
  return DEC_DRAFTS[q.id] ? "draft" : "open";
}

function decisionStats() {
  const s = { total: OQ_LIST.length, open: 0, draft: 0, approved: 0, rejected: 0, deferred: 0 };
  for (const q of OQ_LIST) s[oqStatus(q)] += 1;
  return s;
}

function visibleOqs() {
  const kw = decisionState.keyword.trim().toLowerCase();
  const list = OQ_LIST.filter((q) => {
    if (decisionState.statusFilter !== "all" && oqStatus(q) !== decisionState.statusFilter) return false;
    if (decisionState.severityFilter !== "all" && (q.severity || "low") !== decisionState.severityFilter) return false;
    if (kw && !(`${q.id || ""}`.toLowerCase().includes(kw) || `${q.question || ""}`.toLowerCase().includes(kw) || `${q.requirement_id || ""}`.toLowerCase().includes(kw))) return false;
    return true;
  });
  return list.sort((a, b) => (SEV_RANK[b.severity || "low"] - SEV_RANK[a.severity || "low"]) || (a.id > b.id ? 1 : -1));
}

function decBadge(q) { return `<span class="badge dv-${oqStatus(q)}">${OQ_STATUS_LABEL[oqStatus(q)]}</span>`; }
function sevBadge(q) { return `<span class="badge sv-${q.severity || "low"}">${esc(q.severity || "low")}</span>`; }

function oqItemHtml(q) {
  return `<a class="dec-item${decisionState.selectedOqId === q.id ? " active" : ""}" data-oq="${esc(q.id)}">${esc(q.id)} ${esc(String(q.question || "").slice(0, 26))}…${sevBadge(q)}${decBadge(q)}<div style="color:#889;font-size:11px;margin-top:2px">${esc(q.requirement_id || "无关联")}</div></a>`;
}

function renderDecisionList() {
  $("#dec-list").innerHTML = visibleOqs().map(oqItemHtml).join("");
}

function renderDecisionWorkbench() {
  const s = decisionStats();
  let html = `<div class="dec-head"><h3>裁决工作台（${s.total} 项未决问题）</h3>
    <div><button class="btn-dec primary" id="dec-export">导出 decisions.json</button>
    <span id="dec-export-msg" style="color:#1a73e8;font-size:12px;margin-left:8px"></span></div></div>
    <div class="dec-stats"><b>全部 ${s.total}</b><b>待裁决 ${s.open}</b><b>草稿 ${s.draft}</b><b>已确认 ${s.approved}</b><b>已否决 ${s.rejected}</b><b>已挂起 ${s.deferred}</b></div>
    <div class="dec-filters">
      <label>状态 <select id="df-status-filter"><option value="all">全部</option>
        ${["open", "draft", "approved", "rejected", "deferred"].map((v) => `<option value="${v}"${decisionState.statusFilter === v ? " selected" : ""}>${OQ_STATUS_LABEL[v]}</option>`).join("")}
      </select></label>
      <label>严重度 <select id="df-severity-filter"><option value="all">全部</option>
        ${["high", "medium", "low"].map((v) => `<option value="${v}"${decisionState.severityFilter === v ? " selected" : ""}>${v}</option>`).join("")}
      </select></label>
      <input id="df-keyword" placeholder="搜索问题 ID、描述或关联需求 ID" value="${esc(decisionState.keyword)}" style="flex:1;min-width:160px">
    </div>
    <div class="dec-note">裁决在本页内存中完成（刷新丢失，正式裁决请及时导出）。导出后执行：node .claude/skills/interactive-game-prd/scripts/apply-decisions.mjs examples/mahjong/game-spec decisions.json --dry-run 预演，通过后去掉 --dry-run 落盘，再重跑 build-html 刷新本文件。AI 不代人工提交：点「正式裁决」与「导出」即人工确认动作。reviewer 固定为 human。</div>
    <div class="dec-layout">
      <div class="dec-list" id="dec-list"></div>
      <div class="dec-main" id="dec-main"><span style="color:#99a">点击左侧未决问题查看详情与裁决</span></div>
      <div class="dec-impact" id="dec-impact"></div>
    </div>`;
  $("#view").innerHTML = html;
  renderDecisionList();
  $("#dec-list").addEventListener("click", (e) => {
    const a = e.target.closest("[data-oq]");
    if (a) selectOq(a.dataset.oq);
  });
  // 筛选只重渲染列表（不动中栏表单，不清空已编辑草稿）
  $("#df-status-filter").addEventListener("change", (e) => { decisionState.statusFilter = e.target.value; renderDecisionList(); });
  $("#df-severity-filter").addEventListener("change", (e) => { decisionState.severityFilter = e.target.value; renderDecisionList(); });
  $("#df-keyword").addEventListener("input", (e) => { decisionState.keyword = e.target.value; renderDecisionList(); });
  $("#dec-export").addEventListener("click", exportDecisions);
  if (decisionState.selectedOqId) selectOq(decisionState.selectedOqId);
}

// 表单态：{ optionIds: [选项 id], inputs: {选项 id: 补充文本}, rationale: 理由 }
function emptyForm() { return { optionIds: [], inputs: {}, rationale: "" }; }

// 预填：切换暂存 > 内存裁决记录反推 > approval-state 旧草稿
function draftToForm(oid) {
  if (decisionState.stash[oid]) return decisionState.stash[oid];
  const mem = DECISIONS[oid];
  if (mem && mem.records.length) return formFromRecords(oid, mem.records);
  const d = DEC_DRAFTS[oid];
  if (d) {
    const f = emptyForm();
    const g = GENERIC_BY_OUTCOME[d.outcome];
    if (g) f.optionIds.push(g);
    f.rationale = d.rationale || "";
    return f;
  }
  return emptyForm();
}

// 从内存裁决记录反推表单态（按 outcome 匹配选项 action）
function formFromRecords(oid, records) {
  const q = OQ_LIST.find((x) => x.id === oid) || {};
  const cfg = decisionOptionsOf(q);
  const form = emptyForm();
  const used = new Set();
  for (const rec of records) {
    const o = cfg.options.find((x) => x.action === rec.outcome && !used.has(x.id));
    if (o) {
      used.add(o.id);
      form.optionIds.push(o.id);
      if (o.requires_input && rec.final_decision && rec.final_decision.text) form.inputs[o.id] = rec.final_decision.text;
    }
    form.rationale = rec.rationale || form.rationale;
  }
  return form;
}

// 切换问题前自动暂存表单（草稿不丢；已正式裁决的问题不覆盖）
function autoStashDraft() {
  const oid = decisionState.selectedOqId;
  if (!oid || !$("#dec-main .opt-card")) return;
  const mem = DECISIONS[oid];
  if (mem && mem.status !== "draft") return;
  const form = collectForm();
  if (!form.optionIds.length && !form.rationale.trim()) return;
  decisionState.stash[oid] = form;
}

function selectOq(oid) {
  autoStashDraft();
  const q = OQ_LIST.find((x) => x.id === oid);
  if (!q) return;
  decisionState.selectedOqId = oid;
  document.querySelectorAll("#dec-list .dec-item").forEach((a) => a.classList.toggle("active", a.dataset.oq === oid));
  const form = draftToForm(oid);
  const cfg = decisionOptionsOf(q);
  $("#dec-main").innerHTML = `<h3>${esc(q.id)}（severity：${esc(q.severity || "")}）</h3>
    <div class="quote">${esc(q.question || "")}</div>
    <div style="color:#889;font-size:12px">关联需求：${esc(q.requirement_id || "待补充关联")}${cfg.isCustom ? "" : "（该问题未配置专属候选方案，展示通用裁决选项，后续可人工补充）"}</div>
    <h4 style="margin:12px 0 4px">候选裁决方案（${cfg.mode === "multi" ? `多选：至少 ${cfg.min} 项${cfg.max && cfg.max < cfg.options.length ? "，至多 " + cfg.max + " 项" : ""}` : "单选"}）</h4>
    ${renderDecisionOptions(cfg, form)}
    <label style="display:block;margin:10px 0 4px;font-size:13px">裁决理由（正式裁决必填）</label>
    <textarea id="df-rationale" rows="3" style="width:100%;box-sizing:border-box;font-size:13px" placeholder="说明人工裁决的依据与口径">${esc(form.rationale)}</textarea>
    <div class="dec-actions">
      <button class="btn-dec" id="dec-prev">上一个</button>
      <button class="btn-dec" id="dec-next">下一个</button>
      <button class="btn-dec" id="dec-draft">暂存草稿</button>
      <button class="btn-dec primary" id="dec-confirm">正式裁决</button>
    </div>
    <div id="dec-msg" style="color:#c00;font-size:12px;margin-top:6px"></div>`;
  bindOptChange(q);
  $("#dec-prev").addEventListener("click", () => stepOq(-1));
  $("#dec-next").addEventListener("click", () => stepOq(1));
  $("#dec-draft").addEventListener("click", () => saveDecision(oid, "draft"));
  $("#dec-confirm").addEventListener("click", () => saveDecision(oid, null));
  renderDecisionImpact(q);
}

// 候选方案卡片（单选 radio / 多选 checkbox；requires_input 选项选中后展开补充输入区）
function renderDecisionOptions(cfg, form) {
  return `<div class="opt-grid">${cfg.options.map((o) => {
    const sel = form.optionIds.includes(o.id);
    return `<label class="opt-card${sel ? " selected" : ""}" data-opt="${esc(o.id)}">
      <input type="${cfg.mode === "multi" ? "checkbox" : "radio"}" name="dec-opt" value="${esc(o.id)}"${sel ? " checked" : ""}>
      <span class="opt-title">${esc(o.label || o.id)}</span>
      <span class="opt-desc">${esc(o.description || "")}</span>
      ${o.source ? `<span class="opt-src">依据：${esc(o.source)}</span>` : ""}
      ${sel && o.requires_input ? `<span class="opt-input"><textarea data-opt-input="${esc(o.id)}" rows="2" placeholder="${esc(o.input_label || "补充说明")}">${esc(form.inputs[o.id] || "")}</textarea></span>` : ""}
    </label>`;
  }).join("")}</div>`;
}

function bindOptChange(q) {
  const cfg = decisionOptionsOf(q);
  $("#dec-main").addEventListener("change", (e) => {
    const input = e.target.closest('input[type="radio"],input[type="checkbox"]');
    if (!input) return;
    const msg = $("#dec-msg");
    if (cfg.mode === "multi" && input.checked) {
      const checked = [...document.querySelectorAll("#dec-main .opt-card input:checked")];
      if (cfg.max && checked.length > cfg.max) {
        input.checked = false;
        if (msg) msg.textContent = `最多选择 ${cfg.max} 项`;
        return;
      }
    }
    const card = input.closest(".opt-card");
    card.classList.toggle("selected", input.checked);
    const o = cfg.options.find((x) => x.id === input.value);
    if (o && o.requires_input) {
      const wrap = card.querySelector(".opt-input");
      if (input.checked && !wrap) card.insertAdjacentHTML("beforeend", `<span class="opt-input"><textarea data-opt-input="${esc(o.id)}" rows="2" placeholder="${esc(o.input_label || "补充说明")}"></textarea></span>`);
      else if (!input.checked && wrap) wrap.remove();
    }
    if (msg) msg.textContent = "";
  });
}

function collectForm() {
  const optionIds = [...document.querySelectorAll("#dec-main .opt-card input:checked")].map((i) => i.value);
  const inputs = {};
  for (const t of document.querySelectorAll("#dec-main [data-opt-input]")) inputs[t.dataset.optInput] = t.value;
  const ta = document.querySelector("#dec-main #df-rationale");
  return { optionIds, inputs, rationale: ta ? ta.value : "" };
}

// 右栏：影响分析（只基于真实关联数据，无关联显示「待补充关联」）
function renderDecisionImpact(q) {
  const r = reqById.get(q.requirement_id);
  const hist = DEC_LOG.filter((d) => d.question_id === q.id);
  const prev = hist.length ? hist[hist.length - 1] : null;
  let html = `<h4 style="margin:0 0 6px">影响分析</h4>`;
  if (r) {
    html += `<div class="req-card" style="margin-bottom:8px"><h3 style="font-size:13px">${esc(r.id)} ${esc(r.name)} ${badges(r)}</h3>
      <div style="font-size:12px">${esc(r.description || "")}</div>
      <div style="color:#889;font-size:12px;margin-top:4px">关联 UI：${esc((r.ui_refs || []).join("、") || "无")}</div>
      <div style="color:#889;font-size:12px">关联测试：${esc((r.test_refs || []).join("、") || "无")}</div>
      <div style="color:#889;font-size:12px">依赖：${esc((r.dependencies || []).join("、") || "无")}</div></div>`;
  } else {
    html += `<div class="warn-open">待补充关联：本问题尚未建立 requirement_id 关联（或关联需求不存在），不得从问题描述猜测影响。</div>`;
  }
  if (q.images && q.images.length) html += `<div class="warn-open">附图依据：${esc(q.images.join("、"))} —— 需人工提供截图文本补充</div>`;
  if (prev) {
    html += `<h4 style="margin:10px 0 4px">历史裁决（${hist.length}）</h4>`;
    for (const d of hist) html += `<div style="font-size:12px;margin:4px 0;border-bottom:1px dashed #e3e6ea;padding-bottom:4px">${esc(d.decision_id)} ${esc(d.decision_status)} / ${esc(d.outcome)}${d.supersedes ? "（supersedes " + esc(d.supersedes) + "）" : ""}<div style="color:#889">${esc(String(d.rationale || "").slice(0, 60))}</div></div>`;
    html += `<div class="dec-note">本次裁决将自动写入 supersedes 指向 ${esc(prev.decision_id)}。</div>`;
  }
  $("#dec-impact").innerHTML = html;
}

// 底部操作栏：上一个 / 下一个（在当前筛选结果内移动；切换前自动暂存草稿）
function stepOq(dir) {
  const list = visibleOqs();
  if (!list.length) return;
  const idx = list.findIndex((q) => q.id === decisionState.selectedOqId);
  const next = list[Math.min(list.length - 1, Math.max(0, (idx < 0 ? 0 : idx) + dir))];
  if (next) selectOq(next.id);
}

// 正式裁决后：更新状态并自动定位下一个待裁决问题
function afterDecisionSaved(oid) {
  const next = visibleOqs().find((q) => oqStatus(q) === "open");
  decisionState.selectedOqId = next ? next.id : oid;
  renderDecisionWorkbench();
}

function saveDecision(oid, forceDraft) {
  const q = OQ_LIST.find((x) => x.id === oid);
  if (!q) return;
  const cfg = decisionOptionsOf(q);
  const form = collectForm();
  const msg = $("#dec-msg");
  const selOptions = form.optionIds.map((id) => cfg.options.find((x) => x.id === id)).filter(Boolean);
  if (!forceDraft) {
    if (form.optionIds.length < cfg.min || (cfg.max && form.optionIds.length > cfg.max)) {
      msg.textContent = `请选择方案（${cfg.mode === "multi" ? `至少 ${cfg.min} 项${cfg.max && cfg.max < cfg.options.length ? "，至多 " + cfg.max + " 项" : ""}` : "单选一项"}），当前已选 ${form.optionIds.length} 项`;
      return;
    }
    // apply-decisions 契约为一问一裁：多选组合需同结论（同 action），合并为一条记录；混合结论拦截
    if (selOptions.length > 1 && new Set(selOptions.map((o) => o.action || "adopted")).size > 1) {
      msg.textContent = "组合裁决需同结论（如均为采纳）；不同结论请分开裁决";
      return;
    }
    for (const o of selOptions) {
      if (o && o.requires_input && !(form.inputs[o.id] || "").trim()) {
        msg.textContent = `方案「${o.label || o.id}」需填写${o.input_label || "补充说明"}`;
        return;
      }
    }
    if (!form.rationale.trim()) { msg.textContent = "正式裁决必须填写理由"; return; }
  }
  const prevMem = DECISIONS[oid];
  const prevRecs = prevMem && prevMem.status !== "draft" ? prevMem.records : [];
  const hist = decPrevInLog(oid);
  // 按 action 分组，每组一条记录（单选即一组单项；多选同结论合并）
  const groups = [];
  for (const o of selOptions) {
    const g = groups.find((x) => x.action === (o.action || "adopted"));
    if (g) g.options.push(o); else groups.push({ action: o.action || "adopted", options: [o] });
  }
  const records = groups.map((g, i) => {
    const reuse = prevRecs[i];
    // 记录保持 apply-decisions 旧契约格式：final_decision 为 object；
    // selected_option_ids / selection_mode 仅作界面辅助信息存 stash，不进导出（不得擅改 apply-decisions 契约）
    const parts = g.options.map((o) => (o.requires_input && (form.inputs[o.id] || "").trim()) ? `${o.label || o.id}：${form.inputs[o.id].trim()}` : (o.label || o.id));
    const needsFd = g.options.length > 1 || g.options.some((o) => o.requires_input);
    const fdText = g.options.length === 1 ? (form.inputs[g.options[0].id] || "").trim() : parts.join("；");
    const rec = {
      decision_id: reuse ? reuse.decision_id : "DEC-" + String(++decSeq).padStart(3, "0"),
      question_id: oid,
      decision_status: ACTION_STATUS[g.action] || "approved",
      outcome: g.action,
      final_decision: needsFd ? { text: fdText } : null,
      rationale: form.rationale.trim(),
      reviewer: "human",
      decided_at: new Date().toISOString(),
      requirement_updates: [],
      affected: {
        requirements: [q.requirement_id].filter(Boolean),
        tests: ((reqById.get(q.requirement_id) || {}).test_refs) || [],
        ui: ((reqById.get(q.requirement_id) || {}).ui_refs) || [],
        simulator: /^GAME-RULE/.test(q.requirement_id || ""),
      },
    };
    const sup = reuse ? reuse.decision_id : (hist ? hist.decision_id : null);
    if (sup && !forceDraft) rec.supersedes = sup;
    if (forceDraft) delete rec.decided_at;
    return rec;
  });
  DECISIONS[oid] = { status: forceDraft ? "draft" : (records[0] ? records[0].decision_status : "draft"), records };
  // 界面辅助态：选项与输入存 stash 供表单恢复（不进导出记录）
  decisionState.stash[oid] = { optionIds: [...form.optionIds], inputs: { ...form.inputs }, rationale: form.rationale };
  if (forceDraft) { msg.textContent = "已暂存草稿（仅存本页内存，刷新丢失）"; renderDecisionList(); }
  else afterDecisionSaved(oid);
}

function exportDecisions() {
  const list = Object.values(DECISIONS).filter((d) => d.status !== "draft").flatMap((d) => d.records);
  const msg = $("#dec-export-msg");
  if (!list.length) { msg.textContent = "尚无正式裁决（草稿不导出），先在中间栏完成正式裁决"; return; }
  const blob = new Blob([JSON.stringify(list, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "decisions.json";
  a.click();
  URL.revokeObjectURL(a.href);
  msg.textContent = `已导出 ${list.length} 条正式裁决到 decisions.json（浏览器下载目录）`;
}
window.__exportDecisionsData = () => JSON.parse(JSON.stringify(Object.values(DECISIONS).filter((d) => d.status !== "draft").flatMap((d) => d.records)));

// ---------- 判定日志 ----------
function appendLog(msg) {
  const body = $("#log-body");
  const div = document.createElement("div");
  div.textContent = msg;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

// ---------- 初始化 ----------
document.getElementById("game-title").textContent = (APP_DATA.manifest && APP_DATA.manifest.game_name) || "未命名游戏";
document.getElementById("game-meta").textContent =
  `IR v${(APP_DATA.manifest && APP_DATA.manifest.ir_version) || "?"} · 需求 ${APP_DATA.requirements.length + APP_DATA.configs.length + APP_DATA.states.length} 条 · UI 页面 ${APP_DATA.ui.pages.length} · 用例 ${APP_DATA.tests.cases.length} · 生成于构建时`;
document.getElementById("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b) switchTab(b.dataset.tab);
});
// 规格工作台内容区点击委托（一次绑定，避免重复挂监听）：需求卡片详情 / 配置行 / 页面与组件详情 / 关联需求跳转 / 跳 Flow / 跳 UI 定位
$("#view").addEventListener("click", (e) => {
  const goto = e.target.closest("[data-goto-ui]");
  if (goto) { switchTab("ui", () => focusByRequirement(goto.dataset.gotoUi)); return; }
  const flow = e.target.closest("[data-goto-flow]");
  if (flow) { switchTab("flow"); return; }
  const link = e.target.closest("[data-req-link]");
  if (link) { showRequirement(link.dataset.reqLink); return; }
  const comp = e.target.closest("[data-comp]");
  if (comp) { showCompDetail(comp.dataset.comp); return; }
  const page = e.target.closest("[data-page]");
  if (page) { showPageDetail(page.dataset.page); return; }
  const row = e.target.closest("tr[data-req-row]");
  if (row) { const r = reqById.get(row.dataset.reqRow); if (r) { specState.selectedId = r.id; showDetail(r); } return; }
  const card = e.target.closest(".req-card[data-anchor]");
  if (card && card.dataset.anchor.startsWith("GAME-")) showDetail(reqById.get(card.dataset.anchor));
});
// 右侧详情区关联需求链接跳转（组件详情中的关联需求）
$("#detail").addEventListener("click", (e) => {
  const link = e.target.closest("[data-req-link]");
  if (link) showRequirement(link.dataset.reqLink);
});
renderNav();
switchTab("spec");
if (location.hash.startsWith("#req=")) showRequirement(decodeURIComponent(location.hash.slice(5)));
</script>
