const APP_DATA = {"manifest":{"format":"GAME-SPEC/1","ir_version":"1.0.0","game_name":"卡五星（好友房）","game_version":"1.0","created_at":"2026-11-09","updated_at":"2026-11-09","source_files":[{"file":"source/01-基础规则.md","received_at":"2026-11-09"},{"file":"source/02-游戏流程.md","received_at":"2026-11-09"},{"file":"source/03-打牌操作.md","received_at":"2026-11-09"},{"file":"source/04-番型.md","received_at":"2026-11-09"},{"file":"source/05-胡牌类型.md","received_at":"2026-11-09"},{"file":"source/06-结算.md","received_at":"2026-11-09"},{"file":"source/07-配置.md","received_at":"2026-11-09"},{"file":"source/08-UI交互.md","received_at":"2026-11-09"}],"entry_points":["GAME-UI-001"],"stats":{"requirements":131,"ui_pages":5,"test_cases":10}},"game":{"overview":{"name":"卡五星好友房","genre":"棋牌-麻将-卡五星（好友房）","summary":"2~3 人好友房卡五星麻将对局：84 张牌（筒 36、条 36、中发白 12），不能吃牌，以亮倒、扣牌、危牌与直杠 / 明杠 / 暗杠、杠上杠、补牌、抢杠胡构成行牌核心，辅以漂、买马、数坎三项加分与上楼加倍，按小局循环（打漂、定庄、发牌、行牌、胡牌或荒庄、结算、续局轮庄）直至大结算。"},"core-loop":{"loop":["开局准备：房主创房、玩家逆时针入座（座位固定，2 人一上一下 / 3 人左·下·右）","打漂：按漂模式选漂（不漂跳过、固定漂直接展示、首局定漂仅大局第一小局、自由漂每小局）","定庄摇骰：随机庄或房主庄（续局按轮庄规则），骰子停转定方位（庄为东逆时针），判定并展示上楼","发牌理牌：从庄家位逆时针发牌，庄 14 闲 13，发牌后余量 3 人 44 / 2 人 57，自动理牌立起","行牌：逆时针摸打循环，响应优先级吃胡 / 自摸 / 抢杠胡 > 碰 / 杠，含亮倒扣牌、危牌限制、杠后补牌与杠上杠","结束判定：有玩家胡牌（自摸 / 点炮 / 抢杠胡等）或可摸牌数 = 0 荒庄","和牌后：触发买马则翻剩余牌计马分（荒庄不买马；荒庄走查叫与亮倒荒庄赔付）","小结算：汇总胡分、杠分（实时已结）、漂分、马分、坎分等分项","续局：按轮庄规则（胡者坐庄 / 一炮多响点炮者坐庄 / 荒庄连庄）进入下一小局，最后一小局进入大结算"]},"glossary":{"terms":[{"term":"卡五星","definition":"本玩法正式名（基准变体）；也是基础番型，指 4-6 卡 5 的坎张听 5 听牌形态。"},{"term":"亮倒","definition":"听牌后明牌、不可换牌、只能摸打；输赢均计番型分 ×2，不影响加分项；胡的牌成为其他未亮倒玩家的危牌。"},{"term":"扣牌","definition":"亮倒的同时判断，把去掉后仍满足「打出一张非危牌后可听牌」的刻子扣下（四张相同扣 3 张），他人不可见；亮倒后不可再扣。"},{"term":"危牌","definition":"同一小局中未亮倒玩家手中为任一亮倒玩家胡牌的牌；未亮倒玩家不可打出、不可明杠（补杠），手中全是危牌时可打出。"},{"term":"漂","definition":"开局前选定的额外底分倍数；收分 =（胡牌玩家漂数 + 该玩家漂数）× 底分，逐人计算。"},{"term":"打漂","definition":"漂的选择环节，含不漂 / 固定漂 / 首局定漂 / 自由漂四种模式（固定漂下拉默认 2）。"},{"term":"买马","definition":"胡牌后翻剩余牌、按牌面或命中集计分的附加计分步骤；自摸收所有玩家；荒庄不买马。"},{"term":"马数","definition":"买马的翻牌张数与计分方式（买一 / 买一送一 / 买 5 马 / 买 6 马）。"},{"term":"数坎","definition":"胡牌后按刻子与杠子数量加分：暗刻 +1、明杠直杠 +1、暗杠 +2、手中四张 +2（倍底分），查叫时也算坎分。"},{"term":"明杠","definition":"本玩法即通用「补杠 / 加杠」：碰牌后摸到第 4 张开杠，其他玩家各付 1 倍底分，可被抢杠胡。"},{"term":"直杠","definition":"手中已有 3 张、他人打出第 4 张时开杠；打出牌的玩家支付 2 倍底分，不可被抢。"},{"term":"暗杠","definition":"非碰牌后的出牌阶段手中 4 张相同自行开杠，其余玩家各付 2 倍底分；暗杠的牌其余玩家可见（三张反面 + 顶部牌面）。"},{"term":"补","definition":"杠后从牌堆倒序摸一张，视为摸牌，牌堆剩余张数额外减 1；补牌置于手牌最右侧。"},{"term":"杠上杠","definition":"连杠，杠分按 2^(连杠次数−1) 翻倍，可跨玩家；补牌后打出无人杠则重置。"},{"term":"回手杠","definition":"碰后本小局不可再明杠该牌；已碰的牌摸到第 4 张必须立刻杠，否则本小局不能再明杠。"},{"term":"抢杠胡","definition":"他人明杠（补杠）的牌恰为自己胡牌时抢胡，×2（可勾选 ×4）；明杠玩家视为未杠成功、杠上杠中断；属点炮类。"},{"term":"漏胡","definition":"可胡而不胡（过胡）；漏胡玩家摸牌前不可胡牌，摸牌（含杠后补牌）后解除。"},{"term":"过碰","definition":"过碰后、轮到自己回合前，其他玩家再打出同张牌时不可再碰（按过手至摸牌解除口径推导）。"},{"term":"荒庄","definition":"牌堆摸完（可摸牌数 = 0）仍无人胡牌的流局；杠分不退还、不买马。"},{"term":"查叫","definition":"荒庄后未听牌玩家向听牌玩家赔付（需勾选开启）；查叫时算坎分但不计胡的那张牌。"},{"term":"首亮赔付","definition":"亮倒荒庄赔付：荒庄后首个亮倒玩家赔其他所有玩家 1 倍底分（卡五星专属）。"},{"term":"封顶","definition":"本玩法仅封「番型 × 加倍项」，漂 / 马 / 坎等加分项无上限。"},{"term":"上楼","definition":"加倍项：上一小局荒庄或一炮多响、或开局骰子两点一致，本小局倍数 ×2，可叠加至 ×4；不可突破封顶。"},{"term":"对亮","definition":"胡牌双方均亮倒；默认仅计一次亮倒 ×2，勾选「对亮 ×2」后计两个亮倒（共 4 倍）。"},{"term":"双亮","definition":"仅 3 人可勾选；已有 2 个玩家亮倒时第三人无需亮倒也能胡牌；与「胡牌必须亮倒」互斥。"},{"term":"一炮多响","definition":"一张牌致多家胡牌，各家分别计分；计入一次点炮，点炮玩家坐庄并触发上楼。"},{"term":"手抓一","definition":"其余牌全在碰杠区、手牌只剩单吊的牌型（单钓 / 金钩钓）。"},{"term":"底分","definition":"结算的最小乘算单位，所有倍数表述为「N 倍底分」。"}]}},"requirements":[{"id":"GAME-FR-001","type":"game_feature","name":"危牌放炮浮动提示","status":"proposed","authority":"fixed","description":"打出危牌时出现浮动提示「打出该牌将会放炮！」并阻断出牌","source":{"kind":"original","document":"source/03-打牌操作.md","section":"2.1 条件与限制","page":null,"quote":"打出危牌时，出现浮动提示「打出该牌将会放炮！」。"},"preconditions":["玩家尝试打出危牌"],"inputs":["对危牌的出牌操作"],"outputs":["浮动提示「打出该牌将会放炮！」，出牌被阻断"],"business_rules":["提示出现并阻断出牌","亮倒-打牌界面中点击亮起的危牌时同样出现该提示并阻断出牌（源 §10.4 交互表）"],"normal_flow":[],"exception_flow":["尝试打危牌 -> 浮动提示 -> 阻断出牌"],"state_transitions":[],"ui_refs":["GAME-COMP-001"] 03-打牌操作.md","section":"7.4 一炮多响的特殊展示","page":null,"quote":"一炮多响动画 → 光柱画面 → 所有玩家所胡番型 + 飘分（正分黄色，负分灰色）"},"preconditions":["一张打出牌导致多个玩家胡牌（一炮多响）"],"inputs":["各家胡牌番型与计分结果"],"outputs":["按视角区分的一炮多响展示序列"],"business_rules":["放炮玩家/围观视角：一炮多响动画 -> 光柱画面 -> 所有玩家所胡番型 + 飘分（正分黄色，负分灰色）","胡牌玩家视角：一炮多响动画 -> 光柱画面 -> 自己所胡番型 + 飘分"],"normal_flow":["一炮多响成立 -> 动画 -> 光柱画面 -> 番型与飘分展示"],"exception_flow":[],"state_transitions":[],"ui_refs":["GAME-COMP-001","GAME-COMP-007"],"test_refs":[],"dependencies":["GAME-RULE-047"],"open_questions":[]},{"id":"GAME-FR-007","type":"game_feature","name":"亮倒打牌界面","status":"proposed","authority":"fixed","description":"亮倒后专用打牌界面：扣牌带扣标签遮罩不可打出，可听牌亮起带听牌标签其余遮罩，提示请选择胡口，取消等同过","source":{"kind":"original","document":"source/03-打牌操作.md","section":"10.4 亮倒的界面流程","page":null,"quote":"手牌中打出后可听的牌会亮起，并带听牌提示标签；其余牌全部带遮罩。"},"preconditions":["玩家已确认亮倒并完成扣牌判断"],"inputs":["对界面内各牌的点击操作"],"outputs":["正常执行提牌出牌、放炮提示阻断或无效果"],"business_rules":["进入流程：点击【亮】后所有碰杠胡交互按钮消失（听牌提示箭头不消失），无可扣刻子时直接进入本界面","扣住的牌带【扣】标签且带遮罩，不可打出","手牌中打出后可听的牌亮起并带听牌提示标签，其余牌全部带遮罩","危牌不会被排除在「亮起」之外、不加遮罩（显示层口径：危牌正常带【危】标签、正常计算）；点击时仍按危牌规则阻断出牌（交互层）","扣下的牌不带听牌提示标签；危牌被扣下时标签切换为【扣】","出现提示「请选择胡口」；右上角出现取消按钮","交互：点击取消等同于【过】，回到正常出牌界面（【扣】标签消失、遮罩消失、正常展示所有听牌提示、可正常提牌出牌）；点击亮起的非危牌按玩家设置正常执行提牌出牌；点击亮起的危牌出现提示并阻断出牌；点击有遮罩的牌无效果"],"normal_flow":["进入界面 -> 亮起可听牌并提示选择胡口 -> 点击亮起非危牌 -> 正常提牌出牌","亮倒确认 -> 亮倒打牌界面","亮倒打牌界面 -> 取消 -> 正常出牌界面"],"exception_flow":["点击亮起危牌 -> 提示「打出该牌将会放炮！」并阻断","点击取消 -> 等同【过】，回正常出牌界面"],"state_transitions":[],"ui_refs":["GAME-COMP-006","GAME-COMP-005","GAME-COMP-016"],"test_refs":[],"dependencies":["GAME-RULE-034","GAME-RULE-054","GAME-RULE-056","GAME-FR-001"],"open_questions":[]},{"id":"GAME-FR-008","type":"game_feature","name":"扣牌界面","status":"proposed","authority":"fixed","description":"半透明遮罩加请选择扣牌标题，候选单张带选中圆圈，取消与选择完成按钮及对应交互反馈","source":{"kind":"original","document":"source/03-打牌操作.md","section":"11.2 扣牌界面","page":null,"quote":"手中所有可以扣的牌，以单张形式展示在标题下方；顺序与手牌中左到右顺序一致；每张牌右下角有选中圆圈"},"preconditions":["亮倒触发的扣牌判断存在可扣的刻子"],"inputs":["候选牌点击、【取消】、【选择完成】"],"outputs":["扣牌选择结果，切换到扣后展示或回退"],"business_rules":["遮罩：自己手牌上方展示半透明遮罩；标题为【请选择扣牌】","候选区：手中所有可以扣的牌以单张形式展示在标题下方，顺序与手牌中左到右顺序一致，每张牌右下角有选中圆圈","手牌区：可扣的牌不变，其余牌全部带遮罩","按钮：遮罩下方展示【取消】【选择完成】两个按钮","点击候选牌：在选中/取消选中之间切换；选中时右下角圆圈出现绿色对号，同时手牌中对应三张牌出现【扣】标签；取消选中时两者同步消失","点击【取消】：扣牌界面消失，且桌面交互按钮不会再出现（等同于【过】）","点击【选择完成】：判断扣下所有选中刻子后剩余牌是否可打出一张牌后听牌；不可以则取消所有选中并弹出提示「当前扣牌没有胡口！」；可以听牌则界面消失，切换到「亮倒-打牌」界面","扣牌后展示：自己视角非「部分亮」时扣牌标签从【暗】改为【扣】（部分亮时按【暗】展示）；他人视角扣住的牌背面朝上；此时各玩家摸得的牌位置不变且仍为立着"],"normal_flow":["扣牌判断有候选 -> 打开扣牌界面 -> 选择候选 -> 选择完成 -> 切换到「亮倒-打牌」界面","亮倒 -> 扣牌界面 -> 亮倒打牌界面","扣牌界面 -> 取消 -> 正常出牌界面"],"exception_flow":["选择完成后不满足听牌 -> 取消所有选中，提示「当前扣牌没有胡口！」","点击【取消】 -> 界面消失且桌面交互按钮不再出现（等同【过】）"],"state_transitions":[],"ui_refs":["GAME-COMP-016","GAME-COMP-011"],"test_refs":[],"dependencies":["GAME-RULE-057","GAME-RULE-058","GAME-RULE-052"],"open_questions":[]},{"id":"GAME-FR-009","type":"game_feature","name":"对局桌面布局与开局定庄展示","status":"proposed","authority":"fixed","description":"桌面座位规则、无牌墙、开局动画、定庄标志、方位信息区（骰子、方位、倒计时、上楼）、玩家头像信息与发牌理牌展示","source":{"kind":"original","document":"source/08-UI交互.md","section":"二、对局前 · 桌面布局 / 三、开局 · 定庄 · 方位信息 / 四、玩家头像信息 / 五、发牌与手牌区域","page":null,"quote":"房主创建房间后，后续加入房间的玩家按逆时针顺序入座，开局后与房主的逆时针顺序关系相同；座位固定"},"preconditions":["玩家进入对局桌面（创房后加入或加入房间）"],"inputs":["开局流程触发（摇骰、发牌、定庄）","玩家点击自己或他人头像"],"outputs":["桌面座位、方位信息区、玩家头像信息、手牌区的显示与动画"],"business_rules":["所有卡五星无牌墙，设置中也没有牌墙开关；整体布局复用杭麻好友房","2人固定一上一下（下方自己、上方对家），方位东/南；3人固定左、下、右（下方自己、左侧上家、右侧下家），方位东/南/西","开局动画仅每次开房首局播放：玩家信息由小到大出现、上移离屏、屏外进入、中间显示对局开始、快速减淡消失后进入摇骰发牌；之后开局直接进入摇骰发牌","定庄：发牌开始后、骰子滚动停下时，庄家头像上直接出现【庄】标志，无过程动画","方位：确认庄家并开始摸牌时显示（庄为东，其他玩家按逆时针依次显示南西），之后不再变化；轮到出牌对应方位闪烁高亮，他人碰杠胡不改变高亮；对局结束无方位高亮","倒计时最多两位数，默认蓝色，03/02/01/00 为黄色；自己视角有碰杠胡操作时倒计时重置，他人视角无变化","骰子发牌时显示，两骰环绕转动，用户拿到所有手牌后停止并展现数字，停留1秒后消失；上楼符合时骰子停止同时在其上方展示上楼X2或上楼X4","头像信息：庄标右上方、房主标记、积分（5位数以个为单位、6位数以万为单位，可为负）、昵称常显最多10字符（超出第7~8字符显示..）、操作流光、离线断线图标与00:00计时（每次断线重新计时）、托管图标（自动摸打的托管不显示）、漂标记【漂0】至【漂10】","发牌从庄家位逆时针，每人4张/次共3轮，再每人1张，最后庄家1张；发牌总时长1秒；己方牌扣桌面0.1秒后向上翻开0.1秒，他人牌仅出现后立起无翻开动画","手牌从左至右筒、条、中、发、白，1~9；庄家14张末牌最右侧保持距离置摸牌位，闲家13张；发牌完毕自动理牌0.5秒；出牌后插入式0.5秒或平移式0.3秒理牌","点击自己或他人头像弹出局内个人信息（他人可用互动道具）"],"normal_flow":["进入桌面 -> 首局播放开局动画 -> 摇骰发牌 -> 定庄标志 -> 自动理牌 -> 显示方位开始行牌","loading -> opening -> dealing -> piao_picking -> playing（对局桌面状态迁移）"],"exception_flow":[],"state_transitions":[],"ui_refs":["GAME-UI-001"],"test_refs":[],"dependencies":["GAME-RULE-003","GAME-RULE-005"],"open_questions":[]},{"id":"GAME-FR-010","type":"game_feature","name":"行牌操作交互","status":"proposed","authority":"fixed","description":"摸补提出牌、出牌方式（双击默认开启，单击与滑动默认关闭且双击与单击互斥）、碰杠胡过按钮组与优先级、动画摆放、番型播放优先级与飘分","source":{"kind":"original","document":"source/08-UI交互.md","section":"九、行牌操作","page":null,"quote":"玩家手牌右上方增加按钮，根据不同情况展示多个按钮，从左至右优先级显示顺序为：【碰】→【杠】→【亮】→【胡】/【自摸】→【过】"},"preconditions":["玩家处于行牌阶段（摸牌、出牌或存在碰杠胡机会）"],"inputs":["单击牌面提牌、点击非牌面空白处放牌","双击/单击/滑动出牌操作","点击碰、杠、亮、胡、自摸、过按钮"],"outputs":["牌提起与打出、牌河落牌、碰杠胡动画与摆放、飘分"],"business_rules":["摸牌与补牌从手牌最右侧从上往下缓冲落下（1帧效果），与一般手牌间隔1/4牌距离；摸牌在上家打出牌的同时进行","提牌：单击牌面对应牌提起约四分之一牌高，每次只能提起1张；点击非牌面空白处放下，点击该牌牌面不能放下；滑动选择最终手指离开的对应牌提起","出牌方式：双击出牌默认开启（点击已提起的牌打出）；单击出牌默认关闭（点击不可听牌的牌直接打出，开启时轮到自己出牌前有牌提起自动下落）；滑动出牌默认关闭（向上滑动超过提起高度显示透明牌随手指移动，松手打出，移回水平线撤回）；双击与单击互斥，滑动不互斥；互斥时以设置表为准（单击出牌、滑动出牌默认关闭，双击为默认出牌方式）","打出的牌可见移动过程（2帧）；出牌时头像处流光1秒、方位闪烁提醒1秒；其他家出牌放大展示（默认开，下一个玩家有操作后消失），关闭时直接放置且移动约0.5秒；其他家打出的牌始终是摸到的那张牌","碰：显示【碰】+【过】，可碰牌高亮其他暗置（有胡不暗置），动画1秒，刻子放于手牌左侧并显示方位箭头（对家上、上家左、下家右）；超时托管默认【过】","杠：直杠【碰】+【杠】+【过】，补杠/暗杠【杠】+【过】；中央动画1秒后飘分；补杠上方显示【补】，暗杠下三张牌背上一张牌面；杠牌动画播放同时摸牌（补牌）；补杠遇抢杠胡询问时不播动画与飘分，直到抢杠胡玩家完成选择","胡：自摸显示【自摸】+【过】（左侧显示胡的牌与倍数，封顶显示【封顶】且仅显示封顶倍数，超时默认胡）；点炮显示【胡】+【过】；动画流程光柱、番型动画1.5秒、飘分（正分黄色负分灰色），自摸环节不可直接出牌；一炮多响动画1秒，放炮玩家看所有玩家所胡番型，胡牌玩家只看自己所胡番型","多操作状态从左至右优先级为【碰】→【杠】→【亮】→【胡】/【自摸】→【过】；可多杠时显示可杠牌选择框且可直接点击出牌；有自摸按钮时不可直接出牌；托管超时有胡默认胡、可杠默认不杠","番型播放：在手牌前播放，多种番型优先播放特殊番型（海底捞月、杠上开花、杠上炮、抢杠胡）单次最多一个；多个特殊番型优先杠相关；无特殊番型时播倍数最大的普通番型，倍数相同按番型ID顺序","飘分：5位数以个为单位、6位数以万为单位，正分黄色负分灰色；杠类分数立刻结算，胡牌时总得分一起结算"],"normal_flow":["摸牌 -> 提牌 -> 出牌 -> 下家摸牌；存在碰杠胡机会时按钮组出现 -> 玩家点击或超时托管 -> 动画与摆放 -> 飘分"],"exception_flow":["补杠遇抢杠胡询问 -> 不播动画与飘分 -> 等待抢杠胡玩家选择后按杠和胡流程","漏胡不胡 -> 浮动提示当前未过手无法胡牌1.5秒"],"state_transitions":[],"ui_refs":["GAME-UI-001"],"test_refs":[],"dependencies":["GAME-RULE-010","GAME-RULE-011","GAME-RULE-018","GAME-RULE-019"],"open_questions":[]},{"id":"GAME-FR-011","type":"game_feature","name":"打漂选漂交互","status":"proposed","authority":"fixed","description":"不漂、固定漂、首局定漂、自由漂四种模式的选漂 UI 表现与选漂动画衔接","source":{"kind":"original","document":"source/08-UI交互.md","section":"八、打漂","page":null,"quote":"每个玩家屏幕出现各个漂的选项（选漂 UI 瞬间出现）；主视角下其他玩家头像旁出现【选漂中...】文字"},"preconditions":["创房面板开启打漂相关配置（固定漂/首局定漂/自由漂）"],"inputs":["玩家点击漂选项（不漂/漂1/漂2/漂5/漂10）"],"outputs":["选漂 UI、选漂中提示、头像旁漂结果、漂 UI 飞行动画"],"business_rules":["不漂：无打漂环节、不计漂分","固定漂：开局的同时玩家头像旁直接出现选漂结果，无过程动画，并同时开始打骰子","首局定漂：仅每个大局的第一小局执行选漂环节，后续小局流程同固定漂","自由漂（每局选漂）：每个小局执行选漂环节","选漂触发时机为小局开局后，选漂 UI 瞬间出现；主视角下其他玩家头像旁出现【选漂中...】文字直到该玩家完成；选漂后头像旁出现选漂结果且其他玩家直接可见","最后一个玩家选漂完成的同时：选漂结果出现，所有玩家选漂文字缩小移动到头像旁漂 UI 位置（漂 UI 飞行1秒），开始打骰子","打漂结束后开始打骰子 + 发牌 + 定庄环节"],"normal_flow":["小局开局 -> 选漂 UI 出现 -> 全部玩家完成选漂 -> 漂 UI 飞行至头像旁 -> 开始打骰子发牌定庄"],"exception_flow":[],"state_transitions":[],"ui_refs":["GAME-UI-001"],"test_refs":[],"dependencies":["GAME-RULE-015"],"open_questions":[]},{"id":"GAME-FR-012","type":"game_feature","name":"亮倒扣牌界面","status":"proposed","authority":"fixed","description":"亮倒入口、扣牌界面（请选择扣牌）、亮倒-打牌界面（请选择胡口）、亮倒扣牌布局、标签体系（危/扣/暗）与胡牌后手牌复位","source":{"kind":"original","document":"source/08-UI交互.md","section":"十、亮倒 · 扣牌","page":null,"quote":"本家点击【亮】之后：所有碰杠胡交互按钮消失；听牌提示箭头不会消失；首先进行扣牌判断——无则进入「亮倒-打牌」界面，有则打开扣牌界面"},"preconditions":["摸牌或补牌后满足亮倒条件（少于12张不亮配置生效时牌堆牌小于12张不再出现【亮】按钮）"],"inputs":["点击【亮】或【过】","扣牌界面点击候选牌、取消、选择完成","亮倒界面点击亮起的牌（含危牌）、遮罩牌、取消按钮"],"outputs":["扣牌弹窗、亮倒-打牌界面、标签（扣/危/暗）与遮罩展示、亮倒文字动画"],"business_rules":["入口：摸牌或补牌后满足亮倒条件出现【亮】+【过】，亮倒同时听牌标签正常展示","点击【亮】后所有碰杠胡交互按钮消失、听牌提示箭头不消失、首先进行扣牌判断：无可扣刻子直接进入亮倒-打牌界面，有则打开扣牌界面","扣牌界面：自己手牌上方半透明遮罩，标题【请选择扣牌】，手中所有可扣的牌以单张展示（顺序与手牌左到右一致，右下角选中圆圈）；点击候选牌右下角出现绿色对号且手牌对应三张牌出现【扣】标签，再次点击取消；点击【取消】扣牌 UI 消失且桌面交互按钮不再出现（等同【过】）；点击【选择完成】判断剩余牌能否打出一张后听牌，不可以则取消所有选中并提示「当前扣牌没有胡口！」，可以则 UI 消失切换到亮倒-打牌界面","亮倒-打牌界面：打出后可听的牌亮起并带听牌提示标签，其余牌全部带遮罩（危牌不排除在外不加遮罩，扣下的牌不带该标签，危牌被扣下标签切换为【扣】）；提示「请选择胡口」；右上角取消按钮等同【过】，回到正常出牌界面；点击非危牌按玩家设置正常提出牌，点击危牌出现 toast「打出该牌将会放炮！」并阻断出牌，点击遮罩牌无效果","亮倒布局：自己手牌全部推到左侧碰杠牌区靠右正上方摆所有听牌（不占牌张仅展示，可胡牌为0也展示）；部分亮时未亮牌带黑色蒙版与【暗】标签，暗牌在左非暗牌在右；他人牌推倒视角与胡牌推倒一致，部分亮时未亮牌背面朝上且在左侧","扣牌布局：非部分亮按暗牌规则展示标签为【扣】，部分亮按【暗】展示；他人扣住的牌按部分亮暗牌展示；摸牌位置不变且立着","亮倒动画：出牌的同时手牌取消遮罩，出牌动画0.5秒后播放【亮倒】文字（时长1秒），下家摸牌；左侧可胡牌外圈光圈静图","标签体系：【危】未亮倒玩家手中任一亮倒玩家胡的牌、【扣】亮倒扣下的刻子（带遮罩）、【暗】部分亮未亮的牌（带蒙版），均在牌左上角","胡牌后全部手牌按手牌顺序重新摆放，随后全部推到，去掉所有标签和蒙版"],"normal_flow":["满足亮倒条件出现【亮】 -> 点击【亮】 -> 扣牌判断 -> 扣牌或直接进入亮倒-打牌界面 -> 选择胡口出牌 -> 亮倒文字动画"],"exception_flow":["扣牌选择完成但无胡口 -> 取消所有选中并提示当前扣牌没有胡口","亮倒界面点击危牌 -> toast打出该牌将会放炮并阻断出牌","点击取消（扣牌或亮倒界面）-> 等同【过】回到正常出牌界面"],"state_transitions":[],"ui_refs":["GAME-UI-001"],"test_refs":[],"dependencies":["GAME-RULE-012","GAME-RULE-014"],"open_questions":[]},{"id":"GAME-FR-013","type":"game_feature","name":"听牌提示","status":"proposed","authority":"fixed","description":"可听牌与已听牌状态提示、听牌标签体系（优/大/多/箭头）、胡牌信息框内容排序与封顶展示、自动摸打勾选","source":{"kind":"original","document":"source/08-UI交互.md","section":"十一、听牌提示","page":null,"quote":"向听数为 1 时，打出可听牌的牌上方展示听牌提示标签；提起提示牌时，该牌上方出现听牌提示弹窗"},"preconditions":["玩家手牌向听数为1（可听牌状态）或已听牌"],"inputs":["提起提示牌、点击其他提示牌、点击空白处或非提示牌或【听】按钮","点击【自动摸打】勾选按钮"],"outputs":["听牌提示标签、听牌提示弹窗（胡牌信息框）、听牌与自动摸打按钮"],"business_rules":["可听牌状态：打出可听牌的牌上方展示听牌提示标签；提起提示牌时上方出现听牌提示弹窗；点击其他提示牌切换提示内容；点击空白处或非提示牌或【听】按钮关闭弹窗；新摸牌或出牌时关闭弹窗","已听牌状态：手牌上方显示【听牌】及【自动摸打】或2倍起胡番数不足按钮，层级不挡牌","标签优先级：优 > 大 > 多 > 箭头，同一牌点同时满足仅显示最高优先级；标签根据可胡牌张数和倍数实时变化（张数最少0张、倍数最少1倍）","箭头：打出成听只有1张仅显示箭头，多个牌点张数倍数都相同都显示箭头；多：胡牌张数最多且至少比最少多2张及以上（同牌点多张最右侧显示）；大：胡牌倍数最大的牌点（同牌点多张最右侧显示）；优：既符合大又符合多的牌点显示","胡牌信息框：距手牌高度固定，张数越多宽高越大，超3排支持上下滑动；内容含可胡张数与可胡牌信息（牌面、倍数、张数）；一排最多4个，按倍数大小排序，同倍数按筒(1-9)→条(1-9)→中→发→白顺序；可胡牌数量为0时牌面变暗；倍数计算不计对亮不计番型加分项，计算自己的亮倒不计算他人亮倒，不算自摸倍数，不超过房间配置封顶倍数（超过显示封顶倍数）；有封顶时左下角固定展示房间封顶倍数","自动摸打：听牌按钮展示时右侧显示【自动摸打】勾选按钮（未选中/选中两态）；勾选进入托管（同托管逻辑，头像不展示托管图标），可再次点击取消勾选或点击取消托管按钮取消"],"normal_flow":["向听数为1 -> 提示标签展示 -> 提起提示牌弹出胡牌信息框 -> 点击空白处或出牌关闭"],"exception_flow":[],"state_transitions":[],"ui_refs":["GAME-UI-001"],"test_refs":[],"dependencies":["GAME-RULE-012"],"open_questions":[]},{"id":"GAME-FR-014","type":"game_feature","name":"反馈区域与 toast 提示","status":"proposed","authority":"fixed","description":"反馈区庄家提醒、番型播放、飘分、规则提醒、发言过快、漏胡不胡、番数不足、危牌、扣牌失败等提示的文案、时长与可见性","source":{"kind":"original","document":"source/08-UI交互.md","section":"十二、反馈区域 · toast 清单","page":null,"quote":"「您是庄家，请优先出牌」。庄家进行出牌、杠牌、胡牌操作时，提醒消失"},"preconditions":["对局进行中，触发对应提示条件"],"inputs":["庄家或闲家等待状态、玩家出牌尝试、快捷聊天点击"],"outputs":["反馈区提醒、浮动提示 toast、屏幕中央 tips"],"business_rules":["庄家出牌提醒「您是庄家，请优先出牌」直到庄家出牌、杠牌、胡牌操作后消失（仅庄家可见）；闲家等待提醒「等待庄家优先出牌」直到庄家有操作行为（仅闲家可见）","番型播放：在玩家手牌前播放对应番型动画，优先级见行牌操作番型播放规则","飘分播放：5位数以个为单位、6位数以万为单位，正分黄色负分灰色；杠类分数立刻结算，胡牌时总得分一起结算","规则提醒：进行游戏规则的快捷提醒","发言过快：气泡文本和语音播放完毕前再次点击，屏幕中央 tips「您发言太快了，请休息一下吧！」停留1秒消失","漏胡不胡：浮动提示「当前未过手，无法胡牌」1.5秒后消失（仅自己可见）","番数不足：无法捉炮时浮动提示「番数不足，无法捉炮！」（仅自己可见）","危牌：打出危牌时提示「打出该牌将会放炮！」，toast 类停留1.5秒（仅自己可见）","扣牌失败：点击【选择完成】后剩余牌无法听牌时弹窗提示「当前扣牌没有胡口！」，停留至用户操作（仅自己可见）","时长口径：浮动提示/toast 类统一1.5秒，弹窗类停留至用户操作，结果文字类常驻至下一动作"],"normal_flow":["触发条件 -> 反馈区或浮动提示展示 -> 达到时长或条件解除后消失"],"exception_flow":[],"state_transitions":[],"ui_refs":["GAME-UI-001"],"test_refs":[],"dependencies":[],"open_questions":[]},{"id":"GAME-FR-015","type":"game_feature","name":"对局结束过渡与结算界面","status":"proposed","authority":"fixed","description":"正常结束与荒庄流局的过渡表现、买马 UI、小结算界面结构交互、大结算统计与对局后桌面","source":{"kind":"original","document":"source/08-UI交互.md","section":"十三、对局结束 / 十四、结算界面","page":null,"quote":"本玩家分数 ≥ 0 → 胜利，显示【恭喜获胜】的文字和胜利的底色；本玩家分数 < 0 → 失败，显示【遗憾失利】和失败的底色"},"preconditions":["本局有人胡牌或荒庄流局"],"inputs":["点击返回/关闭按钮、长按非交互区域、点击主按钮（查看结算/继续游戏）、点击详情按钮、点击安全中心"],"outputs":["摊牌展示、对局结束或荒庄文字动画、买马 UI、小结算界面、大结算界面"],"business_rules":["正常结束：所有玩家摊牌展示（对家按真实视角倒着），按胡牌顺序在对应玩家面前展示胡/自摸文字；桌面中间播放对局结束文字动画约1.3秒、文字停留0.5秒；触发买马直接弹出买马 UI（UI与牌同时出现、中的马金色边亮起、显示中X马、停留1.5秒后关闭直接打开小结算），未触发则胡牌动画结束后直接弹出小结算","荒庄流局：摊牌展示 -> 【荒庄】文字持续1.3秒 -> 无未听牌玩家直接出小结算；有未听牌玩家则所有未听牌玩家同时飘字未听牌（查叫时同时展示查叫分数；亮倒赔付在查叫后展示【亮倒荒庄】文字并显示加分扣分），持续1.3秒后出小结算","小结算：背景与正上方文字按本玩家胜负展示，分数≥0胜利显示【恭喜获胜】与胜利底色，分数<0失败显示【遗憾失利】与失败底色","小结算功能布局：返回按钮与关闭按钮回到牌桌；安全中心入口；房号、小局结束时间（月日时分秒24小时制）；非交互区域长按隐藏小结算界面；洗牌ICON无交互","小结算主按钮：最后一小局显示【查看结算】点击进入大结算；非最后一小局显示【继续游戏】点击关闭小结算并准备","小结算手牌详情区：按三个玩家确定高度（2人复用3人高度）；庄家头像左上角【庄】标签；开启漂时头像右上角漂X（1~2位数）；仅自己展示结算信息文字；总得分输时触发番型封顶额外显示【封顶】标识（赢不展示）；自己结算信息右侧固定详情按钮，点击打开详情页签（杠分→胡分→荒庄查叫顺序）；手牌交互功能不变","大结算：复用杭麻，数据统计改为卡五星类（自摸X次/点炮X次（一炮多响只算一次）/亮倒/未听），战绩周报特殊游戏次数使用亮倒次数","对局后桌面：复用杭麻，对局结束后桌面保持展示，玩家可查看牌桌信息"],"normal_flow":["有人胡牌或荒庄 -> 摊牌与文字动画 ->（买马 UI）-> 小结算 -> 继续游戏回桌面或查看结算进大结算","GAME-UI-001 round_over -> GAME-UI-005 -> GAME-UI-002（页面流）"],"exception_flow":["荒庄且有未听牌玩家 -> 未听牌飘字（查叫分数、亮倒荒庄赔付）持续1.3秒 -> 小结算"],"state_transitions":[],"ui_refs":["GAME-UI-001","GAME-UI-002","GAME-UI-005"],"test_refs":[],"dependencies":["GAME-RULE-016"],"open_questions":[]},{"id":"GAME-RULE-001","type":"game_rule","name":"牌张构成","status":"proposed","authority":"fixed","description":"使用 84 张牌，仅含筒、条、箭牌三类，不含万子、风牌、花牌。","source":{"kind":"original","document":"source/01-基础规则.md","section":"1.1 牌张构成","page":null,"quote":"本玩法使用 **84 张**牌，**不含万子、不含风牌、不含花牌**："},"preconditions":[],"inputs":[],"outputs":["84 张牌池（筒 36 + 条 36 + 中发白 12）"],"business_rules":["牌池总量 84 张（§1.1）：筒 1筒~9筒 每种 4 张共 36 张；条 1条~9条 每种 4 张共 36 张；箭牌中、发、白每种 4 张共 12 张。","不含万子、不含风牌、不含花牌。","本玩法无牌墙，仅展示牌堆剩余张数（§2.2 名词索引）。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":[],"open_questions":[]},{"id":"GAME-RULE-002","type":"game_rule","name":"起手与胡牌张数","status":"proposed","authority":"fixed","description":"庄家起手 14 张、闲家 13 张，胡牌均为 14 张（含和入张）。","source":{"kind":"original","document":"source/01-基础规则.md","section":"1.2 起手与胡牌张数","page":null,"quote":"发牌从**庄家位开始逆时针**顺序进行。庄家最后一张固定置于手牌最右侧，与一般手牌保持距离。"},"preconditions":["GAME-RULE-001 牌池已构建"],"inputs":["玩家角色（庄家 / 闲家）"],"outputs":["庄家手牌 14 张、闲家手牌 13 张"],"business_rules":["庄家起手 14 张，发牌序列 4+4+4+1+1（4 组）。","闲家起手 13 张，发牌序列 4+4+4+1（4 组）。","胡牌张数均为 14 张（含和入张）。","发牌从庄家位开始逆时针顺序进行。","庄家最后一张固定置于手牌最右侧，与一般手牌保持距离（对应摸牌位置）。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-001"],"open_questions":[]},{"id":"GAME-RULE-003","type":"game_rule","name":"首局定庄","status":"proposed","authority":"open","description":"首局庄家由创房选项决定，支持随机坐庄与房主坐庄，默认房主庄。","source":{"kind":"original","document":"source/01-基础规则.md","section":"3.1 首局定庄","page":null,"quote":"| **房主坐庄** | 开局后首局由房主坐庄 |"},"preconditions":["开局（第一小局）"],"inputs":["创房选项（随机坐庄 / 房主坐庄）"],"outputs":["首局庄家"],"business_rules":["随机坐庄：开局后首局随机决定庄家。","房主坐庄：开局后首局由房主坐庄。","默认值为房主庄（创房面板实拍为选中态；创房表正文只记「根据线上定默认值」，采房主庄为默认值）。","同桌玩家继续游戏时（第二小局起），按 §3.2 轮庄规则决定下一个坐庄玩家（见 GAME-RULE-004）。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-004"],"open_questions":["默认值「房主庄」依据为创房面板实拍，需求正文仅记「根据线上定默认值」，需与线上实际默认值核对。"]},{"id":"GAME-RULE-004","type":"game_rule","name":"轮庄","status":"proposed","authority":"fixed","description":"第二小局起按上一局结果定庄：胡者坐庄、一炮多响点炮者坐庄、荒庄连庄。","source":{"kind":"original","document":"source/01-基础规则.md","section":"3.2 轮庄","page":null,"quote":"| **荒庄（流局）** | **上一局庄家继续坐庄**（即连庄）|"},"preconditions":["上一小局已结束（胡牌或荒庄）"],"inputs":["上一局结果（单个玩家胡牌 / 一炮多响 / 荒庄）"],"outputs":["本局庄家"],"business_rules":["上一局单个玩家胡牌 → 本局胡牌玩家坐庄。","上一局一炮多响 → 本局点炮玩家坐庄。","上一局荒庄（流局）→ 上一局庄家继续坐庄（连庄，连庄无次数上限，§10.4）。","多人抢杠胡属点炮类，由补杠的那一家坐庄（§4.5）。","按逆时针轮庄（庄家以外的方位依次递补），轮庄规则三变体一致（02-游戏流程 §10.3）。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-011","GAME-RULE-030"],"open_questions":[]},{"id":"GAME-RULE-005","type":"game_rule","name":"方位与座位","status":"proposed","authority":"open","description":"庄为东、其余逆时针依次南西北；玩家逆时针入座且座位固定。","source":{"kind":"original","document":"source/01-基础规则.md","section":"3.3 方位","page":null,"quote":"- 确认庄家并开始摸牌时显示方位：**庄为东**，其余玩家按人数逆时针依次显示南、西、北。"},"preconditions":["庄家已确认"],"inputs":["玩家人数（2 或 3）"],"outputs":["各玩家方位（东 / 南 / 西）"],"business_rules":["确认庄家并开始摸牌时显示方位：庄为东，其余玩家按人数逆时针依次显示南、西、北。","方位取值范围：3 人为东/南/西；2 人为东/南。","方位确认后不再变化，直到重新匹配重置为无方位展示。","房主创建房间后，后续加入玩家按逆时针顺序入座，与房主的逆时针顺序关系保持相同；座位固定。","座位布局：2 人固定一上一下（下方自己、上方对家）；3 人固定左、下、右（下方自己、左侧上家、右侧下家）。","座位与方位不随局变动（§10.4）。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":[],"open_questions":["引擎座位编号映射（如「0 号座 = 庄家」）需求未登记（§10.3 标注需注意），需补充定义。"]},{"id":"GAME-RULE-006","type":"game_rule","name":"上楼加倍","status":"proposed","authority":"fixed","description":"上一小局荒庄或一炮多响、或开骰同点时本小局倍数翻倍，可叠加至 4 倍。","source":{"kind":"original","document":"source/01-基础规则.md","section":"3.4 上楼","page":null,"quote":"| 1 | 同一大局内，**上一小局荒庄或者一炮多响** → 本小局**倍数** ×2 |"},"preconditions":["创房勾选「上楼」"],"inputs":["上一小局结果（荒庄 / 一炮多响）","本小局开局骰子点数"],"outputs":["本小局倍数加倍项（×2 / ×4 / 不加倍）"],"business_rules":["触发条件 1：同一大局内上一小局荒庄或者一炮多响 → 本小局倍数 ×2。","触发条件 2：本小局开局打骰子时两个骰子点数一致 → 本小局倍数 ×2。","两个条件同时满足则 ×4（翻倍可叠加，最高 4 倍）。","上楼为加倍项，不可突破封顶倍数。","「倍数」射程指番型 × 加倍项，不含马 / 漂 / 坎等加分项（加分项本就不参与封顶，§七）。","抢杠胡不触发上楼：一炮多响定义为打出一张牌致多家胡牌，补杠的牌被抢不构成打出一张牌（§4.5）。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-011","GAME-RULE-018"],"open_questions":[]},{"id":"GAME-RULE-007","type":"game_rule","name":"杠类型与杠分","status":"proposed","authority":"fixed","description":"直杠 2 倍、明杠（补杠）1 倍、暗杠 2 倍底分，实时结算且荒庄不退还。","source":{"kind":"original","document":"source/01-基础规则.md","section":"4.1 杠的类型与杠分","page":null,"quote":"| **直杠** | 别人打出某张牌，玩家手中存在相同的 **3 张** → 开杠 | 打出牌的玩家支付直杠玩家 **2 倍底分** | 否 |"},"preconditions":["行牌阶段中，满足对应杠型条件"],"inputs":["杠操作类型（直杠 / 明杠 / 暗杠）"],"outputs":["实时结算的杠分（倍底分）"],"business_rules":["直杠（M4 §4.1）：别人打出某张牌、玩家手中存在相同 3 张 → 开杠；打出牌的玩家支付直杠玩家 2 倍底分；不可被抢。","明杠（补杠，§4.1）：玩家碰牌后（当前回合不可杠）后续摸到相同的牌 → 开杠；其他玩家各支付补杠玩家 1 倍底分；可被抢杠胡（见 GAME-RULE-011）。","暗杠（§4.1）：非碰牌后的出牌阶段，手上有 4 张相同牌 → 开杠；其余玩家各支付暗杠玩家 2 倍底分；不可被抢；暗杠的牌其余玩家可见（三张反面 + 顶部牌面）。","杠分实时结算，小局结束时不额外再算。","流局未听牌不需要返还杠分（直杠 / 明杠 / 暗杠三种均适用）；荒庄后杠分不退还。","别名口径（§2.1）：本玩法「明杠」= 通用补杠 / 加杠（不是直杠）；「直杠」= 通用大明杠。","底分为结算的最小乘算单位，杠分表述均为 N 倍底分（§2.2 名词索引）。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-009","GAME-RULE-010","GAME-RULE-011"],"open_questions":[]},{"id":"GAME-RULE-008","type":"game_rule","name":"杠上杠（连杠）","status":"proposed","authority":"fixed","description":"连续杠时杠分按 2^(连续杠次数−1) 翻倍，可跨玩家，无人续杠则重置。","source":{"kind":"original","document":"source/01-基础规则.md","section":"4.2 杠上杠（连杠）","page":null,"quote":"本次杠分 = 基础杠分 × 2^(连续杠次数 − 1)"},"preconditions":["已发生一次杠（M4）"],"inputs":["连续杠次数 n"],"outputs":["本次杠分（基础杠分 × 2^(n-1) 倍底分）"],"business_rules":["触发：玩家杠牌后摸到的牌继续杠；或补牌后打出的牌被别人杠。","倍率公式：本次杠分 = 基础杠分 × 2^(连续杠次数 − 1)；连续杠 1 次为 1（基础杠分）、2 次 ×2、3 次 ×4，n 次为 2^(n-1)。","连杠可跨玩家连续：A 杠 → 打出一张 B 杠（也算连杠）→ B 打出一张 C 杠（仍算连杠）。","中断：玩家补牌后打出一张无人杠 → 本次连杠结束，倍数清零重新计算。","需求原文示例 T1~T4：A 补杠收 1 分；A 杠上摸牌继续暗杠收其他玩家 2 × 2 = 4 分；A 再杠上摸牌后打出、B 直杠 B 收 A 2 × (2×2) = 8 分；B 杠上摸牌后打出无人杠则重置，下次从 ×2 重新开始。","与胡分的关系：杠上杠仅计算杠分，之前的杠分不转移；杠上杠触发杠上花 / 杠上炮 / 抢杠胡时，这些番型的倍数不跟随杠上杠翻倍，走初始值（初始 2，可勾选为 4）。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-007","GAME-RULE-010","GAME-RULE-011"],"open_questions":[]},{"id":"GAME-RULE-009","type":"game_rule","name":"杠牌限制","status":"proposed","authority":"open","description":"回手杠、余牌下限、亮倒、危牌、扣牌五类场景下限制开杠。","source":{"kind":"original","document":"source/01-基础规则.md","section":"4.3 杠牌限制","page":null,"quote":"| **回手杠**（**常驻规则，无创房开关**）| ① 手上有 3 张一样的牌，别人打出时如果选择**碰**，则这张牌**本小局不能再明杠**。<br>② **已经碰过的牌，摸到第四张时必须立刻杠**，否则本小局这张牌不能再明杠。 |"},"preconditions":["玩家尝试开杠（M4）"],"inputs":["意图杠的牌与杠型"],"outputs":["是否允许开杠"],"business_rules":["回手杠（常驻规则，无创房开关）：手上有 3 张一样的牌，别人打出时如果选择碰，则这张牌本小局不能再明杠。","回手杠 ②：已经碰过的牌，摸到第四张时必须立刻杠，否则本小局这张牌不能再明杠。","剩余牌限制：牌堆剩余牌为 0 时，不可杠。","亮倒限制：玩家亮倒后，手牌中未扣下的牌不可杠；手中有 4 张牌、扣下 3 张也不可杠（哪怕摸到维持听牌的牌）；已经碰的牌明杠不受此限制（但仍受剩余牌、回手杠、危牌限制）。","危牌限制：未亮倒时，危牌不可明杠（补杠）；直杠和暗杠可以。","扣牌相关：亮倒后仅扣下的刻子可杠；未扣下的刻子无论别人打出还是自己摸到都不可杠；扣下的刻子若第 4 张在自己手中且已亮出，仍不可杠（会改牌）。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-007","GAME-RULE-012","GAME-RULE-013","GAME-RULE-014"],"open_questions":["需求在 §2.2.2 给【回手杠】标注「（配置）」，但三张创房表均无对应开关项，开关名与默认值需求未给；本套按「可配置的规则层约束」登记、不自行虚构开关，需与需求方确认。"]},{"id":"GAME-RULE-010","type":"game_rule","name":"补牌（杠后摸牌）","status":"proposed","authority":"fixed","description":"杠后从牌堆倒序摸一张视为摸牌，牌堆剩余张数额外减 1。","source":{"kind":"original","document":"source/01-基础规则.md","section":"4.4 补牌","page":null,"quote":"- 杠了之后摸一张牌，**剩余牌数额外减 1 张**。"},"preconditions":["玩家杠牌成功"],"inputs":[],"outputs":["补牌 1 张（置于手牌最右侧）","牌堆剩余张数额外减 1"],"business_rules":["杠了之后摸一张牌，剩余牌数额外减 1 张（§4.4）。","补牌方向：从牌堆倒序摸一张牌，即从牌堆末尾取牌。","补牌视为摸牌：漏胡等过手状态在补牌后解除（§八）。","补牌位置：手牌最右侧，与一般手牌间隔 1/4 牌距离。","本玩法不展示牌墙，仅展示剩余张数。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-007","GAME-RULE-019","GAME-RULE-020"],"open_questions":[]},{"id":"GAME-RULE-011","type":"game_rule","name":"抢杠胡","status":"proposed","authority":"open","description":"他人明杠（补杠）的牌恰为自己胡牌时可抢杠胡，倍数 ×2（可勾选 ×4），视为未杠成功。","source":{"kind":"original","document":"source/01-基础规则.md","section":"4.5 抢杠胡","page":null,"quote":"- **触发**：其他玩家进行**明杠（补杠）**，且明杠的牌恰为自己的胡牌时，玩家可抢杠胡。"},"preconditions":["某玩家进行明杠（补杠）"],"inputs":["被补杠的牌"],"outputs":["抢杠胡成立或明杠继续"],"business_rules":["触发：其他玩家进行明杠（补杠），且明杠的牌恰为自己的胡牌时，玩家可抢杠胡；可多人抢杠胡一家。","倍数：抢杠胡 ×2；勾选「杠上花/炮*4」后 ×4（需求 §2.3.1.2 明写杠上花、杠上炮、抢杠胡三项并列走初始值，初始 2 可勾选为 4，受同一勾选控制）。","后果：抢杠胡后，明杠玩家视为未杠成功，不收取杠分，杠上杠也会中断。","杠分冲销：因杠分实时结算（§4.1），「视为未杠成功、不收取杠分」在实现上即已实时收取的该杠杠分需回退（由「实时结算」+「视为未杠成功」两句合成推导）。","归类：属点炮类（需求 §2.2.2【点炮】明列「打出或补杠的牌」），计入点炮次数。","与上楼的关系：不触发上楼（§3.4 上楼触发条件为上一小局荒庄或一炮多响；一炮多响定义为打出一张牌，补杠被抢不构成）。","坐庄归属：属点炮类，多人抢杠胡时由补杠的那一家坐庄（§3.2）。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":["GAME-TC-009"],"dependencies":["GAME-RULE-004","GAME-RULE-006","GAME-RULE-007","GAME-RULE-008"],"open_questions":["「已实时收取的杠分需回退」系推导口径（原文仅写「视为未杠成功，不收取杠分」），回退的数值口径与时机需技术侧确认。"]},{"id":"GAME-RULE-012","type":"game_rule","name":"亮倒","status":"proposed","authority":"open","description":"听牌后可选择亮倒明牌不可换牌，番型分 ×2，并产生危牌与扣牌联动。","source":{"kind":"original","document":"source/01-基础规则.md","section":"5.1 亮倒","page":null,"quote":"- 用户**明牌**、**不可改牌**，只能摸打。"},"preconditions":["玩家处于可听牌状态（打出一张非危牌后可听，或手牌全是危牌，或自摸时）"],"inputs":["玩家选择（亮倒 / 不亮倒 / 扣牌组合）"],"outputs":["亮倒状态（明牌）","番型分 ×2 加成","危牌标记（对其他未亮倒玩家）"],"business_rules":["权限触发：打出一张非危牌后可听牌 → 触发亮倒权限，玩家可选择是否亮倒；手牌中全是危牌时去掉「非危牌」限制同样可触发；自摸时每次都会展示亮的权限。","亮倒后果：用户明牌、不可改牌，只能摸打；亮倒的牌必须维持听牌；胡的牌成为其他未亮倒用户的危牌。","亮倒后杠限制：仅可对已扣下的刻子进行直杠 / 补杠；暗杠仅可摸到第 4 张暗杠，第 4 张在手牌中不可暗杠（§4.3 / §5.1）。","计分：亮倒状态下输 / 赢时均计算亮倒，番型分 ×2，不影响加分项。","对亮：输赢双方均亮倒（对亮）仅计算一次亮倒 ×2；若创房勾选「对亮 ×2」则计算两个亮倒（共 4 倍）。","创房「亮倒」组选项：部分亮（亮倒后仅非扣下、与胡的牌相关的牌亮出）；少于12张不亮（玩家摸 / 补牌之后牌堆牌 < 12 张则不再触发亮牌，不下放权限，本变体默认不选）；对亮 ×2；胡牌必须亮倒（仅亮倒状态才能胡，与双亮互斥）；双亮（仅 3 人时可勾选、2 人置灰，已有 2 个玩家亮倒则第三人无需亮倒也能胡牌，与「胡牌必须亮倒」互斥）。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":["GAME-TC-004"],"dependencies":["GAME-RULE-013","GAME-RULE-014","GAME-RULE-018"],"open_questions":["创房「亮倒」组中「部分亮」「胡牌必须亮倒」两项在本变体列标记为「—」，其是否开放与默认值未明示，需确认。"]},{"id":"GAME-RULE-013","type":"game_rule","name":"扣牌","status":"proposed","authority":"fixed","description":"亮倒同时把去掉后仍保持听牌的刻子扣下（他人不可见），亮倒后不可再扣。","source":{"kind":"original","document":"source/01-基础规则.md","section":"5.2 扣牌","page":null,"quote":"**触发时机**：**亮倒的同时**进行扣牌判断。**亮倒之后不可再扣牌**。"},"preconditions":["玩家执行亮倒（GAME-RULE-012）"],"inputs":["亮倒时的手牌"],"outputs":["扣下的刻子（牌背朝上，他人不可见）","按剩余亮出牌决定的听牌"],"business_rules":["触发时机：亮倒的同时进行扣牌判断，亮倒之后不可再扣牌。","可扣判断（遍历手中所有刻子与四张相同牌逐个判断）：将该刻子去掉（四张相同牌则去掉三张）→ 剩余手牌是否仍满足「打出一张非危牌后可听牌」→ 满足则可扣下，不满足则不可扣。","扣下张数：3 张相同牌（刻子）全部扣下（3 张）；4 张相同牌扣下 3 张。","多组同时扣下：玩家可同时扣下多组刻子，但需再次检测扣多组后的剩余手牌是否仍满足「打出一张非危牌后可听牌」。","需求原文示例：手牌 筒 12333 · 78999 · 中中中，摸进 5 条、无危牌，打出 5 条可听 369 筒；红中、3 筒、9 筒均可单独扣下，但 3 筒与 9 筒同时扣下后不满足条件、不可同时扣下。","扣牌与听牌：扣牌后按剩余亮出的牌决定听牌（原文示例：手牌 11 56667 听 1 和 6，扣住 6 后变为 11 57，仅听 6）。","展示：扣住的刻子在亮倒后他人不可见（牌背朝上）。","其他口径：没有可扣的刻子时跳过扣牌环节；危牌可以扣下（只要满足扣牌条件）；扣牌环节点「取消」等同于过，回到正常出牌界面。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-012","GAME-RULE-014"],"open_questions":[]},{"id":"GAME-RULE-014","type":"game_rule","name":"危牌","status":"proposed","authority":"fixed","description":"亮倒玩家胡的牌对未亮倒玩家为危牌，不可打出、不可明杠，全危牌时可打出。","source":{"kind":"original","document":"source/01-基础规则.md","section":"5.3 危牌","page":null,"quote":"**定义**：同一小局中，**未亮倒玩家手中的牌**，如果是**任一**亮倒玩家**胡的牌**，被标记为【危牌】。"},"preconditions":["场上存在亮倒玩家（GAME-RULE-012）"],"inputs":["未亮倒玩家手牌"],"outputs":["危牌标记及其限制"],"business_rules":["定义：同一小局中，未亮倒玩家手中的牌如果是任一亮倒玩家胡的牌，被标记为危牌。","碰杠牌区的牌不算危牌；玩家亮倒后，危牌标签去掉。","限制 1：危牌不可打出（全危牌例外见限制 3）；未亮倒玩家手中既有危牌也有非危牌时，无法打出危牌（不计算碰杠牌区）。","限制 2：不可危牌明杠（补杠）；可直杠和暗杠。","限制 3：手中牌全是危牌时，可打出危牌（仅计算手中牌，含摸 / 补的牌）。","其他：危牌可以碰。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-007","GAME-RULE-009","GAME-RULE-012"],"open_questions":[]},{"id":"GAME-RULE-015","type":"game_rule","name":"漂","status":"proposed","authority":"fixed","description":"开局选定漂分，胡牌收漂分 =（己方漂数 + 对方漂数）× 底分，逐人计算。","source":{"kind":"original","document":"source/01-基础规则.md","section":"6.1 漂","page":null,"quote":"胡牌玩家向某玩家收取的漂分 = （胡牌玩家漂数 + 该玩家漂数）× 底分"},"preconditions":["创房选择漂模式（不漂 / 自由漂 / 开局定漂 / 固定漂）"],"inputs":["各玩家漂数","胡牌方式（自摸 / 捉炮）"],"outputs":["漂分（倍底分，逐人计算）"],"business_rules":["模式不漂：关闭漂功能，无打漂环节、不计漂分。","模式自由漂：每小局开局后，玩家可在【不漂】【漂1】【漂2】【漂5】【漂10】中选择。","模式开局定漂（首局定漂）：仅每个大局的第一小局执行选漂环节，决定本大局每一小局的漂分；后续小局流程同固定漂。","模式固定漂：无选漂环节；本大局每小局固定漂【X】，下拉框可选 1 / 2 / 5 / 10，下拉框默认 2；漂分整体默认档亦为「固定漂 2」（需求 §3.1.1.1 明文）。","收分公式：胡牌玩家向某玩家收取的漂分 =（胡牌玩家漂数 + 该玩家漂数）× 底分，每个玩家单独计算。","捉炮胡仅收取点炮玩家；自摸胡收取所有玩家。","需求原文示例：A 漂 0、B 漂 2、C 漂 1 时，B 自摸收 A (2+0)=2 倍底分、收 C (2+1)=3 倍底分；A 点炮 B 胡牌仅收 A (2+0)=2 倍底分。","荒庄时漂也赔（查叫赔付含漂分，见结算文档 §九）。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-022","GAME-RULE-028"],"open_questions":[]},{"id":"GAME-RULE-016","type":"game_rule","name":"买马","status":"proposed","authority":"fixed","description":"胡牌（自摸 / 亮牌自摸）后翻剩余牌计马分，买一 / 买一送一 / 买 5 马 / 买 6 马四档。","source":{"kind":"original","document":"source/01-基础规则.md","section":"6.2 买马","page":null,"quote":"| **买一** | 剩余牌中翻 **1 张** | 中发白记 **10 倍底分**；1~9 的条 / 筒牌记**同数字倍**的底分 | 数量不足时**不买马** |"},"preconditions":["创房勾选买马（不买马 / 自摸买马 / 亮牌自摸买马）","玩家胡牌且满足触发条件（自摸，或亮牌自摸）"],"inputs":["牌堆剩余牌"],"outputs":["马分（该小局马分总分）"],"business_rules":["触发模式：不买马（关闭）；自摸买马（玩家自摸胡牌后触发）；亮牌自摸买马（玩家亮牌自摸胡牌后触发）。","买一：剩余牌中翻 1 张，中发白记 10 倍底分，1~9 的条 / 筒牌记同数字倍的底分；数量不足时不买马。","买一送一：剩余牌中翻 2 张，计分同上，两张分数之和为该小局马分；数量不足时不买马。","买6马：剩余牌中翻 6 张，出现 1 / 4 / 7 / 白每张计 1 倍底分，总分为该小局马分；命中集即此四种、不含中 / 发；数量不足时有多少买多少，剩余牌为 0 则不买，中 0 张按 6 马计分。","买5马：剩余牌中翻 5 张，出现 1 / 4 / 7 / 白每张计 1 分，总分为该小局马分；一张不中或者中 5 张，按 6 马计分；边界同买6马。","命中集说明（需求 §2.3.2.2）：买 5 / 6 马命中集是 1 / 4 / 7 / 白、不含中、发，为有意设计（84 张中命中 28 张恰为 1/3）；与买一 / 买一送一的「中发白记 10 倍底分」机制不同（前者按是否命中计数，后者按牌面值给分）。","收分关系：自摸收取所有玩家。","荒庄不买马。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-020","GAME-RULE-029"],"open_questions":[]},{"id":"GAME-RULE-017","type":"game_rule","name":"数坎","status":"proposed","authority":"fixed","description":"胡牌后按暗刻、杠子、手中四张的数量加坎分（暗刻 +1、明杠直杠 +1、暗杠 +2、手中四张 +2）。","source":{"kind":"original","document":"source/01-基础规则.md","section":"6.3 数坎","page":null,"quote":"**计算范围** = 自己的**手中** + **胡的那张** + **碰杠牌区**。"},"preconditions":["玩家胡牌（或荒庄查叫时存在听牌）"],"inputs":["手中牌、胡的那张、碰杠牌区"],"outputs":["坎分（倍底分）"],"business_rules":["计算范围 = 自己的手中 + 胡的那张 + 碰杠牌区。","每个暗刻 +1 倍底分；每个明杠 / 直杠 +1 倍底分；每个暗杠 +2 倍底分；手中 4 张一样的牌 +2 倍底分（必须是顺 + 刻，不与暗刻重复计算）。","必须是刻子；仅是 3 张相同牌但不成刻的不算。","胡的那张牌：自摸才参与计算，捉炮不参与。","收分对象 = 需要付胡牌分的玩家：点炮胡收放炮玩家；自摸胡收其他所有玩家。","查叫时也计算坎分；查叫时因为没有胡，不计算胡的那张牌。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-007","GAME-RULE-028"],"open_questions":[]},{"id":"GAME-RULE-018","type":"game_rule","name":"胡牌限制层","status":"proposed","authority":"fixed","description":"番型合法之外有 5 层限制（M5），任一拦截即不可胡。","source":{"kind":"original","document":"source/01-基础规则.md","section":"七、胡牌限制层（M5）","page":null,"quote":"番型合法之外，本玩法还有 5 层限制，**任一拦截即不可胡**："},"preconditions":["玩家尝试胡牌（自摸 / 捉炮 / 抢杠胡）"],"inputs":["胡牌尝试及其上下文（番型倍数、危牌、亮倒、漏胡、操作优先级）"],"outputs":["允许胡或拦截"],"business_rules":["限制层 1 番数门槛：番型 × 加倍项 > 1 才可捉炮；只有 1 倍时只能自摸；自摸不受限。","限制层 2 危牌：见 §5.3（手中全是危牌时可打出）。","限制层 3 亮倒限制（可选）：勾选「胡牌必须亮倒」后仅亮倒状态才能胡；例外为勾选「双亮」后 3 人时已有 2 人亮倒 → 第三人免亮可胡（自摸、点炮均可）。","限制层 4 漏胡：见 §8；摸牌后（含杠后补牌）解除。","限制层 5 操作优先级：吃胡 / 自摸 / 抢杠胡 > 碰 / 杠。","判定顺序无关结果：限制层是否决条件（满足任一即不可胡），番型是计分条件（决定胡了算多少倍），二者为 AND 关系；先算番型再过限制层仅为行文顺次，无需技术侧确认。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-012","GAME-RULE-014","GAME-RULE-019"],"open_questions":[]},{"id":"GAME-RULE-019","type":"game_rule","name":"过手规则","status":"proposed","authority":"open","description":"漏胡（过胡）在摸牌前不可胡、摸牌后解除；过碰 / 过杠按同口径推导（C4）。","source":{"kind":"original","document":"source/01-基础规则.md","section":"八、过手规则（C4）","page":null,"quote":"| **漏胡（过胡）** | 玩家可胡牌时选择不胡牌即为漏胡。**漏胡玩家在摸牌前不可胡牌**；**漏胡状态在摸牌后解除（含杠后补牌）**。 |"},"preconditions":["玩家出现可胡 / 可碰 / 可杠机会"],"inputs":["玩家选择（胡 / 碰 / 杠 / 过）"],"outputs":["过手状态（漏胡 / 过碰 / 过杠）及其解除时机"],"business_rules":["漏胡（过胡）：玩家可胡牌时选择不胡牌即为漏胡；漏胡玩家在摸牌前不可胡牌；漏胡状态在摸牌后解除（含杠后补牌）。","漏胡提示：触发漏胡不胡后，出现浮动提示「当前未过手，无法胡牌」，1.5 秒后消失。","托管超时默认：配置开启托管时，碰 / 杠超时默认过；有胡牌的多状态，超时默认胡牌。","过碰（推导口径）：过碰后、轮到自己回合前，其他玩家再打出同张牌时不可再碰；需求仅定义漏胡、未定义过碰，按其同一「过手至摸牌解除」的时机模型推导（与血战 / 贵阳过手碰口径一致）。","过杠（推导口径）：过杠后、轮到自己回合前不可再杠同张；推导依据同过碰。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-010","GAME-RULE-018"],"open_questions":["过碰 / 过杠为按同厂商同品类通用口径推导（需求原文未明示），需与需求方确认口径。"]},{"id":"GAME-RULE-020","type":"game_rule","name":"开局数值速查","status":"proposed","authority":"fixed","description":"资源总量 84 张，起手 3 人 40 / 2 人 27，分发后余量 44 / 57，及节奏类硬约束。","source":{"kind":"original","document":"source/01-基础规则.md","section":"10.1 资源与起手","page":null,"quote":"| **资源总量（基准）** | **84 张** | 本变体**无牌张变体**；§1.1 |"},"preconditions":["对局开局"],"inputs":["玩家人数（2 或 3）"],"outputs":["牌堆初始余量（44 / 57 张）"],"business_rules":["资源总量（基准）84 张，本变体无牌张变体（§10.1）。","起手分发序列：庄 4+4+4+1+1（4 组）、闲 4+4+4+1（4 组）（§10.1）。","起手合计：3 人 40 张（14 + 13 × 2）、2 人 27 张（14 + 13 × 1）（§10.1 推导式）。","分发后余量 = 总量 − 起手合计：3 人 44 张、2 人 57 张（§10.2 结果值）。","余量即牌堆剩余牌数，本玩法不展示牌墙仅展示剩余张数；杠后补牌时牌堆额外减 1 张（§10.2）。","节奏类硬约束（§10.4）：荒庄阈值为可摸牌数 = 0 且无人胡牌；牌堆剩余牌为 0 时不可杠；牌堆牌 < 12 张时不再下放亮倒权限（需勾选「少于12张不亮」）；买 1 / 买一送一数量不足则不买马，买 5 / 买 6 马有多少买多少；连庄无次数上限；漏胡状态在摸牌后解除（含杠后补牌）；座位与方位不随局变动。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-001","GAME-RULE-002"],"open_questions":[]},{"id":"GAME-RULE-021","type":"game_rule","name":"全流程阶段与开局准备","status":"proposed","authority":"fixed","description":"一局按开局准备、打漂、定庄摇骰、发牌、行牌、结束、和牌后、结算续局的时序推进。","source":{"kind":"original","document":"source/02-游戏流程.md","section":"卡五星（好友房）· 游戏流程（引言）","page":null,"quote":"> 一局从开始到结束按时间发生什么：开局准备 → 打漂 → 定庄 → 摇骰方位 → 发牌 → 行牌 → 结束 → 结算续局；操作的条件与后果见 [打牌操作](03-打牌操作.md)。"},"preconditions":[],"inputs":[],"outputs":["对局阶段序列"],"business_rules":["阶段序列（§全流程）：开局准备 → 打漂 → 定庄、定方位 → 发牌 → 行牌 → 结束判定（胡牌 / 荒庄两条分支）→ 和牌后步骤（买马）→ 小结算 → 大结算 → 续局。","开局准备（§一）：房主创建好友房，选定卡五星玩法与创房参数；后续加入玩家按逆时针顺序入座，座位固定（2 人一上一下、3 人左·下·右）。","开局动画：每次开房首局播放开局动画；之后开局直接进入摇骰发牌。","玩家信息：展示头像、昵称、积分（初始 0）。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-STATE-001"],"open_questions":[]},{"id":"GAME-RULE-022","type":"game_rule","name":"打漂流程","status":"proposed","authority":"fixed","description":"四种漂模式的流程差异与选漂交互时序（选漂完成后开始打骰子）。","source":{"kind":"original","document":"source/02-游戏流程.md","section":"三、打漂","page":null,"quote":"| **自由漂**（每局选漂）| **每个小局**执行选漂环节 |"},"preconditions":["小局开局","创房已选漂模式（见 GAME-RULE-015）"],"inputs":["玩家选漂操作"],"outputs":["本小局（或本大局）各玩家漂数"],"business_rules":["不漂：无打漂环节、不计漂分。","固定漂：开局的同时玩家头像旁直接出现选漂结果，无过程动画，并同时开始打骰子。","首局定漂：仅每个大局的第一小局执行选漂环节；后续每个小局开局时流程同固定漂。","自由漂（每局选漂）：每个小局执行选漂环节。","选漂流程（固定漂以外的模式）：小局开局后每个玩家屏幕出现各漂选项 → 其他玩家头像旁出现【选漂中...】文字 → 玩家点击选项完成选漂、选漂结果其他玩家直接可见 → 最后一个玩家选漂完成的同时选漂结果出现、所有玩家的选漂文字缩小移动到头像旁漂 UI 位置 → 开始打骰子。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-015"],"open_questions":[]},{"id":"GAME-RULE-023","type":"game_rule","name":"定庄时机与摇骰方位","status":"proposed","authority":"fixed","description":"定庄逻辑上先于发牌（定庄 → 定方位 → 发牌），骰子停转展数 1 秒后消失并确定方位。","source":{"kind":"original","document":"source/02-游戏流程.md","section":"四、定庄","page":null,"quote":"- 定庄时机：**逻辑上先于发牌** —— **定庄 → 定方位 → 发牌**。"},"preconditions":["打漂环节完成（或漂模式无需选漂）"],"inputs":["定庄选项（随机坐庄 / 房主坐庄）或轮庄结果"],"outputs":["庄家、方位、骰子点数、上楼展示"],"business_rules":["定庄选项：随机坐庄（开局后首局随机坐庄）、房主坐庄（开局后首局房主坐庄，默认值，创房面板实拍为选中态）。","定庄时机：逻辑上先于发牌，顺序为定庄 → 定方位 → 发牌（依据 §2.0 对局节奏表「打漂 → 定庄、定方位（骰子点数展示 1S）→ 发牌」及 §3.2.5「确认庄家并开始摸牌时显示方位」）。","庄家标签为呈现层：发牌开始后当骰子滚动停下时，庄家头像上直接出现【庄】标志，无过程动画；不改变逻辑顺序。","骰子（§五）：发牌时显示骰子，两个骰子环绕转动；在用户拿到所有手牌后，骰子停止转动并展现数字，停留 1 秒后消失。","方位：未开局默认无方位展示；确认庄家并开始摸牌时显示对应方位，庄为东、其他玩家按人数逆时针依次南西北（3 人仅南西、2 人仅南）；之后方位不再变化，直到重新匹配重置。","上楼展示：开启上楼规则且该局符合上楼时，在骰子停止的同时在骰子上方展示「上楼X2 / 上楼X4」（2 还是 4 按具体倍数定）。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-003","GAME-RULE-005","GAME-RULE-006"],"open_questions":[]},{"id":"GAME-RULE-024","type":"game_rule","name":"方位高亮与倒计时","status":"proposed","authority":"fixed","description":"出牌方位闪烁高亮且不受他人碰杠胡影响；可操作倒计时按操作方视角重置。","source":{"kind":"original","document":"source/02-游戏流程.md","section":"五、摇骰与方位","page":null,"quote":"| **方位高亮** | 某个玩家轮到出牌时，其对应方位闪烁高亮；期间即使其他玩家在该玩家出牌后可进行碰 / 杠 / 胡操作，**也不会改变高亮方位**。对局结束则无方位高亮 |"},"preconditions":["对局处于行牌阶段且方位已确定"],"inputs":["当前出牌权归属","碰 / 杠 / 胡操作事件"],"outputs":["方位高亮状态、各视角倒计时"],"business_rules":["方位高亮：某个玩家轮到出牌时，其对应方位闪烁高亮；期间即使其他玩家在该玩家出牌后可进行碰 / 杠 / 胡操作，也不会改变高亮方位；对局结束则无方位高亮。","倒计时显示：显示玩家可操作的倒计时，最多两位数。","倒计时配色：默认蓝色，倒计时为 03 / 02 / 01 / 00 时为黄色。","倒计时重置：有碰 / 杠 / 胡等操作时，自己视角的倒计时需重置成可操作的倒计时（例：左边玩家打出三条后自己可执行碰操作，则倒计时重置成初始值）。","倒计时不变：当别人有碰 / 杠 / 胡等操作时，别人视角的倒计时无变化。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-005","GAME-RULE-026"],"open_questions":[]},{"id":"GAME-RULE-025","type":"game_rule","name":"发牌逻辑与节奏","status":"proposed","authority":"fixed","description":"从庄家位逆时针按 4+4+4+1（+庄 1）发牌，全员节奏同步，发毕自动理牌立起。","source":{"kind":"original","document":"source/02-游戏流程.md","section":"6.1 发牌逻辑","page":null,"quote":"| **方向** | 从**庄家位**开始，**逆时针**顺序 |"},"preconditions":["定庄与方位已确定（GAME-RULE-023）"],"inputs":[],"outputs":["庄家手牌 14 张、闲家手牌 13 张、牌堆余量（3 人 44 / 2 人 57）"],"business_rules":["发牌方向：从庄家位开始，逆时针顺序（§6.1）。","第 1~3 轮每人发 4 张/次共 3 轮；第 4 轮再从庄家位开始逆时针每人发 1 张；第 5 步最后给庄家位发 1 张（§6.1）。","起手合计：庄 14 张（4+4+4+1+1）、闲 13 张（4+4+4+1）；全体起手合计 3 人 40 张、2 人 27 张；发牌后余量 3 人 44 张、2 人 57 张（§6.2 / §6.3）。","发牌节奏：所有玩家获取手牌的节奏一致；每组牌出现的时间桌上所有玩家同步（§6.4）。","己方手牌展示：按从左到右排列，出现时扣在桌面上随后向上翻开；第一组开始向上翻开时第二组朝下的牌出现，按同样节奏扣住后向上翻，直到 4 组牌全部翻开（§6.4）。","庄家最后两张中右侧一张与前 13 张有距离，放置在摸牌位置；他人手牌只有出现动画、出现后立起，无翻开动画，庄家最后一张同样放置在庄家摸牌位置（§6.4）。","理牌：所有玩家发牌完毕后将手牌扣下整理好顺序后立起（自动理牌）；手牌排列顺序从左至右花色依次为筒 → 条 → 中 → 发 → 白，同花色内从左至右大小 1~9（§6.5）。","庄家摸进的最后一张牌受理牌影响，固定置于最右侧且与一般手牌保持距离（§6.5）。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-002","GAME-RULE-020"],"open_questions":[]},{"id":"GAME-RULE-026","type":"game_rule","name":"行牌阶段","status":"proposed","authority":"fixed","description":"逆时针摸打循环，响应优先级吃胡 / 自摸 / 抢杠胡高于碰 / 杠，本玩法不能吃牌。","source":{"kind":"original","document":"source/02-游戏流程.md","section":"七、行牌阶段","page":null,"quote":"**行牌顺序**：**逆时针**。庄家先出牌，之后按逆时针轮转。"},"preconditions":["发牌理牌完成"],"inputs":["摸 / 打 / 碰 / 杠 / 补 / 胡 / 过 / 亮倒 / 扣牌操作"],"outputs":["出牌权流转、牌堆消耗、终局触发"],"business_rules":["行牌顺序为逆时针，庄家先出牌，之后按逆时针轮转。","一轮循环：当前玩家出牌 → 其余玩家可选操作（按优先级：吃胡 / 自摸 / 抢杠胡 > 碰 / 杠）→ 有人碰 / 杠则该玩家取得出牌权继续循环；无人操作则下家摸牌 → 出牌继续循环。","摸牌与出牌的衔接：摸牌需在上一家打出牌的同时进行（肉眼可见上家打出牌的瞬间下家摸牌）。","可执行的操作：摸、打、碰、杠（直杠 / 明杠 / 暗杠）、补、胡、过、亮倒、扣牌。","不能吃牌。","操作的条件、后果与限制详见 source/03-打牌操作.md；亮倒 / 扣牌 / 危牌机制见 source/01-基础规则.md §五。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-STATE-002","GAME-RULE-007","GAME-RUL /02-游戏流程.md","section":"九、和牌后步骤（M6）","page":null,"quote":"本玩法在和牌之后、结算之前有一个**附加计分步骤：买马**。"},"preconditions":["已进入和牌结束流程（GAME-RULE-027）"],"inputs":["本局是否触发买马（勾选自摸买马 / 亮牌自摸买马且满足触发条件）"],"outputs":["买马界面与马分，或直接进入小结算"],"business_rules":["本玩法在和牌之后、结算之前有一个附加计分步骤：买马（M6）。","本局触发买马（勾选「自摸买马」或「亮牌自摸买马」且满足触发条件）：直接弹出买马界面，界面与牌同时出现，中的马带金色边且亮起，同时出现「中X马」的文字；持续 1.5 秒后界面关闭，直接打开小结算界面。","本局未触发买马：胡牌动画结束后，直接弹出小结算。","买马的触发条件、翻牌张数与计分规则见 GAME-RULE-016。","荒庄不买马。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-016","GAME-RULE-027"],"open_questions":[]},{"id":"GAME-RULE-030","type":"game_rule","name":"结算与续局","status":"proposed","authority":"fixed","description":"小结算、大结算两级结算与续局轮庄规则，最后一小局进入大结算。","source":{"kind":"original","document":"source/02-游戏流程.md","section":"10.3 续局与轮庄","page":null,"quote":"- 非最后一小局时，小结算底部按钮显示为【继续游戏】，点击后关闭小结算界面并准备下一局。"},"preconditions":["小局已结束（胡牌或荒庄流程走完）"],"inputs":["本局是是否最后一小局","上一局结果"],"outputs":["小结算 / 大结算界面","下一局庄家"],"business_rules":["小结算（§10.1）：对局结束后进入小结算界面；界面内容与文案规则见结算文档 §十五与 UI 交互文档 §十四。","大结算（§10.2）：最后一小局时，小结算底部按钮显示为【查看结算】，点击进入大结算界面（复用杭麻大结算）。","大结算统计口径：自摸 X 次（记录自摸次数）；点炮 X 次（记录点炮次数，一炮多响只算一次、一小局最多一次）；亮倒（记录亮倒次数）；未听（记录荒庄流局时未听牌的次数）。","战绩周报中，卡五星玩法统计的特殊游戏次数使用「亮倒次数」（§10.2）。","续局与轮庄（§10.3）：上一局单个玩家胡牌 → 胡牌玩家坐庄；一炮多响 → 点炮玩家坐庄；荒庄 → 上一局庄家继续坐庄（连庄）；轮庄规则三变体一致；按逆时针轮庄（庄家以外的方位依次递补）。","非最后一小局时，小结算底部按钮显示为【继续游戏】，点击后关闭小结算界面并准备下一局。","对局后桌面（§10.4）：复用杭麻，对局结束后桌面保持展示，玩家可查看牌桌信息。","退出（§10.5）：好友房退出、解散、特殊解散复用玄武 2.0 通用流程。"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-004","GAME-RULE-027","GAME-RULE-028"],"open_questions":[]},{"id":"GAME-RULE-031","type":"game_rule","name":"摸牌时机与流程","status":"proposed","authority":"fixed","description":"轮到自己且上一家已出牌、无人碰杠胡时从牌堆摸1张，摸牌与上家出牌同时进行，随后进入出牌阶段","source":{"kind":"original","document":"source/03-打牌操作.md","section":"一、摸牌","page":null,"quote":"轮到自己，且上一家已出牌、无人碰 / 杠 / 胡"},"preconditions":["轮到该玩家行牌","上一家已出牌且无人对这张牌碰、杠、胡"],"inputs":["上一 03-打牌操作.md","section":"5.1 杠的类型（含别名）","page":null,"quote":"玩家碰牌后，除当前回合不可杠，后续摸到相同的牌 → 开杠"},"preconditions":[],"inputs":["他人出牌事件（直杠）或玩家摸/补牌事件（明杠、暗杠）"],"outputs":["对应类型开杠，进入补牌流程"],"business_rules":["直杠（别名大明杠）：别人打出某张牌，玩家手中存在相同的3张开杠，无前置条件","明杠（别名补杠/加杠）：玩家碰牌后，除当前回合不可杠，后续摸到相同的牌开杠，前置条件为必须先碰过","暗杠：非碰牌后的出牌阶段，手上有4张相同牌开杠，无前置条件","术语陷阱：本玩法的「明杠」等于通用麻将的补杠，不是「手中3张+他人打出第4张」的直杠"],"normal_flow":["满足对应类型条件 -> 开杠 -> 杠分结算 -> 补牌（见 GAME-RULE-045）","碰牌副露状态 -> 摸到第4张 -> 明杠（补杠）成立"],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-038","GAME-RULE-041","GAME-RULE-045","GAME-FR-004"],"open_questions":[]},{"id":"GAME-RULE-041","type":"game_rule","name":"杠分与结算","status":"proposed","authority":"fixed","description":"直杠点炮者付2倍底分、明杠他家各付1倍、暗杠他家各付2倍；杠分实时结算，流局与荒庄均不返还","source":{"kind":"original","document":"source/03-打牌操作.md","section":"5.2 杠分","page":null,"quote":"打出牌的玩家支付直杠玩家 2 倍底分"},"preconditions":["玩家完成开杠"],"inputs":["杠类型（直杠/明杠/暗杠）"],"outputs":["对应玩家间杠分转移"],"business_rules":["直杠：打出牌的玩家支付直杠玩家2倍底分","明杠：其他玩家各支付补杠玩家1倍底分","暗杠：其余玩家各支付暗杠玩家2倍底分","杠分实时结算，小局结束时不额外再算","流局未听牌，不需要返还杠分","荒庄后杠分不退还"],"normal_flow":["开杠 -> 按类型即时结算杠分 -> 补牌"],"exception_flow":["流局未听牌 -> 杠分不返还；荒庄 -> 杠分不退还"],"state_transitions":[],"ui_refs":[],"test_refs":["GAME-TC-006"],"dependencies":["GAME-RULE-040","GAME-RULE-042","GAME-FR-004"],"open_questions":[]},{"id":"GAME-RULE-042","type":"game_rule","name":"杠上杠连杠倍数","status":"proposed","authority":"fixed","description":"杠后摸到的牌继续杠或补牌打出的牌被别人杠形成连杠，杠分按基础杠分乘2的连杠次数减1次方，无人杠则清零","source":{"kind":"original","document":"source/03-打牌操作.md","section":"5.3 杠上杠（连杠）","page":null,"quote":"本次杠分 = 基础杠分 × 2^(连续杠次数 − 1)"},"preconditions":["存在已发生的杠（连杠链起点）"],"inputs":["杠牌后摸到的牌继续杠，或补牌后打出的牌被别人杠"],"outputs":["本次杠分按连杠倍数放大"],"business_rules":["触发：玩家杠牌后摸到的牌继续杠；或补牌后打出的牌被别人杠","公式：本次杠分 = 基础杠分 × 2^(连续杠次数 − 1)","跨玩家：连杠可在不同玩家手中连续（A杠 -> 打出一张 B杠 -> B打出一张 C杠，仍算连杠）","中断：玩家补牌后打出一张无人杠，本次连杠结束，倍数清零重新计算","与胡分关系：杠上杠仅计算杠分，之前的杠分不转移；触发杠上花/杠上炮/抢杠胡时这些番型倍数不跟随杠上杠翻倍，走初始值（初始2，可勾选为4）"],"normal_flow":["A补杠(1倍) -> A杠上摸牌继续暗杠(2倍收4分) -> A再打出一张被B直杠(4倍B收8分) -> B打出无人杠 -> 连杠结束倍数重置"],"exception_flow":["补牌后打出的牌无人杠 -> 连杠结束，倍数清零重新计算"],"state_transitions":[],"ui_refs":[],"test_refs":["GAME-TC-006"],"dependencies":["GAME-RULE-040","GAME-RULE-041","GAME-RULE-045","GAME-RULE-047"],"open_questions":[]},{"id":"GAME-RULE-043","type":"game_rule","name":"回手杠限制","status":"proposed","authority":"open","description":"碰过的牌本小局不能再明杠的两条限制；原文标注为配置项但创房表无对应开关","source":{"kind":"original","document":"source/03-打牌操作.md","section":"5.4 杠牌限制（五条）","page":null,"quote":"手上有 3 张一样的牌，别人打出时如果选择碰，则这张牌本小局不能再明杠。"},"preconditions":["玩家曾对某张牌选择碰"],"inputs":["后续摸到或他人打出同张第4张牌"],"outputs":["该牌本小局不可明杠"],"business_rules":["限制①：手上有3张一样的牌，别人打出时如果选择碰，则这张牌本小局不能再明杠","限制②：已经碰过的牌，摸到第四张时必须立刻杠，否则本小局这张牌不能再明杠"],"normal_flow":[],"exception_flow":["碰过的牌摸到第4张未立刻杠 -> 本小局该牌不能再明杠"],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-038","GAME-RULE-040"],"open_questions":["原需求 §2.2.2 给【回手杠】标注（配置），但三张创房表均无对应开关项；开关名与默认值需求未给出，本文档按「可配置的规则层约束」登记，不自行虚构开关，「回手杠」为文档自拟定位标识名"]},{"id":"GAME-RULE-044","type":"game_rule","name":"杠的其余限制","status":"proposed","authority":"fixed","description":"牌堆剩0不可杠、亮倒后未扣牌不可杠、未亮倒时危牌不可明杠而直杠暗杠可以、亮倒后仅扣下刻子可杠","source":{"kind":"original","document":"source/03-打牌操作.md","section":"5.4 杠牌限制（五条）","page":null,"quote":"牌堆剩余牌为 0 时，不可杠。"},"preconditions":[],"inputs":["玩家发起杠请求（任意类型）"],"outputs":["杠被放行或按限制拦截"],"business_rules":["剩余牌限制：牌堆剩余牌为0时，不可杠","亮倒限制：玩家亮倒后手牌中未扣下的牌不可杠；手中有4张牌扣下3张也不可杠（哪怕摸到维持听牌的牌）；已经碰的牌明杠不受此限制（仍受剩余牌、回手杠、危牌限制）","危牌限制：未亮倒时危牌不可明杠（补杠）；直杠和暗杠可以","扣牌相关：亮倒后仅扣下的刻子可杠；未扣下的刻子无论别人打出还是自己摸到都不可杠；扣下的刻子若第4张在自己手中且已亮出，仍不可杠（会改牌）"],"normal_flow":[],"exception_flow":["牌堆剩余牌为0 -> 杠请求被拦截","亮倒玩家尝试杠未扣下的牌 -> 拦截","未亮倒玩家尝试用危牌补杠 -> 拦截"],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-040","GAME-RULE-043","GAME-RULE-054","GAME-RULE-057"],"open_questions":[]},{"id":"GAME-RULE-045","type":"game_rule","name":"补牌规则","status":"proposed","authority":"fixed","description":"杠牌之后从牌堆倒序摸1张视为摸牌，剩余牌数额外减1张，本玩法不展示牌墙","source":{"kind":"original","document":"source/03-打牌操作.md","section":"六、补牌","page":null,"quote":"从牌堆倒序摸一张牌，视为摸牌"},"preconditions":["玩家刚完成杠牌"],"inputs":["杠牌完成事件"],"outputs":["玩家补入1张牌（视为摸牌），牌堆剩余牌数额外减1"],"business_rules":["时机：杠牌之后","来源：从牌堆倒序摸一张牌，视为摸牌（与正常顺序摸牌的区别在于取牌方向）","消耗：剩余牌数额外减1张","位置：手牌最右侧，与一般手牌间隔1/4牌距离，从上往下缓冲落下展示","牌墙：本玩法不展示牌墙"],"normal_flow":["开杠 -> 杠分结算 -> 从牌堆倒序摸1张 -> 剩余牌数额外减1 -> 进入出牌/操作阶段","杠成立 -> 补牌 -> 出牌阶段"],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-040","GAME-RULE-042"],"open_questions":["剩余牌数额外减1张：被额外减去的牌的去向与可见性原文未说明（本玩法不展示牌墙）"]},{"id":"GAME-RULE-046","type":"game_rule","name":"基础胡牌方式","status":"proposed","authority":"fixed","description":"自摸（摸补到牌成胡）、点炮（他家打出牌成胡且受番数门槛限制）、抢杠胡（他家补杠牌为己胡牌，倍数x2可多人抢杠）","source":{"kind":"original","document":"source/03-打牌操作.md","section":"7.1 胡牌方式","page":null,"quote":"其他玩家明杠（补杠）的牌恰为自己的胡牌"},"preconditions":["手牌满足胡牌规则且通过胡牌限制层（见 GAME-RULE-048）"],"inputs":["摸牌/补牌事件（自摸）、他家出牌事件（点炮）、他家明杠事件（抢杠胡）"],"outputs":["胡牌成立，进入结算"],"business_rules":["自摸：摸/补到一张牌，手牌符合胡牌规则；界面按钮【自摸】+【过】；倍数基础","点炮（捉炮胡）：其他玩家打出的牌符合胡牌规则；界面按钮【胡】+【过】；倍数基础，番型乘加倍项不大于1时不可捉炮","抢杠胡：其他玩家明杠（补杠）的牌恰为自己的胡牌；界面按钮【胡】+【过】；倍数x2（勾选「杠上花/炮*4」后x4，需求 §2.3.1.2 三项并列受同一勾选控制）；可多人抢杠胡一家"],"normal_flow":["触发事件 -> 满足胡牌规则且过限制层 -> 玩家点击胡类按钮 -> 胡牌成立","他家补杠等待抢杠响应 -> 抢杠胡成立 -> 结算"],"exception_flow":["番型乘加倍项不大于1 -> 不可捉炮，只能自摸"],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-045","GAME-RULE-048","GAME-FR-005"],"open_questions":[]},{"id":"GAME-RULE-047","type":"game_rule","name":"特殊胡牌方式","status":"proposed","authority":"fixed","description":"杠上花/杠上炮/海底捞/海底炮均x2（部分勾选后x4），一炮多响各家分别计分","source":{"kind":"original","document":"source/03-打牌操作.md","section":"7.1 胡牌方式","page":null,"quote":"打出一张牌导致多个玩家胡牌"},"preconditions":["对应触发场景成立（杠后补牌、摸到最后一张牌等）"],"inputs":["杠后补牌、最后一巡摸打、一张牌触发多家胡"],"outputs":["按对应番型倍数计分"],"business_rules":["杠上花：开杠后补到的牌导致胡牌，倍数x2（勾选后4倍）","杠上炮：开杠后补牌打出的牌点炮，倍数x2（勾选后4倍）","海底捞：摸到最后一张牌后胡牌，倍数x2（勾选后生效）","海底炮：摸到最后一张牌后，打出的牌点炮，倍数x2（勾选后生效）","一炮多响：打出一张牌导致多个玩家胡牌，各家分别计分"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":["GAME-TC-008"],"dependencies":["GAME-RULE-045","GAME-RULE-046","GAME-FR-006"],"open_questions":[]},{"id":"GAME-RULE-048","type":"game_rule","name":"胡牌限制层","status":"proposed","authority":"fixed","description":"番型合法之外还有5层限制任一拦截即不可胡：番数门槛、危牌、亮倒限制、漏胡、操作优先级","source":{"kind":"original","document":"source/03-打牌操作.md","section":"7.2 胡牌限制层","page":null,"quote":"番型合法之外，还有 5 层限制，任一拦截即不可胡"},"preconditions":["番型判定已通过（番型与限制层为AND关系，判定顺序不影响结果）"],"inputs":["候选胡牌请求"],"outputs":["胡牌放行或被对应限制层拦截"],"business_rules":["限制层1（番数门槛）：番型乘加倍项大于1才可捉炮；只有1倍时只能自摸","限制层2（危牌）：见 GAME-RULE-033；手中全是危牌时例外","限制层3（亮倒限制，可选）：勾选「胡牌必须亮倒」后仅亮倒状态才能胡；勾选「双亮」后3人时已有2人亮倒，第三人免亮可胡（自摸、点炮均可）","限制层4（漏胡）：见 GAME-RULE-049","限制层5（操作优先级）：吃胡 / 自摸 / 抢杠胡 > 碰 / 杠，见 GAME-RULE-039","限制层（否决条件）与番型（计分条件）为AND关系，判定顺序不影响结果"],"normal_flow":[],"exception_flow":["任一限制层拦截 -> 不可胡"],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-033","GAME-RULE-039","GAME-RULE-049","GAME-RULE-053"],"open_questions":[]},{"id":"GAME-RULE-049","type":"game_rule","name":"漏胡规则","status":"proposed","authority":"fixed","description":"可胡不胡即为漏胡，漏胡玩家摸牌前不可胡牌，摸牌后解除（含杠后补牌），并出现1.5秒浮动提示","source":{"kind":"original","document":"source/03-打牌操作.md","section":"十三、过手规则","page":null,"quote":"漏胡玩家在摸牌前不可胡牌；漏胡状态在摸牌后解除（含杠后补牌）。"},"preconditions":["玩家曾处于可胡状态并选择不胡"],"inputs":["玩家放弃胡牌的选择"],"outputs":["漏胡状态生效；随后摸牌时解除"],"business_rules":["定义：玩家可胡牌时选择不胡牌，即为漏胡（过胡）","解除时机：漏胡状态在摸牌后解除，含杠后补牌","漏胡提示：触发漏胡不胡后，出现浮动提示「当前未过手，无法胡牌」，1.5秒后消失"],"normal_flow":["可胡不胡 -> 进入漏胡状态 -> 玩家摸牌（含补牌） -> 漏胡解除","可胡状态 -> 过 -> 漏胡状态 -> 摸牌 -> 状态解除"],"exception_flow":["漏胡期间再遇可胡牌 -> 不可胡，提示「当前未过手，无法胡牌」1.5秒"],"state_transitions":[],"ui_refs":[],"test_refs":["GAME-TC-003"],"dependencies":["GAME-RULE-048"],"open_questions":[]},{"id":"GAME-RULE-050","type":"game_rule","name":"多操作状态按钮优先级","status":"proposed","authority":"fixed","description":"多状态时按钮从左至右按碰杠亮胡或自摸过顺序显示； 7","GAME-RULE-056"],"open_questions":[]},{"id":"GAME-RULE-053","type":"game_rule","name":"亮倒权限触发","status":"proposed","authority":"fixed","description":"打出一张非危牌后可听牌即触发亮倒权限；手牌全是危牌时同样可触发；自摸时每次都展示亮的权限","source":{"kind":"original","document":"source/03-打牌操作.md","section":"10.1 权限触发","page":null,"quote":"触发亮倒权限，玩家可选择是否亮倒"},"preconditions":["玩家摸牌或补牌后处于出牌决策阶段"],"inputs":["当前手牌听牌状态判定结果"],"outputs":["出现【亮】+【过】按钮（可选择是否亮倒）"],"business_rules":["条件1：打出一张非危牌后可听牌，触发亮倒权限，玩家可选择是否亮倒","条件2：手牌中全是危牌时，去掉「非危牌」的限制，同样可触发","条件3：自摸时每次都会展示亮的权限，包括自摸时","展示：摸牌或补牌后若满足亮倒条件，出现【亮】+【过】按钮；听牌标签正常展示"],"normal_flow":["摸/补牌 -> 听牌判定满足亮倒条件 -> 【亮】+【过】按钮出现 -> 玩家选择","普通出牌状态 -> 点击【亮】 -> 亮倒状态（见 GAME-RULE-056）"],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-033","GAME-RULE-046","GAME-FR-007"],"open_questions":[]},{"id":"GAME-RULE-054","type":"game_rule","name":"亮倒后行为限制","status":"proposed","authority":"fixed","description":"亮倒后亮出所有手中牌、只能摸打且必须维持听牌不可改牌、胡的牌成为他家危牌、仅扣下刻子可杠","source":{"kind":"original","document":"source/03-打牌操作.md","section":"10.2 亮倒后的行为限制","page":null,"quote":"只能摸打，且亮倒的牌必须维持听牌"},"preconditions":["玩家已处于亮倒状态"],"inputs":["摸牌/补牌/出牌/杠请求"],"outputs":["按亮倒限制放行或拦截"],"business_rules":["明牌：亮出所有手中牌","不可换牌：只能摸打，且亮倒的牌必须维持听牌（源 §2.1：亮倒后不可改牌，只能打出维持听牌的牌）","危牌产生：胡的牌成为其他未亮倒用户的【危牌】；玩家亮倒后自己的危牌标签去掉","杠的限制：仅可对已扣下的刻子进行直杠/补杠；暗杠仅可摸到第4张暗杠，第4张在手牌中不可暗杠"],"normal_flow":["亮倒 -> 摸牌 -> 打出维持听牌的牌","普通状态 -> 亮倒状态（单向，局内不可逆）"],"exception_flow":["尝试打出后不维持听牌的牌 -> 拦截","尝试杠未扣下的牌 -> 拦截（见 GAME-RULE-044）"],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-033","GAME-RULE-044","GAME-RULE-053","GAME-RULE-057","GAME-FR-007"],"open_questions":[]},{"id":"GAME-RULE-055","type":"game_rule","name":"亮倒计分","status":"proposed","authority":"fixed","description":"亮倒状态输赢均计算亮倒番型分x2且不影响加分项；对亮仅算一次x2，勾选「对亮x2」时算两个共4倍","source":{"kind":"original","document":"source/03-打牌操作.md","section":"10.3 亮倒计分","page":null,"quote":"亮倒状态下，输 / 赢时均计算亮倒，番型分 ×2，不影响加分项。"},"preconditions":["结算涉及亮倒状态的玩家"],"i tions":[]},{"id":"GAME-RULE-058","type":"game_rule","name":"多组扣牌与扣后听牌","status":"proposed","authority":"fixed","description":"可同时扣多组刻子但需再次检测剩余手牌仍满足条件；扣牌后按剩余亮出的牌决定听牌","source":{"kind":"original","document":"source/03-打牌操作.md","section":"11.1 触发与判定","page":null,"quote":"玩家可同时扣下多组刻子，但需再次检测：扣多组后的剩余手牌是否仍满足「打出一张非危牌后可听牌」。"},"preconditions":["扣牌界面存在多个可扣候选"],"inputs":["玩家多选扣牌结果"],"outputs":["最终扣下集合与扣后听牌集合"],"business_rules":["多组同时扣下需再次检测：扣多组后的剩余手牌仍满足「打出一张非危牌后可听牌」","扣牌与听牌：扣牌后按剩余亮出的牌决定听牌","原文示例：手牌11 56667听1和6，扣住6后手牌变为11 57，此时仅听6"],"normal_flow":["选择完成 -> 复检剩余牌可听 -> 界面消失，切换到「亮倒-打牌」界面"],"exception_flow":["点击【选择完成】后判断不可听牌 -> 取消所有选中，弹出提示「当前扣牌没有胡口！」"],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-057","GAME-FR-008"],"open_questions":[]},{"id":"GAME-RULE-059","type":"game_rule","name":"理牌规则","status":"proposed","authority":"fixed","description":"每个打牌回合结束出牌后重新理牌，将刚摸进且未打出的牌以插入式或平移式插入手牌","source":{"kind":"original","document":"source/03-打牌操作.md","section":"十二、理牌","page":null,"quote":"每个打牌回合结束（出牌后）重新理牌，将刚摸进且未打出的牌插入至手牌中。"},"preconditions":["本回合玩家已出牌"],"inputs":["摸进且未打出的牌"],"outputs":["手牌重新排列，摸进的牌插入手牌"],"business_rules":["插入式：有牌需要插入原手牌第1张至倒数第2张位置时，打出的牌位置空出后要插入的牌变斜提起，手牌中的牌自动往打出去的空位对齐移动并空出要插入的位置，变斜的牌提起后平移到要插入的位置上方随后变竖落下","平移式：打出的牌非最右侧隔开的牌且其他牌无需改变排序时，打出去的牌的空位由右侧的牌往左平移，最右侧隔开的牌以同样速度往左靠，最终排靠在一起","插入位置：插入的牌已有多张时随机插入位置；仅有一张时根据牌的排序顺序插入"],"normal_flow":["出牌 -> 空位出现 -> 摸进的牌按插入式或平移式归位"],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-031"],"open_questions":[]},{"id":"GAME-RULE-060","type":"game_rule","name":"过碰过杠","status":"proposed","authority":"open","description":"过碰/过杠后轮到自己回合前不可再碰/杠同张，按漏胡同一「过手至摸牌解除」口径推导","source":{"kind":"original","document":"source/03-打牌操作.md","section":"十三、过手规则","page":null,"quote":"过碰后、轮到自己回合前，其他玩家再打出同张牌时不可再碰。"},"preconditions":["玩家曾对某张牌选择过（碰或杠）"],"inputs":["过之后他家再打出同张牌"],"outputs":["该玩家本轮不可再碰/杠同张"],"business_rules":["过碰：过碰后、轮到自己回合前，其他玩家再打出同张牌时不可再碰","过杠：过杠后、轮到自己回合前不可再杠同张，推导依据同过碰"],"normal_flow": itions":[],"ui_refs":[],"test_refs":[],"dependencies":["GAME-RULE-033","GAME-RULE-061"],"open_questions":[]},{"id":"GAME-RULE-071","type":"game_rule","name":"平胡（F01）","status":"proposed","authority":"fixed","description":"4副面子加1对将且含至少1副顺子的基础结构番型，结构维度基准档，1倍。","source":{"kind":"original","document":"source/04-番型.md","section":"2.1 平胡（F01 · 1 倍）","page":null,"quote":"| **4 副 + 1 对结构** | 14 张可拆为 4 副面子 + 1 对将 | 改看**七对维度**（按龙数取档：七对 4 / 龙七对 8 / 双龙七对 32 / 三龙七对 128 倍）|"},"preconditions":["玩家已形成14张和牌牌型"],"inputs":["手牌与碰杠牌区共14张牌面"],"outputs":["番型判定结果","牌型分倍数"],"business_rules":["F01 平胡=1倍，结构维度基准档；判定条件为14张可拆为4副面子+1对将，且4副面子中至少1副顺子","4副全为刻子/杠（无顺子）时同属结构维度取高，改判碰碰胡（F02，2倍），平胡不另计","与清一色（+4倍）、小三元（+4倍）、大三元（+8倍）、卡五星（+2倍）、明四归/暗四归跨维度叠加；与七对类跨结构取分值较高者","平胡+手抓一结构上不可达：本玩法不能吃，副露只能是碰/杠，4副面子全在碰杠区时必为全刻形，不可能含顺子","平胡不要求门清，有碰/杠可正常计；亮倒为加倍项（J01，2倍），不影响平胡本身判定"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":[],"open_questions":[]},{"id":"GAME-RULE-072","type":"game_rule","name":"碰碰胡（F02）","status":"proposed","authority":"fixed","description":"4副刻子/杠加1对将的全刻结构番型，2倍（创房可调4倍，高分玩法下8倍）。","source":{"kind":"original","document":"source/04-番型.md","section":"2.2 碰碰胡（F02 · 2 倍）","page":null,"quote":"| **全刻形** | 4 副面子**全为刻子 / 杠，无顺子** | 改判 **平胡（1 倍）** |"},"preconditions":["玩家已形成14张和牌牌型"],"inputs":["手牌与碰杠牌区共14张牌面"],"outputs":["番型判定结果","牌型分倍数"],"business_rules":["F02 碰碰胡=2倍（创房可调4倍；高分玩法下8倍）；判定条件为4副面子全为刻子/杠、无顺子","含任一顺子即破坏全刻形，同维度取高改判平胡（F01，1倍），不叠加","跨维度叠加：小三元（2+4=6倍）/大三元（2+8=10倍）/清一色（2+4=6倍）/手抓一（需求明示叠加，高分玩法下也叠加，2+2=4倍）/卡五星/明暗四归","与七对类跨结构取分值较高者","碰出的刻子计入4副；高分玩法下为换档番型（2倍变8倍）"],"normal_flow":[],"exception_flow":[],"state_transitions":[],"ui_refs":[],"test_refs":[],"dependencies":[],"open_questions":[]},{"id":"GAME-RULE-073","type":"game_rule","name":"小三元（F07）","status":"proposed","authority":"fixed","description":"中发白任意两种为刻子或杠、剩余一种作对将的三元番型，4倍。","source":{"kind":"original","document":"source/04-番型.md","section":"2.3 小三元（F07 · 4 倍）","page":null,"quote":"| **中 / 发 / 白两刻**
