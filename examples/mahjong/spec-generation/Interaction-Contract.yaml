    data_effects: [胡牌玩家锁定胡牌，点炮玩家标记为放炮方, 收分方向：胡牌玩家仅向点炮玩家收取胡分（漂分、坎分按捉炮口径仅收点炮玩家）, 进入结算流水线 S1~S8；点炮亮倒玩家且勾选包牌时走 S10 包牌]
    ui_effects: [【胡】按钮上显示本次胡的牌与倍数（触发封顶时显示封顶倍数与【封顶】标识）, 摊牌、「胡」文字、「对局结束」动画、番型动画与飘分, 番数不足时浮动提示「番数不足，无法捉炮！」1.5 秒]
    failure_handling: [番型×加倍项小于等于 1 时拒绝捉炮并提示「番数不足，无法捉炮！」（加分项是否计入门槛未明示，GDD-U13 待确认，按公式字面实现）]
