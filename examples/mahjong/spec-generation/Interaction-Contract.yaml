    test_scenarios: [平胡 1 倍无加倍项时他人点炮点胡被拒并提示番数不足, 平胡 1 倍加亮倒×2 时可捉炮, 漏胡玩家对同张点胡被拒且摸牌后恢复, 托管开启下点炮机会超时断言默认胡]
    source_references: [SRC-274, SRC-468, SRC-472, SRC-091, SRC-415, SRC-416, SRC-417, SRC-418, SRC-499, SRC-492, SRC-493, SRC-422, SRC-283, SRC-405, SRC-406, SRC-407, SRC-093, SRC-429, SRC-430, SRC-431, SRC-434, SRC-950, SRC-296, SRC-299]
