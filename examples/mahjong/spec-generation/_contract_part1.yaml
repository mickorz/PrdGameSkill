# Interaction-Contract 前半（Part 1/2）：卡五星（好友房）业务事件与状态转移契约（YAML）
#
# 结构风格参照 game-ui-design-workflow (MIT License)
# https://github.com/mickorz/game-ui-design-workflow templates/contracts/screen-contract.yaml
#
# 覆盖范围：对局前链路（创房配置提交/入座/打漂/定庄/摇骰上楼/发牌/理牌）与行牌核心操作
# （摸牌/补牌/提牌/出牌三方式/碰/杠三类/多杠选择/过/漏胡/托管/自动摸打/杠上杠倍率），编号 CT-001~CT-024。
# 胡牌（自摸/点炮）、亮倒/扣牌、听牌提示弹窗、对局结束与结算链路契约由后半文件（CT-050 起）续写，本文件不写。
#
# 约定：
# - 本契约是平台无关的业务行为定义，不绑定任何具体引擎或组件库实现，不出现引擎 API 名，不写技术实现代码。
# - confirmation_status 只允许 draft / pending-human / confirmed-human。
#   confirmed-human 必须由人工确认后标记，AI 不得自行标记。
# - 不确定的事件、状态和数据变化留空或标 pending，不得擅自补全。
# - 事实来源：spec-generation/source-analysis.md（SRC-xxx）、Interaction.md（INT-xxx）、
#   PRD.md（PRD-xxx）、GDD.md（GDD-R/GDD-D/GDD-U-xxx）。

schema_version: 1
project_id: mahjong
updated_at: "2026-11-09"
contracts:
  - contract_id: CT-001
    related_requirement_ids: [INT-001, INT-002, INT-003, INT-004, INT-005, INT-006, INT-007, INT-008, PRD-001, PRD-002, PRD-003, PRD-004, PRD-005, PRD-006, PRD-007, PRD-008, PRD-009, PRD-010]
    trigger: 房主点击【创建房间】
    preconditions:
      - 创房面板已打开，全部配置项存在默认值兜底（SRC-627），不存在配置为空的空态
      - 面板全量默认值证据链为截图 IMG-601，需人工提供文本补充（AMB-601/GDD-U01，pending）
    guards:
      - 高分玩法勾选时，卡五星*4/碰碰胡*4/杠上花炮*4（杠开）/三元七对*8 四项已置灰且自动取消勾选，取消高分玩法后恢复可选
      - 「胡牌必须亮倒」与「双亮」互斥，不可同勾（一项勾选时另一项置灰不可勾）
      - 人数为 2 人时「包牌」「双亮」置灰且取消勾选，切 3 人恢复可选（默认均不选）；买马选「不买马」时马数隐藏
    state_transition:
      from: 创房面板配置中
      to: 牌桌主界面等待入座
    data_effects:
      - 按当前面板配置创建房局参数（人数/局数/模式/封顶/漂分/买马/马数/频道/亮倒组/规则组/定庄）
      - 创建成功后进入等待入座，后续加入玩家按逆时针顺序入座（见 CT-002）
    ui_effects:
      - 离开创房面板，进入页面 2 牌桌主界面等待入座态
    failure_handling:
      - 创建失败：留在面板并提示；提示文案与重试逻辑原文未定义（待确认，pending）
    timeout_handling: ""
    mutual_exclusion:
      - 高分玩法与四项高分番型开关置灰互斥联动
      - 胡牌必须亮倒与双亮互斥不可同勾
      - 2 人与包牌/双亮置灰互斥（3 人房勾选包牌/双亮后改 2 人开局则规则自动失效，以人数为准）
    test_scenarios:
      - 勾选高分玩法后四项变灰且取消勾选，取消后恢复可选
      - 勾选「胡牌必须亮倒」后「双亮」不可勾，取消后恢复
      - 人数切 2 人时包牌/双亮置灰且取消勾选，切 3 人恢复
      - 全默认配置直接点击【创建房间】可创建成功并进入等待入座
    source_references: [SRC-712, SRC-713, SRC-627, SRC-658, SRC-654, SRC-632, SRC-683, SRC-677]
    confirmation_status: draft

  - contract_id: CT-002
    related_requirement_ids: [INT-001, PRD-011, GDD-R016]
    trigger: 玩家加入房间（加入入口属外部流程，本契约按系统事件登记）
    preconditions:
      - 房局已创建且座位未满（2 人房/3 人房）
    guards:
      - 座位固定：整个房局期间座位不随局变动
    state_transition:
      from: 等待入座（空位）
      to: 已入座（座位分配完成，人齐后触发开局）
    data_effects:
      - 按加入顺序逆时针分配座位并记录；座位满员后人齐开局
    ui_effects:
      - 头像区按逆时针顺序填入头像；2 人房固定一上一下（下方自己/上方对家，方位东/南）；3 人房固定左/下/右（下方自己/左侧上家/右侧下家，方位东/南/西）
    failure_handling:
      - 座位满员后的加入处理原文未定义（待确认，pending）
    timeout_handling: ""
    mutual_exclusion:
      - 座位与方位一经确定不随小局变动，直到重新匹配重置
    test_scenarios:
      - 3 人房按加入顺序落座位置断言正确（下家/自己/上家）
      - 2 人房上下布局断言正确（下方自己/上方对家）
      - 完成多小局后座位不发生变动
    source_references: [SRC-021, SRC-105, SRC-106, SRC-107, SRC-631, SRC-712]
    confirmation_status: draft

  - contract_id: CT-003
    related_requirement_ids: [INT-020, PRD-003, PRD-013, GDD-U12]
    trigger: 玩家点击漂选项完成选漂（选项集：不漂/漂1/漂2/漂5/漂10）
    preconditions:
      - 小局开局且走选漂模式（漂分配置=自由漂为每小局；漂分配置=首局定漂仅大局第一小局）
    guards:
      - 漂分配置为固定漂或不漂时不出现选漂 UI，本契约不执行
    state_transition:
      from: 选漂进行中
      to: 漂 UI 飞行（1 秒）后进入打骰子+发牌+定庄
    data_effects:
      - 该玩家漂值确定并记录；漂数与所选漂值的映射待确认（GDD-U12，pending）
    ui_effects:
      - 选漂 UI 瞬间出现；未选漂玩家主视角显示【选漂中...】；选漂结果出现于头像旁且其他玩家直接可见
      - 最后一个玩家选漂完成的同时：选漂结果出现→所有玩家选漂文字缩小移动到头像旁漂 UI 位置（漂 UI 飞行 1 秒）→开始打骰子
    failure_handling: []
    timeout_handling: 选漂超时（玩家未选漂）的默认行为原文未定义（待确认，pending）
    mutual_exclusion:
      - 与固定漂（无选漂环节直接展示漂结果，见 CT-004）按创房配置互斥
      - 首局定漂第二小局起无选漂 UI（同固定漂）
    test_scenarios:
      - 自由漂下每个小局均出现选漂 UI；首局定漂下仅第一小局出现、第二小局起走固定漂流程
      - 最后一人完成选漂后漂 UI 飞行 1 秒并开始打骰子
      - 未选漂玩家显示【选漂中...】直至完成
    source_references: [SRC-768, SRC-769, SRC-770, SRC-771, SRC-772, SRC-684]
    confirmation_status: draft

  - contract_id: CT-004
    related_requirement_ids: [PRD-003, PRD-013, GDD-D24]
    trigger: 系统事件——小局开局且漂分配置=固定漂（含首局定漂第二小局起）
    preconditions:
      - 创房漂分配置为固定漂（下拉漂1/漂2/漂5/漂10；整体默认「固定漂 2」为需求明文裁决）
    guards:
      - 漂分配置非固定漂时不执行
    state_transition:
      from: 待开局（打漂环节）
      to: 漂结果已展示并同时开始打骰子
    data_effects:
      - 全体玩家漂值按固定漂数生效并记录
    ui_effects:
      - 开局同时头像旁直接出现漂结果标签（【漂0】【漂1】【漂2】【漂5】【漂10】），无过程动画、无选漂 UI
    failure_handling: []
    timeout_handling: 无玩家交互，无超时
    mutual_exclusion:
      - 与选漂 UI（CT-003）按漂分配置互斥
      - 不漂配置下全局无漂 UI 且不计漂分
    test_scenarios:
      - 固定漂开局无选漂 UI，头像旁直接出现漂结果并同时开始打骰子
      - 不漂配置下无任何漂 UI
    source_references: [SRC-767, SRC-629, SRC-739, SRC-766]
    confirmation_status: draft

  - contract_id: CT-005
    related_requirement_ids: [PRD-008, PRD-014, GDD-R013, GDD-R014, GDD-U03]
    trigger: 系统事件——首局按定庄配置产生庄家，于发牌开始后、骰子滚动停下时展示庄标
    preconditions:
      - 本房局第一小局；定庄配置已确定（随机庄/房主庄；默认房主庄的默认值唯一证据为截图，需人工提供文本补充 GDD-U03）
    guards:
      - 第二小局起本契约不适用，按轮庄规则（单个胡牌者庄/一炮多响点炮者庄/荒庄连庄/多人抢杠胡由补杠者庄）
    state_transition:
      from: 待开局
      to: 庄家已确定（庄标展示）
    data_effects:
      - 庄家标识写入对局数据；方位按庄=东、其余按人数逆时针依次南/西分配
    ui_effects:
      - 庄家头像直接出现【庄】标志（无过程动画）；他人视角庄家按 14 张样式摆放
    failure_handling: []
    timeout_handling: ""
    mutual_exclusion:
      - 庄家唯一，庄标仅庄家展示
    test_scenarios:
      - 房主庄配置下首局房主为庄；随机庄配置下首局庄家随机
      - 庄标出现时机为骰子滚动停下时，无过程动画
      - 四种结束形态（单胡/一炮多响/荒庄/多人抢杠胡）后下一局庄家归属符合轮庄规则
    source_references: [SRC-623, SRC-674, SRC-017, SRC-118, SRC-119, SRC-120, SRC-181, SRC-182, SRC-183, SRC-717, SRC-718]
    confirmation_status: draft

  - contract_id: CT-006
    related_requirement_ids: [PRD-007, PRD-016, GDD-R017, GDD-R018, GDD-U09]
    trigger: 系统事件——发牌时显示两个骰子环绕转动；玩家拿齐所有手牌后停止转动并展现数字
    preconditions:
      - 进入开局发牌阶段
    guards:
      - 上楼展示需创房勾选「上楼」且本局符合上楼条件：同一大局内上一小局荒庄或一炮多响（倍数×2）；或本小局双骰同点（倍数×2）；两条件同时符合叠加最高×4
    state_transition:
      from: 发牌进行中
      to: 骰子数字展示（停留 1 秒）后骰子消失进入理牌
    data_effects:
      - 上楼倍数写入本小局加倍项；射程=番型×加倍项，不含马/漂/坎等加分项（GDD-R018）
    ui_effects:
      - 两骰环绕转动；停止后展现数字停留 1 秒后消失
      - 符合上楼条件时骰子停止的同时在骰子上方展示「上楼X2」或「上楼X4」
      - 骰子点数的游戏意义原文未明示（GDD-U09/AMB-106，待确认，pending）
    failure_handling:
      - 未勾选「上楼」或不符合条件时不展示上楼文案（空态）
    timeout_handling: 骰子展示停留 1 秒后自动消失（系统固定时序，非玩家操作超时）
    mutual_exclusion:
      - 上楼两触发条件同局叠加最高×4
      - 抢杠胡不触发上楼（GDD-D07）
    test_scenarios:
      - 上局荒庄→上楼X2；上局一炮多响→上楼X2；本局双骰同点→上楼X2；两条件同触发→上楼X4
      - 未勾选上楼时不展示；骰子停留 1 秒后消失
    source_references: [SRC-720, SRC-729, SRC-730, SRC-022, SRC-023, SRC-024, SRC-125, SRC-135]
    confirmation_status: draft

  - contract_id: CT-007
    related_requirement_ids: [PRD-018, GDD-R002, GDD-R003, GDD-R004, GDD-R019]
    trigger: 系统事件——打漂环节结束（固定漂/不漂开局直接）后开始发牌，全桌同步
    preconditions:
      - 庄家已确定；发牌从庄家位开始逆时针
    guards: []
    state_transition:
      from: 打骰子+发牌环节
      to: 手牌发完（庄 14 张、闲家 13 张）
    data_effects:
      - 发牌序列：每人 4 张共 3 轮→每人 1 张→庄家再 1 张；庄家 14 张、闲家 13 张（庄家批次表述矛盾 AMB-704、末位牌表述不一致 AMB-102，按批次描述采信并待原稿确认，pending）
      - 庄家最后一张置于手牌最右侧摸牌位；起手合计 3 人 40 张（发牌后余量 44）、2 人 27 张（余量 57）；发牌总时长 1 秒
    ui_effects:
      - 己方：每组牌扣桌面 0.1 秒→向上翻开 0.1 秒，4 组依次衔接；他人：仅出现动画、出现后立起无翻开；庄家末位牌与前 13 张有距离（置于摸牌位）
    failure_handling: []
    timeout_handling: ""
    mutual_exclusion: []
    test_scenarios:
      - 发牌后庄家手牌 14 张、闲家 13 张，庄家最后一张在摸牌位
      - 3 人房发牌后剩余张数显示 44、2 人房显示 57
      - 发牌总时长 1 秒且全桌获取节奏一致
    source_references: [SRC-742, SRC-743, SRC-744, SRC-745, SRC-746, SRC-747, SRC-748, SRC-749, SRC-140, SRC-141, SRC-142, SRC-143]
    confirmation_status: draft

  - contract_id: CT-008
    related_requirement_ids: [PRD-019, GDD-R025]
    trigger: 系统事件——所有玩家发牌完毕
    preconditions:
      - 发牌完成（庄 14 张、闲家 13 张）
    guards: []
    state_transition:
      from: 手牌发完（乱序）
      to: 理牌完成（按花色与牌点排序）
    data_effects:
      - 手牌按从左至右筒→条→中→发→白、同花色内 1~9 排序
    ui_effects:
      - 手牌扣下整理好顺序后立起，理牌时长 0.5 秒
    failure_handling: []
    timeout_handling: 理牌固定时长 0.5 秒（系统固定时序，非玩家操作超时）
    mutual_exclusion: []
    test_scenarios:
      - 理牌后手牌排序断言正确（字牌位于筒条之后）
      - 理牌时长 0.5 秒
    source_references: [SRC-750, SRC-751, SRC-752, SRC-753, SRC-754]
    confirmation_status: draft

  - contract_id: CT-009
    related_requirement_ids: [PRD-020, GDD-R020]
    trigger: 系统事件——上家打出牌的瞬间，下家自动摸牌
    preconditions:
      - 轮到该玩家摸牌：上一家已出牌且无人碰/杠/胡；牌堆剩余大于 0
    guards:
      - 该打出牌被任一玩家碰/杠/胡时不摸牌（响应优先于摸牌）
    state_transition:
      from: 回合等待
      to: 摸牌完成（进入出牌可操作态）
    data_effects:
      - 牌堆剩余减 1；手牌加 1；摸到的牌置于手牌最右侧摸牌位（与一般手牌间隔 1/4 牌距）
    ui_effects:
      - 上家出牌瞬间下家摸牌（肉眼同步）；摸牌从上往下缓冲落下 1 帧效果；牌河与碰牌区存在同牌则高亮显示
    failure_handling:
      - 牌堆剩余 0 且无人胡牌即荒庄（荒庄分支契约归后半部分）
    timeout_handling: ""
    mutual_exclusion:
      - 与碰/杠/胡响应互斥：他人打出牌可被响应时不摸牌；优先级吃胡/自摸/抢杠胡高于碰/杠
    test_scenarios:
      - 上家出牌瞬间下家摸牌，牌堆剩余减 1
      - 摸到的牌置于最右侧且与一般手牌间隔 1/4 牌距
      - 牌河/碰牌区有同牌时摸牌触发同牌高亮
    source_references: [SRC-202, SRC-203, SRC-204, SRC-205, SRC-773, SRC-774, SRC-775, SRC-763, SRC-164, SRC-502]
    confirmation_status: draft

  - contract_id: CT-010
    related_requirement_ids: [PRD-020, PRD-024, PRD-025, GDD-R011, GDD-R012]
    trigger: 系统事件——杠成立后自动补牌（杠动画播放同时摸牌）
    preconditions:
      - 该玩家杠成立；牌堆剩余大于 0
    guards:
      - 牌堆剩余 0 时不可杠（杠不成立，无补牌）
    state_transition:
      from: 杠结算中
      to: 补牌完成（视为摸牌，进入出牌阶段）
    data_effects:
      - 从牌堆倒序取 1 张；手牌加 1 并置于摸牌位（间隔 1/4 牌距）；牌堆剩余额外减 1；补牌视为摸牌
    ui_effects:
      - 补牌动画同摸牌（从上往下缓冲落下 1 帧效果）
    failure_handling: []
    timeout_handling: ""
    mutual_exclusion: []
    test_scenarios:
      - 每次杠后补牌 1 张置于摸牌位且牌堆剩余额外减 1
      - 杠动画播放的同时完成补牌
    source_references: [SRC-269, SRC-270, SRC-776, SRC-041, SRC-258]
    confirmation_status: draft

  - contract_id: CT-011
    related_requirement_ids: [INT-030, INT-031, INT-032, PRD-021]
    trigger: 玩家单击手牌牌面（提起）；点击非牌面空白处（放下）；在手牌上滑动（多张依次选择）
    preconditions:
      - 自己可操作且未托管
    guards:
      - 托管状态下无法提牌；每次仅 1 张牌处于提起态
    state_transition:
      from: 手牌静止
      to: 提起态（约 1/4 牌高）；提起态可经放下回到静止态
    data_effects:
      - 无手牌集合变化（仅选中状态变化）
    ui_effects:
      - 被提起牌上移约 1/4 牌高；滑动依次选择时手牌逐张提起放下、手指离开手牌时最终触达的牌提起
      - 提起打出可听牌时联动弹出听牌提示弹窗（页面 6 契约归后半部分）；提起单张牌时牌河与碰牌区同牌高亮
    failure_handling:
      - 点击该牌牌面不能将其放下（防误触），需点击非牌面空白处放下
    timeout_handling: 配置开启托管时出牌超时直接走托管出牌（见 CT-022），提牌操作不可用
    mutual_exclusion:
      - 提起态与出牌三方式联动：单击出牌开启时轮到自己出牌前提起的牌自动下落
    test_scenarios:
      - 单击牌面提起约 1/4 牌高且每次仅 1 张
      - 点牌面不能放下、点非牌面空白处放下
      - 滑动多张依次提起放下，手指离开时最终触达的牌保持提起
      - 托管状态下无法提牌
    source_references: [SRC-777, SRC-778, SRC-779, SRC-921, SRC-780, SRC-763, SRC-791]
    confirmation_status: draft

  - contract_id: CT-012
    related_requirement_ids: [INT-033, PRD-022, PRD-037]
    trigger: 玩家双击已提起的牌
    preconditions:
      - 轮到自己出牌；该牌已提起；双击出牌设置为开启（默认开启，已裁决口径）
    guards:
      - 危牌禁打：未亮倒玩家手中既有危牌也有非危牌时无法打出危牌（不计算碰杠牌区）；手中全是危牌时可打出任何危牌
    state_transition:
      from: 提起态
      to: 出牌动画→牌河更新→出牌后理牌
    data_effects:
      - 手牌减 1；该玩家牌河加 1（按出牌顺序从左至右摆放）；打出牌被碰/杠/胡时从牌河移除（见对应契约）；出牌权转移
    ui_effects:
      - 打出牌可见移动过程（2 帧表现）；头像流光 1 秒；方位闪烁 1 秒；最近出牌菱形光柱漂浮动画 1 秒；放大出牌（默认开）展示至下家有操作行为后消失（关闭时直接落牌河，移动约 0.5 秒）
    failure_handling:
      - 危牌打出被阻断并 toast「打出该牌将会放炮！」
      - 无提起牌时双击行为原文未定义（待确认，pending）
    timeout_handling: 出牌超时走托管（见 CT-022）
    mutual_exclusion:
      - 与单击出牌互斥（设置层二选一）；与滑动出牌不互斥
    test_scenarios:
      - 双击打出已提起牌，牌河更新且头像流光 1 秒
      - 危牌双击被阻断并提示；全危牌时放行
      - 双击开启+单击关闭为默认组合
    source_references: [SRC-788, SRC-918, SRC-781, SRC-782, SRC-783, SRC-784, SRC-785, SRC-786, SRC-208, SRC-209, SRC-845]
    confirmation_status: draft

  - contract_id: CT-013
    related_requirement_ids: [INT-034, PRD-022]
    trigger: 玩家单击牌面（不可听牌）
    preconditions:
      - 局内设置开启单击出牌（默认关闭）；轮到自己出牌；点击的牌为不可听牌（打出后不成听）
    guards:
      - 可听牌不适用单击直接打出（提起可听牌走听牌提示联动，见 CT-011 与页面 6 契约）
      - 危牌禁打守卫同 CT-012
    state_transition:
      from: 手牌静止
      to: 出牌（无需提起）→牌河更新→出牌后理牌
    data_effects:
      - 手牌减 1；牌河加 1；出牌权转移
    ui_effects:
      - 出牌表现同 CT-012（移动 2 帧/流光 1 秒/方位闪烁 1 秒/光柱/放大出牌）；开启单击出牌时轮到自己出牌前提起的牌自动下落
    failure_handling:
      - 危牌阻断 toast「打出该牌将会放炮！」
    timeout_handling: 出牌超时走托管（见 CT-022）
    mutual_exclusion:
      - 与双击出牌互斥（设置层）；与滑动出牌可并存
    test_scenarios:
      - 开启后单击不可听牌直接打出、无需提起
      - 默认关闭时单击为提牌行为
      - 双击与单击互斥断言；开启后前提起的牌自动下落
    source_references: [SRC-789, SRC-791, SRC-912, SRC-918]
    confirmation_status: draft

  - contract_id: CT-014
    related_requirement_ids: [INT-035, PRD-022]
    trigger: 玩家向上滑动牌并超过提起高度；随后松手或移回提起高度水平线
    preconditions:
      - 局内设置开启滑动出牌（默认关闭）；轮到自己出牌
    guards:
      - 危牌禁打守卫同 CT-012（松手打出时校验）
    state_transition:
      from: 手牌静止
      to: 透明牌跟随态→松手打出（牌河更新）或移回水平线撤回（回静止态）
    data_effects:
      - 松手打出：手牌减 1、牌河加 1、出牌权转移；撤回：无数据变化
    ui_effects:
      - 上滑超过提起高度显示透明牌随手指移动；松手打出走标准出牌表现；移回提起高度水平线则透明牌消失、撤回打出
    failure_handling:
      - 危牌阻断 toast「打出该牌将会放炮！」
    timeout_handling: 出牌超时走托管（见 CT-022）
    mutual_exclusion:
      - 与双击出牌不互斥；与单击出牌的组合关系原文未明示（待确认，pending）
    test_scenarios:
      - 上滑出透明牌随手指移动，松手打出
      - 移回提起高度水平线透明牌消失且撤回打出
      - 滑动出牌关闭时上滑无透明牌
    source_references: [SRC-790, SRC-791, SRC-913]
    confirmation_status: draft

  - contract_id: CT-015
    related_requirement_ids: [INT-036, PRD-023, PRD-030, GDD-R007]
    trigger: 玩家点击【碰】
    preconditions:
      - 他人打出一张牌；自己手上有 2 张相同的牌（原文措辞「及以上」，按恰好持有 2 张同牌处理，AMB-210）；可碰任何一家的牌；危牌可碰
    guards:
      - 同一张牌既有胡又有碰时胡优先（操作优先级：吃胡/自摸/抢杠胡高于碰/杠）
      - 过碰限制：过碰后轮到自己回合前其他玩家再打出同张牌时不可再碰（推导口径 GDD-D13，待确认 GDD-U17，pending；见 CT-020）
    state_transition:
      from: 响应窗口（【碰】【过】按钮组）
      to: 碰动画（1 秒）→碰成立并取得出牌权
    data_effects:
      - 手牌减 2；碰牌区加 1 组刻子（共 3 张）；被碰的牌从牌河移除；碰后该玩家取得出牌权并须再打出 1 张
    ui_effects:
      - 手牌右上方显示【碰】+【过】；可碰牌高亮、其余暗置（有胡时不暗置）；碰动画 1 秒于手牌面前播放；碰牌放手牌左侧按本局操作顺序、展示牌面；碰牌上方方位箭头（对家上/上家左/下家右）
    failure_handling: []
    timeout_handling: 配置开启托管时超时默认【过】
    mutual_exclusion:
      - 与【过】互斥（点过放弃该次机会，见 CT-020）
      - 胡优先于碰；碰与杠同时可时按钮组并列由玩家选择；多状态按钮顺序【碰】→【杠】→【亮】→【胡】/【自摸】→【过】
    test_scenarios:
      - 可碰任何一家打出的牌；危牌可碰
      - 碰后手牌减 2、碰牌区加刻子并取得出牌权必须再打一张
      - 有胡同时可时胡优先；托管超时默认过
    source_references: [SRC-229, SRC-230, SRC-231, SRC-232, SRC-233, SRC-073, SRC-236, SRC-762, SRC-793, SRC-794, SRC-795, SRC-796, SRC-797, SRC-798, SRC-818]
    confirmation_status: draft

  - contract_id: CT-016
    related_requirement_ids: [INT-037, PRD-024, PRD-025, GDD-R008, GDD-R009, GDD-R012]
    trigger: 玩家点击【杠】（他人打出某张牌且自己手中存在相同 3 张）
    preconditions:
      - 他人打出某张牌；手中有相同 3 张；牌堆剩余大于 0
    guards:
      - 直杠不可被抢杠胡
      - 危牌可直杠（危牌限制仅约束明杠/补杠）；亮倒后杠限制按 GDD（已碰牌补杠口径存在冲突，见 GDD-U18，待确认）
      - 连杠倍率按杠上杠口径计算（见 CT-024）
    state_transition:
      from: 响应窗口（【碰】【杠】【过】按钮组）
      to: 中央杠动画（1 秒）→飘分→杠成立→自动补牌（见 CT-010）
    data_effects:
      - 手牌减 3；杠牌区加 4 张（3 张手牌+打出 1 张）；打出牌的玩家支付直杠玩家 2 倍底分（实时结算、即时飘分，小局结束不额外再算）；被杠的牌从牌河移除
    ui_effects:
      - 按钮【碰】+【杠】+【过】；中央动画 1 秒后飘分；明杠玩家前不显示刮风字样、显示对应杠文字；箭头指向（对家上/上家左/下家右）；杠牌放手牌左侧按本局操作顺序
    failure_handling:
      - 牌堆剩余 0 时不可杠（杠按钮不出现/不可执行）
    timeout_handling: 配置开启托管时超时默认【过】
    mutual_exclusion:
      - 与碰同现（同张既可碰又可杠）时按钮组并列由玩家选择；胡优先于杠
      - 直杠与补杠/暗杠按触发条件互斥区分；直杠不可被抢
    test_scenarios:
      - 直杠成立后打出者支付 2 倍底分且实时飘分
      - 跨玩家连杠：A 直杠后打出一张被 B 杠仍算连杠、倍率翻倍
      - 直杠不可被抢杠胡；牌堆剩 0 时不可杠
    source_references: [SRC-239, SRC-243, SRC-026, SRC-799, SRC-803, SRC-802, SRC-249, SRC-251, SRC-033, SRC-041, SRC-258, SRC-246]
    confirmation_status: draft

  - contract_id: CT-017
    related_requirement_ids: [INT-038, PRD-024, PRD-025, PRD-026, GDD-R008, GDD-R009, GDD-U05, GDD-U18]
    trigger: 玩家点击【杠】（自己已碰牌后摸到相同的牌——第 4 张）
    preconditions:
      - 该玩家已碰该牌且非当前碰牌回合（当前回合不可杠）；后续摸到相同的牌；牌堆剩余大于 0
    guards:
      - 可被抢杠胡：若其他玩家可对该牌抢杠胡，补杠挂起（不播动画不飘分），直到抢杠方完成选择
      - 回手杠限制（常驻规则层约束，配置化待确认 GDD-U05）：手有 3 张相同、他人打出第 4 张时选择碰，则该牌本小局不能再明杠；已碰的牌摸到第 4 张必须立刻杠，否则本小局该牌不能再明杠
      - 危牌不可明杠（补杠）；亮倒后仅扣下的刻子可杠（已碰牌补杠口径冲突见 GDD-U18，待确认）
    state_transition:
      from: 响应窗口（【杠】【过】按钮组）
      to: 补杠确认（可能挂起）→杠成立（动画+飘分+补牌）或抢杠胡流程
    data_effects:
      - 手牌减 1；碰牌区该刻子加至 4 张；其他玩家各支付补杠玩家 1 倍底分（实时结算）
      - 抢杠胡成立时：明杠玩家视为未杠成功、不收取杠分，已实时收取的该杠杠分回退，杠上杠中断（GDD-D05/GDD-D06/GDD-D07）
    ui_effects:
      - 按钮【杠】+【过】；动画同直杠；杠牌上方显示【补】；有人可抢杠胡时不播动画、不飘分，直到抢杠胡玩家完成选择再走对应流程
    failure_handling:
      - 抢杠胡成立则杠不成立且杠分回退（抢杠胡流程契约归后半部分）
    timeout_handling: 配置开启托管时超时默认【过】
    mutual_exclusion:
      - 补杠可被抢杠胡（与直杠/暗杠的不可抢互斥区分）；当前碰牌回合不可杠
      - 补杠与【过】放弃互斥（点过放弃，见 CT-020）
    test_scenarios:
      - 补杠成立后其他玩家各支付 1 倍底分并实时飘分
      - 有人可抢杠胡时动画挂起至选择完成
      - 回手杠①②场景下补杠权丧失断言（配置化待确认，pending）
      - 危牌补杠被禁、直杠与暗杠不受此限
    source_references: [SRC-240, SRC-244, SRC-027, SRC-800, SRC-803, SRC-806, SRC-267, SRC-465, SRC-038, SRC-039, SRC-255, SRC-256, SRC-043, SRC-428, SRC-044, SRC-261]
    confirmation_status: draft

  - contract_id: CT-018
    related_requirement_ids: [INT-039, PRD-024, PRD-025, GDD-R008, GDD-R010]
    trigger: 玩家点击【杠】（非碰牌后的出牌阶段手上有 4 张相同的牌）
    preconditions:
      - 非碰牌后的出牌阶段；手上有 4 张相同；牌堆剩余大于 0
    guards:
      - 暗杠不可被抢杠胡；危牌可暗杠（危牌限制仅约束明杠/补杠）
      - 连杠倍率按杠上杠口径计算（见 CT-024）
    state_transition:
      from: 响应窗口（【杠】【过】按钮组）
      to: 中央暗杠动画（1 秒）→飘分→杠成立→自动补牌（见 CT-010）
    data_effects:
      - 手牌减 4；暗杠区加 4 张；其余玩家各支付暗杠玩家 2 倍底分（实时结算、即时飘分）
    ui_effects:
      - 按钮【杠】+【过】；暗杠玩家前显示暗杠字样；中央动画 1 秒后飘分；下三张牌背、上一张牌面按配置正/反堆叠展示（牌面他人可见）
    failure_handling:
      - 牌堆剩余 0 时不可杠
    timeout_handling: 配置开启托管时超时默认【过】
    mutual_exclusion:
      - 与胡同现时胡优先；暗杠与补杠/直杠按触发条件互斥区分；暗杠不可被抢
    test_scenarios:
      - 暗杠成立后其余玩家各支付 2 倍底分
      - 暗杠不可被抢杠胡；三张牌背一张牌面、牌面他人可见
      - 杠上暗杠按连杠倍率翻倍（需求示例连杠链）
    source_references: [SRC-241, SRC-245, SRC-028, SRC-801, SRC-803, SRC-008, SRC-264, SRC-254]
    confirmation_status: draft

  - contract_id: CT-019
    related_requirement_ids: [INT-040, PRD-025]
    trigger: 玩家在可杠牌选择框中点击选择需杠的牌后点【杠】；或点【过】放弃
    preconditions:
      - 同时可杠多张（多杠状态）
    guards:
      - 可不选择直接点击手牌出牌（不强制杠）
    state_transition:
      from: 多杠响应窗口（可杠牌选择框+【杠】+【过】）
      to: 选定牌按对应杠类流程（CT-016/CT-017/CT-018）或放弃（隐藏选择框）
    data_effects:
      - 选定牌按其对应杠类（直杠/补杠/暗杠）结算并触发补牌
    ui_effects:
      - 手牌右上方显示可杠牌选择框+【杠】+【过】；可杠牌高亮、其他暗置（有胡不暗置）；点【过】放弃并隐藏杠选择框
    failure_handling: []
    timeout_handling: 配置开启托管时超时默认不杠
    mutual_exclusion:
      - 与直接出牌并存（可直接点击手牌中的牌出牌不用选择）；点【过】放弃全部杠机会
    test_scenarios:
      - 多杠状态出现选择框，选牌后按对应杠类结算
      - 点【过】放弃且选择框隐藏；直接出牌不用选择
      - 托管超时默认不杠
    source_references: [SRC-817, SRC-802]
    confirmation_status: draft

  - contract_id: CT-020
    related_requirement_ids: [INT-043, PRD-028, PRD-029, GDD-D13, GDD-U17]
    trigger: 玩家点击【过】
    preconditions:
      - 出现任一操作按钮组（碰/杠/亮/胡/自摸/多状态）
    guards: []
    state_transition:
      from: 响应窗口
      to: 放弃该次操作机会（窗口关闭，回正常行牌）
    data_effects:
      - 无手牌与副露数据变化
    ui_effects:
      - 按钮组消失；多状态点【过】放弃全部操作机会
    failure_handling: []
    timeout_handling: 配置开启托管时：碰/杠超时默认【过】、多杠超时默认不杠、有胡牌的多状态超时默认胡牌（见 CT-022）
    mutual_exclusion:
      - 与所放弃的操作互斥：点过即放弃该次机会
      - 过碰/过杠限制：过碰（杠）后、轮到自己回合前，其他玩家再打出同张牌时不可再碰（杠）——推导口径 GDD-D13，原文未定义、待产品确认（GDD-U17，pending）
    test_scenarios:
      - 各操作场景下【过】点击后不再获得该次机会
      - 过碰后同张不可再碰（推导口径，pending 待确认；过杠与过碰同口径）
    source_references: [SRC-297, SRC-298, SRC-096, SRC-1039, SRC-1040, SRC-818]
    confirmation_status: pending-human

  - contract_id: CT-021
    related_requirement_ids: [PRD-029, PRD-050]
    trigger: 系统事件——玩家可胡牌时选择不胡（进入漏胡）；以及漏胡状态下触发胡牌尝试时提示
    preconditions:
      - 该玩家可胡（可胡条件归 GDD）；玩家选择不胡
    guards:
      - 漏胡玩家摸牌前不可胡牌（含杠后补牌前）；漏胡状态在摸牌后解除（含杠后补牌）
    state_transition:
      from: 响应窗口（放弃胡）
      to: 漏胡态（摸牌前不可胡）→摸牌/补牌后解除回正常态
    data_effects:
      - 漏胡状态标记：解除前对任何胡牌机会阻断
    ui_effects:
      - 漏胡期间尝试胡牌触发浮动提示「当前未过手，无法胡牌」1.5 秒
    failure_handling: []
    timeout_handling: 配置开启托管时有胡超时默认胡牌（不因超时形成漏胡，见 CT-022）
    mutual_exclusion:
      - 漏胡期间胡操作不可用；过碰/过杠为同口径限制（推导，待确认，见 CT-020）
    test_scenarios:
      - 多面听示例：A 打 7 条，B 听 7 条与 4 筒而选择不胡→进入漏胡；下一次摸牌前任何人再打 7 条或 4 筒 B 均不可胡；B 摸牌（含杠后补牌）后解除
      - 提示文案与 1.5 秒时长断言
    source_references: [SRC-093, SRC-094, SRC-429, SRC-430, SRC-431, SRC-434, SRC-1037, SRC-878]
    confirmation_status: draft

  - contract_id: CT-022
    related_requirement_ids: [PRD-048, PRD-049, GDD-U16]
    trigger: 系统事件——配置开启托管且玩家操作超时（出牌/碰/杠/胡）
    preconditions:
      - 房局配置开启托管；玩家超时未操作
    guards:
      - 托管状态下无法提牌；玩家仍可点碰/杠/胡/过且操作后取消托管状态
    state_transition:
      from: 正常行牌/响应窗口
      to: 托管态（自动执行默认行为）；玩家主动操作后解除
    data_effects:
      - 自动出牌：托管打牌等待 1 秒打出摸到的牌；摸到的牌是危牌时在非危牌中从左到右选择第一张打出；手牌全是危牌时打出摸到的牌
    ui_effects:
      - 头像覆盖托管图标（自动摸打的托管不显示图标，见 CT-023）；自动出牌走标准出牌表现
    failure_handling: []
    timeout_handling: 本契约即超时处理：出牌超时（有/无提起的牌均）打新摸进来的牌（两行托管行为相同，AMB-211 待确认）；碰/杠超时默认【过】；多杠超时默认不杠；有胡牌的多状态超时默认胡牌；非托管模式的超时行为原文未定义（GDD-U16/AMB-405，待确认，pending）
    mutual_exclusion:
      - 玩家主动碰/杠/胡/过操作后取消托管；自动摸打托管的表现例外归 CT-023
    test_scenarios:
      - 出牌超时打新摸进来的牌（有/无提起的牌行为一致）
      - 摸到危牌时择非危牌从左到右第一张打出；全危牌时打摸到的牌
      - 碰/杠超时默认过；多杠超时默认不杠；有胡超时默认胡
    source_references: [SRC-095, SRC-227, SRC-296, SRC-299, SRC-496, SRC-792, SRC-921, SRC-1041, SRC-1042, SRC-1043, SRC-1044, SRC-1045, SRC-1046, SRC-738]
    confirmation_status: draft

  - contract_id: CT-023
    related_requirement_ids: [INT-062, PRD-041, PRD-049]
    trigger: 玩家勾选【自动摸打】；或取消勾选/点「取消托管」
    preconditions:
      - 已听牌（【自动摸打】入口仅打出后成听时显示，层级不挡牌）
    guards:
      - 未听牌时按钮不出现；摸到的牌是危牌时强制退出自动摸打
    state_transition:
      from: 已听牌态
      to: 自动摸打托管态（摸到危牌/取消勾选/点「取消托管」时回到已听牌态）
    data_effects:
      - 进入托管：摸打等待 1 秒打出摸到的牌；碰/杠等待 1 秒后取消；胡等待 1 秒自动胡牌
    ui_effects:
      - 手牌上方显示【听牌】与【自动摸打】；勾选后头像不显示托管图标（与常规托管表现的例外差异）
    failure_handling: []
    timeout_handling: 摸打等待时长 1 秒（固定时序）；碰/杠/胡等待 1 秒后执行对应默认行为
    mutual_exclusion:
      - 与常规托管互斥表现：自动摸打的托管不显示托管图标
      - 摸到危牌强制退出（唯一自动解除条件）+玩家主动取消
    test_scenarios:
      - 听牌后勾选进入托管且头像无托管图标
      - 摸到危牌自动退出；取消勾选或点「取消托管」退出
      - 碰杠等待 1 秒取消、胡等待 1 秒自动胡
    source_references: [SRC-874, SRC-877, SRC-922, SRC-858, SRC-1044, SRC-1046]
    confirmation_status: draft

  - contract_id: CT-024
    related_requirement_ids: [PRD-025, GDD-D17, GDD-D23]
    trigger: 系统事件——玩家杠牌后摸到的牌继续杠；或补牌后打出的牌被别人杠
    preconditions:
      - 存在未中断的连杠链（前一次杠后已补牌）
    guards:
      - 中断条件：玩家补牌后打出一张无人杠，则本次连杠结束、倍数清零重新计算
    state_transition:
      from: 杠成立
      to: 连杠计数加 1（倍率按公式更新）或补牌打出无人杠后连杠链重置
    data_effects:
      - 本次杠分=基础杠分×2^(连续杠次数-1)（连杠次数 1/2/3/n 对应 1/2/4/2^(n-1) 倍）
      - 连杠可跨玩家连续（A 杠→打出一张被 B 杠算连杠→B 打出一张被 C 杠仍算连杠）；杠上杠仅计算杠分，之前的杠分不转移
      - 杠上花、杠上炮、抢杠胡倍数不随杠上杠翻倍、走初始值（初始 2，勾选「杠上花/炮*4」后 4；GDD-D17/GDD-D23）
    ui_effects:
      - 结算详情对触发杠上杠的杠展示「杠上杠 Y 倍」
    failure_handling: []
    timeout_handling: ""
    mutual_exclusion:
      - 杠上杠翻倍仅作用于杠分；杠上花/杠上炮/抢杠胡倍数不跟随翻倍
    test_scenarios:
      - 连杠次数 1/2/3 的杠分按 1/2/4 倍断言；中断后重新起算
      - 需求示例链：A 补杠收 1 分→A 杠上暗杠收 2×2=4 分→B 直杠收 2×(2×2)=8 分→B 杠上打出无事、重置
      - 杠上开花/抢杠胡倍数走初始值不随杠上杠翻倍
    source_references: [SRC-031, SRC-032, SRC-033, SRC-034, SRC-035, SRC-036, SRC-037, SRC-249, SRC-250, SRC-251, SRC-252, SRC-254, SRC-534, SRC-527, SRC-964]
    confirmation_status: draft
