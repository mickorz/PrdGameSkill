# Traceability Matrix：全链路追溯矩阵（YAML）
#
# 链路方向：Source -> GDD -> PRD -> Interaction -> Contract -> Test
# 归属口径：下游文档中行首带 ID 的条目行 -> 精确条目 ID（GDD-R001 / PRD-001 / INT-001 / CT-001）；
#   段落正文中的 SRC 引用 -> 所在章节（GDD-sec:章节名 / PRD-sec:章节名 / INT-sec:章节名）。
# gaps 口径：
#   pending-confirmation —— 事实类型 UNKNOWN/CONFLICT，待人工确认（全段判定）。
#   missing-gdd —— 玩法事实段（01~06 与 03 溢出段 SRC-1000+）无 GDD 层承接；玩法事实不允许断链。
#   07 配置段（SRC-600~699）承接层为 PRD 配置功能（GDD 数值与配置章节为部分承接，不强制）；
#   08 UI 段（SRC-700~987）承接层为 Interaction。此两段不判 missing-gdd。
#   missing-prd / missing-interaction / missing-contract 不逐 SRC 机械登记（非每条事实都需四层全引用），
#   层级覆盖率在文件尾注释统计 + evaluation-report.md 中评估；孤立目标条目登记于文件尾 orphan 注释区，不计入 summary。
# gaps 只登记不修复（缺失关联不编造内容补链）。

