]},{"requirement_id":"GAME-RULE-002","anchors":[{"file":"source/original-prd.md","heading":"2.2 配对判定","line_start":11,"line_end":12,"quote_hash":"sha1:941f7ed0196a49ab5e46abe4214a3594f901cd18"}]},{"requirement_id":"GAME-RULE-004","anchors":[{"file":"source/original-prd.md","heading":"2.4 胜利判定","line_start":15,"line_end":16,"quote_hash":"sha1:8e6be0355237814ec28d0fa6fa93c0e72fc231ab"}]},{"requirement_id":"GAME-RULE-005","anchors":[{"file":"source/original-prd.md","heading":"2.5 步数统计","line_start":17,"line_end":18,"quote_hash":"sha1:40b2de8a59c5eb3e813619b8c63694be285bbc7c"}]},{"requirement_id":"GAME-FR-001","anchors":[{"file":"source/original-prd.md","heading":"3.1 开局","line_start":21,"line_end":22,"quote_hash":"sha1:cbdf67700a90dadb78e9fbaa1941cfe3e81bc129"}]},{"requirement_id":"GAME-FR-002","anchors":[{"file":"source/original-prd.md","heading":"3.2 结果展示","line_start":23,"line_end":24,"quote_hash":"sha1:d728a651f532d3ce47a969dd309c83c3e956f975"}]}],"simulator":{"enabled":true,"code":"// 迷你游戏「记忆翻牌」模拟器（P4）\n// 逻辑核心 MiniGameCore：纯逻辑，Node 可测；DOM 适配 MiniGameSimulator：浏览器接入。\n// 实现的规则以 RULE_TABLE 声明，rule_ref 全部指向 GAME-RULE ID。\n(function (root, factory) {\n  if (typeof module !== \"undefined\" && module.exports) module.exports = factory();\n  else root.MiniGameFactory = factory();\n})(typeof self !== \"undefined\" ? self : this, function () {\n  // 规则声明表：与 game-spec/requirements/rules 冻结 IR 对应\n  // status/authority 与 IR 一致；authority=open 的规则会被守卫拒绝执行\n  const RULE_TABLE = {\n    \"GAME-RULE-001\": { name: \"翻牌规则\", authority: \"fixed\", status: \"proposed\" },\n    \"GAME-RULE-002\": { name: \"配对判定规则\", authority: \"fixed\", status: \"proposed\" },\n    \"GAME-RULE-003\": { name: \"配对失败盖回规则\", authority: \"fixed\", status: \"approved\" },\n    \"GAME-RULE-004\": { name: \"胜利判定规则\", authority: \"fixed\", status: \"proposed\" },\n    \"GAME-RULE-005\": { name: \"步数统计规则\", authority: \"delegated\", status: \"proposed\" },\n    \"GAME-RULE-006\": { name: \"重复翻牌禁止规则\", authority: \"delegated\", status: \"proposed\" },\n  };\n\n  function guard(ruleId) {\n    const rule = RULE_TABLE[ruleId];\n    if (!rule) throw { code: \"RULE_NOT_CONFIRMED\", ruleId, message: \"规则未定义，模拟器拒绝判定\" };\n    if (rule.authority === \"open\") throw { code: \"RULE_NOT_CONFIRMED\", ruleId, message: \"规则未确认，禁止作为确定规则执行\" };\n    return rule;\n  }\n\n  // ---------- 逻辑核心（无 DOM） ----------\n  const snapshotOf = (s) => JSON.parse(JSON.stringify(s));\n\n  function createGame(config, logger) {\n    const cfg = Object.assign({ pairCount: 4, flipBackMs: 1000 }, config || {});\n    const log = (ruleId, verdict, detail) => logger && logger.log(ruleId, verdict, detail);\n    let state = null;\n\n    function initial() {\n      const cards = [];\n      for (let p = 1; p <= cfg.pairCount; p++) {\n        cards.push({ id: cards.length, pairId: p, faceUp: false, matched: false });\n        cards.push({ id: cards.length, pairId: p, faceUp: false, matched: false });\n      }\n      return { phase: \"playing\", cards, flipped: [], matchedPairs: 0, moves: 0, won: false };\n    }\n\n    function findCard(id) {\n      return state.cards.find((c) => c.id === id);\n    }\n\n    // 动作：flip(cardId)\n    function dispatch(action, args) {\n      args = args || {};\n      if (action !== \"flip\") {\n        log(\"GAME-RULE-001\", \"rejected\", \"未知动作 \" + action);\n        return { ok: false, reason: \"unknown_action\" };\n      }\n      guard(\"GAME-RULE-001\");\n      const card = findCard(args.cardId);\n      if (!card) return { ok: false, reason: \"no_card\" };\n      // GAME-RULE-006：已翻开或已配对的牌点击无效\n      if (card.faceUp || card.matched) {\n        guard(\"GAME-RULE-006\");\n        log(\"GAME-RULE-006\", \"rejected\", \"card=\" + card.id + \" 已翻开/已配对，操作被忽略\");\n        return { ok: false, reason: \"illegal_reclick\" };\n      }\n      // GAME-RULE-001：翻开\n      card.faceUp = true;\n      state.flipped.push(card);\n      log(\"GAME-RULE-001\", \"applied\", \"card=\" + card.id + \" 翻开\");\n      if (state.flipped.length < 2) return { ok: true, effect: \"flip\" };\n\n      // 第二张：GAME-RULE-005 计步\n      guard(\"GAME-RULE-005\");\n      state.moves += 1;\n      log(\"GAME-RULE-005\", \"applied\", \"moves=\" + state.moves);\n      const [a, b] = state.flipped;\n      // GAME-RULE-002：配对判定\n      guard(\"GAME-RULE-002\");\n      if (a.pairId === b.pairId) {\n        a.matched = b.matched = true;\n        state.matchedPairs += 1;\n        state.flipped = [];\n        log(\"GAME-RULE-002\", \"applied\", \"配对成功 pair=\" + a.pairId + \" \" + state.matchedPairs + \"/\" + cfg.pairCount);\n        // GAME-RULE-004：胜利判定\n        guard(\"GAME-RULE-004\");\n        if (state.matchedPairs === cfg.pairCount) {\n          state.won = true;\n          state.phase = \"won\";\n          log(\"GAME-RULE-004\", \"applied\", \"全部配对完成，进入 won\");\n        }\n        return { ok: true, effect: \"matched\" };\n      }\n      // GAME-RULE-003：配对失败盖回（同步模型：立即盖回并记录延时参数）\n      guard(\"GAME-RULE-003\");\n      a.faceUp = b.faceUp = false;\n      state.flipped = [];\n      log(\"GAME-RULE-003\", \"applied\", \"配对失败，\" + cfg.flipBackMs + \"ms 后盖回（同步模拟）\");\n      return { ok: true, effect: \"flipback\", flipBackMs: cfg.flipBackMs };\n    }\n\n    function getState() { return snapshotOf(state); }\n    function reset(config2) {\n      if (config2) cfg = Object.assign(cfg, config2);\n      state = initial();\n    }\n    reset();\n    return { dispatch, getState, reset, snapshot: () => snapshotOf(state), restore: (s) => { state = snapshotOf(s); } };\n  }\n\n  // ---------- DOM 适配（浏览器） ----------\n  function create(area, onLog) {\n    const logger = { entries: [], log: function (r, v, d) { this.entries.push(\"[\" + r + \"] \" + v + \" \" + (d || \"\")); if (onLog) onLog(\"[\" + r + \"] \" + (d || \"\")); } };\n    const FACES = [\"A\", \"B\", \"C\", \"D\"];\n    let game = null;\n    let lock = false;\n\n    function render() {\n      area.innerHTML = \"\";\n      const st = game.getState();\n      const board = document.createElement(\"div\");\n      board.className = \"board\";\n      st.cards.forEach((c) => {\n        const el = document.createElement(\"div\");\n        el.className = \"card-el\" + (c.matched ? \" matched\" : c.faceUp ? \" face-up\" : \"\");\n        el.dataset.componentId = \"GAME-COMP-001\";\n        el.textContent = c.faceUp || c.matched ? FACES[(c.pairId - 1) % FACES.length] : \"?\";\n        el.addEventListener(\"click\", function () {\n          if (lock) return;\n          const before = game.snapshot();\n          let result;\n          try { result = game.dispatch(\"flip\", { cardId: c.id }); }\n          catch (e) { if (onLog) onLog(\"[\" + (e.code || \"ERROR\") + \"] \" + e.message); return; }\n          if (result.effect === \"flipback\") {\n            lock = true;\n            setTimeout(function () { lock = false; render(); }, result.flipBackMs);\n          }\n          void before;\n          render();\n        });\n        board.appendChild(el);\n      });\n      const moves = document.createElement(\"div\");\n      moves.className = \"moves\";\n      moves.dataset.componentId = \"GAME-COMP-002\";\n      moves.textContent = \"步数：\" + game.getState().moves;\n      area.appendChild(moves);\n      area.appendChild(board);\n      if (game.getState().won) {\n        const win = document.createElement(\"div\");\n        win.className = \"comp-generic\";\n        win.dataset.componentId = \"GAME-COMP-004\";\n        win.textContent = \"胜利！再来一局\";\n        win.addEventListener(\"click\", function () { newGame(); });\n        area.appendChild(win);\n      }\n    }\n\n    function newGame() {\n      game = createGame({ pairCount: 4, flipBackMs: 1000 }, logger);\n      lock = false;\n      render();\n    }\n    newGame();\n    return { getLog: function () { return logger.entries; }, reset: newGame };\n  }\n\n  return { RULE_TABLE: RULE_TABLE, createGame: createGame, create: create };\n});\n"}};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- 数据索引 ----------
const reqById = new Map();
for (const r of APP_DATA.requirements) reqById.set(r.id, r);
for (const c of APP_DATA.configs) reqById.set(c.id, c);
for (const s of APP_DATA.states) reqById.set(s.id, s);
const compById = new Map(); for (const c of APP_DATA.ui.components) compById.set(c.id, c);
const pageById = new Map(); for (const p of APP_DATA.ui.pages) pageById.set(p.id, p);
const caseById = new Map(); for (const t of APP_DATA.tests.cases) caseById.set(t.id, t);

// ---------- 规格分类（P0：导航配置 + 按 APP_DATA 实际 type 字段映射，数量动态统计） ----------
const SPEC_CATEGORIES = [
  { id: "GAME-FR", label: "功能需求", filter: (r) => r.type === "game_feature" },
  { id: "GAME-RULE", label: "游戏规则", filter: (r) => r.type === "game_rule" },
  { id: "GAME-STATE", label: "状态机", filter: (r) => r.type === "state" },
  { id: "GAME-CFG", label: "数值配置", filter: (r) => r.type === "config" },
  { id: "GAME-UI", label: "UI 页面与组件", isUi: true },
];
const specState = { category: null, selectedId: null }; // 规格工作台状态（null = 概述）
const decisionState = { selectedOqId: null, statusFilter: "all", severityFilter: "all", keyword: "" }; // 裁决工作台状态
function categoryOf(r) { for (const c of SPEC_CATEGORIES) if (c.filter && c.filter(r)) return c.id; return null; }

// ---------- 徽标 ----------
function badges(r) {
  return `<span class="badge st-${r.status}">${r.status}</span><span class="badge au-${r.authority}">${r.authority}</span>`;
}

// ---------- 左侧分类导航（P0：不展开全部需求，只列分类与数量） ----------
function renderNav() {
  const nav = $("#nav");
  let html = `<h4>规格分类</h4><a class="cat-nav" data-cat="__overview__">游戏概述</a>`;
  for (const c of SPEC_CATEGORIES) {
    const cnt = c.isUi ? APP_DATA.ui.pages.length : [...reqById.values()].filter(c.filter).length;
    html += `<a class="cat-nav" data-cat="${c.id}">${esc(c.label)}<span class="cnt">${cnt}</span></a>`;
  }
  html += `<h4>其他</h4><a class="cat-nav" data-nav="ui-demo">UI Demo 演示</a>` +
    `<a class="cat-nav" data-nav="tests">测试用例（${APP_DATA.tests.cases.length}）</a>` +
    `<a class="cat-nav" data-nav="openq">未决问题裁决（${(APP_DATA.reviews.openQuestions || []).length}）</a>`;
  nav.innerHTML = html;
  nav.addEventListener("click", (e) => {
    const a = e.target.closest("a");
    if (!a) return;
    if (a.dataset.cat) { switchTab("spec", () => setSpecCategory(a.dataset.cat === "__overview__" ? null : a.dataset.cat)); return; }
    if (a.dataset.nav === "ui-demo") switchTab("ui");
    else if (a.dataset.nav === "tests") switchTab("tests");
    else if (a.dataset.nav === "openq") switchTab("decision");
  });
  updateNavActive();
}
function updateNavActive() {
  const nav = $("#nav");
  nav.querySelectorAll("a").forEach((a) => a.classList.remove("active"));
  const cat = specState.category === null ? "__overview__" : specState.category;
  const el = nav.querySelector(`[data-cat="${cat}"]`);
  if (el) el.classList.add("active");
}
function setSpecCategory(cat) {
  specState.category = cat;
  specState.selectedId = null;
  updateNavActive();
  renderSpecCategory();
}

// ---------- 详情面板 ----------
function showDetail(r) {
  const s = r.source || {};
  const fields = [
    ["ID", r.id], ["名称", r.name], ["类型", r.type], ["状态", r.status], ["权限", r.authority],
    ["来源", `${s.kind || "-"}${s.section ? "（" + esc(s.section) + "）" : ""}${s.decided_by ? " 决策人：" + esc(s.decided_by) : ""}`],
    ["前置条件", (r.preconditions || []).join("；")],
    ["关联 UI", (r.ui_refs || []).join("、")],
    ["关联测试", (r.test_refs || []).join("、")],
    ["依赖", (r.dependencies || []).join("、")],
    ["AI 解释", (r.authority === "open" ? "该规则尚待人工确认，AI 不得将其作为确定规则执行。" : "已定义规则，AI 可按 authority 约束使用。")],
  ];
  $("#detail").innerHTML = fields.filter(([, v]) => v).map(([k, v]) =>
    `<div class="field"><span class="k">${k}</span>${esc(v)}</div>`).join("") +
    (s.quote ? `<div class="quote">${esc(s.quote)}</div>` : "");
}

function showRequirement(id) {
  const r = reqById.get(id);
  if (!r) return;
  switchTab("spec", () => {
    const cat = categoryOf(r);
    if (cat && specState.category !== cat) setSpecCategory(cat);
    raf(() => { scrollReq(id); showDetail(r); });
  });
}

function scrollReq(id) {
  const el = document.querySelector(`[data-anchor="${id}"]`);
  if (el) {
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.add("highlight");
    setTimeout(() => el.classList.remove("highlight"), 3200);
  }
}

// ---------- 视图切换 ----------
let currentTab = "spec";
const raf = window.requestAnimationFrame || ((fn) => setTimeout(fn, 0));
function switchTab(tab, after) {
  currentTab = tab;
  document.body.classList.toggle("ws-decision", tab === "decision");
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  if (tab === "spec") renderSpecCategory();
  if (tab === "ui") renderUiDemo();
  if (tab === "flow") renderFlow();
  if (tab === "tests") renderTests();
  if (tab === "decision") renderDecisionWorkbench();
  if (after) raf(after);
}

// ---------- PRD 视图 ----------
function reqCard(r) {
  const rules = (r.business_rules || []).map((x) => `<li>${esc(x)}</li>`).join("");
  const flows = (r.normal_flow || []).map((x) => `<li>${esc(x)}</li>`).join("");
  const s = r.source || {};
  const quote = s.quote ? `<div class="quote">原文：${esc(s.quote)}</div>` :
    (s.basis ? `<div class="quote">推导依据：${esc(s.basis)}</div>` : "");
  const uiBtn = (r.ui_refs || []).length ? `<button class="btn-ui" data-goto-ui="${esc(r.id)}">查看 UI</button>` : "";
  return `<div class="req-card" data-anchor="${r.id}" data-requirements="${esc(r.id)}">
    <h3>${esc(r.id)} ${esc(r.name)} ${badges(r)} ${uiBtn}</h3>
    <div>${esc(r.description || "")}</div>${quote}${rules ? `<ul>${rules}</ul>` : ""}${flows ? `<ul>${flows}</ul>` : ""}
  </div>`;
}

// ---------- 规格工作台（P0：分类渲染；P1 再拆五类独立渲染器） ----------
function renderSpecCategory() {
  const cat = specState.category;
  let html = "";
  if (cat === null) {
    const g = APP_DATA.game;
    html += `<div class="req-card" data-anchor="__overview__"><h3>游戏概述</h3><div>${esc((g.overview && g.overview.summary) || "")}</div></div>`;
    const oq = APP_DATA.reviews.openQuestions || [];
    html += `<h3 style="margin-top:20px">未决问题（${oq.length}）</h3><div class="req-card" data-anchor="__openq__">` +
      (oq.length ? oq.map((q) => `<div class="warn-open">${esc(q.id || "")} ${esc(q.question || "")}（${esc(q.severity || "")}）</div>`).join("") : "无") + `</div>`;
  } else if (cat === "GAME-UI") {
    html += `<h3>UI 页面（${APP_DATA.ui.pages.length}）</h3>`;
    for (const p of APP_DATA.ui.pages) {
      const comps = APP_DATA.ui.components.filter((c) => (p.component_refs || []).includes(c.id) || (c.page_id || "") === p.id);
      html += `<div class="req-card" data-anchor="${esc(p.id)}" data-page="${esc(p.id)}"><h3>${esc(p.id)} ${esc(p.name)} <span class="badge">${p.resolution ? p.resolution.width + "x" + p.resolution.height : ""}</span></h3>
        <div>${esc(p.description || "")}</div><div style="color:#889;font-size:12px;margin-top:4px">状态：${esc((p.states || []).join(" / "))}　组件 ${comps.length} 个</div></div>`;
    }
  } else {
    const c = SPEC_CATEGORIES.find((x) => x.id === cat);
    const items = [...reqById.values()].filter(c.filter);
    html += `<h3>${esc(c.label)}（${items.length}）</h3>` + items.map(reqCard).join("");
  }
  $("#view").innerHTML = html;
}

function showPageDetail(pid) {
  const p = pageById.get(pid);
  if (!p) return;
  const comps = APP_DATA.ui.components.filter((c) => (p.component_refs || []).includes(c.id) || (c.page_id || "") === p.id);
  const fields = [
    ["ID", p.id], ["名称", p.name],
    ["分辨率", p.resolution ? p.resolution.width + " x " + p.resolution.height : ""],
    ["状态", (p.states || []).join(" / ")],
    ["组件", comps.map((c) => c.id + " " + c.name).join("；")],
    ["描述", p.description || ""],

}

// ---------- UI Demo 视图 ----------
function renderUiDemo() {
  const page = APP_DATA.ui.pages[0];
  if (!page) { $("#view").innerHTML = "无 UI 页面规格"; return; }
  let html = `<h3>${esc(page.id)} ${esc(page.name)} <span class="meta">${page.resolution.width}x${page.resolution.height} 状态：${esc(page.states.join(" / "))}</span></h3>`;
  html += `<div class="board-area" id="ui-area"></div><div id="ui-msg" style="margin-top:8px;color:#1a73e8;font-size:13px"></div>`;
  $("#view").innerHTML = html;
  const area = $("#ui-area");
  if (APP_DATA.simulator.enabled) {
    // Level 2：模拟器驱动（引擎由 build 时内嵌，此处执行并挂载）
    try {
      if (typeof MiniGameFactory === "undefined") new Function(APP_DATA.simulator.code)();
      /* global MiniGameFactory */
      const sim = MiniGameFactory.create(area, (msg) => { $("#ui-msg").textContent = msg; appendLog(msg); });
      window.__sim = sim;
      $("#log").style.display = "block";
    } catch (err) {
      area.innerHTML = `<div class="warn-open">模拟器加载失败：${esc(err.message)}</div>`;
    }
  } else {
    // Level 1：静态原型 + 状态切换假交互
    area.appendChild(renderStaticPage(page));
    $("#ui-msg").textContent = "Level 1 静态原型（模拟器未注入，仅演示布局与状态切换）";
  }
  // UI -> PRD 反向定位：右键点击组件（左键留给游戏操作，避免冲突）
  area.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    const comp = e.target.closest("[data-component-id]");
    if (!comp) return;
    const compId = comp.dataset.componentId;
    const related = new Set();
    for (const c of APP_DATA.ui.components) if (c.id === compId) (c.requirements || []).forEach((x) => related.add(x));
    const others = [...reqById.values()].filter((r) => (r.ui_refs || []).includes(compId)).map((r) => r.id);
    others.forEach((x) => related.add(x));
    // 复用规格工作台统一入口：自动切到关联需求所在分类并高亮展示详情
    const first = [...related][0];
    if (first && reqById.get(first)) showRequirement(first);
  });
}

function renderStaticPage(page) {
  const frag = document.createDocumentFragment();
  const board = document.createElement("div");
  board.className = "board";
  for (const c of APP_DATA.ui.components) {
    if (c.type === "card") {
      for (let i = 0; i < 8; i++) {
        const el = document.createElement("div");
        el.className = "card-el";
        el.dataset.componentId = c.id;
        el.textContent = "?";
        board.appendChild(el);
      }
    } else {
      const el = document.createElement("div");
      el.className = "comp-generic";
      el.dataset.componentId = c.id;
      el.textContent = `${c.name}（${c.id}）`;
      frag.appendChild(el);
    }
  }
  frag.appendChild(board);
  return frag;
}

// PRD -> UI 定位：依次尝试关联组件，全部未渲染时诚实提示（不虚假成功）
function focusByRequirement(reqId) {
  const r = reqById.get(reqId);
  const ids = ((r && r.ui_refs) || []).filter((x) => compById.has(x));
  let el = null;
  let used = null;
  for (const cid of ids) {
    el = document.querySelector(`[data-component-id="${cid}"]`);
    if (el) { used = cid; break; }
  }
  if (!el) {
    $("#ui-msg").textContent = `定位：${reqId} 关联组件（${ids.join("、") || "无"}）在当前模拟状态未渲染`;
    return;
  }
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.add("target-highlight");
  setTimeout(() => el.classList.remove("target-highlight"), 3200);
  $("#ui-msg").textContent = `定位：${reqId} -> ${used}`;
}

// ---------- Flow 视图 ----------
function renderFlow() {
  let html = `<h3>状态机</h3>`;
  for (const st of APP_DATA.states) {
    html += `<div class="req-card"><h3>${esc(st.id)} ${esc(st.name)} ${badges(st)}</h3>`;
    for (const f of st.normal_flow || []) {
      const parts = f.split("->").map((x) => x.trim()).filter(Boolean);
      if (parts.length >= 2) html += stateSvg(parts);
      else html += `<div>${esc(f)}</div>`;
    }
    html += `</div>`;
  }
  html += `<h3 style="margin-top:16px">核心循环</h3><div class="req-card">`;
  const loop = (APP_DATA.game.coreLoop && APP_DATA.game.coreLoop.loop) || [];
  html += loop.map((x) => esc(x)).join(" -> ") + `</div>`;
  $("#view").innerHTML = html;
}

function stateSvg(states) {
  const W = 130, H = 60, pad = 30;
  const width = pad + states.length * W;
  let svg = `<svg width="${width}" height="90" style="max-width:100%">`;
  states.forEach((s, i) => {
    const x = pad + i * W;
    svg += `<ellipse cx="${x + 40}" cy="35" rx="52" ry="22" fill="#eef3ff" stroke="#7a97c9"/>
            <text x="${x + 40}" y="39" text-anchor="middle" font-size="12">${esc(s)}</text>`;
    if (i < states.length - 1) {
      svg += `<line x1="${x + 92}" y1="35" x2="${x + W - 6}" y2="35" stroke="#7a97c9" marker-end="url(#arw)"/>`;
    }
  });
  svg += `<defs><marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7a97c9"/></marker></defs></svg>`;
  return svg;
}

// ---------- 裁决工作台（P0：独立布局 —— 统计+筛选 / 左列表 / 中详情与表单 / 右影响分析 / 底部操作栏；内存裁决 + 导出 decisions.json） ----------
const OQ_LIST = APP_DATA.reviews.openQuestions || [];
const DEC_LOG = (APP_DATA.reviews.decisionLog && APP_DATA.reviews.decisionLog.decisions) || [];
const DEC_DRAFTS = (APP_DATA.reviews.approvalState && APP_DATA.reviews.approvalState.drafts) || {};
const DECISIONS = {}; // OQ id -> 内存裁决记录；decision_status=draft 不进导出
let decSeq = DEC_LOG.reduce((m, d) => Math.max(m, Number(String(d.decision_id || "DEC-0").replace("DEC-", "")) || 0), 0);

const OQ_STATUS_LABEL = { open: "待裁决", draft: "草稿", approved: "已确认", rejected: "已否决", deferred: "已挂起" };
const SEV_RANK = { high: 3, medium: 2, low: 1 };

function decPrevInLog(oid) {
  const ds = DEC_LOG.filter((d) => d.question_id === oid);
  return ds.length ? ds[ds.length - 1] : null;
}

// 合并三来源计算状态（避免重复计数）：内存 DECISIONS > 历史 DEC_LOG > APP_DATA 草稿 > open
function oqStatus(q) {
  const mem = DECISIONS[q.id];
  if (mem) return mem.decision_status;
  const hist = decPrevInLog(q.id);
  if (hist) return hist.decision_status;
  return DEC_DRAFTS[q.id] ? "draft" : "open";
}

function decisionStats() {
  const s = { total: OQ_LIST.length, open: 0, draft: 0, approved: 0, rejected: 0, deferred: 0 };
  for (const q of OQ_LIST) s[oqStatus(q)] += 1;
  return s;
}

function visibleOqs() {
  const kw = decisionState.keyword.trim().toLowerCase();
  const list = OQ_LIST.filter((q) => {
    if (decisionState.statusFilter !== "all" && oqStatus(q) !== decisionState.statusFilter) return false;
    if (decisionState.severityFilter !== "all" && (q.severity || "low") !== decisionState.severityFilter) return false;
    if (kw && !(`${q.id || ""}`.toLowerCase().includes(kw) || `${q.question || ""}`.toLowerCase().includes(kw))) return false;
    return true;
  });
  return list.sort((a, b) => (SEV_RANK[b.severity || "low"] - SEV_RANK[a.severity || "low"]) || (a.id > b.id ? 1 : -1));
}

function decBadge(q) { return `<span class="badge dv-${oqStatus(q)}">${OQ_STATUS_LABEL[oqStatus(q)]}</span>`; }
function sevBadge(q) { return `<span class="badge sv-${q.severity || "low"}">${esc(q.severity || "low")}</span>`; }

function oqItemHtml(q) {
  return `<a class="dec-item${decisionState.selectedOqId === q.id ? " active" : ""}" data-oq="${esc(q.id)}">${esc(q.id)} ${esc(String(q.question || "").slice(0, 26))}…${sevBadge(q)}${decBadge(q)}<div style="color:#889;font-size:11px;margin-top:2px">${esc(q.requirement_id || "无关联")}</div></a>`;
}

function renderDecisionList() {
  $("#dec-list").innerHTML = visibleOqs().map(oqItemHtml).join("");
}

function renderDecisionWorkbench() {
  const s = decisionStats();
  let html = `<div class="dec-head"><h3>裁决工作台（${s.total} 项未决问题）</h3>
    <div><button class="btn-dec primary" id="dec-export">导出 decisions.json</button>
    <span id="dec-export-msg" style="color:#1a73e8;font-size:12px;margin-left:8px"></span></div></div>
    <div class="dec-stats"><b>全部 ${s.total}</b><b>待裁决 ${s.open}</b><b>草稿 ${s.draft}</b><b>已确认 ${s.approved}</b><b>已否决 ${s.rejected}</b><b>已挂起 ${s.deferred}</b></div>
    <div class="dec-filters">
      <label>状态 <select id="df-status-filter"><option value="all">全部</option>
        ${["open", "draft", "approved", "rejected", "deferred"].map((v) => `<option value="${v}"${decisionState.statusFilter === v ? " selected" : ""}>${OQ_STATUS_LABEL[v]}</option>`).join("")}
      </select></label>
      <label>严重度 <select id="df-severity-filter"><option value="all">全部</option>
        ${["high", "medium", "low"].map((v) => `<option value="${v}"${decisionState.severityFilter === v ? " selected" : ""}>${v}</option>`).join("")}
      </select></label>
      <input id="df-keyword" placeholder="搜索问题 ID 或描述" value="${esc(decisionState.keyword)}" style="flex:1;min-width:160px">
    </div>
    <div class="dec-note">裁决在本页内存中完成（刷新丢失，正式裁决请及时导出）。导出后执行：node .claude/skills/interactive-game-prd/scripts/apply-decisions.mjs examples/mahjong/game-spec decisions.json --dry-run 预演，通过后去掉 --dry-run 落盘，再重跑 build-html 刷新本文件。AI 不代人工提交：点「正式裁决」与「导出」即人工确认动作。reviewer 固定为 human。</div>
    <div class="dec-layout">
      <div class="dec-list" id="dec-list"></div>
      <div class="dec-main" id="dec-main"><span style="color:#99a">点击左侧未决问题查看详情与裁决</span></div>
      <div class="dec-impact" id="dec-impact"></div>
    </div>`;
  $("#view").innerHTML = html;
  renderDecisionList();
  $("#dec-list").addEventListener("click", (e) => {
    const a = e.target.closest("[data-oq]");
    if (a) selectOq(a.dataset.oq);
  });
  // 筛选只重渲染列表（不动中栏表单，不清空已编辑草稿）
  $("#df-status-filter").addEventListener("change", (e) => { decisionState.statusFilter = e.target.value; renderDecisionList(); });
  $("#df-severity-filter").addEventListener("change", (e) => { decisionState.severityFilter = e.target.value; renderDecisionList(); });
  $("#df-keyword").addEventListener("input", (e) => { decisionState.keyword = e.target.value; renderDecisionList(); });
  $("#dec-export").addEventListener("click", exportDecisions);
  if (decisionState.selectedOqId) selectOq(decisionState.selectedOqId);
}

function selectOq(oid) {
  const q = OQ_LIST.find((x) => x.id === oid);
  if (!q) return;
  decisionState.selectedOqId = oid;
  document.querySelectorAll("#dec-list .dec-item").forEach((a) => a.classList.toggle("active", a.dataset.oq === oid));
  const draft = DECISIONS[oid] || DEC_DRAFTS[oid] || {};
  $("#dec-main").innerHTML = `<h3>${esc(q.id)}（severity：${esc(q.severity || "")}）</h3>
    <div class="quote">${esc(q.question || "")}</div>
    <div style="color:#889;font-size:12px">关联需求：${esc(q.requirement_id || "待补充关联")}</div>
    <h4 style="margin:12px 0 4px">裁决</h4>
    <div class="dec-form">
      <label>结论 <select id="df-status">
        <option value="approved"${draft.decision_status === "approved" ? " selected" : ""}>确认通过（approved）</option>
        <option value="rejected"${draft.decision_status === "rejected" ? " selected" : ""}>否决（rejected）</option>
        <option value="deferred"${draft.decision_status === "deferred" ? " selected" : ""}>挂起（deferred）</option>
      </select></label>
      <label>口径 <select id="df-outcome">
        <option value="adopted"${draft.outcome === "adopted" ? " selected" : ""}>采纳当前口径（adopted）</option>
        <option value="modified"${draft.outcome === "modified" ? " selected" : ""}>人工修改后采纳（modified）</option>
        <option value="rejected"${draft.outcome === "rejected" ? " selected" : ""}>否决口径（rejected）</option>
        <option value="deferred"${draft.outcome === "deferred" ? " selected" : ""}>挂起待定（deferred）</option>
      </select></label>
      <label>理由（正式裁决必填；修改口径时需写明最终口径） <textarea id="df-rationale" rows="3">${esc(draft.rationale || "")}</textarea></label>
      <div id="dec-msg" style="color:#1a73e8;font-size:12px"></div>
    </div>
    <div class="dec-actions">
      <button class="btn-dec" id="dec-prev">上一个</button>
      <button class="btn-dec" id="dec-next">下一个</button>
      <button class="btn-dec" id="dec-draft">暂存草稿</button>
      <button class="btn-dec primary" id="dec-confirm">正式裁决</button>
    </div>`;
  $("#dec-prev").addEventListener("click", () => stepOq(-1));
  $("#dec-next").addEventListener("click", () => stepOq(1));
  $("#dec-draft").addEventListener("click", () => saveDecision(oid, "draft"));
  $("#dec-confirm").addEventListener("click", () => saveDecision(oid, null));
  renderDecisionImpact(q);
}

// 右栏：影响分析（只基于真实关联数据，无关联显示「待补充关联」）
function renderDecisionImpact(q) {
  const r = reqById.get(q.requirement_id);
  const hist = DEC_LOG.filter((d) => d.question_id === q.id);
  const prev = hist.length ? hist[hist.length - 1] : null;
  let html = `<h4 style="margin:0 0 6px">影响分析</h4>`;
  if (r) {
    html += `<div class="req-card" style="margin-bottom:8px"><h3 style="font-size:13px">${esc(r.id)} ${esc(r.name)} ${badges(r)}</h3>
      <div style="font-size:12px">${esc(r.description || "")}</div>
      <div style="color:#889;font-size:12px;margin-top:4px">关联 UI：${esc((r.ui_refs || []).join("、") || "无")}</div>
      <div style="color:#889;font-size:12px">关联测试：${esc((r.test_refs || []).join("、") || "无")}</div>
      <div style="color:#889;font-size:12px">依赖：${esc((r.dependencies || []).join("、") || "无")}</div></div>`;
  } else {
    html += `<div class="warn-open">待补充关联：本问题尚未建立 requirement_id 关联（或关联需求不存在），不得从问题描述猜测影响。</div>`;
  }
  if (q.images && q.images.length) html += `<div class="warn-open">附图依据：${esc(q.images.join("、"))} —— 需人工提供截图文本补充</div>`;
  if (prev) {
    html += `<h4 style="margin:10px 0 4px">历史裁决（${hist.length}）</h4>`;
    for (const d of hist) html += `<div style="font-size:12px;margin:4px 0;border-bottom:1px dashed #e3e6ea;padding-bottom:4px">${esc(d.decision_id)} ${esc(d.decision_status)} / ${esc(d.outcome)}${d.supersedes ? "（supersedes " + esc(d.supersedes) + "）" : ""}<div style="color:#889">${esc(String(d.rationale || "").slice(0, 60))}</div></div>`;
    html += `<div class="dec-note">本次裁决将自动写入 supersedes 指向 ${esc(prev.decision_id)}。</div>`;
  }
  $("#dec-impact").innerHTML = html;
}

// 底部操作栏：上一个 / 下一个（在当前筛选结果内移动）
function stepOq(dir) {
  const list = visibleOqs();
  if (!list.length) return;
  const idx = list.findIndex((q) => q.id === decisionState.selectedOqId);
  const next = list[Math.min(list.length - 1, Math.max(0, (idx < 0 ? 0 : idx) + dir))];
  if (next) selectOq(next.id);
}

// 正式裁决后：更新状态并自动定位下一个待裁决问题
function afterDecisionSaved(oid) {
  const next = visibleOqs().find((q) => oqStatus(q) === "open");
  decisionState.selectedOqId = next ? next.id : oid;
  renderDecisionWorkbench();
}

function syncOutcome(status, chosen) {
  if (status === "approved") return chosen === "modified" ? "modified" : "adopted";
  return status;
}

function saveDecision(oid, forceDraft) {
  const q = OQ_LIST.find((x) => x.id === oid);
  const status = forceDraft ? "draft" : $("#df-status").value;
  const rationale = $("#df-rationale").value.trim();
  const msg = $("#dec-msg");
  if (!forceDraft && !rationale) { msg.textContent = "正式裁决必须填写理由"; return; }
  const prevMem = DECISIONS[oid];
  const prev = decPrevInLog(oid);
  const reuseId = prevMem && prevMem.decision_status !== "draft" && status !== "draft";
  const rec = {
    decision_id: reuseId ? prevMem.decision_id : "DEC-" + String(++decSeq).padStart(3, "0"),
    question_id: oid,
    decision_status: status,
    outcome: syncOutcome(status, $("#df-outcome").value),
    final_decision: null,
    rationale,
    reviewer: "human",
    decided_at: new Date().toISOString(),
    requirement_updates: [],
    affected: {
      requirements: [q.requirement_id].filter(Boolean),
      tests: ((reqById.get(q.requirement_id) || {}).test_refs) || [],
      ui: ((reqById.get(q.requirement_id) || {}).ui_refs) || [],
      simulator: /^GAME-RULE/.test(q.requirement_id || ""),
    },
  };
  const sup = (prevMem && prevMem.decision_status !== "draft") ? prevMem.decision_id : (prev ? prev.decision_id : null);
  if (sup && status !== "draft") rec.supersedes = sup;
  if (status === "draft") { delete rec.decided_at; }
  DECISIONS[oid] = rec;
  if (status === "draft") { msg.textContent = "已暂存草稿（仅存本页内存，刷新丢失）"; renderDecisionList(); }
  else afterDecisionSaved(oid);
}

function exportDecisions() {
  const list = Object.values(DECISIONS).filter((d) => d.decision_status !== "draft");
  const msg = $("#dec-export-msg");
  if (!list.length) { msg.textContent = "尚无正式裁决（草稿不导出），先在中间栏完成正式裁决"; return; }
  const blob = new Blob([JSON.stringify(list, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "decisions.json";
  a.click();
  URL.revokeObjectURL(a.href);
  msg.textContent = `已导出 ${list.length} 条正式裁决到 decisions.json（浏览器下载目录）`;
}
window.__exportDecisionsData = () => JSON.parse(JSON.stringify(Object.values(DECISIONS).filter((d) => d.decision_status !== "draft")));

// ---------- 判定日志 ----------
function appendLog(msg) {
  const body = $("#log-body");
  const div = document.createElement("div");
  div.textContent = msg;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

// ---------- 初始化 ----------
document.getElementById("game-title").textContent = (APP_DATA.manifest && APP_DATA.manifest.game_name) || "未命名游戏";
document.getElementById("game-meta").textContent =
  `IR v${(APP_DATA.manifest && APP_DATA.manifest.ir_version) || "?"} · 需求 ${APP_DATA.requirements.length + APP_DATA.configs.length + APP_DATA.states.length} 条 · UI 页面 ${APP_DATA.ui.pages.length} · 用例 ${APP_DATA.tests.cases.length} · 生成于构建时`;
document.getElementById("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b) switchTab(b.dataset.tab);
});
// 规格工作台内容区点击委托（一次绑定，避免重复挂监听）：需求卡片详情 / 页面卡片详情 / 跳 UI 定位
$("#view").addEventListener("click", (e) => {
  const goto = e.target.closest("[data-goto-ui]");
  if (goto) { switchTab("ui", () => focusByRequirement(goto.dataset.gotoUi)); return; }
  const page = e.target.closest("[data-page]");
  if (page) { showPageDetail(page.dataset.page); return; }
  const card = e.target.closest(".req-card[data-anchor]");
  if (card && card.dataset.anchor.startsWith("GAME-")) showDetail(reqById.get(card.dataset.anchor));
});
renderNav();
switchTab("spec");
if (location.hash.startsWith("#req=")) showRequirement(decodeURIComponent(location.hash.slice(5)));
</script>
