逐个模拟打出合法手牌」的打听型提示，完全没有查听按钮、已听牌态常驻展示、按钮入口与显隐时机，也没有两类听牌数据的分类与合并口径。","original_text":"位置“3.2.5 手牌信息「听牌标签」、3.2.5.1 手牌交互说明「听牌标签显示规则」、4.5 提牌、3.2.5「手牌信息」听牌标签、3.2.5.1「手牌交互说明」听牌标签显示规则”。引文：“听牌详情面板的开启与收起。仅本端展示。提起带听牌标签的候选牌时，打开该牌打出后的听牌详情。横滑或点选另一张候选牌时，汇总、牌项及面板尺寸随选中牌同步刷新。取消提牌、改选非候选牌、确认出牌或离开本家可出牌阶段时收起。”","problem":"基准 02#8 规定常驻听牌组件含「查听按钮＋自动胡按钮」，查听按钮在有已听牌数据且自己未胡时显示，并规定出牌后显、摸牌后隐、取得出牌权隐、自己胡/局终隐、点击桌面隐；02#10 规定点查听按钮打开听牌列表、重复点击切换关闭；02#2 区分「查听（已听牌态）」与「打听（打哪张听什么）」两类数据与混合写入顺序。需求全文只有「出牌前逐个模拟打出合法手牌」的打听型提示，完全没有查听按钮、已听牌态常驻展示、按钮入口与显隐时机，也没有两类听牌数据的分类与合并口径。","impact":"已听牌玩家在本家回合之外没有任何查看听牌信息的入口，核心功能缺失；开发按现文档只会实现提牌详情，「查听按钮」无法落地；测试与验收无按钮显隐标准。","suggestion":"新增「常驻听牌组件」小节：位置与样式、查听按钮＋自动胡按钮；查听按钮显示条件（存在已听牌数据且本家未胡）；显隐时机（出牌后显、摸牌后隐、取得出牌权隐、自己胡/局终隐、点击桌面隐）；点击打开列表、再次点击关闭；查听与打听两类数据的来源、混合写入顺序与合并规则。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"已听牌且非本家回合：点查听按钮可打开列表并按 02#9 排序，再次点击关闭；摸牌后按钮消失、取得出牌权后消失、胡牌与局终消失、点击桌面消失。测试可直接按上述 5 个时机出用例。"},{"id":"Q02","title":"全文未描述 end_wait 快照自动应答，服务端会卡死","priority":"P0","type":"需求缺失","module":["断线重连 / 场景恢复"],"dimension":"UI 交互","source_location":"7.2 同步与异常处理「重连恢复」、4.4 发牌、4.6 吃碰杠胡操作（胡牌演出）","rule_ref":"04#13,04#14,04#15,04#16。基准规定：行牌/发牌/洗牌三个场景命令的快照若带 end_wait，客户端必须立即自动应答，防止服务端一直等待；正常发牌要在发牌动画完成时（含摊牌后 1 秒兜底）才解除重连标记并应答；第 2 局起发牌后跳过界面等待直接应答；胡牌多段动画中应答只发一次。需求文档完全没有这条链路。","original_text":"位置“7.2 同步与异常处理「重连恢复」、4.4 发牌、4.6 吃碰杠胡操作（胡牌演出）”。需求文档无对应描述。","problem":"基准规定：行牌/发牌/洗牌三个场景命令的快照若带 end_wait，客户端必须立即自动应答，防止服务端一直等待；正常发牌要在发牌动画完成时（含摊牌后 1 秒兜底）才解除重连标记并应答；第 2 局起发牌后跳过界面等待直接应答；胡牌多段动画中应答只发一次。需求文档完全没有这条链路。","impact":"重连落在发牌或胡牌演出阶段时，客户端不会回 end_wait，服务端持续等待，整桌卡在发牌/结算前无法继续；测试也无法构造 end_wait 相关用例。","suggestion":"在 7.2 增加「场景应答（end_wait）」小节：1）行牌/发牌/洗牌快照带 end_wait 即自动应答，无需玩家操作；2）正常发牌路径在发牌动画结束或摊牌后 1 秒兜底应答；3）第 2 局起发牌后跳过界面等待直接应答；4）胡牌多段动画只发一次，重复到达不再发。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"在发牌进行中、发牌结束未进入行牌、胡牌多段演出进行中三个时点断线重连：客户端在恢复完成后（发牌为动画完成或 1 秒内）各回一次 end_wait，服务端不出现等待超时，整桌能继续到下一操作阶段；无重复应答。"},{"id":"Q03","title":"小结算缺输赢流水明细与总番","priority":"P1","type":"需求缺失","module":["小结算界面"],"dimension":"UI 交互","source_location":"结算流程/流程明细（小结算与下一局）、结算界面/小结算界面（好友房）/UI交互以及说明 1-12","rule_ref":"03#10,03#12。基准小结算需展示额外流水与流水汇总、总番，流水文案为“动作(番名)[方位] ±N分”，并按本家/上家/下家/对家生成方位文案；需求文档 12 项只定义了头像昵称、手牌、分数、承包标识、番型名、胡张、财神、按钮，没有流水列表、流水汇总与总番，也没有一炮多响之外的多笔赔付（自摸三笔、承包/反承包/链式承包）如何逐条呈现的规则。","original_text":"位置“结算流程/流程明细（小结算与下一局）、结算界面/小结算界面（好友房）/UI交互以及说明 1-12”。引文：“各行展示本局摊牌、得分及结果标识；赢家牌组上方的番型文字仅显示番型名称及复合次数，使用黄色。”","problem":"基准小结算需展示额外流水与流水汇总、总番，流水文案为“动作(番名)[方位] ±N分”，并按本家/上家/下家/对家生成方位文案；需求文档 12 项只定义了头像昵称、手牌、分数、承包标识、番型名、胡张、财神、按钮，没有流水列表、流水汇总与总番，也没有一炮多响之外的多笔赔付（自摸三笔、承包/反承包/链式承包）如何逐条呈现的规则。","impact":"玩家只能看到每人净得分，无法核对每笔分数来源；承包、反承包、链式承包多笔赔付无法在界面校验，算分正确性不可验收，开发也无法确定流水区结构。","suggestion":"在小结算 UI 清单中新增流水区：列出每笔流水的动作/番型/方位/±N分，说明同一赢家的多笔赔付如何排序与汇总，明确总番计算与展示位置；本期虽不允许多胡，自摸三笔与承包多笔仍需覆盖。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"对自摸、点炮、抢杠胡、三摊承包、反承包、链式承包、黄庄分别出用例：流水逐笔可见且合计等于该玩家本局净得分，总番与番型档一致；黄庄无流水或流水为空且四家 0 分。"},{"id":"Q04","title":"离线解散预警与断线等待终点缺失（本类主条目，Q16 同根因）","priority":"P1","type":"需求缺失","module":["玩家头像·离线状态 / 断线等待"],"dimension":"UI 交互","source_location":"三.对局流程 / 3.2.3 玩家头像信息·玩家状态·离线状态；3.2.1 方位信息·倒计时；7.2 同步与异常处理、三、3.2.1 方位信息「倒计时」；三、3.2.3 玩家头像信息「离线状态」；七、7.2 同步与异常处理","rule_ref":"05#14。基准 05#14 规定玩家离线触发离线解散预警提示（好友房缺省 600 秒，房间配置可覆盖）。需求只有离线图标与不断递增的分:秒计时，没有任何预警文案/阈值/返回后隐藏规则，也没有说明离线期间倒计时是否继续、其他玩家能否操作、到阈值后由谁解散、如何提示。3.2.1 还把“断线等待”交叉引用到 7.2，但 7.2 并无断线等待规则，属悬空引用。","original_text":"位置“三.对局流程 / 3.2.3 玩家头像信息·玩家状态·离线状态；3.2.1 方位信息·倒计时；7.2 同步与异常处理、三、3.2.1 方位信息「倒计时」；三、3.2.3 玩家头像信息「离线状态」；七、7.2 同步与异常处理”。需求文档无对应描述。","problem":"基准 05#14 规定玩家离线触发离线解散预警提示（好友房缺省 600 秒，房间配置可覆盖）。需求只有离线图标与不断递增的分:秒计时，没有任何预警文案/阈值/返回后隐藏规则，也没有说明离线期间倒计时是否继续、其他玩家能否操作、到阈值后由谁解散、如何提示。3.2.1 还把“断线等待”交叉引用到 7.2，但 7.2 并无断线等待规则，属悬空引用。","impact":"断线玩家可无限挂房，另外三家无法推进也无法判断何时能重开；开发不知道离线期间时钟与操作权如何处理；测试无法为“断线等待/离线解散”出任何用例，与现网的离线解散表现不一致。","suggestion":"补充离线解散预警小节：触发时机（玩家转为离线）、阈值（缺省 600 秒，可被房间配置覆盖）、提示形式与位置、计时与隐藏规则、玩家返回在线时立即隐藏、与超时提示/托管提醒的互斥关系；并在 7.2 补“断线等待”定义：离线期间倒计时是否继续、操作权归属、到达阈值后的解散与提示文案。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"玩家离线后其头像旁出现离线解散预警并按秒递减；阈值到点房间解散并给出提示；阈值内回线预警立即消失且对局继续；断线期间其他玩家的倒计时与操作权有明确用例，可直接断言。"},{"id":"Q05","title":"牌墙画面、骰点定多墩与发牌消耗动画均未描述（与 Q71 同根因，重复登记，建议合并）","priority":"P1","type":"需求缺失","module":["开局流程 / 桌面牌墙"],"dimension":"UI 交互","source_location":"3.1 桌面布局 / 3.2.1 方位信息（骰子）/ 3.2.2 玩法信息（剩余张数）/ 4.4 发牌（发牌UI以及动画表现）","rule_ref":"08#8,08#9。UI 基准 08#8 要求牌墙按骰子结果推算哪边多一墩且显示开关按玩家设置，08#9 要求发牌时牌墙逐张消失（每张 0.25 秒）；需求只在规则里把「牌墙」当成数据源（余牌数、杠尾补牌），完全没有展示规格，属整块 UI 缺失。","original_text":"位置“3.1 桌面布局 / 3.2.1 方位信息（骰子）/ 3.2.2 玩法信息（剩余张数）/ 4.4 发牌（发牌UI以及动画表现）”。需求文档无对应描述。","problem":"UI 基准 08#8 要求牌墙按骰子结果推算哪边多一墩且显示开关按玩家设置，08#9 要求发牌时牌墙逐张消失（每张 0.25 秒）；需求只在规则里把「牌墙」当成数据源（余牌数、杠尾补牌），完全没有展示规格，属整块 UI 缺失。","impact":"客户端无法确定牌墙的位置、墩数、朝向与消失节奏，开局画面只能自行发挥；测试无法核对骰点与多一墩方位是否一致，也无法验收 136→83 的牌墙视觉消耗。","suggestion":"与 Q71 合并处理：在桌面布局新增「牌墙」模块：给出四人牌墙柱数、朝向、贴近方位盘的摆放；列出骰点与开牌方位、哪边多一墩的对应关系；写明牌墙显示开关归属（本方案或设置模块）；补充发牌阶段牌墙逐张消失（每张约 0.25 秒）与余牌数 136→83 的同步关系。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"四端牌墙外观一致；按任意骰子点数可核对多一墩方位；发牌完成后牌墙余 83 张且余牌数显示 83；关闭显示开关后牌墙隐藏、余牌数与摸牌仍正常；发牌时牌墙按张消失并与余牌数同帧更新。"},{"id":"Q06","title":"杠阶段手牌压暗与清灰口径与基准冲突","priority":"P1","type":"逻辑错误","module":["碰杠胡操作区/手牌置灰"],"dimension":"UI 交互","source_location":"4.6 吃碰杠胡操作（杠）、4.7 多操作状态（可多杠）","rule_ref":"01#15,01#17。基准 01#15 规定“有碰或杠权限且无胡权限时，除目标牌外整手置灰”，01#17 规定点碰/杠/过按钮即清灰；需求却规定“可杠组仅由原有牌组成时不压暗”“进入多杠选组后沿用进入前的压暗”，两处与基准口径相反。","original_text":"位置“4.6 吃碰杠胡操作（杠）、4.7 多操作状态（可多杠）”。引文：““可杠组仅由原有的牌组成时，手牌保持当前亮度。”；“点【杠】进入选组后，继续显示进入前的手牌亮度，牌位和碰杠区保持原状。””","problem":"基准 01#15 规定“有碰或杠权限且无胡权限时，除目标牌外整手置灰”，01#17 规定点碰/杠/过按钮即清灰；需求却规定“可杠组仅由原有牌组成时不压暗”“进入多杠选组后沿用进入前的压暗”，两处与基准口径相反。","impact":"按需求实现会与现网置灰表现不一致；同一手牌在“可杠”与“选组”两种状态下亮度不同，测试和验收没有可比对的标尺。","suggestion":"明确杠权限下的置灰口径：是否统一按“除可组成杠的牌外整手置灰”，点【杠】进入选组（及取消/提交）时是否清除本次压暗；若“原有暗杠不压暗”是产品有意设计的例外，请在正文标注为与现网差异并给出判定条件。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"给出“新摸牌可暗杠、仅原有牌可暗杠、加杠”三类场景的手牌亮度口径，以及选组前后亮度对照；测试可按状态逐项断言。"},{"id":"Q07","title":"同牌面多张候选的标签位置与基准冲突","priority":"P1","type":"逻辑错误","module":["听牌标签（手牌箭头）"],"dimension":"UI 交互","source_location":"3.2.5 手牌信息「听牌标签」、3.2.5.1 听牌标签显示规则、混合举例","rule_ref":"02#6。基准 02#6 明确「同牌值只标第一张」。需求改为最右侧显示推荐文字、其余同牌值全部显示箭头，标注数量（一个牌面多个标签）与标注位置（最右而非第一张）都与现网不一致，且与 02#3「箭头样式按听型区分」的单点标记模型矛盾。","original_text":"位置“3.2.5 手牌信息「听牌标签」、3.2.5.1 听牌标签显示规则、混合举例”。引文：“相同牌面有多张候选时，最右侧显示推荐文字，其余显示箭头。……最右侧2筒显示大，其他2筒显示箭头（因为4倍最大，且2筒有多张）。”","problem":"基准 02#6 明确「同牌值只标第一张」。需求改为最右侧显示推荐文字、其余同牌值全部显示箭头，标注数量（一个牌面多个标签）与标注位置（最右而非第一张）都与现网不一致，且与 02#3「箭头样式按听型区分」的单点标记模型矛盾。","impact":"同一牌面会出现多个标签，遮挡牌面并挤占手牌间距；与现网及其他端表现不一致，联调会被判为缺陷；美术与手牌布局需要返工。","suggestion":"按基准统一为「同牌值只在该组第一张显示一档标签」；若确为新增需求，须标注「与现网差异」并给出理由与设计稿，同时修改 3.2.5.1「混合举例」中的 2筒／5筒 描述。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"手牌中同一牌值有 3 张候选时，该牌面只出现 1 个标签，且位于该组最左一张；其余两张无标签。"},{"id":"Q08","title":"末局直接返回大厅，未接入大结算（本类主条目，Q40 同根因）","priority":"P1","type":"逻辑错误","module":["大结算"],"dimension":"UI 交互","source_location":"结算流程/流程明细（小结算与下一局）、结算界面/小结算界面（好友房）/触发逻辑「本场结束」、附录 A 片数、6.1.1「触发逻辑」本场结束、附录 A「后续版本配置」片数","rule_ref":"03#14,03#17,03#18,03#19。UI 基准规定继续游戏按钮在最后一局应转为弹大结算，且大结算需展示总局数、起止时间、房主、每家自摸/接炮/叫嘴次数等明细；需求文档把末局处理为【返回大厅】直接离房，全篇没有大结算界面、数据项、弹出时机与防重规则，只在附录 A 片数模式里提到“进入大结算”，两处口径也不一致。","original_text":"位置“结算流程/流程明细（小结算与下一局）、结算界面/小结算界面（好友房）/触发逻辑「本场结束」、附录 A 片数、6.1.1「触发逻辑」本场结束、附录 A「后续版本配置」片数”。引文：“底部绿色主按钮在非末局显示【继续游戏】，在末局显示【返回大厅】。……达到设定局数后，各端显示末局小结算，底部中央显示绿色【返回大厅】。点击后，仅该玩家收起小结算、离开房间并返回大厅。”","problem":"UI 基准规定继续游戏按钮在最后一局应转为弹大结算，且大结算需展示总局数、起止时间、房主、每家自摸/接炮/叫嘴次数等明细；需求文档把末局处理为【返回大厅】直接离房，全篇没有大结算界面、数据项、弹出时机与防重规则，只在附录 A 片数模式里提到“进入大结算”，两处口径也不一致。","impact":"第 8 局结束后玩家直接离房，看不到本场汇总，无法核对全场输赢与胡牌次数；开发不知道是否需要实现大结算，验收缺少整场结束的判定依据。","suggestion":"二选一并写明：1）按基准补大结算：动画链第 4 步延迟 2 秒弹出、已显示则跳过、解散局跳过动画链立即弹出、收到大结算事件后小结算强制切“最后一局”页，并列出数据项；2）若本期确定不做，明确写出“本期不做大结算”及与现网的差异说明，并把末局按钮文案与去向写全。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"第 8 局小结算点主按钮后，按文档规定或弹出大结算并展示总局数/起止时间/房主/每家明细，或明确不弹且直接回大厅；解散局不弹大结算；重复大结算事件不重复弹。测试可按局数与按钮点击直接写用例。"},{"id":"Q09","title":"亮牌先于番型，与基准番型在前、摊牌在后相反","priority":"P1","type":"逻辑错误","module":["结算流程/胡牌演出"],"dimension":"UI 交互","source_location":"结算流程/流程明细（胡牌场景）、吃碰杠胡操作/吃胡（点炮胡）、抢杠胡、结算界面/小结算界面（好友房）/触发逻辑「胡牌后进入」","rule_ref":"03#1。基准局终链为：收操作区→隐藏出牌放大→摊牌前置→各家胡牌态→①点炮动画+赢家番型动画→②摊牌+台面标识（每步停留 1.5 秒）→③小结算→④大结算；需求文档多处把“亮出四家手牌”与「对局结束」同帧触发，番型在亮牌之后才播，顺序与基准相反。","original_text":"位置“结算流程/流程明细（胡牌场景）、吃碰杠胡操作/吃胡（点炮胡）、抢杠胡、结算界面/小结算界面（好友房）/触发逻辑「胡牌后进入」”。引文：“各端在原牌桌上亮出四家手牌，同时在桌面中央显示橙金色「对局结束」。……「对局结束」仍在桌面时，在胡牌者对应方位播放番型字效。”","problem":"基准局终链为：收操作区→隐藏出牌放大→摊牌前置→各家胡牌态→①点炮动画+赢家番型动画→②摊牌+台面标识（每步停留 1.5 秒）→③小结算→④大结算；需求文档多处把“亮出四家手牌”与「对局结束」同帧触发，番型在亮牌之后才播，顺序与基准相反。","impact":"开发按文档实现会在番型动画前就把四家手牌全部摊开，后续摊牌段没有可播内容；测试与验收没有统一的时序基准，无法判断对错。","suggestion":"明确写出结算演出阶段表：各阶段的进入条件、结束条件、停留时长与由哪一段回调推进；把番型/点炮动画置于摊牌之前，摊牌后显示台面标识，再进小结算。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"用四家同局录屏逐帧断言：番型字效先出现，随后四家手牌摊开并显示台面标识，再出现小结算；各段停留时长有明确参数，测试可直接计时。"},{"id":"Q10","title":"超时后无限等待与超时提示及自动解散冲突（本类主条目，Q26、Q31 同根因）","priority":"P1","type":"逻辑错误","module":["倒计时与超时提示"],"dimension":"UI 交互","source_location":"三.对局流程 / 3.2.1 方位信息·倒计时；4.5 行牌操作·出牌；7.2 同步与异常处理·重连恢复、3.2.1「方位信息—倒计时」、4.5「行牌操作—出牌」倒计时归零说明","rule_ref":"05#12,05#13。基准 05#12 规定超时后由服务端驱动弹出超时提示层（提示阈值缺省 60 秒、解散阈值缺省 300 秒，可在房间配置覆盖；层内每秒自增显示当前超时秒数，文案含“超时N秒自动解散房间”），到期自动解散；05#13 规定该玩家恢复操作后关闭提示并弹“已返回”横幅。该体系属于好友房通用超时流程，不因“无托管”而关闭。需求把归零后定义为保持 00 无限等待，7.2 进一步写成“等待手动操作或有玩家主动解散”，完全未定义提示层、阈值、计数与超时解散，并用“主动解散”排除了超时自动解散。","original_text":"位置“三.对局流程 / 3.2.1 方位信息·倒计时；4.5 行牌操作·出牌；7.2 同步与异常处理·重连恢复、3.2.1「方位信息—倒计时」、4.5「行牌操作—出牌」倒计时归零说明”。引文：“「出牌或响应倒计时归零后保持 00，继续等待手动出牌或响应。断线等待和解散见 7.2「同步与异常处理」」；「无托管时，倒计时归零后等待手动操作或有玩家主动解散。」”","problem":"基准 05#12 规定超时后由服务端驱动弹出超时提示层（提示阈值缺省 60 秒、解散阈值缺省 300 秒，可在房间配置覆盖；层内每秒自增显示当前超时秒数，文案含“超时N秒自动解散房间”），到期自动解散；05#13 规定该玩家恢复操作后关闭提示并弹“已返回”横幅。该体系属于好友房通用超时流程，不因“无托管”而关闭。需求把归零后定义为保持 00 无限等待，7.2 进一步写成“等待手动操作或有玩家主动解散”，完全未定义提示层、阈值、计数与超时解散，并用“主动解散”排除了超时自动解散。","impact":"开发按现文实现后，挂机玩家可无限停留、房间不因超时回收，与现网表现不一致；测试无法验收“超时→提示→自动解散/返回”链路，也无法判断 7.2 的“断线等待”终点；多人超时同时发生时无收敛规则。","suggestion":"在 3.2.1/4.5/7.2 补齐超时提示体系：触发（服务端超时事件）、展示时机与层级、两行文案、提示阈值 60 秒与解散阈值 300 秒（缺省可被房间配置覆盖）、当前超时秒数每秒 +1、玩家恢复操作后关闭提示并弹“已返回”、与解散流程的衔接；同时澄清 3.2.3 的“界面不展示托管提示”仅指托管状态提示，不含超时/离线解散提醒。若本期确定不做，须显式写明“本期不实现超时提示与超时自动解散”并与“按无托管处理”区分，另附与现网差异说明。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"他人出牌超时满 60 秒，各端出现提示层且“当前超时时间”每秒 +1；满 300 秒房间解散；该玩家恢复操作后提示层关闭并出现“已返回”；自己超时的表现按最终口径有单独用例；若声明不做，则用例为“超时后无提示层且房间不自动解散”，并作为差异项登记验收。"},{"id":"Q11","title":"余牌数位置与基准冲突（基准在返回按钮栏）","priority":"P1","type":"逻辑错误","module":["桌面常驻元素/剩余牌数"],"dimension":"UI 交互","source_location":"三、对局流程 3.2.2 玩法信息「剩余张数」","rule_ref":"07#7。基准#7 明确剩余牌数组件挂在返回按钮栏；需求把余牌数放在中央骰盘右侧，两者位置互斥，且需求未声明这是有意改版。","original_text":"位置“三、对局流程 3.2.2 玩法信息「剩余张数」”。引文：“余牌数显示在中央骰盘右侧。骰盘切换为行牌倒计时后，余牌数继续显示在右侧。”","problem":"基准#7 明确剩余牌数组件挂在返回按钮栏；需求把余牌数放在中央骰盘右侧，两者位置互斥，且需求未声明这是有意改版。","impact":"客户端按需求实现会与现网布局不一致，UI 走查、多端截图对比与验收基准冲突；若复用现网组件位置又与需求文字矛盾，开发需二次确认。","suggestion":"二选一：改为「剩余牌数组件挂在返回按钮栏」，或在 3.2.2 增加「与现网差异：由返回按钮栏移至中央骰盘右侧」并给出发牌期、行牌期两处锚点与左右相对位置。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"发牌期与行牌期各截一张四人桌面：余牌数出现位置与基准一致，或需求中已有明确的差异说明被引用；测试可直接按截图判定通过/不通过。"},{"id":"Q12","title":"重连恢复只列数据清单，未规定固定恢复顺序","priority":"P1","type":"描述不完整","module":["断线重连 / 场景恢复"],"dimension":"UI 交互","source_location":"7.2 同步与异常处理「重连恢复」","rule_ref":"04#3。基准规定行牌快照恢复顺序固定为：开局数据（静默）→玩家信息（静默）→游戏配置→局数据→牌墙→手牌→河牌→权限（完整路径）→恢复倒计时/方位灯/头像框→end_wait 应答。需求文档只给出一组要加载的字段，未给顺序，也未说明前序项只写缓存、最后统一刷新，开发可任意排序实现。","original_text":"位置“7.2 同步与异常处理「重连恢复」”。引文：“进入相应页面后，加载该玩家可见的座位、准备和在线状态、局数、庄家及牢数、积分、余牌、公开牌河及牌组、本家手牌和分隔位、行牌方、可用操作及剩余倒计时。已提交且仍待裁决的操作恢复为等待。”","problem":"基准规定行牌快照恢复顺序固定为：开局数据（静默）→玩家信息（静默）→游戏配置→局数据→牌墙→手牌→河牌→权限（完整路径）→恢复倒计时/方位灯/头像框→end_wait 应答。需求文档只给出一组要加载的字段，未给顺序，也未说明前序项只写缓存、最后统一刷新，开发可任意排序实现。","impact":"恢复顺序不同会产生可见错误：权限先于手牌恢复会出现按钮与手牌不匹配；倒计时先于局数据恢复会先跳秒再被覆盖；方位灯/头像框不随倒计时一起恢复会出现高亮与数字不同步，且无验收口径。","suggestion":"在 7.2 补一张恢复顺序表，逐项写明顺序与是否静默（只写缓存），并把「权限恢复放在手牌、河牌、局数据之后」「倒计时/方位灯/头像框在权限之后统一刷新」写成硬约束。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"测试可按顺序逐项断言：恢复完成时手牌张数/河牌张数/副露与断线前一致，权限按钮只出现在实际有操作资格的座位上，倒计时与方位高亮指向同一操作者且秒数关系正确。"},{"id":"Q13","title":"未要求重连静默恢复、禁止重播开局/摸牌/胡牌动画","priority":"P1","type":"描述不完整","module":["断线重连 / 场景恢复"],"dimension":"UI 交互","source_location":"7.2 同步与异常处理「动画追赶」","rule_ref":"04#5,04#11。基准规定各恢复子命令走「只写数据缓存、不触发界面动画」模式，重连恢复不播开局动画、摸牌动画、胡牌动画。需求的「动画追赶」只覆盖运行中漏事件的追赶，未规定重连首次加载必须静默；按字面「再播放仍有效的动画」，开发会把断线时正在播放的开局/摸牌/胡牌动画重播，甚至重复飘分。","original_text":"位置“7.2 同步与异常处理「动画追赶」”。引文：“动画追赶。按服务端事件顺序更新。检测到漏事件或界面落后时，跳过已过期的过场和操作提示，直接恢复到最新状态，再播放仍有效的动画。倒计时以服务端时间为准。”","problem":"基准规定各恢复子命令走「只写数据缓存、不触发界面动画」模式，重连恢复不播开局动画、摸牌动画、胡牌动画。需求的「动画追赶」只覆盖运行中漏事件的追赶，未规定重连首次加载必须静默；按字面「再播放仍有效的动画」，开发会把断线时正在播放的开局/摸牌/胡牌动画重播，甚至重复飘分。","impact":"重连后出现摇骰、摸牌、胡牌动画重播，胡牌局重复飘分，界面停留时间被拉长，玩家看到与断线前不一致的牌桌；测试无法判定是否达标。","suggestion":"区分「首次恢复」与「运行中追赶」：首次恢复按静默模式只写数据缓存后统一渲染，不播开局/摸牌/胡牌动画、不重播飘分与结算演出；追赶仅补播尚未过期的有效事件。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"分别在与局开始时、行牌摸牌动画中、胡牌演出与飘分中、小结算已弹出四个时点断线重连：界面直接呈现最新静态状态，无摇骰/摸牌/胡牌动画重播，无重复飘分。"},{"id":"Q14","title":"换局与解散的界面清理范围不完整（本类主条目，Q61 同根因）","priority":"P1","type":"描述不完整","module":["小结算/换局与解散清理"],"dimension":"UI 交互","source_location":"5.1「流程明细」小结算与下一局、6.1.1「触发逻辑」本场继续/本场结束、7.1「菜单」退出确认、5.1「小结算与下一局」、6.1.1「本场继续」","rule_ref":"06#4。基准要求统一重置事件驱动所有视图各自清理：清数据、按钮态归零、隐藏放大弃牌、停动画、关小结算弹窗。需求只写了清手牌/碰杠区/牌河，未定义：操作按钮组与吃/杠选组面板归位、提牌态与听牌标签、吃碰禁手/飘财压暗、最近弃牌浮标、财神指示牌在局末是否移除、长按预览态复位；7.1 解散流程也只写「各端返回大厅」，未定义结算演出进行中、小结算已弹出、长按预览中三种状态下解散确认后弹层与演出的收尾顺序。","original_text":"位置“5.1「流程明细」小结算与下一局、6.1.1「触发逻辑」本场继续/本场结束、7.1「菜单」退出确认、5.1「小结算与下一局」、6.1.1「本场继续」”。引文：“点击【继续游戏】后，本端收起小结算，回到同桌准备状态。清除本端桌面上上一局的手牌、碰杠区和牌河，保留座位和累计积分。本家显示「已准备」，其余座位按各自操作显示「已准备」或「未准备」。其他端可留在自己的小结算页。”","problem":"基准要求统一重置事件驱动所有视图各自清理：清数据、按钮态归零、隐藏放大弃牌、停动画、关小结算弹窗。需求只写了清手牌/碰杠区/牌河，未定义：操作按钮组与吃/杠选组面板归位、提牌态与听牌标签、吃碰禁手/飘财压暗、最近弃牌浮标、财神指示牌在局末是否移除、长按预览态复位；7.1 解散流程也只写「各端返回大厅」，未定义结算演出进行中、小结算已弹出、长按预览中三种状态下解散确认后弹层与演出的收尾顺序。","impact":"下一局可能残留上一局的压暗/提牌/提示大字/浮标/财神指示牌；解散时可能出现小结算与解散确认框叠层、或结算演出被打断后无人收尾，开发和测试都无法判定正确终态。","suggestion":"在 5.1/6.1.1 增加「下一局重置清单」：逐项列出需归零的视图与状态（按钮组、选组面板、提牌、听牌标签、压暗、浮标、放大牌、番型与「对局结束」/「黄庄」大字、飘分、财神指示牌、长按预览）；在 7.1 增加解散时的界面收尾规则：先关小结算/长按预览/确认框再回大厅，并声明解散优先时中止结算演出且不弹小结算。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"测试可就「点继续游戏后桌面无任何上一局残留」「任一小结算或长按预览状态下被解散，各端均不残留弹层且直接回大厅」直接出用例；清单条目逐项可勾选。"},{"id":"Q15","title":"抢杠胡响应阶段按钮与倒计时未定义","priority":"P1","type":"描述不完整","module":["吃碰杠胡 / 抢杠胡"],"dimension":"UI 交互","source_location":"二、2.3.1.4 杠「明杠（加杠）」「抢杠胡」；三、4.6 吃碰杠胡操作「杠」「吃胡（点炮胡）、抢杠胡」","rule_ref":"01#21,07#1。全文只定义抢杠胡成立后的亮牌与结算表现，没有定义响应窗口本身：哪些玩家在本端看到【胡】【过】、使用哪种倒计时（3.2.1 中所述的“所有端同步 10 秒”只适用于由弃牌触发的弃牌响应）、多人可胡时其他玩家是否进入等待、加杠者等待期间碰牌组与补牌的表现、无人抢杠时由哪一事件推进完成加杠。4.6 的响应规则全篇都以“弃牌触发响应”为前提，无法覆盖以加杠为触发源的抢杠胡。","original_text":"位置“二、2.3.1.4 杠「明杠（加杠）」「抢杠胡」；三、4.6 吃碰杠胡操作「杠」「吃胡（点炮胡）、抢杠胡」”。引文：“明杠（加杠）：先处理其他玩家的抢杠胡响应；有人抢杠胡时不完成加杠，也不补牌。……抢杠胡成立时，停止本次加杠及补牌，胡牌张为被抢的加杠牌。”","problem":"全文只定义抢杠胡成立后的亮牌与结算表现，没有定义响应窗口本身：哪些玩家在本端看到【胡】【过】、使用哪种倒计时（3.2.1 中所述的“所有端同步 10 秒”只适用于由弃牌触发的弃牌响应）、多人可胡时其他玩家是否进入等待、加杠者等待期间碰牌组与补牌的表现、无人抢杠时由哪一事件推进完成加杠。4.6 的响应规则全篇都以“弃牌触发响应”为前提，无法覆盖以加杠为触发源的抢杠胡。","impact":"开发无法确定加杠后是否插入响应阶段、是否需要倒计时与按钮，极易实现成“加杠立即完成并补牌”；测试无法为抢杠胡编写交互用例，验收无依据。","suggestion":"在 4.6「杠」下补“抢杠胡响应”子节：加杠提交即进入 10 秒响应阶段；仅具备胡牌资格的玩家在本端手牌右上方看到【胡】【过】，【胡】左侧显示被抢的加杠牌与预览倍数；加杠者本端进入等待态（碰牌组不加入第 4 张、不落补牌、不播【补】标记）；无人可胡或全部点【过】后自动完成加杠并补牌；多人可胡按逆时针就近顺序裁决，最多一人胡。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"构造三牢庄加杠且闲家可胡：四端在加杠提交的同一时点进入 10 秒响应倒计时，可胡端出现【胡】【过】并显示加杠牌；全部放弃后自动完成加杠并落补牌，【补】标记出现；有人点【胡】时，加杠组不出现第 4 张、不补牌，直接进入抢杠胡亮牌与番型演出。"},{"id":"Q16","title":"「断线等待」被引用但 7.2 无对应内容（与 Q04 同根因，重复登记，建议合并）","priority":"P1","type":"描述不完整","module":["断线重连 / 倒计时"],"dimension":"UI 交互","source_location":"三、3.2.1 方位信息「倒计时」；三、3.2.3 玩家头像信息「离线状态」；七、7.2 同步与异常处理","rule_ref":"04#14,07#10。3.2.1 明确把“断线等待”交给 7.2，但 7.2 只写了服务端状态、重连恢复页面、重复提交、动画追赶、手牌可见范围，没有任何“断线等待”的表现定义：倒计时在玩家离线期间是否继续走、走完后停在 00 还是暂停、其他玩家界面是否出现等待或提示、离线者的操作权如何交接。3.2.3 仅定义头像离线覆盖与计时。","original_text":"位置“三、3.2.1 方位信息「倒计时」；三、3.2.3 玩家头像信息「离线状态」；七、7.2 同步与异常处理”。引文：“出牌或响应倒计时归零后保持 00，继续等待手动出牌或响应。断线等待和解散见 7.2「同步与异常处理」。”","problem":"3.2.1 明确把“断线等待”交给 7.2，但 7.2 只写了服务端状态、重连恢复页面、重复提交、动画追赶、手牌可见范围，没有任何“断线等待”的表现定义：倒计时在玩家离线期间是否继续走、走完后停在 00 还是暂停、其他玩家界面是否出现等待或提示、离线者的操作权如何交接。3.2.3 仅定义头像离线覆盖与计时。","impact":"断线场景的倒计时与界面表现无法实现，也无法验收；开发可能自行选择“暂停倒计时”，与以服务端时间为准的口径不一致，造成四端秒数不同步。","suggestion":"与 Q04 合并处理：在 7.2 增加“断线等待”小节：倒计时按服务端时间继续、归零后停在 00 且不自动出牌/不自动解散；离线玩家头像显示深色覆盖与从 00:00 起的离线时长；其余玩家仍看到操作权归属该座位的方位高亮与头像流光；唯一出口为 7.1 的解散或离线者重连后按剩余倒计时恢复。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"断线的玩家轮到出牌时，四端倒计时继续递减至 00 并保持；其余三家仍高亮该座位方位；队伍不解散、不出现自动出牌；该玩家重连后按服务端剩余秒数恢复并能正常操作。"},{"id":"Q17","title":"权限按钮缺少 0.5 秒防连点描述","priority":"P2","type":"需求缺失","module":["操作按钮与权限"],"dimension":"UI 交互","source_location":"7.2 同步与异常处理（重复提交与过期操作）、4.6 吃碰杠胡操作（全文）","rule_ref":"01#11。基准规定每个权限按钮点击后有 0.5 秒防连点（touchable=false 后延迟恢复），需求只写服务端幂等，未定义客户端按钮置灰/不可点的时长与恢复时机。","original_text":"位置“7.2 同步与异常处理（重复提交与过期操作）、4.6 吃碰杠胡操作（全文）”。需求文档无对应描述。","problem":"基准规定每个权限按钮点击后有 0.5 秒防连点（touchable=false 后延迟恢复），需求只写服务端幂等，未定义客户端按钮置灰/不可点的时长与恢复时机。","impact":"连点会向服务端发出重复请求或造成二次触发；测试缺少客户端防连点用例，崩溃或错发后无从归因。","suggestion":"在 4.6/4.8 补一条通用规则：出牌、吃、碰、杠、胡、自摸、过被点击后立即不可点，0.5 秒后恢复（或本次操作机会结束即失效），期间重复点击不提交。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"连点同一按钮多次仅产生一次上行请求；按钮在 0.5 秒内呈不可点状态且不重复提交。"},{"id":"Q18","title":"自动胡按钮缺失且未声明本期是否隐藏","priority":"P2","type":"需求缺失","module":["常驻听牌组件（自动胡）"],"dimension":"UI 交互","source_location":"4.6 吃碰杠胡操作「自摸」「吃胡（点炮胡）、抢杠胡」","rule_ref":"02#8。基准 02#8 规定常驻听牌组件含「自动胡按钮」。需求只描述手动【自摸】/【胡】/【过】，全文无自动胡开关，也未按「本期不做」显式声明。注：文档中的「按无托管处理」指托管，不等于自动胡。","original_text":"位置“4.6 吃碰杠胡操作「自摸」「吃胡（点炮胡）、抢杠胡」”。引文：“只有本家在手牌右上方看到【自摸】【过】。在【自摸】左侧显示本次可胡的牌和按钮预览倍数。”","problem":"基准 02#8 规定常驻听牌组件含「自动胡按钮」。需求只描述手动【自摸】/【胡】/【过】，全文无自动胡开关，也未按「本期不做」显式声明。注：文档中的「按无托管处理」指托管，不等于自动胡。","impact":"开发可能漏做，或自行决定开启后是否自动提交胡、是否仍保留【过】、与 10 秒倒计时的关系，导致各端实现不一致。","suggestion":"明确自动胡按钮的存在与位置（与查听按钮同组件）、默认开关、开启后自动提交胡的条件，以及与【自摸】/【胡】【过】、倒计时归零仍等待手动操作的交互关系；若本期不做，显式写「本期不启用自动胡」。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"自动胡开/关两种状态下，按钮显示、自动提交时机、是否仍显示【过】均有明确判定，测试可分别出用例。"},{"id":"Q19","title":"记牌器长按与点击牌数区域入口缺失（本类主条目，Q29 同根因）","priority":"P2","type":"需求缺失","module":["记牌器"],"dimension":"UI 交互","source_location":"3.2.2 玩法信息「剩余张数」、三.2「局中信息」、4.5「行牌操作」（无对应内容）","rule_ref":"02#12。基准 02#12 规定长按桌面 0.3 秒且持有记牌器道具时弹出记牌器、松手关闭，点击牌数区域也可打开。需求只定义余牌数的位置与数值刷新，没有任何长按/点击入口、弹层内容、松手关闭，也未说明未持道具时的行为。","original_text":"位置“3.2.2 玩法信息「剩余张数」、三.2「局中信息」、4.5「行牌操作」（无对应内容）”。引文：“显示位置。余牌数显示在中央骰盘右侧。骰盘切换为行牌倒计时后，余牌数继续显示在右侧。”","problem":"基准 02#12 规定长按桌面 0.3 秒且持有记牌器道具时弹出记牌器、松手关闭，点击牌数区域也可打开。需求只定义余牌数的位置与数值刷新，没有任何长按/点击入口、弹层内容、松手关闭，也未说明未持道具时的行为。","impact":"记牌器功能整体缺失，开发会把余牌数做成纯展示文本；验收没有入口与关闭口径。","suggestion":"补记牌器交互：0.3 秒长按阈值、持道具才生效、松手关闭、点击余牌数区域打开、弹层展示内容与遮挡层级；若本期不开放记牌器道具，需显式写明「本期无记牌器入口」。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"持道具长按桌面 0.3 秒弹出、松手关闭，点击余牌数区域可打开；无道具时长按无反应。缺任一项即不达标。"},{"id":"Q20","title":"番型与光柱动画的资源选择及降级未定义","priority":"P2","type":"需求缺失","module":["番型动画/胡牌光柱"],"dimension":"UI 交互","source_location":"结算流程/流程明细（胡牌场景）、吃碰杠胡操作/自摸","rule_ref":"03#6,03#7。基准规定：番型动画按番型选皮肤，未配置时回落平胡；点炮与一炮多响用不同皮肤；关闭“显示特效”或复盘时只播简单胡/自摸动画；胡牌光柱需“显示特效”开启、非复盘且有特效换装才播放。需求只给了两个颜色示例，没有番型到皮肤的映射与回落规则，也没有特效开关、复盘或换装缺失时的降级与光柱前置条件。","original_text":"位置“结算流程/流程明细（胡牌场景）、吃碰杠胡操作/自摸”。引文：“番型颜色与光效随实际番型变化，例如金色「财飘」、绿色「平胡」。”","problem":"基准规定：番型动画按番型选皮肤，未配置时回落平胡；点炮与一炮多响用不同皮肤；关闭“显示特效”或复盘时只播简单胡/自摸动画；胡牌光柱需“显示特效”开启、非复盘且有特效换装才播放。需求只给了两个颜色示例，没有番型到皮肤的映射与回落规则，也没有特效开关、复盘或换装缺失时的降级与光柱前置条件。","impact":"七客、杠飘、飘杠等未配置皮肤的番型可能无动画或报错；关闭特效的玩家仍会看到光柱，或反之；开发与美术无法确定资源清单，测试无法验收降级分支。","suggestion":"补番型皮肤映射表与未配置回落平胡规则；明确特效关闭、无换装、复盘三种情况下只播简版胡/自摸动画且不播光柱；把“显示特效”开关作为光柱与番型特效的前置条件写入。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"逐番型验证皮肤；关闭“显示特效”时只出现简版动画且无光柱；复盘播放时无光柱与飘分特效；未配置皮肤的番型回落平胡且不报错。"},{"id":"Q21","title":"桌面台面标识（自摸/胡炮/点炮/叫嘴）缺失","priority":"P2","type":"需求缺失","module":["摊牌/台面标识"],"dimension":"UI 交互","source_location":"结算流程/流程明细（胡牌场景）、吃碰杠胡操作/吃胡（点炮胡）、抢杠胡","rule_ref":"03#3,03#12。基准台面标识枚举为未叫嘴/叫嘴/点炮/胡炮/自摸，按胡型与叫嘴数据标注每人头顶；需求只写了赢家方位番型、放铳者方位“点炮”，没有给自摸、胡炮、未叫嘴/叫嘴等座位标识，也没有写取值来源、出现与清理时机，小结算同样没有叫嘴标识。","original_text":"位置“结算流程/流程明细（胡牌场景）、吃碰杠胡操作/吃胡（点炮胡）、抢杠胡”。引文：“在胡牌者对应方位播放番型字效。……在赢家方位显示番型的同时，在放铳者方位显示「点炮」。”","problem":"基准台面标识枚举为未叫嘴/叫嘴/点炮/胡炮/自摸，按胡型与叫嘴数据标注每人头顶；需求只写了赢家方位番型、放铳者方位“点炮”，没有给自摸、胡炮、未叫嘴/叫嘴等座位标识，也没有写取值来源、出现与清理时机，小结算同样没有叫嘴标识。","impact":"摊牌后玩家无法一眼判断谁自摸、谁胡炮、谁未听，测试无法逐一断言各座位标识；若本期确有叫嘴数据，界面会缺项。","suggestion":"补台面标识枚举、取值来源、每人头顶位置、出现顺序与换局清理规则；若本期玩法不使用叫嘴，明确写出与现网“未叫嘴/叫嘴”标识的差异说明，并给出替代标识或无标识的处理。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"分别以自摸、点炮、抢杠胡、黄庄四种结束方式验证：每个座位头顶标识与胡型一致，进入小结算或下一局后标识被清除；有叫嘴数据时能正确区分叫嘴/未叫嘴。"},{"id":"Q22","title":"小结算缺关闭入口及好友房关闭行为","priority":"P2","type":"需求缺失","module":["小结算界面"],"dimension":"UI 交互","source_location":"结算界面/小结算界面（好友房）/UI交互以及说明 9、12、触发逻辑「本场结束」","rule_ref":"03#15。基准规定小结算有独立关闭按钮：匹配场缩成角标并显示牌桌（不关），非匹配场直接关；需求界面清单只有【继续游戏】和【返回大厅】两个主按钮，没有关闭/收起入口，也没说明好友房（非匹配场）点关闭后是收起小结算看牌桌还是维持原状。","original_text":"位置“结算界面/小结算界面（好友房）/UI交互以及说明 9、12、触发逻辑「本场结束」”。引文：“底部中央显示绿色主按钮。非末局为【继续游戏】，点击后本端回到同桌准备状态。末局为【返回大厅】，点击后仅本端离开房间并回大厅。”","problem":"基准规定小结算有独立关闭按钮：匹配场缩成角标并显示牌桌（不关），非匹配场直接关；需求界面清单只有【继续游戏】和【返回大厅】两个主按钮，没有关闭/收起入口，也没说明好友房（非匹配场）点关闭后是收起小结算看牌桌还是维持原状。","impact":"玩家在小结算中想回看牌桌只能长按，无法临时关闭；若实现按现网补关闭按钮，又缺少行为定义，联调会出现点了关闭后不知落到哪一界面；测试无法验收该入口。","suggestion":"补小结算关闭入口的位置、可见条件与行为：好友房为非匹配场，点关闭即收起小结算并展示终局牌桌，再通过何种入口重新打开或进入下一局需写明；若本期明确不做该入口，需标注“本方案无此功能”并说明与现网差异。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"点击关闭后小结算与遮罩收起、终局牌桌可见；重新进入小结算或继续游戏的路径唯一；若本期不做，界面清单中明确标注无此入口。"},{"id":"Q23","title":"未定义重连时骰子不播滚动、行牌中不展示","priority":"P2","type":"需求缺失","module":["断线重连 / 方位信息（骰子）"],"dimension":"UI 交互","source_location":"3.2.1 方位信息｜骰子、7.2 同步与异常处理","rule_ref":"04#10。基准规定：行牌中重连骰子不展示；发牌/洗牌/做牌重连时骰子静态展示（跳过滚动动画，播一次入场帧后不自动隐藏）。需求只写了实时路径的摇骰，未区分恢复路径，按文档实现会在重连时重播摇骰或让骰子残留在中央压住倒计时与余牌数。","original_text":"位置“3.2.1 方位信息｜骰子、7.2 同步与异常处理”。需求文档无对应描述。","problem":"基准规定：行牌中重连骰子不展示；发牌/洗牌/做牌重连时骰子静态展示（跳过滚动动画，播一次入场帧后不自动隐藏）。需求只写了实时路径的摇骰，未区分恢复路径，按文档实现会在重连时重播摇骰或让骰子残留在中央压住倒计时与余牌数。","impact":"重连后多一次摇骰演出，中央骰子与倒计时/余牌数位置冲突，玩家误以为正在重新开局；测试无判定依据。","suggestion":"补充「重连骰子表现」：行牌阶段恢复不显示骰子；发牌/做牌/洗牌阶段恢复只静态显示点数，不播放滚动动画，进入行牌后按正常规则隐藏。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"在行牌中重连：中央无骰子，直接显示倒计时；在发牌阶段重连：骰子静态停在断线前点数且无滚动过程，切入行牌时正常隐藏。"},{"id":"Q24","title":"未定义重连后补刷最近弃牌浮标、放大牌与来源箭头（本类主条目，Q63 同根因）","priority":"P2","type":"需求缺失","module":["断线重连 / 牌河与出牌提示"],"dimension":"UI 交互","source_location":"7.2 同步与异常处理「重连恢复」、3.2.4 牌河信息｜最近打出牌、4.5 行牌操作｜出牌放大、7.2「同步与异常处理」重连恢复","rule_ref":"04#9。基准规定河牌恢复后，若最后出牌者与最后一张河牌一致，要补刷箭头位置与出牌放大牌。文档其他处规定浮标随下一张弃牌清除，但未定义重连时（没有新弃牌事件）如何补出当前浮标与放大牌，按现有描述重连后最后一张弃牌可能既无浮标也无放大牌。","original_text":"位置“7.2 同步与异常处理「重连恢复」、3.2.4 牌河信息｜最近打出牌、4.5 行牌操作｜出牌放大、7.2「同步与异常处理」重连恢复”。需求文档无对应描述。","problem":"基准规定河牌恢复后，若最后出牌者与最后一张河牌一致，要补刷箭头位置与出牌放大牌。文档其他处规定浮标随下一张弃牌清除，但未定义重连时（没有新弃牌事件）如何补出当前浮标与放大牌，按现有描述重连后最后一张弃牌可能既无浮标也无放大牌。","impact":"重连后在响应阶段看不到被响应的是哪张牌，也无法确认放大牌，容易误判当前响应对象；验收无标准。","suggestion":"补充：恢复河牌后若存在未被取走的最后弃牌，补刷该牌浮标与出牌放大（仅非出牌者视角）；最后弃牌已被吃碰杠胡取走或已无人响应时不显示，并在下一张弃牌落稳后正常出现。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"在他人刚出牌、本家收到响应按钮时重连：最后一张弃牌有浮标与放大牌，方位与断线前一致；在无人响应的摸牌阶段重连：浮标保留在最后一张弃牌上，放大牌按规则显示；弃牌被取走后重连：无浮标无放大。"},{"id":"Q25","title":"未要求重连后强制显示本家头像并切到局内位","priority":"P2","type":"需求缺失","module":["断线重连 / 本家头像与局内状态"],"dimension":"UI 交互","source_location":"3.2.1 对局前｜座位、7.2 同步与异常处理「重连恢复」","rule_ref":"04#4。基准规定恢复完成后固定补刷：切换局内状态、切换头像位置、显示自己玩家（无条件执行，与解析结果无关）。需求未写这三项，尤其未区分「首局未开始」与「已有对局」时本家头像应落在准备位还是局内位。","original_text":"位置“3.2.1 对局前｜座位、7.2 同步与异常处理「重连恢复」”。需求文档无对应描述。","problem":"基准规定恢复完成后固定补刷：切换局内状态、切换头像位置、显示自己玩家（无条件执行，与解析结果无关）。需求未写这三项，尤其未区分「首局未开始」与「已有对局」时本家头像应落在准备位还是局内位。","impact":"重连后可能出现本家头像不显示、或头像停在准备页自由位而手牌已按局内布局渲染的错位；测试没有判定标准。","suggestion":"补充：恢复完成后必须切换为局内状态、强制显示本家头像；首局未开始用准备页/自由位，已开局（含历史已打过局）用局内位，并与手牌、碰杠区布局同步切换。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"首局未开始时重连：本家头像在准备位且可见；任一局进行中或历史已开局后重连：本家头像在桌面左下方局内位，与手牌/碰杠区同布局；任何时刻本家头像不缺失。"},{"id":"Q26","title":"他人长考8秒道具引导提醒层缺失（与 Q10 同根因，重复登记，建议合并）","priority":"P2","type":"需求缺失","module":["方位信息·倒计时"],"dimension":"UI 交互","source_location":"三.对局流程 / 3.2.1 方位信息·倒计时","rule_ref":"05#17。基准 05#17 规定他人倒计时超过 8 秒仍未操作时弹出道具引导提醒层；需求倒计时只覆盖数字样式与响应阶段同步，既未描述该提醒层的触发条件、显示对象与层级，也未声明本期不做。","original_text":"位置“三.对局流程 / 3.2.1 方位信息·倒计时”。需求文档无对应描述。","problem":"基准 05#17 规定他人倒计时超过 8 秒仍未操作时弹出道具引导提醒层；需求倒计时只覆盖数字样式与响应阶段同步，既未描述该提醒层的触发条件、显示对象与层级，也未声明本期不做。","impact":"现网的长考引导在需求中完全缺失，开发不会实现、测试不会覆盖；玩家长时间不操作时无任何引导提示，与客户端既有表现不一致，也无法验收该交互。","suggestion":"与 Q10 合并处理：在倒计时小节补充：触发条件（他人倒计时已走过 8 秒且本次倒计时周期尚未弹过）、仅对他人座位、提醒层样式/位置/层级、每次倒计时周期只弹一次、下一次倒计时开始或该玩家恢复操作时隐藏；若本期不做，标注“本期不实现”并说明与现网差异。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"他人倒计时超过 8 秒时，其座位方向出现道具引导提醒层；同一倒计时周期不重复弹出；新周期开始后可再次触发；本家操作时不出现。测试可直接按上述四条出正反用例。"},{"id":"Q27","title":"缺全量界面清单与视图加载清理顺序","priority":"P2","type":"需求缺失","module":["全局界面结构"],"dimension":"UI 交互","source_location":"三.对局流程「桌面布局（对局前）」、4.1「对局开始」触发逻辑","rule_ref":"06#一·界面清单、06#10。基准以常驻视图清单（背景层、牌面层、玩家头像层、主界面、提示动画层、牌底动画层、剩余牌数组件）和固定加载顺序（背景→牌面→主界面→动画层，好友房加头像层）表述界面结构，并要求进入时清掉大厅与加载场景弹层。需求按桌面子区域分散描述，没有全量界面清单，也没有加载顺序与进入牌桌前清大厅/加载层的规则。","original_text":"位置“三.对局流程「桌面布局（对局前）」、4.1「对局开始」触发逻辑”。引文：“首局四人均已准备后，由房主点击【开始游戏】。开局成功后，四端直接播放「对局开始」动画，本期跳过云检测。”","problem":"基准以常驻视图清单（背景层、牌面层、玩家头像层、主界面、提示动画层、牌底动画层、剩余牌数组件）和固定加载顺序（背景→牌面→主界面→动画层，好友房加头像层）表述界面结构，并要求进入时清掉大厅与加载场景弹层。需求按桌面子区域分散描述，没有全量界面清单，也没有加载顺序与进入牌桌前清大厅/加载层的规则。","impact":"无法用清单核对是否遗漏界面层；进入牌桌时若大厅或加载遮罩未清理，可能盖住牌桌，验收缺少依据。","suggestion":"新增「界面清单」小节（常驻层+按需弹层，注明各层职责与打开方式），并补充进入牌桌的加载顺序及「清大厅弹层/加载层弹层、注销动态层」规则。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"清单可逐项对应到正文章节；测试可从大厅连开多局验证无大厅/加载层残留、各层按序出现无闪烁。"},{"id":"Q28","title":"未定义查听按钮打开的听牌列表弹层（与 Q01 同根因，重复登记，建议合并）","priority":"P2","type":"需求缺失","module":["听牌列表弹层"],"dimension":"UI 交互","source_location":"3.2.5「手牌信息」听牌标签、3.2.5.1「手牌交互说明」听牌标签显示规则","rule_ref":"06#弹层清单-听牌列表、06#1。基准的听牌列表弹层有两个打开条件（点查听按钮 / 提牌且可听），需求只定义了「提牌且可听」触发的详情面板，未定义主界面是否存在查听按钮入口、该弹层的开合条件、以及重复点击切换关闭的防抖规则。","original_text":"位置“3.2.5「手牌信息」听牌标签、3.2.5.1「手牌交互说明」听牌标签显示规则”。引文：“听牌详情面板的开启与收起。仅本端展示。提起带听牌标签的候选牌时，打开该牌打出后的听牌详情。”","problem":"基准的听牌列表弹层有两个打开条件（点查听按钮 / 提牌且可听），需求只定义了「提牌且可听」触发的详情面板，未定义主界面是否存在查听按钮入口、该弹层的开合条件、以及重复点击切换关闭的防抖规则。","impact":"开发无法确定是否实现按钮入口与独立弹层；测试无法验证「再次点击查听关闭」「提牌与按钮两种入口互斥/共用」的行为。","suggestion":"与 Q01 合并处理：在 3.2.5 明确听牌列表的开合规则：入口（查听按钮显隐条件）、打开条件、重复点击切换关闭、与提牌详情是否同一弹层、试听/出牌/阶段结束时的关闭时机。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"可出用例：连续点击查听按钮弹层开→关；提牌时弹层内容随候选刷新；关闭后不残留遮罩。"},{"id":"Q29","title":"未定义记牌器弹层的入口与开合（与 Q19 同根因，重复登记，建议合并）","priority":"P2","type":"需求缺失","module":["记牌器"],"dimension":"UI 交互","source_location":"三.2「局中信息」、4.5「行牌操作」（无对应内容）","rule_ref":"06#弹层清单-记牌器。基准定义记牌器弹层：长按桌面 0.3 秒（持有道具）或点牌数打开，松手或手动关闭。需求整篇没有记牌器、道具与对局内长按的任何描述，也没有「本期不做」的声明。","original_text":"位置“三.2「局中信息」、4.5「行牌操作」（无对应内容）”。引文：“全文未出现「记牌器」或对局内长按桌面的定义；长按仅用于小结算的「长按查看牌桌」。”","problem":"基准定义记牌器弹层：长按桌面 0.3 秒（持有道具）或点牌数打开，松手或手动关闭。需求整篇没有记牌器、道具与对局内长按的任何描述，也没有「本期不做」的声明。","impact":"对局内长按桌面是否为无响应、是否与结算长按混淆无从判断；若现网存在该入口，测试用例无法编写。","suggestion":"与 Q19 合并处理：明确本期是否提供记牌器：若不做，写入「本期不做」清单；若做，补充入口（长按阈值 0.3 秒/点牌数）、道具前置条件、开合与互斥规则。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"可验证：长按桌面 0.3 秒的行为与文档一致（打开记牌器或无反应），松手关闭，且不影响出牌与提牌。"},{"id":"Q30","title":"未定义预约洗牌弹层及按钮显隐（本类主条目，Q33 同根因）","priority":"P2","type":"需求缺失","module":["预约洗牌"],"dimension":"UI 交互","source_location":"三.2「局中信息—玩法信息」、4.6「吃碰杠胡操作」自摸演出、6.1.1「触发逻辑」（均无对应内容）、本期开发范围 / 默认规则 / 5.1 结算流程（小结算与下一局）/ 4.4 发牌","rule_ref":"06#弹层清单-预约洗牌。基准定义预约洗牌弹层：已胡 + 非最后局 + 未预约 + 点按钮时打开，弹窗内操作关闭。需求未描述该按钮与弹层，也未声明本期不做。","original_text":"位置“三.2「局中信息—玩法信息」、4.6「吃碰杠胡操作」自摸演出、6.1.1「触发逻辑」（均无对应内容）、本期开发范围 / 默认规则 / 5.1 结算流程（小结算与下一局）/ 4.4 发牌”。引文：“全文未出现「预约洗牌」；主界面与辅助功能只定义菜单【退出】，未定义预约洗牌按钮的显隐条件与弹层开合。”","problem":"基准定义预约洗牌弹层：已胡 + 非最后局 + 未预约 + 点按钮时打开，弹窗内操作关闭。需求未描述该按钮与弹层，也未声明本期不做。","impact":"胡牌后界面上是否出现预约洗牌按钮、按钮在末局是否隐藏无法验收，容易实现成常显或多局残留。","suggestion":"明确本期是否提供预约洗牌；若不做则列入「本期不做」；若做则补充按钮显隐条件（已胡、非末局、未预约）与弹层开合、成功后按钮态。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"可出用例：胡牌后非末局显示按钮、末局隐藏、已预约后不再显示；弹层操作后关闭且状态不回退。"},{"id":"Q31","title":"未定义超时操作引导与超时提示层（与 Q10 同根因，重复登记，建议合并）","priority":"P2","type":"需求缺失","module":["超时提示"],"dimension":"UI 交互","source_location":"3.2.1「方位信息—倒计时」、4.5「行牌操作—出牌」倒计时归零说明","rule_ref":"06#弹层清单-超时操作引导、06#弹层清单-超时提示层。基准有两个超时类弹层：他人倒计时超 8 秒时对无按钮玩家弹操作引导（下次倒计时刷新时隐藏）；玩家操作超时后由服务端驱动弹出超时提示层，玩家回归时关闭。需求只写「归零保持 00、不自动出牌」，两个弹层的触发、关闭与是否本期实现均未定义。","original_text":"位置“3.2.1「方位信息—倒计时」、4.5「行牌操作—出牌」倒计时归零说明”。引文：“出牌倒计时归零时显示00，继续等待本家手动出牌。本核心流程按无托管处理，超时不触发自动出牌。”","problem":"基准有两个超时类弹层：他人倒计时超 8 秒时对无按钮玩家弹操作引导（下次倒计时刷新时隐藏）；玩家操作超时后由服务端驱动弹出超时提示层，玩家回归时关闭。需求只写「归零保持 00、不自动出牌」，两个弹层的触发、关闭与是否本期实现均未定义。","impact":"四人局中一人不操作时，其他玩家的等待态没有任何可见反馈，验收无法判断是否应出现引导或超时提示。","suggestion":"与 Q10 合并处理：补充超时交互：8 秒操作引导的触发对象与隐藏时机；超时提示层的触发（服务端下发）、文案要素与关闭条件（玩家回归）；若本期不实现需明确声明。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"可出用例：他人倒计时超 8 秒时本端出现引导并在下次倒计时刷新时消失；超时提示层在玩家回归后关闭。"},{"id":"Q32","title":"未描述倒计时音效","priority":"P2","type":"需求缺失","module":["桌面常驻元素/倒计时"],"dimension":"UI 交互","source_location":"3.2.1「倒计时」、4.4 发牌「音效」栏","rule_ref":"07#2。基准#2：自己回合且未自动胡时播倒计时音效；本期虽无托管，音效仍是现网常驻表现，需求完全未提及，音频实现与否无法判定。","original_text":"位置“3.2.1「倒计时」、4.4 发牌「音效」栏”。引文：“需求仅在 4.4 写「发牌与理牌的音效资源及触发时点本方案不添加」，全文无倒计时音效的任何描述，也未写本期不做。”","problem":"基准#2：自己回合且未自动胡时播倒计时音效；本期虽无托管，音效仍是现网常驻表现，需求完全未提及，音频实现与否无法判定。","impact":"开发不会实现倒计时音效，音频验收缺项；也无法与「发牌音效不添加」的口径区分，易出现各端行为不一致。","suggestion":"补充「本家进入可出牌/响应阶段时播放倒计时音效，其他家回合不播」，并说明本期无托管/无自动胡时是否持续播放；若不做则明文写「本期不播放倒计时音效」。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"本家回合倒计时开始时播放一次倒计时音效，其他家回合不播；或需求中有「本期不播放」的明文，测试按文档判定。"},{"id":"Q33","title":"预约洗牌道具的条件与动画需求完全未提及（与 Q30 同根因，重复登记，建议合并）","priority":"P2","type":"需求缺失","module":["开局流程 / 洗牌道具（预约洗牌）"],"dimension":"UI 交互","source_location":"本期开发范围 / 默认规则 / 5.1 结算流程（小结算与下一局）/ 4.4 发牌","rule_ref":"08#12,08#13。基准 08#12 定义了预约洗牌的四个前置条件（自己已胡、非最后一局、未预约、非复盘）与当日首次提示，08#13 定义了对每个预约座位播放 spine 洗牌动画（自己/他人不同动画段）并在最后一个座位动画完成后发应答；需求既未实现也未排除，范围不清。","original_text":"位置“本期开发范围 / 默认规则 / 5.1 结算流程（小结算与下一局）/ 4.4 发牌”。需求文档无对应描述。","problem":"基准 08#12 定义了预约洗牌的四个前置条件（自己已胡、非最后一局、未预约、非复盘）与当日首次提示，08#13 定义了对每个预约座位播放 spine 洗牌动画（自己/他人不同动画段）并在最后一个座位动画完成后发应答；需求既未实现也未排除，范围不清。","impact":"开发无法判断是否要做洗牌入口与动画，可能整块漏做；测试无验收依据；若后续补做，会与本方案已确定的下一小局衔接流程冲突。","suggestion":"与 Q30 合并处理：二选一明确：若本期做，补入口位置与按钮态、四个预约条件的判定与置灰、当日首次提示、逐座位 spine 分段动画、最后座位完成后的应答及与下一局的衔接；若不做，在「本期开发范围」明示排除，并说明界面不出现洗牌入口。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"若做：四项预约条件同时满足才出现入口，预约后下一局开局前按预约座位逐一播放洗牌动画，全部完成后才进入发牌；末局/未胡/已预约时无入口。若不做：文档明确排除，界面无相关入口，测试按排除项验收。"},{"id":"Q34","title":"开局动画缺 spine 异常兜底与结束应答推进规则","priority":"P2","type":"需求缺失","module":["对局开始 / 开局动画"],"dimension":"UI 交互","source_location":"4.1 对局开始（触发逻辑 / 动画展示及流程）","rule_ref":"08#3,08#4。基准 08#3 规定面板淡出后才发应答，08#4 规定 spine 事件未触发时必须强制头像归位（防止头像缺失）；需求只给出理想时间轴，缺少兜底处理和阶段推进的判定条件。","original_text":"位置“4.1 对局开始（触发逻辑 / 动画展示及流程）”。引文：“「T+约700～865 ms。中央字样与金色光带一起淡出……约865 ms 时，字样和光带完全消失，开局动画结束。」未写 spine 事件未触发、资源缺失时如何处理，也未写动画结束后由谁发起应答、超时如何进入掷骰。”","problem":"基准 08#3 规定面板淡出后才发应答，08#4 规定 spine 事件未触发时必须强制头像归位（防止头像缺失）；需求只给出理想时间轴，缺少兜底处理和阶段推进的判定条件。","impact":"若某端 spine 事件不回调或资源缺失，头像/介绍卡可能停留在画面内，开局面板不结束，四端无法同步进入掷骰；测试无法据此编写异常用例。","suggestion":"补充：以 spine 播放完成事件为正常结束条件；事件超时（给出阈值）或资源缺失时强制结束动画并将头像归位到局内布局；动画结束（含兜底）后再发应答，由服务端推进掷骰；说明兜底仅在异常时触发，不影响正常时间轴。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"模拟 spine 事件不回调/资源缺失时，头像仍归位、开局面板在阈值内结束并发出应答，四端进入掷骰；正常情况下仍按 865 ms 时间轴验收。"},{"id":"Q35","title":"风位字出现时机与“掷骰前已定庄”互相矛盾","priority":"P2","type":"内容冲突","module":["方位盘 / 开局定庄"],"dimension":"UI 交互","source_location":"三、3.2.1 方位信息「无方位／未操作」；三、4.2 定庄「UI及动画」","rule_ref":"07#12,08#36。4.2 写明“掷骰前已确定本小局的庄家和牢数”，而庄家固定为东、其余逆时针南西北，因此风位在掷骰开始前就已确定；3.2.1 却把“未分配风位、四侧无风位字”的状态放在“进入开局过场并显示方位盘底座后”，给出的录屏参照又是在发牌之后才出现风位字。两处对风位字首次渲染的时点给出不同前提，且全文没有任何一处写明由哪条数据、哪一帧驱动风位字出现。","original_text":"位置“三、3.2.1 方位信息「无方位／未操作」；三、4.2 定庄「UI及动画」”。引文：“进入开局过场并显示方位盘底座后，未分配风位时只显示暗色底座，中央留空，四侧无风位字和高亮。……已分配风位、尚未进入可操作阶段时，四侧风位字保持灰暗。”","problem":"4.2 写明“掷骰前已确定本小局的庄家和牢数”，而庄家固定为东、其余逆时针南西北，因此风位在掷骰开始前就已确定；3.2.1 却把“未分配风位、四侧无风位字”的状态放在“进入开局过场并显示方位盘底座后”，给出的录屏参照又是在发牌之后才出现风位字。两处对风位字首次渲染的时点给出不同前提，且全文没有任何一处写明由哪条数据、哪一帧驱动风位字出现。","impact":"开发无法确定风位字在开局动画、掷骰、发牌中的哪一帧出现和点亮，四端截图对不上，验收无法判定是否符合预期。","suggestion":"统一为“收到定庄数据（掷骰开始前）即按庄家为东渲染四侧灰暗风位字”，删除“未分配风位”状态，或改写为“首局开局过场开始前（定庄数据尚未到达）”；并明确灰暗→点亮（首庄一侧闪烁）分别对应哪一帧。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"四人首局：掷骰动画开始帧四端已显示灰暗风位字且无高亮，四端风位一致；进入首庄可操作阶段，底边风位点亮并开始闪烁；截图可与文档逐帧比对。"},{"id":"Q36","title":"碰后仅剩原有暗杠时是否需点【过】自相矛盾","priority":"P2","type":"内容冲突","module":["吃碰杠胡 / 出牌拦截"],"dimension":"UI 交互","source_location":"三、4.6 吃碰杠胡操作「杠」；三、4.5 行牌操作「出牌」","rule_ref":"01#36,01#18。同一单元格内给出两条互斥规则：一条规定“可杠项仅为原有暗杠时可直接出牌”，另一条规定“碰后可杠时仍须先点【过】”。当玩家碰牌后手里只剩一组“杠成立前就已在手中”的四张同牌时，两条规则给出相反结论，且未说明例外是否只适用于摸牌后场景。","original_text":"位置“三、4.6 吃碰杠胡操作「杠」；三、4.5 行牌操作「出牌」”。引文：“若可杠项仅为原手牌中已有的暗杠（四张同牌在本次摸牌或补牌前已在手中），可直接出牌。碰后可杠时仍须先点【过】。”","problem":"同一单元格内给出两条互斥规则：一条规定“可杠项仅为原有暗杠时可直接出牌”，另一条规定“碰后可杠时仍须先点【过】”。当玩家碰牌后手里只剩一组“杠成立前就已在手中”的四张同牌时，两条规则给出相反结论，且未说明例外是否只适用于摸牌后场景。","impact":"是否拦截出牌、是否弹「点“过”才能出牌」无法确定，客户端实现与验收口径会冲突，可能出现玩家无法出牌的死锁或误拦截。","suggestion":"明确例外的适用边界：若碰后一律需点【过】，则把例外限定为“摸牌或补牌后（非吃碰后）”，并在 4.5「出牌」同步；若例外同样适用于碰后，则删掉“碰后可杠时仍须先点【过】”的绝对表述，改为“碰后仅存在加杠或本次新成的暗杠时须先点【过】”。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"构造“碰牌后手中仅有一组原有四张同牌”的用例，按文档唯一结论验证：需要点【过】时必须先点【过】才能出牌并出现提示；不需要时可直接出牌且不出现拦截提示。"},{"id":"Q37","title":"后续小局开局序列两处描述不一致且漏定财神","priority":"P2","type":"内容冲突","module":["对局流程 / 后续小局开局"],"dimension":"UI 交互","source_location":"三、4.1 对局开始「触发逻辑」；六、6.1.1 触发逻辑「本场继续」；三、4.3 定财神","rule_ref":"08#8,07#33。两处对后续小局的开局序列描述不同：4.1 为“直接进入摇骰发牌”，6.1.1 为“定庄→发牌”，两者都未包含 4.3 定财神；而 4.3 写的是“每小局掷骰动画开始时”显示白板指示牌，4.2 写的是“每个小局在开局掷骰动画开始的同时展示庄标”。因此后续小局是否重播摇骰、是否显示财神指示牌、庄标在哪一帧刷新，无法从任一处确定。","original_text":"位置“三、4.1 对局开始「触发逻辑」；六、6.1.1 触发逻辑「本场继续」；三、4.3 定财神”。引文：“四人均已准备后自动开始下一小局，按 4.2「定庄」确定庄家，再按 4.4「发牌」继续。／同一场内，后续小局直接进入摇骰发牌。”","problem":"两处对后续小局的开局序列描述不同：4.1 为“直接进入摇骰发牌”，6.1.1 为“定庄→发牌”，两者都未包含 4.3 定财神；而 4.3 写的是“每小局掷骰动画开始时”显示白板指示牌，4.2 写的是“每个小局在开局掷骰动画开始的同时展示庄标”。因此后续小局是否重播摇骰、是否显示财神指示牌、庄标在哪一帧刷新，无法从任一处确定。","impact":"后续小局缺少可执行的时序，开发可能跳过摇骰或财神指示牌，验收时无法判断应播放哪一段。","suggestion":"在 4.1 或 6.1.1 给出一条统一的后续小局序列并互相引用：“四人均已准备 → 摇骰（同帧刷新庄标）→ 显示白板财神指示牌 → 发牌 → 理牌 → 首庄出牌倒计时”，明确不播开局动画。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"第 2 小局开始，四端按摇骰、庄标刷新、白板指示牌、发牌、倒计时顺序播放且不播开局动画；与 4.1/4.2/4.3/6.1.1 的描述逐项一致。"},{"id":"Q38","title":"番型选取未区分过程取小与局终取大","priority":"P2","type":"逻辑错误","module":["番型展示/结算口径"],"dimension":"UI 交互","source_location":"胡牌番型介绍/番型介绍「番型互斥与优先级」","rule_ref":"03#9。基准指出两处番型选取口径不同：胡牌过程命令按升序取最小番型、局终命令按降序取最大番型；需求统一写成“番型展示和结算均使用该档（最高档）”，没有区分胡牌过程与局终两个来源，按文档实现时过程番型动画会与现网不一致。","original_text":"位置“胡牌番型介绍/番型介绍「番型互斥与优先级」”。引文：“先取倍数最高的档位。若最高倍数相同，选本节番型明细中序号较大的一档。番型展示和结算均使用该档。”","problem":"基准指出两处番型选取口径不同：胡牌过程命令按升序取最小番型、局终命令按降序取最大番型；需求统一写成“番型展示和结算均使用该档（最高档）”，没有区分胡牌过程与局终两个来源，按文档实现时过程番型动画会与现网不一致。","impact":"同一手牌同时成立多个番型时，胡牌过程中的番型展示可能与现网不同，结算与展示也可能被错误统一成同一档；测试无法判断过程与局终应分别显示什么。","suggestion":"分别写明两个口径：胡牌过程（响应/胡牌过程命令）取最小番型，局终结算取最大番型；并说明两处展示位（过程即时字效与局终番型字效）是否都展示、是否以局终为准覆盖。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"构造同时满足平胡与清七对等多档的手牌，断言胡牌过程显示的番型与局终结算显示的番型符合各自口径，结算分数按局终档计算。"},{"id":"Q39","title":"断线计时写死从00:00起算且无60:00封顶","priority":"P2","type":"逻辑错误","module":["断线重连 / 玩家头像离线状态"],"dimension":"UI 交互","source_location":"3.2.3 玩家头像信息｜玩家状态-离线状态","rule_ref":"04#17。基准规定断线时长初值按断线时间戳计算（他人视角在玩家已离线一段时间后进入/重连时，应直接显示真实已离线时长），且满 1 小时封顶显示「60:00」并停表。需求写成「每次转为离线从00:00开始」，与按时间戳算初值冲突，也没有上限与停表规则。","original_text":"位置“3.2.3 玩家头像信息｜玩家状态-离线状态”。引文：“离线状态。在线视角在离线玩家头像内容上显示深色覆盖层，中央为白色断链图标，图标下方用黄色「分:秒」显示离线时长。每次转为离线从00:00开始并逐秒增加，确认恢复在线时移除断线图标和计时。再次离线重新计时。”","problem":"基准规定断线时长初值按断线时间戳计算（他人视角在玩家已离线一段时间后进入/重连时，应直接显示真实已离线时长），且满 1 小时封顶显示「60:00」并停表。需求写成「每次转为离线从00:00开始」，与按时间戳算初值冲突，也没有上限与停表规则。","impact":"他人重连进房时会把已离线数分钟误显示为 00:00 起算；长时断线计时无限增长，与其他端显示不一致，玩家无法判断真实离线时长。","suggestion":"把口径改为：计时初值＝当前时间−断线时间戳；显示沿用 mm:ss，不足 10 补 0；达到 60 分钟封顶显示「60:00」并停止计时；恢复在线立即移除图标与计时，再次离线按新时间戳重新计算。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"某玩家离线 90 秒后，另一玩家重连进入，立即看到 01:30 并逐秒增加；离线满 60 分钟显示 60:00 且不再变化；该玩家恢复在线后图标与计时立即消失。"},{"id":"Q40","title":"本场结束缺少大结算且两处口径不一致（与 Q08 同根因，重复登记，建议合并）","priority":"P2","type":"逻辑错误","module":["大结算/本场结束"],"dimension":"UI 交互","source_location":"6.1.1「触发逻辑」本场结束、附录 A「后续版本配置」片数","rule_ref":"06#弹层清单-大结算。基准弹层清单含大结算（动画链第 4 步延迟 2 秒弹出、解散局直出、手动关闭）。需求正文把「结束本场」定义为末局小结算直接【返回大厅】，全程无大结算与本场总结界面；而附录 A 的片数模式又写「结束本场并进入大结算」，同一文档对「本场结束」的产物口径不一致，也未说明与现网大结算的差异。","original_text":"位置“6.1.1「触发逻辑」本场结束、附录 A「后续版本配置」片数”。引文：“达到设定局数后，各端显示末局小结算，底部中央显示绿色【返回大厅】。点击后，仅该玩家收起小结算、离开房间并返回大厅……；附录 A：任一玩家结算后片数小于或等于 0 时结束本场并进入大结算。”","problem":"基准弹层清单含大结算（动画链第 4 步延迟 2 秒弹出、解散局直出、手动关闭）。需求正文把「结束本场」定义为末局小结算直接【返回大厅】，全程无大结算与本场总结界面；而附录 A 的片数模式又写「结束本场并进入大结算」，同一文档对「本场结束」的产物口径不一致，也未说明与现网大结算的差异。","impact":"8 局结束后玩家看不到本场累计总分总结；开发无法确定末局是否要弹大结算、何时弹、如何关闭，验收口径冲突。","suggestion":"与 Q08 合并处理：统一本场结束的界面定义：若保留「末局小结算直接返回大厅」，则删改附录 A 表述并补「与现网大结算的差异说明」；若需要大结算，则补充弹出时机（末局小结算后）、关闭方式与再来一局/换房入口。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"可出用例：第 8 局小结算后按文档唯一口径出现指定界面（大结算或直接返回大厅），且附录 A 描述不冲突。"},{"id":"Q41","title":"倒计时最后3秒配色与基准冲突（黄 vs 红）","priority":"P2","type":"逻辑错误","module":["桌面常驻元素/倒计时"],"dimension":"UI 交互","source_location":"3.2.1 方位信息「倒计时」","rule_ref":"07#2。基准#2：大于 3 秒默认蓝色，最后 3 秒切红色；需求写末段为黄色，且把 00 也纳入变色区间，与现网实现不一致。","original_text":"位置“3.2.1 方位信息「倒计时」”。引文：“普通数字为蓝青色，03、02、01、00 为黄色。”","problem":"基准#2：大于 3 秒默认蓝色，最后 3 秒切红色；需求写末段为黄色，且把 00 也纳入变色区间，与现网实现不一致。","impact":"倒计时末段配色与现网不同，美术出图与 UI 还原验收会返工；00 是否变色也缺判定依据。","suggestion":"改为「普通数字蓝青色，03、02、01 切为红色」，并补充 00 的颜色（红色或按归零态单独定义）；若确为改版需标注与现网差异。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"走查一次倒计时：04 为蓝青色，03/02/01 为红色，00 按需求指定色；与现网录屏逐帧比对一致。"},{"id":"Q42","title":"压暗与财神粉色牌面叠加优先级未定义","priority":"P2","type":"定义歧义","module":["手牌置灰/财神展示"],"dimension":"UI 交互","source_location":"3.2.5 手牌信息（麻将子）、4.5 行牌操作（提牌）","rule_ref":"01#16。基准 01#16 规定颜色优先级为“黄 > 灰 > 财神红 > 正常”，即压暗优先于财神特殊牌面；需求无条件声明本家白板财神用粉色牌面，又要求不可打的手牌整体压暗，未定义财神处于压暗状态（如飘财限制）时显示粉色还是压暗色。","original_text":"位置“3.2.5 手牌信息（麻将子）、4.5 行牌操作（提牌）”。引文：““本家手中的白板财神使用粉色牌面，保留白板边框。”；“其余手牌压暗并保持原位。””","problem":"基准 01#16 规定颜色优先级为“黄 > 灰 > 财神红 > 正常”，即压暗优先于财神特殊牌面；需求无条件声明本家白板财神用粉色牌面，又要求不可打的手牌整体压暗，未定义财神处于压暗状态（如飘财限制）时显示粉色还是压暗色。","impact":"美术与开发可能给出两种不同表现，验收无可比对错，也影响同牌面高亮等叠加效果。","suggestion":"明确叠加规则（压暗优先于财神粉色，或给出例外场景），并补一张“黄色高亮/财神粉色/压暗”三者优先级表。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"提供“可打财神”与“飘财限制下的财神”两种截图口径，测试可按颜色优先级逐项断言。"},{"id":"Q43","title":"「点“过”才能出牌」提示停留时长未定义","priority":"P2","type":"定义歧义","module":["对局内通用提示"],"dimension":"UI 交互","source_location":"4.8 对局内通用提示（点“过”才能出牌）","rule_ref":"01#7。基准规定该提示展示 3 秒；需求只写“短暂停留”，未给具体秒数，也未说明连续触发时单条计时与并发条数上限。","original_text":"位置“4.8 对局内通用提示（点“过”才能出牌）”。引文：““提示原位淡入，短暂停留后原位淡出。连续触发时，新提示在原位置淡入，已有提示整体上移一行，各条分别计时并依次淡出。””","problem":"基准规定该提示展示 3 秒；需求只写“短暂停留”，未给具体秒数，也未说明连续触发时单条计时与并发条数上限。","impact":"实现时长随意导致与其他提示混排时堆积方式不一致，验收无法判定达标。","suggestion":"明确单条停留 3 秒（与基准一致），并说明连续触发时各条独立计时、最多同时显示的条数及超出后的处理。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"触发后 3 秒提示消失；1 秒内连点 4 次可见 4 条各自计时并依次消失。"},{"id":"Q44","title":"未区分需上报与无需上报的两种过按钮","priority":"P2","type":"定义歧义","module":["吃碰杠胡/过按钮"],"dimension":"UI 交互","source_location":"4.6 弃牌响应与「过」、4.8 同一玩家可多项操作","rule_ref":"01#6。基准存在两个过按钮：一个点击后上行 sendCancel，另一个仅本地收尾不发包；需求全篇只描述单一共用【过】，未说明两种状态各自的出现条件、是否上行，也未说明“仅原有暗杠可直接出牌”时点【过】的语义。","original_text":"位置“4.6 弃牌响应与「过」、4.8 同一玩家可多项操作”。引文：““弃牌触发响应时，只有具备操作资格的玩家会在自己的手牌右上方看到可用按钮和【过】。”；“点共用的【过】放弃同一事件下本家的全部待响应操作””","problem":"基准存在两个过按钮：一个点击后上行 sendCancel，另一个仅本地收尾不发包；需求全篇只描述单一共用【过】，未说明两种状态各自的出现条件、是否上行，也未说明“仅原有暗杠可直接出牌”时点【过】的语义。","impact":"实现若统一发取消包，会在无待应答操作时产生多余上行或与服务端询问编号匹配失败；测试无法写出针对请求的断言。","suggestion":"在 4.6 补“过”按钮两态说明（需上行/无需上行）及判定条件（是否存在待应答权限与询问编号），并与 7.2 请求编号规则联动。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"两类场景分别断言：需上行场景仅产生一个取消请求且携带询问编号；无需上行场景不产生任何上行请求。"},{"id":"Q45","title":"飘财限制期间吃碰明杠按钮是否显示未定义","priority":"P2","type":"定义歧义","module":["飘财限制/按钮显隐"],"dimension":"UI 交互","source_location":"2.2 名词介绍（飘）、2.3.1.2【吃】","rule_ref":"01#2。基准 01#2 规定按钮显隐完全由服务端权限位逐个设置；需求只写“禁止吃、碰、明杠”，未说明受限玩家是否仍收到【吃】【碰】【杠】按钮，是隐藏还是显示但点击无响应并给出提示。","original_text":"位置“2.2 名词介绍（飘）、2.3.1.2【吃】”。引文：““该次飘财限制其他三家。受限制的玩家仍可按规则胡牌、暗杠，禁止吃、碰、明杠。”；“受尚未解除的飘财限制时禁止吃。””","problem":"基准 01#2 规定按钮显隐完全由服务端权限位逐个设置；需求只写“禁止吃、碰、明杠”，未说明受限玩家是否仍收到【吃】【碰】【杠】按钮，是隐藏还是显示但点击无响应并给出提示。","impact":"同一规则可能被实现成“按钮不显示”或“显示后点击失败无声”，交互体验与测试判定不一致。","suggestion":"明确飘财限制在服务端权限集合中剔除吃/碰/明杠位，客户端不显示对应按钮；如需提示，补充禁止路径与文案。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"受飘财限制进入出牌阶段时，本端仅可见与胡、暗杠、过相关的按钮，无【吃】【碰】【杠】；限制解除后按当时牌局恢复。"},{"id":"Q46","title":"庄家「13＋1」与第14张下发时序自相歧义","priority":"P2","type":"定义歧义","module":["发牌 / 庄家起手牌"],"dimension":"UI 交互","source_location":"4.4 发牌（发牌逻辑 / 发牌UI以及动画表现）/ 3.2.5 手牌信息（庄家手牌）","rule_ref":"08#9,08#15。基准 08#15 为每家初始 13 张、08#9 为发牌数据每家 13 张且庄家第 14 张由首抓触发；需求同时出现「补齐第13张」「13＋1」「第14张单独下发」三种口径，无法确定 8.3–8.6 秒时庄家手里是 13 张还是 14 张、独立位先显示第几张牌。","original_text":"位置“4.4 发牌（发牌逻辑 / 发牌UI以及动画表现）/ 3.2.5 手牌信息（庄家手牌）”。引文：“「最后从同一牌序给庄家再发1张。发完庄家14张……」「四家补齐第13张。倒下前，庄家按乱序发入的先后展示13＋1」「庄家的独立位同步刷新为服务端单独下发的第14张……由『发』变为『南』」。”","problem":"基准 08#15 为每家初始 13 张、08#9 为发牌数据每家 13 张且庄家第 14 张由首抓触发；需求同时出现「补齐第13张」「13＋1」「第14张单独下发」三种口径，无法确定 8.3–8.6 秒时庄家手里是 13 张还是 14 张、独立位先显示第几张牌。","impact":"客户端可能多发或少发一张、独立位先显示错误牌面再翻转，导致牌张总数与余牌数 83 对不上；测试无法核对共发 53 张、牌墙余 83 张的账。","suggestion":"改写为准确表述：明确 12 张→13 张→14 张各时点；说明 8.3–8.6 秒独立位显示的是第 13 张（或 13 张含独立位），8.8 秒后再刷新为第 14 张；并明确第 14 张由首抓命令下发、不计入 13 张发牌数据。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"任一时刻可数出庄家 14 张、闲家 13 张；独立位在理牌前与理牌后的牌面符合文档指定；共发 53 张、牌墙余 83 与余牌数显示一致。"},{"id":"Q47","title":"横滑切换提牌与滑动出牌的手势判定交叉","priority":"P2","type":"定义歧义","module":["手牌交互 / 出牌"],"dimension":"UI 交互","source_location":"三、4.5 行牌操作「提牌」「出牌」","rule_ref":"01#42,01#43。同一个“按住并拖动”手势被两条规则分别定义为“切换提牌”和“提交出牌”：斜向拖动（既越过提牌高度线又横向经过其他牌）时，两条规则同时成立；文档未规定判定优先级、虚影绑定哪张牌、松手时是出牌还是仅保留提牌，也未定义越线后继续横滑是否还切换提牌。","original_text":"位置“三、4.5 行牌操作「提牌」「出牌」”。引文：“沿手牌横向滑动时，滑到可提牌才切换提牌，上一张落回，新选中的牌抬起。……松手后保留最后成功提起的牌。／从一张可打牌按住拖动。向上、向左或向右移动都按该牌的提牌高度线判定。……虚影显示且该牌仍可打时，松手提交出牌请求。”","problem":"同一个“按住并拖动”手势被两条规则分别定义为“切换提牌”和“提交出牌”：斜向拖动（既越过提牌高度线又横向经过其他牌）时，两条规则同时成立；文档未规定判定优先级、虚影绑定哪张牌、松手时是出牌还是仅保留提牌，也未定义越线后继续横滑是否还切换提牌。","impact":"核心出牌手势存在误出牌或无法出牌的风险，实现方只能自行猜测，测试无法给出确定用例。","suggestion":"补充判定顺序与绑定规则：以按下的那张牌为拖动主体；位置低于提牌高度线时仅切换提牌、不出虚影；一旦高于高度线即进入出牌判定并停止切换提牌，虚影始终绑定按下的牌；松手时若虚影仍在则按该牌提交出牌，否则保留最后成功提起的牌。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"三条用例全部通过：纯横滑只切换提牌且松手不出牌；竖直上拖过线后松手打出按下牌；斜向拖过线再横滑时虚影与出牌目标始终为按下牌，中途不切换提牌。"},{"id":"Q48","title":"听牌「爆」「飘」标签的判定条件未定义","priority":"P2","type":"定义歧义","module":["听牌提示 / 手牌信息"],"dimension":"UI 交互","source_location":"三、3.2.5 手牌信息「听牌标签」；三、3.2.5.1 手牌交互说明「听牌标签显示规则」","rule_ref":"02#42,02#43。全文未定义“可爆头”“可财飘”的判定条件（是打出候选牌后形成4面子+1财神的结构，还是连同连续飘财次数一并判定），也未说明它与「打出当前候选牌后下一次摸任意一张牌都能爆头自摸」时使用的固定单行面板是同一状态还是两种状态，导致标签无法实现，也无法确定何时切换面板。","original_text":"位置“三、3.2.5 手牌信息「听牌标签」；三、3.2.5.1 手牌交互说明「听牌标签显示规则」”。引文：“杭麻听牌标签。可爆头显示金色「爆」，可财飘显示红色「飘」。……同一候选同时符合「飘」和「爆」时，显示「飘」。”","problem":"全文未定义“可爆头”“可财飘”的判定条件（是打出候选牌后形成4面子+1财神的结构，还是连同连续飘财次数一并判定），也未说明它与「打出当前候选牌后下一次摸任意一张牌都能爆头自摸」时使用的固定单行面板是同一状态还是两种状态，导致标签无法实现，也无法确定何时切换面板。","impact":"听牌标签与听牌详情面板的显示逻辑无法实现，视觉与文案验收无依据，容易与“爆头2番”“摸任意一张可胡”面板重复或冲突。","suggestion":"用可判定条件定义：候选牌打出后本家手牌满足“4 组面子 + 1 张财神”或“6 组对子 + 1 张财神”即「爆」；在此状态下若本人已连续打出 N 张财神且仍能敲响则显示「飘」；两者同时成立按「飘」；该状态同时命中固定面板文案「爆头2番／摸任意一张可胡」。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"给出至少 3 组构造牌例（仅爆、仅飘、同时符合）及期望标签、期望面板文案，测试可直接复现并逐帧比对。"},{"id":"Q49","title":"多组吃选组期间其他操作按钮状态未定义","priority":"P2","type":"定义歧义","module":["吃碰杠胡 / 吃（多组）"],"dimension":"UI 交互","source_location":"三、4.6 吃碰杠胡操作「吃（多组）」；三、4.7 多操作状态「同一玩家可多项操作」","rule_ref":"01#16,01#29。进入选组面板时只声明【吃】【过】退场，未说明同次存在的【碰】【杠】【胡】是否仍然保留、是否可点击；而【取消】又声明会放弃【胡】，暗示此状态下胡已无法单独提交。同一时刻的按钮可用性在两处描述不一致（按钮还在但点击结果未定义，或面板与按钮并存）。","original_text":"位置“三、4.6 吃碰杠胡操作「吃（多组）」；三、4.7 多操作状态「同一玩家可多项操作」”。引文：“点【吃】后，本端在手牌上方展开可选顺子……原【吃】【过】退场，手牌恢复常态亮度。……点击【取消】即放弃本家对这张弃牌的全部可选操作，包括同次可胡时的【胡】。”","problem":"进入选组面板时只声明【吃】【过】退场，未说明同次存在的【碰】【杠】【胡】是否仍然保留、是否可点击；而【取消】又声明会放弃【胡】，暗示此状态下胡已无法单独提交。同一时刻的按钮可用性在两处描述不一致（按钮还在但点击结果未定义，或面板与按钮并存）。","impact":"多组吃状态的按钮显隐与点击结果不确定，可能出现点【胡】无响应、同时残留高亮或误放弃整局操作，验收无法判定。","suggestion":"明确进入选组面板后，本家操作区只保留候选顺子组与【取消】，同次的其他操作按钮一并隐藏且不可点击；【取消】等价于共用【过】，放弃本事件下本家全部待响应操作。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"构造同时可吃（2 组）又可胡的牌面，点【吃】后界面仅见 2 组顺子与【取消】，无【碰】【杠】【胡】【过】；点【取消】后本家本次弃牌的全部响应被放弃，其他玩家按优先级继续裁决。"},{"id":"Q50","title":"提交后与我家获权时操作区收起未定义","priority":"P2","type":"描述不完整","module":["吃碰杠胡/操作区收起"],"dimension":"UI 交互","source_location":"4.6 吃碰杠胡操作（弃牌响应与「过」、碰）、4.8 同一玩家可多项操作","rule_ref":"01#4,01#17。基准 01#4 规定他人收到权限时本端操作区直接收起（关按钮区、锁手牌、清提示），01#17 规定点碰/杠按钮即清灰；需求只对“吃提交”写明收起并恢复亮度，碰/杠提交后进入等待，以及他家获权时本端按钮、压暗、提牌是否保留均未定义。","original_text":"位置“4.6 吃碰杠胡操作（弃牌响应与「过」、碰）、4.8 同一玩家可多项操作”。引文：““点击按钮提交操作请求。较低优先级的玩家先提交时……提交者本端进入等待。”；“本端可碰时显示【碰】【过】，两张可碰牌保持亮度，其余手牌压暗。””","problem":"基准 01#4 规定他人收到权限时本端操作区直接收起（关按钮区、锁手牌、清提示），01#17 规定点碰/杠按钮即清灰；需求只对“吃提交”写明收起并恢复亮度，碰/杠提交后进入等待，以及他家获权时本端按钮、压暗、提牌是否保留均未定义。","impact":"等待期可能残留按钮、手牌仍可提牌或保持压暗，与现网表现不一致；测试无法判定等待态应看到什么。","suggestion":"补统一规则：本家提交任一操作请求即收起按钮区并清除本次压暗；他人获得操作权或操作区状态切换时收起按钮、锁定手牌、清除本端提示，直到重新获得出牌权。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"覆盖“甲提交吃、乙提交碰、乙点过、乙碰成立”四条分支，逐条给出按钮显隐、手牌压暗、提牌可用性的期望状态。"},{"id":"Q51","title":"流局时操作按钮与提示退场未描述（本类主条目，Q54、Q62 同根因）","priority":"P2","type":"描述不完整","module":["流局/操作区收起"],"dimension":"UI 交互","source_location":"5.1 流程明细（流局场景）、结算流程/流程明细（流局场景）、结算界面/小结算界面（好友房）/触发逻辑「流局后进入」、方位信息「小局结束」、5.1「流局场景」黄庄演出","rule_ref":"01#25。基准 01#25 规定自己出牌后、碰/杠确认回包、胡牌回包、流局统一收操作区；需求只在胡牌场景写明“操作按钮、胡牌预览、听牌提示和放大的弃牌退场”，流局场景未写按钮区、听牌详情、放大弃牌与提示的退场。","original_text":"位置“5.1 流程明细（流局场景）、结算流程/流程明细（流局场景）、结算界面/小结算界面（好友房）/触发逻辑「流局后进入」、方位信息「小局结束」、5.1「流局场景」黄庄演出”。引文：““确认后停止行牌，流局计 1 小局。”；“各端按座位方向亮出四家手牌，桌面中央同时显示橙色「黄庄」。””","problem":"基准 01#25 规定自己出牌后、碰/杠确认回包、胡牌回包、流局统一收操作区；需求只在胡牌场景写明“操作按钮、胡牌预览、听牌提示和放大的弃牌退场”，流局场景未写按钮区、听牌详情、放大弃牌与提示的退场。","impact":"流局瞬间本端可能残留操作按钮或听牌详情面板，与胡牌场景口径不一致，验收缺少判定依据。","suggestion":"在流局场景补与胡牌场景同口径的退场说明：停止行牌时收起操作按钮区、听牌详情、放大弃牌和提示，方位盘保留但停止倒计时。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"流局触发帧检查：操作按钮区不可见、听牌详情收起、放大弃牌清除、倒计时停止且方位盘保留。"},{"id":"Q52","title":"箭头与优/大/多标签的视觉样式未定义","priority":"P2","type":"描述不完整","module":["听牌标签（听型样式）"],"dimension":"UI 交互","source_location":"3.2.5 手牌信息「听牌标签」、3.2.5.1「箭头」「多」「大」「优」","rule_ref":"02#3,02#6。基准 02#3、02#6 要求箭头样式按听型（普通/大/多/优）区分。需求把所有非推荐情况统一写成「箭头」，只给了爆（金）、飘（红）两种颜色，未定义普通箭头的形状/颜色，也未定义「优」「大」「多」文字的底色、描边、字色、尺寸、与牌面上方的偏移和遮挡层级。","original_text":"位置“3.2.5 手牌信息「听牌标签」、3.2.5.1「箭头」「多」「大」「优」”。引文：“普通听牌标签显示在候选牌上方，文案为「优」「大」「多」或箭头。……其他未获得推荐标签的候选牌也显示箭头。”","problem":"基准 02#3、02#6 要求箭头样式按听型（普通/大/多/优）区分。需求把所有非推荐情况统一写成「箭头」，只给了爆（金）、飘（红）两种颜色，未定义普通箭头的形状/颜色，也未定义「优」「大」「多」文字的底色、描边、字色、尺寸、与牌面上方的偏移和遮挡层级。","impact":"开发和美术只能画一种箭头，现网听型区分丢失；UI 走查与验收缺乏逐项对照标准，容易反复改动。","suggestion":"补一张标签样式表：普通箭头形状与颜色；优、大、多三档文案的底色/描边/字色；爆（金）、飘（红）；统一的上方偏移量、字牌尺寸与层级顺序。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"普通箭头、优、大、多、爆、飘共 6 种标签可逐项对照样式表验收，截图与样式表一致。"},{"id":"Q53","title":"出牌后已听牌手牌的有效箭头未定义","priority":"P2","type":"描述不完整","module":["听牌箭头（出牌后）"],"dimension":"UI 交互","source_location":"3.2.5.1 听牌标签显示规则、4.5 行牌操作「出牌」","rule_ref":"02#6。基准 02#6 规定「出牌后仍保留有效箭头」。需求只定义出牌前对候选牌模拟打出的标签，未写出牌后（本家已成听）剩余手牌上的有效箭头是否保留、按什么口径刷新（同牌值只标第一张）、何时清除（摸牌、吃碰杠、胡牌、流局）。这与缺查听按钮是两处不同 UI：此处指出牌后手牌上的箭头本身没有规则。","original_text":"位置“3.2.5.1 听牌标签显示规则、4.5 行牌操作「出牌」”。引文：“本家出牌前，逐个模拟打出合法手牌。打出后可成听的手牌列为候选牌。吃碰禁手牌及受飘财摸打限制而不可打出的牌排除。”","problem":"基准 02#6 规定「出牌后仍保留有效箭头」。需求只定义出牌前对候选牌模拟打出的标签，未写出牌后（本家已成听）剩余手牌上的有效箭头是否保留、按什么口径刷新（同牌值只标第一张）、何时清除（摸牌、吃碰杠、胡牌、流局）。这与缺查听按钮是两处不同 UI：此处指出牌后手牌上的箭头本身没有规则。","impact":"玩家打出牌进入听牌后手牌无任何听牌标识，听牌状态不可感知；开发可能按「出牌后收起」把箭头全部清掉，与现网不符。","suggestion":"补充：出牌后按当前听牌态保留/刷新手牌箭头，同牌值只标第一张；摸牌、吃碰杠、胡牌、流局时按对应时机重算或清除；并说明与提牌时候选标签的共存或互斥关系。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"打出候选牌后剩余手牌仍显示有效听牌箭头且同牌值仅 1 个；摸牌后按新听牌态刷新；胡牌与流局后清除。"},{"id":"Q54","title":"流局分支缺界面收束清单（与 Q51 同根因，重复登记，建议合并）","priority":"P2","type":"描述不完整","module":["流局/黄庄"],"dimension":"UI 交互","source_location":"结算流程/流程明细（流局场景）、结算界面/小结算界面（好友房）/触发逻辑「流局后进入」、方位信息「小局结束」","rule_ref":"03#2。基准流局路径要求：摊牌→隐藏听牌按钮/听牌弹窗/出牌放大→收操作区→倒计时与方位光熄灭→结束类型切“荒牌”页；需求文档胡牌场景逐项写了操作按钮、胡牌预览、听牌提示、放大的弃牌退场，流局场景只写“停止行牌+亮牌+显示黄庄”，未写听牌按钮/听牌详情/出牌放大/操作区是否收起，也未定义结束类型枚举。","original_text":"位置“结算流程/流程明细（流局场景）、结算界面/小结算界面（好友房）/触发逻辑「流局后进入」、方位信息「小局结束」”。引文：“确认后停止行牌，流局计 1 小局。各端按座位方向亮出四家手牌，桌面中央同时显示橙色「黄庄」。”","problem":"基准流局路径要求：摊牌→隐藏听牌按钮/听牌弹窗/出牌放大→收操作区→倒计时与方位光熄灭→结束类型切“荒牌”页；需求文档胡牌场景逐项写了操作按钮、胡牌预览、听牌提示、放大的弃牌退场，流局场景只写“停止行牌+亮牌+显示黄庄”，未写听牌按钮/听牌详情/出牌放大/操作区是否收起，也未定义结束类型枚举。","impact":"流局瞬间可能残留听牌按钮、听牌详情或放大弃牌，牌桌与结算遮罩叠加；测试无法判定黄庄那一帧哪些元素必须消失。","suggestion":"与 Q51 合并处理：为流局补与胡牌对称的收束清单及顺序：亮牌摊牌、隐藏听牌按钮与听牌详情、隐藏出牌放大、收起操作区、结束倒计时与方位高亮，再显示黄庄并进入小结算；同时明确结束类型取值。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"以黄庄确认事件为 T=0，断言听牌按钮、听牌详情、放大弃牌、操作按钮均不可见，倒计时与方位高亮结束，桌面仅保留终局牌河/财神/余牌 20 与“黄庄”。"},{"id":"Q55","title":"飘分只写“按座位”，未定义顺序与推进条件","priority":"P2","type":"描述不完整","module":["飘分（结果分数）"],"dimension":"UI 交互","source_location":"结算流程/流程明细（胡牌场景）、吃碰杠胡操作/自摸、吃胡（点炮胡）、抢杠胡","rule_ref":"03#8。基准要求有分数变化的座位逐个播分数动画，全部座位动画完成后才进下一步，并带防串台与回调丢失时的强制推进；需求只写“按座位显示飘分”，既没有逐个播放的顺序与间隔，也没有“全部完成才进小结算”的屏障，更没有动画回调丢失时的兜底。","original_text":"位置“结算流程/流程明细（胡牌场景）、吃碰杠胡操作/自摸、吃胡（点炮胡）、抢杠胡”。引文：“番型字效退场后，各端只在本局得分非 0 的玩家座位内侧显示飘分。……飘分逐渐淡出，牌桌保留终局摊牌片刻，再展示小结算。”","problem":"基准要求有分数变化的座位逐个播分数动画，全部座位动画完成后才进下一步，并带防串台与回调丢失时的强制推进；需求只写“按座位显示飘分”，既没有逐个播放的顺序与间隔，也没有“全部完成才进小结算”的屏障，更没有动画回调丢失时的兜底。","impact":"开发可能四家同时弹分或提前进入小结算，导致飘分被截断、分数与头像积分不同步；断线或回调丢失时可能永久卡在飘分段。","suggestion":"补充：飘分按固定座位顺序逐个播放、每段时长与间隔、0 分座位不播、全部完成才推进小结算；定义回调丢失或断线时强制结束飘分并继续的兜底规则。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"构造四家均有分数变化的对局，断言飘分按座位依次出现且全部结束后才出现小结算；删掉一次动画回调或中途断线，仍能自动推进不卡死。"},{"id":"Q56","title":"结算演出阶段的重连恢复未定义（本类主条目，Q57 同根因）","priority":"P2","type":"描述不完整","module":["断线重连/结算恢复"],"dimension":"UI 交互","source_location":"7.2 同步与异常处理「重连恢复」、7.2 同步与异常处理「重连恢复」、4.4 发牌","rule_ref":"03#21。基准规定重连处于结算阶段时，静默重放胡牌数据后，对有胡牌标记的座位恢复台面标识与摊牌；需求只按“准备页/当前对局/小结算/末局小结算”四种页面选择，没有覆盖胡牌已确认、番型或飘分演出进行中、摊牌未完成这一阶段，也未说明重连是否重播番型/飘分、是否重复弹小结算。","original_text":"位置“7.2 同步与异常处理「重连恢复」、7.2 同步与异常处理「重连恢复」、4.4 发牌”。引文：“房间仍在时，首局尚未开始则恢复房间准备页，当前小局进行中则恢复当前对局。……加载该玩家可见的座位、准备和在线状态、局数、庄家及牢数、积分、余牌、公开牌河及牌组、本家手牌和分隔位、行牌方、可用操作及剩余倒计时。”","problem":"基准规定重连处于结算阶段时，静默重放胡牌数据后，对有胡牌标记的座位恢复台面标识与摊牌；需求只按“准备页/当前对局/小结算/末局小结算”四种页面选择，没有覆盖胡牌已确认、番型或飘分演出进行中、摊牌未完成这一阶段，也未说明重连是否重播番型/飘分、是否重复弹小结算。","impact":"开发可能重播整段番型与飘分，或恢复到半成品牌桌（手牌未摊开、台面标识缺失）；测试没有验收口径，重连后容易出现重复演出或卡在半结算状态。","suggestion":"补充结算阶段重连分支：静默重放胡牌数据并恢复摊牌与台面标识，不重播番型/飘分；若小结算已展示则直接恢复小结算且不重复弹，未展示则落到当前演出段或直接进入小结算（需二选一写明）。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"分别在番型播放中、摊牌中、飘分中、小结算已弹出四个时点断线重连：界面与断线前一致，无重复番型/飘分，小结算不重复弹出，可正常点继续游戏。"},{"id":"Q57","title":"重连落在发牌等场景阶段时如何分发与呈现未定义（与 Q56 同根因，重复登记，建议合并）","priority":"P2","type":"描述不完整","module":["断线重连 / 发牌阶段恢复"],"dimension":"UI 交互","source_location":"7.2 同步与异常处理「重连恢复」、4.4 发牌","rule_ref":"04#2。基准按游戏状态分发开始/做牌/发牌/行牌/洗牌五个场景快照命令，且状态无映射时不执行任何恢复。需求只把页面粗分为准备页、当前对局、小结算/已准备桌面，未定义「当前小局进行中」处于发牌中、发牌完成未行牌（或做牌/洗牌阶段）时恢复成什么：是否直接呈现发牌完成态、各家牌背数量与余牌数 83 如何显示、无映射状态如何处理（保持桌面还是回大厅）均缺失，属失败与恢复分支缺失。","original_text":"位置“7.2 同步与异常处理「重连恢复」、4.4 发牌”。引文：“房间仍在时，首局尚未开始则恢复房间准备页，当前小局进行中则恢复当前对局。”","problem":"基准按游戏状态分发开始/做牌/发牌/行牌/洗牌五个场景快照命令，且状态无映射时不执行任何恢复。需求只把页面粗分为准备页、当前对局、小结算/已准备桌面，未定义「当前小局进行中」处于发牌中、发牌完成未行牌（或做牌/洗牌阶段）时恢复成什么：是否直接呈现发牌完成态、各家牌背数量与余牌数 83 如何显示、无映射状态如何处理（保持桌面还是回大厅）均缺失，属失败与恢复分支缺失。","impact":"重连落到发牌阶段可能白屏、卡在发牌动画中途、或者只显示部分手牌；遇到未覆盖状态时开发只能自造兜底逻辑，各端表现不一致。","suggestion":"与 Q56 合并处理：补充「状态→恢复分支」表（开始/做牌/发牌/行牌/洗牌 → 对应快照与呈现终态），并明确：发牌阶段恢复直接呈现发牌完成后的静态手牌与余牌数、不重播发牌动画；状态无法映射时不执行恢复并给出统一兜底（如保持当前桌面并等待下一次状态下发）。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"在发牌动画中、发牌完成未进入行牌、做牌/洗牌阶段各时点重连：界面直接呈现该阶段静态终态（牌背数量、余牌数、庄标正确），无发牌动画重播，无空白桌面。"},{"id":"Q58","title":"「可用操作」笼统，权限按位恢复与等待态按钮未定义","priority":"P2","type":"描述不完整","module":["断线重连 / 操作区与权限"],"dimension":"UI 交互","source_location":"7.2 同步与异常处理「重连恢复」、4.6 吃碰杠胡操作（弃牌响应与「过」）","rule_ref":"04#8。基准要求权限与按钮按位完整恢复（碰/杠/胡/过的显隐、手牌置灰/禁打压暗、听牌按钮隐藏），且他人权限要立即收起操作区。需求只用「可用操作」一项概括，未说明：禁手压暗与飘财摸打压暗是否随恢复还原、听牌标签/详情是否重新展示、已提交等待中的请求恢复时是否仍隐藏【吃】【过】（4.6 规定提交后收起），以及旁观其他家时操作区必须为空。","original_text":"位置“7.2 同步与异常处理「重连恢复」、4.6 吃碰杠胡操作（弃牌响应与「过」）”。引文：“加载…行牌方、可用操作及剩余倒计时。已提交且仍待裁决的操作恢复为等待。”","problem":"基准要求权限与按钮按位完整恢复（碰/杠/胡/过的显隐、手牌置灰/禁打压暗、听牌按钮隐藏），且他人权限要立即收起操作区。需求只用「可用操作」一项概括，未说明：禁手压暗与飘财摸打压暗是否随恢复还原、听牌标签/详情是否重新展示、已提交等待中的请求恢复时是否仍隐藏【吃】【过】（4.6 规定提交后收起），以及旁观其他家时操作区必须为空。","impact":"重连后可能出现「按钮可点但对应手牌已压暗/禁打」的错位，或等待中按钮重新出现导致重复提交；也可能把别人的操作按钮渲染到本家视图中。","suggestion":"把「可用操作」展开成恢复清单：按权限位恢复按钮组、恢复手牌置灰与禁打范围、恢复/隐藏听牌提示；明确等待态不显示已提交操作的按钮、他人视角操作区为空、恢复期间不开放点击。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"分别在可碰/可杠/可胡/可吃响应中、低优先级等待中、受飘财摸打限制中重连：按钮显隐、手牌压暗、禁打范围与断线前完全一致；等待态无按钮且不能重复提交；非操作者视角无操作区。"},{"id":"Q59","title":"首出庄闲提示仅有字样，文案与展示规则缺失","priority":"P2","type":"描述不完整","module":["桌面常驻元素/首出提示"],"dimension":"UI 交互","source_location":"4.4 发牌「切入行牌」「首打提示」","rule_ref":"07#10。基准#10：本局第一次出牌权限时显示提示条，按自己是否庄家切换文案，同时隐藏骰子，且仅出现一次；需求只有「提示」二字，无文案内容、展示位置/时长、是否仅一次、与骰子和中央倒计时的关系。","original_text":"位置“4.4 发牌「切入行牌」「首打提示」”。引文：“庄家收到优先出牌提示，闲家收到等待提示，首个操作阶段按4.5、4.6处理。／首打提示。理牌完成后，骰盘区域显示庄家出牌倒计时。庄家可开始操作，闲家等待。”","problem":"基准#10：本局第一次出牌权限时显示提示条，按自己是否庄家切换文案，同时隐藏骰子，且仅出现一次；需求只有「提示」二字，无文案内容、展示位置/时长、是否仅一次、与骰子和中央倒计时的关系。","impact":"开发无法实现提示条，测试无法判定「仅一次」，提示条与中央倒计时区域易重叠，首局与后续小局表现不可验收。","suggestion":"补充：庄家/闲家两套文案原文；提示条位置（相对方位盘与中央倒计时）；入场停留退场时长；仅在每局首次取得出牌权时出现一次；提示出现时隐藏骰子。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"第 1 局与第 2～8 局各走查一次：仅该局首次出牌权出现一次提示条，庄/闲文案不同，提示期间骰子不显示，非首出不再出现。"},{"id":"Q60","title":"倒计时归零后方位盘高亮是否熄灭未描述","priority":"P2","type":"描述不完整","module":["桌面常驻元素/方位盘"],"dimension":"UI 交互","source_location":"3.2.1「操作指示」「倒计时」","rule_ref":"07#5,07#3。基准#5：方位光亮光随倒计时呼吸闪烁，归零熄灭；需求只写轮次交接时清除高亮，未写归零熄灭，按字面实现会一直亮到下一玩家接管（本期无托管，可能长时间亮灯），也与流局时归零熄灭的基准不符。","original_text":"位置“3.2.1「操作指示」「倒计时」”。引文：“轮次交接后清除上一边的高亮，切到新的操作者对应边。／出牌或响应倒计时归零后保持 00，继续等待手动出牌或响应。”","problem":"基准#5：方位光亮光随倒计时呼吸闪烁，归零熄灭；需求只写轮次交接时清除高亮，未写归零熄灭，按字面实现会一直亮到下一玩家接管（本期无托管，可能长时间亮灯），也与流局时归零熄灭的基准不符。","impact":"超时等待期间方位光状态与现网不一致；流局/小局结束的画面状态无验收口径，客户端可能残留高亮。","suggestion":"明确「倒计时归零时方位光熄灭，中央保持 00，继续等待手动操作；下一阶段开始时重新点亮当前操作者对应边」，并说明流局/小局结束时方位光与倒计时同步停止。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"出牌倒计时走到 00 后方位光熄灭且数字保留 00；点【过】或下一阶段开始时重新点亮正确边；流局确认后方位光与数字同时停止。"},{"id":"Q61","title":"回到准备态时常驻元素清理未描述（庄标/余牌数/放大牌）（与 Q14 同根因，重复登记，建议合并）","priority":"P2","type":"描述不完整","module":["桌面常驻元素/重置清理"],"dimension":"UI 交互","source_location":"5.1「小结算与下一局」、6.1.1「本场继续」","rule_ref":"07#9,07#7,07#14。基准#9 重置时庄标全隐藏、#7 余牌数重置时隐藏、#14 出牌放大重置时隐藏；需求只清手牌、碰杠区和牌河，未列庄标、余牌数、放大弃牌、财神指示牌、方位盘的清理口径，而 4.2 又写庄标在下一局掷骰开始时才刷新，存在残留矛盾。","original_text":"位置“5.1「小结算与下一局」、6.1.1「本场继续」”。引文：“点击【继续游戏】后，本端收起小结算，回到同桌准备状态。清除本端桌面上上一局的手牌、碰杠区和牌河，保留座位和累计积分。”","problem":"基准#9 重置时庄标全隐藏、#7 余牌数重置时隐藏、#14 出牌放大重置时隐藏；需求只清手牌、碰杠区和牌河，未列庄标、余牌数、放大弃牌、财神指示牌、方位盘的清理口径，而 4.2 又写庄标在下一局掷骰开始时才刷新，存在残留矛盾。","impact":"回准备态桌面会残留上一局庄标/余牌数/放大牌，与「掷骰开始才显示庄标」冲突；下一局开局截图的期望状态无法确定。","suggestion":"与 Q14 合并处理：补充常驻元素清理清单：庄标隐藏（下一局掷骰开始按新庄刷新）、余牌数/牌墙隐藏、放大弃牌与弃牌浮标清除、财神指示牌隐藏、方位盘回暗色底座四侧风位字灰暗。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"点【继续游戏】后截图：仅保留座位、头像积分昵称、暗色方位盘底座；庄标、余牌数、放大牌、浮标、财神指示牌均不显示。"},{"id":"Q62","title":"流局黄庄时出牌放大与浮标未描述退场（与 Q51 同根因，重复登记，建议合并）","priority":"P2","type":"描述不完整","module":["桌面常驻元素/出牌放大"],"dimension":"UI 交互","source_location":"5.1「流局场景」黄庄演出","rule_ref":"07#14。基准#14：碰/杠/胡/流局/重置时统一隐藏放大展示；需求在胡牌场景写了「放大的弃牌退场」，流局场景只写亮牌与黄庄字样，未写最后一张弃牌的放大牌与浮标是否退场。","original_text":"位置“5.1「流局场景」黄庄演出”。引文：“各端按座位方向亮出四家手牌，桌面中央同时显示橙色「黄庄」。终局牌河、财神和余牌数 20 保留。”","problem":"基准#14：碰/杠/胡/流局/重置时统一隐藏放大展示；需求在胡牌场景写了「放大的弃牌退场」，流局场景只写亮牌与黄庄字样，未写最后一张弃牌的放大牌与浮标是否退场。","impact":"黄庄演出终局画面可能残留放大牌，终局截图/长按查看牌桌的期望内容不一致，验收标准缺失。","suggestion":"与 Q51 合并处理：补充「流局确认时清除放大弃牌及弃牌浮标，终局牌桌只保留牌河实牌」，与胡牌场景统一口径。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"制造一次黄庄：进入黄庄演出瞬间桌面无放大弃牌、无浮标，牌河最后一张为正常尺寸实牌。"},{"id":"Q63","title":"重连恢复未覆盖最后出牌浮标/放大牌/财神指示牌（与 Q24 同根因，重复登记，建议合并）","priority":"P2","type":"描述不完整","module":["桌面常驻元素/断线重连"],"dimension":"UI 交互","source_location":"7.2「同步与异常处理」重连恢复","rule_ref":"07#15。基准#15：重连恢复时若最后出牌匹配则补最后出牌箭头（浮标）；需求的恢复项清单不含最后弃牌浮标/箭头、当前出牌放大、方位盘当前操作边高亮、财神指示牌，重连后这些常驻元素是否补显示未定义。","original_text":"位置“7.2「同步与异常处理」重连恢复”。引文：“加载该玩家可见的座位、准备和在线状态、局数、庄家及牢数、积分、余牌、公开牌河及牌组、本家手牌和分隔位、行牌方、可用操作及剩余倒计时。”","problem":"基准#15：重连恢复时若最后出牌匹配则补最后出牌箭头（浮标）；需求的恢复项清单不含最后弃牌浮标/箭头、当前出牌放大、方位盘当前操作边高亮、财神指示牌，重连后这些常驻元素是否补显示未定义。","impact":"断线重连后桌面可能缺浮标、放大牌或高亮，与未断线玩家的画面不一致，重连场景无验收依据。","suggestion":"与 Q24 合并处理：在重连恢复项补充「最后一张弃牌浮标（匹配则补箭头）、当前出牌放大牌、方位盘当前操作边高亮、财神指示牌」的恢复口径与刷新时机。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"在他人刚出牌后断线重连：恢复后浮标指向该弃牌、放大牌显示、方位盘高亮与操作者一致、财神指示牌保留。"},{"id":"Q64","title":"骰子停稳后隐藏时机与并行规则不确定","priority":"P2","type":"描述不完整","module":["开局流程 / 掷骰"],"dimension":"UI 交互","source_location":"3.2.1 方位信息（骰子）/ 4.4 发牌（发牌UI以及动画表现）","rule_ref":"08#7。基准 08#7 明确「播完延迟 1 秒自动隐藏」；需求只描述停稳与退场后的状态，隐藏延时未定义，原文用「可以」使是否必须与发牌重叠也不确定，而附录 B 声明录屏时间码只用于定位、不作为验收口径，正文无规则可依。","original_text":"位置“3.2.1 方位信息（骰子）/ 4.4 发牌（发牌UI以及动画表现）”。引文：“「骰子翻滚后停稳，展示本次点数……骰子停稳后可以和发牌画面并行展示。」「骰子退场后中央先留空。」全文未给出停稳后多久自动隐藏，也未说明由什么条件触发退场。”","problem":"基准 08#7 明确「播完延迟 1 秒自动隐藏」；需求只描述停稳与退场后的状态，隐藏延时未定义，原文用「可以」使是否必须与发牌重叠也不确定，而附录 B 声明录屏时间码只用于定位、不作为验收口径，正文无规则可依。","impact":"开发可能选择不隐藏或立即隐藏，造成骰子遮挡发牌与中央区域，或与中央倒计时切换冲突；测试无法判定隐藏时机是否合格。","suggestion":"正文补充：骰子停稳后固定延迟 N 秒自动隐藏（给出具体秒数）；明确是否与发牌并行、并行的起止帧；隐藏后中央留空至发牌理牌完成；补充重连时骰子的静态展示与收起条件。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"停稳后 N 秒内骰子自动消失且不遮挡手牌与余牌数；隐藏后中央保持空白，理牌完成后才切换倒计时；可按 N 值直接写计时断言。"},{"id":"Q65","title":"自摸与杠同时可用时按钮排列与作用范围未定义","priority":"P2","type":"描述不完整","module":["吃碰杠胡 / 按钮排列"],"dimension":"UI 交互","source_location":"三、4.6 吃碰杠胡操作「杠」「自摸」；三、4.7 多操作状态「可多杠」「同一玩家可多项操作」","rule_ref":"01#29,01#21。4.7 只给出弃牌响应的按钮横排顺序（【吃】【碰】【杠】【胡】【过】）；出牌阶段【自摸】与【杠】并存（4.7「可多杠」明确提到“同次可自摸时的【自摸】”）时，按钮排列顺序、预览卡片相对位置、以及【过】与选组【取消】的作用范围均未定义。另 4.6 反复使用“手牌右上方”，4.7 使用“手牌上方横排”，锚点口径也不统一。","original_text":"位置“三、4.6 吃碰杠胡操作「杠」「自摸」；三、4.7 多操作状态「可多杠」「同一玩家可多项操作」”。引文：“只有本家在手牌右上方看到【自摸】【过】。在【自摸】左侧显示本次可胡的牌和按钮预览倍数。／本家行牌时，若可暗杠或加杠，在手牌右上方显示【杠】【过】。”","problem":"4.7 只给出弃牌响应的按钮横排顺序（【吃】【碰】【杠】【胡】【过】）；出牌阶段【自摸】与【杠】并存（4.7「可多杠」明确提到“同次可自摸时的【自摸】”）时，按钮排列顺序、预览卡片相对位置、以及【过】与选组【取消】的作用范围均未定义。另 4.6 反复使用“手牌右上方”，4.7 使用“手牌上方横排”，锚点口径也不统一。","impact":"自摸与杠并存的常见局面（杠后补牌胡、摸牌后另有暗杠）按钮布局与点击行为无法实现，验收无基准，容易出现两个【过】或预览卡位置错乱。","suggestion":"补充出牌阶段的按钮排列与锚点：如【杠】【自摸】【过】，预览卡固定在【自摸】左侧；统一定义按钮锚点为“手牌上方横排、右对齐”；进入多组杠选组后只保留候选与【取消】，【过】与【取消】作用范围一致，均为放弃本次行牌机会的全部可选操作。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"构造“补牌后可自摸且另有一组可暗杠”的局面：按钮顺序、预览卡位置、锚点与文档一致；点【过】后【杠】不再显示且可正常出牌；点【杠】进入选组后不再显示【自摸】。"},{"id":"Q66","title":"局间准备态界面构成与准备状态位置未定义","priority":"P2","type":"描述不完整","module":["小结算 / 局间准备"],"dimension":"UI 交互","source_location":"六、6.1.1 触发逻辑「本场继续」；三、3.1 对局前「准备信息」「玩法/房间号」；三、3.2.3 玩家头像信息","rule_ref":"06#54。“同桌准备状态”的界面构成未定义：是回到 3.1 的对局前玩家信息卡（含准备状态、房间玩法与房间号），还是保留 3.2 牌桌布局；3.2.3 头像信息没有准备状态项，而 3.1 又写明开局后该区域已切换为“当前局数／总局数”，因此局间准备时该区域显示局数还是房间号、准备状态显示在哪个节点，均无法确定。","original_text":"位置“六、6.1.1 触发逻辑「本场继续」；三、3.1 对局前「准备信息」「玩法/房间号」；三、3.2.3 玩家头像信息”。引文：“点击【继续游戏】后，本端收起小结算，回到同桌准备状态。清除本端桌面上上一局的手牌、碰杠区和牌河，保留座位和累计积分。本家显示「已准备」”","problem":"“同桌准备状态”的界面构成未定义：是回到 3.1 的对局前玩家信息卡（含准备状态、房间玩法与房间号），还是保留 3.2 牌桌布局；3.2.3 头像信息没有准备状态项，而 3.1 又写明开局后该区域已切换为“当前局数／总局数”，因此局间准备时该区域显示局数还是房间号、准备状态显示在哪个节点，均无法确定。","impact":"局间准备界面无法实现与验收，四端可能显示不一致，玩家看不到谁是未准备。","suggestion":"明确局间准备态沿用对局前布局（四个玩家信息卡 + 准备状态 + 局数显示如「2/8局」，房间号是否显示给出结论），或明确保留牌桌并在 3.2.3 头像区新增准备状态项，并说明已准备/未准备状态由“是否已点【继续游戏】”决定。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"点击【继续游戏】后四端截图可逐项比对：布局、准备状态所在节点与文案、局数与房间号显示三处均与文档一致；未点【继续游戏】的玩家在其他三端显示「未准备」。"},{"id":"Q67","title":"爆头/财飘听牌标签为新增需补差异说明","priority":"P3","type":"需求缺失","module":["听牌标签（爆/飘）"],"dimension":"UI 交互","source_location":"3.2.5 手牌信息「听牌标签」、3.2.5.1 听牌标签显示规则","rule_ref":"02#14。基准 02#14 记录现网客户端没有爆头/财飘的专门 UI 标签或控件，仅在匹配场等待文案中提及。需求新增金色「爆」、红色「飘」标签并定义冲突优先级，属现网不存在的新增项，但未标注为新增需求或差异说明。","original_text":"位置“3.2.5 手牌信息「听牌标签」、3.2.5.1 听牌标签显示规则”。引文：“杭麻听牌标签。可爆头显示金色「爆」，可财飘显示红色「飘」。特殊标签的优先级按 3.2.5.1「手牌交互说明」处理。……同一候选同时符合「飘」和「爆」时，显示「飘」。”","problem":"基准 02#14 记录现网客户端没有爆头/财飘的专门 UI 标签或控件，仅在匹配场等待文案中提及。需求新增金色「爆」、红色「飘」标签并定义冲突优先级，属现网不存在的新增项，但未标注为新增需求或差异说明。","impact":"开发按新增实现后会与现网表现不一致；测试与验收缺少现网基线，后续与线上版本合入时容易产生分歧。","suggestion":"在听牌标签章节标注「新增（现网无）」，并补充触发条件、判定口径、样式稿或设计图；差异项统一登记到「与现网实现的差异说明」。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"文档明确标注该标签为新增差异；爆/飘的触发条件与样式可逐项验收。"},{"id":"Q68","title":"未定义重连方位灯秒数比倒计时多1秒余量","priority":"P3","type":"需求缺失","module":["断线重连 / 方位信息倒计时"],"dimension":"UI 交互","source_location":"3.2.1 方位信息｜倒计时、7.2 同步与异常处理「重连恢复」","rule_ref":"04#12。基准规定重连倒计时恢复时，方位灯秒数比中央倒计时多 1 秒余量。需求未给该口径，若按同一剩余值渲染，重连瞬间可能出现中央仍显示 01 而方位高亮已熄灭（或相反）的不同步。","original_text":"位置“3.2.1 方位信息｜倒计时、7.2 同步与异常处理「重连恢复」”。引文：“缺失说明：7.2 只写「加载…剩余倒计时」与「倒计时以服务端时间为准」，未定义重连时方位高亮（方位灯）与中央倒计时数字之间的秒数差。”","problem":"基准规定重连倒计时恢复时，方位灯秒数比中央倒计时多 1 秒余量。需求未给该口径，若按同一剩余值渲染，重连瞬间可能出现中央仍显示 01 而方位高亮已熄灭（或相反）的不同步。","impact":"重连玩家难以判断自己是否还有操作时间，跨端看到的「是否轮到谁」也不一致。","suggestion":"补充：重连恢复时中央倒计时按服务端剩余时间渲染，方位灯/头像流光计时比倒计时多 1 秒余量，倒计时归零后再熄灭，避免同一帧两者同时消失。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"在剩余约 1 秒时重连：中央显示 01、对应方位仍高亮；数字归零后高亮才熄灭，其它玩家视角表现一致。"},{"id":"Q69","title":"未定义听牌与小结算弹窗资源预加载","priority":"P3","type":"需求缺失","module":["弹窗资源"],"dimension":"UI 交互","source_location":"4.4「发牌」发牌 UI 以及动画表现—音效、6.1.2「UI交互以及说明」","rule_ref":"06#3。基准要求听牌包与小结算包在进游戏时预加载，避免首次弹结算卡顿。需求未描述任何弹层资源加载时机或性能约束。","original_text":"位置“4.4「发牌」发牌 UI 以及动画表现—音效、6.1.2「UI交互以及说明」”。需求文档无对应描述。","problem":"基准要求听牌包与小结算包在进游戏时预加载，避免首次弹结算卡顿。需求未描述任何弹层资源加载时机或性能约束。","impact":"实现可能首次打开听牌详情或小结算时卡顿，验收无对应指标；也不影响主流程正确性。","suggestion":"补充一句性能约束：听牌与小结算资源在进入牌桌时预加载；若不做约束，声明由客户端自定。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"可在进牌桌后测量首次打开听牌详情/小结算是否无首次加载卡顿。"},{"id":"Q70","title":"财神指示牌与粉色财神面未标注与现网差异","priority":"P3","type":"需求缺失","module":["桌面常驻元素/财神指示"],"dimension":"UI 交互","source_location":"3.2.2「财神」、4.3 定财神、3.2.5 麻将子","rule_ref":"07#12,07#13。基准#12：现网无财神指示牌视图与翻财神动画，手牌癞子靠配置牌表的黄色角标识别；需求新增中央指示牌并把白板手牌改为粉色牌面，未按检查口径标注「与现网实现差异」，也未说明手牌黄色财神角标是取消还是保留。","original_text":"位置“3.2.2「财神」、4.3 定财神、3.2.5 麻将子”。引文：“每小局掷骰动画开始时，在中央骰盘左侧直接显示竖向小牌，粉色牌面上绘制白板边框。／本家手中的白板财神使用粉色牌面，保留白板边框。”","problem":"基准#12：现网无财神指示牌视图与翻财神动画，手牌癞子靠配置牌表的黄色角标识别；需求新增中央指示牌并把白板手牌改为粉色牌面，未按检查口径标注「与现网实现差异」，也未说明手牌黄色财神角标是取消还是保留。","impact":"客户端会按需求新增视图并可能移除现网角标，资源与层级易冲突；验收时容易把新增指示牌误判为偏离现网。","suggestion":"新增「与现网实现的差异说明」段落：本期新增中央财神指示牌（现网无）、手牌白板改粉色牌面，并明确黄色财神角标取消/保留及其适用端。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"需求中存在差异说明段落并可被引用；走查时中央指示牌、手牌财神面、角标表现与需求逐项一致。"},{"id":"Q71","title":"未描述牌墙展示与显示开关（本类主条目，Q05 同根因）","priority":"P3","type":"需求缺失","module":["桌面常驻元素/牌墙"],"dimension":"UI 交互","source_location":"3.2.2 玩法信息、4.4 发牌、3.1 桌面布局 / 3.2.1 方位信息（骰子）/ 3.2.2 玩法信息（剩余张数）/ 4.4 发牌（发牌UI以及动画表现）","rule_ref":"07#8。基准#8：牌墙显示受玩家设置开关控制，牌墙按骰子点数之和的奇偶推算哪一侧多一墩；需求完全未描述牌墙视图，也未写「本期不展示牌墙」，桌面布局表亦无该元素。","original_text":"位置“3.2.2 玩法信息、4.4 发牌、3.1 桌面布局 / 3.2.1 方位信息（骰子）/ 3.2.2 玩法信息（剩余张数）/ 4.4 发牌（发牌UI以及动画表现）”。引文：“全文仅有「发完庄家14张，三名闲家各13张，共发53张，牌墙余83张」「从牌墙尾部补牌」等计数描述，无牌墙组件外观、显示开关与墩数分布描述。”","problem":"基准#8：牌墙显示受玩家设置开关控制，牌墙按骰子点数之和的奇偶推算哪一侧多一墩；需求完全未描述牌墙视图，也未写「本期不展示牌墙」，桌面布局表亦无该元素。","impact":"牌墙资源、朝向与多一墩侧别无法实现或验收；余牌数与牌墙墩数对不上时无判定依据，与现网桌面呈现不一致。","suggestion":"补充牌墙展示口径（默认显示/隐藏、设置开关归口）、骰子点数和奇偶决定多一墩的侧别与摆放顺序；或明确写「本期不展示牌墙，仅展示余牌数」。","status":"待确认","has_detail":true,"requirementIds":[],"acceptance":"牌桌截图中牌墙墩数与余牌数、骰子奇偶推算结果一致；或需求有「本期不展示牌墙」的明文，测试按文档判定。"},{"id":"Q72","title":"新增吃按钮界面缺与现网差异说明","priority":"P3","type":"描述不完整","module":["吃碰杠胡/吃界面"],"dimension":"UI 交互","source_location":"4.6 吃碰杠胡操作（吃（单组）、吃（多组））、4.8 可多吃","rule_ref":"01#5。基准注明杭麻客户端“无吃操作界面入口（按钮未注册）”；本期需求新增吃按钮、多组选组面板与“吃时其余手牌压暗”，且该压暗与基准 01#15“无碰杠权限时清灰”口径不同，需求未标注这是新增功能及与现网的差异。","original_text":"位置“4.6 吃碰杠胡操作（吃（单组）、吃（多组））、4.8 可多吃”。引文：““只有一个合法组合时，点【吃】即提交该组。”；“【吃】出现时，本家手牌中可参与该顺子的牌保持亮色，其余手牌压暗。””","problem":"基准注明杭麻客户端“无吃操作界面入口（按钮未注册）”；本期需求新增吃按钮、多组选组面板与“吃时其余手牌压暗”，且该压暗与基准 01#15“无碰杠权限时清灰”口径不同，需求未标注这是新增功能及与现网的差异。","impact":"开发按现网理解会认为吃不可实现，评审低估客户端改造量；测试用现网包核对会误判为需求未实现。","suggestion":"在需求中标注“吃按钮与选组面板为新增界面（现网未注册）”，列出客户端改造清单（按钮注册、选组面板、吃阶段压暗规则），并说明吃压暗与碰/杠压暗口径的关系。","status":"待确认\n\n---","has_detail":true,"requirementIds":[],"acceptance":"需求中出现明确的“与现网实现的差异说明”段落，至少覆盖新增按钮、选组面板、吃阶段压暗三项；开发可据此估时。"}],"overall_recommendations":["**归口**：玩法规则基准（听型判定阈值与优听定义），归玩法逻辑检查员","**原文**：位置“3.2.5.1「大」「优」、3.2.5 手牌信息「听牌标签」”。引文：“「大」为并列最高倍数，且各候选最高倍数有差异。至少两个不同牌面符合「大」时，其中也符合「多」的牌面标「优」。”","**问题**：基准 02#3 记录的现网听型为「大听＝存在显著更大倍数」「多听＝张数比最少多 2 张以上」「优听＝四张全在手」；需求把「大」放宽为「倍数有差异」，并把「优」定义为「既符合大又符合多」，判定口径与现网不同（基准 02#7 已声明数值阈值归玩法规则，故此处仅归口）。","**建议**：由玩法规则基准确认大/多/优阈值后回写；若确认采用新口径，标注为需求侧差异并说明对 UI 标签结果的影响。"]}</script>
<script>
(function () {
  'use strict';
  var DATA = JSON.parse(document.getElementById('report-data').textContent);
  // RTM 视图数据（--rtm 构建时存在；旧报告为 null，需求/规则覆盖 Tab 显示降级提示）
  var RTM = DATA.rtm || null;
  var secAnalysis = document.getElementById('sec-analysis');
  if (secAnalysis) document.getElementById('view-overview').appendChild(secAnalysis);
  // 主导航切换（需求/规则视图首次切入时懒渲染）
  var viewRendered = { overview: true, requirements: false, rules: false, issues: true, unified: false };
  var UNIFIED = DATA.unified || null;
  if (UNIFIED) {
    document.getElementById('tab-unified').style.display = '';
  }
  document.getElementById('main-tabs').addEventListener('click', function (e) {
    var btn = e.target.closest('.mtab');
    if (!btn) return;
    var v = btn.getAttribute('data-view');
    Array.prototype.forEach.call(document.querySelectorAll('.mtab'), function (t) { t.classList.toggle('active', t === btn); });
    ['overview', 'requirements', 'rules', 'issues', 'unified'].forEach(function (name) {
      document.getElementById('view-' + name).style.display = name === v ? '' : 'none';
    });
    if (v === 'requirements' && !viewRendered.requirements) { viewRendered.requirements = true; renderRequirementsView(); }
    if (v === 'rules' && !viewRendered.rules) { viewRendered.rules = true; renderRulesView(); }
    if (v === 'unified' && !viewRendered.unified && UNIFIED) { viewRendered.unified = true; renderUnifiedView(); }
    window.scrollTo(0, 0);
  });
  var PRI_COLOR = { P0: '#DC5148', P1: '#E8A044', P2: '#4389D5', P3: '#94A3B8' };
  var PRI_ORDER = { P0: 0, P1: 1, P2: 2, P3: 3 };
  var TYPE_COLOR = ['#3478DB', '#9A6FE0', '#DC5148', '#E8A044', '#94A3B8', '#4EC3B0'];
  var TYPE_DESC = {
    '需求缺失': '基准规则已定义，但需求文档缺失或未描述（MISSING）',
    '内容冲突': '需求文档内部两处描述互相矛盾（CONFLICT）',
    '逻辑错误': '与规则基准冲突或自身逻辑错误（LOGIC）',
    '定义歧义': '描述模糊，可多种理解（AMBIGUOUS）',
    '描述不完整': '描述不完整，无法实现或验收（INCOMPLETE）',
    '未分类': '源报告该条目仅登记在清单中，无详情块，未提供问题性质'
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function stripMd(s) { return String(s || '').replace(/\*\*/g, ''); }
  function priTag(p) { return '<span class="pri-tag" style="background:' + PRI_COLOR[p] + '">' + p + '</span>'; }
  function $(id) { return document.getElementById(id); }

  var byId = {};
  DATA.issues.forEach(function (it) { byId[it.id] = it; });

  // ---------- 01 头部 ----------
  (function () {
    var c = DATA.report.overall_conclusion || {};
    var badge = c.status === 'BLOCKED'
      ? '<span class="badge blocked">存在阻塞问题</span>'
      : c.status === 'ALLOWED'
        ? '<span class="badge allowed">可进入下一阶段</span>'
        : '<span class="badge na">检查完成</span>';
    var baselines = (DATA.report.rule_baselines || []).map(stripMd).join('；');
    if (RTM) {
      // 领导总览 header：审计规模 → 发现 → 结论（外部评审定案）
      var st = RTM.statistics;
      var agg = st.ruleCoverageAgg || { fullyPassed: 0, partial: 0, conflict: 0, missing: 0, unverified: 0, pendingConfirm: 0, notApplicable: 0 };
      var proj = esc(DATA.report.project_name ? DATA.report.project_name + ' · ' : '');
      var issueP0 = DATA.statistics.priority.P0 || 0;
      var issueP1 = DATA.statistics.priority.P1 || 0;
      var srcRef = 0, srcImpl = 0, srcOther = 0;
      (RTM.rules || []).forEach(function (r) {
        if (r.sourceType === 'reference-prd') srcRef += 1;
        else if (r.sourceType === 'implementation-reverse') srcImpl += 1;
        else srcOther += 1;
      });
      $('sec-header').innerHTML =
        '<div style="flex:1">' +
          '<h1>' + proj + 'PRD 质量审计报告</h1>' +
          '<div class="project">游戏需求完整性与规则一致性检查 · 检查对象：' + esc(DATA.report.source_file) + ' · ' + esc(DATA.report.inspection_date) + '</div>' +
          '<div class="scale-cards">' +
            '<div class="scale-card"><div class="num hl">' + st.requirementTotal + '</div><div class="label">提取的原子需求点</div><div class="sub">来自原始 PRD</div></div>' +
            '<div class="scale-card"><div class="num hl">' + st.rulePointTotal + '</div><div class="label">规则原子检查点</div><div class="sub">规则基准目录（适用 ' + st.applicableRulePoints + '）</div></div>' +
            '<div class="scale-card"><div class="num">' + (st.checkCompleteRate * 100).toFixed(1) + '%</div><div class="label">检查完成率</div><div class="sub">' + st.checkedRulePoints + ' / ' + st.applicableRulePoints + ' 适用规则点</div></div>' +

  // ---------- 抽屉 ----------
  var curId = null;
  // 行内 Markdown：esc 后处理粗体（**x** -> strong）

  }
  // 简易富文本渲染：**小节**： 行 -> 分块标题；逐行成段；连续 | 行组转表格
  function renderRich(text) {
    if (!text || !String(text).trim()) return '<p style="color:var(--muted)">（源报告清单条目，无详情块，未提供该字段内容）</p>';
    var html = [], tbl = [];
    function flush() {
      if (!tbl.length) return;
      var rows = tbl.filter(function (l) { return !/^\|[\s:|-]+\|?$/.test(l.trim()); });
      var trs = rows.map(function (row, ri) {
        var cells = row.replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); });
        var tag = ri === 0 ? 'th' : 'td';
        return '<tr>' + cells.map(function (c) { return '<' + tag + '>' + inlineMd(c) + '</' + tag + '>'; }).join('') + '</tr>';
      }).join('');
      html.push('<table class="mini-table">' + trs + '</table>');
      tbl = [];
    }
    String(text).split('\n').forEach(function (l) {
      var t = l.trim();
      if (t.startsWith('|')) { tbl.push(l); return; }
      flush();
      // **小节标题**： 单独成块（如「范例（需求必须按此格式写）：」）
      var h = t.match(/^\*\*([^*]+)\*\*([：:])?\s*$/);
      if (h) { html.push('<h5>' + esc(h[1]) + (h[2] || '') + '</h5>'); return; }
      if (t) html.push('<p>' + inlineMd(l) + '</p>');
    });
    flush();
    return html.length ? html.join('') : '<p style="color:var(--muted)">（源报告清单条目，无详情块，未提供该字段内容）</p>';
  }
