        '<div class="mod-head" data-mod="' + gid + '"><span class="name">' + esc(mod) + '</span>' +
          '<span class="m">规则点 ' + list.length + '</span><span class="m">完整通过 ' + cnt.full + '</span>' +
          '<span class="m">有问题 ' + cnt.bad + '</span><span class="m">未验证 ' + cnt.unv + '</span>' +
          '<span class="m">不适用 ' + cnt.na + '</span></div>' +
        '<div class="mod-body"><div style="overflow-x:auto"><table class="rtm"><thead><tr><th>Rule ID</th><th>来源文件</th><th>规则摘要</th><th>来源类型</th><th>检查状态</th><th>关联需求</th></tr></thead><tbody>' +
          list.map(function (r) {
            var srcTag = r.sourceType === 'reference-prd' ? '<span class="st-tag st-pending">PRD 基准参照</span>'
              : r.sourceType === 'implementation-reverse' ? '<span class="st-tag st-pass">客户端逆向</span>'
              : '<span class="st-tag st-unverified">' + esc(r.sourceType || 'unknown') + '</span>'
            return '<tr data-rule="' + esc(r.ruleId) + '"><td class="mono">' + esc(r.ruleId) + '</td>' +
              '<td class="r-nowrap">' + esc((r.file || '').replace(/^.*\//, '')) + '</td>' +
              '<td>' + esc((r.text || '').slice(0, 60)) + '</td><td>' + srcTag + '</td>' +
              '<td class="r-nowrap">' + stTag(r.verdict) + '</td>' +
              '<td>' + (r.requirementIds || []).length + '</td></tr>'
          }).join('') +
        '</tbody></table></div></div></div>'
    })
    el.innerHTML = html
    Array.prototype.forEach.call(el.querySelectorAll('.mod-head'), function (head) {
      head.addEventListener('click', function () {
        var g = document.getElementById(head.getAttribute('data-mod'))
        if (g) g.classList.toggle('open')
      })
    })
    Array.prototype.forEach.call(el.querySelectorAll('tr[data-rule]'), function (tr) {
      tr.addEventListener('click', function () { openRuleDrawer(tr.getAttribute('data-rule')) })
    })
  }

  // 实体抽屉：需求 / 规则（复用问题抽屉容器，按类型渲染，支持三向跳转）
  function showEntityDrawer(headHtml, bodyHtml) {
    $('d-pri').style.display = 'none'
    $('d-prev').style.display = 'none'
    $('d-next').style.display = 'none'
    $('drawer').classList.add('show'); $('drawer').setAttribute('aria-hidden', 'false')
    $('mask').classList.add('show')
    $('d-body').innerHTML = bodyHtml
    $('d-body').scrollTop = 0
    var head = document.querySelector('.drawer-head .id'); if (head) head.outerHTML = '<span class="id">' + headHtml + '</span>'
  }
  // 问题抽屉打开时恢复标准头（openDrawer 原逻辑保留 id 文本）
  function openReqDrawer(requirementId) {
    var r = REQ_BY_ID[requirementId]
    if (!r) return
    showEntityDrawer(
      esc(r.requirementId) + ' · ' + stTag(r.overallStatus === 'pass' ? 'fully-passed' : r.overallStatus),
      '<h4>需求原文</h4><blockquote>' + esc(r.text) + '</blockquote>' +
        '<h4>来源</h4><p>' + esc(r.source ? (r.source.file || '') + (r.source.section ? ' §' + r.source.section : '') + '（第 ' + r.source.fromLine + '~' + r.source.toLine + ' 行）' : '-') + '</p>' +
        '<h4>关联规则与检查结论（' + (r.ruleLinks || []).length + ' 条）</h4>' +
        ((r.ruleLinks || []).length ? '<table class="mini-table"><thead><tr><th>Rule</th><th>判定</th><th>证据</th></tr></thead><tbody>' +
          r.ruleLinks.map(function (x) {
            return '<tr><td><a href="javascript:void(0)" data-jump-rule="' + esc(x.ruleId) + '">' + esc(x.ruleId) + '</a></td>' +
              '<td>' + stTag(x.verdict) + (x.executionStatus === 'unverified' ? ' <span class="muted">（未完成）</span>' : '') + '</td>' +
              '<td>' + esc((x.evidence || '').slice(0, 160)) + '</td></tr>'
          }).join('') + '</tbody></table>' : '<p style="color:var(--muted)">无对应 Rule（待确认：可能为合理新增需求，需补充检查范围）</p>') +
        '<h4>关联问题（' + (r.issueIds || []).length + ' 条）</h4>' +
        ((r.issueIds || []).length
          ? '<p>' + r.issueIds.map(function (id) { return '<a href="javascript:void(0)" data-jump-issue="' + esc(id) + '">' + esc(id) + '</a>' }).join('、') + '</p>'
          : '<p style="color:var(--muted)">无关联问题</p>') +
        (r.verificationStatus === 'unverified' && r.unverifiedReason
          ? '<div class="status">未验证归因：' + esc(r.unverifiedReason) + '</div>' : '') +
        '<div class="status">检查维度：' + esc((r.coverageDimensions || []).join('、')) + '（已关联规则全部通过 ≠ 已经过所有应执行维度的检查）</div>'
    )
    wireEntityJumps()
  }
  function openRuleDrawer(ruleId) {
    var r = RULE_BY_ID[ruleId]
    if (!r) return
    var evidences = (RTM.requirements || []).filter(function (q) { return (q.ruleLinks || []).some(function (x) { return x.ruleId === ruleId }) })
      .map(function (q) { var link = q.ruleLinks.filter(function (x) { return x.ruleId === ruleId })[0]; return { requirementId: q.requirementId, title: q.title, status: link.status, evidence: link.evidence, evidenceInvalid: link.evidenceInvalid } })
    showEntityDrawer(
      esc(ruleId) + ' · ' + stTag(r.verdict),
      '<h4>规则原文</h4><blockquote>' + esc(r.text) + '</blockquote>' +
        '<h4>来源</h4><p>' + esc((r.file || '').replace(/^.*\//, '')) + (r.section ? ' §' + esc(r.section) : '') + '</p>' +
        '<p><span class="src-chip">来源类型：' + esc(r.sourceType || 'unknown') + '</span> <span class="src-chip">权威性：' + esc(r.authority || 'pending-confirm') + '</span></p>' +
        '<h4>关联需求与检查证据（' + evidences.length + ' 条）</h4>' +
        (evidences.length ? '<table class="mini-table"><thead><tr><th>需求</th><th>判定</th><th>证据</th></tr></thead><tbody>' +
          evidences.map(function (e) {
            return '<tr><td><a href="javascript:void(0)" data-jump-req="' + esc(e.requirementId) + '">' + esc(e.requirementId) + '</a> ' + esc(e.title) + '</td>' +
              '<td>' + stTag(e.evidenceInvalid ? 'unverified' : e.status) + '</td><td>' + esc((e.evidence || '').slice(0, 160)) + '</td></tr>'
          }).join('') + '</tbody></table>' : '<p style="color:var(--muted)">无对应需求（orphan：可能为范围外规则或待确认缺口，不直接判需求缺失）</p>') +
        '<h4>关联问题</h4>' +
        ((r.issueIds || []).length ? '<p>' + r.issueIds.map(function (id) { return '<a href="javascript:void(0)" data-jump-issue="' + esc(id) + '">' + esc(id) + '</a>' }).join('、') + '</p>' : '<p style="color:var(--muted)">无</p>')
    )
    wireEntityJumps()
  }
  function wireEntityJumps() {
    Array.prototype.forEach.call(document.querySelectorAll('#d-body [data-jump-rule]'), function (a) {
      a.addEventListener('click', function () { openRuleDrawer(a.getAttribute('data-jump-rule')) })
    })
    Array.prototype.forEach.call(document.querySelectorAll('#d-body [data-jump-req]'), function (a) {
      a.addEventListener('click', function () { openReqDrawer(a.getAttribute('data-jump-req')) })
    })
    Array.prototype.forEach.call(document.querySelectorAll('#d-body [data-jump-issue]'), function (a) {
      a.addEventListener('click', function () { openDrawer(a.getAttribute('data-jump-issue')) })
    })
  }

  // ---------- 浮动操作 ----------
  $('btn-top').addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  $('btn-print').addEventListener('click', function () { window.print(); });

  renderList();
})();
</script>
</body>
</html>
