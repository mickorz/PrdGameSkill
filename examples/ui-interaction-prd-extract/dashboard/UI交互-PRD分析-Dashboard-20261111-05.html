<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRD 质量分析报告</title>
<style>
  :root {
    --bg: #F6F8FB;
    --card: #FFFFFF;
    --primary: #3478DB;
    --p0: #DC5148;
    --p1: #E8A044;
    --p2: #4389D5;
    --p3: #94A3B8;
    --text: #253247;
    --muted: #8491A3;
    --border: #E7ECF2;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .page { max-width: 1440px; margin: 0 auto; padding: 24px 32px 48px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }
  .section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .section-title .sub { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 8px; }

  /* 01 头部 */
  .header { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header .project { font-size: 15px; color: var(--muted); margin-top: 4px; }
  .header .meta { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .header .meta span { margin-right: 20px; }
  .badge { display: inline-block; padding: 5px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .badge.blocked { background: #FDECEA; color: var(--p0); }
  .badge.allowed { background: #E8F5EC; color: #2F9E5B; }
  .badge.na { background: #EEF1F5; color: var(--muted); }

  /* 02 KPI */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
  .kpi {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px 24px; cursor: pointer; transition: box-shadow .15s, transform .15s;
  }
  .kpi:hover { box-shadow: 0 4px 14px rgba(52,120,219,.12); transform: translateY(-1px); }
  .kpi .num { font-size: 34px; font-weight: 700; line-height: 1.2; }
  .kpi .label { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .kpi .num.c-p0 { color: var(--p0); } .kpi .num.c-p1 { color: var(--p1); }
  .kpi .num.c-p23 { color: var(--text); }

  /* 03 结论 */
  .conclusion .verdict { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
  .conclusion .verdict.blocked { color: var(--p0); }
  .conclusion .verdict.allowed { color: #2F9E5B; }
  .conclusion .reasons { margin-top: 10px; padding-left: 20px; color: var(--text); }
  .conclusion .reasons li { margin: 3px 0; }

  /* 04 风险 */
  .risk-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .risk-group h3 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .risk-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .risk-item:hover { border-color: var(--primary); background: #F7FAFE; }
  .risk-item .pri { flex: none; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 4px; color: #fff; margin-top: 2px; }
  .risk-item .body { flex: 1; min-width: 0; }
  .risk-item .name { font-weight: 600; font-size: 13px; }
  .risk-item .name .id { color: var(--muted); font-weight: 400; margin-left: 6px; white-space: nowrap; }
  .risk-item .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* 05 分布图表 */
  .charts { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 24px; }
  .chart h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 12px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; padding: 3px 4px; border-radius: 6px; }
  .bar-row:hover, .bar-row.active { background: #F0F6FD; }
  .bar-row .bl { flex: none; width: 34px; font-weight: 600; font-size: 13px; }
  .bar-row .track { flex: 1; display: block; height: 18px; background: #F0F3F7; border-radius: 4px; overflow: hidden; }
  .bar-row .fill { display: block; height: 100%; border-radius: 4px; min-width: 6px; }
  .bar-row .val { flex: none; width: 96px; font-size: 12px; color: var(--muted); text-align: right; }
  .donut-wrap { display: flex; align-items: center; gap: 18px; }
  .donut { flex: none; position: relative; width: 160px; height: 160px; }
  .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut .center b { font-size: 26px; }
  .donut .center span { font-size: 11px; color: var(--muted); }
  .legend { flex: 1; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .legend-item:hover, .legend-item.active { background: #F0F6FD; }
  .legend-item .dot { flex: none; width: 10px; height: 10px; border-radius: 3px; }
  .legend-item .t { flex: 1; }
  .legend-item .v { color: var(--muted); }

  /* 06 TOP5 */
  .top-list .rank {
    display: flex; align-items: center; gap: 12px; padding: 11px 12px;
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .top-list .rank:hover { border-color: var(--primary); background: #F7FAFE; }
  .top-list .no { flex: none; width: 22px; height: 22px; border-radius: 50%; background: #EEF1F5; color: var(--muted); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .top-list .title { flex: 1; font-weight: 600; font-size: 13px; }
  .top-list .title .id { color: var(--muted); font-weight: 400; margin-right: 8px; }
  .top-list .tag { flex: none; font-size: 11px; color: var(--muted); }
  .top-list .tag .rf { margin-left: 8px; }

  /* 07 问题清单 */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .toolbar select, .toolbar input {
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
    font-size: 13px; background: #fff; color: var(--text); outline: none;
  }
  .toolbar input { width: 220px; }
  .toolbar select:focus, .toolbar input:focus { border-color: var(--primary); }
  .toolbar .count { font-size: 12px; color: var(--muted); }
  .toolbar .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border); background: #fff; color: var(--text);
    border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: #2B66C4; }
  table.issues { width: 100%; border-collapse: collapse; }
  table.issues th {
    text-align: left; font-size: 12px; color: var(--muted); font-weight: 600;
    padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.issues td { padding: 10px; border-bottom: 1px solid #F0F3F7; vertical-align: top; }
  table.issues tbody tr { cursor: pointer; }
  table.issues tbody tr:hover { background: #F7FAFE; }
  td.id, .pri-tag { font-family: "SF Mono", Consolas, monospace; }
  td.id { color: var(--muted); font-size: 12px; white-space: nowrap; }
  td.title { font-weight: 600; max-width: 460px; }
  td.loc { color: var(--muted); font-size: 12px; max-width: 220px; }
  .pri-tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 4px; color: #fff; }
  .type-tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 4px; background: #EEF1F5; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }

  /* 08 综合分析 */
  .analysis ul { padding-left: 20px; }
  .analysis li { margin: 6px 0; }

  /* 抽屉 */
  .mask { position: fixed; inset: 0; background: rgba(20,30,45,.4); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
  .mask.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: -520px; width: 520px; max-width: 100vw; height: 100vh;
    background: #fff; z-index: 50; box-shadow: -8px 0 30px rgba(20,30,45,.15);
    transition: right .25s ease; display: flex; flex-direction: column;
  }
  .drawer.show { right: 0; }
  .drawer-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .drawer-head .id { font-family: monospace; color: var(--muted); font-size: 13px; }
  .drawer-head .title { font-weight: 700; font-size: 15px; flex: 1; }
  .drawer-head .close { border: none; background: none; font-size: 20px; color: var(--muted); cursor: pointer; padding: 4px; }
  .drawer-nav { display: flex; align-items: center; gap: 8px; padding: 8px 20px; border-bottom: 1px solid var(--border); }
  .drawer-nav .pos { font-size: 12px; color: var(--muted); flex: 1; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
  .drawer-body h4 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 18px 0 6px; }
  .drawer-body h4:first-child { margin-top: 0; }
  .drawer-body h5 { font-size: 13px; font-weight: 700; margin: 14px 0 6px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .drawer-body blockquote {
    border-left: 3px solid var(--border); background: #F8FAFC;
    padding: 10px 14px; border-radius: 0 8px 8px 0; white-space: pre-wrap; font-size: 13px; color: #47586E;
  }
  .drawer-body .mini-table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 12px; display: table; }
  .drawer-body .mini-table th, .drawer-body .mini-table td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
  .drawer-body .mini-table th { background: #F6F8FB; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .drawer-body p { font-size: 13px; }
  .drawer-body .status { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--muted); }
  .drawer-body .kv { margin-bottom: 10px; }

  /* 浮动操作 */
  .fab { position: fixed; right: 28px; bottom: 28px; display: flex; flex-direction: column; gap: 10px; z-index: 30; }
  .fab .btn { box-shadow: 0 4px 14px rgba(20,30,45,.12); }

  /* 响应式 */
  @media (max-width: 1180px) {
    .charts { grid-template-columns: 1fr; }
    .risk-cols { grid-template-columns: 1fr; }
  }
  @media (max-width: 1024px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .page { padding: 16px 20px 40px; }
  }
  @media (max-width: 768px) {
    .kpis { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card { padding: 16px; }
    .toolbar input { width: 100%; }
    .toolbar { gap: 8px; }
    /* 表格转卡片 */
    table.issues, table.issues tbody, table.issues tr, table.issues td { display: block; width: 100%; }
    table.issues thead { display: none; }
    table.issues tbody tr { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; padding: 10px; }
    table.issues tbody td { border: none; padding: 2px 0; }
    td.id { display: inline-block; }
    /* 抽屉全屏 */
    .drawer { width: 100vw; right: -100vw; }
    .fab { right: 16px; bottom: 16px; }
  }

  /* 打印 */
  @media print {
    body { background: #fff; }
    .page { max-width: none; padding: 0; }
    .card { border: none; box-shadow: none; break-inside: avoid; padding: 12px 0; margin-bottom: 12px; }
    .toolbar, .fab, .mask, .drawer, .kpi .label-tip { display: none !important; }
    .kpi { border: 1px solid #ddd; }
    .kpi:hover { transform: none; box-shadow: none; }
    .top-list .rank, .risk-item, table.issues tbody tr { break-inside: avoid; cursor: default; }
    table.issues tbody tr:hover { background: none; }
    a { text-decoration: none; color: inherit; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- 01 报告头部 -->
  <header class="card header" id="sec-header"></header>

  <!-- 02 质量指标 -->
  <section class="kpis" id="sec-kpis"></section>

  <!-- 03 检查结论 -->
  <section class="card conclusion" id="sec-conclusion"></section>

  <!-- 04 风险分析 -->
  <section class="card" id="sec-risks"></section>

  <!-- 05 问题分布 -->
  <section class="card charts" id="sec-charts"></section>

  <!-- 06 重点问题 TOP5 -->
  <section class="card" id="sec-top"></section>

  <!-- 07 完整问题清单 -->
  <section class="card" id="sec-list">
    <div class="section-title">完整问题清单<span class="sub" id="list-count"></span></div>
    <div class="toolbar" id="toolbar">
      <select id="f-priority">
        <option value="">全部优先级</option>
        <option value="P0">P0</option><option value="P1">P1</option>
        <option value="P2">P2</option><option value="P3">P3</option>
      </select>
      <select id="f-type"><option value="">全部类型</option></select>
      <select id="f-dimension"><option value="">全部维度</option></select>
      <select id="f-module"><option value="">全部模块</option></select>
      <input id="f-q" type="search" placeholder="搜索 ID / 问题 / 位置">
      <button class="btn" id="btn-clear">清除筛选</button>
      <span class="spacer"></span>
      <span class="count" id="f-count"></span>
    </div>
    <div style="overflow-x:auto">
      <table class="issues">
        <thead><tr><th>ID</th><th>问题标题</th><th>优先级</th><th>类型</th><th>维度</th><th>原文位置</th></tr></thead>
        <tbody id="issue-tbody"></tbody>
      </table>
      <div class="empty" id="issue-empty" style="display:none">没有符合筛选条件的问题</div>
    </div>
  </section>

  <!-- 08 综合分析 -->
  <section class="card analysis" id="sec-analysis"></section>

</div>

<!-- 详情抽屉 -->
<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <span class="pri-tag" id="d-pri"></span>
    <span class="id" id="d-id"></span>
    <div class="title" id="d-title"></div>
    <button class="close" id="d-close" title="关闭">x</button>
  </div>
  <div class="drawer-nav">
    <button class="btn" id="d-prev">上一条</button>
    <button class="btn" id="d-next">下一条</button>
    <span class="pos" id="d-pos"></span>
  </div>
  <div class="drawer-body" id="d-body"></div>
</aside>

<!-- 浮动操作 -->
<div class="fab">
  <button class="btn" id="btn-top" title="返回顶部">返回顶部</button>
  <button class="btn primary" id="btn-print" title="打印 / 导出 PDF">打印 / PDF</button>
</div>

\"无任何场景恢复描述。","problem":"需求只定义了断线图标与计时，未定义断线玩家重连后如何恢复牌局：恢复哪些内容、按什么顺序、恢复期间动画是否静默、他人手牌是否翻开、倒计时以什么为基准、权限按钮如何还原、最后出牌放大是否补显。","impact":"好友房 8 局对局时长内断线必然发生；无恢复规格则该场景无法开发与验收，服务端 end_wait 应答缺失还会导致整桌卡死。","suggestion":"新增\"断线重连与场景恢复\"章节：恢复入口与状态分发、恢复顺序、静默模式（不播开局/摸牌/胡牌动画）、他人手牌背面、权限/倒计时/方位灯/出牌放大补刷、end_wait 自动应答；可直接以基准 04#1~#16 为对照逐条声明采纳或改版。","status":"待确认","has_detail":true,"acceptance":"行牌中断线重连后，本家手牌/河牌/牌墙/剩余数/权限按钮/倒计时/方位灯与断线前一致，他人手牌保持背面，最后出牌放大补显；开局/发牌/洗牌阶段断线重连各有定义的恢复表现。"},{"id":"Q02","title":"杠操作按钮组与加杠/暗杠触发交互完全未定义","priority":"P0","type":"需求缺失","module":["吃碰杠胡-杠"],"dimension":"UI 交互","source_location":"吃碰杠胡操作-杠牌","rule_ref":"01#3 操作区控制器页面状态（碰杠胡态/选择多杠态）；01#9 杠单组合直接发送、多组合进入选择多杠态显示牌面列表、多杠态点取消=同时执行过。","original_text":"位置\"三、对局流程 → 局内流程 → 吃碰杠胡操作 → 杠牌\"。引文（全文）：\"杠牌-复用现有血战杠的特效，主要区别删除刮风下雨，无论什么杠，统一使用杠字即可\"。","problem":"未定义：他人弃牌可直杠时是否显示【杠】+【过】按钮组及位置；本人出牌阶段加杠、暗杠的触发方式（点击手牌第 4 张弹选项？按钮？）；多种杠组合并存时的选择交互；杠按钮与过按钮的互斥/收起规则。\"复用血战杠的特效\"仅指动画特效，不构成按钮交互规格。","impact":"杠是本期启用的高频核心操作（含吃碰当前回合可杠），无入口定义无法开发与验收；暗杠 3 背 1 正的展示虽有玩法描述，但玩家如何发起暗杠无解。","suggestion":"补充杠操作小节：直杠按钮组（样式/位置/与碰胡并存时的排布）、加杠与暗杠的出牌阶段触发交互、多杠组合选择列表、选择态取消=过的行为。","status":"待确认","has_detail":true,"acceptance":"可直杠时出现杠按钮且点击后弃牌入副露并补牌；出牌阶段可按定义的交互完成加杠/暗杠；多种杠并存时出现选择列表，取消等同过。"},{"id":"Q03","title":"单击出牌前后矛盾","priority":"P1","type":"内容冲突","module":["行牌操作-出牌"],"dimension":"UI 交互","source_location":"行牌操作-出牌 / 修改对比版-出牌","rule_ref":"01#12 三种出牌方式均为设置项控制（单击直接出需设置开启）；01#13 打听牌禁止单击直接打出。","original_text":"位置一\"局内流程 → 行牌操作 → 出牌（前表）\"。引文：\"单击出牌：出牌阶段点击打出不可听牌的牌，则直接将其打出，无需提起。单机出牌开启时，若轮到自己出牌前有牌提起，则自动下落。\"位置二\"行牌操作｜修改对比版 → 出牌\"。引文：\"本方案默认双击出牌。滑动出牌默认开。单击出牌归设置模块，本方案不包含该模式。\"","problem":"前文将单击出牌作为本期可选出牌方式给出完整交互定义（含自动下落细节），后文明确\"本方案不包含该模式\"，范围互相矛盾；另\"单击仅限不可听牌\"的限制依附于被排除的模式，本期双击/滑动模式下可听牌能否滑动直接打出也未说明（基准 01#13 要求打听牌强制先提牌查看听牌信息）。","impact":"开发无法确定单击出牌是否在交付范围；可听牌的滑动出牌限制缺失可能导致绕过听牌提示交互。","suggestion":"删除或标注前文单击出牌段落为\"原方案对照\"；补充说明本期双击/滑动模式下可听牌是否允许滑动直接打出（基准要求禁止单击直接打出、须先提牌）。","status":"待确认","has_detail":true,"acceptance":"全文仅存在一种口径；滑动出牌对可听牌的限制有明确结论。"},{"id":"Q04","title":"\"多操作状态\"章节空引用","priority":"P1","type":"描述不完整","module":["吃碰杠胡"],"dimension":"UI 交互","source_location":"吃碰杠胡操作-多操作状态","rule_ref":"01#3 操作区按权限组合切换页面状态；01#4 他人收到权限时自己操作区直接收起（关按钮区、锁手牌、清提示）；01#25 操作区收起的统一时机。","original_text":"位置\"三、对局流程 → 局内流程 → 吃碰杠胡操作 → 多操作状态-复用功夫川麻\"。引文：仅有标题\"多操作状态-复用功夫川麻\"，其后直接进入\"对局内通用提示\"，无正文。","problem":"同一弃牌多人可响应（庄闲放铳下多人可胡、胡与碰并存）是本期规则明确支持的裁决场景，但各端按钮如何同时展示、裁决后未获权玩家的按钮如何收起、操作区互斥规则全部缺失，仅以外部项目名\"功夫川麻\"代替。","impact":"多人响应是常见分支，按钮残留/误操作风险高，无法验收。","suggestion":"补写多操作状态：各端按钮同时展示规则、他人权限到达时本家操作区立即收起、裁决完成后按钮区与方位高亮的联动切换。","status":"待确认","has_detail":true,"acceptance":"两人同时收到按钮时各自界面按钮正常；一方胡/碰成立后另一方按钮立即消失且手牌恢复可操作态。"},{"id":"Q05","title":"满 8 局\"结束本场\"的表现未定义","priority":"P1","type":"描述不完整","module":["结算流程"],"dimension":"UI 交互","source_location":"本期开发范围","rule_ref":"03#17 大结算数据组装（总局数/起止时间/总分/明细）；03#18 大结算弹出时机（动画链第 4 步延迟 2 秒/解散局直出）；03#19 收到大结算事件后小结算强制切\"最后一局\"页；03#14 最后一局继续按钮转弹大结算。","original_text":"位置\"本期开发范围\"。引文：\"每小局保留小结算，未满8局则继续下一小局，满8局结束本场。\"\"本期只做游戏内核心流程。原文中的创房面板、其他玩法选项、大结算和非核心桌面功能，如在核心段落中被引用，仅作原文上下文。\"","problem":"固定 8 局是本期规则，第 8 局小结算后玩家看到什么（大结算不做）未定义：直接解散回大厅？停留小结算？还是简化总分页？第 8 局小结算的\"继续游戏\"按钮行为也随之下落空。","impact":"8 局打完是必现场景，终点表现缺失导致整场流程无法走通验收。","suggestion":"明示第 8 局结束本场的表现（即使简化，也应定义：显示汇总分或直接回房间/解散），并定义最后一局小结算按钮文案与行为。","status":"待确认","has_detail":true,"acceptance":"第 8 局小结算操作后有明确定义的结束表现，玩家可离开对局且房间状态可预期。"},{"id":"Q06","title":"倒计时末 3 秒颜色与基准冲突（需求黄/基准红）","priority":"P2","type":"内容冲突","module":["方位信息-倒计时"],"dimension":"UI 交互","source_location":"方位信息-倒计时","rule_ref":"07#2 配色：>3 秒默认蓝色，最后 3 秒切红色字体，自己回合且未自动胡时播倒计时音效；01#20 倒计时：中央数字逐秒倒数，最后 3 秒切红色字体，自己回合且未自动胡时播倒计时音效，>999 不显示，复盘模式不显示。","original_text":"位置\"三、对局流程 → 局中信息 → 方位信息 → 倒计时\"。引文：\"中央用两位数字显示当前阶段剩余秒数，按秒递减，普通数字为蓝青色，03、02、01、00为黄色。阶段开始时按该阶段配置的时间起始秒数刷新\"","problem":"需求定义 03、02、01、00 共 4 个值切黄色，基准为最后 3 秒切红色，颜色与切换边界双重冲突。","impact":"开发与验收无统一配色口径，按需求实现会与现网录屏对照不一致，被误判为实现缺陷。","suggestion":"明确末段颜色（黄或红）与切色边界（从 03 还是 02 起），若有意改版需声明\"与现网实现差异\"。","status":"待确认","has_detail":true,"acceptance":"倒计时末段配色与切换时点全文只有一种口径。"},{"id":"Q07","title":"同牌点多张的标签标记位置与基准冲突（最右 vs 第一张）","priority":"P2","type":"内容冲突","module":["手牌信息-听牌标签"],"dimension":"UI 交互","source_location":"听牌标签显示规则-多/大","rule_ref":"02#6 打听箭头显示在手牌上（同牌值只标第一张），带听型样式（普通/大/多/优）；出牌后仍保留有效箭头。","original_text":"位置\"三、对局流程 → 局中信息 → 手牌信息 → 听牌标签显示规则\"。\"多\"条目引文：\"同一个牌点有多张，则最右侧的牌显示'多'。\"。\"大\"条目引文：\"同一个牌点有多张，则最右侧的牌显示'大'。\"","problem":"需求规定同牌点多张时仅最右侧一张显示'多'/'大'标签，基准实现为同牌值只标第一张，标记位置相反。","impact":"按任一口径实现都会与另一口径冲突，与现网对照验收必有一处不符。","suggestion":"确认目标口径（最右侧或第一张）并全文统一，若维持'最右侧'需声明与现网实现的差异。","status":"待确认","has_detail":true,"acceptance":"同牌点多张时标签标记位置全文只有一种结论。"},{"id":"Q08","title":"平庄庄标样式两处矛盾（【庄】vs【庄×1】）","priority":"P2","type":"内容冲突","module":["玩家头像-庄标"],"dimension":"UI 交互","source_location":"玩家头像信息 / 定庄","rule_ref":"07#9 庄标：庄家头像显示庄标（控制器切页），重置全隐藏；换庄切到新庄家头像。","original_text":"位置一\"局中信息 → 玩家头像信息 → 庄家标签\"。引文：\"根据规则庄有3种样式：平庄：显示【庄】；庄二：显示【庄×2】；庄三：显示【庄×3】\"。位置二\"局内流程 → 定庄 → UI及动画\"。引文：\"三档样式。平庄（一牢）显示「庄×1」，庄二（二牢）显示「庄×2」，庄三（三牢）显示「庄×3」。\"","problem":"玩家头像信息章节平庄显示【庄】，定庄章节平庄显示「庄×1」，同一三档体系两处口径不同，平庄庄标文案无法确定。","impact":"庄标文案实现只能二选一，验收时必有一处不通过。","suggestion":"统一平庄庄标样式（【庄】或【庄×1】），并声明与基准'庄家展示样式归玩法规则、UI 侧按倍数文案展示'口径的关系。","status":"待确认","has_detail":true,"acceptance":"全文平庄庄标样式只有一种写法。"},{"id":"Q09","title":"番型是否展示倍数自相矛盾（删除线 vs 示例含倍数）","priority":"P2","type":"内容冲突","module":["小结算界面"],"dimension":"UI 交互","source_location":"小结算界面-赢家结算","rule_ref":"03#12 小结算界面每家显示：头像昵称、方位、分数（正负字体区分，大数字格式）、庄标、胡牌单放牌、组合牌（杠 4 张页/暗杠背面）、手牌列表、胡型、叫嘴标识、流水汇总与总番。","original_text":"位置\"结算界面 → 小结算界面（好友房）→ UI交互以及说明 → 赢家结算\"。引文：\"展示本局胡牌番型~~和倍数~~\"（\"和倍数\"带删除线标记）；引文：\"比如：二连杠二财飘，在结算上显示的是：杠飘\\*32（二连杠，双财飘）\"","problem":"正文将'和倍数'加删除线表示番型不展示倍数，复合番型示例'杠飘\\*32'却含倍数，番型区是否渲染倍数两种口径并存。","impact":"开发无法确定番型区是否带倍数文案，验收口径不成立。","suggestion":"明确番型是否带倍数（全部不带，或复合番型带'名称×倍数'），修订规则或示例使口径唯一。","status":"待确认","has_detail":true,"acceptance":"番型倍数展示规则全文只有一种口径，示例与规则一致。"},{"id":"Q10","title":"准备状态切换交互缺失，\"默认准备\"与未准备态矛盾","priority":"P2","type":"定义歧义","module":["桌面布局-准备"],"dimension":"UI 交互","source_location":"对局前-准备信息","rule_ref":"06#一 界面清单：玩家头像层（常驻 Base·Player，好友房创建）职责含头像/庄标/准备标识/权限光圈。","original_text":"位置\"三、对局流程 → 桌面布局 → 对局前 → 准备信息\"。引文：\"未准备时显示'未准备'；准备后显示'已准备'；房主默认准备；首次进入房间的其他玩家默认准备。\"\"已入座的玩家显示准备状态，空座显示「＋」占位。\"\"本期须坐满4人且4人均为「已准备」，此时仅房主显示并可点击「开始游戏」，其他玩家等待房主开局。\"","problem":"房主与首次进入的玩家均'默认准备'，则'未准备'状态在何种场景出现、玩家能否取消准备、取消后如何再次准备（点击切换还是按钮）均未定义；若人人默认准备，未准备态与切换交互形同虚设。","impact":"准备/取消准备的交互无法开发，'开始游戏'按钮的可用条件难以验收。","suggestion":"明确默认准备的范围与例外（换人、重进房间后是否保持已准备）、取消与恢复准备的操作方式及入口。","status":"待确认\n\n---","has_detail":true,"acceptance":"任一玩家从'未准备'到'已准备'再到开局的全链路有唯一可执行的交互定义。"},{"id":"Q11","title":"手牌标注体系不完整（典型 P2 之一）","priority":"P2","type":"描述不完整","module":["手牌信息"],"dimension":"UI 交互","source_location":"手牌信息 / 吃碰杠胡","rule_ref":"01#15 有碰或杠权限且无胡权限时除目标牌外整手置灰，有胡权限清灰；01#16 置灰颜色优先级 黄 > 灰 > 财神红 > 正常；01#17 置灰清除时机（点碰/杠/过、收操作区、他人权限到达）；07#12 手牌癞子角标按配置牌表设置黄色角标。","original_text":"位置\"吃碰杠胡操作 → 碰牌-复用\"。引文：\"手牌中可碰牌高亮其他暗置，如果有胡则不需要暗置\"；\"吃碰杠胡操作 → 杠牌\"仅有特效一句话；手牌信息章节无财神角标描述（仅小结算提到\"手牌里的财神也有需要染色\"）。","problem":"a) 权限为杠（含直杠/加杠/暗杠候选）时手牌哪些牌置灰/高亮未描述；b) 置灰何时清除（出牌后、点过、他人权限到达）未描述；c) 局内手牌财神无角标/染色定义，玩家无法识别手中哪张是白板财神；d) 胡权限与碰/杠权限并存时的置灰豁免仅一句\"如果有胡则不需要暗置\"，与基准的清灰口径需确认一致。","impact":"手牌状态表达不一致会导致误出牌与验收争议；财神不可见直接影响白板财神玩法的可玩性。","suggestion":"补齐杠权限置灰规则、置灰清除三时机、局内手牌财神角标（样式/位置），并声明与基准四色优先级（黄>灰>财神红>正常）是否一致。","status":"待确认","has_detail":true,"acceptance":"碰/杠/吃权限下置灰范围符合定义；出牌或点过后置灰清除；手牌财神有可见标识。"},{"id":"Q12","title":"听牌提示体系不完整（典型 P2 之二）","priority":"P2","type":"描述不完整","module":["手牌信息-听牌"],"dimension":"UI 交互","source_location":"手牌信息-听牌标签 / 提牌","rule_ref":"02#8 常驻听牌组件含查听按钮，显示条件为有已听牌数据且自己未胡，及成套显隐时机；02#9 弹窗每项=牌面+倍数+剩余张数、番数降序+牌值升序、剩余 0 张置灰、总张数+封顶文案；02#10 弹窗两入口（查听按钮重复点击切换/提牌自动弹）；02#11 弹窗关闭时机（摸牌、可胡、自己胡、流局摊牌、点桌面等）；02#5 自己胡后听牌数据清空、清箭头；02#6 出牌后仍保留有效箭头。","original_text":"位置\"手牌信息 → 听牌标签显示规则\"与\"行牌操作｜修改对比版 → 提牌\"。引文：\"提起候选牌时，面板显示该牌打出后可胡的牌面及各自剩余张数。改提另一张候选牌时更新面板。取消提牌、改选非候选牌或实际出牌后收起面板。\"","problem":"a) 无查听按钮，已听牌玩家无法主动查看全局听牌；b) 弹窗缺倍数列、排序规则、剩余 0 张置灰、总张数与封顶文案（本期无封顶时的文案）；c) 弹窗/箭头的关闭与保留时机只写了三条（取消提牌/改选/出牌），摸牌、获得胡权限、自己胡、流局、点桌面空白均未定义；d) 听牌箭头出牌后是否保留未定义。","impact":"听牌提示是牌手核心决策辅助，入口与生命周期残缺会直接造成交互回退或状态残留。","suggestion":"按基准 02#8~#11 补齐：查听按钮显隐时机、弹窗信息结构（含无封顶文案）、关闭时机清单、箭头出牌后保留与胡后清除。","status":"待确认","has_detail":true,"acceptance":"已听牌可见查听入口；弹窗含牌面/倍数/剩余数且 0 张置灰；摸牌、胡牌、流局等各时点弹窗与箭头状态符合清单。"},{"id":"Q13","title":"有胡权限期间点击手牌的拦截与\"点过才能出牌\"轻提示缺失","priority":"P2","type":"需求缺失","module":["吃碰杠胡-胡"],"dimension":"UI 交互","source_location":"胡牌-交互说明","rule_ref":"01#7 硬互斥：有胡权限且操作区在展示态时，任何出牌尝试（单击/双击/滑动）都被拦截，必须先点过；提示\"点'过'才能出牌\"3 秒；06#二 弹层清单：轻提示（有胡权限点手牌\"点过才能出牌\"/玩家回归，3 秒自动关闭）。","original_text":"位置\"局内流程 → 吃碰杠胡操作 → 胡牌\"。动画效果列引文：\"此环节不可直接出牌\"（全文仅此一处涉及出牌限制）；交互说明引文：\"自摸：点击【自摸】按钮完成对应操作，点击【过】则放弃此次操作。\"\"点炮、抢杠胡：点击【胡】按钮完成对应操作，点击【过】则放弃此次操作。\"","problem":"需求只写了胡牌动画环节'不可直接出牌'，未定义有胡权限期间点击手牌的拦截行为、提示文案、展示时长与消失条件。","impact":"有胡权限时误触手牌的表现未定义，玩家可能误出牌或点击无任何反馈。","suggestion":"补写：有胡权限时单击/双击/滑动手牌均被拦截，弹'点过才能出牌'轻提示，3 秒自动消失。","status":"待确认","has_detail":true,"acceptance":"有胡权限期间任意出牌手势均被拦截且出现定义的轻提示，点过后恢复出牌。"},{"id":"Q14","title":"操作按钮组的显示/收起时机未定义","priority":"P2","type":"描述不完整","module":["吃碰杠胡"],"dimension":"UI 交互","source_location":"吃碰杠胡操作（全文）","rule_ref":"01#4 他人收到权限时自己操作区直接收起（关按钮区、锁手牌、清提示）；01#25 自己出牌后、碰/杠确认回包、胡牌回包、流局、托管——五类事件统一收操作区。","original_text":"位置\"局内流程 → 吃碰杠胡操作（全文）\"。碰牌引文：\"玩家手牌右上方显示操作按钮：【碰】+【过】\"；胡牌引文：\"玩家手牌右上方显示操作按钮：【自摸】+【过】。\"\"玩家手牌右上方显示操作按钮：【胡】+【过】\"；吃牌引文：\"玩家手牌右上方显示操作按钮：【吃】+【过】\"。全文无按钮收起时机的描述。","problem":"按钮何时收起（自己出牌后、操作回包后、流局、他人权限到达）全部缺失，多权限并存时按钮组的互斥与排布规则也未定义。","impact":"按钮残留是多人响应场景最常见缺陷，无收起时机定义则无法开发与验收。","suggestion":"补写按钮组收起时机清单（对齐基准五类事件与'他人权限到达立即收起'），并定义多权限并存时的按钮排布。","status":"待确认","has_detail":true,"acceptance":"每种按钮组从出现到消失的全部触发点均有定义。"},{"id":"Q15","title":"吃多组合选择交互未定义","priority":"P2","type":"描述不完整","module":["吃碰杠胡-吃"],"dimension":"UI 交互","source_location":"玩法规则-吃","rule_ref":"01#9 杠单组合 vs 多组合：仅一种杠直接发送；多于一种先进入选择多杠态显示牌面列表，点列表项确认后发送；多杠态下点取消 = 同时执行过。","original_text":"位置\"二、功能详情 → 玩法规则 → 吃\"。引文：\"上家刚打出的1张非财神牌，与玩家手中的2张非财神牌可组成同花色、点数连续的顺子时，玩家可以选择吃；存在多种合法组合时，选择其中1组。\"位置\"局内流程 → 吃碰杠胡操作 → 吃牌\"仅有按钮定义：\"玩家手牌右上方显示操作按钮：【吃】+【过】\"\"点击【吃】按钮完成对应操作，点击【过】则放弃此次操作\"。","problem":"玩法规则写明吃'存在多种合法组合时，选择其中1组'，但吃牌章节只有【吃】+【过】两个按钮，多种组合如何列出、如何选定、能否反悔均未定义（基准中多组合有专门的选择列表态）。","impact":"手持多种吃组合是常见场景（如 3、4、6、7 条吃 5 条），无选择交互则功能不可用。","suggestion":"补写吃多组合选择交互：进入选择态显示组合牌面列表、点选确认发送、取消等同过。","status":"待确认","has_detail":true,"acceptance":"手持多种吃组合时出现定义的选择列表，选定后副露正确，取消等同过。"},{"id":"Q16","title":"多种杠组合的选择列表交互未定义","priority":"P2","type":"需求缺失","module":["吃碰杠胡-杠"],"dimension":"UI 交互","source_location":"杠牌（仅特效一句话）","rule_ref":"01#9 杠单组合 vs 多组合：仅一种杠直接发送；多于一种先进入选择多杠态显示牌面列表，点列表项确认后发送；多杠态下点取消 = 同时执行过（发 sendCancel）。","original_text":"位置\"局内流程 → 吃碰杠胡操作 → 杠牌\"。引文（全文）：\"杠牌-复用现有血战杠的特效，主要区别删除刮风下雨，无论什么杠，统一使用杠字即可\"","problem":"需求未定义：点【杠】后存在多种杠组合时是否进入选择态、列表如何展示牌面、如何确认、取消行为；'统一使用杠字'只覆盖动效，不覆盖选择交互。","impact":"多种杠组合并存时玩家无法完成选择，杠功能不可用。","suggestion":"按基准补写选择多杠态：多组合显示牌面列表、点选确认后发送、点取消=同时执行过。","status":"待确认","has_detail":true,"acceptance":"多种杠组合时出现选择列表，确认后发送正确组合，取消等同过。"},{"id":"Q17","title":"局终演出链顺序与桌面摊牌表现未定义（仅\"参考功夫川麻\"）","priority":"P2","type":"描述不完整","module":["结算流程"],"dimension":"UI 交互","source_location":"结算流程-流程明细","rule_ref":"03#1 局终主入口按固定顺序执行：收操作区 → 隐藏出牌放大 → 摊牌前置处理 → 各家胡牌态 → 四步动画链（①点炮/一炮多响动画+赢家番型动画 → ②摊牌+台面标识，每步停留 1.5 秒 → ③小结算 → ④大结算）；03#4 摊牌：所有有手牌的玩家手牌推倒，胡家手牌末张落地图，自己手牌右移缩小；完成后延迟 1 秒发应答推进流程。","original_text":"位置\"三、对局流程 → 结算流程 → 流程明细\"。胡牌场景引文：\"触发操作：对局中有玩家胡牌，根据玩家的番型播放对应番型特效\"\"参考功夫川麻的胡牌流程即可\"（备注列：\"与功夫川麻保持一致\"）；对局结果阶段引文：\"前置条件：对局结束后，可以是出现流局，对局结束，也可以是播放完胡牌番型后，展示本局所有玩家的分数\"（备注列：\"同步老包\"）。","problem":"从胡牌确认到小结算之间的演出顺序（收操作区、隐藏放大、摊牌方式、台面标识、飘分）与每步时长全部未定义，'参考功夫川麻/同步老包'无对照物。","impact":"局终演出是每局必播链路，无顺序定义则各端表现不一致且无法验收。","suggestion":"以基准 03#1/#4 为对照逐条声明采纳或改版：固定演出顺序、摊牌表现、每步停留时长、飘分完成后进小结算。","status":"待确认","has_detail":true,"acceptance":"胡牌后到小结算出现之间的每一步演出有顺序、内容与时长定义。"},{"id":"Q18","title":"流局结算表现未定义（荒牌页、摊牌、输赢文案）","priority":"P2","type":"描述不完整","module":["结算流程"],"dimension":"UI 交互","source_location":"结算流程-流程明细","rule_ref":"03#2 流局路径：摊牌 → 隐藏听牌按钮/听牌弹窗/出牌放大 → 收操作区 → 倒计时与方位光熄灭 → 结束类型切\"荒牌\"页。","original_text":"位置\"三、对局流程 → 结算流程 → 流程明细\"。引文：\"前置条件：对局结束后，可以是出现流局，对局结束，也可以是播放完胡牌番型后，展示本局所有玩家的分数\"（备注列：\"同步老包\"）。全文无流局专属表现描述；位置\"结算界面 → 小结算界面 → 输赢显示\"引文：\"赢了显示'恭喜获胜'\"\"输了显示'遗憾失败'\"。","problem":"流局时是否摊牌、听牌/放大等元素如何清理、倒计时与方位光是否熄灭、'荒牌'结束类型页如何展示、小结算输赢文案在无输赢的流局下显示什么，均未定义。","impact":"流局每场必现（规则固定余 20 张流局），表现缺失导致该分支无法开发与验收。","suggestion":"补写流局演出链（对齐基准 03#2）：摊牌、隐藏项清单、倒计时熄灭、荒牌页样式、流局时小结算输赢文案口径。","status":"待确认","has_detail":true,"acceptance":"流局后桌面向荒牌页过渡的每一步有定义，小结算输赢文案在流局下有唯一表现。"},{"id":"Q19","title":"小结算流水明细（文字结算）内容与格式未定义","priority":"P2","type":"描述不完整","module":["小结算界面"],"dimension":"UI 交互","source_location":"小结算界面","rule_ref":"03#10 小结算数据含额外流水，流水文案格式\"动作(番名)[方位] ±N分\"，按人数生成方位文案（本家/上家/下家/对家）；03#12 小结算界面每家显示：头像昵称、方位、分数（正负字体区分，大数字格式）、庄标、胡牌单放牌、组合牌（杠 4 张页/暗杠背面）、手牌列表、胡型、叫嘴标识、流水汇总与总番。","original_text":"位置\"结算界面 → 小结算界面（好友房）→ UI交互以及说明\"。赢家结算引文：\"承包有单独的样式，但是文字结算也要体现出来\"\"牢庄不需要展示\"。八个编号项（玩家信息/手牌摆布/输赢显示/分数结算/承包的标识/赢家结算/麻将牌标识/财神牌）之外无流水明细描述。","problem":"文字结算（流水）显示哪些动作、番名、方位、分值，按什么格式拼装，是否显示流水汇总与总番，均未定义；承包在文字结算中如何体现也只说'要体现出来'。","impact":"流水是玩家核对分数的唯一依据，无格式定义则开发随意拼装，验收无据。","suggestion":"补写流水条目结构（动作/番名/方位/±分）与汇总总番展示，明确承包、复合番型在流水中的文案格式。","status":"待确认","has_detail":true,"acceptance":"任意一局小结算的每行流水可按定义格式逐项核对且总分一致。"},{"id":"Q20","title":"小结算继续/关闭交互与下一局衔接未定义（典型 P2 之三）","priority":"P2","type":"需求缺失","module":["小结算界面"],"dimension":"UI 交互","source_location":"小结算界面（全文）","rule_ref":"03#14 继续游戏按钮：最后一局转大结算，否则关小结算+自动准备下一局；03#15 关闭按钮：好友房直接关；03#18 小结算为动画链第 3 步、大结算第 4 步的先后关系。","original_text":"位置\"结算界面 → 小结算界面（好友房）\"。引文：触发逻辑仅\"播完胡牌结算流程，进入结算界面\"；UI 交互说明仅列玩家信息、手牌摆布、输赢显示、分数结算、承包标识、赢家结算、麻将牌标识、财神牌八项，无任何按钮。","problem":"未定义：小结算上的按钮集合（继续/关闭）；单人点击即关还是全员确认才开下一局；点击后到下一局摇骰的过渡；与 Q05 的第 8 局终点衔接。","impact":"局与局之间无法推进，好友房多人场景下\"谁点了才算数\"无标准会产生流程挂起或抢开。","suggestion":"定义按钮组与多端确认规则（建议沿用基准：继续=关小结算并进入下一局准备，全员确认或房主开局的口径需明确），并与 Q05 一并给出第 8 局分支。","status":"待确认","has_detail":true,"acceptance":"任意一局小结算后按定义操作可稳定进入下一局；第 8 局走 Q05 定义分支。"},{"id":"Q21","title":"牌墙视觉布局与更新规则未定义","priority":"P2","type":"描述不完整","module":["玩法信息"],"dimension":"UI 交互","source_location":"局中信息（仅\"刷新牌墙\"字样）","rule_ref":"07#7 剩余牌数组件挂在返回按钮栏，更新时机：发牌后、每次抓牌后，重置时隐藏；07#8 牌墙显示开关按玩家设置，牌墙按骰子和的奇偶推算哪边多一墩；08#8 牌墙：按骰子结果推算哪边多一墩，显示开关按玩家设置；08#9 发牌动画同时牌墙逐张消失（每张 0.25 秒）+ 发牌音效。","original_text":"位置\"局内流程 → 行牌操作｜修改对比版 → 摸牌\"。引文：\"按行牌顺序轮到的玩家从牌墙顺时针取1张。取牌后刷新各视角的牌墙与余牌数。\"位置\"局内流程 → 发牌\"。引文：\"发完庄家14张，三名闲家各13张，共发53张，牌墙余83张。\"全文无牌墙的布局样式与消牌动画描述。","problem":"需求未定义：牌墙的摆放位置与墩数排布、按骰子推算哪边多一墩、显示开关、发牌/摸牌/杠补牌时牌墙如何逐张消减，仅文字要求'刷新各视角的牌墙'。","impact":"牌墙是行牌可视锚点，无布局与消牌规则则各端表现不一致，牌墙与余牌数对不上。","suggestion":"补写牌墙布局（位置、排布）、骰子推算规则、显示开关，以及发牌逐张消失（含节奏）与摸牌/杠后消张规则。","status":"待确认","has_detail":true,"acceptance":"任意时点牌墙剩余墩张与余牌数一致，发牌与摸牌后牌墙表现符合定义。"},{"id":"Q22","title":"财神指示牌 UI 为新增功能，建议补\"与现网实现差异说明\"","priority":"P3","type":"需求缺失","module":["玩法信息-财神"],"dimension":"UI 交互","source_location":"玩法信息-财神 / 定财神","rule_ref":"07#12 现网客户端无财神指示牌视图与翻财神动画（财神命令无处理类，仅数据字段留存），手牌癞子角标按配置牌表设置黄色角标；07#13 需求文档若定义中央财神指示牌/翻财神动画（如杭麻需求的\"白板财神指示牌\"），属新需求：记 P3 差异说明，提示标注\"与现网实现差异\"。","original_text":"位置\"局中信息 → 玩法信息 → 财神\"。引文：\"每小局掷骰动画开始时，在中央骰盘左侧直接显示白板指示牌，样式沿用4.3「定财神」。\"\"发牌、理牌和行牌期间，白板指示牌保持在左侧原位，直到本小局结束。该指示牌仅作界面展示，四张白板均按财神规则使用。\"位置\"局内流程 → 定财神\"。引文：\"指示牌为竖向小牌，粉色牌面，正面显示白板边框。直接以最终尺寸和位置显示。\"","problem":"中央白板财神指示牌现网不存在，属有意新增，但需求未按基准口径声明'与现网实现的差异'。","impact":"验收缺少差异声明依据，新增 UI 易被误判为'与现网不符'的缺陷。","suggestion":"补充差异说明条目：现网无财神指示牌，本期新增，样式与时机以本文档为准。","status":"待确认","has_detail":true,"acceptance":"需求文档含该新增项的差异声明，验收按需求而非现网对照。"},{"id":"Q23","title":"听牌标签\"爆/飘\"与\"胡牌牌+tips\"为现网不存在的新增","priority":"P3","type":"需求缺失","module":["手牌信息-听牌"],"dimension":"UI 交互","source_location":"手牌信息-听牌标签","rule_ref":"02#14 爆头/财飘在客户端无专门 UI 标签或控件，仅匹配场等待文案提及；需求文档若定义爆头/财飘标签需标注为新增需求（P3 差异说明）。","original_text":"位置\"局中信息 → 手牌信息 → 听牌标签\"。引文：\"杭州麻将特有：打出去后能够爆头的牌：爆\"\"打出去后能够财飘的牌：飘\"\"注：当听牌提示满足'爆'/'飘'中任意条件是，隐藏'多'/'优'/'大'\"。位置\"手牌信息 → 杭麻特殊听牌标签\"。引文：\"当玩家处于胡任何牌张的情况下（爆头，财飘），此时听牌提示不会显示具体的牌，而是直接显示一张'胡'的麻将牌，tips写：'摸任意一张牌可胡'\"","problem":"'爆/飘'标签与'胡牌牌+tips'提示在现网客户端均无对应控件，属新增 UI，需求未声明与现网实现的差异。","impact":"新增项无差异声明，验收对照口径混乱，易被误判为与现网不符。","suggestion":"补充差异说明：爆/飘标签、胡牌牌+tips 为本期新增，样式与触发条件以本文档为准。","status":"待确认","has_detail":true,"acceptance":"需求文档含新增听牌标签的差异声明。"},{"id":"Q24","title":"吃操作按钮 UI 为现网新增（42319 无吃入口），建议补差异说明","priority":"P3","type":"需求缺失","module":["吃碰杠胡-吃"],"dimension":"UI 交互","source_location":"吃碰杠胡操作-吃牌","rule_ref":"01#5 杭麻无吃操作界面入口（按钮未注册）、报听已移除（按钮空实现且强制隐藏）。","original_text":"位置\"局内流程 → 吃碰杠胡操作 → 吃牌\"。引文：\"玩家手牌右上方显示操作按钮：【吃】+【过】\"\"手牌中所有可吃牌高亮其他暗置，如果有胡则不需要暗置\"\"举例：上家出五条，手上有三条，四条，六条，七条。则这四张牌全部都要高亮\"","problem":"现网 42319 无吃操作入口（按钮未注册），需求的【吃】+【过】按钮组为新增 UI，未声明与现网差异；按钮样式、位置与多按钮并存排布也无现网参照，需在本文档内定义完整。","impact":"新增按钮无差异声明，对照现网验收会误判，按钮规格也可能不完整。","suggestion":"补充差异说明：吃操作按钮为新增功能（含按钮组样式/位置/并存排布的定义归属）。","status":"待确认","has_detail":true,"acceptance":"需求文档含吃按钮为新增功能的差异声明，按钮规格自洽完整。"},{"id":"Q25","title":"两种\"过\"按钮的语义（是否上报服务端）未区分","priority":"P3","type":"需求缺失","module":["吃碰杠胡"],"dimension":"UI 交互","source_location":"吃碰杠胡操作-各按钮","rule_ref":"01#6 两个过按钮分工：过（需发服务端）点击后 sendCancel 上行；过2（无需上报）点击仅本地收尾不发任何包。","original_text":"位置\"局内流程 → 吃碰杠胡操作（各按钮交互说明）\"。引文：\"点击【碰】按钮完成对应操作，点击【过】则放弃此次操作\"\"点击【吃】按钮完成对应操作，点击【过】则放弃此次操作\"\"自摸：点击【自摸】按钮完成对应操作，点击【过】则放弃此次操作。\"\"点炮、抢杠胡：点击【胡】按钮完成对应操作，点击【过】则放弃此次操作。\"","problem":"需求所有按钮组的【过】统一表述为'放弃此次操作'，未区分'需上报服务端'与'仅本地收尾'两种过，响应裁决的上行口径缺失。","impact":"上行协议不明确会导致服务端一直等待或提前放行，响应超时表现不一致。","suggestion":"按基准区分两种过：响应权限的过需上行 sendCancel，本地收尾的过不发任何包，并标注各按钮组适用哪种。","status":"待确认","has_detail":true,"acceptance":"每个【过】按钮的上报行为（发/不发）有唯一定义。"},{"id":"Q26","title":"权限按钮防连点与弹窗防抖规则未定义","priority":"P3","type":"需求缺失","module":["吃碰杠胡/听牌"],"dimension":"UI 交互","source_location":"吃碰杠胡操作","rule_ref":"01#11 每个权限按钮点击后有 0.5 秒防连点（touchable=false 后延迟恢复）；06#三 防抖规则：听牌弹窗重复点击切换关闭，大结算已显示则跳过（防重弹）。","original_text":"（需求文档无对应描述，位置：局内流程 → 吃碰杠胡操作 章节，各按钮交互说明均无防连点/防抖规则）","problem":"权限按钮连发上行、弹窗重复打开/重弹的防抖规则未定义；本期虽无查听弹窗，但操作按钮防连点属基础交互护栏。","impact":"连点导致重复上行/重复弹窗，服务端需处理无效请求，表现不可预期。","suggestion":"补写：每个权限按钮点击后 0.5 秒内不可再次触发；小结算/大结算等弹窗定义防重弹规则。","status":"待确认","has_detail":true,"acceptance":"快速连点任一权限按钮只产生一次有效上行，弹窗不重复弹出。"},{"id":"Q27","title":"道具类功能范围未明示（记牌器/预约洗牌/道具引导/小结算外围按钮）","priority":"P3","type":"需求缺失","module":["全局"],"dimension":"UI 交互","source_location":"全文","rule_ref":"02#12 长按桌面 0.3 秒且持有记牌器道具时弹出记牌器，松手关闭，点击牌数区域也可打开；03#13 小结算外围按钮：剩余牌按钮（有剩余牌墙才显示）、安全按钮（非匹配场）、洗牌按钮（盒内道具）、幸运按钮（自己赢且非最后一局）、按住半透明查看牌桌；05#17 倒计时进行中他人超 8 秒未操作时弹道具引导提醒层（仅他人）；08#12 预约条件：自己已胡 + 非最后一局 + 未预约 + 非复盘，当日首次显示带提示。","original_text":"（需求文档无对应描述，位置：全文无记牌器、预约洗牌、道具引导、小结算外围按钮内容；\"本期开发范围\"仅有范围声明引文：\"本期只做游戏内核心流程。原文中的创房面板、其他玩法选项、大结算和非核心桌面功能，如在核心段落中被引用，仅作原文上下文。\"）","problem":"记牌器、预约洗牌、道具引导提醒、小结算外围按钮（洗牌/幸运/剩余牌）等道具相关功能，需求未声明是否属于本期，也未声明排除。","impact":"范围外功能在开发中被随手实现或遗漏，验收范围无法界定。","suggestion":"在开发范围中逐项声明道具类功能做/不做（含小结算外围按钮与 8 秒道具引导），不做项移入差异说明附录。","status":"待确认","has_detail":true,"acceptance":"基准中每个道具相关交互在本期范围中均有'做/不做'结论。"},{"id":"Q28","title":"首出庄/闲提示条的表现形式模糊","priority":"P3","type":"定义歧义","module":["发牌"],"dimension":"UI 交互","source_location":"发牌-切入行牌","rule_ref":"01#22 首出提示：本局第一次出牌权限时显示庄/闲提示条（按自己是否庄家切文案）、隐藏骰子，仅显示一次；07#10 首出庄/闲提示：本局第一次出牌权限时显示提示条（按自己是否庄家切文案）+ 隐藏骰子，仅一次。","original_text":"位置\"局内流程 → 发牌 → 切入行牌\"。引文：\"理牌完成后，骰盘区域切换为庄家出牌倒计时。庄家收到优先出牌提示，闲家收到等待提示，首个操作阶段按4.5、4.6处理。\"另\"首打提示\"引文：\"理牌完成后，骰盘区域显示庄家出牌倒计时。庄家可开始操作，闲家等待。\"","problem":"'优先出牌提示/等待提示'未定义表现形式：提示条样式与位置、庄/闲文案内容、是否隐藏骰子、持续时长与'仅显示一次'的口径。","impact":"首局首次出牌前各家看到什么无标准，实现各自发挥，录屏对照无据。","suggestion":"定义提示条样式/位置/文案（庄、闲各一套）、显示时机（首次出牌权限时）、隐藏骰子与仅显示一次规则。","status":"待确认","has_detail":true,"acceptance":"首局首次出牌权限时提示条按身份显示正确文案且仅出现一次。"},{"id":"Q29","title":"倒计时音效未定义","priority":"P3","type":"需求缺失","module":["方位信息-倒计时"],"dimension":"UI 交互","source_location":"方位信息-倒计时","rule_ref":"01#20 倒计时：中央数字逐秒倒数，最后 3 秒切红色字体，自己回合且未自动胡时播倒计时音效，>999 不显示，复盘模式不显示；07#2 配色：>3 秒默认蓝色，最后 3 秒切红色字体，自己回合且未自动胡时播倒计时音效。","original_text":"位置\"局中信息 → 方位信息 → 倒计时\"。引文：\"中央用两位数字显示当前阶段剩余秒数，按秒递减，普通数字为蓝青色，03、02、01、00为黄色。阶段开始时按该阶段配置的时间起始秒数刷新\"（该条目无音效描述；\"发牌\"章节音效列仅有引文：\"待确认。发牌与理牌的音效资源及触发时点本方案不添加。\"）","problem":"基准在自己回合且未自动胡时播倒计时音效，需求倒计时条目无音效定义，也未像发牌音效那样显式声明'不添加'，做与不做悬空。","impact":"音效缺失或多余都会在验收时产生争议，且与 Q06 的末段变色结论联动（变色常伴音效）。","suggestion":"明确本期是否播倒计时音效（含触发条件：自己回合且未自动胡），不做则如发牌音效一样显式声明。","status":"待确认","has_detail":true,"acceptance":"倒计时音效在本期有'播/不播'的唯一结论。"},{"id":"Q30","title":"摸牌凑牌动画（凑成顺/刻/杠）未定义","priority":"P3","type":"需求缺失","module":["行牌操作-摸牌"],"dimension":"UI 交互","source_location":"行牌操作-摸牌","rule_ref":"08#10 常规摸牌：自己摸牌滑入动画 + 凑牌动画检查（凑成顺/刻/杠按花色播动画）；他人直接摆牌；牌墙消一张 + 剩余牌数更新。","original_text":"位置\"局内流程 → 行牌操作 → 摸牌\"。引文：\"牌墙中顺时针发牌，每次发1张，与一般手牌间隔4分之1牌距离。\"\"从手牌最右侧从上往下缓冲落下，1帧效果。\"位置\"行牌操作｜修改对比版 → 摸牌\"。引文：\"新牌正面从手牌右端上方快速落下，停在最右分隔位，落稳后与主体手牌同高，并留出间距。\"全文无凑牌动画描述。","problem":"摸到的牌与手牌凑成顺/刻/杠时按花色播凑牌动画的现网交互，需求完全未提及，保留与移除未声明。","impact":"玩家对已成型牌组的视觉反馈缺失，与现网对照会被误判为功能缺失。","suggestion":"声明凑牌动画做/不做；做则定义触发条件（凑成顺/刻/杠）与按花色区分的表现。","status":"待确认","has_detail":true,"acceptance":"摸牌凑成顺/刻/杠时桌面表现有唯一结论。"},{"id":"Q31","title":"离线解散预警（好友房离线超时处理）未定义","priority":"P3","type":"需求缺失","module":["玩家状态"],"dimension":"UI 交互","source_location":"玩家头像信息-玩家状态","rule_ref":"05#14 离线解散预警：玩家离线触发预警提示（好友房缺省 600 秒，房间配置可覆盖）。","original_text":"位置\"局中信息 → 玩家头像信息 → 玩家状态\"。引文：\"离线状态：头像处覆盖断线图标，且显示断线计时，格式为分秒'00:00'，每次断线重新计时\"\"备注：在当前动画播放过程中有玩家离线切后台等，不会因此中断原本的动画流程\"。全文无离线超时解散相关描述。","problem":"玩家离线达到阈值时是否触发解散预警、预警提示的样式与文案、阈值时长均未定义；需求只写了断线图标与计时表现。","impact":"好友房玩家长期离线时房间悬挂无出口，其余玩家无预期。","suggestion":"补写离线预警：触发阈值（如 600 秒）、提示层样式与文案、预警后的解散行为。","status":"待确认","has_detail":true,"acceptance":"玩家离线达到定义阈值时出现定义的预警提示。"},{"id":"Q32","title":"断线计时 1 小时封顶停表规则缺失","priority":"P3","type":"描述不完整","module":["玩家状态"],"dimension":"UI 交互","source_location":"玩家头像信息-玩家状态","rule_ref":"04#17 断线：头像覆盖断线图标 + 分秒计时（mm:ss，不足 10 补 0），满 1 小时封顶显示\"60:00\"停表；断线时长初值按断线时间戳计算。","original_text":"位置\"局中信息 → 玩家头像信息 → 玩家状态\"。引文：\"离线状态：头像处覆盖断线图标，且显示断线计时，格式为分秒'00:00'，每次断线重新计时\"","problem":"需求定义了格式（分秒）与重置（每次断线重新计时），但未定义满 1 小时封顶显示'60:00'停表，以及计时初值按断线时间戳计算（断线期间退出重进仍延续计时）的口径。","impact":"长时间离线计时无限增长，断线期间重进后计时表现未定义，与预期不符。","suggestion":"补写封顶停表（满 1 小时显示'60:00'不再增长）与计时初值按断线时间戳计算的规则。","status":"待确认","has_detail":true,"acceptance":"断线满 1 小时计时停在'60:00'，断线期间重进后计时延续而非归零。"},{"id":"Q33","title":"昵称截断\"超出第78个字符\"笔误（应为第 10 个）","priority":"P3","type":"逻辑错误","module":["玩家头像信息"],"dimension":"UI 交互","source_location":"玩家头像信息-玩家昵称","rule_ref":"08#3 开局面板：每家显示头像/昵称（截 10 字）/分数；spine 播放中面板挂骨骼挂点（按人数 2/3/4 挂不同挂点），面板淡出后发应答。","original_text":"位置\"局中信息 → 玩家头像信息 → 玩家昵称\"。引文：\"游戏中常显，最多显示10个字符（中文占2字符，英文/符号/数字占1字符），超出第78个字符显示'..'\"","problem":"前文'最多显示10个字符'与后文'超出第78个字符'矛盾，应为'超出第 10 个字符'的笔误，截断位置无法确定。","impact":"开发可能照'78'实现导致超长昵称不截断，或各端理解不一。","suggestion":"修正为'超出第 10 个字符显示..'，并确认省略号样式。","status":"待确认","has_detail":true,"acceptance":"超过 10 个字符宽度的昵称按规则截断并显示省略号。"},{"id":"Q34","title":"设置开关相关范围未定义（出牌方式/放大/牌墙/快出/特效）","priority":"P3","type":"描述不完整","module":["全局"],"dimension":"UI 交互","source_location":"行牌操作-出牌等","rule_ref":"01#12 出牌三种方式均为设置项控制（单击直接出需设置开启）；01#19 快出牌开关：房规或匹配场时出牌飞行动画时长由 0.15s 缩到 0.1s；07#8 牌墙显示开关按玩家设置；07#14 他人出牌放大展示（按座位），受设置开关控制，碰/杠/胡/流局/重置时统一隐藏。","original_text":"位置\"局内流程 → 行牌操作 → 出牌\"。引文：\"出牌共有双击出牌、单击出牌、滑动出牌三种，其中双击出牌和单机出牌互斥，滑动出牌不互斥。可根据设置开关：\"\"其他家：开启放大出牌（默认开）：出牌时放大展示，并打出放置于该玩家面前牌堆中，下一个玩家有操作行为后消失\"。位置\"行牌操作｜修改对比版 → 出牌\"。引文：\"本方案默认双击出牌。滑动出牌默认开。单击出牌归设置模块，本方案不包含该模式。\"\"关闭出牌放大时，实牌飞行、牌河落位和浮标照常显示。\"","problem":"出牌方式、出牌放大、牌墙显示、快出牌、显示特效在基准中均为设置项，需求多处写'可根据设置开关''默认开'，但设置入口、开关清单、默认值与本期范围均未定义（仅单击出牌声明'归设置模块，本方案不包含'）。","impact":"开关实现范围不明，开发遗漏或越界实现设置模块。","suggestion":"补一张本期设置开关清单：开关名、默认值、生效范围，明确哪些本期固定、哪些随设置模块后续版本。","status":"待确认","has_detail":true,"acceptance":"正文引用的每个'设置开关'在清单中有唯一条目与默认值。"},{"id":"Q35","title":"结算表现细节缺失（番型动画选取规则、超基础番型震动）","priority":"P3","type":"需求缺失","module":["结算流程"],"dimension":"UI 交互","source_location":"结算流程-流程明细","rule_ref":"03#9 番型动画番型选取：胡牌过程命令按升序取最小番型、局终命令按降序取最大番型（两处口径不同，需求需注意）；03#16 自己胡出超基础组合番型时手机震动一次（复盘不震）。","original_text":"位置\"三、对局流程 → 结算流程 → 流程明细\"。引文：\"触发操作：对局中有玩家胡牌，根据玩家的番型播放对应番型特效\"\"参考功夫川麻的胡牌流程即可\"。全文无震动与番型选取规则描述。","problem":"一手牌同时命中多个番型时动画播哪个未定义（基准中过程与局终两处口径都不一致）；自己胡出超基础组合番型时的手机震动反馈未定义。","impact":"番型动画选取不定则表现随机，震动反馈缺失影响高价值牌型的可感知性。","suggestion":"定义番型动画选取口径（最小/最大/按优先级）与震动触发条件（超基础组合番型、复盘不震）。","status":"待确认","has_detail":true,"acceptance":"复合番型局播出的动画番型可按定义口径复现，震动触发条件明确。"},{"id":"Q36","title":"局与局之间的界面重置清理未描述","priority":"P3","type":"需求缺失","module":["全局"],"dimension":"UI 交互","source_location":"对局开始-触发逻辑","rule_ref":"06#四.4 再来一局：统一重置事件驱动所有视图各自清理（清数据/按钮态归零/隐藏大牌出牌/停动画/关小结算弹窗）；06#四.7 游戏结束：隐藏听牌相关、清倒计时、清飘分。","original_text":"位置\"局内流程 → 对局开始 → 触发逻辑\"。引文：\"仅在开房后的首次开局播放「对局开始」动画。\"\"首次开局时，先等待云检测流程结束后再播放。\"\"常驻玩家信息区开始隐藏记为 T=0。以下时点均相对 T=0 计算。同一场内，后续小局直接进入摇骰发牌。\"","problem":"需求只写'后续小局直接进入摇骰发牌'，上一局遗留的浮标、出牌放大、听牌弹窗与箭头、倒计时与方位灯、飘分、按钮态、小结算弹窗如何清理未描述。","impact":"跨局状态残留是典型回归缺陷（如上一局浮标留到下一局），无清理定义则无法验收。","suggestion":"补写'下一局开始前的界面重置清单'：统一重置事件驱动各视图清理数据、按钮态、浮标、放大牌、听牌、倒计时、飘分与弹窗。","status":"待确认\n\n---","has_detail":true,"acceptance":"第 2 局起每局开始时桌面无上一局残留状态。"}],"overall_recommendations":[]}</script>
<script>
(function () {
  'use strict';
  var DATA = JSON.parse(document.getElementById('report-data').textContent);
  var PRI_COLOR = { P0: '#DC5148', P1: '#E8A044', P2: '#4389D5', P3: '#94A3B8' };
  var PRI_ORDER = { P0: 0, P1: 1, P2: 2, P3: 3 };
  var TYPE_COLOR = ['#3478DB', '#9A6FE0', '#DC5148', '#E8A044', '#94A3B8', '#4EC3B0'];
  var TYPE_DESC = {
    '需求缺失': '基准规则已定义，但需求文档缺失或未描述（MISSING）',
    '内容冲突': '需求文档内部两处描述互相矛盾（CONFLICT）',
    '逻辑错误': '与规则基准冲突或自身逻辑错误（LOGIC）',
    '定义歧义': '描述模糊，可多种理解（AMBIGUOUS）',
    '描述不完整': '描述不完整，无法实现或验收（INCOMPLETE）',
    '未分类': '源报告该条目仅登记在清单中，无详情块，未提供问题性质'
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function stripMd(s) { return String(s || '').replace(/\*\*/g, ''); }
  function priTag(p) { return '<span class="pri-tag" style="background:' + PRI_COLOR[p] + '">' + p + '</span>'; }
  function $(id) { return document.getElementById(id); }

  var byId = {};
  DATA.issues.forEach(function (it) { byId[it.id] = it; });

  // ---------- 01 头部 ----------
  (function () {
    var c = DATA.report.overall_conclusion || {};
    var badge = c.status === 'BLOCKED'
      ? '<span class="badge blocked">存在阻塞问题</span>'
      : c.status === 'ALLOWED'
        ? '<span class="badge allowed">可进入下一阶段</span>'
        : '<span class="badge na">检查完成</span>';
    var baselines = (DATA.report.rule_baselines || []).map(stripMd).join('；');
    $('sec-header').innerHTML =
      '<div><h1>' + esc(DATA.report.title || 'PRD 质量分析报告') + '</h1>' +
      '<div class="project">' + esc(DATA.report.project_name ? DATA.report.project_name + ' · ' + DATA.report.document_name : DATA.report.document_name) + '</div>' +
      '<div class="meta">' +
        '<span>检查对象：' + esc(DATA.report.source_file) + '</span>' +
        '<span>检查日期：' + esc(DATA.report.inspection_date) + '</span>' +
        (baselines ? '<span>检查基准：' + esc(baselines) + '</span>' : '') +
      '</div></div><div>' + badge + '</div>';
  })();

  // ---------- 02 KPI ----------
  (function () {
    var p = DATA.statistics.priority;
    var total = DATA.statistics.total;
    var p23 = (p.P2 || 0) + (p.P3 || 0);
    var cards = [
      { num: total, label: '问题总数', cls: '', filter: {} },
      { num: p.P0 || 0, label: 'P0 严重问题', cls: 'c-p0', filter: { priority: 'P0' } },
      { num: p.P1 || 0, label: 'P1 高优先级', cls: 'c-p1', filter: { priority: 'P1' } },
      { num: p23, label: 'P2 一般 + P3 建议', cls: 'c-p23', filter: { p23: true } }
    ];
    $('sec-kpis').innerHTML = cards.map(function (c) {
      return '<div class="kpi" data-filter=\'' + esc(JSON.stringify(c.filter)) + '\' role="button" tabindex="0">' +
        '<div class="num ' + c.cls + '">' + c.num + '</div><div class="label">' + esc(c.label) + '</div></div>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('.kpi'), function (el) {
      var go = function () {
        var f = JSON.parse(el.getAttribute('data-filter'));
        if (f.p23) { setFilter({ priority: ['P2', 'P3'] }); } else { setFilter(f); }
        scrollTo(0, $('sec-list').offsetTop - 12);
      };
      el.addEventListener('click', go);
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    });
  })();

  // ---------- 03 结论 ----------
  (function () {
    var c = DATA.report.overall_conclusion || {};
    if (!c.summary) { $('sec-conclusion').style.display = 'none'; return; }
    var reasons = (c.reasons || []).map(function (r) { return '<li>' + esc(stripMd(r)) + '</li>'; }).join('');
    $('sec-conclusion').innerHTML =
      '<div class="section-title">检查结论</div>' +
      '<div class="verdict ' + (c.status === 'BLOCKED' ? 'blocked' : c.status === 'ALLOWED' ? 'allowed' : '') + '">' +
        esc(stripMd(c.summary)) + '</div>' +
      (reasons ? '<ul class="reasons">' + reasons + '</ul>' : '');
  })();

  // ---------- 04 风险 ----------
  (function () {
    var groups = DATA.risk_groups || [];
    if (!groups.length) { $('sec-risks').style.display = 'none'; return; }
    $('sec-risks').innerHTML = '<div class="section-title">重点风险分析</div><div class="risk-cols">' +
      groups.map(function (g) {
        var items = g.issue_ids.map(function (id) {
          var it = byId[id]; if (!it) return '';
          return '<div class="risk-item" data-open="' + id + '">' + priTag(it.priority) +
            '<div class="body"><div class="name">' + esc(it.title) + '<span class="id">' + id + '</span></div>' +
            '<div class="desc">' + esc(stripMd(it.impact)) + '</div></div></div>';
        }).join('');
        return '<div class="risk-group"><h3>' + esc(g.name) + '<span class="id" style="color:var(--muted);font-weight:400;margin-left:8px">' +
          g.issue_ids.length + ' 项</span></h3>' + items + '</div>';
      }).join('') + '</div>';
  })();

  // ---------- 05 图表 ----------
  var typeKeys = Object.keys(DATA.statistics.types);
  (function () {
    var st = DATA.statistics, total = st.total;
    // A 优先级进度条
    var priRows = ['P0', 'P1', 'P2', 'P3'].filter(function (p) { return st.priority[p]; }).map(function (p) {
      var n = st.priority[p];
      return '<div class="bar-row" data-pri="' + p + '" title="点击按 ' + p + ' 筛选">' +
        '<span class="bl" style="color:' + PRI_COLOR[p] + '">' + p + '</span>' +
        '<span class="track"><span class="fill" style="width:' + (total ? (n / total * 100) : 0) + '%;background:' + PRI_COLOR[p] + '"></span></span>' +
        '<span class="val">' + n + ' · ' + (total ? (n / total * 100).toFixed(2) : 0) + '%</span></div>';
    }).join('');

    // B 类型环形图（SVG stroke-dasharray 分段）
    var R = 62, C = 2 * Math.PI * R, used = 0;
    var segs = typeKeys.map(function (t, i) {
      var n = st.types[t], len = total ? (n / total * C) : 0;
      var s = '<circle r="' + R + '" cx="80" cy="80" fill="none" stroke="' + TYPE_COLOR[i % TYPE_COLOR.length] +
        '" stroke-width="22" stroke-dasharray="' + Math.max(len - 2, 0) + ' ' + (C - Math.max(len - 2, 0)) +
        '" stroke-dashoffset="' + (-used) + '"></circle>';
      used += len;
      return s;
    }).join('');
    var legend = typeKeys.map(function (t, i) {
      var n = st.types[t];
      return '<div class="legend-item" data-type="' + esc(t) + '" title="' + esc(TYPE_DESC[t] || t) + '" style="cursor:help">' +
        '<span class="dot" style="background:' + TYPE_COLOR[i % TYPE_COLOR.length] + '"></span>' +
        '<span class="t">' + esc(t) + '</span><span class="v">' + n + ' · ' + (total ? (n / total * 100).toFixed(1) : 0) + '%</span></div>';
    }).join('');

    // C 模块柱状图
    var mods = (DATA.modules || []).slice().sort(function (a, b) { return b.issue_ids.length - a.issue_ids.length; });
    var maxMod = mods.length ? mods[0].issue_ids.length : 1;
    var modRows = mods.map(function (m) {
      return '<div class="bar-row" data-mod="' + esc(m.name) + '" title="重点模块集合（非全量互斥分类），点击筛选">' +
        '<span class="bl" style="width:auto;min-width:34px">' + esc(m.name) + '</span>' +
        '<span class="track"><span class="fill" style="width:' + (m.issue_ids.length / maxMod * 100) + '%;background:var(--primary)"></span></span>' +
        '<span class="val">' + m.issue_ids.length + ' 条</span></div>';
    }).join('') || '<div class="empty">无模块数据</div>';

    $('sec-charts').innerHTML =
      '<div class="chart"><h3>优先级分布</h3>' + priRows + '</div>' +
      '<div class="chart"><h3>问题类型分布</h3><div class="donut-wrap">' +
        '<div class="donut"><svg viewBox="0 0 160 160">' + segs + '</svg>' +
        '<div class="center"><b>' + total + '</b><span>问题总数</span></div></div>' +
        '<div class="legend">' + legend + '</div></div></div>' +
      '<div class="chart"><h3>重点业务模块分布</h3>' + modRows +
        '<div style="font-size:11px;color:var(--muted);margin-top:8px">注：来自报告总结的重点模块集合，非全部问题的互斥分类</div></div>';
  })();

  // ---------- 06 TOP5 ----------
  (function () {
    var feat = DATA.featured_issues || [];
    if (!feat.length) { $('sec-top').style.display = 'none'; return; }
    var finIds = ((DATA.risk_groups || []).find(function (g) { return g.key === 'financial'; }) || {}).issue_ids || [];
    $('sec-top').innerHTML = '<div class="section-title">重点问题 TOP ' + feat.length +
      '<span class="sub">排序依据：开发阻塞、资损风险、优先级</span></div><div class="top-list">' +
      feat.map(function (id, i) {
        var it = byId[id]; if (!it) return '';
        return '<div class="rank" data-open="' + id + '">' +
          '<span class="no">' + (i + 1) + '</span>' +
          priTag(it.priority) +
          '<span class="title"><span class="id">' + id + '</span>' + esc(it.title) + '</span>' +
          '<span class="tag">' + esc(it.type) +
          (finIds.indexOf(id) >= 0 ? '<span class="rf">资损风险</span>' : '') + '</span></div>';
      }).join('') + '</div>';
  })();

  // ---------- 08 综合分析 ----------
  (function () {
    var recs = DATA.overall_recommendations || [];
    if (!recs.length) { $('sec-analysis').style.display = 'none'; return; }
    $('sec-analysis').innerHTML = '<div class="section-title">综合分析与建议<span class="sub">保留报告原始结论</span></div><ul>' +
      recs.map(function (r) { return '<li>' + esc(stripMd(r)) + '</li>'; }).join('') + '</ul>';
  })();

  // ---------- 07 清单 + 筛选 ----------
  var filter = { priority: '', type: '', dimension: '', module: '', q: '' };
  // 类型/模块/维度下拉选项
  typeKeys.forEach(function (t) {
    var o = document.createElement('option'); o.value = t; o.textContent = t; $('f-type').appendChild(o);
  });
  Object.keys(DATA.statistics.dimensions || {}).forEach(function (d) {
    var o = document.createElement('option'); o.value = d; o.textContent = d + '（' + DATA.statistics.dimensions[d] + '）'; $('f-dimension').appendChild(o);
  });
  (DATA.modules || []).forEach(function (m) {
    var o = document.createElement('option'); o.value = m.name; o.textContent = m.name + '（' + m.issue_ids.length + '）'; $('f-module').appendChild(o);
  });

  function filtered() {
    var q = filter.q.trim().toLowerCase();
    var priList = Array.isArray(filter.priority) ? filter.priority : (filter.priority ? [filter.priority] : null);
    return DATA.issues.filter(function (it) {
      if (priList && priList.indexOf(it.priority) < 0) return false;
      if (filter.type && it.type !== filter.type) return false;
      if (filter.dimension && (it.dimension || '') !== filter.dimension) return false;
      if (filter.module && (it.module || []).indexOf(filter.module) < 0) return false;
      if (q && (it.id + ' ' + it.title + ' ' + it.source_location).toLowerCase().indexOf(q) < 0) return false;
      return true;
    }).sort(function (a, b) { return PRI_ORDER[a.priority] - PRI_ORDER[b.priority] || a.id.localeCompare(b.id); });
  }

  function renderList() {
    var list = filtered();
    $('issue-tbody').innerHTML = list.map(function (it) {
      return '<tr data-open="' + it.id + '"><td class="id">' + it.id + '</td><td class="title">' + esc(it.title) + '</td>' +
        '<td>' + priTag(it.priority) + '</td><td><span class="type-tag">' + esc(it.type) + '</span></td>' +
        '<td><span class="type-tag">' + esc(it.dimension || '功能规则') + '</span></td>' +
        '<td class="loc">' + esc(it.source_location) + '</td></tr>';
    }).join('');
    $('issue-empty').style.display = list.length ? 'none' : 'block';
    $('f-count').textContent = '当前显示 ' + list.length + ' / ' + DATA.statistics.total + ' 条';
    // 高亮当前筛选项
    document.querySelectorAll('.bar-row[data-pri], .legend-item[data-type], .bar-row[data-mod]').forEach(function (el) {
      var active = false;
      if (el.dataset.pri) active = (Array.isArray(filter.priority) ? filter.priority.join() : filter.priority) === el.dataset.pri
        || (Array.isArray(filter.priority) && filter.priority.length === 1 && filter.priority[0] === el.dataset.pri);
      if (el.dataset.type) active = filter.type === el.dataset.type;
      if (el.dataset.mod) active = filter.module === el.dataset.mod;
      el.classList.toggle('active', active);
    });
  }

  function setFilter(f) {
    filter.priority = f.priority !== undefined ? f.priority : '';
    filter.type = f.type !== undefined ? f.type : '';
    filter.module = f.module !== undefined ? f.module : '';
    $('f-priority').value = Array.isArray(filter.priority) ? '' : filter.priority;
    $('f-type').value = filter.type;
    $('f-module').value = filter.module;
    renderList();
  }

  $('f-priority').addEventListener('change', function () { filter.priority = this.value; renderList(); });
  $('f-type').addEventListener('change', function () { filter.type = this.value; renderList(); });
  $('f-dimension').addEventListener('change', function () { filter.dimension = this.value; renderList(); });
  $('f-module').addEventListener('change', function () { filter.module = this.value; renderList(); });
  $('f-q').addEventListener('input', function () { filter.q = this.value; renderList(); });
  $('btn-clear').addEventListener('click', function () {
    filter = { priority: '', type: '', dimension: '', module: '', q: '' };
    $('f-priority').value = ''; $('f-type').value = ''; $('f-dimension').value = ''; $('f-module').value = ''; $('f-q').value = '';
    renderList();
  });

  // 图表点击筛选（toggle）
  document.addEventListener('click', function (e) {
    var priEl = e.target.closest ? e.target.closest('.bar-row[data-pri]') : null;
    if (priEl) {
      filter.priority = (filter.priority === priEl.dataset.pri) ? '' : priEl.dataset.pri;
      $('f-priority').value = Array.isArray(filter.priority) ? '' : filter.priority;
      renderList(); return;
    }
    var typeEl = e.target.closest ? e.target.closest('.legend-item[data-type]') : null;
    if (typeEl) {
      filter.type = (filter.type === typeEl.dataset.type) ? '' : typeEl.dataset.type;
      $('f-type').value = filter.type; renderList(); return;
    }
    var modEl = e.target.closest ? e.target.closest('.bar-row[data-mod]') : null;
    if (modEl) {
      filter.module = (filter.module === modEl.dataset.mod) ? '' : modEl.dataset.mod;
      $('f-module').value = filter.module; renderList(); return;
    }
    var openEl = e.target.closest ? e.target.closest('[data-open]') : null;
    if (openEl) openDrawer(openEl.getAttribute('data-open'));
  });

  // ---------- 抽屉 ----------
  var curId = null;
  // 行内 Markdown：esc 后处理粗体（**x** -> strong）
  function inlineMd(s) {
    return esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }
  // 简易富文本渲染：**小节**： 行 -> 分块标题；逐行成段；连续 | 行组转表格
  function renderRich(text) {
    if (!text || !String(text).trim()) return '<p style="color:var(--muted)">（源报告清单条目，无详情块，未提供该字段内容）</p>';
    var html = [], tbl = [];
    function flush() {
      if (!tbl.length) return;
      var rows = tbl.filter(function (l) { return !/^\|[\s:|-]+\|?$/.test(l.trim()); });
      var trs = rows.map(function (row, ri) {
        var cells = row.replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); });
        var tag = ri === 0 ? 'th' : 'td';
        return '<tr>' + cells.map(function (c) { return '<' + tag + '>' + inlineMd(c) + '</' + tag + '>'; }).join('') + '</tr>';
      }).join('');
      html.push('<table class="mini-table">' + trs + '</table>');
      tbl = [];
    }
    String(text).split('\n').forEach(function (l) {
      var t = l.trim();
      if (t.startsWith('|')) { tbl.push(l); return; }
      flush();
      // **小节标题**： 单独成块（如「范例（需求必须按此格式写）：」）
      var h = t.match(/^\*\*([^*]+)\*\*([：:])?\s*$/);
      if (h) { html.push('<h5>' + esc(h[1]) + (h[2] || '') + '</h5>'); return; }
      if (t) html.push('<p>' + inlineMd(l) + '</p>');
    });
    flush();
    return html.length ? html.join('') : '<p style="color:var(--muted)">（源报告清单条目，无详情块，未提供该字段内容）</p>';
  }
  function openDrawer(id) {
    var it = byId[id]; if (!it) return;
    curId = id;
    $('d-pri').textContent = it.priority; $('d-pri').style.background = PRI_COLOR[it.priority] || '#94A3B8';
    $('d-id').textContent = id + ' · ' + it.type + (it.dimension ? ' · ' + it.dimension : '');
    $('d-title').textContent = it.title;
    // 详情体：有内容的节才渲染；无详情块条目问题分析兜底用清单问题列，避免整屏占位文案
    var bodyHtml = '<h4>原文位置</h4>' + renderRich(it.source_location);
    if (it.original_text && String(it.original_text).trim()) bodyHtml += '<h4>原文引用</h4><blockquote>' + esc(it.original_text) + '</blockquote>';
    bodyHtml += '<h4>问题分析</h4>' + renderRich(it.problem || it.title);
    if (it.impact && String(it.impact).trim()) bodyHtml += '<h4>影响说明</h4>' + renderRich(it.impact);
    if (it.suggestion && String(it.suggestion).trim()) bodyHtml += '<h4>修改建议</h4>' + renderRich(it.suggestion);
    if (it.rule_ref) bodyHtml += '<h4>基准依据</h4>' + renderRich(it.rule_ref);
    if (it.acceptance) bodyHtml += '<h4>验收口径</h4>' + renderRich(it.acceptance);
    if (!it.has_detail) bodyHtml += '<div class="status">清单级条目：源报告未展开详情块，问题描述摘自清单问题列，原文引用与建议待补</div>';
    $('d-body').innerHTML = bodyHtml +
      '<div class="status">处理状态：' + esc(it.status) + '（只读，Dashboard 不提供裁决操作）' +
      (it.module && it.module.length ? ' · 模块：' + esc(it.module.join('、')) : '') + '</div>';
    var list = filtered();
    var idx = list.findIndex(function (x) { return x.id === id; });
    $('d-pos').textContent = idx >= 0 ? (idx + 1) + ' / ' + list.length : '';
    $('d-prev').disabled = idx <= 0;
    $('d-next').disabled = idx >= 0 && idx >= list.length - 1;
    $('drawer').classList.add('show'); $('drawer').setAttribute('aria-hidden', 'false');
    $('mask').classList.add('show');
    $('d-body').scrollTop = 0;
  }
  function closeDrawer() {
    $('drawer').classList.remove('show'); $('drawer').setAttribute('aria-hidden', 'true');
    $('mask').classList.remove('show'); curId = null;
  }
  $('d-close').addEventListener('click', closeDrawer);
  $('mask').addEventListener('click', closeDrawer);
  $('d-prev').addEventListener('click', function () {
    var list = filtered(), i = list.findIndex(function (x) { return x.id === curId; });
    if (i > 0) openDrawer(list[i - 1].id);
  });
  $('d-next').addEventListener('click', function () {
    var list = filtered(), i = list.findIndex(function (x) { return x.id === curId; });
    if (i >= 0 && i < list.length - 1) openDrawer(list[i + 1].id);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeDrawer();
    if (!curId) return;
    if (e.key === 'ArrowLeft') $('d-prev').click();
    if (e.key === 'ArrowRight') $('d-next').click();
  });

  // ---------- 浮动操作 ----------
  $('btn-top').addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  $('btn-print').addEventListener('click', function () { window.print(); });

  renderList();
})();
</script>
</body>
</html>
